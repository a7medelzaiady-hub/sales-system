<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وحدة حملات واتساب - الزيادي لزيوت السيارات</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f4f7f6; }
        .main-card { border: none; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); background: #fff; }
        .btn-3d { border-bottom: 3px solid rgba(0,0,0,0.2); transition: all 0.1s; }
        .btn-3d:active { transform: translateY(2px); border-bottom-width: 1px; }
        .customer-selector-box { max-height: 300px; overflow-y: auto; border: 1px solid #dee2e6; border-radius: 10px; padding: 10px; background: #fafafa; }
    </style>
</head>
<body>

<div class="container-fluid py-4">
    <div class="row mb-4 align-items-center">
        <div class="col-md-6">
            <h3 class="fw-bold"><i class="fab fa-whatsapp text-success me-2"></i> حملات واتساب الذكية</h3>
        </div>
        <div class="col-md-6 text-md-end">
            <button class="btn btn-success btn-3d rounded-pill" onclick="openGroupModal('add')"><i class="fas fa-plus me-1"></i> مجموعة جديدة</button>
        </div>
    </div>

    <ul class="nav nav-pills mb-4 bg-white p-2 rounded-3 shadow-sm d-inline-flex" id="tabs" role="tablist">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#dashboard-pane">حملات اليوم</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#groups-pane" onclick="loadAllGroupsTable()">إدارة المجموعات</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#logs-pane" onclick="loadCampaignLogs()">سجل التنفيذ</button></li>
    </ul>

    <div class="tab-content">
        <div class="tab-pane fade show active" id="dashboard-pane">
            <div class="row g-3" id="todayGroupsContainer"></div>
        </div>
        <div class="tab-pane fade" id="groups-pane">
            <div class="main-card p-4">
                <table class="table table-hover text-center align-middle">
                    <thead class="table-light"><tr><th>اسم المجموعة</th><th>اليوم</th><th>الوقت</th><th>العملاء</th><th>تحكم</th></tr></thead>
                    <tbody id="groupsTableBody"></tbody>
                </table>
            </div>
        </div>
        <div class="tab-pane fade" id="logs-pane">
            <div class="main-card p-4">
                <table class="table table-hover text-center align-middle">
                    <thead class="table-dark"><tr><th>التاريخ</th><th>الحملة</th><th>المجموعة</th><th>العدد</th></tr></thead>
                    <tbody id="logsTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- المودالات (Modals) -->
<div class="modal fade" id="groupModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">بيانات المجموعة</h5></div><div class="modal-body">
    <input type="hidden" id="groupIdField">
    <input type="text" id="groupName" class="form-control mb-2" placeholder="اسم المجموعة">
    <select id="groupSendDay" class="form-select mb-2"><option>الأحد</option><option>الإثنين</option><option>الثلاثاء</option><option>الأربعاء</option><option>الخميس</option><option>الجمعة</option><option>السبت</option></select>
    <textarea id="groupDefaultMessage" class="form-control" placeholder="الرسالة... {الاسم}, {الرصيد}"></textarea>
</div><div class="modal-footer"><button class="btn btn-primary" onclick="saveGroupData()">حفظ</button></div></div></div></div>

<div class="modal fade" id="assignCustomersModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-body">
    <input type="hidden" id="assignGroupId">
    <div id="customerCheckboxContainer" class="customer-selector-box"></div>
</div><div class="modal-footer"><button class="btn btn-success" onclick="saveGroupCustomers()">تحديث العملاء</button></div></div></div></div>

<div class="modal fade" id="campaignPreviewModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-body">
    <div id="messageLivePreview" class="p-3 bg-light border mb-3"></div>
    <button class="btn btn-success w-100" onclick="initiateCampaignExecution()">بدء البث</button>
</div></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
    // تهيئة البيانات (تأكد من وجود متغير db الخاص بـ Firestore)
    let cachedCustomers = []; 
    let activeGroupCustomers = [];

    async function saveGroupData() {
        const id = document.getElementById("groupIdField").value;
        const payload = {
            name: document.getElementById("groupName").value,
            sendDay: document.getElementById("groupSendDay").value,
            defaultMessage: document.getElementById("groupDefaultMessage").value
        };
        // قم هنا بوضع الكود الخاص بـ db.collection("whatsapp_groups").add(payload)
        alert("تم الحفظ بنجاح");
        bootstrap.Modal.getInstance(document.getElementById('groupModal')).hide();
    }

    async function initiateCampaignExecution() {
        const groupId = document.getElementById("assignGroupId").value;
        // منطق التكرار على العملاء وفتح الرابط:
        // window.open(`https://api.whatsapp.com/send?phone=${phone}&text=${msg}`, '_blank');
        alert("جاري تشغيل الحملة...");
    }

    // دوال مساعدة إضافية يمكن إكمالها بناءً على الكود السابق
</script>
</body>
</html>
