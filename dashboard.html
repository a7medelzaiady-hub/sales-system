<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مطابقة الأرصدة - شركة الزيادي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0b5e3d; /* اللون الأخضر الأساسي للهيدر */
            --gold: #b6892f;   /* اللون الذهبي للحواف */
            --bg: #f4f7f6;
            --text-dark: #1b2e26;
            --text-muted: #6c757d;
        }

        body { background: var(--bg); font-family: 'Cairo', sans-serif; color: var(--text-dark); padding-bottom: 30px; }

        /* الهيدر الأخضر */
        header {
            background: var(--primary);
            padding: 25px 20px;
            color: white;
            border-bottom-left-radius: 25px;
            border-bottom-right-radius: 25px;
            text-align: center;
        }
        .header-top { display: flex; align-items: center; justify-content: space-between; }
        .back-btn { color: white; text-decoration: none; font-size: 1.2rem; }
        header h1 { font-size: 1.1rem; font-weight: 800; margin: 0; }
        header p { font-size: 0.75rem; opacity: 0.9; margin-top: 5px; }

        /* الكارت العلوي */
        .main-summary {
            background: white;
            border-radius: 20px;
            margin: -20px 15px 20px 15px;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .summary-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px dashed #eee; }
        .summary-row:last-child { border: none; }
        .label { font-size: 0.8rem; font-weight: 700; color: #555; }
        .val { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 0.95rem; }

        /* زر الحفظ */
        .btn-save {
            background: var(--primary);
            color: white;
            width: calc(100% - 30px);
            margin: 0 15px 20px;
            padding: 12px;
            border-radius: 15px;
            border: none;
            font-weight: 800;
            font-size: 0.9rem;
            cursor: pointer;
        }

        /* كروت الحسابات */
        .account-card {
            background: white;
            border-radius: 15px;
            margin: 0 15px 15px 15px;
            padding: 15px;
            border-right: 5px solid var(--gold); /* الحافة الذهبية */
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }
        .card-title { font-weight: 800; font-size: 0.85rem; margin-bottom: 10px; }
        .balance-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .box { background: #f9f9f9; padding: 8px; border-radius: 10px; text-align: center; }
        .box-label { font-size: 0.65rem; color: #888; display: block; }
        .box-val { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 0.85rem; }
        
        .input-manual { width: 100%; border: 1px solid #ddd; border-radius: 6px; padding: 5px; text-align: center; font-weight: 700; }
        
        .status-bar {
            margin-top: 10px;
            text-align: center;
            font-weight: 700;
            font-size: 0.75rem;
            padding: 5px;
            border-radius: 8px;
            background: #f0fdf4;
            color: #16a34a;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <a href="index1.html" class="back-btn"><i class="fas fa-arrow-right"></i></a>
            <div>
                <h1>شركة الزيادي لزيوت السيارات</h1>
                <p>مطابقة أرصدة أول المدة والأرصدة الحالية</p>
            </div>
            <div style="width: 20px;"></div>
        </div>
    </header>

    <div class="main-summary">
        <!-- هنا سيتم عرض الملخص المالي -->
        <div class="summary-row">
            <span class="label">صافي ثروة أول المدة:</span>
            <span class="val" id="netInitial">0.00 ج.م</span>
        </div>
        <div class="summary-row">
            <span class="label">المركز المالي الحالي:</span>
            <span class="val" id="netActual">0.00 ج.م</span>
        </div>
    </div>

    <button class="btn-save" onclick="saveInitialBalances()">حفظ وتطبيق الأرصدة الجديدة</button>

    <div id="cardsArea">
        <!-- كارت مثال للصندوق -->
        <div class="account-card cash">
            <div class="card-title">نقدية الصندوق والدرج</div>
            <div class="balance-grid">
                <div class="box">
                    <span class="box-label">رصيد أول المدة</span>
                    <input type="number" id="initCash" class="input-manual" placeholder="0.00">
                </div>
                <div class="box">
                    <span class="box-label">الرصيد الفعلي</span>
                    <span class="box-val" id="currCash">0.00</span>
                </div>
            </div>
            <div class="status-bar">متطابق تماماً</div>
        </div>
    </div>

    <script type="module">
        // (نفس منطق الربط والعمليات الحسابية المعتمدة سابقاً)
        // ... (تم اختصار الكود هنا للتوضيح، استمر باستخدام المنطق السابق للربط بـ Firebase)
    </script>
</body>
</html>
