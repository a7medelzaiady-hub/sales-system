<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام الزيادي المالي المتطور</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #090e0b; --surface: #121814; --surface2: #1a221d; --border: #252f28;
  --text: #e0e8e4; --text-muted: #8ca095;
  --green: #10b981; --red: #ef4444; --gold: #f59e0b; --blue: #3b82f6;
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); font-family: 'Cairo', sans-serif; color: var(--text); min-height: 100vh; }

/* LAYOUT */
.sidebar { position: fixed; right: 0; top: 0; width: 240px; height: 100vh; background: var(--surface); border-left: 1px solid var(--border); z-index: 100; padding: 20px; }
.main { margin-right: 240px; min-height: 100vh; display: flex; flex-direction: column; }
.topbar { height: 60px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 24px; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
.content { padding: 24px; }

/* CARDS & TABLES */
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
.table-wrapper { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 20px; }
.data-table { width: 100%; border-collapse: separate; border-spacing: 0 8px; padding: 0 16px; }
.data-table th { color: var(--text-muted); font-size: 0.75rem; text-align: right; padding: 12px; }
.data-table td { background: var(--surface2); padding: 16px; font-size: 0.85rem; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.data-table td:first-child { border-right: 1px solid var(--border); border-radius: 0 8px 8px 0; }
.data-table td:last-child { border-left: 1px solid var(--border); border-radius: 8px 0 0 8px; }

/* UI ELEMENTS */
.view { display: none; } .view.active { display: block; }
.badge { padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 700; }
.bg { background: rgba(16,185,129,0.1); color: var(--green); }
.br { background: rgba(239,68,68,0.1); color: var(--red); }

.spinning { animation: spin 1s linear infinite; }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

.nav-item { padding: 12px; cursor: pointer; color: var(--text-muted); transition: 0.2s; border-radius: 8px; font-size: 0.9rem; }
.nav-item:hover, .nav-item.active { background: var(--surface2); color: var(--text); }
</style>
</head>
<body>

<nav class="sidebar">
  <div style="font-weight:900; font-size:1.2rem; margin-bottom:30px; color:var(--green)">نظام الزيادي</div>
  <div class="nav-item active" onclick="showView('dashboard', this)">لوحة التحكم</div>
  <div class="nav-item" onclick="showView('sales', this)">المبيعات</div>
  <div class="nav-item" onclick="showView('purchases', this)">المشتريات</div>
  <div class="nav-item" onclick="showView('expenses', this)">المصاريف</div>
</nav>

<div class="main">
  <div class="topbar">
    <div id="viewTitle" style="font-weight:800">لوحة التحكم</div>
    <button id="refreshBtn" onclick="loadAllData()" style="background:var(--surface2); border:none; padding:8px 16px; border-radius:8px; color:var(--text); cursor:pointer">
      <i class="fas fa-sync-alt"></i> تحديث البيانات
    </button>
  </div>

  <div class="content">
    <div class="view active" id="view-dashboard">
      <div class="kpi-grid">
        <div class="card"><div style="color:var(--text-muted); font-size:0.8rem">التدفق النقدي (المبيعات)</div><div id="k-sales" style="font-size:1.5rem; font-weight:900">...</div></div>
        <div class="card"><div style="color:var(--text-muted); font-size:0.8rem">المشتريات</div><div id="k-pur" style="font-size:1.5rem; font-weight:900">...</div></div>
        <div class="card"><div style="color:var(--text-muted); font-size:0.8rem">المصاريف</div><div id="k-exp" style="font-size:1.5rem; font-weight:900">...</div></div>
        <div class="card"><div style="color:var(--text-muted); font-size:0.8rem">صافي التدفق النقدي</div><div id="k-net" style="font-size:1.5rem; font-weight:900">...</div></div>
      </div>
      
      <div class="table-wrapper">
        <table class="data-table" id="recentTable">
          <thead><tr><th>النوع</th><th>المبلغ</th><th>التاريخ</th></tr></thead>
          <tbody><tr><td colspan="3" style="text-align:center">جاري تحميل البيانات...</td></tr></tbody>
        </table>
      </div>
    </div>
    
    <div class="view" id="view-sales"><h1>المبيعات</h1><div id="salesList"></div></div>
    <div class="view" id="view-purchases"><h1>المشتريات</h1><div id="purList"></div></div>
    <div class="view" id="view-expenses"><h1>المصاريف</h1><div id="expList"></div></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
  authDomain:"ahmedelzaiady.firebaseapp.com",
  projectId:"ahmedelzaiady",
  storageBucket:"ahmedelzaiady.firebasestorage.app",
  messagingSenderId:"300306825071",
  appId:"1:300306825071:web:0426ddde56280fa090329a"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const fmt = v => Number(v || 0).toLocaleString('ar-EG', { minimumFractionDigits: 2 }) + ' ج.م';

window.showView = function(view, el) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('view-' + view).classList.add('active');
  el.classList.add('active');
  document.getElementById('viewTitle').textContent = el.textContent;
};

window.loadAllData = async function() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');

  try {
    const [inv, pur, exp] = await Promise.all([
      getDocs(collection(db, 'invoices')),
      getDocs(collection(db, 'supplier_transactions')),
      getDocs(collection(db, 'expenses'))
    ]);

    let s = 0, p = 0, e = 0;
    let recent = [];

    inv.forEach(d => { const v = Number(d.data().total || 0); s += v; recent.push({t:'بيع', val:v, d:new Date()}); });
    pur.forEach(d => { const v = Number(d.data().grossTotal || 0); p += v; recent.push({t:'شراء', val:v, d:new Date()}); });
    exp.forEach(d => { const v = Number(d.data().amount || 0); e += v; recent.push({t:'مصروف', val:v, d:new Date()}); });

    document.getElementById('k-sales').textContent = fmt(s);
    document.getElementById('k-pur').textContent = fmt(p);
    document.getElementById('k-exp').textContent = fmt(e);
    
    const net = s - p - e;
    const netEl = document.getElementById('k-net');
    netEl.textContent = fmt(net);
    netEl.style.color = net >= 0 ? 'var(--green)' : 'var(--red)';

    // Update table
    const tbody = document.querySelector('#recentTable tbody');
    tbody.innerHTML = recent.slice(0, 5).map(r => `
      <tr>
        <td><span class="badge ${r.t=='بيع'?'bg':'br'}">${r.t}</span></td>
        <td style="font-weight:700">${fmt(r.val)}</td>
        <td style="color:var(--text-muted)">اليوم</td>
      </tr>`).join('');

  } catch (err) {
    alert("خطأ في الاتصال بقاعدة البيانات");
  } finally {
    btn.classList.remove('spinning');
  }
};

loadAllData();
</script>
</body>
</html>
