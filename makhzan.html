<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الأصناف والمخزون | شركة الزيادي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-green: #0b6641; 
            --accent-green: #10b981;
            --bg-light: #f8fafc;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --danger: #f43f5e;
            --danger-bg: #fff1f2;
        }

        body { 
            background-color: var(--bg-light); 
            font-family: 'Cairo', sans-serif; 
            color: var(--text-dark);
            margin: 0;
            padding-bottom: 90px;
        }

        .top-nav {
            background: linear-gradient(135deg, var(--primary-green), #0a5234);
            color: white;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-radius: 0 0 25px 25px;
            box-shadow: 0 4px 15px rgba(11, 102, 65, 0.15);
        }

        .top-nav i { cursor: pointer; font-size: 1.2rem; transition: 0.2s; }

        .search-section {
            padding: 20px;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .search-wrapper { position: relative; flex-grow: 1; }
        .search-wrapper i {
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
            color: var(--primary-green);
        }
        .search-input {
            width: 100%; padding: 14px 40px 14px 15px; background: white;
            border: 1px solid var(--border-color); border-radius: 15px;
            font-size: 0.95rem; outline: none; transition: 0.2s;
        }
        
        .grid-layout {
            display: grid;
            grid-template-columns: 2fr 1fr 0.6fr 0.6fr;
            gap: 10px;
            align-items: center;
        }

        .table-headers {
            padding: 0 25px 10px 25px; font-size: 0.8rem; font-weight: 700;
            color: var(--text-muted); text-transform: uppercase;
        }
        .table-headers div { text-align: center; }
        .table-headers div:first-child { text-align: right; }

        .item-card {
            padding: 16px 20px; background: white; border-radius: 20px;
            margin: 0 15px 12px; transition: all 0.2s ease; cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.01);
        }
        .item-card:active { transform: scale(0.98); background: #f8f9fa; }
        
        .item-name { font-weight: 800; font-size: 0.95rem; margin-bottom: 3px; color: var(--text-dark); }
        .item-barcode { font-size: 0.75rem; color: var(--text-muted); }
        .item-price { text-align: center; color: var(--primary-green); font-weight: 800; font-size: 1.05rem; }

        .qty-badge {
            background: #f0fdf4; color: var(--primary-green); padding: 5px 0;
            border-radius: 10px; font-weight: 700; font-size: 0.9rem;
            text-align: center; width: 100%; display: inline-block; border: 1px solid #dcfce7;
        }
        .qty-low { background: var(--danger-bg); color: var(--danger); border-color: #ffe4e6; }
        .qty-zero { background: #f1f5f9; color: var(--text-muted); border-color: var(--border-color); }

        .bottom-summary {
            position: fixed; bottom: 0; width: 100%; background: white;
            padding: 18px 20px; font-weight: 800; font-size: 0.95rem;
            display: flex; justify-content: center; border-top: 1px solid var(--border-color);
            color: var(--primary-green); box-shadow: 0 -4px 15px rgba(0,0,0,0.03); z-index: 999;
        }

        .fab {
            position: fixed; bottom: 80px; right: 20px; background: var(--primary-green);
            color: white; width: 60px; height: 60px; border-radius: 20px; display: flex;
            align-items: center; justify-content: center; font-size: 1.6rem;
            box-shadow: 0 8px 25px rgba(11, 102, 65, 0.4); text-decoration: none; z-index: 1000;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px); z-index: 1050; display: none; align-items: center; justify-content: center; padding: 16px;
        }
        .modal-card {
            background: white; width: 100%; max-width: 500px; border-radius: 20px; overflow: hidden;
            display: flex; flex-direction: column; max-height: 80vh;
        }
        .modal-header { background: var(--primary-green); color: white; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 16px; overflow-y: auto; background: #f8fafc; }
        .history-item { background: white; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
    </style>
</head>
<body>

<div class="top-nav">
    <i class="fas fa-sync-alt" onclick="location.reload()"></i>
    <span class="fw-bold">الأصناف والمخزون</span>
    <i class="fas fa-chevron-left" onclick="history.back()"></i>
</div>

<div class="search-section">
    <div class="search-wrapper">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن منتج أو باركود..." oninput="renderItems()">
    </div>
</div>

<div class="table-headers grid-layout">
    <div>المنتج والباركود</div>
    <div>السعر</div>
    <div>كرتونة</div>
    <div>جركن</div>
</div>

<div id="itemsContainer"></div>

<div class="bottom-summary">
    <i class="fas fa-boxes me-2"></i> إجمالي الأصناف: <span id="totalCount" class="ms-2">0</span>
</div>

<a href="add-product.html" class="fab" aria-label="إضافة منتج"><i class="fas fa-plus"></i></a>

<!-- Modal تفاصيل سجل الحركات والمشتريات -->
<div class="modal-overlay" id="historyModal" onclick="closeModal()">
    <div class="modal-card" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h6 class="m-0 fw-bold" id="modalTitle">حركة الصنف</h6>
            <i class="fas fa-times cursor-pointer" onclick="closeModal()"></i>
        </div>
        <div class="modal-body" id="modalBody"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
      authDomain: "ahmedelzaiady.firebaseapp.com",
      projectId: "ahmedelzaiady",
      storageBucket: "ahmedelzaiady.firebasestorage.app",
      messagingSenderId: "300306825071",
      appId: "1:300306825071:web:0426ddde56280fa090329a",
      measurementId: "G-WE04GK5XZZ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let allData = [];

    onSnapshot(collection(db, "inventory"), (snap) => {
        allData = [];
        snap.forEach(doc => {
            const data = doc.data();
            if (!data.isDeleted) {
                allData.push({ id: doc.id, ...data });
            }
        });
        renderItems();
    });

    window.renderItems = function() {
        const term = document.getElementById('searchInput').value.toLowerCase().trim();
        const container = document.getElementById('itemsContainer');
        
        let filtered = allData.filter(i => 
            (i.name && i.name.toLowerCase().includes(term)) || 
            (i.barcode && i.barcode.includes(term))
        );

        let html = '';
        filtered.forEach(item => {
            const factor = Number(item.unitFactor) || 1; 
            const total = Number(item.totalPcs !== undefined && item.totalPcs !== null ? item.totalPcs : (item.qty || 0));
            
            const cartons = Math.floor(total / factor);
            const jerrycans = total % factor;

            const isZero = total <= 0;
            const minAllowed = (Number(item.min) || 0) * factor;
            const isLow = !isZero && (total <= minAllowed);

            let badgeClass = 'qty-badge';
            if (isZero) badgeClass += ' qty-zero';
            else if (isLow) badgeClass += ' qty-low';

            const safeName = (item.name || '').replace(/'/g, "\\'");

            html += `
                <div class="item-card grid-layout ${isZero ? 'out-of-stock' : ''}" onclick="showHistory('${item.id}', '${safeName}')">
                    <div class="item-info">
                        <div class="item-name">${item.name}</div>
                        <div class="item-barcode">باركود: ${item.barcode || '---'}</div>
                    </div>
                    <div class="item-price">
                        ${Number(item.sell || 0).toLocaleString('en-US', {minimumFractionDigits: 2})}
                    </div>
                    <div><div class="${badgeClass}">${cartons}</div></div>
                    <div><div class="${badgeClass}">${jerrycans}</div></div>
                </div>
            `;
        });

        container.innerHTML = html;
        document.getElementById('totalCount').innerText = filtered.length;
    };

    window.showHistory = async function(id, name) {
        document.getElementById('modalTitle').innerText = `سجل حركات: ${name}`;
        const body = document.getElementById('modalBody');
        body.innerHTML = '<div class="text-center py-3"><i class="fas fa-spinner fa-spin me-2"></i>جاري تحليل الفواتير...</div>';
        document.getElementById('historyModal').style.display = 'flex';

        let purchases = 0, sales = 0, returns = 0;
        let listHtml = '';

        // 1. جلب فواتير التوريد من supplier_transactions
        const supSnap = await getDocs(collection(db, "supplier_transactions"));
        supSnap.forEach(d => {
            const data = d.data();
            data.items?.forEach(i => {
                if (i.stockId === id || i.name === name) {
                    const pcs = Number(i.totalPieces || (i.qty * (i.unitFactor || 1))) || 0;
                    purchases += pcs;
                    listHtml += `<div class="history-item"><span class="badge bg-primary">وارد/شراء</span> <span>${pcs} قطعة</span> <span>${data.date || '---'}</span></div>`;
                }
            });
        });

        // 2. جلب فواتير المبيعات من invoices
        const invSnap = await getDocs(collection(db, "invoices"));
        invSnap.forEach(d => {
            const data = d.data();
            data.items?.forEach(i => {
                if (i.stockId === id || i.name === name) {
                    const pcs = Number(i.totalPieces || i.qty) || 0;
                    if (i.isReturn) {
                        returns += pcs;
                        listHtml += `<div class="history-item"><span class="badge bg-warning text-dark">مرتجع</span> <span>+${pcs} قطعة</span> <span>${data.time || '---'}</span></div>`;
                    } else {
                        sales += pcs;
                        listHtml += `<div class="history-item"><span class="badge bg-success">بيع</span> <span>-${pcs} قطعة</span> <span>${data.time || '---'}</span></div>`;
                    }
                }
            });
        });

        body.innerHTML = `
            <div class="row text-center g-2 mb-3">
                <div class="col-4"><div class="p-2 bg-white rounded border"><b>+${purchases}</b><br><small class="text-muted">مشتريات</small></div></div>
                <div class="col-4"><div class="p-2 bg-white rounded border"><b>-${sales}</b><br><small class="text-muted">مبيعات</small></div></div>
                <div class="col-4"><div class="p-2 bg-white rounded border"><b>+${returns}</b><br><small class="text-muted">مرتجعات</small></div></div>
            </div>
            <div class="fw-bold mb-2">تفاصيل الفواتير:</div>
            ${listHtml || '<div class="text-center text-muted">لا توجد حركات تسوق مسجلة</div>'}
        `;
    };

    window.closeModal = function() {
        document.getElementById('historyModal').style.display = 'none';
    };
</script>
</body>
</html>
