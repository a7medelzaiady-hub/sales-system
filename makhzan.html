<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المخزن - شركة الزيادي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-green: #0b6641; 
            --accent-green: #10b981;
            --bg-light: #f8fafc;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --danger: #f43f5e;
            --danger-bg: #fff1f2;
        }
        body { background-color: var(--bg-light); font-family: 'Cairo', sans-serif; color: var(--text-dark); margin: 0; padding-bottom: 90px; }
        .top-nav { background: linear-gradient(135deg, var(--primary-green), #0a5234); color: white; padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1000; border-radius: 0 0 25px 25px; box-shadow: 0 4px 15px rgba(11, 102, 65, 0.15); }
        .top-nav i { cursor: pointer; font-size: 1.2rem; }
        .search-section { padding: 20px; display: flex; gap: 12px; align-items: center; margin-top: -5px; }
        .search-wrapper { position: relative; flex-grow: 1; }
        .search-wrapper i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--primary-green); }
        .search-input { width: 100%; padding: 14px 40px 14px 15px; background: white; border: 1px solid var(--border-color); border-radius: 15px; font-size: 0.95rem; outline: none; }
        .qr-btn { background: white; color: var(--primary-green); border: 1px solid var(--border-color); width: 52px; height: 52px; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; cursor: pointer; }
        .grid-layout { display: grid; grid-template-columns: 2fr 1fr 0.6fr 0.6fr; gap: 10px; align-items: center; }
        .table-headers { padding: 0 25px 10px 25px; font-size: 0.8rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
        .table-headers div { text-align: center; }
        .table-headers div:first-child { text-align: right; }
        .item-card { padding: 16px 20px; background: white; border-radius: 20px; margin: 0 15px 12px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.01); }
        .item-card.out-of-stock { opacity: 0.6; background: #fdfdfd; }
        .item-name { font-weight: 800; font-size: 0.95rem; margin-bottom: 3px; color: var(--text-dark); }
        .item-barcode { font-size: 0.75rem; color: var(--text-muted); }
        .item-price { text-align: center; color: var(--primary-green); font-weight: 800; font-size: 1.05rem; }
        .qty-badge { background: #f0fdf4; color: var(--primary-green); padding: 5px 0; border-radius: 10px; font-weight: 700; font-size: 0.9rem; text-align: center; width: 100%; display: inline-block; border: 1px solid #dcfce7; }
        .qty-low { background: var(--danger-bg); color: var(--danger); border-color: #ffe4e6; }
        .qty-zero { background: #f1f5f9; color: var(--text-muted); border-color: var(--border-color); }
        .bottom-summary { position: fixed; bottom: 0; width: 100%; background: white; padding: 18px 20px; font-weight: 800; font-size: 0.95rem; display: flex; justify-content: center; border-top: 1px solid var(--border-color); color: var(--primary-green); z-index: 999; }
        .fab { position: fixed; bottom: 80px; right: 20px; background: var(--primary-green); color: white; width: 60px; height: 60px; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; text-decoration: none; z-index: 1000; }
    </style>
</head>
<body>

<div class="top-nav">
    <i class="fas fa-sync-alt" onclick="location.reload()"></i>
    <span class="fw-bold">الأصناف والمخزون</span>
    <i class="fas fa-chevron-left" onclick="history.back()"></i>
</div>

<div class="search-section">
    <button class="qr-btn" aria-label="مسح الباركود"><i class="fas fa-qrcode"></i></button>
    <div class="search-wrapper">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن منتج أو باركود..." oninput="renderItems()">
    </div>
</div>

<div class="table-headers grid-layout">
    <div>المنتج والباركود</div>
    <div>السعر</div>
    <div>كرتونة</div>
    <div>جركن</div>
</div>

<div id="itemsContainer">
    <div class="text-center py-5 fw-bold text-muted">
        <div class="spinner-border spinner-border-sm me-2"></div>
        جاري جلب بيانات المخزون...
    </div>
</div>

<div class="bottom-summary">
    <i class="fas fa-boxes me-2"></i> إجمالي الأصناف: <span id="totalCount" class="ms-2">0</span>
</div>

<a href="add-product.html" class="fab" aria-label="إضافة منتج">
    <i class="fas fa-plus"></i>
</a>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
      authDomain: "ahmedelzaiady.firebaseapp.com",
      projectId: "ahmedelzaiady",
      storageBucket: "ahmedelzaiady.firebasestorage.app",
      messagingSenderId: "300306825071",
      appId: "1:300306825071:web:0426ddde56280fa090329a",
      measurementId: "G-WE04GK5XZZ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let allData = [];

    function getFactor(data) {
        const name = (data.name || "").toLowerCase();
        if (name.includes("شحم") || name.includes("صفيحه") || name.includes("صفيحة")) return 1;
        let f = Number(data.unitFactor);
        return f > 1 ? f : 12;
    }

    async function fetchInventoryData() {
        try {
            const invSnap = await getDocs(collection(db, "inventory"));
            allData = [];

            invSnap.forEach(docSnap => {
                const data = docSnap.data();
                if (data.isDeleted) return;

                const factor = getFactor(data);
                let totalPcs = parseFloat(data.totalPcs ?? data.qty ?? 0);

                let cartons = 0;
                let jerrycans = 0;

                if (factor > 1) {
                    const absPcs = Math.abs(totalPcs);
                    const sign = totalPcs < 0 ? -1 : 1;
                    cartons = Math.floor(absPcs / factor) * sign;
                    jerrycans = Math.round((absPcs % factor) * 100) / 100 * sign;
                } else {
                    cartons = 0;
                    jerrycans = totalPcs;
                }

                allData.push({
                    id: docSnap.id,
                    ...data,
                    unitFactor: factor,
                    realTotalPcs: totalPcs,
                    displayCartons: cartons,
                    displayJerrycans: jerrycans
                });
            });

            renderItems();
        } catch (e) {
            console.error(e);
        }
    }

    window.renderItems = function() {
        const term = document.getElementById('searchInput').value.toLowerCase().trim();
        const container = document.getElementById('itemsContainer');
        
        let filtered = allData.filter(i => 
            (i.name && i.name.toLowerCase().includes(term)) || 
            (i.barcode && i.barcode.includes(term))
        );

        let html = '';
        filtered.forEach(item => {
            const totalPcs = Number(item.realTotalPcs) || 0;
            const isZero = totalPcs === 0;
            const isLow = !isZero && (totalPcs <= ((Number(item.min) || 0) * item.unitFactor));

            let badgeClass = 'qty-badge' + (isZero ? ' qty-zero' : (isLow ? ' qty-low' : ''));

            html += `
                <div class="item-card grid-layout ${isZero ? 'out-of-stock' : ''}" onclick="goToDetails('${item.id}')">
                    <div class="item-info">
                        <div class="item-name">${item.name}</div>
                        <div class="item-barcode">باركود: ${item.barcode || '---'}</div>
                    </div>
                    <div class="item-price">${Number(item.sell || 0).toLocaleString('en-US', {minimumFractionDigits: 2})}</div>
                    <div><div class="${badgeClass}">${item.displayCartons}</div></div>
                    <div><div class="${badgeClass}">${item.displayJerrycans}</div></div>
                </div>
            `;
        });

        container.innerHTML = html;
        document.getElementById('totalCount').innerText = filtered.length;
    };

    window.goToDetails = function(id) { window.location.href = `product-details.html?id=${id}`; };

    fetchInventoryData();
</script>

</body>
</html>
