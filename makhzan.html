<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المخزن - شركة الزيادي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-green: #0b6641; 
            --accent-green: #10b981;
            --bg-light: #f8fafc;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --danger: #f43f5e;
            --danger-bg: #fff1f2;
        }

        body { 
            background-color: var(--bg-light); 
            font-family: 'Cairo', sans-serif; 
            color: var(--text-dark);
            margin: 0;
            padding-bottom: 90px;
        }

        .top-nav {
            background: linear-gradient(135deg, var(--primary-green), #0a5234);
            color: white;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-radius: 0 0 25px 25px;
            box-shadow: 0 4px 15px rgba(11, 102, 65, 0.15);
        }

        .top-nav i { cursor: pointer; font-size: 1.2rem; transition: 0.2s; }
        .top-nav i:active { transform: scale(0.9); }

        .search-section {
            padding: 20px;
            display: flex;
            gap: 12px;
            align-items: center;
            margin-top: -5px;
        }
        .search-wrapper { position: relative; flex-grow: 1; }
        .search-wrapper i {
            position: absolute; right: 15px; top: 50%;
            transform: translateY(-50%); color: var(--primary-green);
        }
        .search-input {
            width: 100%; padding: 14px 40px 14px 15px;
            background: white; border: 1px solid var(--border-color);
            border-radius: 15px; font-size: 0.95rem; outline: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02); transition: 0.2s;
        }
        .search-input:focus { border-color: var(--accent-green); }
        
        .qr-btn {
            background: white; color: var(--primary-green);
            border: 1px solid var(--border-color);
            width: 52px; height: 52px; border-radius: 15px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem; box-shadow: 0 4px 10px rgba(0,0,0,0.02); cursor: pointer;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 2fr 1fr 0.6fr 0.6fr;
            gap: 10px;
            align-items: center;
        }

        .table-headers {
            padding: 0 25px 10px 25px;
            font-size: 0.8rem; font-weight: 700;
            color: var(--text-muted); text-transform: uppercase;
        }
        .table-headers div { text-align: center; }
        .table-headers div:first-child { text-align: right; }

        .item-card {
            padding: 16px 20px;
            background: white;
            border-radius: 20px;
            margin: 0 15px 12px;
            transition: all 0.2s ease;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.01);
        }
        .item-card:active { transform: scale(0.98); background: #f8f9fa; }
        
        .item-card.out-of-stock {
            opacity: 0.6;
            background: #fdfdfd;
            border-color: #f1f2f6;
        }
        .item-card.out-of-stock .item-price { color: var(--text-muted); }

        .item-name { font-weight: 800; font-size: 0.95rem; margin-bottom: 3px; color: var(--text-dark); line-height: 1.3;}
        .item-barcode { font-size: 0.75rem; color: var(--text-muted); }

        .item-price { 
            text-align: center; 
            color: var(--primary-green); 
            font-weight: 800;
            font-size: 1.05rem;
        }

        .qty-badge {
            background: #f0fdf4;
            color: var(--primary-green);
            padding: 5px 0;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            text-align: center;
            width: 100%;
            display: inline-block;
            border: 1px solid #dcfce7;
        }
        
        .qty-low { background: var(--danger-bg); color: var(--danger); border-color: #ffe4e6; }
        .qty-zero { background: #f1f5f9; color: var(--text-muted); border-color: var(--border-color); }

        .bottom-summary {
            position: fixed; bottom: 0; width: 100%;
            background: white; padding: 18px 20px;
            font-weight: 800; font-size: 0.95rem;
            display: flex; justify-content: center;
            border-top: 1px solid var(--border-color);
            color: var(--primary-green);
            box-shadow: 0 -4px 15px rgba(0,0,0,0.03); z-index: 999;
        }

        .fab {
            position: fixed; bottom: 80px; right: 20px;
            background: var(--primary-green); color: white;
            width: 60px; height: 60px; border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.6rem; box-shadow: 0 8px 25px rgba(11, 102, 65, 0.4);
            text-decoration: none; transition: 0.3s; z-index: 1000;
        }
        .fab:hover { background: #0a5234; transform: translateY(-3px); color: white;}
    </style>
</head>
<body>

<div class="top-nav">
    <i class="fas fa-sync-alt" onclick="location.reload()"></i>
    <span class="fw-bold">الأصناف والمخزون</span>
    <i class="fas fa-chevron-left" onclick="history.back()"></i>
</div>

<div class="search-section">
    <button class="qr-btn" aria-label="مسح الباركود"><i class="fas fa-qrcode"></i></button>
    <div class="search-wrapper">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن منتج أو باركود..." oninput="renderItems()">
    </div>
</div>

<div class="table-headers grid-layout">
    <div>المنتج والباركود</div>
    <div>السعر</div>
    <div>كرتونة</div>
    <div>جركن</div>
</div>

<div id="itemsContainer">
    <div class="text-center py-5 fw-bold text-muted">
        <div class="spinner-border spinner-border-sm me-2"></div>
        جاري حساب ودراسة أرصدة المخزون الفعلية...
    </div>
</div>

<div class="bottom-summary">
    <i class="fas fa-boxes me-2"></i> إجمالي الأصناف: <span id="totalCount" class="ms-2">0</span>
</div>

<a href="add-product.html" class="fab" aria-label="إضافة منتج">
    <i class="fas fa-plus"></i>
</a>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

 
    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
      authDomain: "ahmedelzaiady.firebaseapp.com",
      projectId: "ahmedelzaiady",
      storageBucket: "ahmedelzaiady.firebasestorage.app",
      messagingSenderId: "300306825071",
      appId: "1:300306825071:web:0426ddde56280fa090329a",
      measurementId: "G-WE04GK5XZZ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let allData = [];

    // دالة للتحقق هل الوحدة المعاملة كرتونة
    function checkIsCarton(unitName) {
        if (!unitName) return false;
        const u = unitName.toString().trim().toLowerCase();
        return u === 'box' || u === 'carton' || u === 'كرتونة' || u === 'كرتونه';
    }

    // دالة جلب الأرصدة الحقيقية المطابقة لحركات المشتريات والمبيعات
    async function fetchRealInventoryData() {
        try {
            const [invSnap, salesSnap, purSnap] = await Promise.all([
                getDocs(collection(db, "inventory")),
                getDocs(collection(db, "invoices")),
                getDocs(collection(db, "supplier_transactions"))
            ]);

            const itemMovements = {};

            // 1. تجميع المبيعات ومرتجعاتها بالقطع الفرعية (الجراكن)
            salesSnap.forEach(docSnap => {
                const data = docSnap.data();
                if (data.isDeleted) return;

                const items = data.items || [];
                items.forEach(item => {
                    const id = item.stockId || item.id;
                    if (!id) return;
                    if (!itemMovements[id]) itemMovements[id] = { soldPcs: 0, boughtPcs: 0 };

                    const factor = Number(item.unitFactor) || 1;
                    const qty = Number(item.qty) || 0;
                    
                    // إذا تباع بالكرتونة تضرب في معامل الكرتونة لتحويلها إلى جراكن/قطع
                    const pcsCount = checkIsCarton(item.unit) ? (qty * factor) : qty;

                    if (data.type === 'مرتجع' || data.isReturn) {
                        itemMovements[id].soldPcs -= pcsCount;
                    } else {
                        itemMovements[id].soldPcs += pcsCount;
                    }
                });
            });

            // 2. تجميع المشتريات ومرتجعاتها بالقطع الفرعية (الجراكن)
            purSnap.forEach(docSnap => {
                const data = docSnap.data();
                if (data.isDeleted) return;

                const items = data.items || [];
                items.forEach(item => {
                    const id = item.stockId || item.id;
                    if (!id) return;
                    if (!itemMovements[id]) itemMovements[id] = { soldPcs: 0, boughtPcs: 0 };

                    const factor = Number(item.unitFactor) || 1;
                    const qty = Number(item.qty) || 0;
                    
                    // إذا اشتريت بالكرتونة تضرب في معامل الكرتونة لتحويلها إلى جراكن/قطع
                    const pcsCount = checkIsCarton(item.unit) ? (qty * factor) : qty;

                    if (data.type === 'مرتجع شراء' || data.isReturn) {
                        itemMovements[id].boughtPcs -= pcsCount;
                    } else {
                        itemMovements[id].boughtPcs += pcsCount;
                    }
                });
            });

            // 3. احتساب الرصيد الصافي الموحد (الرصيد الإجمالي بالجراكن/القطع)
            allData = [];
            invSnap.forEach(docSnap => {
                const data = docSnap.data();
                if (data.isDeleted) return;

                const id = docSnap.id;
                const factor = Number(data.unitFactor) || 1;
                
                // حساب رصيد بداية المدة بالجراكن/القطع
                let initialPcs = Number(data.openingStockPcs);
                if (isNaN(initialPcs)) {
                    // إذا لم يوجد رصيد أول مدة بالقطع، نحسبه من رصيد الكراتين + الجراكن الأولية
                    const initCartons = Number(data.openingCartons) || Number(data.cartons) || 0;
                    const initJerrycans = Number(data.openingJerrycans) || Number(data.jerrycans) || 0;
                    initialPcs = (initCartons * factor) + initJerrycans;
                }

                const movements = itemMovements[id] || { soldPcs: 0, boughtPcs: 0 };
                
                // الرصيد الصافي الحالي بالقطع (الجراكن)
                let calculatedTotalPcs = initialPcs + movements.boughtPcs - movements.soldPcs;

                allData.push({
                    id,
                    ...data,
                    realTotalPcs: calculatedTotalPcs
                });
            });

            renderItems();
        } catch (e) {
            console.error("خطأ في احتساب رصيد المخزن:", e);
            document.getElementById('itemsContainer').innerHTML = 
                `<div class="text-center text-danger mt-4 fw-bold">عذراً، تعذر تحديث بيانات المخزون الحالية.</div>`;
        }
    }

    window.renderItems = function() {
        const term = document.getElementById('searchInput').value.toLowerCase().trim();
        const container = document.getElementById('itemsContainer');
        
        let filtered = allData.filter(i => 
            (i.name && i.name.toLowerCase().includes(term)) || 
            (i.barcode && i.barcode.includes(term))
        );

        filtered.sort((a, b) => {
            const qtyA = Number(a.realTotalPcs) || 0;
            const qtyB = Number(b.realTotalPcs) || 0;
            if (qtyA === 0 && qtyB !== 0) return 1;
            if (qtyA !== 0 && qtyB === 0) return -1;
            return 0;
        });

        let html = '';
        filtered.forEach(item => {
            const factor = Number(item.unitFactor) || 1; // معامل الكرتونة (مثلاً 4 أو 12)
            const totalPcs = Number(item.realTotalPcs) || 0;
            
            // التفكيك الصحيح: الكراتين = الناتج الصحيح من قسمة الإجمالي على المعامل
            // الجراكن = الباقي بعد تحويل الكراتين
            let cartons = 0;
            let jerrycans = 0;

            if (factor > 1) {
                cartons = Math.trunc(totalPcs / factor);
                jerrycans = totalPcs % factor;
            } else {
                // إذا لم يوجد معامل كرتونة، يُعامل الإجمالي على أنه جراكن/قطع مباشرة
                cartons = 0;
                jerrycans = totalPcs;
            }

            const isZero = totalPcs === 0;
            const minAllowed = (Number(item.min) || 0) * factor;
            const isLow = !isZero && (totalPcs <= minAllowed);

            let badgeClass = 'qty-badge';
            if (isZero) {
                badgeClass += ' qty-zero';
            } else if (isLow) {
                badgeClass += ' qty-low';
            }

            html += `
                <div class="item-card grid-layout ${isZero ? 'out-of-stock' : ''}" onclick="goToDetails('${item.id}')">
                    <div class="item-info">
                        <div class="item-name">${item.name}</div>
                        <div class="item-barcode">باركود: ${item.barcode || '---'}</div>
                    </div>
                    <div class="item-price">
                        ${Number(item.sell || 0).toLocaleString('en-US', {minimumFractionDigits: 2})}
                    </div>
                    <div>
                        <div class="${badgeClass}">${cartons}</div>
                    </div>
                    <div>
                        <div class="${badgeClass}">${jerrycans}</div>
                    </div>
                </div>
            `;
        });

        if (filtered.length === 0) {
            html = `<div class="text-center text-muted mt-5 fw-bold"><i class="fas fa-search fa-2x mb-2"></i><br>لا توجد أصناف مطابقة للبحث</div>`;
        }

        container.innerHTML = html;
        document.getElementById('totalCount').innerText = filtered.length;
    };

    window.goToDetails = function(id) {
        window.location.href = `product-details.html?id=${id}`;
    };

    fetchRealInventoryData();
</script>

</body>
</html>
