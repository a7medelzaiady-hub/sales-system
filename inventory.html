<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة الزيادى الأصناف</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #f0f4f2;
            --card: #ffffff;
            --accent: #0b5e3d;
            --accent-light: #128256;
            --header: #0b5e3d;
            --text: #1b2e26;
            --sub: #7a8f86;
            --danger: #e41e3f;
            --success: #18a34a;
            --gold: #c98a00;
            --border: #e4ede8;
            --shadow: 0 2px 12px rgba(11,94,61,0.07);
            --r: 16px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

        header {
            background: var(--header);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky; top: 0; z-index: 100;
            box-shadow: 0 3px 16px rgba(0,0,0,0.12);
        }
        .h-title { font-size: 15px; font-weight: 800; color: #fff; text-align: center; line-height: 1.3; }
        .h-title span { color: #ffce31; }
        .h-sub { font-size: 10px; color: rgba(255,255,255,0.6); font-weight: 600; text-align: center; margin-top: 1px; }
        .back-btn {
            background: rgba(255,255,255,0.13);
            color: #fff; border: 1px solid rgba(255,255,255,0.22);
            border-radius: 10px; padding: 7px 12px;
            font-family: 'Cairo', sans-serif; font-size: 12px; font-weight: 700;
            cursor: pointer; display: flex; align-items: center; gap: 5px;
            text-decoration: none; white-space: nowrap;
        }

        /* Stats */
        .stats {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 8px; padding: 12px 12px 0;
            max-width: 700px; margin: 0 auto;
        }
        .stat {
            background: var(--card); border: 1px solid var(--border);
            border-radius: var(--r); padding: 12px 10px;
            text-align: center; box-shadow: var(--shadow);
            position: relative; overflow: hidden;
        }
        .stat::after { content:''; position:absolute; bottom:0; left:0; right:0; height:3px; }
        .stat.s-total::after { background: var(--accent); }
        .stat.s-ok::after    { background: var(--success); }
        .stat.s-low::after   { background: var(--gold); }
        .stat.s-zero::after  { background: var(--danger); }

        .stat-num { font-size: 26px; font-weight: 900; line-height: 1; }
        .stat-lbl { font-size: 10px; color: var(--sub); font-weight: 700; margin-top: 4px; }
        .stat.s-total .stat-num { color: var(--accent); }
        .stat.s-ok    .stat-num { color: var(--success); }
        .stat.s-low   .stat-num { color: var(--gold); }
        .stat.s-zero  .stat-num { color: var(--danger); }

        /* Search */
        .search-wrap { max-width: 700px; margin: 10px auto 0; padding: 0 12px; }
        .search-inner {
            background: var(--card); border: 1.5px solid var(--border);
            border-radius: var(--r); padding: 9px 14px;
            display: flex; align-items: center; gap: 9px;
            box-shadow: var(--shadow); transition: border-color 0.2s;
        }
        .search-inner:focus-within { border-color: var(--accent); }
        .search-inner i { color: var(--sub); font-size: 13px; }
        .search-inner input {
            border: none; background: transparent; width: 100%;
            font-family: 'Cairo', sans-serif; font-size: 13px;
            color: var(--text); outline: none;
        }
        .search-inner input::placeholder { color: #b0bcb6; }

        /* List */
        .list-wrap { max-width: 700px; margin: 10px auto 50px; padding: 0 12px; }
        .list-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden;
        }
        .list-head {
            padding: 10px 16px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(11,94,61,0.03);
        }
        .list-head h3 { font-size: 13px; font-weight: 800; color: var(--accent); display: flex; align-items: center; gap: 6px; }
        .count-badge { background: var(--accent); color: #fff; font-size: 10px; font-weight: 800; padding: 2px 9px; border-radius: 20px; }

        /* Row */
        .item-row {
            display: flex; align-items: center;
            padding: 10px 14px; border-bottom: 1px solid var(--border);
            gap: 10px; transition: background 0.12s;
            cursor: pointer;
        }
        .item-row:last-child { border-bottom: none; }
        .item-row:hover { background: rgba(11,94,61,0.02); }
        .item-row:active { background: rgba(11,94,61,0.06); }
        .item-row.zero-row { background: rgba(228,30,63,0.025); }
        .item-row.low-row  { background: rgba(201,138,0,0.025); }

        .row-num { font-size: 10px; color: #c5d0cb; font-weight: 800; min-width: 18px; text-align: center; }

        .row-icon {
            width: 36px; height: 36px; border-radius: 11px;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; flex-shrink: 0;
            background: rgba(11,94,61,0.08); color: var(--accent);
        }
        .zero-row .row-icon { background: rgba(228,30,63,0.08); color: var(--danger); }
        .low-row  .row-icon { background: rgba(201,138,0,0.09); color: var(--gold); }

        .row-info { flex: 1; min-width: 0; }
        .row-name { font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
        .row-meta { font-size: 10px; color: var(--sub); font-weight: 600; margin-top: 2px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
        .cat-tag { background: rgba(11,94,61,0.07); color: var(--accent-light); padding: 1px 6px; border-radius: 5px; font-size: 9px; font-weight: 700; }

        /* Qty block */
        .row-qty { text-align: center; flex-shrink: 0; min-width: 80px; }

        .qty-main { font-size: 19px; font-weight: 900; line-height: 1; }
        .qty-main.ok   { color: var(--success); }
        .qty-main.low  { color: var(--gold); }
        .qty-main.zero { color: var(--danger); }

        .qty-lbl { font-size: 10px; font-weight: 700; color: var(--sub); margin-top: 1px; }

        .qty-extra {
            margin-top: 4px;
            display: inline-flex; align-items: center; gap: 3px;
            background: rgba(88,166,255,0.1); color: #2272b8;
            border-radius: 7px; padding: 2px 7px;
            font-size: 11px; font-weight: 800;
        }

        .status-dot {
            width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
        }
        .status-dot.ok   { background: var(--success); box-shadow: 0 0 5px rgba(24,163,74,0.5); }
        .status-dot.low  { background: var(--gold);    box-shadow: 0 0 5px rgba(201,138,0,0.4); }
        .status-dot.zero { background: var(--danger);  box-shadow: 0 0 5px rgba(228,30,63,0.4); }

        /* Zero divider */
        .zero-divider {
            padding: 9px 16px;
            background: rgba(228,30,63,0.05);
            border-top: 1px dashed rgba(228,30,63,0.25);
            border-bottom: 1px dashed rgba(228,30,63,0.25);
            font-size: 11px; font-weight: 800; color: var(--danger);
            display: flex; align-items: center; gap: 7px;
        }
        .zero-divider em { background: rgba(228,30,63,0.12); padding: 1px 9px; border-radius: 9px; font-style: normal; }

        /* Loading / empty */
        .loading { text-align: center; padding: 50px 20px; color: var(--sub); }
        .spinner { width: 34px; height: 34px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.75s linear infinite; margin: 0 auto 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading p { font-size: 13px; font-weight: 700; }
        .empty-state { text-align: center; padding: 50px 20px; color: var(--sub); }
        .empty-state i { font-size: 36px; opacity: 0.2; display: block; margin-bottom: 10px; }
        .empty-state p { font-size: 13px; font-weight: 700; }
        .err-box { margin: 14px; background: rgba(228,30,63,0.07); border: 1px solid rgba(228,30,63,0.2); border-radius: var(--r); padding: 20px; text-align: center; color: var(--danger); font-weight: 700; font-size: 13px; }
        .err-box i { font-size: 26px; display: block; margin-bottom: 8px; }

        /* Modal Styles */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(27, 46, 38, 0.6); backdrop-filter: blur(4px);
            z-index: 1000; display: none; align-items: center; justify-content: center;
            padding: 16px;
        }
        .modal-card {
            background: var(--card); width: 100%; max-width: 600px;
            border-radius: var(--r); box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden; display: flex; flex-direction: column; max-height: 85vh;
            animation: modalFade 0.25s ease-out;
        }
        @keyframes modalFade { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-header {
            background: var(--accent); color: #fff; padding: 14px 16px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .modal-header h4 { font-size: 15px; font-weight: 800; }
        .close-modal { background: rgba(255,255,255,0.2); border: none; color: #fff; width: 28px; height: 28px; border-radius: 50%; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .modal-body { padding: 16px; overflow-y: auto; flex: 1; }
        
        /* History Timeline */
        .history-list { display: flex; flex-direction: column; gap: 2px; }
        .tx-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 10px; border-bottom: 1px solid var(--border); gap: 10px;
        }
        .tx-item:last-child { border-bottom: none; }
        .tx-type { padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: 800; color: #fff; text-align: center; min-width: 65px; }
        .tx-type.sale { background: var(--success); }
        .tx-type.purchase { background: var(--accent-light); }
        .tx-type.return { background: var(--gold); }
        .tx-type.loss { background: var(--danger); }
        .tx-details { flex: 1; text-align: right; }
        .tx-title { font-size: 12px; font-weight: 800; color: var(--text); }
        .tx-date { font-size: 10px; color: var(--sub); font-weight: 600; margin-top: 1px; }
        .tx-amount { font-size: 15px; font-weight: 900; text-align: left; direction: ltr; }
        .tx-amount.plus { color: var(--success); }
        .tx-amount.minus { color: var(--danger); }
    </style>
</head>
<body>

<header>
    <div style="width:75px;"></div>
    <div>
        <div class="h-title">شركة <span>الزيادى</span> | الأصناف</div>
        <div class="h-sub" id="syncTime">جاري التحميل...</div>
    </div>
    <a href="javascript:history.back()" class="back-btn">
        <i class="fas fa-arrow-right"></i> رجوع
    </a>
</header>

<div class="stats">
    <div class="stat s-total"><div class="stat-num" id="sTotal">—</div><div class="stat-lbl">إجمالي الأصناف</div></div>
    <div class="stat s-ok">  <div class="stat-num" id="sOk">—</div>   <div class="stat-lbl">متوفر</div></div>
    <div class="stat s-low"> <div class="stat-num" id="sLow">—</div>  <div class="stat-lbl">كمية منخفضة</div></div>
    <div class="stat s-zero"><div class="stat-num" id="sZero">—</div> <div class="stat-lbl">نفد المخزون</div></div>
</div>

<div class="search-wrap">
    <div class="search-inner">
        <i class="fas fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="ابحث بالاسم أو الباركود..." oninput="renderList()">
    </div>
</div>

<div class="list-wrap">
    <div class="list-card">
        <div class="list-head">
            <h3><i class="fas fa-boxes-stacked"></i> الأصناف</h3>
            <span class="count-badge" id="countBadge">—</span>
        </div>
        <div id="listBody">
            <div class="loading"><div class="spinner"></div><p>جاري التحميل من Firebase...</p></div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="historyModal" onclick="closeHistoryModal()">
    <div class="modal-card" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h4 id="modalItemName">سجل حركات الصنف</h4>
            <button class="close-modal" onclick="closeHistoryModal()"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body" id="modalBody">
            </div>
    </div>
</div>

<script type="module">
    import { initializeApp }   from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, enableIndexedDbPersistence, getDocs }
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey:            "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
        authDomain:        "ahmedelzaiady.firebaseapp.com",
        projectId:         "ahmedelzaiady",
        storageBucket:     "ahmedelzaiady.firebasestorage.app",
        messagingSenderId: "300306825071",
        appId:             "1:300306825071:web:0426ddde56280fa090329a"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);
    let allItems = [];

    enableIndexedDbPersistence(db)
        .then(() => { console.log("تم تفعيل الكاش المحلي بنجاح"); })
        .catch((err) => { console.warn("تنبيه الكاش:", err.message); });

    onSnapshot(collection(db, "inventory"), snap => {
        allItems = [];
        snap.forEach(d => {
            const data = d.data();
            if (data.isDeleted !== true) allItems.push({ id: d.id, ...data });
        });

        allItems.sort((a, b) => {
            const qa = Number(a.totalPcs) || 0;
            const qb = Number(b.totalPcs) || 0;
            if (qa === 0 && qb === 0) return (a.name||'').localeCompare(b.name||'', 'ar');
            if (qa === 0) return  1;
            if (qb === 0) return -1;
            return qb - qa;
        });

        updateStats();
        renderList();

        const isFromCache = snap.metadata.fromCache;
        const now = new Date();
        document.getElementById('syncTime').textContent =
            `آخر تحديث: ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}` + 
            (isFromCache ? " (محلي)" : " (مباشر)");

    }, err => {
        document.getElementById('listBody').innerHTML =
            `<div class="err-box"><i class="fas fa-wifi"></i>خطأ في الاتصال بـ Firebase<br><small style="opacity:.75">${err.message}</small></div>`;
    });

    function updateStats() {
        let ok = 0, low = 0, zero = 0;
        allItems.forEach(item => {
            const factor   = Number(item.unitFactor) || 1;
            const totalPcs = Number(item.totalPcs)   || 0;
            const minPcs   = (Number(item.min) || 0) * factor;
            if (totalPcs === 0)        zero++;
            else if (totalPcs <= minPcs) low++;
            else                         ok++;
        });
        document.getElementById('sTotal').textContent = allItems.length;
        document.getElementById('sOk').textContent    = ok;
        document.getElementById('sLow').textContent   = low;
        document.getElementById('sZero').textContent  = zero;
    }

    window.renderList = function() {
        const term = document.getElementById('searchInput').value.trim().toLowerCase();
        const list = term
            ? allItems.filter(i =>
                (i.name   ||'').toLowerCase().includes(term) ||
                (i.barcode||'').toLowerCase().includes(term))
            : allItems;

        document.getElementById('countBadge').textContent = list.length + ' صنف';

        if (list.length === 0) {
            document.getElementById('listBody').innerHTML =
                `<div class="empty-state"><i class="fas fa-box-open"></i><p>لا توجد نتائج</p></div>`;
            return;
        }

        const withQty = list.filter(i => (Number(i.totalPcs) || 0) > 0);
        const zeroQty = list.filter(i => (Number(i.totalPcs) || 0) === 0);

        let html = '';
        let n = 1;
        withQty.forEach(item => { html += buildRow(item, n++); });

        if (zeroQty.length > 0) {
            html += `<div class="zero-divider">
                        <i class="fas fa-triangle-exclamation"></i>
                        <em>نفد المخزون — ${zeroQty.length} صنف</em>
                     </div>`;
            zeroQty.forEach(item => { html += buildRow(item, n++); });
        }

        document.getElementById('listBody').innerHTML = html;
    };

    function buildRow(item, num) {
        let factor = Number(item.unitFactor) || 1;
        if (factor <= 0) factor = 1;

        const totalPcs = Number(item.totalPcs)   || 0;
        const minPcs   = (Number(item.min) || 0) * factor;

        const boxes = Math.floor(totalPcs / factor);
        const jars  = totalPcs % factor;

        let status = 'ok';
        if (totalPcs === 0)          status = 'zero';
        else if (totalPcs <= minPcs) status = 'low';

        let unitName = (item.unitName && item.unitName.trim() !== 'كرتونة') ? item.unitName.trim() : 'جركن';
        
        let boxDisplay = '';
        let labelDisplay = 'كرتونة';
        let extraHtml = '';

        if (status === 'zero') {
            boxDisplay = 'صفر';
        } else if (boxes === 0 && jars > 0) {
            boxDisplay = jars.toLocaleString();
            labelDisplay = unitName; 
            extraHtml = ''; 
        } else {
            boxDisplay = boxes.toLocaleString();
            labelDisplay = 'كرتونة';
            extraHtml = (jars > 0)
                ? `<div class="qty-extra"><i class="fas fa-tag" style="font-size:9px;"></i>${jars} ${unitName}</div>`
                : '';
        }

        const catHtml   = item.category ? `<span class="cat-tag">${item.category}</span>` : '';
        const priceHtml = item.sell     ? `<span>${Number(item.sell).toLocaleString()} ج.م</span>` : '';

        const safeName = (item.name || 'بدون اسم').replace(/'/g, "\\'");
        return `
        <div class="item-row${status==='zero' ? ' zero-row' : status==='low' ? ' low-row' : ''}" onclick="showItemHistory('${item.id}', '${safeName}')">
            <span class="row-num">${num}</span>
            <div class="row-icon"><i class="fas fa-${status==='zero' ? 'box-open' : 'box'}"></i></div>
            <div class="row-info">
                <div class="row-name">${item.name || 'بدون اسم'}</div>
                <div class="row-meta">${catHtml}${priceHtml}</div>
            </div>
            <div class="row-qty">
                <div class="qty-main ${status}">${boxDisplay}</div>
                <div class="qty-lbl">${labelDisplay}</div>
                ${extraHtml}
            </div>
            <div class="status-dot ${status}"></div>
        </div>`;
    }

    // =============================================================
    // محرك الفحص والمسح المصفوفي المرن والعميق (Fuzzy Array Scan Engine)
    // =============================================================
    window.showItemHistory = async function(itemId, itemName) {
        const modal = document.getElementById('historyModal');
        const modalTitle = document.getElementById('modalItemName');
        const modalBody = document.getElementById('modalBody');
        
        modalTitle.textContent = `حركات الصنف: ${itemName}`;
        modalBody.innerHTML = `<div class="loading"><div class="spinner"></div><p>جاري فحص فواتير البيع والشراء والعمليات...</p></div>`;
        modal.style.display = 'flex';

        try {
            let foundTransactions = [];
            const targetCollections = ["orders", "transactions", "purchase_orders"];
            
            // دالة مساعدة لتنظيف النصوص ومقارنتها بمرونة كاملة
            const cleanText = (txt) => String(txt || '').trim().toLowerCase().replace(/\s+/g, ' ');
            const targetId = cleanText(itemId);
            const targetName = cleanText(itemName);

            for (const colName of targetCollections) {
                try {
                    const snap = await getDocs(collection(db, colName));
                    snap.forEach(docSnap => {
                        const d = docSnap.data();
                        
                        // دالة داخلية لفحص أي كائن (سواء كان مستند علوي أو عنصر داخل مصفوفة)
                        const inspectObj = (obj) => {
                            let match = false;
                            let extractedQty = 0;

                            // 1. فحص الحقول المرتبطة بالـ ID بأي صيغة كُتبت
                            for (let key in obj) {
                                const lowerKey = key.toLowerCase();
                                if (lowerKey.includes('id') || lowerKey.includes('key')) {
                                    if (cleanText(obj[key]) === targetId && targetId !== '') {
                                        match = true;
                                    }
                                }
                            }

                            // 2. فحص الحقول المرتبطة بالاسم (إذا لم يتطابق الـ ID أو كخط دفاع أول)
                            for (let key in obj) {
                                const lowerKey = key.toLowerCase();
                                if (lowerKey.includes('name') || lowerKey.includes('title') || lowerKey.includes('item')) {
                                    if (cleanText(obj[key]).includes(targetName) && targetName !== '') {
                                        match = true;
                                    }
                                }
                            }

                            // 3. إذا حدث تطابق، نستخلص الكمية بأي مسمى حقل متوقع
                            if (match) {
                                for (let key in obj) {
                                    const lowerKey = key.toLowerCase();
                                    if (lowerKey === 'qty' || lowerKey === 'quantity' || lowerKey === 'count' || lowerKey === 'amount' || lowerKey === 'totalpcs') {
                                        const parsed = parseInt(obj[key]);
                                        if (!isNaN(parsed) && parsed > 0) {
                                            extractedQty = parsed;
                                            break;
                                        }
                                    }
                                }
                                // إذا لم نجد حقل صريح، نأخذ أي قيمة رقمية منطقية
                                if (extractedQty === 0 && typeof obj.qty === 'number') extractedQty = obj.qty;
                            }

                            return { match, qty: extractedQty };
                        };

                        // أولاً: فحص هيكل المستند العلوي مباشرة
                        const topResult = inspectObj(d);
                        if (topResult.match && topResult.qty > 0) {
                            foundTransactions.push({
                                id: docSnap.id,
                                ...d,
                                finalCalculatedQty: topResult.qty,
                                detectedSource: colName
                            });
                        }

                        // ثانياً: الدوران داخل المستند للبحث عن أي مصفوفات تفصيلية وفكها (مثل قائمة الأصناف بالفاتورة)
                        for (let key in d) {
                            if (Array.isArray(d[key])) {
                                d[key].forEach(subItem => {
                                    if (subItem && typeof subItem === 'object') {
                                        const subResult = inspectObj(subItem);
                                        if (subResult.match && subResult.qty > 0) {
                                            foundTransactions.push({
                                                id: docSnap.id,
                                                ...d,
                                                finalCalculatedQty: subResult.qty,
                                                detectedSource: colName
                                            });
                                        }
                                    }
                                });
                            }
                        }
                    });
                } catch(e) {
                    console.warn(`تخطي الكولكشن ${colName} مؤقتاً.`);
                }
            }

            // ترتيب تنازلي دقيق للحركات (من الأحدث تاريخاً للأقدم تاريخاً)
            foundTransactions.sort((a,b) => {
                const dateA = a.date?.toDate ? a.date.toDate() : new Date(a.date || a.createdAt || a.timestamp || 0);
                const dateB = b.date?.toDate ? b.date.toDate() : new Date(b.date || b.createdAt || b.timestamp || 0);
                return dateB - dateA;
            });

            // فلترة السجلات المكررة الناتجة عن تطابق المستند والمصفوفة معاً
            const uniqueTransactions = [];
            const seenIds = new Set();
            foundTransactions.forEach(t => {
                const uniqueKey = `${t.id}_${t.finalCalculatedQty}_${t.detectedSource}`;
                if (!seenIds.has(uniqueKey)) {
                    seenIds.add(uniqueKey);
                    uniqueTransactions.push(t);
                }
            });

            if (uniqueTransactions.length === 0) {
                modalBody.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-receipt" style="font-size:32px; color:var(--sub); opacity:0.4;"></i>
                        <p>لا توجد حركات مسجلة (بيع/شراء) لهذا الصنف في السجلات حالياً.</p>
                    </div>`;
                return;
            }

            let html = '<div class="history-list">';
            uniqueTransactions.forEach(tx => {
                let typeClass = 'sale';
                let typeText = 'بيع';
                let sign = '-';
                let amtClass = 'minus';

                // التعرف الذكي الشامل على نوع الحركة بناءً على الكولكشن والنوع الداخلي بالفايربيز
                const rawType = cleanText(tx.type || tx.status || tx.detectedSource || '');
                
                if (rawType.includes('purchase') || rawType.includes('شراء') || rawType.includes('تزويد') || rawType.includes('وارد')) {
                    typeClass = 'purchase'; typeText = 'شراء'; sign = '+'; amtClass = 'plus';
                } else if (rawType.includes('return') || rawType.includes('مرتجع') || rawType.includes('ارتجاع')) {
                    typeClass = 'return'; typeText = 'مرتجع'; sign = '+'; amtClass = 'plus';
                } else if (rawType.includes('loss') || rawType.includes('تالف') || rawType.includes('اتلاف')) {
                    typeClass = 'loss'; typeText = 'تالف'; sign = '-'; amtClass = 'minus';
                }

                // صياغة التاريخ والوقت بشكل منسق وقابل للقراءة
                let dateStr = 'بدون تاريخ';
                const fireDate = tx.date || tx.createdAt || tx.timestamp;
                if (fireDate) {
                    const d = fireDate.toDate ? fireDate.toDate() : new Date(fireDate);
                    dateStr = d.toLocaleDateString('ar-EG', {year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit'});
                }

                // جلب اسم العميل، المورد، أو الملاحظات لتمييز الحركة
                let description = tx.notes || tx.clientName || tx.customerName || tx.supplierName || tx.customer || 'معاملة مسجلة للنظام';

                html += `
                <div class="tx-item">
                    <span class="tx-type ${typeClass}">${typeText}</span>
                    <div class="tx-details">
                        <div class="tx-title">${description}</div>
                        <div class="tx-date">${dateStr}</div>
                    </div>
                    <div class="tx-amount ${amtClass}">${sign}${tx.finalCalculatedQty}</div>
                </div>`;
            });
            html += '</div>';

            modalBody.innerHTML = html;

        } catch (err) {
            console.error(err);
            modalBody.innerHTML = `<div class="err-box"><i class="fas fa-exclamation-triangle"></i>فشل في جلب الحركات وسحب البيانات المحدثة<br><small>${err.message}</small></div>`;
        }
    };

    window.closeHistoryModal = function() {
        document.getElementById('historyModal').style.display = 'none';
    };
</script>
</body>
</html>
