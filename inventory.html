<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة الزيادى | الأصناف والأعداد</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #f4f7f6;
            --card: #ffffff;
            --accent: #0b5e3d;
            --accent-light: #128256;
            --header: #0b5e3d;
            --text: #1b2e26;
            --sub: #61736b;
            --danger: #e41e3f;
            --success: #2dbe57;
            --gold: #dfa100;
            --border: #e2e9e5;
            --shadow: 0 4px 20px rgba(11,94,61,0.06);
            --r: 16px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* Header */
        header {
            background: var(--header);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        header h1 { font-size: 17px; font-weight: 800; color: #fff; }
        header h1 span { color: #ffce31; }
        .back-btn {
            background: rgba(255,255,255,0.12);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            padding: 7px 14px;
            font-family: 'Cairo', sans-serif;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }
        .sync-time { font-size: 12px; color: rgba(255,255,255,0.7); font-weight: 600; }

        /* Stats */
        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding: 16px 16px 0;
            max-width: 900px;
            margin: 0 auto;
        }
        @media(min-width:600px){ .stats { grid-template-columns: repeat(4, 1fr); } }

        .stat {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: 14px;
            text-align: center;
            box-shadow: var(--shadow);
        }
        .stat-num { font-size: 26px; font-weight: 800; line-height: 1; }
        .stat-lbl { font-size: 11px; color: var(--sub); font-weight: 700; margin-top: 4px; }
        .stat.s-total .stat-num { color: var(--accent); }
        .stat.s-ok    .stat-num { color: var(--success); }
        .stat.s-low   .stat-num { color: var(--gold); }
        .stat.s-zero  .stat-num { color: var(--danger); }

        /* Search */
        .search-wrap {
            max-width: 900px;
            margin: 12px auto 0;
            padding: 0 16px;
        }
        .search-inner {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: var(--shadow);
        }
        .search-inner i { color: var(--sub); }
        .search-inner input {
            border: none; background: transparent;
            width: 100%; font-family: 'Cairo', sans-serif;
            font-size: 14px; color: var(--text); outline: none;
        }
        .search-inner input::placeholder { color: var(--sub); }

        /* List */
        .list-wrap {
            max-width: 900px;
            margin: 12px auto 40px;
            padding: 0 16px;
        }
        .list-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--r);
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        .list-head {
            padding: 12px 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .list-head h3 { font-size: 14px; font-weight: 800; color: var(--accent); }
        .count-badge { font-size: 12px; color: var(--sub); font-weight: 700; }

        /* Item Row */
        .item-row {
            display: flex;
            align-items: center;
            padding: 13px 18px;
            border-bottom: 1px solid var(--border);
            gap: 14px;
            transition: background 0.15s;
        }
        .item-row:last-child { border-bottom: none; }
        .item-row:hover { background: rgba(11,94,61,0.03); }
        .item-row.zero-row { opacity: 0.55; }

        .item-num {
            font-size: 11px;
            color: var(--sub);
            font-weight: 700;
            min-width: 22px;
            text-align: center;
        }

        .item-icon {
            width: 40px; height: 40px;
            border-radius: 12px;
            background: rgba(11,94,61,0.07);
            display: flex; align-items: center; justify-content: center;
            color: var(--accent);
            font-size: 16px;
            flex-shrink: 0;
        }
        .item-row.zero-row .item-icon { background: rgba(228,30,63,0.07); color: var(--danger); }

        .item-info { flex: 1; min-width: 0; }
        .item-name {
            font-size: 14px;
            font-weight: 800;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .item-meta { font-size: 11px; color: var(--sub); font-weight: 600; margin-top: 2px; }

        /* Quantity display */
        .qty-block { text-align: center; flex-shrink: 0; }
        .qty-main {
            font-size: 22px;
            font-weight: 800;
            line-height: 1;
        }
        .qty-main.ok   { color: var(--success); }
        .qty-main.low  { color: var(--gold); }
        .qty-main.zero { color: var(--danger); }
        .qty-unit { font-size: 10px; color: var(--sub); font-weight: 700; margin-top: 2px; }

        /* Boxes+Pcs breakdown */
        .qty-detail {
            display: flex;
            gap: 5px;
            margin-top: 4px;
            justify-content: flex-end;
        }
        .qty-chip {
            background: rgba(11,94,61,0.07);
            color: var(--accent);
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
        }
        .qty-chip.pcs { background: rgba(88,166,255,0.1); color: #2a7bc8; }

        /* Status dot */
        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .status-dot.ok   { background: var(--success); }
        .status-dot.low  { background: var(--gold); }
        .status-dot.zero { background: var(--danger); }

        /* Divider for zero section */
        .zero-divider {
            padding: 10px 18px;
            background: rgba(228,30,63,0.04);
            border-top: 1px dashed rgba(228,30,63,0.2);
            border-bottom: 1px dashed rgba(228,30,63,0.2);
            font-size: 12px;
            font-weight: 800;
            color: var(--danger);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--sub);
        }
        .spinner {
            width: 36px; height: 36px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .empty { text-align: center; padding: 50px; color: var(--sub); font-weight: 700; }

        /* Error */
        .error-box {
            background: rgba(228,30,63,0.08);
            border: 1px solid rgba(228,30,63,0.2);
            border-radius: var(--r);
            padding: 20px;
            text-align: center;
            color: var(--danger);
            font-weight: 700;
        }
    </style>
</head>
<body>

<header>
    <h1>شركة <span>الزيادى</span> | الأصناف</h1>
    <div style="display:flex;align-items:center;gap:12px;">
        <span class="sync-time" id="syncTime"></span>
        <a href="javascript:history.back()" class="back-btn">
            <i class="fas fa-arrow-right"></i> رجوع
        </a>
    </div>
</header>

<div class="stats">
    <div class="stat s-total">
        <div class="stat-num" id="sTotal">—</div>
        <div class="stat-lbl">إجمالي الأصناف</div>
    </div>
    <div class="stat s-ok">
        <div class="stat-num" id="sOk">—</div>
        <div class="stat-lbl">متوفر</div>
    </div>
    <div class="stat s-low">
        <div class="stat-num" id="sLow">—</div>
        <div class="stat-lbl">كمية منخفضة</div>
    </div>
    <div class="stat s-zero">
        <div class="stat-num" id="sZero">—</div>
        <div class="stat-lbl">نفد المخزون</div>
    </div>
</div>

<div class="search-wrap">
    <div class="search-inner">
        <i class="fas fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="ابحث عن صنف بالاسم أو الباركود..." oninput="renderList()">
    </div>
</div>

<div class="list-wrap">
    <div class="list-card">
        <div class="list-head">
            <h3><i class="fas fa-boxes-stacked" style="margin-left:8px;"></i>الأصناف مرتبة حسب الكمية</h3>
            <span class="count-badge" id="countBadge"></span>
        </div>
        <div id="listBody">
            <div class="loading">
                <div class="spinner"></div>
                <div>جاري تحميل البيانات من Firebase...</div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
        authDomain: "ahmedelzaiady.firebaseapp.com",
        projectId: "ahmedelzaiady",
        storageBucket: "ahmedelzaiady.firebasestorage.app",
        messagingSenderId: "300306825071",
        appId: "1:300306825071:web:0426ddde56280fa090329a"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);

    let allItems = [];

    // ===== جلب البيانات من Firebase مباشرة =====
    onSnapshot(collection(db, "inventory"), (snap) => {
        allItems = [];
        snap.forEach(d => {
            const data = d.data();
            if (data.isDeleted !== true) {
                allItems.push({ id: d.id, ...data });
            }
        });

        // ترتيب: اللي عندها كمية الأول (تنازلي)، اللي صفر في الآخر
        allItems.sort((a, b) => {
            const qa = Number(a.totalPcs) || 0;
            const qb = Number(b.totalPcs) || 0;
            if (qa === 0 && qb === 0) return (a.name || '').localeCompare(b.name || '', 'ar');
            if (qa === 0) return 1;
            if (qb === 0) return -1;
            return qb - qa;
        });

        updateStats();
        renderList();

        // وقت آخر تحديث
        const now = new Date();
        document.getElementById('syncTime').textContent =
            `آخر تحديث: ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
    }, (err) => {
        document.getElementById('listBody').innerHTML = `
            <div style="padding:20px;">
                <div class="error-box">
                    <i class="fas fa-wifi" style="font-size:28px;margin-bottom:10px;display:block;"></i>
                    خطأ في الاتصال بـ Firebase<br>
                    <small style="font-weight:600;opacity:0.8;">${err.message}</small>
                </div>
            </div>`;
    });

    function updateStats() {
        const total = allItems.length;
        let ok = 0, low = 0, zero = 0;

        allItems.forEach(item => {
            const factor = Number(item.unitFactor) || 1;
            const qty    = Number(item.totalPcs) || 0;
            const min    = (Number(item.min) || 0) * factor;

            if (qty === 0)       zero++;
            else if (qty <= min) low++;
            else                 ok++;
        });

        document.getElementById('sTotal').textContent = total;
        document.getElementById('sOk').textContent    = ok;
        document.getElementById('sLow').textContent   = low;
        document.getElementById('sZero').textContent  = zero;
    }

    window.renderList = function() {
        const term  = document.getElementById('searchInput').value.trim().toLowerCase();
        const items = term
            ? allItems.filter(i =>
                (i.name  || '').toLowerCase().includes(term) ||
                (i.barcode || '').toLowerCase().includes(term))
            : allItems;

        document.getElementById('countBadge').textContent = `${items.length} صنف`;

        if (items.length === 0) {
            document.getElementById('listBody').innerHTML =
                `<div class="empty"><i class="fas fa-box-open" style="font-size:36px;margin-bottom:12px;display:block;opacity:0.3;"></i>لا توجد نتائج</div>`;
            return;
        }

        // فصل اللي عندها كمية عن اللي صفر
        const withQty  = items.filter(i => (Number(i.totalPcs) || 0) > 0);
        const zeroQty  = items.filter(i => (Number(i.totalPcs) || 0) === 0);

        let html = '';
        let rowNum = 1;

        // --- الأصناف الموجودة ---
        withQty.forEach(item => {
            html += buildRow(item, rowNum++, false);
        });

        // --- فاصل قسم النفاد ---
        if (zeroQty.length > 0) {
            html += `<div class="zero-divider">
                <i class="fas fa-triangle-exclamation"></i>
                نفد المخزون — ${zeroQty.length} صنف
            </div>`;
            zeroQty.forEach(item => {
                html += buildRow(item, rowNum++, true);
            });
        }

        document.getElementById('listBody').innerHTML = html;
    };

    function buildRow(item, num, isZero) {
        const factor  = Number(item.unitFactor) || 1;
        const totalPcs = Number(item.totalPcs) || 0;
        const min     = (Number(item.min) || 0) * factor;
        const boxes   = Math.floor(totalPcs / factor);
        const pcs     = totalPcs % factor;

        // حالة الصنف
        let status = 'ok';
        if (totalPcs === 0)       status = 'zero';
        else if (totalPcs <= min) status = 'low';

        // عرض الكمية
        const qtyLabel = totalPcs === 0 ? 'صفر' : totalPcs.toLocaleString();

        // تفاصيل كرتون + قطع (بس لو unitFactor > 1)
        let detailHtml = '';
        if (factor > 1 && totalPcs > 0) {
            detailHtml = `<div class="qty-detail">`;
            if (boxes > 0) detailHtml += `<span class="qty-chip">${boxes} كرتونة</span>`;
            if (pcs   > 0) detailHtml += `<span class="qty-chip pcs">${pcs} قطعة</span>`;
            detailHtml += `</div>`;
        }

        const catHtml   = item.category ? `<span style="margin-left:6px;">${item.category}</span>` : '';
        const priceHtml = item.sell ? ` · ${Number(item.sell).toLocaleString()} ج.م` : '';

        return `
        <div class="item-row${isZero ? ' zero-row' : ''}">
            <span class="item-num">${num}</span>
            <div class="item-icon">
                <i class="fas fa-${isZero ? 'box-open' : 'box'}"></i>
            </div>
            <div class="item-info">
                <div class="item-name">${item.name || 'بدون اسم'}</div>
                <div class="item-meta">${catHtml}${priceHtml}</div>
            </div>
            <div class="qty-block">
                <div class="qty-main ${status}">${qtyLabel}</div>
                <div class="qty-unit">قطعة</div>
                ${detailHtml}
            </div>
            <div class="status-dot ${status}"></div>
        </div>`;
    }
</script>
</body>
</html>
