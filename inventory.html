<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة الزيادى | الأصناف</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #f0f4f2;
            --card: #ffffff;
            --accent: #0b5e3d;
            --accent-light: #128256;
            --header: #0b5e3d;
            --text: #1b2e26;
            --sub: #7a8f86;
            --danger: #e41e3f;
            --success: #18a34a;
            --gold: #c98a00;
            --border: #e4ede8;
            --shadow: 0 2px 12px rgba(11,94,61,0.07);
            --r: 18px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

        /* ====== HEADER ====== */
        header {
            background: var(--header);
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 3px 16px rgba(0,0,0,0.12);
        }
        .h-title { font-size: 17px; font-weight: 800; color: #fff; line-height: 1.2; text-align: center; }
        .h-title span { color: #ffce31; }
        .h-sub { font-size: 11px; color: rgba(255,255,255,0.65); font-weight: 600; text-align: center; }
        .back-btn {
            background: rgba(255,255,255,0.13);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.22);
            border-radius: 11px;
            padding: 8px 14px;
            font-family: 'Cairo', sans-serif;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            white-space: nowrap;
        }
        .back-btn:hover { background: rgba(255,255,255,0.22); }

        /* ====== STATS ====== */
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 14px 14px 0;
            max-width: 700px;
            margin: 0 auto;
        }
        .stat {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: 15px 12px;
            text-align: center;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }
        .stat::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 3px;
        }
        .stat.s-total::after  { background: var(--accent); }
        .stat.s-ok::after     { background: var(--success); }
        .stat.s-low::after    { background: var(--gold); }
        .stat.s-zero::after   { background: var(--danger); }

        .stat-num { font-size: 30px; font-weight: 900; line-height: 1; }
        .stat-lbl { font-size: 11px; color: var(--sub); font-weight: 700; margin-top: 5px; }
        .stat.s-total .stat-num { color: var(--accent); }
        .stat.s-ok    .stat-num { color: var(--success); }
        .stat.s-low   .stat-num { color: var(--gold); }
        .stat.s-zero  .stat-num { color: var(--danger); }

        /* ====== SEARCH ====== */
        .search-wrap {
            max-width: 700px;
            margin: 12px auto 0;
            padding: 0 14px;
        }
        .search-inner {
            background: var(--card);
            border: 1.5px solid var(--border);
            border-radius: var(--r);
            padding: 11px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: var(--shadow);
            transition: border-color 0.2s;
        }
        .search-inner:focus-within { border-color: var(--accent); }
        .search-inner i { color: var(--sub); font-size: 15px; }
        .search-inner input {
            border: none; background: transparent;
            width: 100%; font-family: 'Cairo', sans-serif;
            font-size: 14px; color: var(--text); outline: none;
        }
        .search-inner input::placeholder { color: #b0bcb6; }

        /* ====== LIST ====== */
        .list-wrap {
            max-width: 700px;
            margin: 12px auto 50px;
            padding: 0 14px;
        }
        .list-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--r);
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        .list-head {
            padding: 13px 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(11,94,61,0.03);
        }
        .list-head h3 { font-size: 14px; font-weight: 800; color: var(--accent); display: flex; align-items: center; gap: 7px; }
        .count-badge {
            background: var(--accent);
            color: #fff;
            font-size: 11px;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 20px;
        }

        /* ====== ITEM ROW ====== */
        .item-row {
            display: flex;
            align-items: center;
            padding: 13px 16px;
            border-bottom: 1px solid var(--border);
            gap: 12px;
            transition: background 0.12s;
            position: relative;
        }
        .item-row:last-child { border-bottom: none; }
        .item-row:active { background: rgba(11,94,61,0.04); }
        .item-row.zero-row { background: rgba(228,30,63,0.025); }

        /* رقم */
        .row-num {
            font-size: 11px;
            color: #c0ccc7;
            font-weight: 800;
            min-width: 20px;
            text-align: center;
        }

        /* أيقونة */
        .row-icon {
            width: 42px; height: 42px;
            border-radius: 13px;
            display: flex; align-items: center; justify-content: center;
            font-size: 17px;
            flex-shrink: 0;
            background: rgba(11,94,61,0.08);
            color: var(--accent);
        }
        .zero-row .row-icon { background: rgba(228,30,63,0.08); color: var(--danger); }
        .low-row  .row-icon { background: rgba(201,138,0,0.09); color: var(--gold); }

        /* معلومات */
        .row-info { flex: 1; min-width: 0; }
        .row-name {
            font-size: 15px;
            font-weight: 800;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.3;
        }
        .row-meta {
            font-size: 11px;
            color: var(--sub);
            font-weight: 600;
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .cat-tag {
            background: rgba(11,94,61,0.07);
            color: var(--accent-light);
            padding: 1px 7px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
        }

        /* الكمية — العمود الأساسي */
        .row-qty { text-align: center; flex-shrink: 0; min-width: 90px; }

        /* كرتونة كبيرة */
        .qty-boxes {
            font-size: 22px;
            font-weight: 900;
            line-height: 1;
        }
        .qty-boxes.ok   { color: var(--success); }
        .qty-boxes.low  { color: var(--gold); }
        .qty-boxes.zero { color: var(--danger); }

        .qty-boxes-lbl {
            font-size: 11px;
            font-weight: 700;
            color: var(--sub);
            margin-top: 1px;
        }

        /* الجركن المتبقي */
        .qty-extra {
            margin-top: 5px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(88,166,255,0.1);
            color: #2272b8;
            border-radius: 8px;
            padding: 2px 9px;
            font-size: 12px;
            font-weight: 800;
        }

        /* نقطة الحالة */
        .status-dot {
            width: 9px; height: 9px;
            border-radius: 50%;
            flex-shrink: 0;
            margin-right: 2px;
        }
        .status-dot.ok   { background: var(--success); box-shadow: 0 0 6px rgba(24,163,74,0.5); }
        .status-dot.low  { background: var(--gold);    box-shadow: 0 0 6px rgba(201,138,0,0.4); }
        .status-dot.zero { background: var(--danger);  box-shadow: 0 0 6px rgba(228,30,63,0.4); }

        /* ====== فاصل النفاد ====== */
        .zero-divider {
            padding: 10px 18px;
            background: rgba(228,30,63,0.05);
            border-top: 1px dashed rgba(228,30,63,0.25);
            border-bottom: 1px dashed rgba(228,30,63,0.25);
            font-size: 12px;
            font-weight: 800;
            color: var(--danger);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .zero-divider span { 
            background: rgba(228,30,63,0.12); 
            padding: 2px 10px; 
            border-radius: 10px; 
        }

        /* ====== Loading / Empty ====== */
        .loading { text-align: center; padding: 55px 20px; color: var(--sub); }
        .spinner {
            width: 38px; height: 38px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
            margin: 0 auto 14px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading p { font-size: 14px; font-weight: 700; }

        .empty-state { text-align: center; padding: 55px 20px; color: var(--sub); }
        .empty-state i { font-size: 40px; opacity: 0.25; display: block; margin-bottom: 12px; }
        .empty-state p { font-size: 14px; font-weight: 700; }

        .err-box {
            margin: 16px;
            background: rgba(228,30,63,0.07);
            border: 1px solid rgba(228,30,63,0.2);
            border-radius: var(--r);
            padding: 22px;
            text-align: center;
            color: var(--danger);
            font-weight: 700;
        }
        .err-box i { font-size: 30px; display: block; margin-bottom: 10px; }
    </style>
</head>
<body>

<header>
    <div style="width:80px;"></div>
    <div>
        <div class="h-title">شركة <span>الزيادى</span> | الأصناف</div>
        <div class="h-sub" id="syncTime">جاري التحميل...</div>
    </div>
    <a href="javascript:history.back()" class="back-btn">
        <i class="fas fa-arrow-right"></i> رجوع
    </a>
</header>

<div class="stats">
    <div class="stat s-total">
        <div class="stat-num" id="sTotal">—</div>
        <div class="stat-lbl">إجمالي الأصناف</div>
    </div>
    <div class="stat s-ok">
        <div class="stat-num" id="sOk">—</div>
        <div class="stat-lbl">متوفر</div>
    </div>
    <div class="stat s-low">
        <div class="stat-num" id="sLow">—</div>
        <div class="stat-lbl">كمية منخفضة</div>
    </div>
    <div class="stat s-zero">
        <div class="stat-num" id="sZero">—</div>
        <div class="stat-lbl">نفد المخزون</div>
    </div>
</div>

<div class="search-wrap">
    <div class="search-inner">
        <i class="fas fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="ابحث بالاسم أو الباركود..." oninput="renderList()">
    </div>
</div>

<div class="list-wrap">
    <div class="list-card">
        <div class="list-head">
            <h3><i class="fas fa-boxes-stacked"></i> الأصناف</h3>
            <span class="count-badge" id="countBadge">—</span>
        </div>
        <div id="listBody">
            <div class="loading">
                <div class="spinner"></div>
                <p>جاري التحميل من Firebase...</p>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp }    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot }
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey:            "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
        authDomain:        "ahmedelzaiady.firebaseapp.com",
        projectId:         "ahmedelzaiady",
        storageBucket:     "ahmedelzaiady.firebasestorage.app",
        messagingSenderId: "300306825071",
        appId:             "1:300306825071:web:0426ddde56280fa090329a"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);
    let allItems = [];

    // ===== Firebase listener =====
    onSnapshot(collection(db, "inventory"), snap => {
        allItems = [];
        snap.forEach(d => {
            const data = d.data();
            if (data.isDeleted !== true) allItems.push({ id: d.id, ...data });
        });

        // ترتيب: الأكثر كرتونات الأول — الصفر في الآخر
        allItems.sort((a, b) => {
            const ba = Number(a.boxes) || 0;
            const bb = Number(b.boxes) || 0;
            if (ba === 0 && bb === 0) return (a.name||'').localeCompare(b.name||'', 'ar');
            if (ba === 0) return 1;
            if (bb === 0) return -1;
            return bb - ba;
        });

        updateStats();
        renderList();

        const now = new Date();
        document.getElementById('syncTime').textContent =
            `آخر تحديث: ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;

    }, err => {
        document.getElementById('listBody').innerHTML = `
            <div class="err-box">
                <i class="fas fa-wifi"></i>
                خطأ في الاتصال بـ Firebase<br>
                <small style="font-weight:600;opacity:0.75;">${err.message}</small>
            </div>`;
    });

    // ===== Stats =====
    function updateStats() {
        let ok = 0, low = 0, zero = 0;
        allItems.forEach(item => {
            const boxes   = Number(item.boxes)  || 0;
            const minBoxes = Number(item.min)   || 0;
            if (boxes === 0)          zero++;
            else if (boxes <= minBoxes) low++;
            else                      ok++;
        });
        document.getElementById('sTotal').textContent = allItems.length;
        document.getElementById('sOk').textContent    = ok;
        document.getElementById('sLow').textContent   = low;
        document.getElementById('sZero').textContent  = zero;
    }

    // ===== Render =====
    window.renderList = function() {
        const term = document.getElementById('searchInput').value.trim().toLowerCase();
        const list = term
            ? allItems.filter(i =>
                (i.name   || '').toLowerCase().includes(term) ||
                (i.barcode|| '').toLowerCase().includes(term))
            : allItems;

        document.getElementById('countBadge').textContent = list.length + ' صنف';

        if (list.length === 0) {
            document.getElementById('listBody').innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-box-open"></i>
                    <p>لا توجد نتائج مطابقة</p>
                </div>`;
            return;
        }

        const withQty = list.filter(i => (Number(i.boxes) || 0) > 0);
        const zeroQty = list.filter(i => (Number(i.boxes) || 0) === 0);

        let html = '';
        let n = 1;

        withQty.forEach(item => { html += buildRow(item, n++); });

        if (zeroQty.length > 0) {
            html += `
                <div class="zero-divider">
                    <i class="fas fa-triangle-exclamation"></i>
                    <span>نفد المخزون — ${zeroQty.length} صنف</span>
                </div>`;
            zeroQty.forEach(item => { html += buildRow(item, n++); });
        }

        document.getElementById('listBody').innerHTML = html;
    };

    function buildRow(item, num) {
        const boxes    = Number(item.boxes) || 0;
        const pcs      = Number(item.pcs)   || 0;   // الجركن / القطع المتبقية
        const minBoxes = Number(item.min)   || 0;

        // حالة
        let status = 'ok';
        if (boxes === 0)           status = 'zero';
        else if (boxes <= minBoxes) status = 'low';

        const isZero = status === 'zero';
        const isLow  = status === 'low';

        // عرض الكرتونات
        const boxesDisplay = isZero ? 'صفر' : boxes.toLocaleString();

        // عرض الجركن المتبقي (لو موجود وأكبر من صفر)
        const extraHtml = (pcs > 0 && !isZero)
            ? `<div class="qty-extra"><i class="fas fa-flask" style="font-size:10px;"></i>${pcs} جركن</div>`
            : '';

        // فئة ومعلومات إضافية
        const catHtml   = item.category
            ? `<span class="cat-tag">${item.category}</span>` : '';
        const priceHtml = item.sell
            ? `<span>${Number(item.sell).toLocaleString()} ج.م</span>` : '';

        return `
        <div class="item-row${isZero ? ' zero-row' : isLow ? ' low-row' : ''}">
            <span class="row-num">${num}</span>
            <div class="row-icon">
                <i class="fas fa-${isZero ? 'box-open' : 'box'}"></i>
            </div>
            <div class="row-info">
                <div class="row-name">${item.name || 'بدون اسم'}</div>
                <div class="row-meta">${catHtml}${priceHtml}</div>
            </div>
            <div class="row-qty">
                <div class="qty-boxes ${status}">${boxesDisplay}</div>
                <div class="qty-boxes-lbl">كرتونة</div>
                ${extraHtml}
            </div>
            <div class="status-dot ${status}"></div>
        </div>`;
    }
</script>
</body>
</html>
