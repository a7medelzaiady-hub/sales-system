<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>تجميع الأصناف المطلوبة - شركة الزيادي</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
  --accent: #0b5e3d;
  --header-bg: #0b5e3d;
  --bg-light: #f4f7f6;
  --text-primary: #1b2e26;
  --text-secondary: #4a5568;
  --border: #dce3de;
  --white: #ffffff;
  --danger: #d90429;
  --warning: #ffb703;
  --card-radius: 14px;
}

* { box-sizing: border-box !important; }

html, body {
  max-width: 100%;
  overflow-x: hidden;
  background: var(--bg-light);
  font-family: 'Cairo', sans-serif;
  color: var(--text-primary);
  padding-bottom: 80px;
  margin: 0;
}

.header-nav {
  background: var(--header-bg);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  color: white;
  position: sticky;
  top: 0;
  z-index: 1000;
}

.nav-btn {
  background: rgba(255,255,255,0.15);
  width: 34px; height: 34px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  color: white; text-decoration: none; border: none; cursor: pointer;
  transition: background 0.2s;
  font-size: 0.85rem;
}
.nav-btn:hover { background: rgba(255,255,255,0.25); color: white; }

.search-bar-wrap {
  padding: 12px 14px 0;
  position: relative;
}
.search-bar-wrap input {
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 8px 36px 8px 12px;
  font-family: 'Cairo', sans-serif;
  font-weight: 600;
  font-size: 0.8rem;
  width: 100%;
  background: white;
  color: var(--text-primary);
  outline: none;
}
.search-bar-wrap input:focus { border-color: var(--accent); }
.search-icon {
  position: absolute;
  right: 24px; top: 50%;
  transform: translateY(-50%);
  color: #94a3b8;
  font-size: 0.8rem;
  margin-top: 6px;
}

.summary-cards-container {
  padding: 12px 14px;
}

.item-summary-card {
  background: white;
  border: 1.5px solid var(--border);
  border-radius: var(--card-radius);
  padding: 12px 14px;
  margin-bottom: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.03);
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.item-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #f0f0f0;
  padding-bottom: 6px;
}

.item-title {
  font-size: 0.88rem;
  font-weight: 800;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 6px;
}

.total-required-badge {
  background: #e0f2fe;
  color: #0369a1;
  font-weight: 800;
  font-size: 0.8rem;
  padding: 3px 10px;
  border-radius: 8px;
  border: 1px solid #bae6fd;
}

.stock-comparison-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 0.75rem;
  font-weight: 700;
  background: #f8fafc;
  padding: 6px 10px;
  border-radius: 8px;
}

.status-tag {
  font-size: 0.7rem;
  font-weight: 800;
  padding: 2px 8px;
  border-radius: 6px;
}
.status-tag.surplus { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
.status-tag.deficit { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
.status-tag.exact { background: #fef3c7; color: #b45309; border: 1px solid #fde047; }

.loading-state, .empty-state {
  text-align: center;
  padding: 50px 20px;
  font-size: 0.8rem;
}

.spinner {
  width: 32px; height: 32px;
  border: 3px solid #e2e8f0;
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  margin: 0 auto 10px;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="header-nav">
  <a href="all-orders.html" class="nav-btn">
    <i class="fas fa-arrow-right"></i>
  </a>
  <h6 class="m-0 fw-bold d-flex align-items-center gap-2" style="font-size: 0.82rem;">
    <i class="fas fa-boxes-stacked"></i>
    <span>تجميع الأصناف المطلوبة</span>
    <span class="badge" style="background: rgba(255,255,255,0.2); font-size: 0.6rem; padding: 2px 5px;" id="totalTypesBadge">0</span>
  </h6>
  <a href="index.html" class="nav-btn">
    <i class="fas fa-home"></i>
  </a>
</div>

<div class="search-bar-wrap">
  <i class="fas fa-search search-icon"></i>
  <input type="text" id="searchInput" placeholder="ابحث باسم الصنف..." oninput="filterSummary()">
</div>

<div class="summary-cards-container" id="summaryList">
  <div class="loading-state">
    <div class="spinner"></div>
    <p style="color: #94a3b8; font-size: 0.75rem; font-weight: 700;">جاري جلب وحساب الأصناف...</p>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
  authDomain: "ahmedelzaiady.firebaseapp.com",
  projectId: "ahmedelzaiady",
  storageBucket: "ahmedelzaiady.firebasestorage.app",
  messagingSenderId: "300306825071",
  appId: "1:300306825071:web:0426ddde56280fa090329a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let groupedItems = [];

async function loadAndCalculateRequiredItems() {
  try {
    const [ordersSnap, inventorySnap] = await Promise.all([
      getDocs(query(collection(db, "orders"), where("status", "==", "pending"))),
      getDocs(collection(db, "inventory"))
    ]);

    // خريطة المخزون المتوفر
    const inventoryMap = {};
    inventorySnap.forEach(docSnap => {
      const data = docSnap.data();
      const name = (data.name || '').trim().toLowerCase();
      inventoryMap[name] = Number(data.totalPcs || 0);
    });

    // تجميع الأصناف المطلوبة من الطلبيات المعلقة
    const totals = {};

    ordersSnap.forEach(docSnap => {
      const order = docSnap.data();
      if (order.items && Array.isArray(order.items)) {
        order.items.forEach(item => {
          const rawName = (item.name || 'صنف غير معروف').trim();
          const key = rawName.toLowerCase();
          const qty = Number(item.quantity || item.qty || 0);

          if (!totals[key]) {
            totals[key] = {
              displayName: rawName,
              requiredQty: 0
            };
          }
          totals[key].requiredQty += qty;
        });
      }
    });

    groupedItems = Object.keys(totals).map(key => {
      const item = totals[key];
      const stockQty = inventoryMap[key] !== undefined ? inventoryMap[key] : null;
      return {
        name: item.displayName,
        requiredQty: item.requiredQty,
        stockQty: stockQty
      };
    });

    groupedItems.sort((a, b) => b.requiredQty - a.requiredQty);

    document.getElementById('totalTypesBadge').innerText = groupedItems.length;
    renderSummary();

  } catch (e) {
    console.error("خطأ أثناء تجميع الأصناف:", e);
    document.getElementById('summaryList').innerHTML = `<div class="empty-state"><h6>حدث خطأ أثناء تحميل البيانات</h6></div>`;
  }
}

window.filterSummary = () => renderSummary();

function renderSummary() {
  const term = document.getElementById('searchInput').value.trim().toLowerCase();
  const container = document.getElementById('summaryList');

  let filtered = groupedItems.filter(item => item.name.toLowerCase().includes(term));

  if (!filtered.length) {
    container.innerHTML = `<div class="empty-state"><h6>لا توجد أصناف مطلوبة في الطلبيات المعلقة</h6></div>`;
    return;
  }

  let html = '';
  filtered.forEach(item => {
    let stockInfoHTML = '';

    if (item.stockQty !== null) {
      const diff = item.stockQty - item.requiredQty;
      let statusTag = '';

      if (diff > 0) {
        statusTag = `<span class="status-tag surplus"><i class="fas fa-plus-circle"></i> فائض بالمخزن: ${diff}</span>`;
      } else if (diff < 0) {
        statusTag = `<span class="status-tag deficit"><i class="fas fa-minus-circle"></i> عجز بالمخزن: ${Math.abs(diff)}</span>`;
      } else {
        statusTag = `<span class="status-tag exact"><i class="fas fa-check"></i> الكمية بالظبط</span>`;
      }

      stockInfoHTML = `
        <div class="stock-comparison-row">
          <span>المتوفر بالمخزن: <b>${item.stockQty}</b></span>
          ${statusTag}
        </div>
      `;
    }

    html += `
      <div class="item-summary-card">
        <div class="item-header">
          <div class="item-title">
            <i class="fas fa-box" style="color: var(--accent);"></i>
            <span>${item.name}</span>
          </div>
          <div class="total-required-badge">
            المطلوب: ${item.requiredQty}
          </div>
        </div>
        ${stockInfoHTML}
      </div>
    `;
  });

  container.innerHTML = html;
}

loadAndCalculateRequiredItems();
</script>
</body>
</html>
