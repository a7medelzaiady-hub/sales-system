<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة المخزن والأصناف - شركة الزيادي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root { 
            --accent: #0b5e3d; 
            --accent-deep: #073e29;
            --header-bg: linear-gradient(135deg, #073e29, #0b5e3d 80%);
            --bg-light: #f8fafc;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --white: #ffffff;
            --border: #e2e8f0;
            --danger: #e11d48;
            --danger-bg: #fff1f2;
            --success: #16a34a;
            --success-bg: #f0fdf4;
            --warning: #f59e0b;
            --warning-bg: #fef3c7;
            --card-radius: 20px;
            --input-radius: 12px;
            --shadow-sm: 0 2px 10px rgba(11,40,28, 0.04);
        }

        body { 
            background: var(--bg-light); 
            font-family: 'Cairo', sans-serif; 
            color: var(--text-primary); 
            padding-bottom: 60px; 
            font-size: 0.88rem;
            -webkit-font-smoothing: antialiased;
        }

        .num { 
            font-family: 'JetBrains Mono', monospace; 
            font-weight: 700; 
        }
        
        /* ===== الهيدر العلوي ===== */
        .header-section { 
            background: var(--header-bg); 
            padding: 14px 16px;
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            color: white;
            box-shadow: 0 4px 15px rgba(7, 62, 41, 0.15);
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
        }
        .header-container { display: flex; justify-content: space-between; align-items: center; }
        
        .btn-action { 
            width: 38px; height: 38px; border-radius: 12px; 
            border: 1px solid rgba(255,255,255,0.2); 
            background: rgba(255,255,255,0.15); color: #fff; 
            transition: all 0.2s ease; font-size: 0.95rem;
            display: inline-flex; align-items: center; justify-content: center;
            text-decoration: none;
        }
        .btn-action:hover { background: #fff; color: var(--accent); }

        .card-custom {
            background: var(--white); 
            border-radius: var(--card-radius); 
            padding: 16px; 
            margin: 12px 0; 
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }

        /* ===== نظام كروت الموبايل المتجاوب ===== */
        .item-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 10px;
            box-shadow: var(--shadow-sm);
            border-right: 5px solid var(--border);
            transition: transform 0.2s;
        }
        /* تلوين حواف الكروت حسب حالة الأولوية والكمية */
        .item-priority-available { border-right-color: var(--success) !important; }
        .item-priority-negative { border-right-color: var(--danger) !important; }
        .item-priority-zero { border-right-color: var(--text-secondary) !important; }

        .badge-qty {
            padding: 4px 10px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 0.78rem;
        }
        .badge-available { background-color: var(--success-bg); color: var(--success); }
        .badge-negative { background-color: var(--danger-bg); color: var(--danger); }
        .badge-zero { background-color: #f1f5f9; color: var(--text-secondary); }

        .search-input-custom {
            padding: 10px 14px; 
            font-size: 0.88rem !important; 
            border-radius: var(--input-radius); 
            font-family: 'Cairo', sans-serif; 
            font-weight: 700; 
            border: 1px solid var(--border);
        }
        .search-input-custom:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(11, 94, 97, 0.08);
            outline: none;
        }
    </style>
</head>
<body>

<div>
    <!-- الهيدر العلوي -->
    <div class="header-section">
        <div class="header-container container p-0">
            <div class="nav-btns d-flex gap-2">
                <a href="index.html" class="btn-action" title="الصفحة الرئيسية"><i class="fas fa-home"></i></a>
                <button class="btn-action" onclick="exportInventoryToExcel()" title="تصدير إكسل"><i class="fas fa-file-excel"></i></button>
            </div>
            <div class="title-area text-center flex-grow-1">
                <h6 class="fw-bold m-0" style="font-size: 1rem; font-weight: 900;"><i class="fas fa-boxes me-1"></i> قائمة الأصناف والمخزن</h6>
            </div>
            <a href="javascript:history.back()" class="btn-action d-flex align-items-center justify-content-center text-decoration-none">
                <i class="fas fa-arrow-right"></i>
            </a>
        </div>
    </div>

    <div class="container px-2 mt-2">
        <!-- خانة البحث السريع المريحة للموبايل -->
        <div class="card-custom py-2">
            <div class="position-relative">
                <input type="text" class="form-control search-input-custom" id="inventorySearchInput" placeholder="بحث سريع باسم الصنف أو الكود..." autocomplete="off">
                <i class="fas fa-search position-absolute text-muted" style="left: 14px; top: 14px; font-size: 0.9rem;"></i>
            </div>
        </div>

        <!-- ملخص إحصائي سريع للمخزن -->
        <div class="row g-2 px-1 mb-1 text-center">
            <div class="col-6">
                <div class="bg-white p-2 rounded border shadow-sm">
                    <span class="small fw-bold text-muted d-block">إجمالي الأنواع</span>
                    <span id="totalItemsCount" class="fw-bold text-dark num">0</span>
                </div>
            </div>
            <div class="col-6">
                <div class="bg-white p-2 rounded border shadow-sm">
                    <span class="small fw-bold text-muted d-block">أصناف متوفرة</span>
                    <span id="availableItemsCount" class="fw-bold text-success num">0</span>
                </div>
            </div>
        </div>

        <!-- حاوية عرض كروت المخزن بالأولويات المسندة -->
        <div id="inventoryCardsContainer">
            <div class="text-center py-5">
                <div class="spinner-border text-success spinner-border-sm"></div> جاري ترتيب وفحص جرد المخزن...
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
        authDomain: "ahmedelzaiady.firebaseapp.com",
        projectId: "ahmedelzaiady",
        storageBucket: "ahmedelzaiady.firebasestorage.app",
        messagingSenderId: "300306825071",
        appId: "1:300306825071:web:0426ddde56280fa090329a",
        measurementId: "G-WE04GK5XZZ"
    };
    
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let rawInventoryData = [];

    // دالة فرز وتصنيف الأصناف بناءً على أولوية الكمية المتاحة (عدد -> سالب -> صفر)
    function sortInventoryByPriority(itemsList) {
        return itemsList.sort((a, b) => {
            // دعم قراءة حقل الكمية سواء كان كرتونة أو قطع أو كمية إجمالية
            const qtyA = parseFloat(a.quantity || a.qty || a.totalQty || a.cartonQty || 0);
            const qtyB = parseFloat(b.quantity || b.qty || b.totalQty || b.cartonQty || 0);

            // تحديد فئة العنصر A (1: موجب/به عدد، 2: سالب/مكشوف، 3: صفر/منتهي)
            let categoryA = qtyA > 0 ? 1 : (qtyA < 0 ? 2 : 3);
            let categoryB = qtyB > 0 ? 1 : (qtyB < 0 ? 2 : 3);

            // الترتيب الأساسي حسب فئة الأولوية
            if (categoryA !== categoryB) {
                return categoryA - categoryB;
            }

            // إذا كان كلاهما به عدد (موجب) -> رتب تنازلياً من الأعلى للأسفل
            if (categoryA === 1) {
                return qtyB - qtyA; 
            }
            
            // إذا كان كلاهما مكشوف (سالب) -> رتب تصاعدياً لعرض العجز الأكبر أولاً
            if (categoryA === 2) {
                return qtyA - qtyB; 
            }

            // إذا كان كلاهما صفر -> رتب أبجدياً حسب اسم الصنف
            return String(a.name).localeCompare(String(b.name));
        });
    }

    // جلب البيانات الأصلية من الفايرستور
    async function loadInventoryData() {
        try {
            const querySnapshot = await getDocs(collection(db, "products")); // أو اسم الجدول collection(db, "inventory") حسب تسمية قاعدة بياناتك
            rawInventoryData = [];
            
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                rawInventoryData.push({
                    id: doc.id,
                    name: data.name || 'صنف بدون اسم',
                    code: data.code || '---',
                    // جلب حقول الكميات والكراتين المدعومة في نظام سيارات الزيادي
                    cartonQty: parseFloat(data.cartonQty || 0),
                    jerrycanQty: parseFloat(data.jerrycanQty || 0),
                    // حساب الكمية الحركية المعتمدة للفرز
                    quantity: parseFloat(data.quantity !== undefined ? data.quantity : (data.cartonQty || 0))
                });
            });

            // تحديث الإحصائيات الفورية
            document.getElementById('totalItemsCount').innerText = rawInventoryData.length;
            document.getElementById('availableItemsCount').innerText = rawInventoryData.filter(i => i.quantity > 0).length;

            filterAndRender();

        } catch (error) {
            console.error("حدث خطأ أثناء تحميل مخزن الأصناف:", error);
            document.getElementById('inventoryCardsContainer').innerHTML = `
                <div class="text-center py-4 text-danger fw-bold border rounded bg-white">
                    <i class="fas fa-exclamation-triangle mb-2"></i><br>فشل اتصال قاعدة البيانات بجدول الأصناف
                </div>
            `;
        }
    }

    // فلترة وعرض الكروت بناءً على نص البحث والأولويات الحسابية
    function filterAndRender() {
        const searchTerm = document.getElementById('inventorySearchInput').value.toLowerCase().trim();
        const container = document.getElementById('inventoryCardsContainer');
        container.innerHTML = '';

        // تصفية أولية حسب نص البحث
        let filtered = rawInventoryData.filter(item => 
            item.name.toLowerCase().includes(searchTerm) || item.code.toLowerCase().includes(searchTerm)
        );

        // تطبيق الفرز السحري (الموجب أولاً -> السالب في المنتصف -> الصفر في القاع)
        const prioritizedData = sortInventoryByPriority(filtered);

        if (prioritizedData.length === 0) {
            container.innerHTML = `
                <div class="text-center py-5 text-muted fw-bold border rounded bg-white shadow-sm">
                    <i class="fas fa-search-minus fa-2x mb-2" style="color:#cbd5e1;"></i><br>لا توجد أصناف مطابقة للبحث حالياً
                </div>
            `;
            return;
        }

        let htmlContent = '';
        prioritizedData.forEach(item => {
            let priorityClass = 'item-priority-zero';
            let badgeClass = 'badge-zero';
            let statusText = 'مُنتهي (0)';

            if (item.quantity > 0) {
                priorityClass = 'item-priority-available';
                badgeClass = 'badge-available';
                statusText = 'متوفر عدد';
            } else if (item.quantity < 0) {
                priorityClass = 'item-priority-negative';
                badgeClass = 'badge-negative';
                statusText = 'مكشوف (سالب)';
            }

            htmlContent += `
                <div class="item-card ${priorityClass}">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <div class="fw-bold fs-6 text-dark" style="max-width: 70%; line-height: 1.4;">${item.name}</div>
                        <span class="badge-qty ${badgeClass}">${statusText}</span>
                    </div>
                    <div class="row g-1 text-muted small border-top pt-2 mt-2">
                        <div class="col-6">
                            <span>كود الصنف:</span> <b class="text-dark num">${item.code}</b>
                        </div>
                        <div class="col-6 text-end">
                            <span>جرد الكراتين:</span> <b class="text-success num fs-6">${item.cartonQty}</b> ك
                        </div>
                        <div class="col-12 text-end mt-1">
                            <span>جرد القطع/الجركن:</span> <b class="text-primary num">${item.jerrycanQty}</b> جركـن
                        </div>
                    </div>
                </div>
            `;
        });

        container.innerHTML = htmlContent;
    }

    // تفعيل البحث الفوري السلس أثناء الكتابة من الموبايل
    document.getElementById('inventorySearchInput').addEventListener('input', filterAndRender);

    // تدوين دالة التصدير لملفات الإكسل المنظمة للأصناف
    window.exportInventoryToExcel = () => {
        if (rawInventoryData.length === 0) { alert("لا توجد بيانات بالمخزن لتصديرها."); return; }
        
        const excelRows = [["كود الصنف", "اسم الصنف والمنتج", "جرد الكراتين الحالية", "جرد القطع / الجركن", "حالة الأولوية المعتمدة"]];
        
        // تصدير الأصناف بنفس الترتيب ذو الأولوية المعروضة أمام المستخدم
        const sortedForExcel = sortInventoryByPriority([...rawInventoryData]);

        sortedForExcel.forEach(item => {
            let status = item.quantity > 0 ? "متوفر" : (item.quantity < 0 ? "مكشوف بالسالب" : "منتهي صفر");
            excelRows.push([item.code, item.name, item.cartonQty, item.jerrycanQty, status]);
        });

        const ws = XLSX.utils.aoa_to_sheet(excelRows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "جرد مخزن الزيادي");
        ws['!dir'] = "rtl";
        XLSX.writeFile(wb, `جرد_مخزن_الزيادي_${new Date().toISOString().split('T')[0]}.xlsx`);
    };

    // التشغيل الفوري عند فتح الصفحة
    loadInventoryData();
</script>
</body>
</html>
