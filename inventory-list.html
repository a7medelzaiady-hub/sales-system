
<!DOCTYPE html>

<html lang="ar" dir="rtl"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>قائمة الجرد - شركة الزيادي</title> <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css"> <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet"> <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> <style> :root { --bg-dark: #0d1117; --glass: rgba(255,255,255,0.05); --neon-blue: #58a6ff; --neon-red: #f85149; --neon-green: #3fb950; --neon-gold: #d4a373; }

    body { background: var(--bg-dark); font-family: 'Cairo', sans-serif; color: #ffffff; padding-bottom: 50px; }
    .stat-card { background: var(--glass); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; padding: 15px; text-align: center; height: 100%; }
    .stat-value { font-size: 1.4rem; font-weight: 700; display: block; }
    .inventory-container { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; overflow: hidden; }
    .search-box { background: rgba(255, 255, 255, 0.05) !important; border: 1px solid rgba(255,255,255,0.1) !important; color: white !important; border-radius: 12px; }
    .table { color: #ffffff !important; margin-bottom: 0; background: transparent !important; white-space: nowrap; }
    .table thead th { background: rgba(255, 255, 255, 0.05) !important; color: var(--neon-blue) !important; border-bottom: 1px solid rgba(255,255,255,0.1) !important; padding: 15px; }
    .table tbody td { background: transparent !important; padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05) !important; color: #ffffff !important; }
    
    /* تجربة النقر على السطر */
    .table tbody tr { cursor: pointer; transition: background 0.2s; }
    .table tbody tr:hover { background: rgba(255,255,255,0.03) !important; }
    
    .low-stock-row { background: rgba(248, 81, 73, 0.1) !important; border-right: 4px solid var(--neon-red); }
    .action-btn { width: 32px; height: 32px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: white; text-decoration: none; }
    .btn-edit:hover { background: var(--neon-blue); color: #000; }
    .btn-delete:hover { background: var(--neon-red); color: #fff; }
    .price-text { color: var(--neon-blue); font-weight: 700; }
    .total-pcs-text { color: var(--neon-green); font-weight: 700; }
    .qty-badge { background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 6px; font-size: 0.85rem; }
    .load-more-btn { background: var(--neon-blue); color: #000; border: none; font-weight: bold; border-radius: 10px; padding: 10px 25px; transition: 0.3s; }
    .load-more-btn:hover { transform: scale(1.05); filter: brightness(1.2); }

    /* تجميل النافذة المنبثقة لتناسب الوضع الداكن للموقع */
    .modal-content { background: #161b22; border: 1px solid rgba(255,255,255,0.15); border-radius: 18px; color: #fff; }
    .modal-header { border-bottom: 1px solid rgba(255,255,255,0.1); }
    .modal-footer { border-top: 1px solid rgba(255,255,255,0.1); }
    .btn-close { filter: invert(1); }
    
    /* ستايل قائمة الحركات */
    .history-list { max-height: 450px; overflow-y: auto; padding-right: 5px; }
    .tx-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); gap: 10px; }
    .tx-item:last-child { border-bottom: none; }
    .tx-badge { padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; color: #fff; text-align: center; min-width: 70px; }
    .tx-badge.sale { background: var(--neon-green); color: #000; }
    .tx-badge.purchase { background: var(--neon-blue); color: #000; }
    .tx-badge.return { background: var(--neon-gold); color: #000; }
    .tx-details { flex: 1; min-width: 0; }
    .tx-title { font-size: 0.85rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tx-date { font-size: 0.75rem; color: #8b949e; margin-top: 2px; }
    .tx-qty { font-size: 1.1rem; font-weight: bold; }
    .tx-qty.minus { color: var(--neon-red); }
    .tx-qty.plus { color: var(--neon-green); }
    
    /* Spinner */
    .spinner-custom { width: 2.5rem; height: 2.5rem; color: var(--neon-blue); }
</style>
</head> <body>

<div class="container py-4"> <div class="d-flex justify-content-between align-items-center mb-4"> <h4 class="fw-bold m-0 text-white"><i class="fas fa-boxes me-2"></i> قائمة الجرد </h4> <div class="d-flex gap-2 flex-wrap"> <button onclick="cleanDuplicates()" class="btn btn-warning btn-sm px-3 text-dark fw-bold"><i class="fas fa-broom"></i> تنظيف المكرر</button> <button onclick="clearAllInventory()" class="btn btn-danger btn-sm px-3"><i class="fas fa-exclamation-triangle"></i> تصفير المخزن</button> <a href="trash.html" class="btn btn-outline-danger btn-sm px-3"><i class="fas fa-trash-restore"></i> السلة</a> <a href="inventory-menu.html" class="btn btn-outline-light btn-sm px-3">رجوع</a> </div> </div>

<div class="row g-3 mb-4">
    <div class="col-12">
        <div class="stat-card border-bottom border-success border-3">
            <span class="stat-value text-success" id="totalValue">0</span>
            <small>إجمالي قيمة بضاعة المخزن (بسعر الشراء)</small>
        </div>
    </div>
    <div class="col-6">
        <div class="stat-card">
            <span class="stat-value text-white" id="totalItems">0</span>
            <small>عدد الأصناف</small>
        </div>
    </div>
    <div class="col-6">
        <div class="stat-card">
            <span class="stat-value text-danger" id="lowStockCount">0</span>
            <small>أصناف تحت حد الطلب</small>
        </div>
    </div>
</div>

<div class="mb-3 d-flex gap-2">
    <input type="text" id="searchStock" class="form-control search-box" placeholder="بحث سريع بالاسم أو الباركود..." oninput="renderStock()">
    <button class="btn btn-info px-3" onclick="location.href='add-product.html'"><i class="fas fa-plus"></i></button>
</div>

<div class="inventory-container">
    <div class="table-responsive">
        <table class="table text-center align-middle">
            <thead>
                <tr>
                    <th class="text-start">المنتج</th>
                    <th>الفئة</th>
                    <th>الكمية (كرتونة وقطع)</th>
                    <th>إجمالي (قطعة)</th>
                    <th>سعر البيع</th>
                    <th>الحالة</th>
                    <th>إجراء</th>
                </tr>
            </thead>
            <tbody id="stockTable"></tbody>
        </table>
    </div>
</div>
</div>

<div class="modal fade" id="historyModal" tabindex="-1" aria-hidden="true"> <div class="modal-dialog modal-dialog-centered"> <div class="modal-content"> <div class="modal-header"> <h5 class="modal-title fw-bold" id="modalItemName">سجل حركات الصنف</h5> <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button> </div> <div class="modal-body" id="modalBody"> </div> <div class="modal-footer"> <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">إغلاق</button> </div> </div> </div> </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script type="module"> import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"; import { getFirestore, collection, updateDoc, doc, onSnapshot, serverTimestamp, writeBatch, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"; const firebaseConfig = { apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls", authDomain: "ahmedelzaiady.firebaseapp.com", projectId: "ahmedelzaiady", storageBucket: "ahmedelzaiady.firebasestorage.app", messagingSenderId: "300306825071", appId: "1:300306825071:web:0426ddde56280fa090329a", measurementId: "G-WE04GK5XZZ" }; const app = initializeApp(firebaseConfig); const db = getFirestore(app); let inventoryData = []; let displayLimit = 50; let bsModalInstance = null; window.cleanDuplicates = async () => { if (inventoryData.length === 0) { alert("المخزن فارغ حالياً."); return; } const confirmClean = confirm("هل تريد فحص المخزن وحذف الأصناف المكررة ونقلها للسلة؟"); if (!confirmClean) return; try { const batch = writeBatch(db); const seenItems = {}; let duplicateCount = 0; inventoryData.forEach(item => { const uniqueKey = item.barcode ? item.barcode.trim() : item.name.trim().toLowerCase(); if (seenItems[uniqueKey]) { const itemRef = doc(db, "inventory", item.id); batch.update(itemRef, { isDeleted: true, deletedAt: serverTimestamp() }); duplicateCount++; } else { seenItems[uniqueKey] = true; } }); if (duplicateCount > 0) { await batch.commit(); alert(`🚀 تم نقل ${duplicateCount} صنف مكرر للسلة!`); } else { alert("✨ لا توجد أي أصناف مكررة."); } } catch (e) { alert("حدث خطأ أثناء محاولة مسح المكرر."); } }; window.clearAllInventory = async () => { const firstConfirm = confirm("⚠️ تحذير: أنت على وشك حذف جميع الأصناف ونقلها للسلة. هل أنت متأكد؟"); if (!firstConfirm) return; try { const batch = writeBatch(db); inventoryData.forEach(item => { const itemRef = doc(db, "inventory", item.id); batch.update(itemRef, { isDeleted: true, deletedAt: serverTimestamp() }); }); await batch.commit(); alert("تم تصفير المخزن بنجاح."); } catch (e) { alert("حدث خطأ."); } }; function listenToInventory() { onSnapshot(collection(db, "inventory"), (snap) => { inventoryData = []; snap.forEach(docSnap => { const data = docSnap.data(); if (data.isDeleted !== true) { inventoryData.push({ id: docSnap.id, ...data }); } }); updateStats(); renderStock(); }); } function updateStats() { document.getElementById('totalItems').innerText = inventoryData.length; let totalVal = 0; let low = 0; inventoryData.forEach(i => { const factor = Number(i.unitFactor) || 1; const currentTotalPcs = Number(i.totalPcs) || 0; const minTotalPcs = (Number(i.min) || 0) * factor; if (currentTotalPcs <= minTotalPcs) low++; totalVal += (currentTotalPcs / factor) * (Number(i.buy) || 0); }); document.getElementById('lowStockCount').innerText = low; document.getElementById('totalValue').innerText = Math.round(totalVal).toLocaleString() + " EGP"; } window.renderStock = function(isMore = false) { if (!isMore) displayLimit = 50; const term = document.getElementById('searchStock').value.toLowerCase(); const tbody = document.getElementById('stockTable'); const filtered = inventoryData.filter(i => i.name.toLowerCase().includes(term) || (i.barcode && i.barcode.includes(term)) ); const dataToShow = (term === "") ? filtered.slice(0, displayLimit) : filtered; let rowsHtml = ''; dataToShow.forEach(item => { const factor = Number(item.unitFactor) || 1; const totalPcs = Number(item.totalPcs) || 0; const boxes = Math.floor(totalPcs / factor); const pieces = totalPcs % factor; const isLow = totalPcs <= ((Number(item.min) || 0) * factor); let qtyDisplay = `<span class="qty-badge">${boxes} كرتونة</span>`; if(pieces > 0) qtyDisplay += ` <span class="qty-badge text-info">${pieces} قطعة</span>`; const safeName = item.name.replace(/'/g, "\\'"); // أضفنا حدث onclick على السطر بالكامل ما عدا أزرار التعديل والحذف لحماية الإجراءات rowsHtml += ` <tr class="${isLow ? 'low-stock-row' : ''}" onclick="openItemHistory('${item.id}', '${safeName}', event)"> <td class="text-start"> <div class="fw-bold text-white">${item.name}</div> <small class="text-muted" style="font-size:0.7rem">${item.barcode || '---'}</small> </td> <td><span class="badge bg-secondary opacity-75">${item.category || 'عام'}</span></td> <td><div class="d-flex flex-column gap-1">${qtyDisplay}</div></td> <td><span class="total-pcs-text">${totalPcs}</span> <small style="font-size:0.6rem">ق</small></td> <td class="price-text">${Number(item.sell).toLocaleString()}</td> <td><span class="badge ${isLow ? 'bg-danger' : 'bg-success'}">${isLow ? 'ناقص' : 'متوفر'}</span></td> <td> <div class="d-flex gap-2 justify-content-center" onclick="event.stopPropagation()"> <a href="add-product.html?edit=${item.id}" class="action-btn btn-edit"><i class="fas fa-edit"></i></a> <button onclick="softDeleteItem('${item.id}', '${item.name}')" class="action-btn btn-delete"><i class="fas fa-trash"></i></button> </div> </td> </tr> `; }); tbody.innerHTML = rowsHtml; if (filtered.length > displayLimit && term === "") { tbody.innerHTML += ` <tr> <td colspan="7" class="text-center p-4" onclick="event.stopPropagation()"> <button class="load-more-btn" onclick="loadMore()">عرض المزيد (+)</button> <p class="text-muted mt-2 small">يتم عرض ${displayLimit} من أصل ${filtered.length} صنف</p> </td> </tr> `; } }; window.loadMore = () => { displayLimit += 100; renderStock(true); }; window.softDeleteItem = async (id, name) => { if(confirm(`هل أنت متأكد من نقل "${name}" إلى سلة المحذوفات؟`)) { try { await updateDoc(doc(db, "inventory", id), { isDeleted: true, deletedAt: serverTimestamp() }); } catch (e) { alert("حدث خطأ أثناء الحذف"); } } }; // --- الدالة السحرية الجديدة لجلب سجل الحركات من الجداول المكتشفة --- window.openItemHistory = async function(itemId, itemName, event) { if (!bsModalInstance) { bsModalInstance = new bootstrap.Modal(document.getElementById('historyModal')); } document.getElementById('modalItemName').innerText = `حركات الصنف: ${itemName}`; const body = document.getElementById('modalBody'); body.innerHTML = ` <div class="text-center py-4"> <div class="spinner-border spinner-custom" role="status"></div> <p class="text-muted mt-2 small">جاري البحث في حركات المعاملات والطلبات...</p> </div> `; bsModalInstance.show(); try { let matchedLogs = []; const collectionsToSearch = ["transactions", "orders", "purchase_orders"]; for (const colName of collectionsToSearch) { try { const snap = await getDocs(collection(db, colName)); snap.forEach(docSnap => { const d = docSnap.data(); // التحقق الذكي عبر مطابقة المعرف أو الاسم داخل مستندات الجداول المحددة const isMatch = (d.itemId === itemId || d.productId === itemId || d.id === itemId || (d.itemName && d.itemName.trim() === itemName.trim()) || (d.productName && d.productName.trim() === itemName.trim()) || // فحص المصفوفات إن كانت الفاتورة تحتوي على أصناف متعددة بالداخل (d.items && Array.isArray(d.items) && d.items.some(sub => sub.itemId === itemId || sub.id === itemId || sub.name === itemName))); if (isMatch) { // إذا كانت الفاتورة تحتوي على مصفوفة أصناف نأخذ كمية الصنف المحدد فقط let finalQty = d.qty || d.quantity || d.count || 0; if (d.items && Array.isArray(d.items)) { const foundSub = d.items.find(sub => sub.itemId === itemId || sub.id === itemId || sub.name === itemName); if (foundSub) finalQty = foundSub.qty || foundSub.quantity || foundSub.count || finalQty; } matchedLogs.push({ id: docSnap.id, ...d, calculatedQty: finalQty, source: colName }); } }); } catch(e) { console.warn(`الكولكشن ${colName} غير متاح أو فارغ`); } } // ترتيب الحركات تنازلياً حسب التاريخ من الأحدث للأقدم matchedLogs.sort((a, b) => { const dateA = a.date?.toDate ? a.date.toDate() : new Date(a.date || a.createdAt || 0); const dateB = b.date?.toDate ? b.date.toDate() : new Date(b.date || b.createdAt || 0); return dateB - dateA; }); if (matchedLogs.length === 0) { body.innerHTML = ` <div class="text-center text-muted py-4"> <i class="fas fa-history fa-2x mb-2 opacity-50"></i> <p class="small">لم يتم العثور على حركات مسجلة لهذا الصنف في السجلات حالياً.</p> </div>`; return; } let html = '<div class="history-list">'; matchedLogs.forEach(log => { let badgeClass = 'sale'; let typeText = 'بيع'; let sign = '-'; let qtyClass = 'minus'; const type = (log.type || log.status || log.source || '').toLowerCase(); if (type.includes('purchase') || type.includes('شراء') || type.includes('تزويد')) { badgeClass = 'purchase'; typeText = 'شراء'; sign = '+'; qtyClass = 'plus'; } else if (type.includes('return') || type.includes('مرتجع')) { badgeClass = 'return'; typeText = 'مرتجع'; sign = '+'; qtyClass = 'plus'; } let dateDisplay = 'بدون تاريخ'; const rawDate = log.date || log.createdAt; if (rawDate) { const d = rawDate.toDate ? rawDate.toDate() : new Date(rawDate); dateDisplay = d.toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); } let detailsText = log.notes || log.clientName || log.customerName || log.supplierName || 'حركة مستودع'; html += ` <div class="tx-item"> <span class="tx-badge ${badgeClass}">${typeText}</span> <div class="tx-details ms-2 text-end"> <div class="tx-title text-white">${detailsText}</div> <div class="tx-date">${dateDisplay}</div> </div> <div class="tx-qty ${qtyClass}">${sign}${log.calculatedQty}</div> </div> `; }); html += '</div>'; body.innerHTML = html; } catch(err) { body.innerHTML = `<div class="alert alert-danger small m-2">حدث خطأ أثناء جلب الحركات: ${err.message}</div>`; } }; listenToInventory(); </script>

</body> </html>
