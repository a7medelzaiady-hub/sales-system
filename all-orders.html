<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>كل الطلبات - شركة الزيادي</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
:root {
--accent: #0b5e3d;
--header-bg: #0b5e3d;
--bg-light: #f4f7f6;
--text-primary: #1b2e26;
--text-secondary: #4a5568;
--border: #dce3de;
--white: #ffffff;
--danger: #d90429;
--warning: #ffb703;
--card-radius: 16px;
--input-radius: 12px;
}

/* منع الحركة الأفقية نهائياً لثبات الصفحة */
html, body {
max-width: 100%;
overflow-x: hidden;
background: var(--bg-light);
font-family: 'Cairo', sans-serif;
color: var(--text-primary);
padding-bottom: 90px;
margin: 0;
}

.header-nav {
background: var(--header-bg);
padding: 12px 18px;
display: flex;
align-items: center;
justify-content: space-between;
box-shadow: 0 2px 8px rgba(0,0,0,0.15);
color: white;
position: sticky;
top: 0;
z-index: 1000;
}

.nav-btn {
background: rgba(255,255,255,0.15);
width: 38px; height: 38px;
border-radius: 10px;
display: flex; align-items: center; justify-content: center;
color: white; text-decoration: none; border: none; cursor: pointer;
transition: background 0.2s;
}

.search-bar-wrap {
padding: 12px 14px 0;
position: relative;
box-sizing: border-box;
}
.search-bar-wrap input {
border: 1.5px solid var(--border);
border-radius: 12px;
padding: 10px 40px 10px 14px;
font-family: 'Cairo', sans-serif;
font-weight: 600;
font-size: 0.88rem;
width: 100%;
background: white;
color: var(--text-primary);
outline: none;
box-sizing: border-box;
}
.search-icon {
position: absolute;
right: 26px; top: 50%;
transform: translateY(-50%);
color: #94a3b8;
font-size: 0.9rem;
margin-top: 6px;
}

.stats-bar {
display: flex;
gap: 10px;
padding: 12px 14px;
overflow-x: auto;
scrollbar-width: none;
}
.stats-bar::-webkit-scrollbar { display: none; }
.stat-chip {
background: white;
border: 1.5px solid var(--border);
border-radius: 20px;
padding: 5px 14px;
font-size: 0.75rem;
font-weight: 800;
white-space: nowrap;
display: flex;
align-items: center;
gap: 5px;
cursor: pointer;
}
.stat-chip.active {
background: var(--accent);
border-color: var(--accent);
color: white;
}
.stat-chip .chip-num {
background: rgba(255,255,255,0.25);
padding: 1px 7px;
border-radius: 10px;
font-size: 0.7rem;
}
.stat-chip:not(.active) .chip-num {
background: #f1f5f9;
color: var(--text-secondary);
}

/* ضبط الكروت لمنع خروج الأطراف يميناً أو يساراً */
#ordersList {
width: 100%;
box-sizing: border-box;
}

.order-card {
background: white;
border: 1.5px solid var(--border);
border-radius: var(--card-radius);
margin: 0 14px 12px;
overflow: hidden;
box-shadow: 0 2px 8px rgba(0,0,0,0.04);
box-sizing: border-box;
}

.card-header-row {
display: flex;
align-items: center;
justify-content: space-between;
padding: 12px 14px 8px;
border-bottom: 1px solid #f5f5f5;
}

.customer-name {
font-size: 0.95rem;
font-weight: 800;
display: flex;
align-items: center;
gap: 7px;
}
.customer-avatar {
width: 32px; height: 32px;
background: linear-gradient(135deg, #0b5e3d, #1a8a5a);
border-radius: 50%;
display: flex; align-items: center; justify-content: center;
color: white;
font-size: 0.8rem;
font-weight: 800;
}

.status-badge {
font-size: 0.68rem;
font-weight: 800;
padding: 3px 10px;
border-radius: 20px;
}
.status-pending { background: #fff8e1; color: #d97706; border: 1px solid #fde68a; }
.status-done { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }

.card-body-row {
padding: 10px 14px 12px;
}

.days-counter-badge {
font-size: 0.78rem;
font-weight: 700;
padding: 5px 12px;
border-radius: 8px;
display: inline-flex;
align-items: center;
gap: 6px;
margin-bottom: 10px;
}
.days-counter-badge.urgent { background: #ffebee; color: #c62828; }
.days-counter-badge.warning-light { background: #fff3e0; color: #e65100; }
.days-counter-badge.primary-light { background: #e0f2fe; color: #0369a1; }
.days-counter-badge.success-light { background: #e8f5e9; color: #2e7d32; }

.card-footer-row {
display: flex;
align-items: center;
justify-content: space-between;
}

.order-meta {
font-size: 0.72rem;
color: #94a3b8;
font-weight: 600;
display: flex;
align-items: center;
gap: 5px;
}

.order-total {
font-size: 0.88rem;
font-weight: 800;
color: var(--accent);
background: #f0faf4;
padding: 3px 10px;
border-radius: 8px;
}

.action-btn {
border: none;
width: 34px; height: 34px;
border-radius: 10px;
display: inline-flex;
align-items: center; justify-content: center;
font-size: 0.95rem;
cursor: pointer;
}
.action-btn.btn-view-items { background: #f0faf4; color: var(--accent); border: 1px solid #b7dfc7; }

.items-dropdown-table {
background: #fdfdfd;
border: 1px solid var(--border);
border-radius: 10px;
margin-top: 10px;
padding: 8px;
display: none;
}
.items-dropdown-table table {
width: 100%;
margin-bottom: 0;
font-size: 0.78rem;
font-weight: 600;
}

.fab {
position: fixed;
bottom: 20px;
left: 20px;
background: var(--accent);
color: white;
border: none;
border-radius: 50%;
width: 54px; height: 54px;
font-size: 1.3rem;
box-shadow: 0 4px 16px rgba(11,94,61,0.35);
display: flex; align-items: center; justify-content: center;
z-index: 900;
text-decoration: none;
}

.empty-state { text-align: center; padding: 60px 20px; }
.loading-state { text-align: center; padding: 50px 20px; }
.spinner {
width: 36px; height: 36px;
border: 3px solid #e2e8f0;
border-top-color: var(--accent);
border-radius: 50%;
animation: spin 0.7s linear infinite;
margin: 0 auto 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.toast-notification {
position: fixed;
bottom: 25px;
right: 50%;
transform: translateX(50%) translateY(100px);
background: linear-gradient(135deg, #1e293b, #0f172a);
color: #ffffff;
padding: 10px 18px;
border-radius: 30px;
box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
display: flex;
align-items: center;
gap: 12px;
z-index: 2000;
opacity: 0;
transition: all 0.5s ease;
width: calc(100% - 30px);
max-width: 340px;
box-sizing: border-box;
}
.toast-notification.show { transform: translateX(50%) translateY(0); opacity: 1; }
.toast-bell-icon { width: 32px; height: 32px; background: rgba(255, 183, 3, 0.2); color: var(--warning); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.toast-text { font-size: 0.82rem; font-weight: 600; flex-grow: 1; }
.toast-close { background: none; border: none; color: rgba(255, 255, 255, 0.4); cursor: pointer; }
</style>
</head>
<body>

<div class="header-nav">
<a href="index.html" class="nav-btn">
<i class="fas fa-home"></i>
</a>
<h6 class="m-0 fw-bold d-flex align-items-center gap-2" style="font-size: 0.92rem;">
<i class="fas fa-clipboard-list" id="headerIcon"></i>
<span>كل الطلبات</span>
<span class="badge" style="background: rgba(255,255,255,0.2); font-size: 0.7rem; padding: 3px 8px;" id="totalCountBadge">0</span>
</h6>
<a href="customer-orders.html" class="nav-btn">
<i class="fas fa-plus"></i>
</a>
</div>

<div class="search-bar-wrap">
<i class="fas fa-search search-icon"></i>
<input type="text" id="searchInput" placeholder="ابحث باسم العميل أو الصنف..." oninput="filterOrders()">
</div>

<div class="stats-bar" id="statsBar">
<div class="stat-chip active" onclick="setFilter('all', this)">
<i class="fas fa-layer-group"></i>
الكل
<span class="chip-num" id="chipAll">0</span>
</div>
<div class="stat-chip" onclick="setFilter('pending', this)">
<i class="fas fa-clock"></i>
قيد التنفيذ
<span class="chip-num" id="chipPending">0</span>
</div>
<div class="stat-chip" onclick="setFilter('done', this)">
<i class="fas fa-check-circle"></i>
تم الفوترة
<span class="chip-num" id="chipDone">0</span>
</div>
</div>

<div id="ordersList">
<div class="loading-state">
<div class="spinner"></div>
<p style="color: #94a3b8; font-size: 0.85rem; font-weight: 700;">جاري التحميل...</p>
</div>
</div>

<div class="toast-notification" id="orderToastNotification">
<div class="toast-bell-icon"><i class="fas fa-bell"></i></div>
<div class="toast-text" id="toastMessageText">جاري الفحص...</div>
<button class="toast-close" onclick="dismissToast()"><i class="fas fa-times"></i></button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
authDomain: "ahmedelzaiady.firebaseapp.com",
projectId: "ahmedelzaiady",
storageBucket: "ahmedelzaiady.firebasestorage.app",
messagingSenderId: "300306825071",
appId: "1:300306825071:web:0426ddde56280fa090329a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allOrders = [];
let currentFilter = 'all';
const TODAY_DATE = new Date("2026-06-20");

async function init() {
try {
const querySnapshot = await getDocs(collection(db, 'orders'));
allOrders = querySnapshot.docs.map(d => ({ id: d.id, ...d.data() }));

updateChips();
triggerOrderNotification();
renderOrders();
} catch (e) {
console.error("Firebase Error:", e);
document.getElementById('ordersList').innerHTML = `
<div class="empty-state">
<p style="color:#ef4444; font-size:0.85rem; font-weight:bold;">خطأ أثناء الاتصال بقاعدة البيانات</p>
</div>`;
}
}

function updateChips() {
const pending = allOrders.filter(o => o.status === 'pending').length;
const done = allOrders.filter(o => o.status === 'done').length;
document.getElementById('chipAll').innerText = allOrders.length;
document.getElementById('chipPending').innerText = pending;
document.getElementById('chipDone').innerText = done;
document.getElementById('totalCountBadge').innerText = allOrders.length;
}

function triggerOrderNotification() {
const pendingCount = allOrders.filter(o => o.status === 'pending').length;
const toastElement = document.getElementById('orderToastNotification');
const textElement = document.getElementById('toastMessageText');
const icon = document.getElementById('headerIcon');

if (pendingCount > 0) {
if(icon) icon.className = "fas fa-bell text-warning";
textElement.innerHTML = `لديك <span class="fw-bold text-warning">${pendingCount} طلبات معلقة</span> قيد التنفيذ حالياً.`;
toastElement.classList.add('show');
setTimeout(() => { dismissToast(); }, 5000);
}
}

window.dismissToast = () => {
document.getElementById('orderToastNotification').classList.remove('show');
};

window.setFilter = (filter, el) => {
currentFilter = filter;
document.querySelectorAll('.stat-chip').forEach(c => c.classList.remove('active'));
el.classList.add('active');
renderOrders();
};

window.filterOrders = () => renderOrders();

function calculateRemainingDays(dateStr) {
if (!dateStr) return 9999;
try {
const cleanDate = dateStr.split(' ')[0];
const targetDate = new Date(cleanDate);
if (isNaN(targetDate.getTime())) return 9999;
const timeDiff = targetDate.getTime() - TODAY_DATE.getTime();
return Math.ceil(timeDiff / (1000 * 3600 * 24));
} catch (e) {
return 9999;
}
}

function renderOrders() {
const term = document.getElementById('searchInput').value.trim().toLowerCase();
let filtered = [...allOrders];

if (currentFilter !== 'all') { filtered = filtered.filter(o => o.status === currentFilter); }

if (term) {
filtered = filtered.filter(o => {
return o.customerName?.toLowerCase().includes(term) || o.items?.some(i => i.name?.toLowerCase().includes(term));
});
}

const container = document.getElementById('ordersList');
if (!filtered.length) {
container.innerHTML = `
<div class="empty-state">
<div class="empty-icon"><i class="fas fa-inbox" style="color: #94a3b8; font-size: 1.8rem;"></i></div>
<h6 style="font-weight: 800;">لا توجد طلبات متوفرة</h6>
</div>`;
return;
}

// الترتيب من الأقرب تسليماً للأبعد
filtered.sort((a, b) => {
if (a.status === 'done' && b.status !== 'done') return 1;
if (a.status !== 'done' && b.status === 'done') return -1;
return calculateRemainingDays(a.date) - calculateRemainingDays(b.date);
});

let html = '';
filtered.forEach(order => {
const isDone = order.status === 'done';
const initials = (order.customerName || 'ع').charAt(0);
const total = Number(order.total || 0).toFixed(2);
const daysRemaining = calculateRemainingDays(order.date);

let badgeHTML = '';
if (isDone) {
badgeHTML = `<span class="days-counter-badge success-light"><i class="fas fa-check-double"></i> تم الفوترة والتسليم</span>`;
} else if (daysRemaining === 9999) {
badgeHTML = `<span class="days-counter-badge warning-light"><i class="fas fa-hourglass-start"></i> لم يحدد الموعد</span>`;
} else if (daysRemaining === 0) {
badgeHTML = `<span class="days-counter-badge urgent" style="border:1px solid #c62828;"><i class="fas fa-star text-danger"></i> موعد التسليم اليوم!</span>`;
} else if (daysRemaining === 1) {
badgeHTML = `<span class="days-counter-badge warning-light"><i class="fas fa-exclamation-circle"></i> التسليم غداً</span>`;
} else if (daysRemaining < 0) {
badgeHTML = `<span class="days-counter-badge urgent"><i class="fas fa-fire"></i> متأخرة منذ ${Math.abs(daysRemaining)} يوم!</span>`;
} else {
badgeHTML = `<span class="days-counter-badge primary-light"><i class="fas fa-truck"></i> متبقي ${daysRemaining} يوم</span>`;
}

html += `
<div class="order-card ${isDone ? 'status-done' : ''}">
<div class="card-header-row">
<div class="customer-name">
<div class="customer-avatar">${initials}</div>
${order.customerName || '—'}
</div>
<div class="d-flex align-items-center gap-1">
<span class="status-badge ${isDone ? 'status-done':'status-pending'}">${isDone ? 'تم الفوترة':'قيد التنفيذ'}</span>
<button class="action-btn btn-view-items" onclick="toggleItemsDropdown('${order.id}', this)"><i class="fas fa-chevron-down"></i></button>
</div>
</div>
<div class="card-body-row">
<div>${badgeHTML}</div>
<div class="items-dropdown-table" id="dropdown-${order.id}">
<table>
<tbody>
${order.items?.map(i => `<tr><td>${i.name}</td><td class="text-center">${i.quantity}</td><td class="text-start">${Number(i.price * i.quantity).toFixed(2)} ج.م</td></tr>`).join('') || ''}
</tbody>
</table>
</div>
<div class="card-footer-row mt-2">
<div class="order-meta"><i class="fas fa-clock"></i> التسليم: ${order.date || 'غير محدد'}</div>
<div class="order-total">${total} ج.م</div>
</div>
</div>
</div>`;
});

container.innerHTML = html;
}

window.toggleItemsDropdown = (id, btn) => {
const el = document.getElementById(`dropdown-${id}`);
el.style.display = el.style.display === 'block' ? 'none' : 'block';
};

init();
</script>
</body>
</html>
