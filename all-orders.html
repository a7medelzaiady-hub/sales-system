<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>كل الطلبات - شركة الزيادي</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
:root {
--accent: #0b5e3d;
--header-bg: #0b5e3d;
--bg-light: #f4f7f6;
--text-primary: #1b2e26;
--text-secondary: #4a5568;
--border: #dce3de;
--white: #ffffff;
--danger: #d90429;
--warning: #ffb703;
--card-radius: 16px;
--input-radius: 12px;
}

/* حل مشكلة المرجحة والحركة الأفقية نهائياً */
* {
box-sizing: border-box !important;
}

html, body {
max-width: 100%;
overflow-x: hidden;
background: var(--bg-light);
font-family: 'Cairo', sans-serif;
color: var(--text-primary);
padding-bottom: 90px;
margin: 0;
}

.header-nav {
background: var(--header-bg);
padding: 12px 18px;
display: flex;
align-items: center;
justify-content: space-between;
box-shadow: 0 2px 8px rgba(0,0,0,0.15);
color: white;
position: sticky;
top: 0;
z-index: 1000;
}

.nav-btn {
background: rgba(255,255,255,0.15);
width: 38px; height: 38px;
border-radius: 10px;
display: flex; align-items: center; justify-content: center;
color: white; text-decoration: none; border: none; cursor: pointer;
transition: background 0.2s;
}
.nav-btn:hover { background: rgba(255,255,255,0.25); color: white; }

.search-bar-wrap {
padding: 12px 14px 0;
position: relative;
}
.search-bar-wrap input {
border: 1.5px solid var(--border);
border-radius: 12px;
padding: 10px 40px 10px 14px;
font-family: 'Cairo', sans-serif;
font-weight: 600;
font-size: 0.88rem;
width: 100%;
background: white;
color: var(--text-primary);
outline: none;
}
.search-bar-wrap input:focus { border-color: var(--accent); }
.search-icon {
position: absolute;
right: 26px; top: 50%;
transform: translateY(-50%);
color: #94a3b8;
font-size: 0.9rem;
margin-top: 6px;
}

.stats-bar {
display: flex;
gap: 10px;
padding: 12px 14px;
overflow-x: auto;
scrollbar-width: none;
}
.stats-bar::-webkit-scrollbar { display: none; }
.stat-chip {
background: white;
border: 1.5px solid var(--border);
border-radius: 20px;
padding: 5px 14px;
font-size: 0.75rem;
font-weight: 800;
white-space: nowrap;
display: flex;
align-items: center;
gap: 5px;
cursor: pointer;
transition: all 0.2s;
}
.stat-chip.active, .stat-chip:hover {
background: var(--accent);
border-color: var(--accent);
color: white;
}
.stat-chip .chip-num {
background: rgba(255,255,255,0.25);
padding: 1px 7px;
border-radius: 10px;
font-size: 0.7rem;
}
.stat-chip:not(.active) .chip-num {
background: #f1f5f9;
color: var(--text-secondary);
}

#ordersList {
width: 100%;
}

.order-card {
background: white;
border: 1.5px solid var(--border);
border-radius: var(--card-radius);
margin: 0 14px 12px;
overflow: hidden;
cursor: pointer;
transition: all 0.2s ease;
box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}
.order-card:hover {
border-color: var(--accent);
box-shadow: 0 4px 16px rgba(11,94,61,0.1);
transform: translateY(-1px);
}

.order-card.status-done {
border-color: #c3e6cb;
opacity: 0.75;
}

.card-header-row {
display: flex;
align-items: center;
justify-content: space-between;
padding: 12px 14px 8px;
border-bottom: 1px solid #f5f5f5;
}

.customer-name {
font-size: 0.95rem;
font-weight: 800;
color: var(--text-primary);
display: flex;
align-items: center;
gap: 7px;
}
.customer-avatar {
width: 32px; height: 32px;
background: linear-gradient(135deg, #0b5e3d, #1a8a5a);
border-radius: 50%;
display: flex; align-items: center; justify-content: center;
color: white;
font-size: 0.8rem;
font-weight: 800;
flex-shrink: 0;
}

.status-badge {
font-size: 0.68rem;
font-weight: 800;
padding: 3px 10px;
border-radius: 20px;
}
.status-pending {
background: #fff8e1;
color: #d97706;
border: 1px solid #fde68a;
}
.status-done {
background: #f0fdf4;
color: #16a34a;
border: 1px solid #bbf7d0;
}

.card-body-row {
padding: 10px 14px 12px;
}

.days-counter-badge {
font-size: 0.78rem;
font-weight: 700;
padding: 5px 12px;
border-radius: 8px;
display: inline-flex;
align-items: center;
gap: 6px;
margin-bottom: 10px;
width: auto;
}
.days-counter-badge.urgent { background: #ffebee; color: #c62828; }
.days-counter-badge.warning-light { background: #fff3e0; color: #e65100; }
.days-counter-badge.primary-light { background: #e0f2fe; color: #0369a1; }
.days-counter-badge.success-light { background: #e8f5e9; color: #2e7d32; }

.card-footer-row {
display: flex;
align-items: center;
justify-content: space-between;
}

.order-meta {
font-size: 0.72rem;
color: #94a3b8;
font-weight: 600;
display: flex;
align-items: center;
gap: 5px;
}

.order-total {
font-size: 0.88rem;
font-weight: 800;
color: var(--accent);
background: #f0faf4;
padding: 3px 10px;
border-radius: 8px;
}

.tap-hint {
display: flex;
align-items: center;
gap: 4px;
font-size: 0.68rem;
color: var(--accent);
font-weight: 700;
margin-top: 6px;
padding: 5px 10px;
background: #f0faf4;
border-radius: 8px;
border: 1px dashed #b7dfc7;
}

.action-btn {
border: none;
width: 34px;
height: 34px;
border-radius: 10px;
display: inline-flex;
align-items: center;
justify-content: center;
font-size: 0.95rem;
cursor: pointer;
transition: all 0.2s ease-in-out;
user-select: none;
}
.action-btn.btn-share {
background: linear-gradient(135deg, #25d366, #128c7e);
color: white;
box-shadow: 0 3px 8px rgba(37, 211, 102, 0.2);
}
.action-btn.btn-share:active { transform: scale(0.92); }

.action-btn.btn-edit { background: #e3f2fd; color: #1565c0; }
.action-btn.btn-delete { background: #ffebee; color: #c62828; }
.action-btn.btn-view-items { background: #f0faf4; color: var(--accent); border: 1px solid #b7dfc7; }

.items-dropdown-table {
background: #fdfdfd;
border: 1px solid var(--border);
border-radius: 10px;
margin-top: 10px;
padding: 8px;
display: none;
}
.items-dropdown-table table {
width: 100%;
margin-bottom: 0;
font-size: 0.78rem;
font-weight: 600;
}
.items-dropdown-table th {
color: var(--text-secondary);
font-weight: 800;
border-bottom: 1.5px solid var(--border);
padding: 4px;
}
.items-dropdown-table td {
padding: 6px 4px;
border-bottom: 1px dashed #eee;
color: var(--text-primary);
}

.fab {
position: fixed;
bottom: 20px;
left: 20px;
background: var(--accent);
color: white;
border: none;
border-radius: 50%;
width: 54px; height: 54px;
font-size: 1.3rem;
box-shadow: 0 4px 16px rgba(11,94,61,0.35);
cursor: pointer;
display: flex; align-items: center; justify-content: center;
z-index: 900;
text-decoration: none;
}

.empty-state { text-align: center; padding: 60px 20px; }
.loading-state { text-align: center; padding: 50px 20px; }
.spinner {
width: 36px; height: 36px;
border: 3px solid #e2e8f0;
border-top-color: var(--accent);
border-radius: 50%;
animation: spin 0.7s linear infinite;
margin: 0 auto 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.modal-overlay {
display: none;
position: fixed;
top: 0; left: 0;
width: 100%; height: 100%;
background: rgba(0,0,0,0.6);
z-index: 9999;
align-items: center;
justify-content: center;
backdrop-filter: blur(4px);
}
.modal-box {
background: white;
width: 88%;
max-width: 360px;
border-radius: 18px;
padding: 22px 18px;
text-align: center;
}

.thermal-capture-container { position: absolute; left: -9999px; top: 0; }
#thermalReceiptArea { background: #ffffff; width: 380px; padding: 18px; color: #000000; font-family: 'Cairo', sans-serif; }
.receipt-header { text-align: center; border-bottom: 2px dashed #000000; padding-bottom: 12px; margin-bottom: 12px; }
.receipt-header h3 { margin: 0; font-size: 21px; font-weight: 800; }
.receipt-header p { margin: 4px 0 0; font-size: 13px; font-weight: 700; }
.receipt-info { font-size: 13px; font-weight: 700; border-bottom: 1px dashed #000000; padding-bottom: 10px; margin-bottom: 12px; }
.receipt-info-row { display: flex; justify-content: space-between; margin-bottom: 3px; }
.receipt-table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
.receipt-table th { border-bottom: 2px solid #000000; text-align: right; font-size: 13px; font-weight: 800; padding: 4px 0; }
.receipt-table td { padding: 7px 0; font-size: 13px; font-weight: 700; border-bottom: 1px dashed #cccccc; }
.receipt-total-row { border-top: 2px dashed #000000; padding-top: 10px; font-size: 16px; font-weight: 800; display: flex; justify-content: space-between; }
.receipt-footer { text-align: center; margin-top: 20px; font-size: 12px; font-weight: 700; border-top: 1px dashed #000000; padding-top: 10px; }

.toast-notification {
position: fixed;
bottom: 25px;
right: 50%;
transform: translateX(50%) translateY(100px);
background: linear-gradient(135deg, #1e293b, #0f172a);
color: #ffffff;
padding: 10px 18px;
border-radius: 30px;
box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
display: flex;
align-items: center;
gap: 12px;
z-index: 2000;
opacity: 0;
transition: all 0.5s ease;
width: calc(100% - 30px);
max-width: 340px;
}
.toast-notification.show { transform: translateX(50%) translateY(0); opacity: 1; }
.toast-bell-icon { width: 32px; height: 32px; background: rgba(255, 183, 3, 0.2); color: var(--warning); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.toast-text { font-size: 0.82rem; font-weight: 600; flex-grow: 1; }
.toast-close { background: none; border: none; color: rgba(255, 255, 255, 0.4); cursor: pointer; }
</style>
</head>
<body>

<div class="header-nav">
<a href="index.html" class="nav-btn">
<i class="fas fa-home"></i>
</a>
<h6 class="m-0 fw-bold d-flex align-items-center gap-2" style="font-size: 0.92rem;">
<i class="fas fa-clipboard-list" id="headerIcon"></i>
<span>كل الطلبات</span>
<span class="badge" style="background: rgba(255,255,255,0.2); font-size: 0.7rem; padding: 3px 8px;" id="totalCountBadge">0</span>
</h6>
<a href="customer-orders.html" class="nav-btn">
<i class="fas fa-plus"></i>
</a>
</div>

<div class="search-bar-wrap">
<i class="fas fa-search search-icon"></i>
<input type="text" id="searchInput" placeholder="ابحث باسم العميل أو الصنف..." oninput="filterOrders()">
</div>

<div class="stats-bar" id="statsBar">
<div class="stat-chip active" onclick="setFilter('all', this)">
<i class="fas fa-layer-group"></i> الكل <span class="chip-num" id="chipAll">0</span>
</div>
<div class="stat-chip" onclick="setFilter('pending', this)">
<i class="fas fa-clock"></i> قيد التنفيذ <span class="chip-num" id="chipPending">0</span>
</div>
<div class="stat-chip" onclick="setFilter('done', this)">
<i class="fas fa-check-circle"></i> تم الفوترة <span class="chip-num" id="chipDone">0</span>
</div>
</div>

<div id="ordersList">
<div class="loading-state">
<div class="spinner"></div>
<p style="color: #94a3b8; font-size: 0.85rem; font-weight: 700;">جاري التحميل...</p>
</div>
</div>

<div class="toast-notification" id="orderToastNotification">
<div class="toast-bell-icon"><i class="fas fa-bell"></i></div>
<div class="toast-text" id="toastMessageText">جاري الفحص...</div>
<button class="toast-close" onclick="dismissToast()"><i class="fas fa-times"></i></button>
</div>

<a href="customer-orders.html" class="fab">
<i class="fas fa-plus"></i>
</a>

<div class="modal-overlay" id="convertModal">
<div class="modal-box">
<h5 class="fw-bold mb-1" style="font-size: 0.95rem;">تحويل الطلبية لفاتورة</h5>
<p id="convertModalText" style="color: #64748b; font-size: 0.82rem; margin-bottom: 18px;"></p>
<div class="d-flex gap-2">
<button id="confirmConvertBtn" class="btn btn-success w-100 fw-bold py-2" style="border-radius: 10px;">فتح الفاتورة</button>
<button class="btn btn-light w-100 fw-bold py-2" style="border-radius:10px; border:1px solid #ddd;" onclick="closeModal()">إلغاء</button>
</div>
</div>
</div>

<div class="modal-overlay" id="shareLoadingModal">
<div class="modal-box" style="max-width: 300px;">
<div class="spinner mb-3"></div>
<h6 class="fw-bold text-dark m-0">جاري إنشاء الفاتورة كصورة حرارية...</h6>
</div>
</div>

<div class="thermal-capture-container">
<div id="thermalReceiptArea">
<div class="receipt-header">
<h3>شركة الزيادي</h3>
<p>لزيوت السيارات والمحركات</p>
</div>
<div class="receipt-info">
<div class="receipt-info-row"><span>رقم الطلب: <span id="thOrderId">0000</span></span><span>التاريخ: <span id="thOrderDate">0000</span></span></div>
<div class="receipt-info-row"><span>العميل: <strong id="thCustomerName">—</strong></span></div>
</div>
<table class="receipt-table">
<thead><tr><th>الصنف</th><th class="text-center">الكمية</th><th class="text-start">الإجمالي</th></tr></thead>
<tbody id="thReceiptItems"></tbody>
</table>
<div class="receipt-total-row"><span>الإجمالي النهائي:</span><span id="thFinalTotal">0.00 ج.م</span></div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
authDomain: "ahmedelzaiady.firebaseapp.com",
projectId: "ahmedelzaiady",
storageBucket: "ahmedelzaiady.firebasestorage.app",
messagingSenderId: "300306825071",
appId: "1:300306825071:web:0426ddde56280fa090329a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allOrders = [];
let currentFilter = 'all';
let pendingOrderForConvert = null;
const TODAY_DATE = new Date("2026-06-20");

async function init() {
try {
const querySnapshot = await getDocs(collection(db, 'orders'));
allOrders = querySnapshot.docs.map(d => ({ id: d.id, ...d.data() }));
updateChips();
triggerOrderNotification();
renderOrders();
} catch (e) {
console.error(e);
}
}

function updateChips() {
const pending = allOrders.filter(o => o.status === 'pending').length;
const done = allOrders.filter(o => o.status === 'done').length;
document.getElementById('chipAll').innerText = allOrders.length;
document.getElementById('chipPending').innerText = pending;
document.getElementById('chipDone').innerText = done;
document.getElementById('totalCountBadge').innerText = allOrders.length;
}

function triggerOrderNotification() {
const pendingCount = allOrders.filter(o => o.status === 'pending').length;
if (pendingCount > 0) {
document.getElementById('toastMessageText').innerHTML = `لديك <span class="fw-bold text-warning">${pendingCount} طلبات معلقة</span> قيد التنفيذ.`;
document.getElementById('orderToastNotification').classList.add('show');
}
}

window.dismissToast = () => document.getElementById('orderToastNotification').classList.remove('show');

window.setFilter = (filter, el) => {
currentFilter = filter;
document.querySelectorAll('.stat-chip').forEach(c => c.classList.remove('active'));
el.classList.add('active');
renderOrders();
};

window.filterOrders = () => renderOrders();

function calculateRemainingDays(dateStr) {
if (!dateStr) return 9999;
try {
const cleanDate = dateStr.split(' ')[0];
const targetDate = new Date(cleanDate);
if (isNaN(targetDate.getTime())) return 9999;
const timeDiff = targetDate.getTime() - TODAY_DATE.getTime();
return Math.ceil(timeDiff / (1000 * 3600 * 24));
} catch (e) { return 9999; }
}

function renderOrders() {
const term = document.getElementById('searchInput').value.trim().toLowerCase();
let filtered = [...allOrders];

if (currentFilter !== 'all') { filtered = filtered.filter(o => o.status === currentFilter); }
if (term) {
filtered = filtered.filter(o => o.customerName?.toLowerCase().includes(term) || o.items?.some(i => i.name?.toLowerCase().includes(term)));
}

const container = document.getElementById('ordersList');
if (!filtered.length) {
container.innerHTML = `<div class="empty-state"><h6>لا توجد طلبات</h6></div>`;
return;
}

// الترتيب التلقائي الذكي من الأقرب تسليماً للأبعد
filtered.sort((a, b) => {
if (a.status === 'done' && b.status !== 'done') return 1;
if (a.status !== 'done' && b.status === 'done') return -1;
return calculateRemainingDays(a.date) - calculateRemainingDays(b.date);
});

let html = '';
filtered.forEach(order => {
const isDone = order.status === 'done';
const initials = (order.customerName || 'ع').charAt(0);
const total = Number(order.total || 0).toFixed(2);
const daysRemaining = calculateRemainingDays(order.date);

let badgeHTML = '';
if (isDone) {
badgeHTML = `<span class="days-counter-badge success-light"><i class="fas fa-check-double"></i> تم التسليم</span>`;
} else if (daysRemaining === 9999) {
badgeHTML = `<span class="days-counter-badge warning-light">لم يحدد موعد</span>`;
} else if (daysRemaining === 0) {
badgeHTML = `<span class="days-counter-badge urgent" style="border:1px solid #c62828;"><i class="fas fa-star text-danger"></i> موعد التسليم اليوم!</span>`;
} else if (daysRemaining === 1) {
badgeHTML = `<span class="days-counter-badge warning-light">التسليم غداً</span>`;
} else if (daysRemaining < 0) {
badgeHTML = `<span class="days-counter-badge urgent">متأخرة منذ ${Math.abs(daysRemaining)} يوم</span>`;
} else {
badgeHTML = `<span class="days-counter-badge primary-light">متبقي ${daysRemaining} يوم</span>`;
}

const tapHint = !isDone 
? `<div class="tap-hint"><i class="fas fa-arrow-left"></i> اضغط لتحويلها لفاتورة مبيعات</div>`
: `<div class="tap-hint" style="background:#f0fdf4; border-color:#bbf7d0; color:#16a34a;"><i class="fas fa-check"></i> تم الفوترة</div>`;

html += `
<div class="order-card ${isDone ? 'status-done':''}" onclick="onOrderClick('${order.id}')">
<div class="card-header-row">
<div class="customer-name"><div class="customer-avatar">${initials}</div>${order.customerName || '—'}</div>
<div class="d-flex align-items-center gap-1">
<span class="status-badge ${isDone?'status-done':'status-pending'}">${isDone?'تم الفوترة':'قيد التنفيذ'}</span>
<button class="action-btn btn-view-items" onclick="event.stopPropagation(); toggleItemsDropdown('${order.id}', this)"><i class="fas fa-chevron-down"></i></button>
<button class="action-btn btn-share" onclick="event.stopPropagation(); shareAsThermalInvoice('${order.id}')"><i class="fas fa-share-alt"></i></button>
${!isDone ? `
<button class="action-btn btn-edit" onclick="event.stopPropagation(); editOrder('${order.id}')"><i class="fas fa-edit"></i></button>
<button class="action-btn btn-delete" onclick="event.stopPropagation(); confirmDelete('${order.id}', '${order.customerName}')"><i class="fas fa-trash"></i></button>
`:''}
</div>
</div>
<div class="card-body-row">
<div>${badgeHTML}</div>
<div class="items-dropdown-table" id="dropdown-${order.id}" onclick="event.stopPropagation();">
<table>
<tbody>
${order.items?.map(i => `<tr><td>${i.name}</td><td class="text-center">${i.quantity}</td><td class="text-start">${Number(i.price*i.quantity).toFixed(2)} ج.م</td></tr>`).join('') || ''}
</tbody>
</table>
</div>
<div class="card-footer-row mt-2">
<div class="order-meta"><i class="fas fa-clock"></i> التسليم: ${order.date || '—'}</div>
<div class="order-total">${total} ج.م</div>
</div>
${tapHint}
</div>
</div>`;
});

container.innerHTML = html;
}

window.toggleItemsDropdown = (id, btn) => {
const el = document.getElementById(`dropdown-${id}`);
el.style.display = el.style.display === 'block' ? 'none' : 'block';
};

window.onOrderClick = (orderId) => {
const order = allOrders.find(o => o.id === orderId);
if (!order || order.status === 'done') return;
pendingOrderForConvert = order;
document.getElementById('convertModalText').innerHTML = `هل تريد تحويل طلبية <b>${order.customerName}</b> إلى فاتورة مبيعات؟`;
document.getElementById('confirmConvertBtn').onclick = () => {
const params = new URLSearchParams({ fromOrder: order.id, customerName: order.customerName, total: order.total, items: JSON.stringify(order.items || []), deleteOrderAfterSave: "true" });
window.location.href = `sales-invoice.html?${params.toString()}`;
};
document.getElementById('convertModal').style.display = 'flex';
};

window.closeModal = () => document.getElementById('convertModal').style.display = 'none';
window.editOrder = (id) => window.location.href = `customer-orders.html?editOrderId=${id}`;
window.confirmDelete = async (id, name) => {
if (confirm(`حذف طلبية ${name}؟`)) {
await deleteDoc(doc(db, 'orders', id));
allOrders = allOrders.filter(o => o.id !== id);
updateChips(); renderOrders();
}
};

window.shareAsThermalInvoice = (orderId) => {
const order = allOrders.find(o => o.id === orderId);
if (!order) return;
document.getElementById('shareLoadingModal').style.display = 'flex';
document.getElementById('thOrderId').innerText = order.id.substring(0, 6).toUpperCase();
document.getElementById('thOrderDate').innerText = order.date ? order.date.split(' ')[0] : '—';
document.getElementById('thCustomerName').innerText = order.customerName || 'عميل';
document.getElementById('thFinalTotal').innerText = `${Number(order.total || 0).toFixed(2)} ج.م`;
document.getElementById('thReceiptItems').innerHTML = order.items?.map(i => `<tr><td>${i.name}</td><td style="text-align:center;">${i.quantity}</td><td style="text-align:left;">${Number(i.price*i.quantity).toFixed(2)} ج.م</td></tr>`).join('') || '';

setTimeout(() => {
html2canvas(document.getElementById('thermalReceiptArea'), { scale: 2 }).then(canvas => {
canvas.toBlob(blob => {
document.getElementById('shareLoadingModal').style.display = 'none';
const file = new File([blob], `invoice.png`, { type: 'image/png' });
if (navigator.canShare && navigator.canShare({ files: [file] })) {
navigator.share({ files: [file], title: 'الفاتورة' });
} else {
const link = document.createElement('a'); link.download = 'invoice.png'; link.href = canvas.toDataURL(); link.click();
}
});
});
}, 400);
};

init();
</script>
</body>
</html>
