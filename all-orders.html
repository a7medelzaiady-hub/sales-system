<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عرض كل الطلبات - شركة الزيادي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --accent: #0b5e3d;
            --header-bg: #0b5e3d;
            --bg-light: #f4f7f6;
            --text-primary: #1b2e26;
            --text-secondary: #4a5568;
            --border: #dce3de;
            --white: #ffffff;
            --warning: #ffb703;
            --card-radius: 18px;
        }

        body {
            background: var(--bg-light);
            font-family: 'Cairo', sans-serif;
            color: var(--text-primary);
            padding-bottom: 60px;
        }

        .header-nav {
            background: var(--header-bg);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            color: white;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-btn {
            background: rgba(255,255,255,0.15);
            width: 38px; height: 38px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            color: white; text-decoration: none; border: none; cursor: pointer;
        }

        .order-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--card-radius);
            padding: 16px;
            margin: 12px 0;
            box-shadow: 0 3px 10px rgba(0,0,0,0.03);
            position: relative;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f0f4f1;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .customer-name {
            font-weight: 800;
            font-size: 0.95rem;
            color: var(--accent);
        }

        .order-date {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .item-badge {
            background: #f1f5f9;
            color: var(--text-secondary);
            padding: 3px 8px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            display: inline-block;
            margin: 2px;
        }

        .order-total {
            font-weight: 800;
            color: var(--text-primary);
            font-size: 0.95rem;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .actions-area {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            border-top: 1px solid #f0f4f1;
            padding-top: 12px;
        }

        .btn-action {
            flex: 1;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 8px;
            border-radius: 10px;
            text-align: center;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .btn-edit {
            background: #ebf9eb;
            color: var(--accent);
            border: 1px solid #b7dfc7;
        }
        .btn-edit:hover { background: #d4f2dd; color: var(--accent); }

        .loading-msg {
            text-align: center;
            padding: 40px;
            font-weight: 700;
            color: var(--text-secondary);
        }

        .empty-msg {
            text-align: center;
            padding: 40px;
            font-weight: 700;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="header-nav">
    <a href="index.html" class="nav-btn">
        <i class="fas fa-arrow-right"></i>
    </a>
    <h6 class="m-0 fw-bold d-flex align-items-center gap-2" style="font-size: 0.92rem;">
        <i class="fas fa-list-ul"></i>
        <span>قائمة الطلبيات الحالية</span>
    </h6>
    <a href="add-order.html" class="nav-btn">
        <i class="fas fa-plus"></i>
    </a>
</div>

<div class="container px-3" id="ordersContainer">
    <div class="loading-msg">
        <i class="fas fa-spinner fa-spin me-2"></i> جاري تحميل الطلبيات...
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
        authDomain: "ahmedelzaiady.firebaseapp.com",
        projectId: "ahmedelzaiady",
        storageBucket: "ahmedelzaiady.firebasestorage.app",
        messagingSenderId: "300306825071",
        appId: "1:300306825071:web:0426ddde56280fa090329a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadOrders() {
        const container = document.getElementById('ordersContainer');
        
        try {
            // جلب الطلبيات مرتبة من الأحدث للأقدم عبر الـ timestamp
            const q = query(collection(db, 'orders'), orderBy('timestamp', 'desc'));
            const querySnapshot = await getDocs(q);
            
            if (querySnapshot.empty) {
                container.innerHTML = `
                    <div class="empty-msg">
                        <i class="fas fa-folder-open fa-2x d-block mb-2"></i>
                        لا توجد طلبات مسجلة حالياً
                    </div>`;
                return;
            }

            let html = '';
            
            querySnapshot.forEach((d) => {
                const order = d.data();
                
                // تجميع أسماء الأصناف لعرضها كـ كروت مصغرة داخل الطلبية
                let itemsHtml = '';
                if (order.items && order.items.length > 0) {
                    itemsHtml = order.items.map(item => {
                        const unitName = item.unit === 'box' ? 'كرتونة' : 'قطعة';
                        return `<span class="item-badge">${item.name} (${item.qty} ${unitName})</span>`;
                    }).join('');
                }

                // التعديل الجوهري: تم تمرير d.id في رابط صفحة التعديل بنجاح هنا
                html += `
                    <div class="order-card">
                        <div class="order-header">
                            <span class="customer-name"><i class="fas fa-user me-1"></i> ${order.customerName}</span>
                            <span class="order-date"><i class="fas fa-calendar-alt me-1"></i> ${order.date || ''}</span>
                        </div>
                        
                        <div class="order-items-summary">
                            ${itemsHtml}
                        </div>

                        ${order.notes ? `<div style="font-size:0.75rem; color:#64748b; background:#f8fafc; padding:6px; border-radius:6px; margin-top:8px;"><i class="fas fa-comment-alt me-1"></i> ${order.notes}</div>` : ''}
                        
                        <div class="order-total">
                            <span style="font-size:0.75rem; color:var(--text-secondary);">إجمالي الحساب:</span>
                            <span>${Number(order.total || 0).toFixed(2)} ج.م</span>
                        </div>
                        
                        <div class="actions-area">
                            <a href="edit-order.html?id=${d.id}" class="btn-action btn-edit">
                                <i class="fas fa-edit"></i> تعديل الطلبية
                            </a>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;

        } catch (error) {
            console.error("Error loading orders:", error);
            container.innerHTML = `
                <div class="empty-msg text-danger">
                    <i class="fas fa-exclamation-triangle fa-2x d-block mb-2"></i>
                    حدث خطأ أثناء تحميل البيانات من السيرفر
                </div>`;
        }
    }

    // تشغيل الدالة فور تحميل الصفحة
    loadOrders();
</script>
</body>
</html>
