<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>سلة العملاء</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

body{
    background:#f4f7f6;
    font-family:'Cairo',sans-serif;
}

.header{
    background:#0b5e3d;
    color:#fff;
    padding:15px;
    text-align:center;
    font-weight:bold;
}

.card-box{
    background:#fff;
    border-radius:18px;
    padding:15px;
    margin-bottom:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border:1px solid #ddd;
}

.btn-action{
    border:none;
    padding:8px 12px;
    border-radius:10px;
    color:#fff;
    margin-left:5px;
}

.restore{
    background:#28a745;
}

.delete{
    background:#dc3545;
}

.search-box{
    border-radius:12px;
    padding:12px;
    margin-bottom:15px;
}

</style>
</head>
<body>

<div class="header">
    سلة العملاء
</div>

<div class="container py-4">

    <input type="text"
           id="search"
           class="form-control search-box"
           placeholder="بحث باسم العميل">

    <div id="container"></div>

</div>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
    getFirestore,
    collection,
    getDocs,
    doc,
    setDoc,
    deleteDoc,
    getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* Firebase Config */
const firebaseConfig = {
  apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
  authDomain: "ahmedelzaiady.firebaseapp.com",
  projectId: "ahmedelzaiady",
  storageBucket: "ahmedelzaiady.firebasestorage.app",
  messagingSenderId: "300306825071",
  appId: "1:300306825071:web:0426ddde56280fa090329a"
};


const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const container = document.getElementById("container");
const search = document.getElementById("search");

let customers = [];


/* تحميل السلة */
async function loadTrash(){

    const snap = await getDocs(collection(db,"deleted_customers"));

    customers = [];

    snap.forEach(d=>{
        customers.push({id:d.id,...d.data()});
    });

    render(customers);
}


/* عرض */
function render(data){

    container.innerHTML = "";

    if(data.length === 0){
        container.innerHTML = "<p class='text-center mt-5'>لا يوجد بيانات</p>";
        return;
    }

    data.forEach(c=>{

        container.innerHTML += `
        <div class="card-box">

            <div>
                <div class="fw-bold">${c.name}</div>
                <small>رصيد: ${c.balance || 0}</small>
            </div>

            <div>

                <button class="btn-action restore"
                onclick="restore('${c.id}')">
                    ♻️
                </button>

                <button class="btn-action delete"
                onclick="deleteFinal('${c.id}')">
                    🗑️
                </button>

            </div>

        </div>
        `;
    });
}


/* استرجاع */
window.restore = async function(id){

    const snap = await getDoc(doc(db,"deleted_customers",id));

    await setDoc(doc(db,"customers",id), snap.data());

    await deleteDoc(doc(db,"deleted_customers",id));

    alert("تم الاسترجاع");

    loadTrash();
}


/* حذف نهائي */
window.deleteFinal = async function(id){

    if(!confirm("حذف نهائي؟")) return;

    await deleteDoc(doc(db,"deleted_customers",id));

    loadTrash();
}


/* بحث */
search.addEventListener("input",function(){

    const val = this.value.toLowerCase();

    const filtered = customers.filter(c=>
        (c.name||"").toLowerCase().includes(val)
    );

    render(filtered);
});


loadTrash();

</script>

</body>
</html>
