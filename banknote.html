<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة النقدية والشيكات | anas POS Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* نفس الهوية البصرية لصفحة index1: الأخضر الزمردي والوضع الداكن */
        :root {
            --bg-deep: #0b1411;       /* خلفية داكنة مائلة للأخضر العشبي الداكن */
            --bg-card: #14241f;       /* كروت خضراء داكنة جداً متناسقة */
            --accent: #198754;        /* اللون الأخضر الأساسي المعتمد */
            --accent-light: #2ec4b6;  /* أخضر مضيء للتفاعل والمؤثرات */
            --text-primary: #f0f5f3;  /* نصوص بيضاء ناعمة بلمحة خضراء مريحة للعين */
            --text-muted: #9faeaa;     /* نصوص فرعية رمادية مائلة للأخضر */
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --border: #1e362f;        /* حدود متناسقة مع الوضع الداكن الأخضر */
            --radius-lg: 24px;
        }

        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: var(--bg-deep); 
            margin: 0; 
            color: var(--text-primary); 
            min-height: 100vh;
        }

        /* الهيدر الاحترافي المتناسق */
        .banknote-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        
        .back-btn { 
            font-size: 20px; 
            color: var(--text-primary); 
            cursor: pointer; 
            transition: transform 0.2s;
        }
        .back-btn:hover { transform: scale(1.1); color: var(--accent-light); }

        .page-title { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            font-weight: 800; 
            font-size: 18px; 
        }
        .page-title i { color: var(--accent-light); font-size: 22px; }

        /* نظام توزيع الكروت الذكي (Grid) المتجاوب المتناسق مع الواجهة الرئيسية */
        .banknote-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 20px;
            padding: 25px 20px;
            max-width: 600px;
            margin: 30px auto;
        }

        /* كروت الأقسام التفاعلية الفاخرة */
        .menu-card {
            background: var(--bg-card);
            padding: 30px 15px;
            border-radius: var(--radius-lg);
            text-align: center;
            box-shadow: var(--shadow);
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* تأثير التوهج الأخضر الخلفي عند تحريك الماوس أو اللمس */
        .menu-card::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(46,196,182,0.12) 0%, transparent 70%);
            transform: translate(-50%, -50%) scale(0);
            transition: transform 0.5s ease;
            z-index: 1;
        }

        .menu-card:hover::before { transform: translate(-50%, -50%) scale(1.5); }

        .menu-card:hover { 
            border-color: var(--accent-light); 
            transform: translateY(-6px); 
            box-shadow: 0 12px 40px rgba(46,196,182,0.25);
        }
        
        .menu-card:active { transform: translateY(-2px); }

        .menu-card i { 
            font-size: 34px; 
            color: var(--accent-light); 
            margin-bottom: 12px; 
            display: block; 
            z-index: 2;
            transition: transform 0.3s ease;
        }
        .menu-card:hover i { transform: scale(1.15); }

        .menu-card p { 
            font-weight: 700; 
            font-size: 15px;
            margin: 0; 
            z-index: 2;
        }
    </style>
</head>
<body>

    <!-- الهيدر الاحترافي الموحد -->
    <a href="sandok1.html" class="menu-card">
            <i class="fas fa-money-bill-wave"></i>
            <p> النقديه</p>
        </a>
    <!-- كارت المدفوعات -->
        <a href="expenses.html" class="menu-card">
            <i class="fas fa-money-bill-wave"></i>
            <p>المصروفات</p>
        </a>
    <header class="banknote-header">
        <i class="fas fa-arrow-right back-btn" onclick="history.back()"></i>
        <div class="page-title">
            <span>النقدية والشيكات</span>
            <i class="fas fa-money-bill-transfer"></i>
        </div>
        <div style="width: 20px;"></div> <!-- توازن الهيدر -->
    </header>

    <!-- شبكة كروت التوزيع الذكية المتناسقة مع الألوان الجديدة -->
    <div class="banknote-container">
        <!-- كارت المقبوضات -->
        <a href="receipts.html" class="menu-card">
            <i class="fas fa-money-bill-trend-up"></i>
            <p>المقبوضات</p>
        </a>

        <!-- كارت المدفوعات -->
        <a href="payments.html" class="menu-card">
            <i class="fas fa-money-bill-wave"></i>
            <p>المدفوعات</p>
        </a>

        <!-- كارت حافظة الشيكات -->
        <a href="checks.html" class="menu-card">
            <i class="fas fa-money-check-dollar"></i>
            <p>حافظة الشيكات</p>
        </a>

        <!-- كارت التحويلات المالية -->
        <a href="transfers.html" class="menu-card">
            <i class="fas fa-right-left"></i>
            <p>التحويلات المالية</p>
        </a>
    </div>

</body>
</html>
