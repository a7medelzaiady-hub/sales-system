<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة النقدية | anas POS Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* الهوية البصرية الجديدة: الأخضر الزمردي والوضع الليلي */
        :root {
            --bg-deep: #0b1411;       /* خلفية داكنة مائلة للأخضر العشبي الداكن */
            --bg-card: #14241f;       /* كروت خضراء داكنة جداً متناسقة */
            --accent: #198754;        /* اللون الأخضر الأساسي المعتمد */
            --accent-light: #2ec4b6;  /* أخضر مضيء للتفاعل والمؤثرات */
            --text-primary: #f0f5f3;  /* نصوص بيضاء ناعمة بلمحة خضراء مريحة للعين */
            --text-muted: #9faeaa;     /* نصوص فرعية رمادية مائلة للأخضر */
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --border: #1e362f;        /* حدود متناسقة مع الوضع الداكن الأخضر */
            --radius-lg: 24px;
        }

        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: var(--bg-deep); 
            margin: 0; 
            color: var(--text-primary); 
            min-height: 100vh;
        }

        /* الهيدر المخصص متناسق مع النظام الداكن الجديد */
        .cash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        
        .back-btn { 
            font-size: 20px; 
            color: var(--text-primary); 
            cursor: pointer; 
            transition: transform 0.2s;
        }
        .back-btn:hover { transform: scale(1.1); color: var(--accent-light); }

        .page-title { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            font-weight: 800; 
            font-size: 18px; 
        }
        .page-title i { color: var(--accent-light); font-size: 22px; }

        /* منطقة توزيع الكروت (Grid) المتجاوبة */
        .cash-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 25px 20px;
            max-width: 550px;
            margin: 40px auto;
        }

        /* الكروت الإيمائية الفاخرة باللون الأخضر */
        .cash-card {
            background: var(--bg-card);
            padding: 35px 20px;
            border-radius: var(--radius-lg);
            text-align: center;
            box-shadow: var(--shadow);
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* تأثير التوهج الخلفي الخفيف بالأخضر عند المرور فوق الكارت */
        .cash-card::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(46,196,182,0.12) 0%, transparent 70%);
            transform: translate(-50%, -50%) scale(0);
            transition: transform 0.5s ease;
            z-index: 1;
        }

        .cash-card:hover::before { transform: translate(-50%, -50%) scale(1.5); }

        .cash-card:hover { 
            border-color: var(--accent-light); 
            transform: translateY(-6px); 
            box-shadow: 0 12px 40px rgba(46,196,182,0.2);
        }
        
        .cash-card:active { transform: translateY(-2px); }

        .cash-card i { 
            font-size: 36px; 
            color: var(--accent-light); 
            margin-bottom: 15px; 
            display: block; 
            z-index: 2;
            transition: transform 0.3s ease;
        }
        .cash-card:hover i { transform: scale(1.15); }

        .cash-card p { 
            font-weight: 700; 
            font-size: 16px;
            margin: 0; 
            z-index: 2;
        }
    </style>
</head>
<body>

    <!-- الهيدر الاحترافي المتناسق -->
    <header class="cash-header">
        <i class="fas fa-arrow-right back-btn" onclick="history.back()"></i>
        <div class="page-title">
            <span>النقدية</span>
            <i class="fas fa-hand-holding-dollar"></i>
        </div>
        <div style="width: 20px;"></div> <!-- توازن الهيدر -->
    </header>

    <!-- نظام توزيع الكروت الذكي (Grid) -->
    <div class="cash-container">
        <a href="sandok1.html" class="cash-card">
            <i class="fas fa-vault"></i>
            <p>الخزينة</p>
        </a>
        <a href="expenses.html" class="cash-card">
            <i class="fas fa-receipt"></i>
            <p>المصروفات</p>
        </a>
    </div>

</body>
</html>
