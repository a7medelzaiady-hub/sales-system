<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة الزيادى | anas POS Pro</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            /* نفس لوحة الألوان المعتمدة بناءً على فاتورة الشراء والتطبيق */
            --bg-deep: #f4f7f6;
            --bg-card: #ffffff;
            --glass: rgba(11, 94, 61, 0.05);
            --accent: #0b5e3d;         /* الأخضر الداكن المعتمد Burgundy */
            --accent-light: #198754;  /* الأخضر الزمردي */
            --header-bg: #0b5e3d;      
            --text-primary: #1b2e26;
            --text-secondary: #61736b;
            --danger: #dc3545;
            --border: #e2e9e5;
            --shadow: 0 8px 24px rgba(11, 94, 61, 0.04);
            --radius-lg: 20px;
            --radius-md: 14px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-deep);
            margin: 0;
            color: var(--text-primary);
            line-height: 1.6;
        }

        /* --- Header --- */
        header.top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: var(--header-bg);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            backdrop-filter: blur(10px);
        }

        .nav-icons { display: flex; gap: 18px; align-items: center; }
        .nav-icons i { 
            font-size: 20px; 
            color: #ffffff; 
            cursor: pointer; 
            transition: transform 0.2s, opacity 0.2s; 
            opacity: 0.9;
        }
        .nav-icons i:hover { transform: scale(1.1); opacity: 1; }

        .app-title { font-size: 20px; font-weight: 800; color: #ffffff; letter-spacing: 0.5px; }
        .app-title span { color: #ffce31; text-shadow: 0 2px 4px rgba(0,0,0,0.15); } 

        .logout-btn {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: var(--radius-md);
            font-size: 13px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            transition: 0.2s;
        }
        .logout-btn:hover { background: rgba(220, 53, 69, 0.2); border-color: var(--danger); }

        /* --- Welcome Banner --- */
        .welcome-banner {
            padding: 25px 20px 5px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .welcome-banner h1 { font-size: 22px; font-weight: 800; margin: 0; color: var(--text-primary); }
        .welcome-banner p { font-size: 13px; color: var(--text-secondary); margin: 5px 0 0; font-weight: 600; }

        /* --- Dashboard Grid --- */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            padding: 20px;
