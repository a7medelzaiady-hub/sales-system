    <style>

}

    border: none;

            font-family: 'Cairo', sans-serif; 
            color: var(--text-primary); 
            padding-bottom: 30px; 
        }
        
        .header {

            margin-bottom: 25px; color: white;

        .menu-card {

            text-align: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }

        .menu-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            box-shadow: 0 8px 25px rgba(11, 94, 61, 0.1);
        }
        
        .menu-card:active { transform: scale(0.95); }

        .icon-box {

            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            margin-bottom: 15px;
            background: #f0f6f3;
            color: var(--accent);
            border: 1px solid #e2eee7;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .card-desc {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin: 0;
            line-height: 1.4;

        }

        /* تمييز بسيط لأيقونات المرتجع */

</head>
<body>

<div class="header">

</div>

            <a href="new-order.html" class="menu-card">

                </div>

                <p class="card-desc">عمل أمر شراء جديد</p>

        </div>

            <a href="purchase-orders-list.html" class="menu-card">

        </div>

    </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs,
    deleteDoc,
    doc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {

  apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
  authDomain: "ahmedelzaiady.firebaseapp.com",
  projectId: "ahmedelzaiady",
  storageBucket: "ahmedelzaiady.firebasestorage.app",
  messagingSenderId: "300306825071",
  appId: "1:300306825071:web:0426ddde56280fa090329a"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

window.deleteAllInvoices = async () => {

    if (!confirm("⚠️ حذف كل فواتير الشراء؟")) return;

    try {

        const snap = await getDocs(
            collection(db, "purchaseInvoices")
        );

        if (snap.empty) {
            return alert("لا توجد فواتير");
        }

        let deleted = 0;

        for (const d of snap.docs) {

            await deleteDoc(
                doc(db, "purchaseInvoices", d.id)
            );

            deleted++;
        }

        alert(`تم حذف ${deleted} فاتورة ✅`);

    } catch (e) {

        alert(e.message);

    }

};

window.exportToExcel = async () => {

    try {

        const snap = await getDocs(
            collection(db, "purchaseInvoices")
        );

        if (snap.empty) {
            return alert("لا توجد بيانات");
        }

        let excelData = [];

        excelData.push([
            "المورد",
            "الصنف",
            "الكمية",
            "السعر",
            "الإجمالي"
        ]);

        snap.forEach(docu => {

            const inv = docu.data();

            (inv.items || []).forEach(item => {

                excelData.push([
                    inv.supplierName || "",
                    item.name || "",
                    item.qty || 0,
                    item.price || 0,
                    (item.qty || 0) * (item.price || 0)
                ]);

            });

        });

        const worksheet =
            XLSX.utils.aoa_to_sheet(excelData);

        const workbook =
            XLSX.utils.book_new();

        XLSX.utils.book_append_sheet(
            workbook,
            worksheet,
            "المشتريات"
        );

        XLSX.writeFile(
            workbook,
            "فواتير_المشتريات.xlsx"
        );

    } catch (e) {

        alert(e.message);

    }

};

</script>
</body>
