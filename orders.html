<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>كل الطلبات</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap"
rel="stylesheet">

<style>

body{
    font-family:'Cairo';
    background:#f4f7f6;
}

.header{
    background:#0b5e3d;
    color:#fff;
    padding:15px;
    font-size:20px;
    font-weight:bold;
}

.order-card{
    background:#fff;
    border-radius:15px;
    padding:15px;
    margin-top:15px;
    border:1px solid #ddd;
    border-right:5px solid #0b5e3d;
}

.item{
    background:#f8faf9;
    padding:8px;
    border-radius:10px;
    margin-top:5px;
}

.status{
    background:#0b5e3d;
    color:#fff;
    padding:4px 10px;
    border-radius:10px;
    font-size:13px;
}

.empty{
    text-align:center;
    margin-top:50px;
    color:#888;
}

</style>
</head>

<body>

<div class="header">
📋 طلبات العملاء
</div>

<div class="container pb-5">

    <div id="ordersContainer"></div>

</div>

<script type="module">

import {
getFirestore,
collection,
getDocs,
query,
orderBy,
deleteDoc,
doc
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* Firebase */

const firebaseConfig = {
  apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
  authDomain: "ahmedelzaiady.firebaseapp.com",
  projectId: "ahmedelzaiady",
  storageBucket: "ahmedelzaiady.firebasestorage.app",
  messagingSenderId: "300306825071",
  appId: "1:300306825071:web:0426ddde56280fa090329a",
  measurementId: "G-WE04GK5XZZ"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* تحميل الطلبات */

async function loadOrders(){

    const container =
    document.getElementById("ordersContainer");

    container.innerHTML = "جاري التحميل...";

    const q = query(
        collection(db,"customer_orders"),
        orderBy("createdAt","desc")
    );

    const snap = await getDocs(q);

    container.innerHTML = "";

    if(snap.empty){

        container.innerHTML = `
            <div class="empty">
                لا توجد طلبات
            </div>
        `;

        return;
    }

    snap.forEach(d=>{

        const order = d.data();

        let itemsHTML = "";

        order.items.forEach(item=>{

            itemsHTML += `
                <div class="item">
                    📦 ${item.name}
                    — الكمية:
                    <b>${item.qty}</b>
                </div>
            `;
        });

        const div = document.createElement("div");

        div.className = "order-card";

        div.innerHTML = `
<div class="d-flex justify-content-between align-items-start">

    <div>
        <h5>${order.customerName}</h5>

        <small>
            📅 ${order.deliveryDate}
        </small>
    </div>

    <div class="d-flex gap-2 align-items-center">


        <button
            class="btn btn-danger btn-sm"
            onclick="deleteOrder('${d.id}')">

            🗑️

        </button>

    </div>

</div>
                <div>
                    <span class="status">
                        ${order.status}
                    </span>
                </div>

            </div>

            <hr>

            ${itemsHTML}

            <div class="mt-3">
                <b>ملاحظات:</b>
                <div class="text-muted">
                    ${order.note || "لا يوجد"}
                </div>
            </div>

        `;

        container.appendChild(div);

    });

}

loadOrders();
window.deleteOrder = async(id)=>{

    const ok = confirm("هل تريد حذف الطلب؟");

    if(!ok) return;

    await deleteDoc(doc(db,"customer_orders",id));

    alert("تم حذف الطلب");

    loadOrders();
}
</script>

</body>
</html>
