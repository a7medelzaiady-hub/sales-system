<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كل الطلبات - الزيادي لزيوت السيارات</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght=400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {   
            --accent: #0b5e3d;          
            --header-bg: #0b5e3d;       
            --bg-light: #f4f7f6;        
            --text-primary: #1b2e26;     
            --text-secondary: #4a5568;   
            --border: #dce3de;          
            --white: #ffffff;  
            --danger: #d90429;  
            --success: #2d6a4f;  
            --warning: #ff9800;  
            --card-radius: 12px;  
            --input-radius: 10px;  
        } 

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg-light);
            color: var(--text-primary);
            padding-bottom: 60px;
            font-size: 0.88rem;
        }

        .header {
            background: var(--header-bg);
            color: #fff;
            padding: 12px 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-btn { 
            background: rgba(255,255,255,0.2); 
            padding: 5px 12px;
            border-radius: 8px; 
            color: white; 
            text-decoration: none; 
            font-size: 0.8rem; 
            font-weight: 700;
            border: none; 
            transition: all 0.2s ease;
        }  
        .nav-btn:hover { 
            background: rgba(255,255,255,0.3); 
            color: white; 
        }

        .reminder-card {
            background: #fff9e6;
            border: 1px solid #ffe0b2;
            border-right: 5px solid var(--warning);
            border-radius: var(--card-radius);
            padding: 15px;
            margin-top: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            display: none;
        }

        .reminder-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px dashed #ffe0b2;
        }
        .reminder-item:last-child { border-bottom: none; }

        .order-card {
            background: var(--white);
            border-radius: var(--card-radius);
            padding: 15px;
            margin-top: 12px;
            border: 1px solid var(--border);
            border-right: 5px solid var(--accent);
            box-shadow: 0 4px 10px rgba(0,0,0,0.01);
        }

        .item {
            background: #f8faf9;
            padding: 8px 12px;
            border-radius: 8px;
            margin-top: 6px;
            font-weight: 600;
            border: 1px solid #edf2f0;
            font-size: 0.82rem;
        }

        .status {
            color: #fff;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
        }

        .empty {
            text-align: center;
            margin-top: 60px;
            color: var(--text-secondary);
            font-weight: 700;
        }

        .urgent-delivery {
            color: var(--danger) !important;
            font-weight: 700;
        }

        /* =================================================== */
        /* ستايل الفاتورة الحرارية للشير (80mm) مثل ستايل المبيعات */
        /* =================================================== */
        #thermal-share-container {
            width: 80mm;
            min-height: 50mm;
            padding: 5mm;
            background: #ffffff;
            color: #000000;
            font-family: 'Arial', sans-serif;
            box-sizing: border-box;
            position: absolute;
            left: -9999px;
            top: -9999px; 
        }
        .thermal-header-title {
            text-align: center;
            border-bottom: 2px dashed #000000;
            padding-bottom: 6px;
            margin-bottom: 8px;
        }
        .thermal-header-title h2 { margin: 0 0 2px 0; font-size: 18px; font-weight: bold; color: #000; }
        .thermal-header-title p { margin: 0; font-size: 12px; font-weight: 600; color: #333; }
        .thermal-meta-row {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: bold;
            margin: 6px 0;
            direction: rtl;
        }
        .thermal-table-share {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            margin-top: 5px;
            direction: rtl;
        }
        .thermal-table-share th {
            border-bottom: 1px solid #000000;
            padding: 4px 0;
            font-weight: bold;
            text-align: center;
        }
        .thermal-table-share td {
            padding: 5px 0;
            border-bottom: 1px dotted #bbbbbb;
            text-align: center;
        }
        .thermal-share-notes {
            margin-top: 10px;
            font-size: 11px;
            border-top: 1px dashed #000;
            padding-top: 5px;
            text-align: right;
            direction: rtl;
        }
        .thermal-share-footer {
            text-align: center;
            margin-top: 15px;
            font-size: 11px;
            font-weight: bold;
            border-top: 1px solid #dddddd;
            padding-top: 6px;
        }
    </style>
</head>
<body>

<div class="header d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-2">
        <a href="index.html" class="text-white me-1 text-decoration-none"><i class="fas fa-arrow-right"></i></a>
        <span class="fw-bold" style="font-size: 0.95rem;">📋 طلبات العملاء</span>
    </div>
    <div class="d-flex gap-2">
        <a href="customer-orders.html" class="nav-btn bg-white text-success border"><i class="fas fa-plus me-1"></i> طلبية جديدة</a>
        <button class="nav-btn" onclick="goHome()"><i class="fas fa-home"></i></button>
    </div>
</div>

<div class="container pb-5 px-2">
    
    <div id="reminderBox" class="reminder-card">
        <h6 class="fw-bold text-dark mb-2" style="font-size: 0.8rem;"><i class="fas fa-bell text-warning me-1"></i> تذكير: طلبيات اقترب موعد تسليمها جداً!</h6>
        <div id="reminderList"></div>
    </div>

    <div id="ordersContainer"></div>

</div>

<!-- =================================================== -->
<!-- قالب الفاتورة الحرارية (80mm) المخفي لغرض مشاركة الطلب -->
<!-- =================================================== -->
<div id="thermal-share-container" dir="rtl">
    <div class="thermal-header-title">
        <h2>الزيادي لزيوت السيارات</h2>
        <p>محاسب / أحمد محمود الزيادي</p>
        
        <div class="thermal-meta-row">
            <span id="th-share-customer" style="font-size: 13px;">العميل: --------</span>
            <span id="th-share-date">التاريخ: --/--/----</span>
        </div>
    </div>

    <table class="thermal-table-share">
        <thead>
            <tr>
                <th style="text-align: right; width: 50%;">البيان (الصنف)</th>
                <th style="text-align: center; width: 25%;">الكمية المطلوبة</th>
                <th style="text-align: left; width: 25%;">السعر</th>
            </tr>
        </thead>
        <tbody id="th-share-items">
            <!-- سيتم تعبئتها ديناميكياً -->
        </tbody>
    </table>

    <div class="thermal-share-notes" id="th-share-notes-box">
        <b>📝 ملاحظات:</b> <span id="th-share-notes-text">لا يوجد</span>
    </div>

    <div class="thermal-share-footer">
        نشكركم لتعاملكم معنا ❤️<br>
        <span style="font-size: 13px; display:inline-block; margin-top:4px; font-family:'Courier New';">📱 01027830834</span>
    </div>
</div>


<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { 
        getFirestore, initializeFirestore, persistentLocalCache, collection, getDocs, 
        query, orderBy, deleteDoc, doc, getDoc, where, limit 
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
        authDomain: "ahmedelzaiady.firebaseapp.com",
        projectId: "ahmedelzaiady",
        storageBucket: "ahmedelzaiady.firebasestorage.app",
        messagingSenderId: "300306825071",
        appId: "1:300306825071:web:0426ddde56280fa090329a",
        measurementId: "G-WE04GK5XZZ"
    };

    const app = initializeApp(firebaseConfig);
    const db = initializeFirestore(app, { localCache: persistentLocalCache() });

    let cachedCustomerNames = {};
    let allOrdersList = [];

    const ORDER_PAGE_NAME = "customer-orders.html";

    async function getCustomerName(customerId) {
        if (!customerId) return "عميل غير معروف";
        if (cachedCustomerNames[customerId]) return cachedCustomerNames[customerId];
        
        try {
            const cSnap = await getDoc(doc(db, "customers", customerId));
            if (cSnap.exists()) {
                cachedCustomerNames[customerId] = cSnap.data().name;
                return cachedCustomerNames[customerId];
            }
        } catch (e) { console.error(e); }
        return "عميل غير معروف";
    }

    function getRemainingDaysText(requiredDateStr) {
        if (!requiredDateStr) return { text: "غير مححدد", isUrgent: false };
        
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        
        const targetDate = new Date(requiredDateStr);
        targetDate.setHours(0, 0, 0, 0);
        
        const diffTime = targetDate - today;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        
        if (diffDays === 0) {
            return { text: "اليوم", isUrgent: true };
        } else if (diffDays === 1) {
            return { text: "غداً", isUrgent: true };
        } else if (diffDays === 2) {
            return { text: "بعد يومين", isUrgent: false };
        } else if (diffDays > 2) {
            return { text: `بعد ${diffDays} أيام`, isUrgent: false };
        } else if (diffDays === -1) {
            return { text: "منذ أمس (متأخر)", isUrgent: true };
        } else {
            return { text: `متأخر منذ ${Math.abs(diffDays)} أيام`, isUrgent: true };
        }
    }

    async function checkUpcomingOrders() {
        try {
            const today = new Date();
            const dateStrings = [];
            
            for(let i = 0; i < 3; i++) {
                const d = new Date();
                d.setDate(today.getDate() + i);
                dateStrings.push(d.toISOString().split('T')[0]);
            }

            const q = query(
                collection(db, "customer_orders"),
                where("status", "==", "pending"),
                where("requiredDate", "in", dateStrings),
                limit(5)
            );

            const snap = await getDocs(q);
            if(snap.empty) {
                document.getElementById('reminderBox').style.display = 'none';
                return;
            }

            const reminderList = document.getElementById('reminderList');
            let listHtml = '';

            for (const orderDoc of snap.docs) {
                const orderData = orderDoc.data();
                const custName = await getCustomerName(orderData.customerId);
                const timing = getRemainingDaysText(orderData.requiredDate);

                listHtml += `
                    <div class="reminder-item">
                        <div>
                            <strong class="text-dark" style="font-size:0.85rem;">👤 ${custName}</strong>
                            <div class="small mt-1 ${timing.isUrgent ? 'urgent-delivery' : 'text-muted'}" style="font-size:0.75rem;">
                                <i class="far fa-calendar-alt me-1"></i> موعد التسليم: ${timing.text}
                            </div>
                        </div>
                        <a href="${ORDER_PAGE_NAME}?edit=${orderDoc.id}" class="btn btn-sm btn-warning text-dark fw-bold px-3" style="border-radius:8px; font-size:11px;">
                            <i class="fas fa-edit me-1"></i> تعديل
                        </a>
                    </div>
                `;
            }

            reminderList.innerHTML = listHtml;
            document.getElementById('reminderBox').style.display = 'block';

        } catch (err) {
            console.error("خطأ أثناء جلب التذكيرات:", err);
        }
    }

    async function loadOrders(){
        const container = document.getElementById("ordersContainer");
        container.innerHTML = `<div class="text-center mt-5 text-muted fw-bold"><i class="fas fa-spinner fa-spin me-2"></i> جاري تحميل سجل الطلبات المحدث...</div>`;

        checkUpcomingOrders();

        try {
            const q = query(
                collection(db, "customer_orders"),
                orderBy("createdAt", "desc")
            );

            const snap = await getDocs(q);
            container.innerHTML = "";
            allOrdersList = [];

            if(snap.empty){
                container.innerHTML = `<div class="empty">📭 لا توجد أي طلبات مسجلة حالياً في النظام</div>`;
                return;
            }

            for (const d of snap.docs) {
                const order = d.data();
                order.id = d.id; 
                allOrdersList.push(order);

                let itemsHTML = "";

                if (order.items && Array.isArray(order.items)) {
                    order.items.forEach(item => {
                        let qtyDetails = [];
                        if(item.cartonQty) qtyDetails.push(`<b>${item.cartonQty}</b> كرتونة`);
                        if(item.pieceQty) qtyDetails.push(`<b>${item.pieceQty}</b> قطعة`);
                        if(!item.cartonQty && !item.pieceQty && item.qty) qtyDetails.push(`<b>${item.qty}</b> وحدة`);

                        itemsHTML += `
                            <div class="item">
                                <i class="fas fa-box text-success me-1" style="font-size:10px;"></i> ${item.name} — الكمية: [ ${qtyDetails.join(' و ')} ] ${item.price ? `— السعر: <b class="text-dark">${item.price} ج.م</b>` : ''}
                            </div>
                        `;
                    });
                }

                const displayCustomerName = await getCustomerName(order.customerId);
                order.resolvedCustomerName = displayCustomerName; 

                const timing = getRemainingDaysText(order.requiredDate);

                const div = document.createElement("div");
                div.className = "order-card";
                
                if(order.status === 'pending') div.style.borderRightColor = 'var(--warning)';

                div.innerHTML = `
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h6 class="fw-bold mb-1" style="color: var(--accent); font-size:0.95rem;">${displayCustomerName}</h6>
                            <small class="fw-bold ${timing.isUrgent ? 'urgent-delivery' : 'text-muted'}" style="font-size:0.75rem;">
                                <i class="far fa-calendar-check me-1"></i> موعد التسليم: ${timing.text}
                            </small>
                        </div>
                        <div class="d-flex gap-1 align-items-center flex-wrap">
                            <span class="status" style="background: ${order.status === 'pending' ? 'var(--warning)' : 'var(--accent)'}">
                                ${order.status === 'pending' ? 'قيد الانتظار' : order.status}
                            </span>

                            <a href="${ORDER_PAGE_NAME}?edit=${d.id}" 
                               class="btn btn-sm btn-light border d-flex align-items-center justify-content-center"
                               style="width:30px; height:30px; border-radius:6px;" title="تعديل">
                                <i class="fas fa-pencil-alt text-primary" style="font-size:11px;"></i>
                            </a>

                            <button class="btn btn-sm btn-light border d-flex align-items-center justify-content-center"
                                style="width:30px; height:30px; border-radius:6px;"
                                onclick="shareOrder('${d.id}')"
                                title="مشاركة الطلب">
                                <i class="fas fa-share-alt text-success" style="font-size:11px;"></i>
                            </button>

                            <button class="btn btn-sm btn-light border d-flex align-items-center justify-content-center"
                                style="width:30px; height:30px; border-radius:6px;"
                                onclick="deleteOrder('${d.id}')"
                                title="حذف">
                                <i class="fas fa-trash-alt text-danger" style="font-size:11px;"></i>
                            </button>
                        </div>
                    </div>
                    <hr class="my-2" style="opacity: 0.08;">
                    ${itemsHTML}
                    <div class="mt-2 p-2 rounded" style="font-size: 12px; background-color: #f1f3f2; border: 1px dashed var(--border);">
                        <b>📝 ملاحظات:</b>
                        <span class="text-secondary">${order.note || "لا يوجد ملاحظات على هذا الطلب"}</span>
                    </div>
                `;
                container.appendChild(div);
            }
        } catch (e) {
            console.error(e);
            container.innerHTML = `<div class="text-center text-danger mt-4 fw-bold">حدث خطأ أثناء جلب الطلبات من السيرفر.</div>`;
        }
    }

    window.deleteOrder = async (id) => {
        const ok = confirm("هل أنت متأكد من رغبتك في حذف هذا الطلب نهائياً من السيستم؟");
        if(!ok) return;

        try {
            await deleteDoc(doc(db, "customer_orders", id));
            alert("تم حذف الطلب بنجاح");
            loadOrders();
        } catch (e) {
            alert("فشل في حذف الطلب");
        }
    };

    window.goHome = () => {
        window.location.href = "index.html";
    };

    // دالة مشاركة الطلب كفاتورة حرارية 80mm مطورة
    window.shareOrder = async (orderId) => {
        try {
            const order = allOrdersList.find(o => o.id === orderId);
            if (!order) {
                alert("لم يتم العثور على بيانات الطلب لتوليد الفاتورة.");
                return;
            }

            // 1. تعبئة البيانات الأساسية في القالب الحراري
            document.getElementById('th-share-customer').innerText = `العميل: ${order.resolvedCustomerName || 'عميل غير معروف'}`;
            
            let dateStr = "غير محدد";
            if (order.createdAt) {
                if (order.createdAt.seconds) {
                    dateStr = new Date(order.createdAt.seconds * 1000).toLocaleDateString('ar-EG');
                } else if (typeof order.createdAt === "string") {
                    dateStr = order.createdAt.split('T')[0];
                }
            }
            document.getElementById('th-share-date').innerText = `التاريخ: ${dateStr}`;

            // 2. تعبئة الأصناف والكميات
            const itemsContainer = document.getElementById('th-share-items');
            itemsContainer.innerHTML = '';

            if (order.items && Array.isArray(order.items)) {
                order.items.forEach(item => {
                    let qtyTexts = [];
                    if (item.cartonQty) qtyTexts.push(`${item.cartonQty} كرتونة`);
                    if (item.pieceQty) qtyTexts.push(`${item.pieceQty} قطعة`);
                    if (!item.cartonQty && !item.pieceQty && item.qty) qtyTexts.push(`${item.qty} وحدة`);

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td style="text-align: right; padding: 5px 0; font-weight: bold;">📦 ${item.name}</td>
                        <td style="font-weight: bold;">${qtyTexts.join(' و ')}</td>
                        <td style="text-align: left; font-weight: bold;">${item.price ? `${item.price} ج.م` : '-'}</td>
                    `;
                    itemsContainer.appendChild(tr);
                });
            }

            // 3. الملاحظات
            if (order.note) {
                document.getElementById('th-share-notes-box').style.display = 'block';
                document.getElementById('th-share-notes-text').innerText = order.note;
            } else {
                document.getElementById('th-share-notes-box').style.display = 'none';
            }

            // 4. التقاط القالب وتحويله لصورة عبر html2canvas
            const thermalContainer = document.getElementById('thermal-share-container');
            
            const canvas = await html2canvas(thermalContainer, {
                scale: 2.5,
                useCORS: true,
                backgroundColor: "#ffffff"
            });

            canvas.toBlob(async (blob) => {
                if (!blob) {
                    alert("حدث خطأ أثناء إعداد الصورة الحرارية.");
                    return;
                }

                const file = new File([blob], `Order_Thermal_${orderId}.png`, { type: "image/png" });

                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({
                            title: "طلب عميل - الزيادي",
                            text: `طلب العميل: ${order.resolvedCustomerName}`,
                            files: [file]
                        });
                    } catch (shareErr) {
                        console.log("تم إلغاء الشير أو واجه المتصفح قيوداً:", shareErr);
                    }
                } else {
                    const link = document.createElement("a");
                    link.href = URL.createObjectURL(blob);
                    link.download = `Order_Thermal_${orderId}.png`;
                    link.click();
                }
            }, "image/png");

        } catch (err) {
            console.error(err);
            alert("حدث خطأ غير متوقع أثناء توليد صورة الفاتورة الحرارية.");
        }
    };

    loadOrders();
</script>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

</body>
</html>
