<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إدارة الصندوق - شركة الزيادي</title>
    <!-- Bootstrap RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;850;900&family=Montserrat:wght@500;750;900&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --accent: #0b5e3d; 
            --accent-gradient: linear-gradient(135deg, #064e3b, #0b5e3d, #14532d);
            --bg: #f4f6f8; 
            --success: #10b981; 
            --danger: #ef4444; 
            --panel: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            --radius-md: 16px;
            --radius-lg: 24px;
        }
        
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            background: #e2e8f0; 
            font-family: 'Cairo', sans-serif; 
            padding-bottom: 30px; 
            color: var(--text-dark);
            -webkit-font-smoothing: antialiased;
        }

        /* حاوية الهاتف المحمول الاحترافية لمنع التمدد وتوسيط الواجهة */
        .app-container {
            max-width: 500px;
            margin: 0 auto;
            background: var(--bg);
            min-height: 100vh;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
            position: relative;
            overflow-hidden: hidden;
            padding-bottom: 40px;
        }

        .num { 
            font-family: 'Montserrat', 'Cairo', sans-serif !important; 
            font-weight: 800; 
        }

        /* ===== Header fakhim ===== */
        .header-nav { 
            background: var(--accent-gradient); 
            color: white; 
            padding: 20px 16px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            border-radius: 0 0 var(--radius-lg) var(--radius-lg);
            box-shadow: 0 10px 25px rgba(6, 78, 59, 0.15);
        }

        .back-btn {
            color: white;
            background: rgba(255,255,255,0.12);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none !important;
            transition: 0.2s;
        }
        .back-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.25); }
        
        .header-title { text-align: center; }
        .header-title span { font-size: 0.65rem; letter-spacing: 1.5px; opacity: 0.85; font-weight: 850; color: #fcd34d; display: block; }
        .header-title h1 { font-size: 1.15rem; font-weight: 900; margin: 3px 0 0; }

        /* ===== Balance Card ===== */
        .balance-card { 
            background: var(--panel); 
            border-radius: var(--radius-lg); 
            margin: 20px 16px; 
            padding: 25px 16px; 
            text-align: center; 
            box-shadow: var(--card-shadow); 
            border: 1px solid rgba(0,0,0,0.02); 
        }
        .balance-amount { 
            color: var(--accent); 
            font-size: 2.2rem; 
            font-weight: 900; 
            margin-top: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        /* ===== Inputs & Actions ===== */
        .action-card { 
            background: var(--panel); 
            border-radius: var(--radius-lg); 
            margin: 0 16px; 
            padding: 20px; 
            box-shadow: var(--card-shadow); 
            border: 1px solid rgba(0,0,0,0.02);
        }
        .btn-group-toggle { display: flex; gap: 8px; margin-bottom: 16px; }
        .type-btn { 
            flex: 1; 
            border-radius: var(--radius-md); 
            padding: 12px; 
            border: 1px solid var(--border-color); 
            font-weight: 850; 
            background: #f8fafc; 
            color: var(--text-muted); 
            font-size: 0.85rem;
            transition: 0.2s;
        }
        .type-btn.active-plus { background: var(--accent); color: white; border-color: var(--accent); box-shadow: 0 4px 10px rgba(11, 94, 61, 0.2); }
        .type-btn:active { transform: scale(0.96); }

        .input-box { background: #f8fafc; border-radius: var(--radius-md); padding: 12px; margin-bottom: 12px; border: 1px solid var(--border-color); }
        .input-field { border: none; background: transparent; width: 100%; font-size: 1rem; font-weight: 800; text-align: center; outline: none; font-family: 'Cairo'; color: var(--text-dark); }
        .input-field::placeholder { color: #cbd5e1; }
        
        .btn-confirm { 
            background: var(--success); 
            color: white; 
            width: 100%; 
            border: none; 
            padding: 14px; 
            border-radius: var(--radius-md); 
            font-weight: 850; 
            font-size: 0.95rem;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.25); 
            transition: 0.2s;
        }
        .btn-confirm:active { transform: scale(0.97); }
        
        /* ===== Logs History ===== */
        .history-title { margin: 24px 20px 12px; font-weight: 850; color: var(--text-dark); font-size: 0.95rem; }
        .log-item { 
            background: var(--panel); 
            border-radius: var(--radius-md); 
            margin: 0 16px 10px; 
            padding: 14px; 
            display: flex; 
            align-items: center; 
            box-shadow: var(--card-shadow); 
            border: 1px solid rgba(0,0,0,0.01);
        }
        .log-icon { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-left: 12px; flex-shrink: 0; }
        .icon-in { background: #eefdf6; color: var(--success); }
        .icon-out { background: #fff1f2; color: var(--danger); }
        .log-info { flex-grow: 1; min-width: 0; }
        .log-name { font-weight: 800; font-size: 0.85rem; color: var(--text-dark); margin: 0; line-height: 1.5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .log-time { font-size: 0.68rem; color: var(--text-muted); font-weight: 600; display: block; margin-top: 2px; }
        .log-val { text-align: left; font-weight: 850; font-size: 0.95rem; min-width: 90px; }
        
        .badge-sale { display: inline-block; font-size: 0.6rem; background: #e0f2f1; color: #00796b; padding: 2px 6px; border-radius: 6px; margin-left: 6px; font-weight: 900; vertical-align: middle; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- هيدر التطبيق -->
    <div class="header-nav">
        <div style="width: 36px;"></div>
        <div class="header-title">
            <span>شركة الزيادي للتجارة</span>
            <h1>إدارة الصندوق النقدي</h1>
        </div>
        <a href="index1.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
    </div>

    <!-- كارت عرض رصيد الخزنة المحدث دائماً -->
    <div class="balance-card">
        <p class="text-muted small mb-1 fw-bold">صافي النقدية الفعلي بالدرج</p>
        <div class="balance-amount">
            <span class="num" id="currentBalance">0.00</span>
            <small style="font-size: 1rem; font-weight: 800;">ج.م</small>
        </div>
        <p class="today-date small text-muted mt-2 fw-bold" id="todayDate"></p>
    </div>

    <!-- كارت الحركات يدوي مبيعات ومصروفات -->
    <div class="action-card">
        <div class="btn-group-toggle">
            <button class="type-btn active-plus" id="btnIn" onclick="setType('in')">إيداع (+)</button>
            <button class="type-btn" id="btnOut" onclick="setType('out')">سحب (-)</button>
        </div>
        <div class="input-box text-center">
            <span class="small text-muted d-block mb-1 fw-bold">المبلغ المطلوب</span>
            <input type="number" id="amount" class="input-field num" placeholder="0.00">
        </div>
        <div class="input-box">
            <span class="small text-muted d-block mb-1 fw-bold">البيان / ملاحظات توضيحية</span>
            <input type="text" id="note" class="input-field" placeholder="اكتب تفاصيل المعاملة...">
        </div>
        <button class="btn-confirm" id="btnConfirm" onclick="saveTransaction()">تأكيد عملية الإيداع</button>
    </div>

    <h6 class="history-title">آخر 20 عملية مسجلة</h6>
    <div id="logsList">
        <div class="text-center py-5">
            <div class="spinner-border text-success" role="status"></div>
            <p class="mt-2 text-muted small fw-bold">جاري تحميل المعاملات النقدية والـ Live Match...</p>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, limit, serverTimestamp, doc, getDoc, updateDoc, orderBy, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyB3jpSs_LiIZwoaPIgRAiALVX5F1OkBYOI", authDomain: "elzyady-da509.firebaseapp.com", projectId: "elzyady-da509", storageBucket: "elzyady-da509.firebasestorage.app", messagingSenderId: "242117738897", appId: "1:242117738897:web:d658d6ca335b316f7f9a30" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentType = 'in';
    document.getElementById('todayDate').innerText = 'بتاريخ اليوم: ' + new Date().toLocaleDateString('ar-EG');

    window.setType = (t) => {
        currentType = t;
        document.getElementById('btnIn').classList.toggle('active-plus', t==='in');
        document.getElementById('btnOut').classList.toggle('active-plus', t==='out');
        document.getElementById('btnConfirm').style.background = t==='in' ? '#10b981' : '#ef4444';
        document.getElementById('btnConfirm').innerText = t==='in' ? 'تأكيد عملية الإيداع' : 'تأكيد عملية السحب';
    };

    function parseSignedNumber(val) {
        if (val === null || val === undefined || val === '') return 0;
        if (typeof val === 'number') return val;
        let s = String(val).trim().replace(/,/g, '');
        let negative = false;
        if (s.startsWith('(') && s.endsWith(')')) { negative = true; s = s.slice(1, -1); }
        if (s.endsWith('-')) { negative = true; s = s.slice(0, -1); }
        if (s.startsWith('-')) { negative = true; s = s.slice(1); }
        const n = parseFloat(s);
        return isNaN(n) ? 0 : (negative ? -n : n);
    }

    async function loadData() {
        try {
            // 1. حساب الرصيد الفعلي الحقيقي ديناميكياً من كافة حركات الصندوق (القبض والشرائح الأخرى)
            const cashLogsSnap = await getDocs(collection(db, "cash_logs"));
            let actualBalance = 0;

            cashLogsSnap.forEach(doc => {
                const data = doc.data();
                const amt = parseSignedNumber(data.amount);
                if (data.type === 'in' || data.type === 'قبض') {
                    actualBalance += amt;
                } else if (data.type === 'out' || data.type === 'صرف') {
                    actualBalance -= amt;
                }
            });

            document.getElementById('currentBalance').innerText = actualBalance.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

            // 2. جلب وتجميع السجلات للدرج
            const logsQuery = query(collection(db, "cash_logs"), orderBy("timestamp", "desc"), limit(20));
            const logsSnap = await getDocs(logsQuery);
            
            const invQuery = query(collection(db, "invoices"), orderBy("timestamp", "desc"), limit(10));
            const invSnap = await getDocs(invQuery);

            let combinedLogs = [];

            invSnap.forEach(d => {
                const data = d.data();
                const paid = Math.round(Number(data.total || 0) - Number(data.remaining || 0));
                if(paid > 0) {
                    combinedLogs.push({
                        name: data.customerName || 'عميل نقدي',
                        amount: paid,
                        type: 'in',
                        time: data.time || '',
                        isSale: true,
                        ts: data.timestamp?.seconds || 0
                    });
                }
            });

            logsSnap.forEach(d => {
                const data = d.data();
                combinedLogs.push({
                    name: data.note || (data.type === 'in' ? 'إيداع نقدي' : 'سحب مصروفات'),
                    amount: data.amount,
                    type: data.type,
                    time: data.date || '',
                    isSale: false,
                    ts: data.timestamp?.seconds || 0
                });
            });

            combinedLogs.sort((a, b) => b.ts - a.ts);

            const logsList = document.getElementById('logsList');
            if(combinedLogs.length === 0) {
                logsList.innerHTML = '<div class="text-center py-5 text-muted small fw-bold">لا توجد عمليات مسجلة بالدرج</div>';
            } else {
                logsList.innerHTML = combinedLogs.slice(0, 20).map(log => `
                    <div class="log-item">
                        <div class="log-icon ${log.type === 'in' ? 'icon-in' : 'icon-out'}">
                            <i class="fas fa-${log.type === 'in' ? 'plus' : 'minus'}"></i>
                        </div>
                        <div class="log-info">
                            <p class="log-name">
                                ${log.isSale ? '<span class="badge-sale">مبيعات</span>' : ''}
                                ${log.name}
                            </p>
                            <span class="log-time">${log.time}</span>
                        </div>
                        <div class="log-val num" style="color: ${log.type === 'in' ? '#10b981' : '#ef4444'}">
                            ${log.type === 'in' ? '+' : '-'}${Math.round(log.amount).toLocaleString('en-US')} <small style="font-size:0.6rem; font-weight:800;">ج.م</small>
                        </div>
                    </div>
                `).join('');
            }
        } catch (e) {
            console.error(e);
            document.getElementById('logsList').innerHTML = '<div class="alert alert-danger mx-3 small">خطأ في مزامنة الحسابات النقدية</div>';
        }
    }

    window.saveTransaction = async () => {
        const amtInput = document.getElementById('amount');
        const amt = Math.round(Number(amtInput.value));
        const nt = document.getElementById('note').value;
        
        if(!amt || amt <= 0) return alert('برجاء إدخال مبلغ صحيح');

        const btn = document.getElementById('btnConfirm');
        btn.disabled = true; btn.innerText = 'جاري تسجيل العملية بالخزينة...';

        try {
            await addDoc(collection(db, "cash_logs"), {
                amount: amt,
                note: nt,
                type: currentType,
                timestamp: serverTimestamp(),
                date: new Date().toLocaleString('ar-EG')
            });

            // تحديث كاش ميتا كقيمة احتياطية سريعة
            const change = currentType === 'in' ? amt : -amt;
            const metaRef = doc(db, "settings", "cash_meta");
            await updateDoc(metaRef, { balance: increment(change) });

            amtInput.value = '';
            document.getElementById('note').value = '';
            loadData();
        } catch (e) { 
            console.error(e);
            alert("فشل تحديث الخزنة!"); 
        }
        btn.disabled = false;
        setType(currentType);
    };

    loadData();
</script>
</body>
</html>
