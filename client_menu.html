<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
getFirestore,
collection,
getDocs,
deleteDoc,
doc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
  authDomain: "ahmedelzaiady.firebaseapp.com",
  projectId: "ahmedelzaiady",
  storageBucket: "ahmedelzaiady.firebasestorage.app",
  messagingSenderId: "300306825071",
  appId: "1:300306825071:web:0426ddde56280fa090329a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ✔️ حذف كل العملاء
window.deleteAllCustomers = async function(){

const ok = confirm("⚠️ هل تريد حذف كل العملاء نهائياً؟");
if(!ok) return;

const pass = prompt("اكتب كلمة السر:");

if(pass !== "1234"){
    alert("❌ كلمة السر غلط");
    return;
}

try{

const snap = await getDocs(collection(db,"customers"));

// ✔️ الطريقة الصحيحة
for(const d of snap.docs){
    await deleteDoc(doc(db,"customers",d.id));
}

alert("تم حذف كل العملاء بنجاح ✅");

}catch(err){
console.log(err);
alert("حدث خطأ أثناء الحذف");
}

}

</script>
