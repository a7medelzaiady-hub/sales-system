<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كشف حساب العملاء — الزيادي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root{
    --ink:#0e2a22;
    --paper:#f6f4ee;
    --panel:#ffffff;
    --emerald:#0b5e3d;
    --emerald-deep:#073e29;
    --gold:#b6892f;
    --gold-soft:#f0e2c0;
    --owed:#b3261e;
    --owed-bg:#fbe9e8;
    --credit:#1c7a4d;
    --credit-bg:#e7f5ec;
    --line:#e3ddd0;
    --mute:#7c8b82;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Cairo',sans-serif; -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }
  .num{ font-family:'JetBrains Mono', monospace; font-weight:700; letter-spacing:-0.3px; }

  /* ===== Header ===== */
  header{
    background:linear-gradient(155deg, var(--emerald-deep), var(--emerald) 70%);
    color:#fff; padding:22px 18px 70px; position:relative; overflow:hidden;
  }
  header::after{
    content:""; position:absolute; inset:0;
    background-image: radial-gradient(circle at 85% 0%, rgba(182,137,47,0.25), transparent 55%);
    pointer-events:none;
  }
  .top-row{ display:flex; align-items:center; justify-content:space-between; position:relative; z-index:1; }
  .back-link{ color:#fff; opacity:.85; font-size:1.1rem; text-decoration:none; width:32px; }
  .brand{ text-align:center; }
  .brand .eyebrow{ font-size:.62rem; letter-spacing:2px; text-transform:uppercase; opacity:.65; font-weight:600; }
  .brand h1{ font-size:1.05rem; font-weight:800; margin:2px 0 0; }

  .search-wrap{ position:relative; z-index:1; margin-top:18px; }
  .search-box{
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.22);
    border-radius:14px; padding:11px 16px; display:flex; align-items:center; gap:10px;
    backdrop-filter: blur(4px);
  }
  .search-box i{ opacity:.7; font-size:.85rem; }
  .search-box input{ background:transparent; border:none; outline:none; color:#fff; width:100%; font-family:'Cairo'; font-size:.9rem; }
  .search-box input::placeholder{ color:rgba(255,255,255,.6); }

  /* ===== Summary stat strip ===== */
  .stats{
    position:relative; z-index:1; margin:-48px 14px 0; display:grid;
    grid-template-columns: repeat(3, 1fr); gap:6px;
  }
  .stat-card{
    background:var(--panel); border-radius:16px; padding:14px 12px;
    box-shadow:0 10px 24px rgba(11,40,28,.10); text-align:center;
    border-top:3px solid var(--line);
  }
  .stat-card.owed{ border-top-color:var(--owed); }
  .stat-card.credit{ border-top-color:var(--credit); }
  .stat-card.net{ border-top-color:var(--gold); }
  .stat-card .lbl{ font-size:.62rem; color:var(--mute); font-weight:700; letter-spacing:.3px; }
  .stat-card .val{ font-size:1.02rem; margin-top:5px; }
  .stat-card.owed .val{ color:var(--owed); }
  .stat-card.credit .val{ color:var(--credit); }
  .stat-card.net .val{ color:var(--gold); }
  .stat-card .cur{ font-size:.6rem; font-weight:600; color:var(--mute); }

  /* ===== Toolbar ===== */
  .toolbar{
    margin:18px 14px 6px; display:flex; gap:8px; align-items:center; justify-content:space-between;
  }
  .filter-pills{ display:flex; gap:6px; }
  .pill{
    border:1px solid var(--line); background:#fff; color:var(--ink); font-size:.72rem; font-weight:700;
    padding:6px 12px; border-radius:999px; cursor:pointer; transition:.15s;
  }
  .pill.active{ background:var(--emerald); color:#fff; border-color:var(--emerald); }
  .count-tag{ font-size:.7rem; color:var(--mute); font-weight:600; }

  /* ===== List ===== */
  #customersContainer{ padding:8px 14px 0; }
  .customer-card{
    background:var(--panel); border:1px solid var(--line); border-radius:18px;
    padding:14px 16px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;
    border-right:4px solid var(--line); transition:.2s;
  }
  .customer-card.has-debt{ border-right-color:var(--owed); }
  .customer-card.is-credit{ border-right-color:var(--credit); }
  .customer-card.is-zero{ border-right-color:var(--line); }

  .avatar{
    width:38px; height:38px; border-radius:11px; background:var(--gold-soft); color:var(--emerald-deep);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:.85rem; flex-shrink:0;
  }
  .row-main{ display:flex; gap:12px; align-items:center; }
  .customer-name{ font-weight:700; font-size:.92rem; margin:0; }
  .phone-sub{ font-size:.7rem; color:var(--mute); font-weight:600; display:block; margin-top:2px; }
  .balance-label{ font-size:.6rem; color:var(--mute); font-weight:700; display:block; margin-top:6px; }
  .balance-value{ font-weight:800; font-size:.95rem; }
  .text-debt{ color:var(--owed); }
  .text-credit{ color:var(--credit); }
  .text-zero{ color:var(--mute); }
  .tag{ font-size:.58rem; font-weight:700; padding:1px 7px; border-radius:6px; margin-right:5px; }
  .tag.debt{ background:var(--owed-bg); color:var(--owed); }
  .tag.credit{ background:var(--credit-bg); color:var(--credit); }
  .tag.zero{ background:#eee; color:var(--mute); }

  .action-container{ display:flex; gap:6px; }
  .action-btn{
    width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    text-decoration:none; font-size:.9rem; transition:.15s; border:1px solid transparent;
  }
  .btn-pay{ background:var(--credit-bg); color:var(--credit); border-color:rgba(28,122,77,.2); }
  .btn-info{ background:#eaf1ee; color:var(--emerald); border-color:rgba(11,94,61,.2); }
  .btn-del{ background:var(--owed-bg); color:var(--owed); border-color:rgba(179,38,30,.25); }

  .danger-btn{
    width:100%; background:rgba(179,38,30,.18); border:1px solid rgba(255,255,255,.25);
    color:#fff; font-family:'Cairo'; font-weight:700; font-size:.78rem; padding:10px;
    border-radius:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .danger-btn:hover{ background:rgba(179,38,30,.3); }

  .loading-shimmer{ color:#bbb; font-style:italic; font-size:.75rem; }
  .empty-state{ text-align:center; padding:60px 20px; color:var(--mute); }
  .empty-state i{ font-size:2rem; opacity:.3; margin-bottom:10px; display:block; }

  @media (max-width: 360px){
    .stats{ grid-template-columns: 1fr 1fr; }
    .stat-card.net{ grid-column: span 2; }
  }
</style>
</head>
<body>

<header>
  <div class="top-row">
    <a href="client_menu.html" class="back-link"><i class="fas fa-chevron-right"></i></a>
    <div class="brand">
      <span class="eyebrow">شركة الزيادي</span>
      <h1>كشف حساب العملاء</h1>
    </div>
    <span style="width:32px;"></span>
  </div>
  <div class="search-wrap">
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="ابحث بالإسم أو رقم الهاتف..." oninput="filterCustomers()">
    </div>
  </div>
  <div style="position:relative;z-index:1;margin-top:10px;">
    <button class="danger-btn" id="deleteAllBtn"><i class="fas fa-trash-can"></i> مسح كل العملاء من قاعدة البيانات</button>
  </div>
</header>

<div class="stats">
  <div class="stat-card owed">
    <div class="lbl">إجمالي عليه</div>
    <div class="val num" id="totalOwed">0.00</div>
    <div class="cur">ج.م</div>
  </div>
  <div class="stat-card credit">
    <div class="lbl">إجمالي له</div>
    <div class="val num" id="totalCredit">0.00</div>
    <div class="cur">ج.م</div>
  </div>
  <div class="stat-card net">
    <div class="lbl">الصافي</div>
    <div class="val num" id="netBalance">0.00</div>
    <div class="cur">ج.م</div>
  </div>
</div>

<div class="toolbar">
  <div class="filter-pills">
    <button class="pill active" data-filter="all" onclick="setFilter('all')">الكل</button>
    <button class="pill" data-filter="debt" onclick="setFilter('debt')">عليه</button>
    <button class="pill" data-filter="credit" onclick="setFilter('credit')">له</button>
  </div>
  <span class="count-tag" id="countTag"></span>
</div>


<div id="customersContainer">
  <div class="text-center py-5" id="initialLoader" style="text-align:center;padding:50px 0;">
    <i class="fas fa-circle-notch fa-spin" style="font-size:1.5rem;color:#0b5e3d;"></i>
    <p style="margin-top:10px;font-size:.8rem;font-weight:700;color:#7c8b82;">جاري تحميل القائمة...</p>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, getDocs, orderBy, query, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
    authDomain: "ahmedelzaiady.firebaseapp.com",
    projectId: "ahmedelzaiady",
    storageBucket: "ahmedelzaiady.firebasestorage.app",
    messagingSenderId: "300306825071",
    appId: "1:300306825071:web:0426ddde56280fa090329a",
    measurementId: "G-WE04GK5XZZ"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let allCustomers = [];
  let currentFilter = 'all';

  const fmt = (n) => Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  // يحول أي قيمة (رقم أو نص) إلى رقم صحيح مع الحفاظ على الإشارة الصحيحة.
  // يعالج الحالات الشائعة في برامج المحاسبة العربية مثل "1000-" (سالب متأخر)
  // أو "(1000)" أو أرقام بها فواصل آلاف "1,000.50".
  function parseSignedNumber(val) {
    if (val === null || val === undefined || val === '') return 0;
    if (typeof val === 'number') return val;
    let s = String(val).trim().replace(/,/g, '');
    let negative = false;
    if (s.startsWith('(') && s.endsWith(')')) { negative = true; s = s.slice(1, -1); }
    if (s.endsWith('-')) { negative = true; s = s.slice(0, -1); }
    if (s.startsWith('-')) { negative = true; s = s.slice(1); }
    const n = parseFloat(s);
    if (isNaN(n)) return 0;
    return negative ? -n : n;
  }

  /*
    تحسين جوهري لتقليل القراءات (Reads):
    بدلاً من عمل query منفصل على invoices و transactions لكل عميل على حدة
    (وهو ما كان يكلف 2×N قراءة استعلام لكل عميل)، يتم الآن جلب مجموعتي
    invoices و transactions بالكامل مرة واحدة فقط، ثم تجميع المبالغ في الذاكرة
    حسب customerId / partyId. هذا يحول التكلفة من O(2N) استعلام إلى استعلامين فقط
    بغض النظر عن عدد العملاء.
  */
  async function loadAllLedgerData() {
    const debtMap = {}; // customerId -> net balance contribution

    const [invoicesSnap, transSnap] = await Promise.all([
      getDocs(collection(db, "invoices")),
      getDocs(collection(db, "transactions"))
    ]);

    invoicesSnap.forEach(d => {
      const data = d.data();
      const cid = data.customerId;
      if (!cid) return;
      debtMap[cid] = (debtMap[cid] || 0) + parseSignedNumber(data.remaining);
    });

    transSnap.forEach(d => {
      const tr = d.data();
      const pid = tr.partyId;
      if (!pid) return;
      let effect = 0;
      const amt = parseSignedNumber(tr.amount);
      if (tr.type === 'قبض') effect = -Math.abs(amt);
      else if (tr.type === 'صرف') effect = Math.abs(amt);
      debtMap[pid] = (debtMap[pid] || 0) + effect;
    });

    return debtMap;
  }

  async function loadCustomers() {
    const container = document.getElementById('customersContainer');
    try {
      const q = query(collection(db, "customers"), orderBy("name"));
      const [custSnap, debtMap] = await Promise.all([getDocs(q), loadAllLedgerData()]);

      allCustomers = custSnap.docs.map(d => {
        const data = d.data();
        const initial = parseSignedNumber(data.initialBalance);
        const ledgerEffect = debtMap[d.id] || 0;
        return {
          id: d.id,
          ...data,
          realBalance: initial + ledgerEffect
        };
      });

      renderCustomers(allCustomers);
      updateStats(allCustomers);

    } catch (e) {
      container.innerHTML = `<div style="color:#b3261e;text-align:center;padding:20px;font-weight:700;">خطأ: ${e.message}</div>`;
    }
  }

  function updateStats(list) {
    let totalOwed = 0, totalCredit = 0;
    list.forEach(c => {
      if (c.realBalance > 0) totalOwed += c.realBalance;
      else if (c.realBalance < 0) totalCredit += Math.abs(c.realBalance);
    });
    document.getElementById('totalOwed').textContent = fmt(totalOwed);
    document.getElementById('totalCredit').textContent = fmt(totalCredit);
    const net = totalOwed - totalCredit;
    const netEl = document.getElementById('netBalance');
    netEl.textContent = (net < 0 ? '-' : '') + fmt(net);
  }

  function balanceMeta(balance) {
    if (balance > 0) return { cls: 'has-debt', txtCls: 'text-debt', tagCls: 'debt', tagTxt: 'عليه' };
    if (balance < 0) return { cls: 'is-credit', txtCls: 'text-credit', tagCls: 'credit', tagTxt: 'له' };
    return { cls: 'is-zero', txtCls: 'text-zero', tagCls: 'zero', tagTxt: 'خالص' };
  }

  function initials(name) {
    if (!name) return '؟';
    const parts = name.trim().split(' ');
    return parts.length > 1 ? (parts[0][0] + parts[1][0]) : parts[0].slice(0, 2);
  }

  window.renderCustomers = (list) => {
    const container = document.getElementById('customersContainer');
    document.getElementById('countTag').textContent = `${list.length} عميل`;

    if (list.length === 0) {
      container.innerHTML = `<div class="empty-state"><i class="fas fa-folder-open"></i>لا توجد نتائج مطابقة</div>`;
      return;
    }

    container.innerHTML = list.map(cust => {
      const balance = cust.realBalance;
      const meta = balanceMeta(balance);
      return `
        <div id="card-${cust.id}" class="customer-card ${meta.cls}">
          <div class="row-main">
            <div class="avatar">${initials(cust.name)}</div>
            <div>
              <h6 class="customer-name">${cust.name}</h6>
              <small class="phone-sub"><i class="fas fa-phone-alt me-1"></i> ${cust.phone || 'بدون هاتف'}</small>
              <span class="balance-label">صافي الرصيد الحالي</span>
              <span class="balance-value ${meta.txtCls}">
                <span class="num">${fmt(balance)}</span>
                <small style="font-size:.6rem;"> ج.م</small>
                <span class="tag ${meta.tagCls}">${meta.tagTxt}</span>
              </span>
            </div>
          </div>
          <div class="action-container">
            <a href="customer-details.html?id=${cust.id}" class="action-btn btn-info"><i class="fas fa-user-tag"></i></a>
            <a href="customer-payment.html?id=${cust.id}" class="action-btn btn-pay"><i class="fas fa-hand-holding-dollar"></i></a>
            <button class="action-btn btn-del" onclick="deleteCustomer('${cust.id}', '${(cust.name || '').replace(/'/g, "\\'")}')"><i class="fas fa-trash"></i></button>
          </div>
        </div>
      `;
    }).join('');
  };

  function applyFilters() {
    const term = document.getElementById('searchInput').value.toLowerCase();
    let filtered = allCustomers.filter(c =>
      (c.name && c.name.toLowerCase().includes(term)) ||
      (c.phone && c.phone.includes(term))
    );
    if (currentFilter === 'debt') filtered = filtered.filter(c => c.realBalance > 0);
    if (currentFilter === 'credit') filtered = filtered.filter(c => c.realBalance < 0);
    renderCustomers(filtered);
    updateStats(filtered);
  }

  window.filterCustomers = applyFilters;

  window.setFilter = (f) => {
    currentFilter = f;
    document.querySelectorAll('.pill').forEach(p => p.classList.toggle('active', p.dataset.filter === f));
    applyFilters();
  };

  // ===== مسح عميل واحد =====
  window.deleteCustomer = async (id, name) => {
    if (!confirm(`هل أنت متأكد من مسح العميل "${name}"؟ لا يمكن التراجع عن هذا الإجراء.`)) return;
    try {
      await deleteDoc(doc(db, 'customers', id));
      allCustomers = allCustomers.filter(c => c.id !== id);
      applyFilters();
    } catch (err) {
      alert('خطأ أثناء المسح: ' + err.message);
    }
  };

  // ===== مسح كل العملاء من قاعدة البيانات =====
  document.getElementById('deleteAllBtn').addEventListener('click', async () => {
    if (allCustomers.length === 0) return;
    const sure1 = confirm(`سيتم مسح ${allCustomers.length} عميل نهائياً من قاعدة البيانات. هل أنت متأكد؟`);
    if (!sure1) return;
    const sure2 = confirm('تأكيد أخير: هذا الإجراء لا يمكن التراجع عنه. متابعة؟');
    if (!sure2) return;

    try {
      await Promise.all(allCustomers.map(c => deleteDoc(doc(db, 'customers', c.id))));
      allCustomers = [];
      applyFilters();
    } catch (err) {
      alert('خطأ أثناء مسح العملاء: ' + err.message);
    }
  });

  loadCustomers();
</script>
</body>
</html>
