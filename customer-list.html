<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة العملاء - شركة الزيادي</title>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --main: #0b5e3d;
            --bg: #f4f7f6;
            --white: #fff;
            --border: #dce3de;
            --danger: #dc3545;
        }

        body {
            background: var(--bg);
            font-family: 'Cairo', sans-serif;
        }

        .header {
            background: var(--main);
            color: white;
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .customer-card {
            background: white;
            border-radius: 18px;
            padding: 15px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 3px 10px rgba(0,0,0,0.03);
        }

        .customer-name {
            font-weight: bold;
            font-size: 1rem;
        }

        .customer-phone {
            color: gray;
            font-size: .85rem;
        }

        .action-btn {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 10px;
            color: white;
        }

        .btn-edit {
            background: #0d6efd;
        }

        .btn-delete {
            background: var(--danger);
        }

        .search-box {
            border-radius: 14px;
            padding: 12px;
        }

        .home-btn{
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: rgba(255,255,255,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="header">

    <i class="fas fa-arrow-right"
       onclick="history.back()"
       style="cursor:pointer"></i>

    <h5 class="m-0 fw-bold">قائمة العملاء</h5>

    <a href="index.html" class="home-btn">
        <i class="fas fa-home"></i>
    </a>

</div>

<div class="container py-3">

    <div class="mb-3 d-flex gap-2">

        <input type="text"
               class="form-control search-box"
               id="searchInput"
               placeholder="بحث باسم العميل أو الهاتف"
               oninput="renderCustomers()">

        <button class="btn btn-success"
                onclick="location.href='add-customer.html'">
            <i class="fas fa-plus"></i>
        </button>

    </div>

    <div id="customersContainer"></div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
    getFirestore,
    collection,
    onSnapshot,
    updateDoc,
    doc,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";


const firebaseConfig = {

    apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
    authDomain: "ahmedelzaiady.firebaseapp.com",
    projectId: "ahmedelzaiady",
    storageBucket: "ahmedelzaiady.firebasestorage.app",
    messagingSenderId: "300306825071",
    appId: "1:300306825071:web:0426ddde56280fa090329a"

};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let customers = [];


/* ===========================
   تحميل العملاء
=========================== */

function listenCustomers() {

    onSnapshot(collection(db, "customers"), (snapshot) => {

        customers = [];

        snapshot.forEach(docSnap => {

            const data = docSnap.data();

            // إخفاء المحذوفين
            if(data.isDeleted !== true){

                customers.push({
                    id: docSnap.id,
                    ...data
                });

            }

        });

        renderCustomers();

    });

}


/* ===========================
   عرض العملاء
=========================== */

window.renderCustomers = function () {

    const search =
        document.getElementById("searchInput")
        .value
        .toLowerCase();

    const container =
        document.getElementById("customersContainer");

    const filtered = customers.filter(c =>

        (c.name || "")
        .toLowerCase()
        .includes(search)

        ||

        (c.phone || "")
        .includes(search)

    );

    let html = "";

    filtered.forEach(item => {

        html += `

        <div class="customer-card">

            <div class="d-flex justify-content-between align-items-center">

                <div>

                    <div class="customer-name">
                        ${item.name || 'بدون اسم'}
                    </div>

                    <div class="customer-phone">
                        ${item.phone || 'لا يوجد رقم'}
                    </div>

                </div>

                <div class="d-flex gap-2">

                    <a href="add-customer.html?edit=${item.id}"
                       class="action-btn btn-edit d-flex align-items-center justify-content-center">

                        <i class="fas fa-edit"></i>

                    </a>

                    <button
                        onclick="softDeleteCustomer('${item.id}','${item.name}')"
                        class="action-btn btn-delete">

                        <i class="fas fa-trash"></i>

                    </button>

                </div>

            </div>

        </div>

        `;

    });

    if(filtered.length === 0){

        html = `
            <div class="text-center text-muted mt-5">
                لا يوجد عملاء
            </div>
        `;

    }

    container.innerHTML = html;

}


/* ===========================
   حذف العميل (نقل للسلة)
=========================== */

window.softDeleteCustomer = async (id, name) => {

    const confirmDelete = confirm(
        `هل تريد نقل العميل "${name}" إلى سلة المحذوفات؟`
    );

    if(!confirmDelete) return;

    try {

        await updateDoc(doc(db, "customers", id), {

            isDeleted: true,
            deletedAt: serverTimestamp()

        });

        alert("تم نقل العميل إلى السلة بنجاح");

    } catch (e) {

        console.error(e);

        alert("حدث خطأ أثناء الحذف");

    }

};


listenCustomers();

</script>

</body>
</html>
