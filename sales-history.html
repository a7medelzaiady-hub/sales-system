<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل المبيعات - الزيادي لزيوت السيارات</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --accent: #0b5e3d;
            --accent-light: #0e7a4f;
            --header-bg: linear-gradient(135deg, #0b5e3d 0%, #0a4a31 100%);
            --bg-light: #f3f6f5;
            --text-primary: #1b2e26;
            --text-secondary: #6b7a73;
            --border: #e4e9e6;
            --white: #ffffff;
            --danger: #d90429;
            --success: #2d6a4f;
            --warning: #e69500;
            --purple: #6f42c1;
            --card-radius: 14px;
            --input-radius: 12px;
            --shadow-sm: 0 1px 3px rgba(11,94,61,0.06);
            --shadow-md: 0 4px 14px rgba(11,94,61,0.08);
        }
        * { box-sizing: border-box; }
        body {
            background: var(--bg-light);
            font-family: 'Cairo', sans-serif;
            color: var(--text-primary);
            padding-bottom: 60px;
            font-size: 0.85rem;
        }

        /* ===== الهيدر العلوي ===== */
        .header-nav {
            background: var(--header-bg);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
            color: white;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .header-nav h6 { letter-spacing: 0.3px; }
        .add-btn {
            background: rgba(255,255,255,0.15);
            width: 34px; height: 34px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            color: white; text-decoration: none; font-size: 0.9rem;
            border: none; font-family: 'Cairo', sans-serif;
            transition: all 0.2s;
        }
        .add-btn:hover { background: rgba(255,255,255,0.3); color: white; transform: translateY(-1px); }
        .trash-nav-btn { background: rgba(217,4,41,0.85) !important; }
        .trash-nav-btn:hover { background: #b30322 !important; }

        /* ===== بطاقات الإحصائيات ===== */
        .stats-section-title {
            font-size: 0.8rem; font-weight: 800; color: var(--accent);
            margin: 10px 0 8px 0; display: flex; align-items: center; gap: 6px;
        }
        .stat-card {
            background: var(--white); border: 1px solid var(--border);
            border-radius: var(--card-radius); padding: 12px 6px;
            box-shadow: var(--shadow-sm); text-align: center;
            position: relative; overflow: hidden; cursor: pointer;
            transition: all 0.2s ease;
        }
        .stat-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--accent); }
        .stat-card.active-filter { border: 2px solid var(--accent) !important; background: #eefaf1; }
        .stat-bar { position: absolute; top: 0; left: 0; right: 0; height: 4px; border-radius: 4px 4px 0 0; }
        .stat-label { font-size: 0.66rem; color: var(--text-secondary); font-weight: 700; }
        .stat-value { font-size: 0.95rem; font-weight: 800; margin-top: 2px; }

        /* ===== بطاقة مطابقة النقدية ===== */
        .recon-card {
            background: var(--white); border: 1.5px solid var(--border);
            border-radius: var(--card-radius); padding: 14px;
            margin-bottom: 14px; box-shadow: var(--shadow-sm);
        }
        .recon-title { font-size: 0.78rem; font-weight: 800; color: var(--accent); margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }

        /* ===== لوحة التحكم والأزرار ===== */
        .control-panel-card {
            background: var(--white); border: 1px solid var(--border);
            border-radius: var(--card-radius); padding: 12px;
            margin-bottom: 14px; box-shadow: var(--shadow-sm);
        }
        .btn-fetch-all {
            background: #fff; color: var(--accent); border: 1.5px solid var(--accent);
            padding: 6px 12px; font-size: 0.75rem; font-weight: 700;
            border-radius: 9px; transition: all 0.2s ease;
            display: inline-flex; align-items: center; gap: 5px;
        }
        .btn-fetch-all:hover { background: var(--accent); color: #fff; }
        .btn-fetch-all:disabled { opacity: 0.6; cursor: not-allowed; }

        /* ===== كروت الفواتير والسندات ===== */
        .invoice-item {
            background: var(--white); border: 1px solid var(--border);
            border-radius: 16px; padding: 16px; margin-bottom: 14px;
            box-shadow: var(--shadow-sm); transition: box-shadow 0.2s;
        }
        .invoice-item:hover { box-shadow: var(--shadow-md); }
        .invoice-item.no-date { border-right: 4px solid var(--danger); }
        .invoice-item.voucher-item { border-right: 4px solid var(--purple); background: #fbfaff; }
        .vouchers-divider {
            display: flex; align-items: center; gap: 8px; margin: 16px 0 10px 0;
            font-size: 0.78rem; font-weight: 800; color: var(--purple);
        }
        .vouchers-divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }

        .meta-container { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
        .detail-badge {
            font-size: 0.74rem; padding: 4px 9px; border-radius: 7px; font-weight: 700;
            background: #f0f4f2; color: var(--text-secondary);
            display: inline-flex; align-items: center; gap: 5px; direction: ltr; margin: 0;
        }
        .pay-badge { font-size: 0.68rem; font-weight: 700; padding: 4px 10px; border-radius: 7px; }

        .financial-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
            background: #f8faf9; padding: 10px; border-radius: 10px;
            margin-top: 10px; border: 1px dashed var(--border);
        }
        .fin-box { font-size: 0.74rem; font-weight: 700; color: var(--text-secondary); }
        .fin-box span { display: block; font-size: 0.92rem; margin-top: 2px; font-weight: 800; }

        .search-box, input[type="date"], .recon-input {
            border: 1px solid var(--border); border-radius: var(--input-radius);
            padding: 9px 14px; font-weight: 600; font-size: 0.85rem;
            font-family: 'Cairo', sans-serif; background: var(--white);
        }
        .search-box:focus, input[type="date"]:focus, .recon-input:focus {
            border-color: var(--accent); box-shadow: 0 0 0 3px rgba(11,94,61,0.1); outline: none;
        }

        .items-preview-table { width: 100%; margin-top: 10px; font-size: 0.78rem; border-collapse: collapse; }
        .items-preview-table th { background: #ebf9eb; padding: 6px; border: 1px solid var(--border); font-weight: 700; text-align: center; }
        .items-preview-table td { padding: 6px; border: 1px solid var(--border); text-align: center; font-weight: 600; }

        .filter-status-bar {
            display: none; background: #e9eef0; padding: 8px 14px; border-radius: 10px;
            font-size: 0.78rem; font-weight: 700; align-items: center; justify-content: space-between;
            border: 1px solid var(--border);
        }

        /* ===== بوب اب إشعارات النظام المخصصة ===== */
        .custom-popup-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.55); z-index: 10000; display: flex;
            align-items: center; justify-content: center; backdrop-filter: blur(3px);
        }
        .custom-popup-box {
            background: white; width: 90%; max-width: 380px; padding: 24px;
            border-radius: 18px; text-align: center; font-family: 'Cairo';
            box-shadow: 0 14px 30px rgba(0,0,0,0.25);
        }

        .invoice-actions-group { display: flex; flex-wrap: nowrap; gap: 5px; justify-content: flex-end; align-items: center; margin-top: 8px; }
        .invoice-actions-group .btn {
            font-family: 'Cairo', sans-serif; font-size: 0.72rem; font-weight: 700;
            padding: 5px 7px; border-radius: 8px; display: inline-flex;
            align-items: center; gap: 3px; white-space: nowrap; height: 30px;
        }

        .empty-state { text-align: center; padding: 50px 10px; color: var(--text-secondary); }
        .empty-state i { color: #c9d4cf; }

        /* ===== تحضيرات وضع الطباعة ===== */
        #thermalPrintSection { display: none; }
        @media print {
            body { background: white; color: black; padding: 0; margin: 0; }
            #content-to-export, .header-nav, .control-panel-card, .stats-section-title, .row, .filter-status-bar, #customGlobalModal, .invoice-item, .recon-card { display: none !important; }
            #thermalPrintSection { display: block !important; width: 80mm; max-width: 80mm; padding: 4mm 2mm; margin: 0 auto; direction: rtl; font-family: 'Cairo', sans-serif; }
        }
    </style>
</head>
<body>

<div id="content-to-export">
    <div class="header-nav">
        <a href="index.html" class="add-btn"><i class="fas fa-arrow-right"></i></a>
        <h6 class="m-0 fw-bold" style="font-size: 0.95rem;"><i class="fas fa-history me-1"></i> سجل المبيعات</h6>
        <div class="d-flex gap-2">
            <a href="trashi.html" class="add-btn trash-nav-btn" title="فتح سلة المحذوفات"><i class="fas fa-trash-alt"></i></a>
            <button class="add-btn" id="exportExcelBtn" title="تصدير كل الأرشيف إكسيل"><i class="fas fa-file-excel"></i></button>
            <a href="sales-invoice.html" class="add-btn"><i class="fas fa-plus"></i></a>
        </div>
    </div>

    <div class="container px-2 mt-1">
        <div class="control-panel-card mt-3">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                <button id="loadAllArchiveBtn" class="btn-fetch-all">
                    <i class="fas fa-cloud-download-alt"></i> جلب كل الفواتير السابقة
                </button>
                <button id="refreshBtn" class="btn-fetch-all" style="border-color: var(--text-secondary); color: var(--text-secondary);">
                    <i class="fas fa-sync-alt"></i> تحديث
                </button>
                <button class="btn btn-danger btn-sm fw-bold px-3" id="deleteAllCustomersBtn" style="font-size: 0.75rem; border-radius: 9px; height: 33px; display: inline-flex; align-items: center; gap: 4px;">
                    <i class="fas fa-trash-can"></i> تصفير النظام للسلة
                </button>
            </div>
        </div>

        <div class="stats-section-title" id="todayStatsTitle"><i class="fas fa-calendar-day"></i> إحصائيات اليوم</div>

        <div class="row g-2 mb-3">
            <div class="col-3">
                <div class="stat-card" onclick="filterByStat('today-cash', this)">
                    <div class="stat-bar" style="background: var(--success);"></div>
                    <div class="stat-label text-truncate">نقدى اليوم</div>
                    <div class="stat-value text-success text-truncate" id="todayCash">0.0</div>
                </div>
            </div>
            <div class="col-3">
                <div class="stat-card" onclick="filterByStat('today-wallet', this)">
                    <div class="stat-bar" style="background: var(--purple);"></div>
                    <div class="stat-label text-truncate">محفظه اليوم</div>
                    <div class="stat-value text-primary text-truncate" id="todayWallet">0.0</div>
                </div>
            </div>
            <div class="col-3">
                <div class="stat-card" onclick="filterByStat('today-remaining', this)">
                    <div class="stat-bar" style="background: var(--warning);"></div>
                    <div class="stat-label text-truncate">آجل اليوم</div>
                    <div class="stat-value text-truncate" style="color: var(--warning);" id="todayRemaining">0.0</div>
                </div>
            </div>
            <div class="col-3">
                <div class="stat-card" onclick="filterByStat('today-total', this)">
                    <div class="stat-bar" style="background: #212529;"></div>
                    <div class="stat-label text-truncate">مبيعات اليوم</div>
                    <div class="stat-value text-dark text-truncate" id="todayTotalSales">0.0</div>
                </div>
            </div>
        </div>

        <div class="recon-card">
            <div class="recon-title"><i class="fas fa-scale-balanced text-success"></i> مطابقة النقدية (الكاش) </div>
            <div class="row g-2 align-items-center">
                <div class="col-6">
                    <label class="stat-label mb-1 fw-bold text-dark d-block">النقدية الموجودة معك حالياً:</label>
                    <input type="text" id="actualCashInput" class="form-control text-center recon-input fw-bold text-success" placeholder="مثال: 30000 5400 470" oninput="window.calculateCashReconciliation()">
                </div>
                <div class="col-6">
                    <label class="stat-label mb-1 fw-bold text-dark d-block">حالة المطابقة والفارق:</label>
                    <div id="reconResultBox" class="text-center fw-bold text-muted p-2" style="border-radius: var(--input-radius); font-size: 0.8rem; background: #f8faf9; border: 1px dashed var(--border); height: 39px; display: flex; align-items: center; justify-content: center; gap: 4px;">
                        بانتظار جردك الفعلي...
                    </div>
                </div>
            </div>
        </div>

        <div class="filter-status-bar mb-3" id="filterStatusBar">
            <span id="filterStatusText">عرض فلاتر مخصصة</span>
            <button class="btn btn-sm btn-dark py-0" onclick="resetStatFilter()" style="font-size:0.7rem; font-family: 'Cairo'; border-radius: 7px;">عرض الكل</button>
        </div>

        <div class="row g-2 mb-3 align-items-end">
            <div class="col-6">
                <input type="text" id="searchInput" class="form-control search-box h-100" placeholder="البحث باسم العميل أو السداد..." oninput="filterInvoices()">
            </div>
            <div class="col-6">
                <input type="date" id="dateFilterInput" class="form-control h-100" onchange="window.handleDateFilterChange()">
            </div>
        </div>

        <div id="invoicesList">
            <div class="empty-state">
                <i class="fas fa-spinner fa-spin fa-2x"></i>
                <p class="mt-3 fw-bold">برجاء الانتظار جار التحميل...</p>
            </div>
        </div>
    </div>
</div>

<div id="thermalPrintSection"></div>

<div id="customGlobalModal" class="custom-popup-overlay" style="display: none;">
    <div class="custom-popup-box" style="max-width: 420px;">
        <div id="customModalIcon" style="width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 14px;"></div>
        <h6 class="fw-bold mb-2" id="customModalTitle" style="font-size: 1rem;">تنبيه النظام</h6>
        <div id="customModalBody" style="font-size: 0.82rem; color: #4a5568; margin-bottom: 18px; text-align: right; white-space: pre-line; line-height: 1.7; max-height: 300px; overflow-y: auto; padding: 5px;"></div>
        <input type="text" id="customModalInput" class="form-control text-center mb-3 fw-bold" style="display:none; font-family:'Cairo'; font-size:0.9rem; border-radius: 10px;" placeholder="اكتب كلمة التأكيد هنا...">
        <div class="d-flex gap-2 justify-content-center" id="customModalActions"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, updateDoc, doc, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
        authDomain: "ahmedelzaiady.firebaseapp.com",
        projectId: "ahmedelzaiady",
        storageBucket: "ahmedelzaiady.firebasestorage.app",
        messagingSenderId: "300306825071",
        appId: "1:300306825071:web:0426ddde56280fa090329a",
        measurementId: "G-WE04GK5XZZ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allInvoices = [];
    let customersData = {};
    let currentFilterType = null;
    let currentRenderedInvoices = [];
    let allReceiptVouchers = [];
    
    window.globalExpectedTodayCash = 0;

    // محرك واجهة المستخدم المنبثقة
    window.showCustomUi = (options) => {
        const modal = document.getElementById('customGlobalModal');
        const title = document.getElementById('customModalTitle');
        const body = document.getElementById('customModalBody');
        const iconContainer = document.getElementById('customModalIcon');
        const inputField = document.getElementById('customModalInput');
        const actions = document.getElementById('customModalActions');

        title.innerText = options.title || "تنبيه النظام";
        body.innerHTML = options.message || "";
        inputField.value = "";
        inputField.style.display = options.type === "prompt" ? "block" : "none";

        if (options.icon === "success") {
            iconContainer.style.background = "#ebf9eb";
            iconContainer.innerHTML = `<i class="fas fa-check-circle" style="color: #2d6a4f; font-size: 1.5rem;"></i>`;
        } else if (options.icon === "danger") {
            iconContainer.style.background = "#fff5f5";
            iconContainer.innerHTML = `<i class="fas fa-exclamation-triangle" style="color: #d90429; font-size: 1.5rem;"></i>`;
        } else {
            iconContainer.style.background = "#eef2f5";
            iconContainer.innerHTML = `<i class="fas fa-info-circle" style="color: #0b5e3d; font-size: 1.5rem;"></i>`;
        }

        actions.innerHTML = "";
        if (options.type === "confirm" || options.type === "prompt") {
            const confirmBtn = document.createElement('button');
            confirmBtn.className = "btn btn-sm btn-success px-4 fw-bold";
            confirmBtn.style.fontFamily = "Cairo";
            confirmBtn.style.borderRadius = "9px";
            confirmBtn.innerText = options.confirmText || "تأكيد";
            confirmBtn.onclick = () => {
                modal.style.display = 'none';
                if (options.onConfirm) options.onConfirm(options.type === "prompt" ? inputField.value : true);
            };

            const cancelBtn = document.createElement('button');
            cancelBtn.className = "btn btn-sm btn-light text-danger px-4 fw-bold";
            cancelBtn.style.fontFamily = "Cairo";
            cancelBtn.style.borderRadius = "9px";
            cancelBtn.innerText = "إلغاء";
            cancelBtn.onclick = () => {
                modal.style.display = 'none';
                if (options.onCancel) options.onCancel();
            };
            actions.appendChild(confirmBtn);
            actions.appendChild(cancelBtn);
        } else {
            const closeBtn = document.createElement('button');
            closeBtn.className = "btn btn-sm btn-dark px-5 fw-bold";
            closeBtn.style.fontFamily = "Cairo";
            closeBtn.style.borderRadius = "9px";
            closeBtn.innerText = "موافق";
            closeBtn.onclick = () => {
                modal.style.display = 'none';
                if (options.onConfirm) options.onConfirm();
            };
            actions.appendChild(closeBtn);
        }
        modal.style.display = 'flex';
    };

    function convertToEnglishNumbers(str) {
        if (!str) return "";
        const arabicNumbers = [/٠/g, /١/g, /٢/g, /٣/g, /٤/g, /٥/g, /٦/g, /٧/g, /٨/g, /٩/g];
        let res = str.toString();
        for (let i = 0; i < 10; i++) { res = res.replace(arabicNumbers[i], i); }
        return res;
    }

    function cleanDateString(dateStr) {
        if (!dateStr) return "";
        dateStr = convertToEnglishNumbers(dateStr);
        const match = dateStr.match(/\d{1,2}[\/-]\d{1,2}[\/-]\d{4}/) || dateStr.match(/\d{4}[\/-]\d{1,2}[\/-]\d{1,2}/);
        return match ? match[0] : dateStr;
    }

    function parseInvoiceDate(inv) {
        let dateStr = "";
        if (inv.date) { dateStr = cleanDateString(inv.date); }
        else if (inv.timestamp?.seconds) {
            const d = new Date(inv.timestamp.seconds * 1000);
            return d.toISOString().split('T')[0];
        }
        if (!dateStr) return "";
        dateStr = convertToEnglishNumbers(dateStr);
        let m = dateStr.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
        if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
        m = dateStr.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
        if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
        return dateStr;
    }

    function parseVoucherDate(tr) {
        if (!tr || !tr.date) return "";
        let dateStr = convertToEnglishNumbers(tr.date);
        let m = dateStr.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
        if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
        m = dateStr.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
        if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
        return dateStr;
    }

    function formatInvoiceTime(timeStr, dateStr) {
        let raw = convertToEnglishNumbers(timeStr || dateStr || "");
        let timePattern = /(\d{1,2}):(\d{1,2})/;
        let match = raw.match(timePattern);
        if (match) {
            let hour = match[1]; let min = match[2]; let period = "م";
            if (raw.includes("ص") || raw.toLowerCase().includes("am")) { period = "ص"; }
            return `${hour}:${min} ${period}`;
        }
        return "00:00 م";
    }

    window.renderInvoices = (invoices, vouchers = []) => {
        currentRenderedInvoices = invoices;
        const container = document.getElementById('invoicesList');
        if (invoices.length === 0 && vouchers.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-folder-open fa-2x mb-2"></i>
                    <p class="fw-bold mb-0">لا توجد فواتير مطابقة للبحث أو الفلتر المختار.</p>
                </div>`;
            return;
        }

        const invoicesHtml = invoices.map(inv => {
            let methodBadgeColor = "bg-secondary";
            if (inv.paymentMethod === "سداد نقدى" || inv.paymentMethod === "كاش" || inv.paymentMethod === "نقدى") methodBadgeColor = "bg-success";
            else if (inv.paymentMethod === "سداد مرئية" || inv.paymentMethod === "سداد محفظه" || inv.paymentMethod === "محفظه") methodBadgeColor = "bg-primary";

    function calculateStats() {
        let todayCash = 0; let todayWallet = 0; let todayRemaining = 0; let todaySales = 0;
        const filterInput = document.getElementById('dateFilterInput')?.value;
        const targetDateStr = filterInput ? filterInput : new Date().toLocaleDateString('en-CA');
        const statsTitle = document.getElementById('todayStatsTitle');
        if (statsTitle) { statsTitle.innerHTML = `<i class="fas fa-calendar-day"></i> إحصائيات يوم (${targetDateStr})`; }
        allInvoices.forEach(inv => {
            const invDateStr = parseInvoiceDate(inv);
            const isTargetDate = (invDateStr === targetDateStr);
            if (isTargetDate) {
                todayCash += inv.calculatedCash;
                todayWallet += inv.calculatedWallet;
                todaySales += (Number(inv.total) || 0);
                let rawRemaining = Number(inv.remaining) || 0;
                if (rawRemaining > 0) { todayRemaining += rawRemaining; }
            }
        });

        allReceiptVouchers.forEach(v => {
            const vDateStr = parseVoucherDate(v);
            if (vDateStr === targetDateStr) {
                todayCash += v.cashAmount;
                todayWallet += v.walletAmount;
            }
        });

        document.getElementById('todayCash').innerText = todayCash.toFixed(1);
        document.getElementById('todayWallet').innerText = todayWallet.toFixed(1);
        document.getElementById('todayRemaining').innerText = todayRemaining.toFixed(1);
        document.getElementById('todayTotalSales').innerText = todaySales.toFixed(1);

        window.globalExpectedTodayCash = todayCash;
        window.calculateCashReconciliation();
    }

    // ===== المنطق المحدث والمصحح كلياً: التجميع الديناميكي التلقائي بالمسافات والمسطرة فقط =====
    window.calculateCashReconciliation = () => {
        const inputField = document.getElementById('actualCashInput');
        const resultBox = document.getElementById('reconResultBox');
        if (!inputField || !resultBox) return;

        const inputVal = inputField.value.trim();
        if (inputVal === "") {
            resultBox.className = "text-center fw-bold text-muted p-2";
            resultBox.style.background = "#f8faf9";
            resultBox.style.border = "1px dashed var(--border)";
            resultBox.innerHTML = "بانتظار جردك الفعلي...";
            return;
        }

        // تحويل الأرقام العربية أولاً لتجنب الـ NaN
        let sanitizedVal = convertToEnglishNumbers(inputVal);
        
        // استبدال أي علامة زائد (+) قد يكتبها المستخدم بالخطأ بمسافة لضمان استقرار المعالجة الفراغية
        sanitizedVal = sanitizedVal.replace(/\+/g, ' ');

        // التقطيع الديناميكي الفوري بالاعتماد الكلي على الفراغات أو المسافات الناتجة عن زر المسطرة
        const amountParts = sanitizedVal.split(/\s+/); 
        let actual = 0;
        
        amountParts.forEach(part => {
            const parsedNum = parseFloat(part.trim());
            if (!isNaN(parsedNum)) {
                actual += parsedNum;
            }
        });

        const expected = window.globalExpectedTodayCash || 0;
        const diff = actual - expected;

        let totalEnteredStr = amountParts.length > 1 ? `[جردك: ${actual.toFixed(1)}] ` : '';

        if (Math.abs(diff) < 0.1) {
            resultBox.className = "text-center fw-bold text-success p-2";
            resultBox.style.background = "#eefaf1";
            resultBox.style.border = "1px solid var(--success)";
            resultBox.innerHTML = `<i class="fas fa-check-circle"></i> ${totalEnteredStr} مطابق تماماً (0.00)`;
        } 
        else if (diff > 0) {
            resultBox.className = "text-center fw-bold text-primary p-2";
            resultBox.style.background = "#eef4fa";
            resultBox.style.border = "1px solid #0077b6";
            resultBox.innerHTML = `<i class="fas fa-circle-plus"></i> ${totalEnteredStr} زيادة (+${diff.toFixed(1)})`;
        } 
        else {
            resultBox.className = "text-center fw-bold text-danger p-2";
            resultBox.style.background = "#fff5f5";
            resultBox.style.border = "1px solid var(--danger)";
            resultBox.innerHTML = `<i class="fas fa-circle-minus"></i> ${totalEnteredStr} عجز (${diff.toFixed(1)})`;
        }
    };

    function applyCurrentView() {
        calculateStats();
        if (currentFilterType) {
            const filterInput = document.getElementById('dateFilterInput')?.value;
            const targetDate = filterInput ? filterInput : new Date().toLocaleDateString('en-CA');
            executeFilterLogic(currentFilterType, targetDate);

        }

    async function loadData(showSpinner = true) {
        const container = document.getElementById('invoicesList');
        if (showSpinner) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-spinner fa-spin fa-2x"></i>
                    <p class="mt-3 fw-bold">برجاء الانتظار جار التحميل...</p>
                </div>`;
        }
        try {
            const [custSnap, transSnap, invSnap] = await Promise.all([
                getDocs(collection(db, "customers")),
                getDocs(collection(db, "transactions")),
                getDocs(collection(db, "invoices"))
            ]);

            customersData = {};
            custSnap.forEach(d => {
                customersData[d.id] = { id: d.id, name: d.data().name, initialBalance: Number(d.data().initialBalance) || 0 };
            });

            let transByCustomer = {};
            allReceiptVouchers = [];
            transSnap.forEach(d => {
                const tr = d.data();
                if (tr.isDeleted === true) return;
                if (!transByCustomer[tr.partyId]) transByCustomer[tr.partyId] = 0;
                if (tr.type === 'قبض') transByCustomer[tr.partyId] -= (Number(tr.amount) || 0);
                else if (tr.type === 'صرف') transByCustomer[tr.partyId] += (Number(tr.amount) || 0);

                const isCustomerVoucher = tr.partyType === 'عميل' || (!tr.partyType && customersData[tr.partyId]);
                if (tr.type === 'قبض' && isCustomerVoucher) {
                    let cashAmount = 0;
                    let walletAmount = 0;
                    if (tr.cashPaid !== undefined || tr.walletPaid !== undefined) {
                        cashAmount = Number(tr.cashPaid) || 0;
                        walletAmount = Number(tr.walletPaid) || 0;
                    } else if (tr.method !== undefined) {
                        const amt = Number(tr.amount) || 0;
                        if (tr.method === 'محفظة' || tr.method === 'محفظه') walletAmount = amt;
                        else cashAmount = amt;
                    } else {
                        cashAmount = Number(tr.amount) || 0;
                    }
                    const customerName = (customersData[tr.partyId] && customersData[tr.partyId].name) || 'عميل غير معروف';
                    allReceiptVouchers.push({
                        id: d.id,
                        date: tr.date,
                        cashAmount,
                        walletAmount,
                        customerName,
                        note: tr.note || tr.notes || ''
                    });
                }
            });

            let runningBalances = {};
            let tempInvoices = [];

            invSnap.forEach(d => {
                const data = d.data();
                if (data.isDeleted === true) return;

                const cid = data.customerId;
                if (!runningBalances[cid]) {
                    runningBalances[cid] = (customersData[cid]?.initialBalance || 0) + (transByCustomer[cid] || 0);
                }
                const previousBalance = runningBalances[cid];
                runningBalances[cid] += (Number(data.remaining) || 0);

                let cPaid = 0; let wPaid = 0;
                if (data.cashAmount !== undefined || data.walletAmount !== undefined) {
                    cPaid = Number(data.cashAmount) || 0;
                    wPaid = Number(data.walletAmount) || 0;
                } else {
                    let p = Number(data.paid) || 0;
                    if (data.paymentMethod === "سداد مرئية" || data.paymentMethod === "محفظه" || data.paymentMethod === "سداد محفظه") wPaid = p;
                    else cPaid = p;
                }

                tempInvoices.push({
                    id: d.id,
                    ...data,
                    calculatedCash: cPaid,
                    calculatedWallet: wPaid,
                    previousBalance: previousBalance
                });
            });

            allInvoices = tempInvoices.sort((a, b) => {
                const timeA = a.timestamp?.seconds || 0;
                const timeB = b.timestamp?.seconds || 0;
                return timeA - timeB;
            }).reverse();

            applyCurrentView();

        } catch (e) {
            console.error(e);
            container.innerHTML = `<div class="alert alert-danger text-center p-3" style="border-radius: 12px;">حدث خطأ في تحميل البيانات من السيرفر.</div>`;
        }
    }

        printSection.innerHTML = generateThermalInvoiceHtml(inv);

    window.shareThermalInvoice = async (id) => {
        const inv = allInvoices.find(i => i.id === id);
        if (!inv) return;

        const shareContainer = document.createElement('div');
        shareContainer.style.position = 'fixed';
        shareContainer.style.right = '-9999px';
        shareContainer.style.top = '0';
        shareContainer.style.width = '340px';
        shareContainer.style.background = '#ffffff';
        shareContainer.style.boxSizing = 'border-box';
        shareContainer.innerHTML = generateThermalInvoiceHtml(inv);
        document.body.appendChild(shareContainer);

        try {
            await new Promise(resolve => setTimeout(resolve, 350));
            const canvas = await html2canvas(shareContainer, {
                scale: 2.5,
                backgroundColor: '#ffffff',
                useCORS: true
            });
            document.body.removeChild(shareContainer);

            canvas.toBlob(async (blob) => {
                if (!blob) return;
                const file = new File([blob], `فاتورة_${inv.customerName || 'نقدى'}.png`, { type: 'image/png' });

                if (navigator.canShare && navigator.canShare({ files: [file] })) {

                        title: `فاتورة ${inv.customerName || 'نقدى'}`,
                        text: `فاتورة الزيادي لزيوت السيارات`
                    });
                } else {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `فاتورة_${inv.customerName || 'نقدى'}.png`;
                    a.click();
                    URL.revokeObjectURL(url);
                }
            }, 'image/png');

            alert("حدث خطأ أثناء معالجة صورة الفاتورة الحرارية.");

    window.showModificationDetails = (invId) => {
        const inv = allInvoices.find(i => i.id === invId);
        if (!inv) return;
        let report = `📝 <b>تقرير التعديلات الدقيق للفاتورة:</b>\n\n`;
        let index = 1;
        if (inv.originalDate && inv.date && inv.originalDate !== inv.date) {
            report += `${index}- 📅 تعديل التاريخ: من (${inv.originalDate}) إلى (${inv.date})\n`;
            index++;
        }
        const currentItems = inv.items || [];
        const originalItems = inv.originalItems || [];
        currentItems.forEach(item => {
            const origItem = originalItems.find(oi => oi.name === item.name);
            if (origItem) {
                if (Number(origItem.qty) !== Number(item.qty)) {
                    report += `${index}- 🔢 تعديل كمية [${item.name}]: كانت (${origItem.qty}) أصبحت (${item.qty})\n`;
                    index++;
                }
                if (Number(origItem.price) !== Number(item.price)) {
                    report += `${index}- 💰 تعديل سعر [${item.name}]: كان (${Number(origItem.price).toFixed(2)}) أصبح (${Number(item.price).toFixed(2)})\n`;
                    index++;
                }
            } else {
                report += `${index}- ➕ صنف مُضاف جديد: [${item.name}] بكمية (${item.qty}) وسعر (${Number(item.price).toFixed(2)})\n`;
                index++;
            }
        });
        originalItems.forEach(origItem => {
            const stillExists = currentItems.some(ci => ci.name === origItem.name);
            if (!stillExists) {
                report += `${index}- ❌ صنف تم حذفه تماماً: [${origItem.name}] (كان بكمية: ${origItem.qty} وسعر: ${Number(origItem.price).toFixed(2)})\n`;

    window.filterByStat = (type, cardElement) => {
        document.querySelectorAll('.stat-card').forEach(c => c.classList.remove('active-filter'));
        cardElement.classList.add('active-filter');
        currentFilterType = type;
        const filterInput = document.getElementById('dateFilterInput')?.value;
        const todayStr = filterInput ? filterInput : new Date().toLocaleDateString('en-CA');
        executeFilterLogic(type, todayStr);
    };

    function executeFilterLogic(type, dateStr) {
        let filtered = []; let statusLabel = "";
        filtered = allInvoices.filter(inv => {
            const invDateStr = parseInvoiceDate(inv);
            const isToday = (invDateStr === dateStr);
            switch (type) {
                case 'today-cash': statusLabel = `نقدى يوم (${dateStr})`; return isToday && inv.calculatedCash > 0;
                case 'today-wallet': statusLabel = `محفظه يوم (${dateStr})`; return isToday && inv.calculatedWallet > 0;
                case 'today-remaining': statusLabel = `آجل يوم (${dateStr})`; return isToday && Number(inv.remaining) > 0;
                case 'today-total': statusLabel = `مبيعات يوم (${dateStr})`; return isToday;
                default: return true;
            }
        });

        let matchingVouchers = [];
        if (type === 'today-cash' || type === 'today-wallet') {
            matchingVouchers = allReceiptVouchers.filter(v => {
                const vDateStr = parseVoucherDate(v);
                const isToday = (vDateStr === dateStr);
                if (!isToday) return false;
                return type === 'today-cash' ? v.cashAmount > 0 : v.walletAmount > 0;
            });
        }

        const vouchersCountLabel = matchingVouchers.length > 0 ? ` + ${matchingVouchers.length} سند قبض` : '';
        document.getElementById('filterStatusText').innerText = `${statusLabel} (${filtered.length} فاتورة${vouchersCountLabel})`;
        document.getElementById('filterStatusBar').style.display = "flex";
        window.renderInvoices(filtered, matchingVouchers);
    }
