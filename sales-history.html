<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل المبيعات - الزيادي لزيوت السيارات</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            /* تطبيق ألوان علم ألمانيا الرسمية (الأسود - الأحمر - الذهبي) */
            --accent: #000000;              /* الأسود الألماني */
            --accent-light: #252525;        /* أسود مخفف ناعم */
            --accent-deep: #000000;
            --header-bg: linear-gradient(135deg, #000000, #252525 80%);
            --bg-light: #f5f6f6;            /* خلفية النظام العامة مريحة للعين */
            --text-primary: #000000;        /* النصوص الأساسية */
            --text-secondary: #4a4a4a;      /* النصوص التوضيحية */
            --border: #dcdcdc;              /* حدود الحقول */
            --white: #ffffff;
            
            /* ألوان العلم الرسمية والمستهدفة لعناصر الإجراءات */
            --germany-black: #000000;
            --germany-red: #FF0000;         /* الأحمر الألماني الصريح */
            --germany-gold: #FFCC00;        /* الذهبي / الأصفر الألماني الصريح */
            
            --danger: #FF0000;
            --danger-bg: #fff1f1;
            --success: #000000;
            --success-bg: #f5f6f6;
            --warning: #000000;
            --warning-bg: #fffdf2;
            --purple: #5b21b6;
            --purple-bg: #f5f3ff;
            --gold: #FFCC00;
            --card-radius: 20px;
            --input-radius: 14px;
            --shadow-sm: 0 1px 4px rgba(0,0,0,0.08);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.12);
        }
        
        * { box-sizing: border-box; }
        
        body {
            background: var(--bg-light);
            font-family: 'Cairo', sans-serif;
            color: var(--text-primary);
            padding-bottom: 80px;
            font-size: 0.88rem;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }
        
        .num { 
            font-family: 'JetBrains Mono', monospace; 
            font-weight: 700; 
            letter-spacing: -0.5px; 
        }

        .header-nav {
            background: var(--header-bg);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-md);
            color: white;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            border-bottom: 4px solid var(--germany-red);
        }
        .header-nav h6 { 
            font-weight: 900; 
            font-size: 1.05rem;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-actions { display: flex; gap: 8px; }
        .add-btn {
            background: rgba(255, 255, 255, 0.15);
            width: 38px; 
            height: 38px;
            border-radius: 12px;
            display: flex; 
            align-items: center; 
            justify-content: center;
            color: white; 
            text-decoration: none; 
            font-size: 0.95rem;
            border: 1px solid rgba(255, 255, 255, 0.2); 
            transition: all 0.2s ease;
        }
        .add-btn:active { transform: scale(0.92); }
        .add-btn:hover { background: rgba(255, 255, 255, 0.25); color: white; }
        .trash-nav-btn { background: var(--germany-red) !important; border-color: rgba(255, 255, 255, 0.2) !important; }
        .trash-nav-btn:hover { opacity: 0.9 !important; }
        .add-nav-btn { background: var(--germany-gold) !important; border-color: rgba(255, 255, 255, 0.2) !important; color: #000000 !important; }
        .add-nav-btn:hover { background: #e0b300 !important; }

        .control-panel-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--card-radius); 
            padding: 14px;
            margin-bottom: 16px; 
            box-shadow: var(--shadow-sm);
            display: flex; 
            flex-direction: column; 
            gap: 10px;
        }
        .panel-btn-group {
            display: flex; 
            gap: 10px; 
            width: 100%;
        }
        .panel-btn {
            flex: 1;
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px;
            padding: 12px; 
            font-size: 0.82rem; 
            font-weight: 800;
            border-radius: 12px;
            font-family: 'Cairo', sans-serif; 
            white-space: nowrap;
            border: 1.5px solid transparent; 
            transition: all 0.2s ease; 
            cursor: pointer;
        }
        .panel-btn:active { transform: scale(0.97); }
        .btn-fetch-all { background: #fffdf2; color: #000000; border-color: var(--germany-gold); }
        .btn-refresh-panel { background: #f1f5f9; color: #475569; border-color: var(--border); }
        .btn-reset-danger { background: var(--danger-bg); color: var(--danger); border-color: rgba(255, 0, 0, 0.2); width: 100%; }

        .stats-section-title {
            font-size: 0.82rem;
            font-weight: 900; 
            color: var(--accent-deep);
            margin: 8px 4px 12px; 
            display: flex; 
            align-items: center; 
            gap: 6px;
        }
        .stat-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 12px; 
            padding: 10px 4px; 
            box-shadow: var(--shadow-sm); 
            text-align: center;
            position: relative; 
            overflow: hidden; 
            cursor: pointer;
            transition: all 0.2s ease;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .stat-card:active { transform: scale(0.95); }
        .stat-card.active-filter { border: 2px solid var(--germany-black) !important; background: #fffdf2; }
        .stat-bar { position: absolute; top: 0; left: 0; right: 0; height: 4px; }
        .stat-label { 
            font-size: 0.68rem; 
            color: var(--text-secondary); 
            font-weight: 800; 
            white-space: nowrap;
        }
        .stat-value { 
            font-size: 0.92rem; 
            margin-top: 4px; 
            font-weight: 800; 
            white-space: nowrap;
        }

        .recon-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--card-radius); 
            padding: 16px;
            margin-bottom: 16px; 
            box-shadow: var(--shadow-sm);
        }
        .recon-title { 
            font-size: 0.85rem; 
            font-weight: 900; 
            color: var(--accent); 
            margin-bottom: 12px; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
        }

        .invoice-item {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 20px; 
            padding: 18px; 
            margin-bottom: 14px;
            box-shadow: var(--shadow-sm); 
            transition: all 0.2s ease;
            border-right: 5px solid var(--border);
        }
        .invoice-item:hover { box-shadow: var(--shadow-md); }
        .invoice-item.no-date { border-right-color: var(--germany-red); }
        .invoice-item.voucher-item { border-right-color: var(--purple); background: #fcfbfe; }
        
        .vouchers-divider {
            display: flex;
            align-items: center; 
            gap: 10px; 
            margin: 22px 4px 14px;
            font-size: 0.82rem; 
            font-weight: 900; 
            color: var(--purple);
        }
        .vouchers-divider::after { content: ""; flex: 1; height: 1.5px; background: var(--border); }

        .meta-container { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
        .detail-badge {
            font-size: 0.74rem;
            padding: 5px 10px; 
            border-radius: 8px; 
            font-weight: 700;
            background: #f1f5f9; 
            color: #475569;
            display: inline-flex; 
            align-items: center; 
            gap: 5px; 
            direction: ltr;
        }
        .pay-badge { font-size: 0.7rem; font-weight: 800; padding: 5px 11px; border-radius: 8px; color: white !important; }

        .modification-log-box {
            background: #fffdf5;
            border: 1px solid var(--germany-gold);
            color: #495057;
            border-radius: 12px;
            padding: 10px 14px;
            margin-top: 12px;
            font-size: 0.78rem;
            font-weight: 700;
            line-height: 1.5;
            display: none; 
            animation: scaleUp 0.15s ease-out;
        }

        .financial-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); 
            gap: 10px;
            background: #f8fafc; 
            padding: 12px; 
            border-radius: 14px;
            margin-top: 14px; 
            border: 1px dashed var(--border);
        }
        .fin-box { font-size: 0.76rem; font-weight: 800; color: var(--text-secondary); }
        .fin-box span { display: block; font-size: 1rem; margin-top: 4px; font-weight: 800; color: var(--text-primary); }

        .search-box, input[type="date"], .recon-input {
            border: 1px solid var(--border);
            border-radius: var(--input-radius);
            padding: 12px 14px; 
            font-weight: 700; 
            font-size: 0.85rem;
            font-family: 'Cairo', sans-serif; 
            background: var(--white);
            transition: all 0.2s ease;
            width: 100%;
        }
        .search-box:focus, input[type="date"]:focus, .recon-input:focus {
            border-color: var(--germany-black);
            box-shadow: 0 0 0 3px rgba(0,0,0,0.12); 
            outline: none;
        }

        .filter-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }
        .filter-row .search-date-group {
            display: flex;
            gap: 10px;
        }
        .filter-row .search-date-group > div {
            flex: 1;
        }
        .filter-row .action-buttons-group {
            display: flex;
            gap: 10px;
        }
        .filter-row .action-buttons-group .btn {
            flex: 1;
            font-family: 'Cairo';
            font-weight: 800;
            font-size: 0.8rem;
            border-radius: 12px;
            padding: 12px;
            white-space: nowrap;
        }

        .items-preview-table { width: 100%; margin-top: 14px; font-size: 0.8rem; border-collapse: collapse; border-radius: 12px; overflow: hidden; }
        .items-preview-table th { background: #f1f5f9; padding: 10px; border: 1px solid var(--border); font-weight: 800; text-align: center; color: #475569; }
        .items-preview-table td { padding: 10px; border: 1px solid var(--border); text-align: center; font-weight: 700; }

        .filter-status-bar {
            display: flex;
            background: #e2e8f0; 
            padding: 10px 16px; 
            border-radius: 14px;
            font-size: 0.82rem; 
            font-weight: 800; 
            align-items: center; 
            justify-content: space-between;
            border: 1px solid var(--border);
            margin-bottom: 14px;
        }

        .custom-popup-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6); 
            z-index: 10000; 
            display: flex;
            align-items: center;  
            justify-content: center; 
            backdrop-filter: blur(4px);
        }
        .custom-popup-box {
            background: white;
            width: 90%; 
            max-width: 400px; 
            padding: 26px;
            border-radius: 24px; 
            text-align: center; 
            font-family: 'Cairo';
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }

        .invoice-actions-group { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 6px; 
            justify-content: flex-end; 
            align-items: center; 
            margin-top: 14px; 
        }
        .invoice-actions-group .btn {
            font-family: 'Cairo', sans-serif;
            font-size: 0.74rem; 
            font-weight: 800;
            padding: 6px 10px; 
            border-radius: 10px; 
            display: inline-flex;
            align-items: center; 
            gap: 4px; 
            white-space: nowrap; 
            height: 34px;
            transition: all 0.2s ease;
        }
        .invoice-actions-group .btn:active { transform: scale(0.94); }

        .empty-state { text-align: center; padding: 60px 10px; color: var(--text-secondary); }
        .empty-state i { color: #cbd5e1; }

        .cargo-gallery-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.9); 
            z-index: 20000; 
            display: flex;
            align-items: center; 
            justify-content: center; 
            backdrop-filter: blur(5px);
        }
        .cargo-gallery-box {
            background: #fff; 
            width: 92%; 
            max-width: 440px; 
            border-radius: 24px;
            overflow: hidden; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            animation: scaleUp 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); 
            display: flex; 
            flex-direction: column;
        }
        .cargo-gallery-header {
            background: var(--germany-black); 
            color: white; 
            padding: 14px 18px;
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            border-bottom: 3px solid var(--germany-red);
        }
        .cargo-gallery-body {
            padding: 16px; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            background: #0f172a; 
            justify-content: center; 
            min-height: 280px; 
            position: relative;
        }
        .cargo-gallery-img {
            max-width: 100%; 
            max-height: 360px; 
            border-radius: 12px;
            object-fit: contain; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .cargo-gallery-footer {
            background: #f8fafc; 
            padding: 14px 18px; 
            display: flex;
            align-items: center; 
            justify-content: space-between; 
            gap: 10px;
        }
        .gallery-nav-btn {
            background: var(--germany-black); 
            color: white; 
            border: none;
            border-radius: 10px; 
            padding: 8px 16px; 
            font-weight: 800; 
            cursor: pointer;
            font-size: 0.8rem;
        }
        .gallery-nav-btn:disabled { background: #cbd5e1; cursor: not-allowed; }

        #thermalPrintSection { display: none; }
        @media print {
            body { background: white; color: black; padding: 0; margin: 0; }
            #content-to-export, .header-nav, .control-panel-card, .stats-section-title, .row, .filter-status-bar, #customGlobalModal, .invoice-item, .recon-card, .cargo-gallery-overlay { display: none !important; }
            #thermalPrintSection { display: block !important; width: 80mm; max-width: 80mm; padding: 4mm 2mm; margin: 0 auto; direction: rtl; font-family: 'Cairo', sans-serif; }
        }

        @keyframes scaleUp { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

<div id="content-to-export">
    <div class="header-nav">
        <a href="index.html" class="add-btn" title="الصفحة الرئيسية"><i class="fas fa-home"></i></a>
        <h6 class="m-0"><i class="fas fa-history me-1"></i> سجل المبيعات</h6>
        <div class="header-actions">
            <a href="trashi.html" class="add-btn trash-nav-btn" title="فتح سلة المحذوفات"><i class="fas fa-trash-alt"></i></a>
            <button class="add-btn" id="exportExcelBtn" title="تصدير كل الأرشيف إكسيل"><i class="fas fa-file-excel"></i></button>
            <a href="sales-invoice.html" class="add-btn add-nav-btn" title="فاتورة جديدة"><i class="fas fa-plus"></i></a>
        </div>
    </div>

    <div class="container px-2 mt-3">
        <div class="control-panel-card">
            <div class="panel-btn-group">
                <button id="loadAllArchiveBtn" class="panel-btn btn-fetch-all">
                    <i class="fas fa-cloud-download-alt"></i> جلب كل الفواتير السابقة
                </button>
                <button id="refreshBtn" class="panel-btn btn-refresh-panel">
                    <i class="fas fa-sync-alt"></i> تحديث
                </button>
            </div>
            <button class="panel-btn btn-reset-danger" id="deleteAllCustomersBtn">
                <i class="fas fa-trash-can"></i> تصفير النظام للسلة
            </button>
        </div>

        <div class="stats-section-title" id="todayStatsTitle"><i class="fas fa-calendar-day"></i> إحصائيات اليوم</div>

        <div class="row g-1 mb-3">
            <div class="col-3">
                <div class="stat-card" onclick="filterByStat('today-cash', this)">
                    <div class="stat-bar" style="background: var(--germany-black);"></div>
                    <div class="stat-label text-truncate">نقدى اليوم</div>
                    <div class="stat-value num text-truncate" style="color: var(--germany-black);" id="todayCash">0.0</div>
                </div>
            </div>
            <div class="col-3">
                <div class="stat-card" onclick="filterByStat('today-wallet', this)">
                    <div class="stat-bar" style="background: var(--purple);"></div>
                    <div class="stat-label text-truncate">محفظه اليوم</div>
                    <div class="stat-value num text-truncate" style="color: var(--purple);" id="todayWallet">0.0</div>
                </div>
            </div>
            <div class="col-3">
                <div class="stat-card" onclick="filterByStat('today-remaining', this)">
                    <div class="stat-bar" style="background: var(--germany-red);"></div>
                    <div class="stat-label text-truncate">آجل اليوم</div>
                    <div class="stat-value num text-truncate" style="color: var(--germany-red);" id="todayRemaining">0.0</div>
                </div>
            </div>
            <div class="col-3">
                <div class="stat-card" onclick="filterByStat('today-total', this)">
                    <div class="stat-bar" style="background: var(--germany-gold);"></div>
                    <div class="stat-label text-truncate">م. اليوم</div>
                    <div class="stat-value num text-truncate" style="color: var(--germany-black);" id="todayTotalSales">0.0</div>
                </div>
            </div>
        </div>

        <div class="recon-card">
            <div class="recon-title"><i class="fas fa-scale-balanced" style="color:var(--germany-red);"></i> مطابقة النقدية (الكاش)</div>
            <div class="row g-2 align-items-center">
                <div class="col-6">
                    <label class="stat-label mb-1 fw-bold text-dark d-block">النقدية الموجودة معك حالياً:</label>
                    <input type="text" id="actualCashInput" class="form-control text-center recon-input fw-bold num" placeholder="مثال: 30000 5400 470" oninput="window.calculateCashReconciliation()">
                </div>
                <div class="col-6">
                    <label class="stat-label mb-1 fw-bold text-dark d-block">حالة المطابقة والفارق:</label>
                    <div id="reconResultBox" class="text-center fw-bold text-muted p-2" style="border-radius: var(--input-radius); font-size: 0.8rem; background: #f8fafc; border: 1px dashed var(--border); height: 44px; display: flex; align-items: center; justify-content: center; gap: 4px;">
                        بانتظار جردك الفعلي...
                    </div>
                </div>
            </div>
        </div>

        <div class="filter-status-bar" id="filterStatusBar" style="display: none;">
            <span id="filterStatusText">عرض فلاتر مخصصة</span>
            <button class="btn btn-sm btn-dark py-0" onclick="resetStatFilter()" style="font-size:0.75rem; font-family: 'Cairo'; border-radius: 8px;">عرض الكل</button>
        </div>

        <div class="filter-row">
            <div class="search-date-group">
                <div>
                    <input type="text" id="searchInput" class="form-control search-box" placeholder="بحث باسم العميل..." oninput="filterInvoices()">
                </div>
                <div>
                    <input type="date" id="dateFilterInput" class="form-control" onchange="window.handleDateFilterChange()">
                </div>
            </div>
            <div class="action-buttons-group">
                <button class="btn btn-outline-dark" onclick="downloadInvoicesImagesByDate()" title="تحميل الفواتير وصور البضاعة وملحوظاتها">
                    <i class="fas fa-images"></i> صور الفواتير ZIP
                </button>
                <button class="btn btn-dark text-white" onclick="printDailyComprehensiveReport()" title="تقرير مالي للمبيعات والمخزن اليومي">
                    <i class="fas fa-file-invoice"></i> تقرير اليوم
                </button>
            </div>
        </div>

        <div id="invoicesList">
            <div class="empty-state">
                <i class="fas fa-spinner fa-spin fa-2x"></i>
                <p class="mt-3 fw-bold">برجاء الانتظار جاري التحميل...</p>
            </div>
        </div>
    </div>
</div>

<div id="thermalPrintSection"></div>

<div id="cargoGalleryModal" class="cargo-gallery-overlay" style="display: none;">
    <div class="cargo-gallery-box">
        <div class="cargo-gallery-header">
            <span class="fw-bold" style="font-size: 0.9rem;"><i class="fas fa-camera me-1"></i> معاينة صور البضاعة الملتقطة</span>
            <button type="button" class="btn-close btn-close-white" onclick="closeCargoGallery()"></button>
        </div>
        <div class="cargo-gallery-body">
            <img id="modalGalleryImg" class="cargo-gallery-img" src="" alt="بضاعة الفاتورة">
        </div>
        <div class="cargo-gallery-footer">
            <div>
                <button id="btnPrevGallery" class="gallery-nav-btn" onclick="navigateGallery(-1)"><i class="fas fa-arrow-right"></i> السابق</button>
                <button id="btnNextGallery" class="gallery-nav-btn" onclick="navigateGallery(1)">التالي <i class="fas fa-arrow-left"></i></button>
            </div>
            <div class="d-flex align-items-center gap-2">
                <span id="galleryCounter" class="fw-bold small text-muted">0 / 0</span>

    function convertToEnglishNumbers(str) {
        if (!str) return "";
        const arabicNumbers = [/٠/g, /١/g, /٢/g, /٣/g, /٤/g, /٥/g, /٦/g, /٧/g, /٨/g, /٩/g];
        let res = str.toString();
        for (let i = 0; i < 10; i++) { res = res.replace(arabicNumbers[i], i); }
        return res;
    }

    function cleanDateString(dateStr) {
        if (!dateStr) return "";
        dateStr = convertToEnglishNumbers(dateStr);
        const match = dateStr.match(/\d{1,2}[\/-]\d{1,2}[\/-]\d{4}/) || dateStr.match(/\d{4}[\/-]\d{1,2}[\/-]\d{1,2}/);
        return match ? match[0] : dateStr;
    }

    function parseInvoiceDate(inv) {
        let dateStr = "";
        if (inv.date) { dateStr = cleanDateString(inv.date); }
        else if (inv.timestamp?.seconds) {
            const d = new Date(inv.timestamp.seconds * 1000);
            return d.toISOString().split('T')[0];
        }
        if (!dateStr) return "";
        dateStr = convertToEnglishNumbers(dateStr);
        let m = dateStr.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
        if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
        m = dateStr.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
        if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
        return dateStr;
    }

    function parseVoucherDate(tr) {
        if (!tr || !tr.date) return "";
        let dateStr = convertToEnglishNumbers(tr.date);
        let m = dateStr.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
        if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
        m = dateStr.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
        if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
        return dateStr;
    }

    function formatInvoiceTime(timeStr, dateStr) {
        let raw = convertToEnglishNumbers(timeStr || dateStr || "");
        let timePattern = /(\d{1,2}):(\d{1,2})/;
        let match = raw.match(timePattern);
        if (match) {
            let hour = match[1];
            let min = match[2]; let period = "م";
            if (raw.includes("ص") || raw.toLowerCase().includes("am")) { period = "ص"; }
            return `${hour}:${min} ${period}`;
        }
        return "00:00 م";
    }

    window.toggleModificationsBox = (invoiceId) => {

            box.style.display = (box.style.display === "none" || box.style.display === "") ? "block" : "none";

    window.renderInvoices = (invoices, vouchers = []) => {

            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-folder-open fa-2x mb-2"></i>
                    <p class="fw-bold mb-0">لا توجد فواتير مطابقة للبحث أو الفلتر المختار.</p>
                </div>`;
            return;
        }

        const invoicesHtml = invoices.map(inv => {
            let methodBadgeColor = "bg-secondary";
            if (inv.paymentMethod === "سداد نقدى" || inv.paymentMethod === "كاش" || inv.paymentMethod === "نقدى") methodBadgeColor = "bg-dark";
            else if (inv.paymentMethod === "سداد مرئية" || inv.paymentMethod === "سداد محفظه" || inv.paymentMethod === "محفظه") methodBadgeColor = "bg-primary";
            else if (inv.paymentMethod === "آجل") methodBadgeColor = "bg-danger";

            const totalPaid = inv.calculatedCash + inv.calculatedWallet;
            const displayTime = formatInvoiceTime(inv.time, inv.date);
            const originalDate = parseInvoiceDate(inv);
            const discountAmount = Number(inv.discount) || 0;
            let shortDate = originalDate;
            if (originalDate.includes('-')) {
                const parts = originalDate.split('-');
                shortDate = `${parts[2]}/${parts[1]}`;
            } else if (!originalDate) {
                shortDate = "بلا تاريخ";
            }

            const modificationNotes = inv.notes || "";
            const isModified = modificationNotes.trim() !== "" && modificationNotes !== "معدلة";
            
            const hasImages = (inv.cargoImages && inv.cargoImages.length > 0) || (inv.cargoImage && inv.cargoImage.trim() !== "");
            const viewImagesBtn = hasImages ? `
                <button class="btn btn-outline-dark" onclick="openCargoGallery('${inv.id}')" title="مشاهدة صور البضاعة">
                    <i class="fas fa-camera"></i>
                </button>

            const viewModificationsBtn = isModified ? `
                <button class="btn btn-outline-dark" onclick="toggleModificationsBox('${inv.id}')" title="عرض سجل التعديل">
                    <i class="fas fa-info-circle"></i> تعديل

            return `

                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h6 class="fw-bold mb-0 text-dark" style="font-size: 0.95rem;">${inv.customerName || 'عميل نقدى'}</h6>
                            <div class="meta-container">
                                <span class="pay-badge ${methodBadgeColor}">${inv.paymentMethod || 'غير محدد'}</span>
                                <span class="detail-badge"><i class="far fa-clock"></i> ${shortDate} ${displayTime}</span>
                            </div>
                        </div>
                    </div>
                    
                    ${isModified ? `
                        <div id="mod_log_${inv.id}" class="modification-log-box">
                            <i class="fas fa-history text-danger me-1"></i> <b>ملحوظة التعديل المحاسبي:</b> ${modificationNotes}
                        </div>
                    ` : ''}

                    <div class="financial-grid">
                        <div class="fin-box text-dark">إجمالي الفاتورة <span class="num">${(Number(inv.total) || 0).toFixed(2)}</span></div>
                        ${discountAmount > 0 ? `<div class="fin-box" style="color: var(--germany-red);">الخصم <span class="num">${discountAmount.toFixed(2)}</span></div>` : ''}
                        <div class="fin-box text-dark fw-bold">المسدد الشامل <span class="num">${totalPaid.toFixed(2)}</span></div>
                        <div class="fin-box text-danger">الأجل (المتبقي) <span class="num">${(Number(inv.remaining) || 0).toFixed(2)}</span></div>
                        <div class="fin-box text-secondary">حساب سابق <span class="num">${(Number(inv.previousBalance || 0) || 0).toFixed(2)}</span></div>
                    </div>
                    <div class="invoice-actions-group">
                        <button class="btn btn-outline-dark" onclick="toggleDetails('${inv.id}')" title="عرض الأصناف"><i class="fas fa-eye"></i></button>
                        ${viewModificationsBtn}
                        ${viewImagesBtn}
                        <button class="btn btn-outline-dark" onclick="window.printThermalInvoice('${inv.id}')" title="طباعة حرارية 80"><i class="fas fa-print"></i></button>
                        <button class="btn btn-outline-dark" onclick="window.shareThermalInvoice('${inv.id}')" title="مشاركة الفاتورة"><i class="fas fa-share-alt"></i></button>
                        <button class="btn btn-outline-dark" onclick="editInvoice('${inv.id}')" title="تعديل الفاتورة"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-outline-danger" onclick="deleteInvoice('${inv.id}')" title="نقل الفاتورة للسلة"><i class="fas fa-trash"></i></button>
                    </div>
                    <div id="details_box_${inv.id}" style="display:none;">
                        <table class="items-preview-table">
                            <thead><tr><th>الصنف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr></thead>
                            <tbody>
                                ${(inv.items || []).map(itm => `
                                    <tr>
                                        <td style="text-align:right;">${itm.name}</td>
                                        <td>${itm.qty}</td>
                                        <td>${(Number(itm.price) || 0).toFixed(2)}</td>
                                        <td>${((Number(itm.qty) || 0) * (Number(itm.price) || 0)).toFixed(2)}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }).join('');

        const vouchersHtml = vouchers.map(v => `
            <div class="invoice-item voucher-item">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <h6 class="fw-bold mb-0 text-dark" style="font-size: 0.95rem;">${v.customerName}</h6>
                        <div class="meta-container">
                            <span class="pay-badge bg-secondary" style="background-color: var(--purple) !important; color: white;">سند قبض</span>
                            <span class="detail-badge"><i class="far fa-clock"></i> ${v.date || 'بلا تاريخ'}</span>
                        </div>
                        ${v.note ? `<div class="text-muted mt-2" style="font-size:0.78rem;"><i class="fas fa-sticky-note me-1"></i> ${v.note}</div>` : ''}
                    </div>
                </div>
                <div class="financial-grid">
                    <div class="fin-box text-dark">نقدى مستلم <span class="num">${v.cashAmount.toFixed(2)}</span></div>
                    <div class="fin-box text-primary">محفظه مستلمة <span class="num">${v.walletAmount.toFixed(2)}</span></div>
                </div>
            </div>
        `).join('');

        let dividerHtml = '';
        if (vouchers.length > 0 && invoices.length > 0) {
            dividerHtml = `<div class="vouchers-divider"><i class="fas fa-hand-holding-usd"></i> سندات القبض (${vouchers.length})</div>`;
        }

        container.innerHTML = invoicesHtml + dividerHtml + vouchersHtml;
    };

    window.openCargoGallery = (invoiceId) => {
        const inv = allInvoices.find(i => i.id === invoiceId);

        }

        updateGalleryView();
    };

    window.closeCargoGallery = () => {

    function updateGalleryView() {
        const imgEl = document.getElementById('modalGalleryImg');
        const counterEl = document.getElementById('galleryCounter');
        const btnPrev = document.getElementById('btnPrevGallery');
        const btnNext = document.getElementById('btnNextGallery');

        imgEl.src = currentGalleryImages[currentGalleryIndex];
        counterEl.innerText = `${currentGalleryIndex + 1} / ${currentGalleryImages.length}`;

        btnPrev.disabled = (currentGalleryIndex === 0);
        btnNext.disabled = (currentGalleryIndex === currentGalleryImages.length - 1);
    }

    window.navigateGallery = (direction) => {
        currentGalleryIndex += direction;
        if (currentGalleryIndex < 0) currentGalleryIndex = 0;
        if (currentGalleryIndex >= currentGalleryImages.length) currentGalleryIndex = currentGalleryImages.length - 1;

    window.downloadCurrentImage = () => {
        const currentSrc = currentGalleryImages[currentGalleryIndex];

        const a = document.createElement('a');

        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    };

    function calculateStats() {
        let todayCash = 0; let todayWallet = 0;
        let todayRemaining = 0; let todaySales = 0;
        const filterInput = document.getElementById('dateFilterInput')?.value;
        const targetDateStr = filterInput ? filterInput : new Date().toLocaleDateString('en-CA');
        const statsTitle = document.getElementById('todayStatsTitle');
        if (statsTitle) { statsTitle.innerHTML = `<i class="fas fa-calendar-day"></i> إحصائيات يوم (${targetDateStr})`; }
        
        allInvoices.forEach(inv => {
            const invDateStr = parseInvoiceDate(inv);
            const isTargetDate = (invDateStr === targetDateStr);
            if (isTargetDate) {
                todayCash += inv.calculatedCash;
                todayWallet += inv.calculatedWallet;
                todaySales += (Number(inv.total) || 0);
                let rawRemaining = Number(inv.remaining) || 0;
                if (rawRemaining > 0) { todayRemaining += rawRemaining; }
            }
        });

        allReceiptVouchers.forEach(v => {
            const vDateStr = parseVoucherDate(v);
            if (vDateStr === targetDateStr) {
                todayCash += v.cashAmount;
                todayWallet += v.walletAmount;
            }
        });

        document.getElementById('todayCash').innerText = todayCash.toFixed(1);
        document.getElementById('todayWallet').innerText = todayWallet.toFixed(1);
        document.getElementById('todayRemaining').innerText = todayRemaining.toFixed(1);
        document.getElementById('todayTotalSales').innerText = todaySales.toFixed(1);

        window.globalExpectedTodayCash = todayCash;
        window.calculateCashReconciliation();
    }

    window.calculateCashReconciliation = () => {
        const inputField = document.getElementById('actualCashInput');
        const resultBox = document.getElementById('reconResultBox');
        if (!inputField || !resultBox) return;

        const inputVal = inputField.value.trim();
        if (inputVal === "") {
            resultBox.className = "text-center fw-bold text-muted p-2";
            resultBox.style.background = "#f8fafc";
            resultBox.style.border = "1px dashed var(--border)";
            resultBox.innerHTML = "بانتظار جردك الفعلي...";
            return;
        }

        let sanitizedVal = convertToEnglishNumbers(inputVal);
        sanitizedVal = sanitizedVal.replace(/\+/g, ' ');
        const amountParts = sanitizedVal.split(/\s+/); 
        let actual = 0;
        
        amountParts.forEach(part => {
            const parsedNum = parseFloat(part.trim());
            if (!isNaN(parsedNum)) {
                actual += parsedNum;
            }
        });

        const expected = window.globalExpectedTodayCash || 0;
        const diff = actual - expected;

        let totalEnteredStr = amountParts.length > 1 ? `[جردك: ${actual.toFixed(1)}] ` : '';

        if (Math.abs(diff) < 0.1) {
            resultBox.className = "text-center fw-bold text-dark p-2";
            resultBox.style.background = "#f0fdf4";
            resultBox.style.border = "1px solid var(--germany-black)";
            resultBox.innerHTML = `<i class="fas fa-check-circle"></i> ${totalEnteredStr} مطابق تماماً (0.00)`;
        } 
        else if (diff > 0) {
            resultBox.className = "text-center fw-bold text-primary p-2";
            resultBox.style.background = "#eff6ff";
            resultBox.style.border = "1px solid #3b82f6";
            resultBox.innerHTML = `<i class="fas fa-circle-plus"></i> ${totalEnteredStr} زيادة (+${diff.toFixed(1)})`;
        } 
        else {
            resultBox.className = "text-center fw-bold text-danger p-2";
            resultBox.style.background = "#fff1f2";
            resultBox.style.border = "1px solid var(--germany-red)";
            resultBox.innerHTML = `<i class="fas fa-circle-minus"></i> ${totalEnteredStr} عجز (${diff.toFixed(1)})`;
        }
    };

    function applyCurrentView() {
        calculateStats();
        if (currentFilterType) {
            const filterInput = document.getElementById('dateFilterInput')?.value;
            const targetDate = filterInput ? filterInput : new Date().toLocaleDateString('en-CA');
            executeFilterLogic(currentFilterType, targetDate);
        } else {
            const filterInput = document.getElementById('dateFilterInput')?.value;
            const targetDate = filterInput ? filterInput : new Date().toLocaleDateString('en-CA');
            const todayInvoices = allInvoices.filter(inv => parseInvoiceDate(inv) === targetDate);
            window.renderInvoices(todayInvoices);
        }
    }

    async function loadData(showSpinner = true) {
        const container = document.getElementById('invoicesList');
        if (showSpinner) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-spinner fa-spin fa-2x"></i>
                    <p class="mt-3 fw-bold">برجاء الانتظار جاري التحميل...</p>
                </div>`;
        }

        try {
            // إضافة وقت أقصى (Timeout) لمنع الشاشة من التعليق
            const fetchWithTimeout = (promise, ms = 8000) => {
                return Promise.race([
                    promise,
                    new Promise((_, reject) => setTimeout(() => reject(new Error("Timeout")), ms))
                ]);
            };

            // جلب البيانات بشكل آمن لمنع تعطل النظام بالكامل إذا فشلت مجموعة واحدة
            const [custSnap, transSnap, invSnap] = await Promise.all([
                fetchWithTimeout(db.collection("customers").get()).catch(e => { console.warn("العملاء لم تتحمل:", e); return null; }),
                fetchWithTimeout(db.collection("transactions").get()).catch(e => { console.warn("المعاملات لم تتحمل:", e); return null; }),
                fetchWithTimeout(db.collection("invoices").get()).catch(e => { console.warn("الفواتير لم تتحمل:", e); return null; })
            ]);

            if (!invSnap) {
                throw new Error("فشل الاتصال بقاعدة البيانات. برجاء التأكد من الإنترنت أو صلاحيات القراءة.");
            }

            customersData = {};
            if (custSnap) {
                custSnap.forEach(d => {
                    customersData[d.id] = { id: d.id, name: d.data().name, initialBalance: Number(d.data().initialBalance) || 0 };
                });
            }

            let transByCustomer = {};
            allReceiptVouchers = [];
            if (transSnap) {
                transSnap.forEach(d => {
                    const tr = d.data();
                    if (tr.isDeleted === true) return;
                    if (!transByCustomer[tr.partyId]) transByCustomer[tr.partyId] = 0;
                    if (tr.type === 'قبض') transByCustomer[tr.partyId] -= (Number(tr.amount) || 0);
                    else if (tr.type === 'صرف') transByCustomer[tr.partyId] += (Number(tr.amount) || 0);

                    const isCustomerVoucher = tr.partyType === 'عميل' || (!tr.partyType && customersData[tr.partyId]);
                    if (tr.type === 'قبض' && isCustomerVoucher) {
                        let cashAmount = 0;
                        let walletAmount = 0;
                        if (tr.cashPaid !== undefined || tr.walletPaid !== undefined) {
                            cashAmount = Number(tr.cashPaid) || 0;
                            walletAmount = Number(tr.walletPaid) || 0;
                        } else if (tr.method !== undefined) {
                            const amt = Number(tr.amount) || 0;
                            if (tr.method === 'محفظة' || tr.method === 'محفظه') walletAmount = amt;
                            else cashAmount = amt;
                        } else {
                            cashAmount = Number(tr.amount) || 0;
                        }
                        const customerName = (customersData[tr.partyId] && customersData[tr.partyId].name) || 'عميل غير معروف';
                        allReceiptVouchers.push({
                            id: d.id,
                            date: tr.date,
                            cashAmount,
                            walletAmount,
                            customerName,
                            note: tr.note || tr.notes || ''
                        });
                    }
                });
            }

            let runningBalances = {};
            let tempInvoices = [];

            invSnap.forEach(d => {
                const data = d.data();
                if (data.isDeleted === true) return;

                const cid = data.customerId;
                if (!runningBalances[cid]) {
                    runningBalances[cid] = (customersData[cid]?.initialBalance || 0) + (transByCustomer[cid] || 0);
                }
                const previousBalance = runningBalances[cid];
                runningBalances[cid] += (Number(data.remaining) || 0);

                let cPaid = 0; let wPaid = 0;
                if (data.cashAmount !== undefined || data.walletAmount !== undefined) {
                    cPaid = Number(data.cashAmount) || 0;
                    wPaid = Number(data.walletAmount) || 0;
                } else {
                    let p = Number(data.paid) || 0;
                    if (data.paymentMethod === "سداد مرئية" || data.paymentMethod === "محفظه" || data.paymentMethod === "سداد محفظه") wPaid = p;
                    else cPaid = p;
                }

                tempInvoices.push({
                    id: d.id,
                    ...data,
                    calculatedCash: cPaid,
                    calculatedWallet: wPaid,
                    previousBalance: previousBalance
                });
            });

            allInvoices = tempInvoices.sort((a, b) => {
                const timeA = a.timestamp?.seconds || 0;
                const timeB = b.timestamp?.seconds || 0;
                return timeA - timeB;
            }).reverse();
            
            applyCurrentView();

        }
    }

    async function convertToBlob(source) {
        if (!source) return null;
        if (source.startsWith('http://') || source.startsWith('https://')) {
            try {
                const response = await fetch(source);
                return await response.blob();
            } catch (err) {
                console.error("خطأ CORS أثناء جلب الصورة مباشرة، محاولة التحويل البديل:", err);
                return null;
            }
        }
        if (source.startsWith('data:image')) {
            try {
                const parts = source.split(',');
                const contentType = parts[0].split(':')[1].split(';')[0];
                const byteCharacters = atob(parts[1]);
                const byteArrays = [];
                for (let offset = 0; offset < byteCharacters.length; offset += 512) {
                    const slice = byteCharacters.slice(offset, offset + 512);
                    const byteNumbers = new Array(slice.length);
                    for (let i = 0; i < slice.length; i++) {
                        byteNumbers[i] = slice.charCodeAt(i);
                    }
                    const byteArray = new Uint8Array(byteNumbers);
                    byteArrays.push(byteArray);
                }
                return new Blob(byteArrays, { type: contentType });
            } catch (err) {
                console.error("فشل تحويل كود الـ Base64 لـ Blob:", err);
                return null;
            }
        }

        try {
            const byteCharacters = atob(source);
            const byteArrays = [];
            for (let offset = 0; offset < byteCharacters.length; offset += 512) {
                const slice = byteCharacters.slice(offset, offset + 512);
                const byteNumbers = new Array(slice.length);
                for (let i = 0; i < slice.length; i++) {
                    byteNumbers[i] = slice.charCodeAt(i);
                }
                const byteArray = new Uint8Array(byteNumbers);
                byteArrays.push(byteArray);
            }
            return new Blob(byteArrays, { type: 'image/jpeg' });
        } catch (err) {
            console.error("فشل القراءة البديلة لبيانات الصورة:", err);
            return null;
        }
    }

                    <h6 style="margin:0 0 4px 0; font-weight:bold; font-size:11.5px; border-bottom:1.5px solid #000; padding-bottom:3px; color:var(--purple);"><i class="fas fa-hand-holding-usd"></i> حركة سندات القبض (${targetVouchers.length}):</h6>
                    ${vouchersDetailsHtml}
                </div>

                <div style="margin-bottom:10px;">
                    <h6 style="margin:0 0 5px 0; font-weight:bold; font-size:11.5px; border-bottom:1.5px solid #000; padding-bottom:3px; color:var(--accent);"><i class="fas fa-cubes"></i> حركة جرد المخزن (الكميات والمسحوبات):</h6>
                    <table style="width:100%; font-size:10.5px; border-collapse:collapse;">
                        <thead>
                            <tr style="border-bottom:1px solid #000; font-weight:bold;">
                                <th style="text-align:right; padding-bottom:4px;">الصنف والبيان</th>
                                <th style="text-align:center; padding-bottom:4px;">الكمية</th>
                                <th style="text-align:left; padding-bottom:4px;">القيمة المالية</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${itemsSummaryHtml}
                        </tbody>
                    </table>
                </div>

                <div style="text-align:center; margin-top:25px; font-size:10px; border-top:1.5px dashed #000; padding-top:8px;">
                    <br>تصميم وإشراف محاسب / أحمد محمود الزيادي
                </div>
            </div>
        `;

        window.print();
    };

    window.printThermalInvoice = (id) => {
        const inv = allInvoices.find(i => i.id === id);
        if (!inv) return;
        const printSection = document.getElementById('thermalPrintSection');
        printSection.innerHTML = generateThermalInvoiceHtml(inv);
        window.print();
    };

    window.shareThermalInvoice = async (id) => {
        const inv = allInvoices.find(i => i.id === id);
        if (!inv) return;
        
        try {
            const blob = await getInvoiceImageBlob(inv);
            const file = new File([blob], `فاتورة_${inv.customerName || 'نقدى'}.png`, { type: 'image/png' });

            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                await navigator.share({
                    files: [file],
                    title: `فاتورة ${inv.customerName || 'نقدى'}`,
                    text: `فاتورة الزيادي لزيوت السيارات`
                });
            } else {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `فاتورة_${inv.customerName || 'نقدى'}.png`;
                a.click();
                URL.revokeObjectURL(url);
            }
        } catch (err) {
            console.error(err);
            alert("حدث خطأ أثناء معالجة صورة الفاتورة الحرارية.");
        }
    };

    document.getElementById('deleteAllCustomersBtn').onclick = () => {
        window.showCustomUi({
            title: "🔒 تصفير الحسابات ونقلها للسلة",
            message: "الرجاء إدخل كلمة التأكيد (الزيادي) للمتابعة في تصفير النظام ونقله للسلة:",
            type: "prompt",
            icon: "danger",
            confirmText: "تأكيد التصفير المؤقت",
            onConfirm: async (inputValue) => {
                if (inputValue !== "الزيادي") {
                    setTimeout(() => {
                        window.showCustomUi({ title: "خطأ", message: "كلمة التأكيد غير صحيحة. تم إلغاء العملية.", icon: "danger" });
                    }, 300);
                    return;
                }
                setTimeout(() => {
                    window.showCustomUi({
                        title: "🛑 تحذير نقل للسلة",
                        message: "هل أنت متأكد من تصفير المخزن، الفواتير، والعمليات ونقلها جميعاً لسلة المحذوفات؟",
                        type: "confirm",
                        icon: "danger",
                        onConfirm: async () => {
                            try {
                                const batch = db.batch();
                                const collectionsToTrash = ["invoices", "transactions", "inventory", "customers", "suppliers", "purchases"];

                                for (const colName of collectionsToTrash) {
                                    const snap = await db.collection(colName).get();
                                    snap.forEach(d => {
                                        const docRef = db.collection(colName).doc(d.id);
                                        batch.update(docRef, {
                                            isDeleted: true,
                                            deletedAt: firebase.firestore.FieldValue.serverTimestamp()
                                        });
                                    });
                                }
                                await batch.commit();
                                window.showCustomUi({
                                    title: "نجاح التصفير",
                                    message: "🚀 تم تصفير البيانات بنجاح ونقلها بالكامل إلى السلة.",
                                    icon: "success",
                                    onConfirm: () => { location.reload(); }
                                });
                            } catch (err) {
                                window.showCustomUi({ title: "خطأ", message: "حدث خطأ أثناء نقل البيانات للسلة.", icon: "danger" });
                            }
                        }
                    });
                }, 300);
            }
        });
    };

    window.filterByStat = (type, cardElement) => {
        document.querySelectorAll('.stat-card').forEach(c => c.classList.remove('active-filter'));
        cardElement.classList.add('active-filter');
        currentFilterType = type;
        const filterInput = document.getElementById('dateFilterInput')?.value;
        const todayStr = filterInput ? filterInput : new Date().toLocaleDateString('en-CA');
        executeFilterLogic(type, todayStr);
    };

    function executeFilterLogic(type, dateStr) {
        let filtered = []; let statusLabel = "";
        
        filtered = allInvoices.filter(inv => {
            const invDateStr = parseInvoiceDate(inv);
            const isToday = (invDateStr === dateStr);
            switch (type) {
                case 'today-cash': statusLabel = `نقدى يوم (${dateStr})`; return isToday && inv.calculatedCash > 0;
                case 'today-wallet': statusLabel = `محفظه يوم (${dateStr})`; return isToday && inv.calculatedWallet > 0;
                case 'today-remaining': statusLabel = `آجل يوم (${dateStr})`; return isToday && Number(inv.remaining) > 0;
                case 'today-total': statusLabel = `مبيعات يوم (${dateStr})`; return isToday;
                default: return true;
            }
        });

        let matchingVouchers = [];
        if (type === 'today-cash' || type === 'today-wallet') {
            matchingVouchers = allReceiptVouchers.filter(v => {
                const vDateStr = parseVoucherDate(v);
                const isToday = (vDateStr === dateStr);
                if (!isToday) return false;
                return type === 'today-cash' ? v.cashAmount > 0 : v.walletAmount > 0;
            });
        }

        const vouchersCountLabel = matchingVouchers.length > 0 ? ` + ${matchingVouchers.length} سند قبض` : '';
        document.getElementById('filterStatusText').innerText = `${statusLabel} (${filtered.length} فاتورة${vouchersCountLabel})`;
        document.getElementById('filterStatusBar').style.display = "flex";
        window.renderInvoices(filtered, matchingVouchers);
    }

    window.resetStatFilter = () => {
        document.querySelectorAll('.stat-card').forEach(c => c.classList.remove('active-filter'));
        document.getElementById('filterStatusBar').style.display = "none";
        currentFilterType = null;
        document.getElementById('searchInput').value = "";
        document.getElementById('dateFilterInput').value = "";
        calculateStats();
        const todayStr = new Date().toLocaleDateString('en-CA');
        const todayInvoices = allInvoices.filter(inv => parseInvoiceDate(inv) === todayStr);
        window.renderInvoices(todayInvoices);
    };

    window.filterInvoices = () => {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        
        if (!query) {
            const filterInput = document.getElementById('dateFilterInput').value;
            const targetDate = filterInput ? filterInput : new Date().toLocaleDateString('en-CA');
            const filtered = allInvoices.filter(inv => parseInvoiceDate(inv) === targetDate);
            window.renderInvoices(filtered);
            return;
        }
        const filtered = allInvoices.filter(inv =>
            (inv.customerName && inv.customerName.toLowerCase().includes(query)) ||
            (inv.paymentMethod && inv.paymentMethod.toLowerCase().includes(query))
        );
        window.renderInvoices(filtered);
    };

    window.toggleDetails = (id) => {
        const element = document.getElementById(`details_box_${id}`);
        element.style.display = (element.style.display === "none") ? "block" : "none";
    };

    window.editInvoice = (id) => {
        window.location.href = `sales-invoice.html?edit=${id}&allowDateEdit=true`;
    };

    window.deleteInvoice = (id) => {
        const inv = allInvoices.find(i => i.id === id);
        const nameDisplay = inv ? (inv.customerName || 'عميل نقدى') : '';
        
        window.showCustomUi({
            title: "نقل الفاتورة إلى السلة",
            message: `هل أنت متأكد من نقل فاتورة "${nameDisplay}" إلى سلة المحذوفات وإعادة كمياتها للمخزن؟`,
            type: "confirm",
            icon: "danger",
            onConfirm: async () => {
                const batch = db.batch();

                try {
                    const items = inv.items || [];
                    items.forEach(item => {
                        if (item.stockId) {
                            const productRef = db.collection("inventory").doc(item.stockId);
                            const quantityToRestore = Number(item.qty || 0);

                            batch.update(productRef, {
                                totalPcs: firebase.firestore.FieldValue.increment(quantityToRestore)
                            });
                        }
                    });

                    const txSnapshot = await db.collection("transactions").where("invoiceId", "==", id).get();
                    txSnapshot.forEach(txDoc => {
                        const txRef = db.collection("transactions").doc(txDoc.id);
                        batch.update(txRef, {
                            isDeleted: true,
                            deletedAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    });

                    const invoiceRef = db.collection("invoices").doc(id);
                    batch.update(invoiceRef, { 
                        isDeleted: true, 
                        deletedAt: firebase.firestore.FieldValue.serverTimestamp() 
                    });

                    await batch.commit();

                    await loadData(false);
                    window.showCustomUi({ title: "تم النقل", message: "تم نقل الفاتورة إلى السلة بنجاح وإعادة البضاعة للمخزن.", icon: "success" });
                
                } catch (err) {
                    console.error("خطأ أثناء الحذف وإرجاع المخزون:", err);
                    window.showCustomUi({ title: "خطأ", message: "حدث خطأ أثناء نقل الفاتورة للمخزن وإعادة الأصناف.", icon: "danger" });
                }
            }
        });
    };

    document.getElementById('exportExcelBtn').onclick = () => {
        if (!allInvoices.length) {
            window.showCustomUi({ title: "تنبيه", message: "لا توجد بيانات لتصديرها بعد.", icon: "info" });
            return;
        }

        let excelRows = [];
        allInvoices.forEach(inv => {
            const invDate = parseInvoiceDate(inv);
            const invTime = formatInvoiceTime(inv.time, inv.date);
            const invDateWithTime = `${invDate} | ${invTime}`;

            const customerName = inv.customerName || 'النقدى';
            const discountAmount = Number(inv.discount) || 0;

            if (inv.items && inv.items.length > 0) {
                inv.items.forEach(itm => {
                    let qtyCarton = 0;
                    let qtyJarkan = 0;
                    let priceCarton = 0;
                    let priceJarkan = 0;

                    const isRet = itm.isReturn === true;
                    const movementType = isRet ? "مرتجع" : "بيع";
                    
                    const itemName = (itm.name || "");
                    const rawUnit = (itm.unit || "").trim().toLowerCase();
                    
                    const rawQty = Number(itm.qty) || 0;
                    const rawPrice = Number(itm.price) || 0;

                    let isCarton = false;
                    let excelUnitDisplay = "جركن";

                    if (rawUnit === 'box' || rawUnit === 'carton' || rawUnit === 'كرتونة' || rawUnit === 'كرتونه' || itemName.includes('شحم بريفيكس')) {
                        isCarton = true;
                        excelUnitDisplay = "كرتونة";
                    }

                    if (isCarton) {
                        qtyCarton = rawQty;
                        priceCarton = rawPrice;
                    } else {
                        qtyJarkan = rawQty;
                        priceJarkan = rawPrice;
                    }

                    excelRows.push({
                        "التاريخ": invDateWithTime,
                        "الحركة": movementType,
                        "اسم العميل": customerName,
                        "الصنف": itemName,
                        "عدد الجركن": qtyJarkan,
                        "عدد الكرتونة": qtyCarton,
                        "سعر الجركن": priceJarkan,
                        "سعر الكرتونة": priceCarton,
                        "نوع الصنف": excelUnitDisplay
                    });
                });
            }

            if ((inv.calculatedCash || 0) > 0) {
                excelRows.push({
                    "التاريخ": invDateWithTime,
                    "الحركة": "سداد منه نقدى",
                    "اسم العميل": customerName,
                    "الصنف": "سداد نقدى",
                    "عدد الجركن": 0,
                    "عدد الكرتونة": 1,
                    "سعر الجركن": 0,
                    "سعر الكرتونة": inv.calculatedCash,
                    "نوع الصنف": "سداد"
                });
            }

            if ((inv.calculatedWallet || 0) > 0) {
                excelRows.push({
                    "التاريخ": invDateWithTime,
                    "الحركة": "سداد منه محفظه",
                    "اسم العميل": customerName,
                    "الصنف": "سداد نقدى",
                    "عدد الجركن": 0,
                    "عدد الكرتونة": 1,
                    "سعر الجركن": 0,
                    "سعر الكرتونة": inv.calculatedWallet,
                    "نوع الصنف": "سداد"
                });
            }

            if (discountAmount > 0) {
                excelRows.push({
                    "التاريخ": invDateWithTime,
                    "الحركة": "بيع",
                    "اسم العميل": customerName,
                    "الصنف": "مبيعات اخرى",
                    "عدد الجركن": 0,
                    "عدد الكرتونة": -1,
                    "سعر الجركن": 0,
                    "سعر الكرتونة": discountAmount,
                    "نوع الصنف": "خصم"
                });
            }
        });

        const ws = XLSX.utils.json_to_sheet(excelRows);
        ws['!dir'] = "rtl";

        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "المبيعات والأرشيف");
        XLSX.writeFile(wb, "سجل_المبيعات_التفصيلي.xlsx");
    };
      
    loadData(true);
</script>
</body>
</html>
