<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فاتورة مبيعات - الزيادي لزيوت السيارات</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght=400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --accent: #0b5e3d; 
            --header-bg: #0b5e3d; 
            --bg-light: #f4f7f6; 
            --text-primary: #1b2e26; 
            --border: #dce3de; 
            --white: #ffffff; 
        }
        body { 
            background: var(--bg-light); 
            font-family: 'Cairo', sans-serif; 
            color: var(--text-primary); 
            font-size: 0.85rem; 
        }
        .header-nav { 
            background: var(--header-bg); 
            padding: 10px 15px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            color: white; 
        }
        .back-btn { 
            background: rgba(255,255,255,0.2); 
            width: 32px; 
            height: 32px; 
            border-radius: 8px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: white; 
            text-decoration: none; 
        }
        .invoice-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .product-row {
            background: #fdfdfd;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            position: relative;
        }
        .search-container { position: relative; }
        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            z-index: 1000;
            max-height: 200px;
            overflow-y: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: none;
        }
        .search-item {
            padding: 8px 12px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            text-align: right;
        }
        .search-item:hover { background: #ebf9eb; }
        .form-control, .form-select {
            font-family: 'Cairo';
            font-size: 0.85rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="header-nav">
    <a href="sales-history.html" class="back-btn"><i class="fas fa-arrow-right"></i></a>
    <h6 class="m-0 fw-bold"><i class="fas fa-file-invoice-dollar me-1"></i> إنشاء فاتورة مبيعات جديدة</h6>
    <div style="width: 32px;"></div>
</div>

<div class="container px-2">
    <div class="invoice-card">
        <!-- بيانات العميل والدفع -->
        <div class="row g-2 mb-3">
            <div class="col-6">
                <label class="form-label fw-bold mb-1">اسم العميل</label>
                <select id="customerSelect" class="form-select">
                    <option value="">عميل نقدي</option>
                </select>
            </div>
            <div class="col-6">
                <label class="form-label fw-bold mb-1">طريقة السداد</label>
                <select id="paymentMethod" class="form-select" onchange="handlePaymentMethodChange()">
                    <option value="كاش">كاش (نقدي)</option>
                    <option value="محفظه">محفظة رقمية</option>
                    <option value="آجل">آجل</option>
                </select>
            </div>
        </div>

        <hr class="my-3" style="color: var(--border);">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="fw-bold text-dark"><i class="fas fa-cubes me-1"></i> أصناف الفاتورة</span>
            <button class="btn btn-sm btn-success fw-bold" onclick="addNewRow()"><i class="fas fa-plus me-1"></i> إضافة صنف</button>
        </div>

        <!-- حاوية الأصناف -->
        <div id="productsContainer"></div>

        <!-- الإجماليات المالية -->
        <div class="bg-light p-3 rounded-3 border mt-3">
            <div class="row g-2">
                <div class="col-4 text-center">
                    <small class="text-muted d-block fw-bold">إجمالي الفاتورة</small>
                    <span id="invoiceTotal" class="fw-bold text-dark fs-5">0.00</span>
                </div>
                <div class="col-4 text-center border-start border-end">
                    <small class="text-muted d-block fw-bold">المسدد الشامل</small>
                    <input type="number" id="paidAmount" class="form-control text-center fw-bold text-success" value="0" oninput="calculateInvoiceTotals()">
                </div>
                <div class="col-4 text-center">
                    <small class="text-muted d-block fw-bold">المتبقي (الآجل)</small>
                    <span id="remainingAmount" class="fw-bold text-danger fs-5">0.00</span>
                </div>
            </div>
        </div>

        <button class="btn btn-dark w-100 fw-bold mt-3 py-2 fs-6" onclick="saveInvoice()"><i class="fas fa-save me-1"></i> حفظ الفاتورة وتثبيت العملية</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
        authDomain: "ahmedelzaiady.firebaseapp.com",
        projectId: "ahmedelzaiady",
        storageBucket: "ahmedelzaiady.firebasestorage.app",
        messagingSenderId: "300306825071",
        appId: "1:300306825071:web:0426ddde56280fa090329a",
        measurementId: "G-WE04GK5XZZ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let inventory = [];
    let rowCounter = 0;

    // تحميل جرد المخزن والعملاء عند فتح الصفحة
    async function initPage() {
        try {
            // 1. جلب المنتجات
            const itemsSnap = await getDocs(collection(db, "inventory"));
            inventory = [];
            itemsSnap.forEach(doc => {
                inventory.push({ id: doc.id, ...doc.data() });
            });
            window.inventory = inventory;

            // 2. جلب العملاء
            const custSnap = await getDocs(collection(db, "customers"));
            const selectHtml = document.getElementById('customerSelect');
            custSnap.forEach(doc => {
                const opt = document.createElement('option');
                opt.value = doc.id;
                opt.dataset.name = doc.data().name;
                opt.innerText = doc.data().name;
                selectHtml.appendChild(opt);
            });

            // إضافة أول سطر تلقائياً
            addNewRow();
        } catch (e) {
            console.error("Error loading setup data:", e);
        }
    }

    // إضافة سطر صنف جديد هندسياً بالتقسيم المطلوب
    window.addNewRow = () => {
        rowCounter++;
        const rowId = `product_row_${rowCounter}`;
        const rowHtml = `
            <div class="product-row" id="${rowId}">
                <button type="button" class="btn-close position-absolute top-0 start-0 m-2" style="font-size:0.7rem;" onclick="removeRow('${rowId}')"></button>
                
                <div class="search-container mb-2 mt-2">
                    <input type="text" class="form-control product-name" placeholder="ابحث باسم الزيت أو المنتج هنا..." oninput="searchProduct(this)">
                    <div class="search-results"></div>
                </div>

                <div class="row g-1">
                    <!-- عمود الجركن / القطعة -->
                    <div class="col-3">
                        <small class="text-muted d-block fw-bold" style="font-size:0.65rem;">عدّد (جركن/قطعة)</small>
                        <input type="number" class="form-control text-center qty-jarkan" placeholder="الكمية" oninput="calculateRowTotal(this.closest('.product-row'))">
                    </div>
                    <div class="col-3 border-end pe-1">
                        <small class="text-muted d-block fw-bold" style="font-size:0.65rem;">سعر (جركن/قطعة)</small>
                        <input type="number" class="form-control text-center price-jarkan" placeholder="السعر" oninput="calculateRowTotal(this.closest('.product-row'))">
                    </div>

                    <!-- عمود الكرتونة -->
                    <div class="col-3 ps-1">
                        <small class="text-muted d-block fw-bold" style="font-size:0.65rem;">عدد كرتونة</small>
                        <input type="number" class="form-control text-center qty-carton" placeholder="الكمية" oninput="calculateRowTotal(this.closest('.product-row'))">
                    </div>
                    <div class="col-3">
                        <small class="text-muted d-block fw-bold" style="font-size:0.65rem;">سعر الكرتونة</small>
                        <input type="number" class="form-control text-center price-carton" placeholder="السعر" oninput="calculateRowTotal(this.closest('.product-row'))">
                    </div>
                </div>

                <div class="text-start mt-2 pt-1 border-top" style="font-size: 0.75rem; font-weight: bold;">
                    إجمالي السطر: <span class="row-total text-accent">0.00</span> ج.م
                </div>
            </div>
        `;
        document.getElementById('productsContainer').insertAdjacentHTML('beforeend', rowHtml);
    };

    window.removeRow = (rowId) => {
        const rows = document.querySelectorAll('.product-row');
        if(rows.length > 1) {
            document.getElementById(rowId).remove();
            calculateInvoiceTotals();
        }
    };

    // ⚡ دالة البحث المحدثة التي طلبتها لعرض التنبيهات ونوع وحدة المخزن
    window.searchProduct = (input) => {
        const term = input.value.toLowerCase().trim();
        const resultadosDiv = input.parentElement.querySelector('.search-results');
        if (term.length < 1) { resultadosDiv.style.display = 'none'; return; }
        
        const filtered = inventory.filter(i => i.name.toLowerCase().includes(term)).slice(0, 15);
        
        resultadosDiv.innerHTML = filtered.map(p => {
            let unitName = (p.name.includes("كرتونه") || p.name.includes("كرتونة")) ? "كرتونة" : "جركن/قطعة";
            return `
                <div class="search-item" onclick="selectProduct('${input.closest('.product-row').id}', '${p.id}', '${p.name.replace(/'/g, "\\'")}')">
                    <b>${p.name}</b> 
                    <span style="font-size:0.7rem; color:#6c757d; display:block; margin-top:2px;">المخزن: ${p.totalPcs} ${unitName}</span>
                </div>`;
        }).join('');
        
        resultadosDiv.style.display = filtered.length > 0 ? 'block' : 'none';
    };

    // ⚡ دالة الاختيار الذكي والتوزيع التلقائي حسب طلبك للقطع والجراكن والكراتين
    window.selectProduct = (rowId, productId, productName) => {
        const row = document.getElementById(rowId);
        if (!row) return;

        const product = inventory.find(i => i.id === productId);
        const price = product ? (Number(product.sellPrice) || 0) : 0;

        const nameInput = row.querySelector('.product-name');
        const qtyJarkanInput = row.querySelector('.qty-jarkan');       
        const priceJarkanInput = row.querySelector('.price-jarkan');   
        const qtyCartonInput = row.querySelector('.qty-carton');       
        const priceCartonInput = row.querySelector('.price-carton');   

        if (nameInput) nameInput.value = productName;
        const resultadosDiv = row.querySelector('.search-results');
        if (resultadosDiv) resultadosDiv.style.display = 'none';

        // المنطق البرمجي الفرزي التلقائي
        if (productName.includes("كرتونه") || productName.includes("كرتونة")) {
            if (qtyCartonInput) qtyCartonInput.value = 1;
            if (priceCartonInput) priceCartonInput.value = price > 0 ? price : "";
            
            if (qtyJarkanInput) qtyJarkanInput.value = "";
            if (priceJarkanInput) priceJarkanInput.value = "";
        } else {
            if (qtyJarkanInput) qtyJarkanInput.value = 1;
            if (priceJarkanInput) priceJarkanInput.value = price > 0 ? price : "";
            
            if (qtyCartonInput) qtyCartonInput.value = "";
            if (priceCartonInput) priceCartonInput.value = "";
        }

        window.calculateRowTotal(row);
    };

    // حساب إجمالي السطر الواحد تجميعياً
    window.calculateRowTotal = (row) => {
        const qtyJarkan = Number(row.querySelector('.qty-jarkan').value) || 0;
        const priceJarkan = Number(row.querySelector('.price-jarkan').value) || 0;
        const qtyCarton = Number(row.querySelector('.qty-carton').value) || 0;
        const priceCarton = Number(row.querySelector('.price-carton').value) || 0;

        const total = (qtyJarkan * priceJarkan) + (qtyCarton * priceCarton);
        row.querySelector('.row-total').innerText = total.toFixed(2);

        calculateInvoiceTotals();
    };

    // حساب إجماليات الفاتورة بالكامل
    window.calculateInvoiceTotals = () => {
        let totalSales = 0;
        document.querySelectorAll('.product-row').forEach(row => {
            const qtyJarkan = Number(row.querySelector('.qty-jarkan').value) || 0;
            const priceJarkan = Number(row.querySelector('.price-jarkan').value) || 0;
            const qtyCarton = Number(row.querySelector('.qty-carton').value) || 0;
            const priceCarton = Number(row.querySelector('.price-carton').value) || 0;
            totalSales += (qtyJarkan * priceJarkan) + (qtyCarton * priceCarton);
        });

        document.getElementById('invoiceTotal').innerText = totalSales.toFixed(2);
        
        const method = document.getElementById('paymentMethod').value;
        const paidInput = document.getElementById('paidAmount');
        
        if(method === "كاش" || method === "محفظه") {
            paidInput.value = totalSales;
        }

        const paidAmount = Number(paidInput.value) || 0;
        const remaining = totalSales - paidAmount;
        document.getElementById('remainingAmount').innerText = remaining.toFixed(2);
    };

    window.handlePaymentMethodChange = () => {
        const method = document.getElementById('paymentMethod').value;
        const paidInput = document.getElementById('paidAmount');
        if(method === "آجل") {
            paidInput.value = 0;
            paidInput.disabled = false;
        } else {
            paidInput.disabled = true;
        }
        calculateInvoiceTotals();
    };

    // حفظ الفاتورة إلى الفايربيز وإعداد كشف الحركة
    window.saveInvoice = async () => {
        const custSelect = document.getElementById('customerSelect');
        const customerId = custSelect.value || "cash_client";
        const customerName = custSelect.value ? custSelect.options[custSelect.selectedIndex].dataset.name : "عميل نقدي";
        const paymentMethod = document.getElementById('paymentMethod').value;
        const total = Number(document.getElementById('invoiceTotal').innerText) || 0;
        const paid = Number(document.getElementById('paidAmount').value) || 0;
        const remaining = Number(document.getElementById('remainingAmount').innerText) || 0;

        if(total <= 0) {
            alert("برجاء إضافة أصناف للفاتورة أولاً!");
            return;
        }

        let items = [];
        document.querySelectorAll('.product-row').forEach(row => {
            const name = row.querySelector('.product-name').value;
            const qtyJarkan = Number(row.querySelector('.qty-jarkan').value) || 0;
            const qtyCarton = Number(row.querySelector('.qty-carton').value) || 0;
            
            // تحديد الكمية الكلية والسعر للسطر المخزني للحفظ الشامل للسيستم الموحد
            let finalQty = qtyJarkan > 0 ? qtyJarkan : qtyCarton;
            let finalPrice = qtyJarkan > 0 ? (Number(row.querySelector('.price-jarkan').value) || 0) : (Number(row.querySelector('.price-carton').value) || 0);

            if(name) {
                items.push({ name: name, qty: finalQty, price: finalPrice });
            }
        });

        let cashAmount = (paymentMethod === "كاش") ? paid : 0;
        let walletAmount = (paymentMethod === "محفظه") ? paid : 0;

        const invoiceData = {
            customerId,
            customerName,
            paymentMethod,
            total,
            paid,
            remaining,
            cashAmount,
            walletAmount,
            items,
            date: new Date().toLocaleDateString('en-CA'),
            time: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }),
            timestamp: serverTimestamp()
        };

        try {
            await addDoc(collection(db, "invoices"), invoiceData);
            alert("🚀 تم حفظ الفاتورة بنجاح في سجل المبيعات والسيستم الحسابي!");
            window.location.href = "sales-history.html";
        } catch(e) {
            console.error("Error writing document: ", e);
            alert("حدث خطأ أثناء الاتصال بقاعدة البيانات.");
        }
    };

    initPage();
</script>
</body>
</html>
