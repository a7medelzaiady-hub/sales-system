<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الفواتير - نظام المبيعات</title>
    <!-- خطوط وتنسيقات شيك ومتوافقة مع الواجهات الحديثة -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #1e293b;
            --accent-color: #0284c7;
            --bg-color: #f8fafc;
            --text-color: #334155;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .header-section h2 {
            margin: 0;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ستايل شيك لزر جلب البيانات الشاملة */
        .btn-load-all {
            background-color: transparent;
            color: var(--accent-color);
            border: 2px solid var(--accent-color);
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-load-all:hover {
            background-color: var(--accent-color);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2);
        }

        .btn-load-all:disabled {
            border-color: #cbd5e1;
            color: #94a3b8;
            background-color: #f1f5f9;
            cursor: not-allowed;
        }

        /* تنسيق جدول الفواتير */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
            margin-top: 10px;
        }

        th {
            background-color: var(--primary-color);
            color: #ffffff;
            padding: 14px;
            font-weight: 500;
        }

        td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border-color);
            font-size: 15px;
        }

        tr:hover {
            background-color: #f1f5f9;
        }

        .text-center {
            text-align: center;
        }

        .no-data {
            padding: 40px;
            color: #94a3b8;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <h2><i class="fa-solid fa-file-invoice-dollar"></i> مراجعة وفواتير اليوم</h2>
        <!-- زر جلب جميع البيانات متاح عند الحاجة فقط -->
        <button id="btnLoadAllInvoices" class="btn-load-all">
            <i class="fa-solid fa-cloud-arrow-down"></i> تحميل جميع الفواتير السابقة
        </button>
    </div>

    <!-- جدول عرض الفواتير -->
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>رقم الفاتورة</th>
                    <th>التاريخ</th>
                    <th>إجمالي الفاتورة</th>
                    <th>عدد الكراتين</th> <!-- الكرتونه فى الكرتونه -->
                    <th>عدد الجراكن (القطع)</th> <!-- القطعه فى الجركن -->
                    <th>العمليات</th>
                </tr>
            </thead>
            <tbody id="invoicesTableBody">
                <tr>
                    <td colspan="6" class="text-center no-data">
                        <i class="fa-solid fa-spinner fa-spin"></i> جاري تحميل فواتير اليوم...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- إدراج مكتبات Firebase الحديثة (Modular v10) -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, query, orderByChild, startAt, endAt, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // إعدادات الـ Firebase الخاصة بمشروعك (استبدلها ببيانات مشروعك الحقيقية)
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    // تهيئة Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // عناصر الواجهة
    const invoicesTableBody = document.getElementById("invoicesTableBody");
    const btnLoadAllInvoices = document.getElementById("btnLoadAllInvoices");

    /**
     * دالة جلب فواتير اليوم الحالي فقط تلقائياً عند فتح الشاشة
     */
    async function loadTodayInvoices() {
        const startOfToday = new Date();
        startOfToday.setHours(0, 0, 0, 0);
        const startTimestamp = startOfToday.getTime();

        const endOfToday = new Date();
        endOfToday.setHours(23, 59, 59, 999);
        const endTimestamp = endOfToday.getTime();

        const invoicesRef = ref(db, 'invoices');
        
        const todayQuery = query(
            invoicesRef,
            orderByChild('invoiceDate'),
            startAt(startTimestamp),
            endAt(endTimestamp)
        );

        try {
            const snapshot = await get(todayQuery);
            if (snapshot.exists()) {
                renderInvoicesTable(snapshot.val());
            } else {
                invoicesTableBody.innerHTML = `<tr><td colspan="6" class="text-center no-data">لا توجد فواتير مسجلة اليوم حتى الآن.</td></tr>`;
            }
        } catch (error) {
            console.error("حدث خطأ أثناء جلب فواتير اليوم:", error);
            invoicesTableBody.innerHTML = `<tr><td colspan="6" class="text-center no-data" style="color: red;">فشل تحميل البيانات. تحقق من اتصال الشبكة وقواعد البيانات.</td></tr>`;
        }
    }

    /**
     * دالة ربط زر جلب كافة الفواتير السابقة من السيرفر
     */
    btnLoadAllInvoices.addEventListener("click", async () => {
        btnLoadAllInvoices.disabled = true;
        btnLoadAllInvoices.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> جاري جلب كافة الفواتير...`;
        
        invoicesTableBody.innerHTML = `<tr><td colspan="6" class="text-center no-data"><i class="fa-solid fa-spinner fa-spin"></i> جاري استدعاء الأرشيف بالكامل...</td></tr>`;
        
        const allInvoicesRef = ref(db, 'invoices');

        try {
            const snapshot = await get(allInvoicesRef);
            if (snapshot.exists()) {
                renderInvoicesTable(snapshot.val());
                btnLoadAllInvoices.innerHTML = `<i class="fa-solid fa-check"></i> تم تحميل الأرشيف بالكامل`;
            } else {
                alert("لا توجد فواتير مسجلة بالنظام مطلقاً.");
                btnLoadAllInvoices.disabled = false;
                btnLoadAllInvoices.innerHTML = `<i class="fa-solid fa-cloud-arrow-down"></i> تحميل جميع الفواتير السابقة`;
            }
        } catch (error) {
            console.error("خطأ في جلب كامل البيانات:", error);
            alert("حدث خطأ أثناء تحميل كامل البيانات.");
            btnLoadAllInvoices.disabled = false;
            btnLoadAllInvoices.innerHTML = `<i class="fa-solid fa-cloud-arrow-down"></i> تحميل جميع الفواتير السابقة`;
        }
    });

    /**
     * الدالة المسؤولة عن طباعة وتوزيع البيانات داخل الجدول
     * @param {Object} invoicesData - كائن يحتوي على الفواتير المسترجعة
     */
    function renderInvoicesTable(invoicesData) {
        invoicesTableBody.innerHTML = ""; // تفريغ الجدول أولاً
        
        Object.keys(invoicesData).forEach(key => {
            const invoice = invoicesData[key];
            
            // تحويل الـ Timestamp إلى تاريخ مقروء بشكل احترافي
            const formattedDate = new Date(invoice.invoiceDate).toLocaleDateString('ar-EG', {
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute:'2-digit'
            });

            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${invoice.invoiceNumber || key}</td>
                <td>${formattedDate}</td>
                <td><strong>${parseFloat(invoice.totalAmount || 0).toFixed(2)} ج.م</strong></td>
                <td>${invoice.cartonCount || 0}</td> <!-- الكرتونة في الكرتونة -->
                <td>${invoice.pieceCount || 0}</td>  <!-- القطعة في الجركن (تم تصحيح المتغير ليعبر عن القطع) -->
                <td>
                    <button onclick="viewInvoiceDetails('${key}')" style="background: none; border: none; color: var(--accent-color); cursor: pointer;">
                        <i class="fa-solid fa-eye"></i> عرض
                    </button>
                </td>
            `;
            invoicesTableBody.appendChild(row);
        });
    }

    // تشغيل جلب بيانات اليوم تلقائياً بمجرد اكتمال تحميل عناصر الصفحة
    document.addEventListener("DOMContentLoaded", loadTodayInvoices);

    // تعريف دالة العرض للاستخدام النافذ بالـ Window لتعمل مع الـ onClick الداخلي في الجدول
    window.viewInvoiceDetails = function(id) {
        console.log("عرض تفاصيل الفاتورة ذات المعرف:", id);
        // مكان مخصص لربط كود الفاتورة الحرارية 80mm عند الضغط على زر عرض
    };
</script>

</body>
</html>
