<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل المبيعات - شركة الزيادي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .table-responsive {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            text-align: center;
        }
        th, td {
            padding: 12px;
            border: 1px solid #e0e0e0;
        }
        th {
            background-color: #2c3e50;
            color: white;
            font-weight: 600;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 13px;
            font-weight: bold;
            margin: 2px;
            transition: 0.2s;
        }
        .btn-edit { background-color: #ff9800; color: white; }
        .btn-edit:hover { background-color: #e68a00; }
        .btn-print { background-color: #1e88e5; color: white; }
        .btn-print:hover { background-color: #1565c0; }
        .sync-badge {
            display: inline-block;
            padding: 5px 10px;
            background: #e8f5e9;
            color: #2e7d32;
            border-radius: 4px;
            font-size: 12px;
            margin-bottom: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>سجل المبيعات</h2>
    <div id="syncStatus" class="sync-badge">متصل ومحدث تلقائياً (الكاش نشط)</div>
    
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>مسلسل</th>
                    <th>التاريخ والوقت</th>
                    <th>العميل</th>
                    <th>الإجمالي</th>
                    <th>طريقة السداد</th>
                    <th>العمليات</th>
                </tr>
            </thead>
            <tbody id="invoicesTableBody">
                <tr>
                    <td colspan="6">جاري تحميل البيانات ومزامنة الكاش...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
        getFirestore, 
        collection, 
        query, 
        orderBy, 
        onSnapshot,
        enableIndexedDbPersistence 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_AUTH_DOMAIN",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_STORAGE_BUCKET",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    enableIndexedDbPersistence(db).catch((err) => {
        if (err.code == 'failed-precondition') {
            console.warn("المتصفح مفتوح في تبويبات متعددة، الكاش يعمل في التبويب الأول فقط.");
        } else if (err.code == 'unimplemented') {
            console.warn("المتصفح لا يدعم التخزين المؤقت المستمر.");
        }
    });

    let allInvoices = [];

    function listenToInvoices() {
        const q = query(collection(db, "invoices"), orderBy("date", "desc"));

        onSnapshot(q, { includeMetadataChanges: true }, (snapshot) => {
            allInvoices = [];
            
            snapshot.forEach((doc) => {
                const data = doc.data();
                
                let calculatedCash = 0;
                let calculatedWallet = 0;

                if (data.paymentMethod === 'نقدي') {
                    calculatedCash = Number(data.paidAmount || data.total || 0);
                } else if (data.paymentMethod === 'محفظة') {
                    calculatedWallet = Number(data.paidAmount || data.total || 0);
                } else if (data.paymentMethod === 'متعدد') {
                    calculatedCash = Number(data.cashAmount || 0);
                    calculatedWallet = Number(data.walletAmount || 0);
                }

                allInvoices.push({
                    id: doc.id,
                    ...data,
                    calculatedCash: calculatedCash,
                    calculatedWallet: calculatedWallet,
                    previousBalance: data.previousBalance || 0
                });
            });

            renderInvoicesTable();
            
            const syncStatus = document.getElementById('syncStatus');
            if (snapshot.metadata.fromCache) {
                syncStatus.innerText = "عرض من الكاش المحلي (أوفلاين)";
                syncStatus.style.background = "#fff3e0";
                syncStatus.style.color = "#e65100";
            } else {
                syncStatus.innerText = "متصل مباشر - الكاش محدث بالكامل";
                syncStatus.style.background = "#e8f5e9";
                syncStatus.style.color = "#2e7d32";
            }
        }, (error) => {
            console.error("خطأ في جلب المزامنة:", error);
        });
    }

    function renderInvoicesTable() {
        const tbody = document.getElementById('invoicesTableBody');
        if (allInvoices.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6">لا توجد فواتير مسجلة حالياً</td></tr>`;
            return;
        }

        tbody.innerHTML = allInvoices.map((inv, index) => {
            const clientName = inv.customerName || 'عميل نقدي';
            const displayDate = inv.date || '---';
            const paymentType = inv.paymentMethod || 'غير محدد';
            const totalAmount = Number(inv.total || 0).toFixed(2);

            return `
                <tr>
                    <td><b>${index + 1}</b></td>
                    <td style="direction: ltr;">${displayDate} ${inv.time || ''}</td>
                    <td>${clientName}</td>
                    <td style="font-weight: bold; color: #2e7d32;">${totalAmount}</td>
                    <td><span style="padding:4px 8px; background:#e3f2fd; color:#0d47a1; border-radius:4px; font-size:12px;">${paymentType}</span></td>
                    <td>
                        <button class="btn btn-edit" onclick="editInvoice('${inv.id}')">تعديل</button>
                        <button class="btn btn-print" onclick="printInvoice('${inv.id}')">طباعة 80mm</button>
                    </td>
                </tr>
            `;
        }).join('');
    }

    window.editInvoice = (id) => {
        const inv = allInvoices.find(i => i.id === id);
        if (!inv) return;

        const cashParam = inv.calculatedCash || 0;
        const walletParam = inv.calculatedWallet || 0;

        window.location.href = `sales-invoice.html?edit=${id}&allowDateEdit=true&cashAmount=${cashParam}&walletAmount=${walletParam}`;
    };

    window.printInvoice = (id) => {
        const inv = allInvoices.find(i => i.id === id);
        if (!inv) return;

        const clientName = inv.customerName || 'عميل نقدي';
        const totalPaid = (Number(inv.calculatedCash || 0) + Number(inv.calculatedWallet || 0)).toFixed(2);
        const previousBal = Number(inv.previousBalance || 0).toFixed(2);
        const totalRemaining = (Number(inv.previousBalance || 0) + Number(inv.remaining || 0)).toFixed(2);

        const itemsRows = (inv.items || []).map(item => `
            <tr>
                <td style="text-align: right; padding: 4px 0;">${item.name}</td>
                <td style="text-align: center; padding: 4px 0;">${item.qty}</td>
                <td style="text-align: left; padding: 4px 0;">${Number(item.price || 0).toFixed(2)}</td>
                <td style="text-align: left; padding: 4px 0; font-weight: bold;">${(Number(item.qty || 0) * Number(item.price || 0)).toFixed(2)}</td>
            </tr>
        `).join('');

        const win = window.open("", "_blank");
        win.document.write(`
            <!DOCTYPE html>
            <html lang="ar" dir="rtl">
            <head>
                <meta charset="UTF-8">
                <title>فاتورة - شركة الزيادي</title>
                <style>
                    @page { size: 80mm auto; margin: 0; }
                    body { width: 76mm; margin: 0 auto; padding: 5px 2mm; font-family: 'Cairo', sans-serif; font-size: 11px; line-height: 1.4; color: #000; }
                    .text-center { text-align: center; }
                    .header { border-bottom: 2px dashed #000; padding-bottom: 8px; margin-bottom: 8px; }
                    .header h4 { margin: 0; font-size: 16px; font-weight: 800; }
                    .invoice-title { margin-top: 5px; display: inline-block; border: 1px solid #000; padding: 1px 10px; font-weight: bold; }
                    .info-table { width: 100%; margin-bottom: 8px; font-size: 11px; }
                    .items-table { width: 100%; border-collapse: collapse; margin-bottom: 8px; font-size: 10.5px; }
                    .items-table th { border-bottom: 1px solid #000; border-top: 1px solid #000; padding: 4px 0; }
                    .items-table td { border-bottom: 1px dashed #eee; }
                    .totals-section { border-top: 1px dashed #000; padding-top: 4px; }
                    .flex-row { display: flex; justify-content: space-between; padding: 2px 0; }
                    .final-total { font-size: 13px; border-top: 1.5px dashed #000; padding-top: 4px; margin-top: 4px; font-weight: bold; }
                    .footer { text-align: center; margin-top: 15px; border-top: 1px dashed #000; padding-top: 6px; font-size: 10px; font-weight: bold; }
                </style>
            </head>
            <body>
                <div class="header text-center">
                    <h4>شركة الزيادي</h4>
                    <p>لزيوت وفلاتر السيارات</p>
                    <div class="invoice-title">فاتورة مبيعات</div>
                </div>
                <table class="info-table">
                    <tr><td><b>العميل:</b></td><td style="text-align: left;">${clientName}</td></tr>
                    <tr><td><b>التاريخ:</b></td><td style="text-align: left; direction: ltr;">${inv.date || ''} ${inv.time || ''}</td></tr>
                    <tr><td><b>طريقة السداد:</b></td><td style="text-align: left;">${inv.paymentMethod || 'غير محدد'}</td></tr>
                </table>
                <table class="items-table">
                    <thead>
                        <tr>
                            <th style="text-align: right; width: 45%;">الصنف</th>
                            <th style="text-align: center; width: 15%;">الكمية</th>
                            <th style="text-align: left; width: 20%;">السعر</th>
                            <th style="text-align: left; width: 20%;">الإجمالي</th>
                        </tr>
                    </thead>
                    <tbody>${itemsRows}</tbody>
                </table>
                <div class="totals-section">
                    <div class="flex-row"><span>إجمالي الفاتورة:</span><span>${(Number(inv.total) || 0).toFixed(2)}</span></div>
                    <div class="flex-row"><span>المسدد الشامل:</span><span>${totalPaid}</span></div>
                    <div class="flex-row"><span>حساب سابق للعميل:</span><span>${previousBal}</span></div>
                    <div class="flex-row final-total"><span>إجمالي المتبقي الآجل:</span><span>${totalRemaining}</span></div>
                </div>
                <div class="footer">شكراً لتعاملكم معنا ونتمنى لكم رحلة آمنة 🌹</div>
                <script>
                    window.onload = function() {
                        setTimeout(function(){ window.print(); window.close(); }, 150);
                    };
                <\/script>
            </body>
            </html>
        `);
        win.document.close();
    };

    listenToInvoices();
</script>

</body>
</html>
