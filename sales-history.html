<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل المبيعات - الزيادي لزيوت السيارات</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --accent: #0b5e3d; --header-bg: #0b5e3d; --bg-light: #f4f7f6; --text-primary: #1b2e26; --border: #dce3de; --white: #ffffff; }
        body { background: var(--bg-light); font-family: 'Cairo', sans-serif; color: var(--text-primary); padding-bottom: 60px; font-size: 0.85rem; }
        .header-nav { background: var(--header-bg); padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; color: white; position: sticky; top: 0; z-index: 1000; }
        .add-btn { background: rgba(255,255,255,0.2); width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; text-decoration: none; border: none; }
        .invoice-item { background: var(--white); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
        .detail-badge { font-size: 0.75rem; padding: 4px 8px; border-radius: 6px; background: #f0f4f2; display: inline-flex; align-items: center; gap: 5px; }
        .items-preview-table { width: 100%; margin-top: 8px; font-size: 0.78rem; border-collapse: collapse; }
        .items-preview-table th, .items-preview-table td { padding: 5px; border: 1px solid var(--border); text-align: center; }
        div[id^="details_box_"] { width: 100%; margin-top: 10px; background: #fff; border-top: 1px solid #eee; padding-top: 10px; }
    </style>
</head>
<body>

<div class="header-nav">
    <a href="index.html" class="add-btn"><i class="fas fa-arrow-right"></i></a>
    <h6 class="m-0 fw-bold">سجل المبيعات</h6>
    <div class="d-flex gap-2">
        <button class="add-btn" id="exportExcelBtn"><i class="fas fa-file-excel"></i></button>
        <a href="sales-invoice.html" class="add-btn"><i class="fas fa-plus"></i></a>
    </div>
</div>

<div class="container px-2 mt-2">
    <div id="invoicesList">
        <div class="text-center py-5"><i class="fas fa-spinner fa-spin"></i> جار التحميل...</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls", authDomain: "ahmedelzaiady.firebaseapp.com", projectId: "ahmedelzaiady", storageBucket: "ahmedelzaiady.firebasestorage.app", messagingSenderId: "300306825071", appId: "1:300306825071:web:0426ddde56280fa090329a" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let allInvoices = [];

    window.toggleDetails = (id) => {
        const element = document.getElementById(`details_box_${id}`);
        if (element) {
            element.style.display = (element.style.display === "none" || element.style.display === "") ? "block" : "none";
        }
    };

    window.renderInvoices = (invoices) => {
        const container = document.getElementById('invoicesList');
        container.innerHTML = invoices.map(inv => `
            <div class="invoice-item">
                <div class="d-flex justify-content-between align-items-start mb-2">
                    <div>
                        <h6 class="fw-bold mb-1">${inv.customerName || 'عميل نقدى'}</h6>
                        <span class="detail-badge">
                            <i class="far fa-calendar-alt"></i> ${inv.date || '---'} 
                            <i class="far fa-clock ms-2"></i> ${inv.time || '00:00'}
                        </span>
                    </div>
                    <button class="btn btn-sm btn-outline-dark" onclick="toggleDetails('${inv.id}')"><i class="fas fa-eye"></i></button>
                </div>
                <div id="details_box_${inv.id}" style="display:none;">
                    <table class="items-preview-table">
                        <thead><tr><th>الصنف</th><th>الكمية</th><th>السعر</th></tr></thead>
                        <tbody>
                            ${(inv.items || []).map(itm => `<tr><td>${itm.name}</td><td>${itm.qty}</td><td>${itm.price}</td></tr>`).join('')}
                        </tbody>
                    </table>
                </div>
            </div>
        `).join('');
    };

    async function loadData() {
        const invSnap = await getDocs(query(collection(db, "invoices"), orderBy("timestamp", "desc")));
        allInvoices = invSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        window.renderInvoices(allInvoices);
    }
    
    document.getElementById('exportExcelBtn').onclick = () => { /* منطق التصدير */ };
    loadData();
</script>
</body>
</html>
