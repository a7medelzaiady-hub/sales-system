<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل المبيعات - الزيادى لويوت السيارات </title>
    <!-- Google Fonts للخط الاحترافي -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="family">
    
    <style>
        :root {
            --bg-color: #f4f7fc;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
            
            /* ألوان الهوية البصرية اللطيفة */
            --primary: #3182ce;
            --success: #38a169;
            --warning: #dd6b20;
            --danger: #e53e3e;
            
            /* التدرجات اللمسية للبطاقات */
            --gradient-1: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-2: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            --gradient-3: linear-gradient(135deg, #ed8936 0%, #dd6b20 100%);
            --gradient-4: linear-gradient(135deg, #e53e3e 0%, #b33939 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .dashboard-container {
            width: 100%;
            max-width: 600px; /* مثالي لشاشات الموبايل */
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            margin-top: 10px;
        }

        .header h1 {
            font-size: 1.6rem;
            font-weight: 900;
            color: #1a202c;
            position: relative;
            display: inline-block;
            padding-bottom: 8px;
        }

        .header h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 25%;
            width: 50%;
            height: 4px;
            background: var(--gradient-1);
            border-radius: 10px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 18px;
            background-color: var(--primary);
            border-radius: 3px;
        }

        /* شبكة البطاقات المتجاوبة للموبايل */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 11fr); /* بطاقتين بجانب بعض في الموبايل بشكل متناسق */
            gap: 12px;
        }

        /* تصميم البطاقات الجمالي الجديد */
        .stat-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px 14px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(226, 232, 240, 0.8);
            position: relative;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .stat-card:active {
            transform: scale(0.98); /* تأثير ضغط لطيف باللمس */
        }

        /* خط ملون علوي لكل بطاقة لتمييز النوع */
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
        }

        .card-sales::before { background: var(--gradient-1); }
        .card-earnings::before { background: var(--gradient-2); }
        .card-expenses::before { background: var(--gradient-3); }
        .card-debt::before { background: var(--gradient-4); }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 1.35rem;
            font-weight: 700;
            color: #1a202c;
            word-break: break-all;
        }

        .currency {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-right: 2px;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        
        <div class="header">
            <h1>لوحة التحكم المالي</h1>
        </div>

        <!-- إحصائيات اليوم فقط -->
        <div class="section-title">إحصائيات اليوم</div>
        
        <div class="stats-grid">
            
            <!-- المبيعات -->
            <div class="stat-card card-sales">
                <div class="stat-label">مبيعات اليوم</div>
                <div class="stat-value" id="today-sales">0.00 <span class="currency">ج.م</span></div>
            </div>

            <!-- الأرباح -->
            <div class="stat-card card-earnings">
                <div class="stat-label">أرباح اليوم</div>
                <div class="stat-value" id="today-earnings">0.00 <span class="currency">ج.م</span></div>
            </div>

            <!-- المصروفات -->
            <div class="stat-card card-expenses">
                <div class="stat-label">مصروفات اليوم</div>
                <div class="stat-value" id="today-expenses">0.00 <span class="currency">ج.م</span></div>
            </div>

            <!-- الآجل / المتبقي -->
            <div class="stat-card card-debt">
                <div class="stat-label">الآجل اليومي</div>
                <div class="stat-value" id="today-debt">0.00 <span class="currency">ج.م</span></div>
            </div>

        </div>

    </div>

    <script>
        // هنا يتم ربط البيانات مع قاعدة البيانات الخاصة بك (Firebase مثلاً)
        // مثال للتأكد من عمل التنسيق بشكل سليم:
        // document.getElementById('today-sales').innerHTML = '1,550.00 <span class="currency">ج.م</span>';
    </script>
</body>
</html>
