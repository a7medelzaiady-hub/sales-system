<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل المبيعات - شركة الزيادي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --accent: #0b5e3d;        
            --header-bg: #0b5e3d;     
            --bg-light: #f4f7f6;      
            --text-primary: #1b2e26;   
            --text-secondary: #4a5568; 
            --border: #dce3de;        
            --white: #ffffff;
            --danger: #d90429;
            --success: #2d6a4f;
            --warning: #ffb703;
            --purple: #6f42c1;
            --card-radius: 14px;
            --input-radius: 10px;
        }
        
        body { 
            background: var(--bg-light); 
            font-family: 'Cairo', sans-serif; 
            color: var(--text-primary); 
            padding-bottom: 40px;
        }

        .header-nav { 
            background: var(--header-bg); 
            padding: 10px 14px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); 
            color: white; 
            position: sticky; 
            top: 0; 
            z-index: 1000;
            gap: 6px;
        }
        
        .nav-btn { 
            background: rgba(255,255,255,0.2); 
            width: 32px; 
            height: 32px; 
            border-radius: 8px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: white; 
            text-decoration: none; 
            transition: 0.2s;
            flex-shrink: 0;
        }
        .nav-btn:hover { background: rgba(255,255,255,0.3); color: white; }

        /* تنسيق الأزرار العلوية المدمجة في الهيدر بجانب العنوان */
        .header-actions-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-header-custom {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 5px 9px;
            border-radius: 7px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            border: none;
            color: white;
            transition: all 0.2s;
            text-decoration: none;
        }

        .btn-excel-top {
            background-color: #1d6f42;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .btn-excel-top:hover { background-color: #155231; }

        .btn-delete-top {
            background-color: rgba(217, 4, 41, 0.2);
            color: #ffcbd1;
            border: 1px solid rgba(217, 4, 41, 0.3);
        }
        .btn-delete-top:hover { background-color: rgba(217, 4, 41, 0.4); color: white; }

        .action-bar {
            background: var(--white);
            border-radius: var(--card-radius);
            padding: 10px;
            margin-top: 10px;
            border: 1px solid var(--border);
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        /* تنسيق خانات البحث المدمجة لتصبح بجانب بعضها بحجم صغير ومتناسق */
        .mini-search-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .form-control-sm {
            border: 1px solid var(--border) !important;
            border-radius: var(--input-radius) !important;
            font-size: 0.8rem !important;
            font-weight: 600;
            padding: 6px 10px;
            height: 36px;
            background-color: var(--white) !important;
            color: var(--text-primary) !important;
        }
        .form-control-sm:focus {
            border-color: var(--accent) !important;
            box-shadow: 0 0 0 3px rgba(11, 94, 61, 0.12);
        }

        .history-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--card-radius);
            padding: 12px;
            margin-top: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .inv-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed var(--border);
            padding-bottom: 8px;
            margin-bottom: 8px;
        }

        .badge-method {
            font-size: 0.65rem;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 700;
        }
        .bg-purple { background-color: var(--purple) !important; }

        .item-spec {
            font-size: 0.75rem;
            color: var(--text-secondary);
            background: #f8faf9;
            padding: 4px 8px;
            border-radius: 6px;
            margin-bottom: 4px;
        }

        .totals-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 4px;
            text-align: center;
            background: #f8faf9;
            padding: 8px;
            border-radius: 8px;
            margin-top: 8px;
            font-size: 0.75rem;
        }

        .card-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 10px;
            border-top: 1px solid #f1f1f1;
            padding-top: 8px;
        }

        .btn-card {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 5px 10px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<div class="header-nav">
    <div class="d-flex align-items-center gap-2">
        <a href="index.html" class="nav-btn">
            <i class="fas fa-arrow-right"></i>
        </a>
        <h6 class="m-0 fw-bold d-flex align-items-center gap-1" style="font-size: 0.85rem; white-space: nowrap;">
            <span>سجل المبيعات</span>
        </h6>
    </div>

    <!-- مجموعة الأزرار العلوية المدمجة في الهيدر تماماً بجانب كلمة السجل -->
    <div class="header-actions-group">
        <button class="btn-header-custom btn-excel-top" onclick="exportToExcel()" id="btnExcel">
            <i class="fas fa-file-excel"></i>
            <span>الإكسيل</span>
        </button>
        
        <button class="btn-header-custom btn-delete-top" onclick="clearAllCustomersData()" id="btnClearCustomers">
            <i class="fas fa-trash-alt"></i>
            <span>مسح العملاء</span>
        </button>
    </div>

    <a href="invoice.html" class="nav-btn">
        <i class="fas fa-plus"></i>
    </a>
</div>

<div class="container px-2">
    
    <div class="action-bar">
        <!-- خانات البحث المنسقة بجانب بعضها وحجمها صغير ومثالي للموبايل والويب -->
        <div class="mini-search-grid">
            <div>
                <input type="text" id="searchCustomer" class="form-control form-control-sm" placeholder="🔍 اسم العميل..." oninput="filterInvoices()">
            </div>
            <div>
                <input type="text" id="searchDate" class="form-control form-control-sm" placeholder="📅 التاريخ (يوم/شهر)..." oninput="filterInvoices()">
            </div>
        </div>
    </div>

    <!-- حاوية عرض الفواتير المحملة من السيرفر -->
    <div id="invoicesList">
        <div class="text-center py-5 text-muted" id="loadingState">
            <i class="fas fa-spinner fa-spin fa-2x mb-2 text-success"></i>
            <p class="small fw-bold">جاري تحميل سجل المبيعات المستقر...</p>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
        authDomain: "ahmedelzaiady.firebaseapp.com",
        projectId: "ahmedelzaiady",
        storageBucket: "ahmedelzaiady.firebasestorage.app",
        messagingSenderId: "300306825071",
        appId: "1:300306825071:web:0426ddde56280fa090329a",
        measurementId: "G-WE04GK5XZZ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let allInvoices = [];

    async function loadInvoices() {
        try {
            const q = query(collection(db, "invoices"), orderBy("timestamp", "desc"));
            const snapshot = await getDocs(q);
            allInvoices = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
            renderInvoices(allInvoices);
        } catch (e) {
            console.error(e);
            document.getElementById('invoicesList').innerHTML = `<div class="alert alert-danger text-center small p-2 m-2">حدث خطأ أثناء جلب البيانات</div>`;
        }
    }

    function renderInvoices(list) {
        const container = document.getElementById('invoicesList');
        if(list.length === 0) {
            container.innerHTML = `<div class="text-center py-4 text-muted small fw-bold">لا توجد فواتير مسجلة تطابق البحث</div>`;
            return;
        }

        container.innerHTML = list.map(inv => {
            let badgeClass = "bg-secondary text-white";
            if(inv.paymentMethod?.includes("نقدي")) {
                badgeClass = "bg-success text-white";
            } else if(inv.paymentMethod?.includes("محفظة")) {
                badgeClass = "bg-purple text-white";
            } else if(inv.paymentMethod?.includes("كاش ومحفظة")) {
                badgeClass = "bg-info text-dark";
            } else if(inv.paymentMethod?.includes("آجل")) {
                badgeClass = "bg-danger text-white";
            }

            const itemsStr = inv.items?.map(i => `${i.name} (${i.qty} ${i.unit === 'box' ? 'كرتونة' : 'قطعة'})`).join(' - ') || 'لا توجد أصناف';

            return `
                <div class="history-card">
                    <div class="inv-header">
                        <div>
                            <span class="fw-bold d-block" style="font-size:0.85rem;">${inv.customerName || 'عميل نقدي'}</span>
                            <small class="text-muted" style="font-size:0.65rem; direction:ltr; display:block; text-align:right;">${inv.time || ''}</small>
                        </div>
                        <span class="badge-method ${badgeClass}">${inv.paymentMethod || 'آجل'}</span>
                    </div>
                    
                    <div class="item-spec text-truncate">
                        <i class="fas fa-box text-muted me-1"></i> ${itemsStr}
                    </div>

                    ${inv.notes ? `<div class="p-1 px-2 rounded mb-1 bg-light text-danger fw-bold" style="font-size:0.68rem;"><i class="fas fa-info-circle me-1"></i> ${inv.notes}</div>` : ''}

                    <div class="totals-grid">
                        <div><span class="text-muted d-block" style="font-size:0.6rem;">الإجمالي</span><b class="text-dark">${Number(inv.total || 0).toFixed(2)}</b></div>
                        <div><span class="text-muted d-block" style="font-size:0.6rem;">المدفوع</span><b class="text-success">${Number(inv.paid || 0).toFixed(2)}</b></div>
                        <div><span class="text-muted d-block" style="font-size:0.6rem;">المتبقي</span><b class="text-danger">${Number(inv.remaining || 0).toFixed(2)}</b></div>
                    </div>

                    <div class="card-actions">
                        <button class="btn btn-card btn-outline-danger" onclick="deleteInvoice('${inv.id}')"><i class="fas fa-trash me-1"></i>حذف</button>
                        <button class="btn btn-card btn-primary" onclick="window.location.href='invoice.html?edit=${inv.id}'"><i class="fas fa-edit me-1"></i>تعديل الفاتورة</button>
                    </div>
                </div>
            `;
        }).join('');
    }

    window.filterInvoices = () => {
        const custTerm = document.getElementById('searchCustomer').value.toLowerCase().trim();
        const dateTerm = document.getElementById('searchDate').value.trim();

        const filtered = allInvoices.filter(inv => {
            const matchCust = (inv.customerName || '').toLowerCase().includes(custTerm);
            const matchDate = (inv.time || '').includes(dateTerm);
            return matchCust && matchDate;
        });

        renderInvoices(filtered);
    };

    window.deleteInvoice = async (id) => {
        if(!confirm("هل أنت متأكد من حذف هذه الفاتورة نهائياً وإعادتها للمخزن؟")) return;
        try {
            await deleteDoc(doc(db, "invoices", id));
            alert("تم حذف الفاتورة بنجاح");
            loadInvoices();
        } catch(e) { alert("خطأ في الحذف"); }
    };

    window.exportToExcel = () => {
        alert("جاري تحضير وتصدير كشف المبيعات الحالي إلى Excel...");
    };

    window.clearAllCustomersData = async () => {
        if(!confirm("تنبيه حرج جداً: هل أنت متأكد من مسح جميع بيانات العملاء من السيستم نهائياً؟ لا يمكن التراجع عن هذا الإجراء!")) return;
        try {
            const snap = await getDocs(collection(db, "customers"));
            for (const d of snap.docs) {
                await deleteDoc(doc(db, "customers", d.id));
            }
            alert("تم مسح كافة بيانات العملاء بنجاح من قاعدة البيانات.");
            localStorage.removeItem("cache_customers");
            location.reload();
        } catch (e) {
            alert("حدث خطأ أثناء مسح بيانات العملاء");
        }
    };

    loadInvoices();
</script>
</body>
</html>
