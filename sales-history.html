<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل المبيعات - الزيادي لزيوت السيارات</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --accent: #0b5e3d;
            --accent-light: #0e7a4f;
            --header-bg: linear-gradient(135deg, #0b5e3d 0%, #0a4a31 100%);
            --bg-light: #f3f6f5;
            --text-primary: #1b2e26;
            --text-secondary: #6b7a73;
            --border: #e4e9e6;
            --white: #ffffff;
            --danger: #d90429;
            --success: #2d6a4f;
            --warning: #e69500;
            --purple: #6f42c1;
            --card-radius: 14px;
            --input-radius: 12px;
            --shadow-sm: 0 1px 3px rgba(11,94,61,0.06);
            --shadow-md: 0 4px 14px rgba(11,94,61,0.08);
        }
        * { box-sizing: border-box; }
        body { background: var(--bg-light); font-family: 'Cairo', sans-serif; color: var(--text-primary); padding-bottom: 60px; font-size: 0.85rem; }

        .header-nav { background: var(--header-bg); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 3px 10px rgba(0,0,0,0.15); color: white; position: sticky; top: 0; z-index: 1000; }
        .add-btn { background: rgba(255,255,255,0.15); width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; text-decoration: none; font-size: 0.9rem; border: none; transition: all 0.2s; }
        .add-btn:hover { background: rgba(255,255,255,0.3); color: white; }
        .trash-nav-btn { background: rgba(217,4,41,0.85) !important; }
        
        .stats-section-title { font-size: 0.8rem; font-weight: 800; color: var(--accent); margin: 10px 0 8px 0; display: flex; align-items: center; gap: 6px; }
        .stat-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--card-radius); padding: 12px 6px; box-shadow: var(--shadow-sm); text-align: center; cursor: pointer; transition: all 0.2s; }
        .stat-card.active-filter { border: 2px solid var(--accent) !important; background: #eefaf1; }
        .stat-bar { position: absolute; top: 0; left: 0; right: 0; height: 4px; border-radius: 4px 4px 0 0; }
        .stat-label { font-size: 0.66rem; color: var(--text-secondary); font-weight: 700; }
        .stat-value { font-size: 0.95rem; font-weight: 800; margin-top: 2px; }

        .control-panel-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--card-radius); padding: 12px; margin-bottom: 14px; box-shadow: var(--shadow-sm); }
        .btn-fetch-all { background: #fff; color: var(--accent); border: 1.5px solid var(--accent); padding: 6px 12px; font-size: 0.75rem; font-weight: 700; border-radius: 9px; transition: all 0.2s; }
        .btn-fetch-all:hover { background: var(--accent); color: #fff; }

        .invoice-item { background: var(--white); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow-sm); }
        .meta-container { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
        .detail-badge { font-size: 0.74rem; padding: 4px 9px; border-radius: 7px; font-weight: 700; background: #f0f4f2; color: var(--text-secondary); }
        .pay-badge { font-size: 0.68rem; font-weight: 700; padding: 4px 10px; border-radius: 7px; }

        .financial-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; background: #f8faf9; padding: 10px; border-radius: 10px; margin-top: 10px; border: 1px dashed var(--border); }
        .fin-box { font-size: 0.74rem; font-weight: 700; color: var(--text-secondary); }
        .fin-box span { display: block; font-size: 0.92rem; margin-top: 2px; font-weight: 800; }

        .search-box, input[type="date"] { border: 1px solid var(--border); border-radius: var(--input-radius); padding: 9px 14px; font-weight: 600; font-size: 0.85rem; }
        .items-preview-table { width: 100%; margin-top: 10px; font-size: 0.78rem; border-collapse: collapse; }
        .items-preview-table th { background: #ebf9eb; padding: 6px; border: 1px solid var(--border); text-align: center; }
        .items-preview-table td { padding: 6px; border: 1px solid var(--border); text-align: center; }

        .filter-status-bar { display: none; background: #e9eef0; padding: 8px 14px; border-radius: 10px; font-size: 0.78rem; font-weight: 700; align-items: center; justify-content: space-between; }
        .custom-popup-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.55); z-index: 10000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(3px); }
        .custom-popup-box { background: white; width: 90%; max-width: 380px; padding: 24px; border-radius: 18px; text-align: center; box-shadow: 0 14px 30px rgba(0,0,0,0.25); }

        .invoice-actions-group { display: flex; gap: 5px; justify-content: flex-end; margin-top: 8px; }
        .invoice-actions-group .btn { font-size: 0.72rem; padding: 5px 7px; border-radius: 8px; height: 30px; }
    </style>
</head>
<body>

<div id="content-to-export">
    <div class="header-nav">
        <a href="index.html" class="add-btn"><i class="fas fa-arrow-right"></i></a>
        <h6 class="m-0 fw-bold"><i class="fas fa-history me-1"></i> سجل المبيعات</h6>
        <div class="d-flex gap-2">
            <button class="add-btn" id="exportExcelBtn" title="تصدير إكسيل"><i class="fas fa-file-excel"></i></button>
            <a href="sales-invoice.html" class="add-btn"><i class="fas fa-plus"></i></a>
        </div>
    </div>

    <div class="container px-2 mt-1">
        <div class="control-panel-card mt-3">
            <button id="loadAllArchiveBtn" class="btn-fetch-all">جلب كل الفواتير</button>
            <button id="refreshBtn" class="btn-fetch-all">تحديث</button>
        </div>

        <div class="stats-section-title" id="todayStatsTitle"><i class="fas fa-calendar-day"></i> إحصائيات اليوم</div>
        <div class="row g-2 mb-3">
            <div class="col-3"><div class="stat-card" onclick="filterByStat('today-cash', this)"><div class="stat-label">نقدى</div><div class="stat-value" id="todayCash">0.0</div></div></div>
            <div class="col-3"><div class="stat-card" onclick="filterByStat('today-wallet', this)"><div class="stat-label">محفظه</div><div class="stat-value" id="todayWallet">0.0</div></div></div>
            <div class="col-3"><div class="stat-card" onclick="filterByStat('today-remaining', this)"><div class="stat-label">آجل</div><div class="stat-value" id="todayRemaining">0.0</div></div></div>
            <div class="col-3"><div class="stat-card" onclick="filterByStat('today-total', this)"><div class="stat-label">إجمالى</div><div class="stat-value" id="todayTotalSales">0.0</div></div></div>
        </div>

        <div class="filter-status-bar mb-3" id="filterStatusBar">
            <span id="filterStatusText"></span>
            <button class="btn btn-sm btn-dark" onclick="resetStatFilter()">عرض الكل</button>
        </div>

        <input type="text" id="searchInput" class="form-control search-box mb-2" placeholder="بحث..." oninput="filterInvoices()">
        <input type="date" id="dateFilterInput" class="form-control mb-3" onchange="window.handleDateFilterChange()">

        <div id="invoicesList"></div>
    </div>
</div>

<div id="thermalPrintSection"></div>

<div id="customGlobalModal" class="custom-popup-overlay" style="display: none;">
    <div class="custom-popup-box">
        <div id="customModalIcon"></div>
        <h6 id="customModalTitle" class="fw-bold"></h6>
        <div id="customModalBody"></div>
        <input type="text" id="customModalInput" class="form-control mb-3" style="display:none;">
        <div class="d-flex gap-2 justify-content-center" id="customModalActions"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, updateDoc, doc, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
        authDomain: "ahmedelzaiady.firebaseapp.com",
        projectId: "ahmedelzaiady",
        storageBucket: "ahmedelzaiady.firebasestorage.app",
        messagingSenderId: "300306825071",
        appId: "1:300306825071:web:0426ddde56280fa090329a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let allInvoices = [];

    // دالة تصدير الإكسيل المحدثة
    document.getElementById('exportExcelBtn').onclick = () => {
        if (!allInvoices.length) return alert("لا توجد بيانات");

        let excelRows = [];
        allInvoices.forEach(inv => {
            const invDate = inv.date || "غير محدد";
            const customerName = inv.customerName || 'النقدي';
            
            // إضافة الأصناف
            if (inv.items) {
                inv.items.forEach(itm => {
                    let isJarkan = (itm.name || "").includes("جركن") || (itm.name || "").includes("جركان");
                    excelRows.push({
                        "التاريخ": invDate,
                        "العميل": customerName,
                        "الصنف": itm.name,
                        "عدد كرتونة": isJarkan ? 0 : itm.qty,
                        "سعر الكرتونة": isJarkan ? 0 : itm.price,
                        "عدد جركن": isJarkan ? itm.qty : 0,
                        "سعر جركن": isJarkan ? itm.price : 0
                    });
                });
            }
            // سطر السداد
            excelRows.push({
                "التاريخ": invDate,
                "العميل": customerName,
                "الصنف": "--- سداد نقدي ---",
                "عدد كرتونة": 0, "سعر الكرتونة": 0, "عدد جركن": 0, "سعر جركن": 0,
                "إجمالي المسدد": (Number(inv.calculatedCash) || 0) + (Number(inv.calculatedWallet) || 0)
            });
        });

        const ws = XLSX.utils.json_to_sheet(excelRows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "المبيعات");
        XLSX.writeFile(wb, "سجل_المبيعات_التفصيلي.xlsx");
    };

    // [باقي الدوال الخاصة بك تبقى كما هي]
    // يرجى الحفاظ على الدوال (loadData, renderInvoices, etc.) الموجودة في الكود الأصلي الخاص بك
    async function loadData() { /* كود التحميل الأصلي */ }
    loadData();
</script>
</body>
</html>
