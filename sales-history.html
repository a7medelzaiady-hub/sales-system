<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل المبيعات - الزيادي لزيوت السيارات</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --accent: #0b5e3d;
            --accent-light: #0e7a4f;
            --header-bg: linear-gradient(135deg, #0b5e3d 0%, #0a4a31 100%);
            --bg-light: #f3f6f5;
            --text-primary: #1b2e26;
            --text-secondary: #6b7a73;
            --border: #e4e9e6;
            --white: #ffffff;
            --danger: #d90429;
            --success: #2d6a4f;
            --warning: #e69500;
            --purple: #6f42c1;
            --card-radius: 14px;
            --input-radius: 12px;
            --shadow-sm: 0 1px 3px rgba(11,94,61,0.06);
            --shadow-md: 0 4px 14px rgba(11,94,61,0.08);
        }
        * { box-sizing: border-box; }
        body {
            background: var(--bg-light);
            font-family: 'Cairo', sans-serif;
            color: var(--text-primary);
            padding-bottom: 60px;
            font-size: 0.85rem;
        }

        .header-nav {
            background: var(--header-bg);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
            color: white;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .add-btn {
            background: rgba(255,255,255,0.15);
            width: 34px; height: 34px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            color: white; text-decoration: none; font-size: 0.9rem;
            border: none;
            transition: all 0.2s;
        }
        .add-btn:hover { background: rgba(255,255,255,0.3); color: white; transform: translateY(-1px); }
        .trash-nav-btn { background: rgba(217,4,41,0.85) !important; }
        
        .stats-section-title { font-size: 0.8rem; font-weight: 800; color: var(--accent); margin: 10px 0 8px 0; display: flex; align-items: center; gap: 6px; }
        .stat-card {
            background: var(--white); border: 1px solid var(--border);
            border-radius: var(--card-radius); padding: 12px 6px;
            box-shadow: var(--shadow-sm); text-align: center;
            position: relative; overflow: hidden; cursor: pointer;
            transition: all 0.2s ease;
        }
        .stat-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--accent); }
        .stat-card.active-filter { border: 2px solid var(--accent) !important; background: #eefaf1; }
        .stat-bar { position: absolute; top: 0; left: 0; right: 0; height: 4px; border-radius: 4px 4px 0 0; }
        .stat-label { font-size: 0.66rem; color: var(--text-secondary); font-weight: 700; }
        .stat-value { font-size: 0.95rem; font-weight: 800; margin-top: 2px; }

        .control-panel-card {
            background: var(--white); border: 1px solid var(--border);
            border-radius: var(--card-radius); padding: 12px;
            margin-bottom: 14px; box-shadow: var(--shadow-sm);
        }
        .btn-fetch-all {
            background: #fff; color: var(--accent); border: 1.5px solid var(--accent);
            padding: 6px 12px; font-size: 0.75rem; font-weight: 700;
            border-radius: 9px; transition: all 0.2s ease;
            display: inline-flex; align-items: center; gap: 5px;
        }
        .btn-fetch-all:hover { background: var(--accent); color: #fff; }

        .invoice-item {
            background: var(--white); border: 1px solid var(--border);
            border-radius: 16px; padding: 16px; margin-bottom: 14px;
            box-shadow: var(--shadow-sm); transition: box-shadow 0.2s;
        }
        .invoice-item:hover { box-shadow: var(--shadow-md); }
        .invoice-item.no-date { border-right: 4px solid var(--danger); }

        .meta-container { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
        .detail-badge {
            font-size: 0.74rem; padding: 4px 9px; border-radius: 7px; font-weight: 700;
            background: #f0f4f2; color: var(--text-secondary);
            display: inline-flex; align-items: center; gap: 5px; direction: ltr; margin: 0;
        }
        .pay-badge { font-size: 0.68rem; font-weight: 700; padding: 4px 10px; border-radius: 7px; }

        .financial-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
            background: #f8faf9; padding: 10px; border-radius: 10px;
            margin-top: 10px; border: 1px dashed var(--border);
        }
        .fin-box { font-size: 0.74rem; font-weight: 700; color: var(--text-secondary); }
        .fin-box span { display: block; font-size: 0.92rem; margin-top: 2px; font-weight: 800; }

        .search-box, input[type="date"] {
            border: 1px solid var(--border); border-radius: var(--input-radius);
            padding: 9px 14px; font-weight: 600; font-size: 0.85rem;
            font-family: 'Cairo', sans-serif; background: var(--white);
        }

        .items-preview-table { width: 100%; margin-top: 10px; font-size: 0.78rem; border-collapse: collapse; }
        .items-preview-table th { background: #ebf9eb; padding: 6px; border: 1px solid var(--border); font-weight: 700; text-align: center; }
        .items-preview-table td { padding: 6px; border: 1px solid var(--border); text-align: center; font-weight: 600; }

        .filter-status-bar {
            display: none; background: #e9eef0; padding: 8px 14px; border-radius: 10px;
            font-size: 0.78rem; font-weight: 700; align-items: center; justify-content: space-between;
            border: 1px solid var(--border);
        }

        .custom-popup-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.55); z-index: 10000; display: flex;
            align-items: center; justify-content: center; backdrop-filter: blur(3px);
        }
        .custom-popup-box {
            background: white; width: 90%; max-width: 380px; padding: 24px;
            border-radius: 18px; text-align: center; font-family: 'Cairo';
            box-shadow: 0 14px 30px rgba(0,0,0,0.25);
        }

        .invoice-actions-group { display: flex; flex-wrap: nowrap; gap: 5px; justify-content: flex-end; align-items: center; margin-top: 8px; }
        .invoice-actions-group .btn {
            font-family: 'Cairo', sans-serif; font-size: 0.72rem; font-weight: 700;
            padding: 5px 7px; border-radius: 8px; display: inline-flex;
            align-items: center; gap: 3px; white-space: nowrap; height: 30px;
        }

        .empty-state { text-align: center; padding: 50px 10px; color: var(--text-secondary); }
        .empty-state i { color: #c9d4cf; }

        @media print {
            body { background: white; color: black; padding: 0; margin: 0; }
            #content-to-export, .header-nav, .control-panel-card, .stats-section-title, .row, .filter-status-bar, #customGlobalModal, .invoice-item { display: none !important; }
            #thermalPrintSection { display: block !important; width: 80mm; max-width: 80mm; padding: 4mm 2mm; margin: 0 auto; direction: rtl; font-family: 'Cairo', sans-serif; }
        }
    </style>
</head>
<body>

<div id="content-to-export">
    <div class="header-nav">
        <a href="index.html" class="add-btn"><i class="fas fa-arrow-right"></i></a>
        <h6 class="m-0 fw-bold" style="font-size: 0.95rem;"><i class="fas fa-history me-1"></i> سجل المبيعات</h6>
        <div class="d-flex gap-2">
            <a href="trashi.html" class="add-btn trash-nav-btn" title="فتح سلة المحذوفات"><i class="fas fa-trash-alt"></i></a>
            <button class="add-btn" id="exportExcelBtn" title="تصدير كل الأرشيف إكسيل"><i class="fas fa-file-excel"></i></button>
            <a href="sales-invoice.html" class="add-btn"><i class="fas fa-plus"></i></a>
        </div>
    </div>

    <div class="container px-2 mt-1">
        <div class="control-panel-card mt-3">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                <button id="loadAllArchiveBtn" class="btn-fetch-all">
                    <i class="fas fa-cloud-download-alt"></i> جلب كل الفواتير السابقة
                </button>
                <button id="refreshBtn" class="btn-fetch-all" style="border-color: var(--text-secondary); color: var(--text-secondary);">
                    <i class="fas fa-sync-alt"></i> تحديث
                </button>
                <button class="btn btn-danger btn-sm fw-bold px-3" id="deleteAllCustomersBtn" style="font-size: 0.75rem; border-radius: 9px; height: 33px; display: inline-flex; align-items: center; gap: 4px;">
                    <i class="fas fa-trash-can"></i> تصفير النظام للسلة
                </button>
            </div>
        </div>

        <div class="stats-section-title" id="todayStatsTitle"><i class="fas fa-calendar-day"></i> إحصائيات اليوم</div>

        <div class="row g-2 mb-3">
            <div class="col-3">
                <div class="stat-card" onclick="filterByStat('today-cash', this)">
                    <div class="stat-bar" style="background: var(--success);"></div>
                    <div class="stat-label text-truncate">نقدى اليوم</div>
                    <div class="stat-value text-success text-truncate" id="todayCash">0.0</div>
                </div>
            </div>
            <div class="col-3">
                <div class="stat-card" onclick="filterByStat('today-wallet', this)">
                    <div class="stat-bar" style="background: var(--purple);"></div>
                    <div class="stat-label text-truncate">محفظه اليوم</div>
                    <div class="stat-value text-primary text-truncate" id="todayWallet">0.0</div>
                </div>
            </div>
            <div class="col-3">
                <div class="stat-card" onclick="filterByStat('today-remaining', this)">
                    <div class="stat-bar" style="background: var(--warning);"></div>
                    <div class="stat-label text-truncate">آجل اليوم</div>
                    <div class="stat-value text-truncate" style="color: var(--warning);" id="todayRemaining">0.0</div>
                </div>
            </div>
            <div class="col-3">
                <div class="stat-card" onclick="filterByStat('today-total', this)">
                    <div class="stat-bar" style="background: #212529;"></div>
                    <div class="stat-label text-truncate">مبيعات اليوم</div>
                    <div class="stat-value text-dark text-truncate" id="todayTotalSales">0.0</div>
                </div>
            </div>
        </div>

        <div class="filter-status-bar mb-3" id="filterStatusBar">
            <span id="filterStatusText">عرض فلاتر مخصصة</span>
            <button class="btn btn-sm btn-dark py-0" onclick="resetStatFilter()" style="font-size:0.7rem; font-family: 'Cairo'; border-radius: 7px;">عرض الكل</button>
        </div>

        <div class="row g-2 mb-3 align-items-end">
            <div class="col-6">
                <input type="text" id="searchInput" class="form-control search-box h-100" placeholder="البحث باسم العميل أو السداد..." oninput="filterInvoices()">
            </div>
            <div class="col-6">
                <input type="date" id="dateFilterInput" class="form-control h-100" onchange="window.handleDateFilterChange()">
            </div>
        </div>

        <div id="invoicesList"></div>
    </div>
</div>

<div id="thermalPrintSection"></div>

<div id="customGlobalModal" class="custom-popup-overlay" style="display: none;">
    <div class="custom-popup-box" style="max-width: 420px;">
        <div id="customModalIcon" style="width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 14px;"></div>
        <h6 class="fw-bold mb-2" id="customModalTitle" style="font-size: 1rem;">تنبيه النظام</h6>
        <div id="customModalBody" style="font-size: 0.82rem; color: #4a5568; margin-bottom: 18px; text-align: right; white-space: pre-line; line-height: 1.7; max-height: 300px; overflow-y: auto; padding: 5px;"></div>
        <input type="text" id="customModalInput" class="form-control text-center mb-3 fw-bold" style="display:none; font-family:'Cairo'; font-size:0.9rem; border-radius: 10px;" placeholder="اكتب كلمة التأكيد هنا...">
        <div class="d-flex gap-2 justify-content-center" id="customModalActions"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, updateDoc, doc, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
        authDomain: "ahmedelzaiady.firebaseapp.com",
        projectId: "ahmedelzaiady",
        storageBucket: "ahmedelzaiady.firebasestorage.app",
        messagingSenderId: "300306825071",
        appId: "1:300306825071:web:0426ddde56280fa090329a",
        measurementId: "G-WE04GK5XZZ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allInvoices = [];
    // [باقي الدوال الأساسية من كودك الأصلي تبقى كما هي هنا...]
    
    // الدالة المعدلة بالكامل أدناه:

    document.getElementById('exportExcelBtn').onclick = () => {
        if (!allInvoices.length) {
            alert("لا توجد بيانات للتصدير");
            return;
        }

        let excelRows = [];

        allInvoices.forEach(inv => {
            const invDate = parseInvoiceDate(inv);
            const customerName = inv.customerName || 'عميل نقدي';
            
            // 1. إضافة الأصناف المبيعة (البيع)
            if (inv.items && inv.items.length > 0) {
                inv.items.forEach(itm => {
                    let qtyCarton = 0;
                    let qtyJarkan = 0;
                    const itemName = itm.name || "";
                    
                    // المنطق: إذا احتوى الاسم على "جركن" يذهب لعمود الجركن، وإلا كرتونة
                    if (itemName.includes("جركن") || itemName.includes("جركان")) {
                        qtyJarkan = Number(itm.qty) || 0;
                    } else {
                        qtyCarton = Number(itm.qty) || 0;
                    }

                    excelRows.push({
                        "التاريخ": invDate,
                        "الحركة": "بيع",
                        "اسم العميل": customerName,
                        "الصنف": itemName,
                        "عدد جركن": qtyJarkan,
                        "عدد كرتونة": qtyCarton,
                        "السعر": Number(itm.price) || 0
                    });
                });
            }

            // 2. إضافة حركات السداد (سداد منه نقدى / سداد منه محفظه)
            const cPaid = inv.calculatedCash || 0;
            const wPaid = inv.calculatedWallet || 0;

            if (cPaid > 0) {
                excelRows.push({
                    "التاريخ": invDate,
                    "الحركة": "سداد منه نقدى",
                    "اسم العميل": customerName,
                    "الصنف": "-",
                    "عدد جركن": 0,
                    "عدد كرتونة": 0,
                    "السعر": cPaid
                });
            }
            
            if (wPaid > 0) {
                excelRows.push({
                    "التاريخ": invDate,
                    "الحركة": "سداد منه محفظه",
                    "اسم العميل": customerName,
                    "الصنف": "-",
                    "عدد جركن": 0,
                    "عدد كرتونة": 0,
                    "السعر": wPaid
                });
            }
        });

        // إنشاء ملف الإكسيل
        const ws = XLSX.utils.json_to_sheet(excelRows);
        ws['!dir'] = "rtl";
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "المبيعات والأرشيف");
        XLSX.writeFile(wb, "سجل_المبيعات_التفصيلي.xlsx");
    };

    // [باقي الكود الأصلي لـ renderInvoices, loadData, الخ...]
</script>
</body>
</html>
