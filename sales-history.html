<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل المبيعات الموحد - الزيادي لزيوت السيارات</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght=400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- مكتبة SheetJS لتصدير الإكسيل بدقة -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <style>
        :root { --accent: #0b5e3d; --header-bg: #0b5e3d; --bg-light: #f4f7f6; --text-primary: #1b2e26; --border: #dce3de; }
        body { background: var(--bg-light); font-family: 'Cairo', sans-serif; color: var(--text-primary); font-size: 0.85rem; }
        .header-nav { background: var(--header-bg); padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; color: white; }
        .back-btn { background: rgba(255,255,255,0.2); width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; text-decoration: none; }
        .card-custom { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-top: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
        .table th { background-color: #f1f5f2; color: #1b2e26; text-align: center; font-weight: 700; vertical-align: middle; }
        .table td { text-align: center; vertical-align: middle; font-weight: 600; }
    </style>
</head>
<body>

<div class="header-nav">
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-right"></i></a>
    <h6 class="m-0 fw-bold"><i class="fas fa-history me-1"></i> سجل المبيعات وحركة الفواتير</h6>
    <button class="btn btn-sm btn-light fw-bold text-success" onclick="exportToExcel()"><i class="fas fa-file-excel me-1"></i> تصدير إكسيل</button>
</div>

<div class="container-fluid px-2">
    <!-- فلاتر البحث -->
    <div class="card-custom">
        <div class="row g-2">
            <div class="col-6">
                <input type="text" id="searchClient" class="form-control" placeholder="بحث باسم العميل..." oninput="filterInvoices()">
            </div>
            <div class="col-6">
                <input type="date" id="searchDate" class="form-control" onchange="filterInvoices()">
            </div>
        </div>
    </div>

    <!-- جدول الفواتير الرئيسي -->
    <div class="card-custom p-2 overflow-auto">
        <table class="table table-bordered table-striped m-0" style="min-width: 600px;">
            <thead>
                <tr>
                    <th>التاريخ</th>
                    <th>العميل</th>
                    <th>طريقة السداد</th>
                    <th>الإجمالي</th>
                    <th>إجراءات</th>
                </tr>
            </thead>
            <tbody id="invoicesTableBody">
                <!-- يتم تحميل الفواتير هنا برمجياً -->
            </tbody>
        </table>
    </div>
</div>

<!-- نافذة عرض تفاصيل الفاتورة (Modal) وبها التقسيم الرباعي المصلح -->
<div class="modal fade" id="detailsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-light">
                <h6 class="modal-title fw-bold" id="modalTitle">تفاصيل الفاتورة</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-2">
                <table class="table table-sm table-bordered m-0">
                    <thead>
                        <tr>
                            <th rowspan="2" class="align-middle">اسم الصنف</th>
                            <th colspan="2">الجركن / القطعة</th>
                            <th colspan="2">الكرتونة</th>
                        </tr>
                        <tr>
                            <th>الكمية</th>
                            <th>السعر</th>
                            <th>الكمية</th>
                            <th>السعر</th>
                        </tr>
                    </thead>
                    <tbody id="modalItemsBody">
                        <!-- تظهر الأصناف مفرزة هنا بالشعرة -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
        authDomain: "ahmedelzaiady.firebaseapp.com",
        projectId: "ahmedelzaiady",
        storageBucket: "ahmedelzaiady.firebasestorage.app",
        messagingSenderId: "300306825071",
        appId: "1:300306825071:web:0426ddde56280fa090329a",
        measurementId: "G-WE04GK5XZZ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allInvoices = [];

    async function loadInvoices() {
        try {
            const q = query(collection(db, "invoices"), orderBy("timestamp", "desc"));
            const snap = await getDocs(q);
            allInvoices = [];
            snap.forEach(doc => {
                allInvoices.push({ id: doc.id, ...doc.data() });
            });
            renderTable(allInvoices);
        } catch (e) {
            console.error("Error loading invoices: ", e);
        }
    }

    function renderTable(invoices) {
        const tbody = document.getElementById('invoicesTableBody');
        tbody.innerHTML = invoices.map(inv => `
            <tr>
                <td><small>${inv.date}<br>${inv.time || ''}</small></td>
                <td>${inv.customerName || 'عميل نقدي'}</td>
                <td><span class="badge ${inv.paymentMethod==='آجل'?'bg-danger':'bg-success'}">${inv.paymentMethod}</span></td>
                <td class="text-success fw-bold">${Number(inv.total).toFixed(2)}</td>
                <td>
                    <button class="btn btn-sm btn-dark px-2 py-1" onclick="showDetails('${inv.id}')"><i class="fas fa-eye"></i></button>
                </td>
            </tr>
        `).join('');
    }

    window.filterInvoices = () => {
        const nameTerm = document.getElementById('searchClient').value.toLowerCase().trim();
        const dateTerm = document.getElementById('searchDate').value;

        let filtered = allInvoices;
        if (nameTerm) {
            filtered = filtered.filter(i => i.customerName && i.customerName.toLowerCase().includes(nameTerm));
        }
        if (dateTerm) {
            filtered = filtered.filter(i => i.date === dateTerm);
        }
        renderTable(filtered);
    };

    // ⚡ دالة عرض تفاصيل الفاتورة مع فرز (القطعة/الجركن) و (الكرتونة) بدقة متناهية
    window.showDetails = (id) => {
        const inv = allInvoices.find(i => i.id === id);
        if (!inv) return;

        document.getElementById('modalTitle').innerText = `تفاصيل فاتورة: ${inv.customerName || 'عميل نقدي'} (${inv.date})`;
        const tbody = document.getElementById('modalItemsBody');
        tbody.innerHTML = '';

        if (inv.items && Array.isArray(inv.items)) {
            inv.items.forEach(item => {
                let qtyJarkan = '', priceJarkan = '';
                let qtyCarton = '', priceCarton = '';

                // الفحص الذكي بناءً على اسم الصنف كما طلبت
                if (item.name.includes("كرتونه") || item.name.includes("كرتونة")) {
                    qtyCarton = item.qtyCarton || item.qty || 0;
                    priceCarton = Number(item.priceCarton || item.price || 0).toFixed(2);
                } else {
                    // قطعة أو جركن أو زيت عادي ينزل في عمود الجركن/القطعة
                    qtyJarkan = item.qtyJarkan || item.qty || 0;
                    priceJarkan = Number(item.priceJarkan || item.price || 0).toFixed(2);
                }

                tbody.innerHTML += `
                    <tr>
                        <td class="text-start fw-bold">${item.name}</td>
                        <td class="text-primary">${qtyJarkan}</td>
                        <td class="text-primary">${priceJarkan}</td>
                        <td class="text-success">${qtyCarton}</td>
                        <td class="text-success">${priceCarton}</td>
                    </tr>
                `;
            });
        }

        const myModal = new bootstrap.Modal(document.getElementById('detailsModal'));
        myModal.show();
    };

    // ⚡ دالة تصدير الإكسيل الكبرى المصلحة والمقسمة للأعمدة الأربعة المطلوبة
    window.exportToExcel = () => {
        if (allInvoices.length === 0) {
            alert("لا توجد بيانات لتصديرها!");
            return;
        }

        // إعداد الهيكل الرئيسي لجدول الإكسيل المفرز بالشعرة
        let excelRows = [
            ["سجل المبيعات وحركة الفواتير المفرزة - الزيادي لزيوت السيارات"],
            [],
            ["التاريخ", "اسم العميل", "طريقة السداد", "اسم الصنف", "عدد جركن/قطعة", "سعر جركن/قطعة", "عدد كرتونة", "سعر الكرتونة", "إجمالي الفاتورة"]
        ];

        allInvoices.forEach(inv => {
            if (inv.items && Array.isArray(inv.items)) {
                inv.items.forEach((item, index) => {
                    let qtyJarkan = 0, priceJarkan = 0;
                    let qtyCarton = 0, priceCarton = 0;

                    // تطبيق نفس قاعدة الفرز الذكية العكسية داخل ملف الإكسيل
                    if (item.name.includes("كرتونه") || item.name.includes("كرتونة")) {
                        qtyCarton = item.qtyCarton || item.qty || 0;
                        priceCarton = item.priceCarton || item.price || 0;
                    } else {
                        qtyJarkan = item.qtyJarkan || item.qty || 0;
                        priceJarkan = item.priceJarkan || item.price || 0;
                    }

                    excelRows.push([
                        index === 0 ? inv.date : "", 
                        index === 0 ? (inv.customerName || 'عميل نقدي') : "",
                        index === 0 ? inv.paymentMethod : "",
                        item.name,
                        qtyJarkan || "",
                        priceJarkan || "",
                        qtyCarton || "",
                        priceCarton || "",
                        index === 0 ? inv.total : ""
                    ]);
                });
            }
        });

        const workbook = XLSX.utils.book_new();
        const worksheet = XLSX.utils.aoa_to_sheet(excelRows);
        
        // ضبط اتجاه الصفحة ليكون من اليمين لليسار في الإكسيل بشكل منسق
        worksheet['!dir'] = "rtl";
        
        XLSX.utils.book_append_sheet(workbook, worksheet, "سجل المبيعات");
        XLSX.writeFile(workbook, `سجل_مبيعات_الزيادي_${new Date().toISOString().slice(0,10)}.xlsx`);
    };

    loadInvoices();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
