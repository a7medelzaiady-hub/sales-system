<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل المبيعات الذكي - شركة الزيادي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        :root { 
            --deep-olive: #0b291b;    /* زيتي داكن عميق للمنشأ */
            --ai-green: #10b981;      /* أخضر ذكي مضيء */
            --olive-accent: #1e4632;  /* زيتي متوسط للبطاقات */
            --bg-glass: rgba(255, 255, 255, 0.85);
            --bg-cyber: #f0f4f2;       /* خلفية فاتحة مريحة ونظيفة */
            --text-main: #0f2419;
            --text-muted: #52665c;
            --danger-glow: #ef4444;
            --success-glow: #10b981;
            --radius-cyber: 16px;
            --shadow-sm: 0 4px 12px rgba(11, 41, 27, 0.03);
            --shadow-md: 0 10px 25px rgba(16, 185, 129, 0.08);
        }

        body { 
            background: var(--bg-cyber); 
            font-family: 'Cairo', sans-serif; 
            color: var(--text-main); 
            padding-bottom: 60px; 
            overflow-x: hidden; 
        }

        /* --- نبيطة الهيدر الذكي --- */
        .header-nav { 
            background: linear-gradient(135deg, var(--deep-olive), var(--olive-accent));
            padding: 16px 20px; 
            color: white;
            display: flex; justify-content: space-between; align-items: center; 
            position: sticky; top: 0; z-index: 1000; 
            box-shadow: 0 4px 20px rgba(11, 41, 27, 0.15);
            border-bottom: 2px solid var(--ai-green);
        }

        /* --- كروت الإحصائيات بنظام Grid ذكي وخفيف --- */
        .stats-container { 
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px; 
            padding: 15px; 
        }
        .stat-card { 
            background: var(--bg-glass); 
            border: 1px solid rgba(16, 185, 129, 0.15); 
            border-radius: var(--radius-cyber); 
            padding: 15px 8px; 
            text-align: center; 
            box-shadow: var(--shadow-sm);
            backdrop-filter: blur(6px);
            transition: all 0.3s ease;
        }
        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
            border-color: var(--ai-green);
        }
        .stat-title { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 4px; font-weight: 700; }
        .stat-value { font-weight: 800; font-size: 1rem; line-height: 1.1; }

        /* --- قسم أزرار التحكم السريع --- */
        .export-section { display: flex; gap: 8px; padding: 0 15px 15px; }
        .btn-export { 
            flex: 1; border: none; border-radius: 12px; padding: 10px; 
            font-size: 0.8rem; font-weight: 700; color: white; 
            display: flex; align-items: center; justify-content: center; gap: 6px; 
            transition: all 0.2s ease; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .btn-excel { background: #1f7a4a; }
        .btn-excel:hover { background: #165633; }
        .btn-delete-all { background: var(--danger-glow); }
        .btn-delete-all:hover { background: #b91c1c; }
        .btn-pdf-report { background: var(--deep-olive); border: 1px solid rgba(255,255,255,0.1); }
        .btn-pdf-report:hover { background: #05130c; }
        .btn-export:active { transform: scale(0.97); }

        /* --- خانة البحث العائمة --- */
        .search-container { padding: 0 15px 15px 15px; position: relative; }
        .search-input { 
            width: 100%; background: var(--bg-glass); 
            border: 1px solid rgba(16, 185, 129, 0.2); 
            padding: 12px 42px 12px 15px; border-radius: 14px; 
            color: var(--text-main); outline: none; font-weight: 600; font-size: 0.9rem;
            transition: 0.3s;
            box-shadow: var(--shadow-sm);
        }
        .search-input:focus {
            border-color: var(--ai-green);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
        }
        .search-icon { position: absolute; right: 28px; top: 44%; transform: translateY(-50%); color: var(--ai-green); font-size: 0.95rem; }

        /* --- كروت الفواتير النيونية (AI Style) --- */
        #listContainer { display: flex; flex-direction: column; gap: 12px; }
        .inv-card { 
            background: var(--bg-glass); 
            border: 1px solid rgba(30, 70, 50, 0.08); 
            border-radius: var(--radius-cyber); 
            padding: 18px; 
            margin: 0 15px; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            box-shadow: var(--shadow-sm); 
            position: relative;
            overflow: hidden;
        }
        .inv-card::before {
            content: ''; position: absolute; top: 0; right: 0; width: 4px; height: 100%;
            background: var(--ai-green); opacity: 0.7;
        }
        .inv-card:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: var(--shadow-md);
            border-color: rgba(16, 185, 129, 0.3);
        }

        /* الشارات الذكية */
        .rem-badge { font-size: 0.68rem; background: rgba(239, 68, 110, 0.08); color: var(--danger-glow); padding: 4px 10px; border-radius: 8px; font-weight: 700; }
        .cash-badge { font-size: 0.68rem; background: rgba(16, 185, 129, 0.08); color: var(--success-glow); padding: 4px 10px; border-radius: 8px; font-weight: 700; }

        /* أزرار العمليات المصغرة السريعة */
        .action-icons { display: flex; justify-content: space-between; margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(16, 185, 129, 0.08); }
        .action-btn { 
            background: #f4f7f5; border: 1px solid rgba(30, 70, 50, 0.08); 
            color: var(--deep-olive); width: 38px; height: 38px; border-radius: 10px; 
            display: flex; align-items: center; justify-content: center; font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        .action-btn:hover {
            background: var(--deep-olive); color: white !important;
        }
        .action-btn:hover i { color: white !important; }

        .add-btn { 
            background: rgba(255,255,255,0.15); width: 38px; height: 38px; 
            border-radius: 10px; display: flex; align-items: center; justify-content: center; 
            color: white; text-decoration: none; border: 1px solid rgba(255,255,255,0.1);
            transition: 0.2s;
        }
        .add-btn:hover { background: rgba(255,255,255,0.25); color: #fff; }
        
        #printFrame { display: none; }

        /* حاوية مشاركة الصور التكتيكية */
        #shareContainer {
            display: none; width: 450px; background: #fff; padding: 25px;
            font-family: 'Cairo', sans-serif; color: #000;
        }
        .share-header { text-align: center; border-bottom: 2px solid #000; padding-bottom: 15px; margin-bottom: 15px; }
        .share-table { width: 100%; border-collapse: collapse; margin: 15px 0; }
        .share-table th { border-bottom: 1px solid #000; padding: 8px 0; font-size: 14px; }
        .share-table td { padding: 10px 0; border-bottom: 1px dashed #eee; font-size: 15px; font-weight: 600; }
        .share-total-sec { border-top: 2px solid #000; margin-top: 15px; padding-top: 10px; }
        .share-row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 16px; }

        @media print {
            .header-nav, .stats-container, .export-section, .search-container, .action-icons, .add-btn { display: none !important; }
            body { background: white !important; }
            .inv-card { border: 1px solid #000 !important; box-shadow: none !important; break-inside: avoid; }
        }
    </style>
</head>
<body>

<div class="header-nav">
    <a href="index.html" class="add-btn">
        <i class="fas fa-home"></i>
    </a>
    <h6 class="m-0 fw-bold" style="font-size: 1rem; letter-spacing: 0.5px;">
        <i class="fas fa-microchip me-1 text-warning"></i>
        الأرشيف الذكي للمبيعات
    </h6>
    <div class="d-flex align-items-center gap-2">
        <i class="fas fa-sync-alt p-2" onclick="loadInvoices()" style="cursor:pointer; opacity:0.9; font-size: 0.9rem;"></i>
        <a href="sales-invoice.html" class="add-btn" style="background: var(--ai-green)">
            <i class="fas fa-plus"></i>
        </a>
    </div>
</div>

<!-- الإحصائيات الذكية -->
<div class="stats-container">
    <div class="stat-card">
        <div class="stat-title">إجمالي المبيعات</div>
        <div class="stat-value" style="color: var(--deep-olive)" id="totalAll">0</div>
    </div>
    <div class="stat-card">
        <div class="stat-title">المحصل النقدى</div>
        <div class="stat-value" style="color: var(--success-glow)" id="paidAll">0</div>
    </div>
    <div class="stat-card">
        <div class="stat-title">الحساب الآجل</div>
        <div class="stat-value" style="color: var(--danger-glow)" id="remAll">0</div>
    </div>
</div>

<div class="export-section">
    <button class="btn-export btn-excel" onclick="exportToExcel()">
        <i class="fas fa-file-excel"></i> Excel
    </button>
    <button class="btn-export btn-delete-all" onclick="deleteAllInvoices()">
        <i class="fas fa-trash-alt"></i> تصفية السجل
    </button>
    <button class="btn-export btn-pdf-report" onclick="window.print()">
        <i class="fas fa-print"></i> طباعة PDF
    </button>
</div>

<div class="search-container">
    <i class="fas fa-search search-icon"></i>
    <input type="text" id="searchInput" class="search-input" placeholder="اسأل الذكاء الاصطناعي.. ابحث عن عميل">
</div>

<div id="listContainer">
    <div class="text-center p-5"><div class="spinner-border spinner-border-sm" style="color: var(--ai-green);"></div></div>
</div>

<!-- حاوية استخراج الفاتورة الذكية كصورة -->
<div id="shareContainer">
    <div class="share-header">
        <h3 style="margin:0; color: #0b5e3d;">شركة الزيادي لزيوت السيارات </h3>
        <p style="margin:5px 0; font-weight:bold;">زيوت - فلاتر السيارات</p>
        <small id="s-date"></small>
    </div>
    <p><b>العميل:</b> <span id="s-client"></span></p>
    <table class="share-table">
        <thead><tr><th style="text-align:right;">الصنف</th><th>ك</th><th>سعر</th><th style="text-align:left;">إجمالي</th></tr></thead>
        <tbody id="s-body"></tbody>
    </table>
    <div class="share-total-sec">
        <div class="share-row" style="font-weight:800; font-size:18px;"><span>إجمالي الفاتورة:</span><span id="s-total"></span></div>
        <div class="share-row"><span>سداد:</span><span id="s-paid"></span></div>
        <div class="share-row" id="s-rem-row" style="color:red; font-weight:bold;"><span>متبقي من الفاتورة:</span><span id="s-rem"></span></div>
        <div id="s-balance-box"></div> </div>
    <div style="text-align:center; margin-top:20px; border-top:1px dashed #000; padding-top:10px; font-size:12px;">
        برجاء مراجعه الفاتوره بعد استلامها <br> تواصل معنا: 01027830834
    </div>
</div>

<div class="modal fade" id="viewModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content" style="border-radius: 20px; border: 1px solid var(--ai-green);">
            <div class="modal-body" id="modalBody"></div>
            <div class="p-3 pt-0"><button class="btn btn-light btn-sm w-100 rounded-pill fw-bold border" data-bs-dismiss="modal">إغلاق</button></div>
        </div>
    </div>
</div>

<iframe id="printFrame"></iframe>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, getDoc, query, orderBy, doc, deleteDoc, updateDoc, increment, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
      authDomain: "ahmedelzaiady.firebaseapp.com",
      projectId: "ahmedelzaiady",
      storageBucket: "ahmedelzaiady.firebasestorage.app",
      messagingSenderId: "300306825071",
      appId: "1:300306825071:web:0426ddde56280fa090329a",
      measurementId: "G-WE04GK5XZZ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let allInvoices = [];

    async function getRealDebt(customerId, initialBalance = 0) {
        try {
            const qInvoices = query(collection(db, "invoices"), where("customerId", "==", customerId));
            const snapInvoices = await getDocs(qInvoices);
            let invoiceDebt = 0;
            snapInvoices.forEach(doc => { invoiceDebt += (Number(doc.data().remaining) || 0); });

            const qTrans = query(collection(db, "transactions"), where("partyId", "==", customerId));
            const snapTrans = await getDocs(qTrans);
            let transEffect = 0;
            snapTrans.forEach(doc => {
                const tr = doc.data();
                if(tr.type === 'قبض') transEffect -= (Number(tr.amount) || 0);
                else if(tr.type === 'صرف') transEffect += (Number(tr.amount) || 0);
            });
            return Number(initialBalance) + invoiceDebt + transEffect;
        } catch (e) { return Number(initialBalance); }
    }

    function formatDateArabic(dateStr) {
        const months = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
        const d = new Date(dateStr);
        return `${d.getDate()}-${months[d.getMonth()]}`;
    }

    window.exportToExcel = () => {
        if (allInvoices.length === 0) return alert("لا توجد بيانات للتصدير");
        let excelData = [["التاريخ", "الحركة", "اسم العميل", "اسم الصنف", "عدد جركن", "عدد كرتونة", "سعر جركن", "سعر كرتونة"]];
        
        allInvoices.forEach(inv => {
            const total = Number(inv.total || 0);
            const remaining = Number(inv.remaining || 0);
            const paid = total - remaining;
            const dateObj = inv.timestamp?.toDate?.() || inv.time || new Date();

            (inv.items || []).forEach(item => {
                const isBox = item.unit === "box";
                excelData.push([
                    formatDateArabic(dateObj), "بيع", inv.customerName || "النقدي", item.name || "",
                    !isBox ? (item.qty || 0) : 0, isBox ? (item.qty || 0) : 0,
                    !isBox ? Math.round(item.price || 0) : 0, isBox ? Math.round(item.price || 0) : 0
                ]);
            });
            excelData.push([formatDateArabic(dateObj), "سداد منه نقدى", inv.customerName || "النقدي", "سداد نقدي", 0, 1, 0, Math.round(paid)]);
        });
        
        const worksheet = XLSX.utils.aoa_to_sheet(excelData);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "المبيعات");
        XLSX.writeFile(workbook, "المبيعات.xlsx");
    };

    window.loadInvoices = async () => {
        try {
            const [invSnap, transSnap] = await Promise.all([
                getDocs(query(collection(db, "invoices"), orderBy("timestamp", "desc"))),
                getDocs(query(collection(db, "transactions"), where("type", "==", "قبض")))
            ]);

            allInvoices = invSnap.docs.map(d => ({id: d.id, ...d.data()}));
            
            let totalSales = 0;
            let totalPaidAtInvoiceTime = 0;
            allInvoices.forEach(inv => {
                totalSales += Number(inv.total || 0);
                totalPaidAtInvoiceTime += (Number(inv.total) - Number(inv.remaining || 0));
            });

            let totalFromReceipts = 0;
            transSnap.forEach(t => { totalFromReceipts += Number(t.data().amount || 0); });

            const actualPaid = totalPaidAtInvoiceTime + totalFromReceipts;
            document.getElementById('totalAll').innerText = Math.round(totalSales).toLocaleString('ar-EG') + " ج.م";
            document.getElementById('remAll').innerText = Math.round(totalSales - actualPaid).toLocaleString('ar-EG') + " ج.م";
            document.getElementById('paidAll').innerText = Math.round(actualPaid).toLocaleString('ar-EG') + " ج.م";
            
            render();
        } catch (e) { console.error(e); }
    };

    function render() {
        const container = document.getElementById('listContainer');
        if(allInvoices.length === 0) {
            container.innerHTML = '<div class="text-center opacity-50 mt-5 small">لا توجد فواتير بالسجل حالياً</div>';
            return;
        }
        container.innerHTML = allInvoices.map(inv => `
            <div class="inv-card" data-name="${inv.customerName || ''}">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <b class="d-block mb-1" style="color: var(--deep-olive); font-size: 1rem;">${inv.customerName || 'عميل كاش نقدي'}</b>
                        <small class="fw-bold" style="font-size: 0.72rem; color: var(--text-muted);"><i class="far fa-clock me-1 text-success"></i> ${inv.time}</small>
                    </div>
                    <div class="text-end">
                        <div class="fw-bold m-0" style="color: var(--deep-olive); font-size: 1.05rem;">${Math.round(inv.total).toLocaleString('ar-EG')} ج.م</div>
                        ${inv.remaining > 0 ? `<div class="rem-badge mt-1"><i class="fas fa-exclamation-circle me-1"></i>آجل: ${Math.round(inv.remaining).toLocaleString('ar-EG')}</div>` : `<div class="cash-badge mt-1"><i class="fas fa-check-circle me-1"></i>خالص بالكامل</div>`}
                    </div>
                </div>
                <div class="action-icons">
                    <button class="action-btn" onclick="showInv('${inv.id}')"><i class="fas fa-eye" style="color: #0d6efd"></i></button>
                    <button class="action-btn" onclick="editInv('${inv.id}')"><i class="fas fa-sliders-h" style="color: #10b981"></i></button>
                    <button class="action-btn" onclick="shareInv('${inv.id}', this)"><i class="fas fa-share-nodes" style="color: #4361ee"></i></button>
                    <button class="action-btn" onclick="printInv('${inv.id}')"><i class="fas fa-print" style="color: #6c757d"></i></button>
                    <button class="action-btn" onclick="deleteInv('${inv.id}')"><i class="fas fa-trash-alt" style="color: var(--danger-glow)"></i></button>
                </div>
            </div>
        `).join('');
    }

    window.shareInv = async (id, btn) => {
        const icon = btn.innerHTML;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm" style="width:14px; height:14px;"></span>';
        const inv = allInvoices.find(i => i.id === id);
        const shareContainer = document.getElementById('shareContainer');
        
        let realDebt = 0;
        if(inv.customerId) {
            const cSnap = await getDoc(doc(db, "customers", inv.customerId));
            const initialBalance = cSnap.exists() ? (cSnap.data().initialBalance || 0) : 0;
            realDebt = await getRealDebt(inv.customerId, initialBalance);
        }

        let previousBalance = realDebt - (Number(inv.remaining) || 0);

        document.getElementById('s-date').innerText = inv.time;
        document.getElementById('s-client').innerText = inv.customerName || 'عميل نقدي';
        document.getElementById('s-total').innerText = Math.round(inv.total).toLocaleString() + " ج.م";
        document.getElementById('s-paid').innerText = Math.round(inv.total - inv.remaining).toLocaleString() + " ج.م";
        document.getElementById('s-rem').innerText = Math.round(inv.remaining).toLocaleString() + " ج.م";
        document.getElementById('s-rem-row').style.display = inv.remaining > 0 ? 'flex' : 'none';

        document.getElementById('s-balance-box').innerHTML = `
            <div class="share-row" style="font-size: 14px; color: #444;"><span>حساب سابق:</span><span>${Math.round(previousBalance).toLocaleString()} ج.م</span></div>
            <div class="share-row" style="margin-top:10px; border-top:1.5px solid #000; padding-top:10px; font-weight:800; font-size:18px;">
                <span> المتبقى من الحساب:</span><span>${Math.round(realDebt).toLocaleString()} ج.م</span>
            </div>
        `;

        let rows = "";
        if (Array.isArray(inv.items) && inv.items.length > 0) {
            inv.items.forEach(item => {
                rows += `<tr>
                    <td style="text-align:right;">${item.name || ''}</td>
                    <td style="text-align:center;">${item.qty || 0}</td>
                    <td style="text-align:center;">${Math.round(item.price || 0)}</td>
                    <td style="text-align:left;">${Math.round((item.qty || 0) * (item.price || 0))}</td>
                </tr>`;
            });
        } else {
            Object.keys(inv).forEach(k => {
                if (!isNaN(k) && inv[k]) {
                    const item = inv[k];
                    rows += `<tr>
                        <td style="text-align:right;">${item.name || ''}</td>
                        <td style="text-align:center;">${item.qty || 0}</td>
                        <td style="text-align:center;">${Math.round(item.price || 0)}</td>
                        <td style="text-align:left;">${Math.round((item.qty || 0) * (item.price || 0))}</td>
                    </tr>`;
                }
            });
        }
        document.getElementById('s-body').innerHTML = rows;

        try {
            shareContainer.style.display = 'block';
            shareContainer.style.position = 'fixed'; shareContainer.style.left = '-9999px'; 
            const canvas = await html2canvas(shareContainer, { scale: 3, useCORS: true, backgroundColor: "#ffffff" });
            shareContainer.style.display = 'none';
            const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
            const file = new File([blob], `فاتورة_${inv.customerName}.png`, { type: 'image/png' });
            if (navigator.share) { await navigator.share({ files: [file], title: 'شركة الزيادي' }); }
            else { const link = document.createElement('a'); link.href = canvas.toDataURL(); link.download = `فاتورة.png`; link.click(); }
        } catch (err) { console.error(err); shareContainer.style.display = 'none'; }
        btn.innerHTML = icon;
    };

    window.deleteAllInvoices = async () => {
        if (!confirm("⚠️ هل تريد حذف جميع الفواتير نهائياً؟ تفريغ كامل للسجل.")) return;
        try {
            const snap = await getDocs(collection(db, "invoices"));
            if (snap.empty) return alert("السجل فارغ بالفعل");
            let deleted = 0;
            for (const docSnap of snap.docs) {
                await deleteDoc(doc(db, "invoices", docSnap.id));
                deleted++;
            }
            alert(`تم تصفية وحذف ${deleted} فاتورة بنجاح ✅`);
            loadInvoices();
        } catch (e) { alert("خطأ: " + e.message); }
    };

    window.printInv = async (id) => {
        const inv = allInvoices.find(i => i.id === id);
        let realDebt = 0;
        if(inv.customerId) {
            const cSnap = await getDoc(doc(db, "customers", inv.customerId));
            const initialBalance = cSnap.exists() ? (cSnap.data().initialBalance || 0) : 0;
            realDebt = await getRealDebt(inv.customerId, initialBalance);
        }
        let previousBalance = realDebt - (Number(inv.remaining) || 0);

        let rows = "";
        if (inv.items && Array.isArray(inv.items)) {
            inv.items.forEach(item => {
                rows += `<tr>
                    <td style="text-align:right;">${item.name || ''}</td>
                    <td style="text-align:center;">${item.qty || 0}</td>
                    <td style="text-align:center;">${Math.round(item.price || 0).toLocaleString()}</td>
                    <td style="text-align:left;">${Math.round((item.qty || 0) * (item.price || 0)).toLocaleString()}</td>
                </tr>`;
            });
        } else {
            Object.keys(inv).forEach(k => {
                if (!isNaN(k) && inv[k]) {
                    rows += `<tr>
                        <td style="text-align:right;">${inv[k].name || ''}</td>
                        <td style="text-align:center;">${inv[k].qty || 0}</td>
                        <td style="text-align:center;">${Math.round(inv[k].price || 0).toLocaleString()}</td>
                        <td style="text-align:left;">${Math.round((inv[k].qty || 0) * (inv[k].price || 0)).toLocaleString()}</td>
                    </tr>`;
                }
            });
        }

        const total = Number(inv.total || 0);
        const remaining = Number(inv.remaining || 0);
        const paid = total - remaining;

        const content = `
            <html dir="rtl"><head><style>
                @page { size: 72mm auto; margin: 0; }
                body { font-family: 'Arial'; padding: 5px; width: 72mm; font-size: 13px; margin: 0 auto; color: #000; }
                .h { text-align: center; border-bottom: 2px solid #000; margin-bottom: 8px; padding-bottom: 5px; }
                table { width: 100%; border-collapse: collapse; margin-top: 5px; }
                th { border-bottom: 1px solid #000; padding: 5px 0; font-size: 11px; }
                .total-sec { border-top: 2px solid #000; margin-top: 10px; padding-top: 5px; }
                .row-val { display:flex; justify-content:space-between; margin-bottom: 4px; }
                .bold { font-weight: bold; font-size: 15px; }
                .footer { text-align:center; margin-top:15px; border-top:1px dashed #000; padding-top:5px; font-size:11px; }
            </style></head>
            <body>
                <div class="h">
                    <h3 style="margin:0">شركة الزيادي لقطع الغيار</h3>
                    <p style="margin:2px">زيوت - فلاتر السيارات</p>
                    <small>${inv.time}</small>
                </div>
                <p style="margin:5px 0;"><b>العميل:</b> ${inv.customerName || 'عميل نقدي'}</p>
                <table>
                    <thead><tr><th style="text-align:right;">الصنف</th><th>ك</th><th>سعر</th><th style="text-align:left;">إجمالي</th></tr></thead>
                    <tbody>${rows}</tbody>
                </table>
                <div class="total-sec">
                    <div class="row-val bold"><span>إجمالي الفاتورة:</span><span>${Math.round(total).toLocaleString()} ج.م</span></div>
                    <div class="row-val"><span>المسدد:</span><span>${Math.round(paid).toLocaleString()} ج.م</span></div>
                    ${remaining > 0 ? `<div class="row-val"><span>متبقي من الفاتورة:</span><span>${Math.round(remaining).toLocaleString()} ج.م</span></div>` : ''}
                    <div class="row-val" style="margin-top:5px; font-size:12px; color:#555;"><span>مديونية سابقة:</span><span>${Math.round(previousBalance).toLocaleString()} ج.م</span></div>
                    <div class="row-val bold" style="margin-top:5px; border-top:1.5px solid #000; padding-top:5px;">
                        <span>إجمالي الحساب:</span>
                        <span>${Math.round(realDebt).toLocaleString()} ج.م</span>
                    </div>
                </div>
                <div class="footer">برجاء مراجعه الفاتوره بعد استلامها <br>تواصل معنا: 01027830834</div>
            </body></html>`;
        
        const printFrame = document.getElementById('printFrame');
        const pri = printFrame.contentWindow || printFrame.contentDocument;
        pri.document.open(); pri.document.write(content); pri.document.close();
        setTimeout(() => { pri.focus(); pri.print(); }, 600);
    };

    window.showInv = (id) => {
        const inv = allInvoices.find(i => i.id === id);
        let itemsHtml = "";
        Object.keys(inv).forEach(k => {
            if(!isNaN(k)) {
                itemsHtml += `<div class="d-flex justify-content-between border-bottom py-2 small fw-bold">
                    <span>${inv[k].name} <span class="text-muted">(x${inv[k].qty})</span></span>
                    <span>${Math.round(inv[k].qty * (inv[k].price || 0)).toLocaleString('ar-EG')} ج.م</span>
                </div>`;
            }
        });
        document.getElementById('modalBody').innerHTML = `
            <div class="text-center mb-2"><h6 class="fw-bold mt-2 small">تفاصيل الفاتورة الإلكترونية</h6></div>
            ${itemsHtml || '<p class="text-center small">لا توجد أصناف صالحة</p>'}
            <div class="mt-3 p-2 rounded bg-light border small">
                <div class="d-flex justify-content-between fw-bold mb-1"><span>الإجمالي:</span><span>${Math.round(inv.total).toLocaleString('ar-EG')} ج.م</span></div>
                <div class="d-flex justify-content-between fw-bold text-danger"><span>المتبقي:</span><span>${Math.round(inv.remaining || 0).toLocaleString('ar-EG')} ج.م</span></div>
            </div>`;
        new bootstrap.Modal(document.getElementById('viewModal')).show();
    };

    window.editInv = (id) => window.location.href = `sales-invoice.html?edit=${id}`;

    window.deleteInv = async (id) => {
        if (!confirm("⚠️ حذف الفاتورة؟ سيتم تعديل المخزون والمديونية تلقائياً.")) return;
        const inv = allInvoices.find(i => i.id === id);
        try {
            for (const k of Object.keys(inv)) {
                if (!isNaN(k)) {
                    const item = inv[k];
                    const qtyPcs = item.unit === "box" ? item.qty * (item.unitFactor || 1) : item.qty;
                    if (item.stockId) {
                        try {
                            await updateDoc(doc(db, "inventory", item.stockId), { totalPcs: increment(qtyPcs) });
                        } catch(err) { console.log("الصنف غير موجود بالمخزون"); }
                    }
                }
            }
            await deleteDoc(doc(db, "invoices", id));
            if (inv.customerId && inv.remaining > 0) {
                try {
                    await updateDoc(doc(db, "customers", inv.customerId), { currentBalance: increment(-inv.remaining) });
                } catch(err) { console.log("تعذر تعديل مديونية العميل"); }
            }
            alert("تم حذف الفاتورة وتعديل المخزون بنجاح ✅");
            loadInvoices();
        } catch (e) { alert("خطأ: " + e.message); }
    };

    document.getElementById('searchInput').oninput = (e) => {
        const val = e.target.value.toLowerCase();
        document.querySelectorAll('.inv-card').forEach(card => {
            card.style.display = card.dataset.name.toLowerCase().includes(val) ? 'block' : 'none';
        });
    };

    loadInvoices();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
