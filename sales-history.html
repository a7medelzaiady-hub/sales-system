<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سجل المبيعات - شركة الزيادي</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- Excel Library -->
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
:root { 
    --accent: #0b5e3d; 
    --header-bg: #0b5e3d;
    --bg-light: #f4f7f6;
    --text-primary: #1b2e26;
    --border: #dce3de;
    --white: #ffffff;
    --danger: #d90429;
    --info: #0d6efd;
    --success: #2d6a4f;
}

body { background: var(--bg-light); font-family: 'Cairo', sans-serif; color: var(--text-primary); padding-bottom: 50px; }

.header-nav { 
    background: var(--header-bg); padding: 12px 20px; color: white;
    display: flex; justify-content: space-between; align-items: center; 
    position: sticky; top: 0; z-index: 1000;
}

.add-btn {
    background: rgba(255,255,255,0.2);
    width: 38px; height: 38px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    color: white; text-decoration: none;
    border: none;
}
</style>
</head>

<body>

<div class="header-nav">

    <i class="fas fa-sync-alt" onclick="loadInvoices()" style="cursor:pointer;"></i>

    <h6 class="m-0 fw-bold">سجل المبيعات</h6>

    <div class="d-flex gap-2">

        <!-- تصدير Excel -->
        <button onclick="exportExcel()" class="add-btn">
            <i class="fas fa-file-excel"></i>
        </button>

        <!-- إضافة فاتورة -->
        <a href="sales-invoice.html" class="add-btn">
            <i class="fas fa-plus"></i>
        </a>

    </div>

</div>

<div id="listContainer" class="p-3"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
  authDomain: "ahmedelzaiady.firebaseapp.com",
  projectId: "ahmedelzaiady",
  storageBucket: "ahmedelzaiady.firebasestorage.app",
  messagingSenderId: "300306825071",
  appId: "1:300306825071:web:0426ddde56280fa090329a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allInvoices = [];

/* =======================
   تحميل الفواتير
======================= */
window.loadInvoices = async () => {

    const snap = await getDocs(query(collection(db, "invoices"), orderBy("timestamp", "desc")));

    allInvoices = snap.docs.map(d => ({ id: d.id, ...d.data() }));

    render();

};

/* =======================
   عرض الفواتير
======================= */
function render() {

    const container = document.getElementById("listContainer");

    if(allInvoices.length === 0){
        container.innerHTML = "لا توجد فواتير";
        return;
    }

    container.innerHTML = allInvoices.map(inv => `
        <div class="border rounded p-3 mb-2 bg-white">
            <b>${inv.customerName || "عميل نقدي"}</b><br>
            <small>الإجمالي: ${inv.total}</small>
        </div>
    `).join("");

}

/* =======================
   تصدير Excel
======================= */
window.exportExcel = () => {

    if (!allInvoices.length) {
        alert("لا توجد فواتير للتصدير");
        return;
    }

    let data = allInvoices.map(inv => ({
        "اسم العميل": inv.customerName || "عميل نقدي",
        "التاريخ": inv.time || "",
        "إجمالي الفاتورة": inv.total || 0,
        "المحصل": (inv.total || 0) - (inv.remaining || 0),
        "المتبقي": inv.remaining || 0
    }));

    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(wb, ws, "Invoices");

    XLSX.writeFile(wb, "sales-invoices.xlsx");
};

loadInvoices();

</script>

</body>
</html>
