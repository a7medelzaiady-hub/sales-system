<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سجل المبيعات - شركة الزيادي</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
:root{
    --accent:#0b5e3d;
    --bg:#f4f7f6;
    --text:#1b2e26;
    --border:#dce3de;
    --danger:#d90429;
    --success:#2d6a4f;
    --info:#0d6efd;
}

body{background:var(--bg);font-family:'Cairo',sans-serif;padding-bottom:60px;}

.header-nav{
    background:var(--accent);
    color:#fff;
    padding:12px 15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:1000;
}

.stats-container{display:flex;gap:8px;padding:10px;overflow:auto;}
.stat-card{background:#fff;padding:12px;border:1px solid var(--border);border-radius:12px;flex:1;text-align:center;}

.inv-card{
    background:#fff;
    margin:10px;
    padding:15px;
    border-radius:15px;
    border:1px solid var(--border);
}

.action-icons{
    display:flex;
    justify-content:space-between;
    margin-top:10px;
    border-top:1px solid #eee;
    padding-top:10px;
}

.action-btn{
    width:38px;height:38px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#f8f8f8;
}

.search-container{padding:10px;}
.search-input{
    width:100%;
    padding:10px;
    border-radius:10px;
    border:1px solid var(--border);
}
</style>
</head>

<body>

<div class="header-nav">
<i class="fas fa-sync" onclick="loadInvoices()"></i>
<h6 class="m-0">سجل المبيعات</h6>
<a href="sales-invoice.html" style="color:#fff"><i class="fas fa-plus"></i></a>
</div>

<div class="stats-container">
<div class="stat-card">إجمالي<br><b id="totalAll">0</b></div>
<div class="stat-card">المحصل<br><b id="paidAll">0</b></div>
<div class="stat-card">الآجل<br><b id="remAll">0</b></div>
</div>

<div class="search-container">
<input id="searchInput" class="search-input" placeholder="بحث باسم العميل">
</div>

<div id="listContainer"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
getFirestore,
collection,
getDocs,
getDoc,
query,
orderBy,
doc,
deleteDoc,
updateDoc,
increment,
where
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
  authDomain: "ahmedelzaiady.firebaseapp.com",
  projectId: "ahmedelzaiady",
  storageBucket: "ahmedelzaiady.firebasestorage.app",
  messagingSenderId: "300306825071",
  appId: "1:300306825071:web:0426ddde56280fa090329a",
  measurementId: "G-WE04GK5XZZ"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allInvoices = [];

function safeNum(v){ return Number(v) || 0; }

window.loadInvoices = async () => {
try{

const snap = await getDocs(query(collection(db,"invoices"),orderBy("timestamp","desc")));

allInvoices = snap.docs.map(d=>({id:d.id,...d.data()}));

let total=0, paid=0, rem=0;

allInvoices.forEach(inv=>{
total += safeNum(inv.total);
paid += safeNum(inv.total) - safeNum(inv.remaining);
rem += safeNum(inv.remaining);
});

document.getElementById("totalAll").innerText = total.toLocaleString();
document.getElementById("paidAll").innerText = paid.toLocaleString();
document.getElementById("remAll").innerText = rem.toLocaleString();

render();

}catch(e){console.log(e);}
};

function render(){

const c = document.getElementById("listContainer");

c.innerHTML = allInvoices.map(inv=>`

<div class="inv-card" data-name="${inv.customerName||''}">

<div style="display:flex;justify-content:space-between">
<div>
<b>${inv.customerName || "عميل"}</b><br>
<small>${inv.time||""}</small>
</div>

<div>
<b>${safeNum(inv.total).toLocaleString()}</b><br>
<small style="color:red">${safeNum(inv.remaining)>0? "آجل":"خالص"}</small>
</div>
</div>

<div class="action-icons">
<button class="action-btn" onclick="showInv('${inv.id}')"><i class="fas fa-eye"></i></button>
<button class="action-btn" onclick="printInv('${inv.id}')"><i class="fas fa-print"></i></button>
<button class="action-btn" onclick="deleteInv('${inv.id}')"><i class="fas fa-trash"></i></button>
</div>

</div>

`).join("");

}

window.showInv = (id)=>{
const inv = allInvoices.find(i=>i.id===id);
alert(inv.customerName);
};

window.deleteInv = async (id)=>{
if(!confirm("حذف؟")) return;
await deleteDoc(doc(db,"invoices",id));
loadInvoices();
};

document.getElementById("searchInput").oninput=(e)=>{
const v = e.target.value.toLowerCase();
document.querySelectorAll(".inv-card").forEach(c=>{
c.style.display = c.dataset.name.toLowerCase().includes(v)?"block":"none";
});
};

loadInvoices();

</script>

</body>
</html>
