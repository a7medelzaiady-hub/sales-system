<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل المبيعات - شركة الزيادي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght=400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        /* لوحة الألوان - الثيم الأخضر الزيتي الزجاجي الفاخر مع لمعان */
        :root { 
            --accent: #4a5d4e;        /* أخضر زيتي غامق وراقي */
            --header-bg: rgba(60, 76, 64, 0.82); /* زيتي زجاجي للهيدر */
            --bg-light: #f4f6f4;      /* خلفية مريحة بلمحة زيتية باهتة */
            --text-primary: #1c241f;   /* نصوص داكنة متناسقة */
            --border: rgba(255, 255, 255, 0.4); /* حدود زجاجية بيضاء شبه شفافة */
            --card-glass: rgba(255, 255, 255, 0.65); /* الزجاج الشفاف للكروت */
            
            --white: #ffffff;
            --danger: #d9534f;
            --info: #4A90E2;
            --success: #2E7D32;
            --card-radius: 20px;
        }

        body { 
            background: var(--bg-light); 
            font-family: 'Cairo', sans-serif; 
            color: var(--text-primary); 
            padding-bottom: 50px; 
            overflow-x: hidden; 
        }

        /* الهيدر الزجاجي الفاخر */
        .header-nav { 
            background: var(--header-bg); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 18px 20px; 
            color: white;
            display: flex; justify-content: space-between; align-items: center; 
            position: sticky; top: 0; z-index: 1000; 
            box-shadow: 0 8px 32px 0 rgba(60, 76, 64, 0.15);
            border-bottom: 1px solid rgba(255, 255, 255, 0.18);
            border-bottom-left-radius: 20px; border-bottom-right-radius: 20px;
        }

        /* كروت الإحصائيات الزجاجية بلمعان */
        .stats-container { display: flex; gap: 10px; padding: 15px; overflow-x: auto; scrollbar-width: none; }
        .stat-card { 
            background: var(--card-glass);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border); 
            border-radius: 16px; 
            padding: 16px 8px; 
            min-width: 105px; 
            flex: 1; 
            text-align: center; 
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.03);
            position: relative;
            overflow: hidden;
            transition: transform 0.2s;
        }
        /* تأثير لمعة الزجاج الاستباقية */
        .stat-card::before, .inv-card::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: rotate(45deg); transition: 0.5s; pointer-events: none;
        }
        .stat-card:active { transform: scale(0.95); }
        .stat-title { font-size: 0.75rem; color: #5a6e5f; margin-bottom: 4px; font-weight: 700; }
        .stat-value { font-weight: 800; font-size: 1rem; line-height: 1; }

        /* أزرار التصدير التفاعلية */
        .export-section { display: flex; gap: 8px; padding: 0 15px 15px; }
        .btn-export { 
            flex: 1; border: 1px solid var(--border); border-radius: 14px; padding: 12px; font-size: 0.8rem; font-weight: bold; color: white; 
            display: flex; align-items: center; justify-content: center; gap: 5px; 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            backdrop-filter: blur(5px);
        }
        .btn-excel { background: rgba(46, 125, 50, 0.85); }
        .btn-pdf-report { background: rgba(74, 93, 78, 0.85); }
        .btn-export:active { transform: scale(0.93) rotate(-1deg); }

        /* شريط البحث */
        .search-container { padding: 0 15px 15px 15px; position: relative; }
        .search-input { 
            width: 100%; background: var(--card-glass); backdrop-filter: blur(10px);
            border: 1px solid var(--border); padding: 14px 45px 14px 15px; border-radius: 16px; 
            color: var(--text-primary); outline: none; font-weight: 600; font-size: 0.9rem; 
            transition: all 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }
        .search-input:focus { 
            border-color: var(--accent); background: var(--white);
            box-shadow: 0 0 0 5px rgba(74, 93, 78, 0.15); 
        }
        .search-icon { position: absolute; right: 30px; top: 46%; transform: translateY(-50%); color: var(--accent); font-size: 1rem; }

        /* كروت الفواتير الزجاجية مع تأثير النبض واللمعة عند الضغط */
        .inv-card { 
            background: var(--card-glass);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border); 
            border-radius: var(--card-radius); padding: 18px; margin: 0 15px 14px 15px; 
            position: relative; overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            box-shadow: 0 8px 24px rgba(60, 76, 64, 0.04); 
        }
        .inv-card:active { transform: scale(0.97); background: rgba(255,255,255,0.8); }
        .inv-card:hover::before { left: 100%; transition: 0.7s; }

        .rem-badge { font-size: 0.7rem; background: rgba(217, 83, 79, 0.1); color: var(--danger); padding: 5px 12px; border-radius: 10px; font-weight: 800; border: 1px solid rgba(217,83,79,0.2); }
        .cash-badge { font-size: 0.7rem; background: rgba(46, 125, 50, 0.1); color: var(--success); padding: 5px 12px; border-radius: 10px; font-weight: 800; border: 1px solid rgba(46,125,50,0.2); }

        /* أزرار الإجراءات السفلية المصقولة كزجاج دائري */
        .action-icons { display: flex; justify-content: space-between; margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(0,0,0,0.04); }
        .action-btn { 
            background: rgba(255, 255, 255, 0.5); border: 1px solid var(--border); color: #4a5568; 
            width: 42px; height: 42px; border-radius: 14px; display: flex; align-items: center; justify-content: center; 
            font-size: 1rem; transition: all 0.2s; 
        }
        .action-btn:active { transform: scale(0.82) rotate(5deg); background: var(--white); }
        
        .add-btn { 
            background: rgba(255,255,255,0.2); width: 40px; height: 40px; border-radius: 12px; 
            display: flex; align-items: center; justify-content: center; color: white; text-decoration: none; 
            transition: all 0.2s; border: 1px solid rgba(255,255,255,0.1);
        }
        .add-btn:active { transform: scale(0.88); background: rgba(255,255,255,0.3); }
        
        #printFrame { display: none; }

        /* حاوية تصدير الفاتورة الرسمية للواتساب تظل ناصعة وأنيقة للأجهزة والمشاركة */
        #shareContainer {
            display: none; width: 450px; background: #fff; padding: 25px;
            font-family: 'Cairo', sans-serif; color: #000;
        }
        .share-header { text-align: center; border-bottom: 2px solid #000; padding-bottom: 15px; margin-bottom: 15px; }
        .share-table { width: 100%; border-collapse: collapse; margin: 15px 0; }
        .share-table th { border-bottom: 1px solid #000; padding: 8px 0; font-size: 14px; }
        .share-table td { padding: 10px 0; border-bottom: 1px dashed #eee; font-size: 15px; font-weight: 600; }
        .share-total-sec { border-top: 2px solid #000; margin-top: 15px; padding-top: 10px; }
        .share-row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 16px; }

        @media print {
            .header-nav, .stats-container, .export-section, .search-container, .action-icons, .add-btn { display: none !important; }
            body { background: white !important; }
            .inv-card { border: 1px solid #000 !important; box-shadow: none !important; break-inside: avoid; }
        }
    </style>
</head>
<body>

<div class="header-nav">
    <a href="index.html" class="add-btn" onclick="playClickSound()">
        <i class="fas fa-home"></i>
    </a>

    <h6 class="m-0 fw-bold" style="font-size: 1rem; letter-spacing: 0.5px;">
        <i class="fas fa-file-invoice-dollar me-1"></i>
        سجل المبيعات
    </h6>

    <div class="d-flex align-items-center gap-3">
        <i class="fas fa-sync-alt" id="syncIcon" onclick="playClickSound(); loadInvoices(true)" style="cursor:pointer; opacity:0.9; font-size: 1.1rem;"></i>
        <a href="sales-invoice.html" class="add-btn" onclick="playClickSound()">
            <i class="fas fa-plus"></i>
        </a>
    </div>
</div>

<div class="stats-container">
    <div class="stat-card" onclick="playClickSound()">
        <div class="stat-title">إجمالي المبيعات</div>
        <div class="stat-value" style="color: var(--accent)" id="totalAll">0</div>
    </div>
    <div class="stat-card" onclick="playClickSound()">
        <div class="stat-title">المحصل</div>
        <div class="stat-value" style="color: var(--success)" id="paidAll">0</div>
    </div>
    <div class="stat-card" onclick="playClickSound()">
        <div class="stat-title">الآجل</div>
        <div class="stat-value" style="color: var(--danger)" id="remAll">0</div>
    </div>
</div>

<div class="export-section">
    <button class="btn-export btn-excel" onclick="playClickSound(); exportToExcel()">
        <i class="fas fa-file-excel"></i> تصدير Excel
    </button>
    <button class="btn-export" style="background: rgba(217, 83, 79, 0.95)" onclick="playClickSound(); deleteAllInvoices()">
        <i class="fas fa-trash"></i> حذف الكل
    </button>
    <button class="btn-export btn-pdf-report" onclick="playClickSound(); window.print()">
        <i class="fas fa-file-pdf"></i> طباعة PDF
    </button>
</div>

<div class="search-container">
    <i class="fas fa-search search-icon"></i>
    <input type="text" id="searchInput" class="search-input" placeholder="بحث باسم العميل..." oninput="playTypeSound()">
</div>

<div id="listContainer"></div>

<!-- حاوية مشاركة الفاتورة الرسمية -->
<div id="shareContainer">
    <div class="share-header">
        <h3 style="margin:0; color: #3c4c40;">شركة الزيادي لزيوت السيارات</h3>
        <p style="margin:5px 0; font-weight:bold;">زيوت - فلاتر السيارات</p>
        <small id="s-date"></small>
    </div>
    <p><b>العميل:</b> <span id="s-client"></span></p>
    <table class="share-table">
        <thead><tr><th style="text-align:right;">الصنف</th><th>ك</th><th>سعر</th><th style="text-align:left;">إجمالي</th></tr></thead>
        <tbody id="s-body"></tbody>
    </table>
    <div class="share-total-sec">
        <div class="share-row" style="font-weight:800; font-size:18px;"><span>إجمالي الفاتورة:</span><span id="s-total"></span></div>
        <div class="share-row"><span>سداد:</span><span id="s-paid"></span></div>
        <div class="share-row" id="s-rem-row" style="color:red; font-weight:bold;"><span>متبقي من الفاتورة:</span><span id="s-rem"></span></div>
        <div id="s-balance-box"></div> </div>
    <div style="text-align:center; margin-top:20px; border-top:1px dashed #000; padding-top:10px; font-size:12px;">
        برجاء مراجعه الفاتوره بعد استلامها <br> تواصل معنا: 01027830834
    </div>
</div>

<div class="modal fade" id="viewModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content" style="border-radius: 24px; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px);">
            <div class="modal-body" id="modalBody"></div>
            <div class="p-3 pt-0"><button class="btn btn-light btn-sm w-100 rounded-pill fw-bold border" data-bs-dismiss="modal" onclick="playClickSound()">إغلاق</button></div>
        </div>
    </div>
</div>

<iframe id="printFrame"></iframe>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, getDoc, query, orderBy, doc, deleteDoc, updateDoc, increment, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
        authDomain: "ahmedelzaiady.firebaseapp.com",
        projectId: "ahmedelzaiady",
        storageBucket: "ahmedelzaiady.firebasestorage.app",
        messagingSenderId: "300306825071",
        appId: "1:300306825071:web:0426ddde56280fa090329a",
        measurementId: "G-WE04GK5XZZ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let allInvoices = [];

    const CACHE_KEYS = {
        invoices: "cache_history_invoices",
        stats: "cache_history_stats"
    };

    // نظام هندسة الصوت التفاعلي المدمج لإنتاج نغمات تفاعلية فورية دون ملفات خارجية
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    window.playClickSound = () => {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime); // تردد النقر الفاخر الأنيق
        osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.08);
    };

    window.playTypeSound = () => {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.03);
    };

    async function getRealDebt(customerId, initialBalance = 0) {
        try {
            const qInvoices = query(collection(db, "invoices"), where("customerId", "==", customerId));
            const snapInvoices = await getDocs(qInvoices);
            let invoiceDebt = 0;
            snapInvoices.forEach(doc => { invoiceDebt += (Number(doc.data().remaining) || 0); });

            const qTrans = query(collection(db, "transactions"), where("partyId", "==", customerId));
            const snapTrans = await getDocs(qTrans);
            let transEffect = 0;
            snapTrans.forEach(doc => {
                const tr = doc.data();
                if(tr.type === 'قبض') transEffect -= (Number(tr.amount) || 0);
                else if(tr.type === 'صرف') transEffect += (Number(tr.amount) || 0);
            });
            return Number(initialBalance) + invoiceDebt + transEffect;
        } catch (e) { return Number(initialBalance); }
    }

    function formatDateArabic(dateStr) {
        const months = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return dateStr;
        return `${d.getDate()}-${months[d.getMonth()]}`;
    }

    window.exportToExcel = () => {
        if (allInvoices.length === 0) return alert("لا توجد بيانات للتصدير");
        let excelData = [["التاريخ", "الحركة", "اسم العميل", "اسم الصنف", "عدد جركن", "عدد كرتونة", "سعر جركن", "سعر كرتونة"]];
        
        allInvoices.forEach(inv => {
            const total = Number(inv.total || 0);
            const remaining = Number(inv.remaining || 0);
            const paid = total - remaining;
            const dateObj = inv.timestamp?.toDate?.() || inv.time || new Date();

            (inv.items || []).forEach(item => {
                const isBox = item.unit === "box";
                excelData.push([
                    formatDateArabic(dateObj), "بيع", inv.customerName || "النقدي", item.name || "",
                    !isBox ? (item.qty || 0) : 0, isBox ? (item.qty || 0) : 0,
                    !isBox ? Math.round(item.price || 0) : 0, isBox ? Math.round(item.price || 0) : 0
                ]);
            });
            excelData.push([formatDateArabic(dateObj), "سداد منه نقدى", inv.customerName || "النقدي", "سداد نقدي", 0, 1, 0, Math.round(paid)]);
        });
        
        const worksheet = XLSX.utils.aoa_to_sheet(excelData);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "المبيعات");
        XLSX.writeFile(workbook, "المبيعات.xlsx");
    };

    window.loadInvoices = async (isManualSync = false) => {
        const syncIcon = document.getElementById('syncIcon');
        if (isManualSync && syncIcon) syncIcon.classList.add('fa-spin');

        const cachedInvoices = localStorage.getItem(CACHE_KEYS.invoices);
        const cachedStats = localStorage.getItem(CACHE_KEYS.stats);

        if (cachedInvoices) {
            allInvoices = JSON.parse(cachedInvoices);
            render();
        } else {
            document.getElementById('listContainer').innerHTML = '<div class="text-center p-5"><div class="spinner-border spinner-border-sm" style="color: var(--accent);"></div></div>';
        }

        if (cachedStats) {
            const stats = JSON.parse(cachedStats);
            document.getElementById('totalAll').innerText = stats.totalSales;
            document.getElementById('remAll').innerText = stats.totalRemaining;
            document.getElementById('paidAll').innerText = stats.actualPaid;
        }

        try {
            const [invSnap, transSnap] = await Promise.all([
                getDocs(query(collection(db, "invoices"), orderBy("timestamp", "desc"))),
                getDocs(query(collection(db, "transactions"), where("type", "==", "قبض")))
            ]);

            allInvoices = invSnap.docs.map(d => ({id: d.id, ...d.data()}));
            
            let totalSales = 0;
            let totalPaidAtInvoiceTime = 0;
            allInvoices.forEach(inv => {
                totalSales += Number(inv.total || 0);
                totalPaidAtInvoiceTime += (Number(inv.total) - Number(inv.remaining || 0));
            });

            let totalFromReceipts = 0;
            transSnap.forEach(t => { totalFromReceipts += Number(t.data().amount || 0); });

            const actualPaid = totalPaidAtInvoiceTime + totalFromReceipts;
            const statsObj = {
                totalSales: Math.round(totalSales).toLocaleString('ar-EG'),
                totalRemaining: Math.round(totalSales - actualPaid).toLocaleString('ar-EG'),
                actualPaid: Math.round(actualPaid).toLocaleString('ar-EG')
            };

            document.getElementById('totalAll').innerText = statsObj.totalSales;
            document.getElementById('remAll').innerText = statsObj.totalRemaining;
            document.getElementById('paidAll').innerText = statsObj.actualPaid;
            
            render();

            localStorage.setItem(CACHE_KEYS.invoices, JSON.stringify(allInvoices));
            localStorage.setItem(CACHE_KEYS.stats, JSON.stringify(statsObj));

        } catch (e) {
            console.log("وضع غير متصل بالإنترنت: تم عرض الكاش المحلي بنجاح.");
        } finally {
            if (syncIcon) syncIcon.classList.remove('fa-spin');
        }
    };

    function render() {
        const container = document.getElementById('listContainer');
        if(allInvoices.length === 0) {
            container.innerHTML = '<div class="text-center opacity-50 mt-5 small">لا توجد فواتير</div>';
            return;
        }
        container.innerHTML = allInvoices.map(inv => `
            <div class="inv-card" data-name="${inv.customerName || ''}" onclick="playClickSound()">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <b class="d-block mb-1" style="color: var(--accent); font-size: 1rem;">${inv.customerName || 'عميل نقدي'}</b>
                        <small class="text-muted fw-bold" style="font-size: 0.7rem;"><i class="far fa-clock me-1"></i> ${inv.time}</small>
                    </div>
                    <div class="text-end">
                        <div class="fw-bold m-0" style="color: var(--accent); font-size: 0.95rem;">${Math.round(inv.total).toLocaleString('ar-EG')}</div>
                        ${inv.remaining > 0 ? `<div class="rem-badge mt-1">آجل: ${Math.round(inv.remaining).toLocaleString('ar-EG')}</div>` : `<div class="cash-badge mt-1">خالص ✅</div>`}
                    </div>
                </div>
                <div class="action-icons" onclick="event.stopPropagation();">
                    <button class="action-btn" onclick="playClickSound(); showInv('${inv.id}')"><i class="fas fa-eye" style="color: var(--info)"></i></button>
                    <button class="action-btn" onclick="playClickSound(); editInv('${inv.id}')"><i class="fas fa-pen-nib" style="color: var(--success)"></i></button>
                    <button class="action-btn" onclick="playClickSound(); shareInv('${inv.id}', this)"><i class="fas fa-share-alt" style="color: #4A90E2"></i></button>
                    <button class="action-btn" onclick="playClickSound(); printInv('${inv.id}')"><i class="fas fa-print" style="color: #6c757d"></i></button>
                    <button class="action-btn" onclick="playClickSound(); deleteInv('${inv.id}')"><i class="fas fa-trash-alt" style="color: var(--danger)"></i></button>
                </div>
            </div>
        `).join('');
    }

    window.shareInv = async (id, btn) => {
        const icon = btn.innerHTML;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
        const inv = allInvoices.find(i => i.id === id);
        const shareContainer = document.getElementById('shareContainer');
        
        let realDebt = 0;
        if(inv.customerId) {
            try {
                const cSnap = await getDoc(doc(db, "customers", inv.customerId));
                const initialBalance = cSnap.exists() ? (cSnap.data().initialBalance || 0) : 0;
                realDebt = await getRealDebt(inv.customerId, initialBalance);
            } catch(e) { realDebt = Number(inv.remaining) || 0; }
        }

        let previousBalance = realDebt - (Number(inv.remaining) || 0);

        document.getElementById('s-date').innerText = inv.time;
        document.getElementById('s-client').innerText = inv.customerName || 'عميل نقدي';
        document.getElementById('s-total').innerText = Math.round(inv.total).toLocaleString() + " ج.م";
        document.getElementById('s-paid').innerText = Math.round(inv.total - inv.remaining).toLocaleString() + " ج.م";
        document.getElementById('s-rem').innerText = Math.round(inv.remaining).toLocaleString() + " ج.م";
        document.getElementById('s-rem-row').style.display = inv.remaining > 0 ? 'flex' : 'none';

        document.getElementById('s-balance-box').innerHTML = `
            <div class="share-row" style="font-size: 14px; color: #444;"><span>حساب سابق:</span><span>${Math.round(previousBalance).toLocaleString()} ج.م</span></div>
            <div class="share-row" style="margin-top:10px; border-top:1.5px solid #000; padding-top:10px; font-weight:800; font-size:18px;">
                <span> المتبقى من الحساب:</span><span>${Math.round(realDebt).toLocaleString()} ج.م</span>
            </div>
        `;

        let rows = "";
        if (Array.isArray(inv.items) && inv.items.length > 0) {
            inv.items.forEach(item => {
                rows += `<tr>
                    <td style="text-align:right;">${item.name || ''}</td>
                    <td style="text-align:center;">${item.qty || 0}</td>
                    <td style="text-align:center;">${Math.round(item.price || 0)}</td>
                    <td style="text-align:left;">${Math.round((item.qty || 0) * (item.price || 0))}</td>
                </tr>`;
            });
        }
        document.getElementById('s-body').innerHTML = rows;

        try {
            shareContainer.style.display = 'block';
            shareContainer.style.position = 'fixed'; shareContainer.style.left = '-9999px'; 
            const canvas = await html2canvas(shareContainer, { scale: 3, useCORS: true, backgroundColor: "#ffffff" });
            shareContainer.style.display = 'none';
            const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
            const file = new File([blob], `فاتورة_${inv.customerName}.png`, { type: 'image/png' });
            if (navigator.share) { await navigator.share({ files: [file], title: 'شركة الزيادي' }); }
            else { const link = document.createElement('a'); link.href = canvas.toDataURL(); link.download = `فاتورة.png`; link.click(); }
        } catch (err) { console.error(err); shareContainer.style.display = 'none'; }
        btn.innerHTML = icon;
    };

    window.deleteAllInvoices = async () => {
        if (!confirm("⚠️ هل تريد حذف جميع الفواتير نهائياً؟")) return;
        try {
            const snap = await getDocs(collection(db, "invoices"));
            for (const docSnap of snap.docs) { await deleteDoc(doc(db, "invoices", docSnap.id)); }
            alert(`تم حذف الفواتير بنجاح ✅`);
            localStorage.removeItem(CACHE_KEYS.invoices);
            localStorage.removeItem(CACHE_KEYS.stats);
            loadInvoices();
        } catch (e) { alert("خطأ: " + e.message); }
    };

    window.printInv = async (id) => {
        const inv = allInvoices.find(i => i.id === id);
        let realDebt = 0;
        if(inv.customerId) {
            try {
                const cSnap = await getDoc(doc(db, "customers", inv.customerId));
                const initialBalance = cSnap.exists() ? (cSnap.data().initialBalance || 0) : 0;
                realDebt = await getRealDebt(inv.customerId, initialBalance);
            } catch(e) { realDebt = Number(inv.remaining) || 0; }
        }
        let previousBalance = realDebt - (Number(inv.remaining) || 0);

        let rows = "";
        if (inv.items && Array.isArray(inv.items)) {
            inv.items.forEach(item => {
                rows += `<tr>
                    <td style="text-align:right;">${item.name || ''}</td>
                    <td style="text-align:center;">${item.qty || 0}</td>
                    <td style="text-align:center;">${Math.round(item.price || 0).toLocaleString()}</td>
                    <td style="text-align:left;">${Math.round((item.qty || 0) * (item.price || 0)).toLocaleString()}</td>
                </tr>`;
            });
        }

        const total = Number(inv.total || 0);
        const remaining = Number(inv.remaining || 0);
        const paid = total - remaining;

        const content = `
            <html dir="rtl"><head><style>
                @page { size: 72mm auto; margin: 0; }
                body { font-family: 'Arial'; padding: 5px; width: 72mm; font-size: 13px; margin: 0 auto; color: #000; }
                .h { text-align: center; border-bottom: 2px solid #000; margin-bottom: 8px; padding-bottom: 5px; }
                table { width: 100%; border-collapse: collapse; margin-top: 5px; }
                th { border-bottom: 1px solid #000; padding: 5px 0; font-size: 11px; }
                .total-sec { border-top: 2px solid #000; margin-top: 10px; padding-top: 5px; }
                .row-val { display:flex; justify-content:space-between; margin-bottom: 4px; }
                .bold { font-weight: bold; font-size: 15px; }
                .footer { text-align:center; margin-top:15px; border-top:1px dashed #000; padding-top:5px; font-size:11px; }
            </style></head>
            <body>
                <div class="h">
                    <h3 style="margin:0">شركة الزيادي لقطع الغيار</h3>
                    <p style="margin:2px">زيوت - فلاتر السيارات</p>
                    <small>${inv.time}</small>
                </div>
                <p style="margin:5px 0;"><b>العميل:</b> ${inv.customerName || 'عميل نقدي'}</p>
                <table>
                    <thead><tr><th style="text-align:right;">الصنف</th><th>ك</th><th>سعر</th><th style="text-align:left;">إجمالي</th></tr></thead>
                    <tbody>${rows}</tbody>
                </table>
                <div class="total-sec">
                    <div class="row-val bold"><span>إجمالي الفاتورة:</span><span>${Math.round(total).toLocaleString()} ج.م</span></div>
                    <div class="row-val"><span>المسدد:</span><span>${Math.round(paid).toLocaleString()} ج.م</span></div>
                    ${remaining > 0 ? `<div class="row-val"><span>متبقي من الفاتورة:</span><span>${Math.round(remaining).toLocaleString()} ج.م</span></div>` : ''}
                    <div class="row-val" style="margin-top:5px; font-size:12px; color:#555;"><span>مديونية سابقة:</span><span>${Math.round(previousBalance).toLocaleString()} ج.م</span></div>
                    <div class="row-val bold" style="margin-top:5px; border-top:1.5px solid #000; padding-top:5px;">
                        <span>إجمالي الحساب:</span><span>${Math.round(realDebt).toLocaleString()} ج.م</span>
                    </div>
                </div>
                <div class="footer">برجاء مراجعه الفاتوره بعد استلامها <br>تواصل معنا: 01027830834</div>
            </body></html>`;
        
        const printFrame = document.getElementById('printFrame');
        const pri = printFrame.contentWindow || printFrame.contentDocument;
        pri.document.open(); pri.document.write(content); pri.document.close();
        setTimeout(() => { pri.focus(); pri.print(); }, 600);
    };

    window.showInv = (id) => {
        const inv = allInvoices.find(i => i.id === id);
        let itemsHtml = "";
        
        if (inv.items && Array.isArray(inv.items)) {
            inv.items.forEach(item => {
                itemsHtml += `<div class="d-flex justify-content-between border-bottom py-2 small fw-bold">
                    <span>${item.name} <span class="text-muted">(x${item.qty})</span></span>
                    <span>${Math.round(item.qty * (item.price || 0)).toLocaleString('ar-EG')}</span>
                </div>`;
            });
        }
        
        document.getElementById('modalBody').innerHTML = `
            <div class="text-center mb-2"><h6 class="fw-bold mt-2 small">تفاصيل الفاتورة</h6></div>
            ${itemsHtml || '<p class="text-center small">لا توجد أصناف</p>'}
            <div class="mt-3 p-2 rounded bg-light border small">
                <div class="d-flex justify-content-between fw-bold mb-1"><span>الإجمالي:</span><span>${Math.round(inv.total).toLocaleString('ar-EG')}</span></div>
                <div class="d-flex justify-content-between fw-bold text-danger"><span>المتبقي:</span><span>${Math.round(inv.remaining || 0).toLocaleString('ar-EG')}</span></div>
            </div>`;
        new bootstrap.Modal(document.getElementById('viewModal')).show();
    };

    window.editInv = (id) => window.location.href = `sales-invoice.html?edit=${id}`;

    window.deleteInv = async (id) => {
        if (!confirm("⚠️ حذف الفاتورة؟ سيتم تعديل المخزون والمديونية تلقائياً.")) return;
        const inv = allInvoices.find(i => i.id === id);

        try {
            if (inv.items && Array.isArray(inv.items)) {
                for (const item of inv.items) {
                    const qtyPcs = item.unit === "box" ? item.qty * (item.unitFactor || 1) : item.qty;
                    if (item.stockId) {
                        try { await updateDoc(doc(db, "inventory", item.stockId), { totalPcs: increment(qtyPcs) }); } catch(err) { }
                    }
                }
            }
            await deleteDoc(doc(db, "invoices", id));
            if (inv.customerId && inv.remaining > 0) {
                try { await updateDoc(doc(db, "customers", inv.customerId), { currentBalance: increment(-inv.remaining) }); } catch(err) { }
            }
            alert("تم حذف الفاتورة وتعديل المخزون بنجاح ✅");
            loadInvoices();
        } catch (e) { alert("خطأ: " + e.message); }
    };

    document.getElementById('searchInput').oninput = (e) => {
        playTypeSound();
        const val = e.target.value.toLowerCase();
        document.querySelectorAll('.inv-card').forEach(card => {
            card.style.display = card.dataset.name.toLowerCase().includes(val) ? 'block' : 'none';
        });
    };

    loadInvoices();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
