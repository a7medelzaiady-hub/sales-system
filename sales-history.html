<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل المبيعات - شركة الزيادي</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
:root{
    --accent:#0b5e3d;
    --header-bg:#0b5e3d;
    --bg-light:#f4f7f6;
    --text-primary:#1b2e26;
    --border:#dce3de;
    --white:#fff;
    --danger:#d90429;
    --info:#0d6efd;
    --success:#2d6a4f;
}
body{background:var(--bg-light);font-family:'Cairo';}
</style>
</head>

<body>

<div class="container p-3">
    <h4>سجل المبيعات</h4>
</div>

<div id="listContainer"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
    initializeFirestore,
    persistentLocalCache,
    collection,
    getDocs,
    query,
    doc,
    deleteDoc,
    updateDoc,
    increment,
    where,
    onSnapshot,
    getDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* ================= Firebase ================= */
const firebaseConfig = {
    apiKey: "YOUR_KEY",
    authDomain: "YOUR_DOMAIN",
    projectId: "YOUR_PROJECT"
};

const app = initializeApp(firebaseConfig);
const db = initializeFirestore(app, {
    localCache: persistentLocalCache()
});

/* ================= DATA ================= */
let allInvoices = [];
let transactionsCache = [];

/* ================= DATE HELPERS (FIXED) ================= */

function isToday(t) {
    if (!t) return false;

    const d = (typeof t?.toDate === "function")
        ? t.toDate()
        : new Date(t);

    if (isNaN(d.getTime())) return false;

    const today = new Date();

    return d.getFullYear() === today.getFullYear() &&
           d.getMonth() === today.getMonth() &&
           d.getDate() === today.getDate();
}

function normalizeDate(t) {
    if (!t) return 0;

    const d = (typeof t?.toDate === "function")
        ? t.toDate()
        : new Date(t);

    return isNaN(d.getTime()) ? 0 : d.getTime();
}

function formatDateArabic(dateStr) {
    if (!dateStr) return "";

    const d = (typeof dateStr?.toDate === "function")
        ? dateStr.toDate()
        : new Date(dateStr);

    if (isNaN(d.getTime())) return "";

    const months = [
        "يناير","فبراير","مارس","أبريل","مايو","يونيو",
        "يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"
    ];

    return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

/* ================= STATS ================= */

function calculateStats() {

    let totalSales = 0;

    let todaySalesSum = 0;
    let todayCash = 0;
    let todayWallet = 0;
    let todayRemSum = 0;

    let totalCash = 0;
    let totalWallet = 0;

    for (const inv of allInvoices) {

        const total = Number(inv.total || 0);
        const remaining = Number(inv.remaining || 0);
        const paid = total - remaining;

        totalSales += total;

        totalCash += Number(inv.cashPaid || 0);
        totalWallet += Number(inv.walletPaid || 0);

        const date = inv.timestamp || inv.time;

        if (isToday(date)) {
            todaySalesSum += total;
            todayRemSum += remaining;
            todayCash += Number(inv.cashPaid || 0);
            todayWallet += Number(inv.walletPaid || 0);
        }
    }

    return {
        totalSales,
        todaySalesSum,
        todayCash,
        todayWallet,
        todayRemSum,
        totalCash,
        totalWallet
    };
}

/* ================= RENDER ================= */

function render() {
    const container = document.getElementById('listContainer');

    if (allInvoices.length === 0) {
        container.innerHTML = "لا توجد فواتير";
        return;
    }

    container.innerHTML = allInvoices.map(inv => `
        <div style="padding:10px;border-bottom:1px solid #ddd">
            <b>${inv.customerName || 'عميل'}</b><br>
            <small>${formatDateArabic(inv.time)}</small><br>
            <span>${Math.round(inv.total || 0)} ج.م</span>
        </div>
    `).join('');
}

/* ================= REACT ================= */

function recalcAndRender() {

    const stats = calculateStats();

    document.getElementById('listContainer').innerHTML = `
        <div style="padding:10px">
            <h5>إجمالي: ${stats.totalSales}</h5>
            <h5>اليوم: ${stats.todaySalesSum}</h5>
        </div>
    `;

    render();
}

/* ================= FIRESTORE ================= */

function listenToInvoices() {

    const invoicesRef = collection(db, "invoices");

    onSnapshot(invoicesRef, (snap) => {

        allInvoices = snap.docs.map(d => ({
            id: d.id,
            ...d.data()
        }));

        allInvoices.sort((a, b) =>
            normalizeDate(b.time) - normalizeDate(a.time)
        );

        recalcAndRender();
    });

}

/* ================= START ================= */

listenToInvoices();

</script>

</body>
</html>
