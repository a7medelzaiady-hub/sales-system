<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل المبيعات والإحصائيات - شركة الزيادي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --accent: #0b5e3d;        
            --header-bg: #0b5e3d;     
            --bg-light: #f4f7f6;      
            --text-primary: #1b2e26;   
            --text-secondary: #4a5568; 
            --border: #dce3de;        
            --white: #ffffff;
            --danger: #d90429;
            --success: #2d6a4f;
            --warning: #ffb703;
            --purple: #6f42c1;
            --card-radius: 14px;
            --input-radius: 10px;
        }
        
        body { 
            background: var(--bg-light); 
            font-family: 'Cairo', sans-serif; 
            color: var(--text-primary); 
            padding-bottom: 60px; 
            font-size: 0.85rem;
        }

        .header-nav { 
            background: var(--header-bg); 
            padding: 10px 15px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); 
            color: white; 
            position: sticky; 
            top: 0; 
            z-index: 1000;
        }

        .add-btn { background: rgba(255,255,255,0.2); width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; text-decoration: none; font-size: 0.9rem; }
        .add-btn:hover { background: rgba(255,255,255,0.3); color: white; }
        
        .stat-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--card-radius);
            padding: 10px 12px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.02);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .stat-icon {
            width: 38px; height: 38px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; color: white;
        }

        .invoice-item {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--card-radius);
            padding: 12px;
            margin-bottom: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            transition: all 0.2s ease;
        }
        .invoice-item:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(0,0,0,0.04); }

        .detail-badge {
            font-size: 0.7rem;
            padding: 3px 6px;
            border-radius: 6px;
            font-weight: 600;
            background: #f0f4f2;
            color: var(--text-secondary);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .financial-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            background: #f8faf9;
            padding: 8px;
            border-radius: 8px;
            margin-top: 8px;
            border: 1px dashed var(--border);
        }
        .fin-box {
            font-size: 0.72rem;
            font-weight: 700;
        }
        .fin-box span { display: block; font-size: 0.8rem; margin-top: 1px; font-weight: 800; }

        .search-box {
            border: 1px solid var(--border);
            border-radius: var(--input-radius);
            padding: 8px 12px;
            font-weight: 600;
            font-size: 0.82rem;
        }
        .search-box:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(11, 94, 61, 0.15); }
    </style>
</head>
<body>

<div class="header-nav">
    <a href="index.html" class="add-btn"><i class="fas fa-arrow-right"></i></a>
    <h6 class="m-0 fw-bold" style="font-size: 0.9rem;"><i class="fas fa-history me-1"></i> سجل الإحصائيات والمبيعات</h6>
    <a href="sales-invoice.html" class="add-btn"><i class="fas fa-plus"></i></a>
</div>

<div class="container px-2 mt-2">
    <!-- قسم الإحصائيات المظبوط والمنسق بخطوط أصغر -->
    <div class="row g-2 mb-3">
        <div class="col-6">
            <div class="stat-card">
                <div class="stat-icon" style="background: var(--accent);"><i class="fas fa-money-bill-wave"></i></div>
                <div>
                    <small class="text-muted d-block" style="font-size: 0.65rem; font-weight:700;">إجمالي الكاش</small>
                    <span class="fw-bold" id="statCash" style="font-size: 0.85rem;">0.00</span>
                </div>
            </div>
        </div>
        <div class="col-6">
            <div class="stat-card">
                <div class="stat-icon" style="background: var(--purple);"><i class="fas fa-mobile-alt"></i></div>
                <div>
                    <small class="text-muted d-block" style="font-size: 0.65rem; font-weight:700;">إجمالي المحفظة</small>
                    <span class="fw-bold" id="statWallet" style="font-size: 0.85rem;">0.00</span>
                </div>
            </div>
        </div>
        <div class="col-6">
            <div class="stat-card">
                <div class="stat-icon" style="background: var(--warning);"><i class="fas fa-hand-holding-usd"></i></div>
                <div>
                    <small class="text-muted d-block" style="font-size: 0.65rem; font-weight:700;">إجمالي الآجل</small>
                    <span class="fw-bold" id="statRemaining" style="font-size: 0.85rem;">0.00</span>
                </div>
            </div>
        </div>
        <div class="col-6">
            <div class="stat-card">
                <div class="stat-icon" style="background: #212529;"><i class="fas fa-calculator"></i></div>
                <div>
                    <small class="text-muted d-block" style="font-size: 0.65rem; font-weight:700;">المبيعات الكلية</small>
                    <span class="fw-bold" id="statTotalSales" style="font-size: 0.85rem;">0.00</span>
                </div>
            </div>
        </div>
    </div>

    <!-- حقل البحث -->
    <div class="mb-2">
        <input type="text" id="searchInput" class="form-control search-box" placeholder="البحث باسم العميل أو طريقة السداد..." oninput="filterInvoices()">
    </div>

    <!-- حاوية عرض الفواتير -->
    <div id="invoicesList">
        <div class="text-center py-5 text-muted">
            <i class="fas fa-spinner fa-spin fa-2x"></i>
            <p class="mt-2 font-weight-bold" style="font-size: 0.8rem;">جاري تحميل سجل الفواتير...</p>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy, deleteDoc, doc, increment, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
        authDomain: "ahmedelzaiady.firebaseapp.com",
        projectId: "ahmedelzaiady",
        storageBucket: "ahmedelzaiady.firebasestorage.app",
        messagingSenderId: "300306825071",
        appId: "1:300306825071:web:0426ddde56280fa090329a",
        measurementId: "G-WE04GK5XZZ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let allInvoices = [];
    let customersData = {};

    async function loadCustomersAndInvoices() {
        try {
            // 1. جلب بيانات العملاء للـ الحساب الابتدائي
            const custSnap = await getDocs(collection(db, "customers"));
            custSnap.forEach(d => {
                customersData[d.id] = { id: d.id, name: d.name, initialBalance: Number(d.data().initialBalance) || 0 };
            });

            // 2. جلب حركات القبض والصرف
            const transSnap = await getDocs(collection(db, "transactions"));
            let transByCustomer = {};
            transSnap.forEach(doc => {
                const tr = doc.data();
                if (!transByCustomer[tr.partyId]) transByCustomer[tr.partyId] = 0;
                if (tr.type === 'قبض') transByCustomer[tr.partyId] -= (Number(tr.amount) || 0);
                else if (tr.type === 'صرف') transByCustomer[tr.partyId] += (Number(tr.amount) || 0);
            });

            // 3. تحميل الفواتير تصاعدياً لحساب الرصيد السابق التراكمي بدقة
            const invQuery = query(collection(db, "invoices"), orderBy("timestamp", "asc"));
            const invSnap = await getDocs(invQuery);
            
            let runningBalances = {}; 
            let tempInvoices = [];

            invSnap.forEach(doc => {
                const data = doc.data();
                const cid = data.customerId;
                
                if (!runningBalances[cid]) {
                    runningBalances[cid] = (customersData[cid]?.initialBalance || 0) + (transByCustomer[cid] || 0);
                }

                const previousBalance = runningBalances[cid];
                runningBalances[cid] += (Number(data.remaining) || 0);

                tempInvoices.push({
                    id: doc.id,
                    ...data,
                    previousBalance: previousBalance 
                });
            });

            // عكس المصفوفة لعرض الأحدث أولاً للتاجر
            allInvoices = tempInvoices.reverse();
            
            calculateStats();
            renderInvoices(allInvoices);

        } catch (e) {
            console.error("Error:", e);
            document.getElementById('invoicesList').innerHTML = `<div class="alert alert-danger text-center p-2" style="font-size:0.75rem;">حدث خطأ أثناء تحميل البيانات.</div>`;
        }
    }

    // دالة الإحصائيات الدقيقة - فصل الكاش والمحفظة تماماً
    function calculateStats() {
        let totalCash = 0;
        let totalWallet = 0;
        let totalRemaining = 0;
        let totalSales = 0;

        allInvoices.forEach(inv => {
            totalCash += (Number(inv.cashAmount) || 0);
            totalWallet += (Number(inv.walletAmount) || 0);
            totalRemaining += (Number(inv.remaining) || 0);
            totalSales += (Number(inv.total) || 0);
        });

        document.getElementById('statCash').innerText = totalCash.toFixed(2) + " ج.م";
        document.getElementById('statWallet').innerText = totalWallet.toFixed(2) + " ج.م";
        document.getElementById('statRemaining').innerText = totalRemaining.toFixed(2) + " ج.م";
        document.getElementById('statTotalSales').innerText = totalSales.toFixed(2) + " ج.م";
    }

    // دالة عرض سجل الفواتير بالتنسيق المنسق ومقاس خط مريح
    function renderInvoices(invoices) {
        const container = document.getElementById('invoicesList');
        if (invoices.length === 0) {
            container.innerHTML = `<div class="text-center py-4 text-muted fw-bold" style="font-size:0.8rem;">لا توجد فواتير مسجلة.</div>`;
            return;
        }

        container.innerHTML = invoices.map(inv => {
            let methodBadgeColor = "bg-secondary";
            if(inv.paymentMethod === "سداد نقدي") methodBadgeColor = "bg-success";
            else if(inv.paymentMethod === "سداد محفظة") methodBadgeColor = "bg-primary";
            else if(inv.paymentMethod === "سداد كاش ومحفظة") methodBadgeColor = "bg-info text-dark";
            else if(inv.paymentMethod === "آجل") methodBadgeColor = "bg-warning text-dark";

            const cashPaid = Number(inv.cashAmount) || 0;
            const walletPaid = Number(inv.walletAmount) || 0;
            const totalPaid = Number(inv.paid) || (cashPaid + walletPaid);

            return `
                <div class="invoice-item">
                    <div class="d-flex justify-content-between align-items-start mb-1">
                        <div>
                            <h6 class="fw-bold mb-1 text-dark" style="font-size: 0.85rem;">${inv.customerName || 'عميل نقدي'}</h6>
                            <span class="detail-badge"><i class="far fa-clock"></i> ${inv.time || ''}</span>
                            <span class="badge ${methodBadgeColor} ms-1" style="font-size:0.65rem; padding: 3px 6px;">${inv.paymentMethod || 'غير محدد'}</span>
                        </div>
                        <div class="d-flex gap-1">
                            <button class="btn btn-sm btn-outline-primary" style="border-radius:6px; padding: 2px 6px; font-size:0.7rem;" onclick="editInvoice('${inv.id}')"><i class="fas fa-edit"></i></button>
                            <button class="btn btn-sm btn-outline-danger" style="border-radius:6px; padding: 2px 6px; font-size:0.7rem;" onclick="deleteInvoice('${inv.id}')"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>

                    <!-- شبكة الحساب المالي الموسع والمنسق بخط أصغر وأنيق -->
                    <div class="financial-grid">
                        <div class="fin-box text-dark">
                            <i class="fas fa-file-invoice-dollar text-muted me-1"></i> إجمالي الفاتورة
                            <span class="text-dark">${(Number(inv.total) || 0).toFixed(2)}</span>
                        </div>
                        <div class="fin-box text-success">
                            <i class="fas fa-check-circle me-1"></i> دفع كام (المسدد)
                            <span>${totalPaid.toFixed(2)}</span>
                        </div>
                        <div class="fin-box text-danger">
                            <i class="fas fa-exclamation-circle me-1"></i> الأجل (المتبقي)
                            <span>${(Number(inv.remaining) || 0).toFixed(2)}</span>
                        </div>
                        <div class="fin-box text-secondary">
                            <i class="fas fa-wallet me-1"></i> سابق كان كام
                            <span>${(Number(inv.previousBalance) || 0).toFixed(2)}</span>
                        </div>
                    </div>
                    
                    ${(cashPaid > 0 && walletPaid > 0) ? `
                    <div class="mt-1 text-muted" style="font-size: 0.65rem; font-weight: 600; padding-right: 4px;">
                        <i class="fas fa-info-circle me-1"></i> تفصيل: (${cashPaid.toFixed(2)} كاش + ${walletPaid.toFixed(2)} محفظة)
                    </div>` : ''}
                </div>
            `;
        }).join('');
    }

    window.filterInvoices = () => {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        if(!query) {
            renderInvoices(allInvoices);
            return;
        }
        const filtered = allInvoices.filter(inv => 
            (inv.customerName && inv.customerName.toLowerCase().includes(query)) || 
            (inv.paymentMethod && inv.paymentMethod.toLowerCase().includes(query))
        );
        renderInvoices(filtered);
    };

    window.editInvoice = (id) => {
        window.location.href = `sales-invoice.html?edit=${id}`;
    };

    window.deleteInvoice = async (id) => {
        if (!confirm("هل أنت متأكد من حذف هذه الفاتورة؟ سيتم ضبط كميات المخزن وحساب العميل تلقائياً.")) return;
        try {
            const invRef = doc(db, "invoices", id);
            const snap = await getDocs(query(collection(db, "invoices")));
            const targetDoc = snap.docs.find(d => d.id === id);
            
            if (targetDoc && targetDoc.exists()) {
                const data = targetDoc.data();
                for (const item of data.items || []) {
                    const invStockRef = doc(db, "inventory", item.stockId);
                    const stockSnap = await getDocs(query(collection(db, "inventory")));
                    const currentProduct = stockSnap.docs.find(i => i.id === item.stockId);
                    if(currentProduct) {
                        const factor = Number(currentProduct.data().unitFactor) || 1;
                        const qtyPcs = item.unit === 'box' ? (item.qty * factor) : item.qty;
                        await updateDoc(invStockRef, { totalPcs: increment(qtyPcs) });
                    }
                }
                await deleteDoc(invRef);
                alert("تم حذف الفاتورة بنجاح.");
                location.reload();
            }
        } catch (e) { alert("حدث خطأ أثناء الحذف"); console.error(e); }
    };

    loadCustomersAndInvoices();
</script>
</body>
</html>
