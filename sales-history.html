<!DOCTYPE html>  
<html lang="ar" dir="rtl">  
<head>  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>سجل المبيعات والإحصائيات - شركة الزيادي</title>  

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">  
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght=400;600;700;800&display=swap" rel="stylesheet">  
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">  

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>  
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>  

<style>  
:root {   
    --accent: #0b5e3d;          
    --header-bg: #0b5e3d;       
    --bg-light: #f4f7f6;        
    --text-primary: #1b2e26;     
    --text-secondary: #4a5568;   
    --border: #dce3de;          
    --white: #ffffff;  
    --danger: #d90429;  
    --success: #2d6a4f;  
    --warning: #ffb703;  
    --purple: #6f42c1;  
    --card-radius: 8px;  
    --input-radius: 10px;  
}  

body {   
    background: var(--bg-light);   
    font-family: 'Cairo', sans-serif;   
    color: var(--text-primary);   
    padding-bottom: 60px;   
    font-size: 0.85rem;  
}  

/* ========================= */
/* PRINT SYSTEM */
/* ========================= */

#print-area {
    display: none;
    background: #fff;
    color: #000;
    padding: 30px;
}

@media print {
    body * {
        visibility: hidden !important;
    }

    #print-area,
    #print-area * {
        visibility: visible !important;
    }

    #print-area {
        display: block !important;
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
    }
}

/* HEADER */
.header-nav {   
    background: var(--header-bg);   
    padding: 10px 15px;   
    display: flex;   
    align-items: center;   
    justify-content: space-between;   
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);   
    color: white;   
    position: sticky;   
    top: 0;   
    z-index: 1000;  
}  

.add-btn { 
    background: rgba(255,255,255,0.2); 
    width: 32px; 
    height: 32px; 
    border-radius: 8px; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    color: white; 
    text-decoration: none; 
    border: none; 
}  

.add-btn:hover { background: rgba(255,255,255,0.3); }  

.stats-section-title { 
    font-size: 0.78rem; 
    font-weight: 800; 
    color: var(--accent); 
    margin: 6px 0; 
    border-bottom: 1px solid var(--border); 
    padding-bottom: 4px; 
}  

.stat-card { 
    background: var(--white); 
    border: 1px solid var(--border); 
    border-radius: var(--card-radius); 
    padding: 8px 5px; 
    text-align: center; 
    cursor: pointer; 
    transition: 0.2s; 
}  

.stat-card:hover { 
    transform: translateY(-2px); 
}  

.stat-card.active-filter { 
    border: 2px solid var(--accent); 
    background: #ebf9eb; 
}  

.invoice-item {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
}

/* PRINT AREA */
#thermalReceiptContainer {
    display: none;
}
</style>  
</head>  

<body>  

<!-- HEADER -->  
<div class="header-nav">  
    <a href="index.html" class="add-btn"><i class="fas fa-arrow-right"></i></a>  
    <h6 class="m-0 fw-bold">سجل المبيعات والإحصائيات</h6>  
    <div class="d-flex gap-2">  
        <button class="add-btn" id="exportExcelBtn"><i class="fas fa-file-excel"></i></button>  
        <a href="sales-invoice.html" class="add-btn"><i class="fas fa-plus"></i></a>  
        <button class="add-btn" onclick="window.print()"><i class="fas fa-print"></i></button>  
    </div>  
</div>  

<!-- CONTENT -->  
<div class="container px-2 mt-2">  

    <!-- هنا باقي واجهتك زي ما هي بالكامل -->  
    <div id="invoicesList"></div>  

</div>  

<!-- ================= PRINT AREA ================= -->  
<div id="print-area">
    <h2 style="text-align:center;">تقرير المبيعات</h2>
    <table style="width:100%; border-collapse: collapse;">
        <thead>
            <tr>
                <th>التاريخ</th>
                <th>العميل</th>
                <th>الإجمالي</th>
                <th>المدفوع</th>
            </tr>
        </thead>
        <tbody id="printBody"></tbody>
    </table>
</div>

<!-- FIREBASE SCRIPT (زي ما هو بدون تغيير) -->  
<script type="module">  

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";  
import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";  

const firebaseConfig = {  
    apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",  
    authDomain: "ahmedelzaiady.firebaseapp.com",  
    projectId: "ahmedelzaiady",  
    storageBucket: "ahmedelzaiady.firebasestorage.app",  
    messagingSenderId: "300306825071",  
    appId: "1:300306825071:web:0426ddde56280fa090329a"  
};  

const app = initializeApp(firebaseConfig);  
const db = getFirestore(app);  

let allInvoices = [];  

async function loadData() {
    const snap = await getDocs(query(collection(db, "invoices"), orderBy("timestamp","desc")));

    allInvoices = snap.docs.map(d => ({ id:d.id, ...d.data() }));

    render(allInvoices);
}

function render(data) {
    document.getElementById("invoicesList").innerHTML =
        data.map(i => `
            <div class="invoice-item">
                <div>${i.customerName || "عميل"}</div>
                <div>${i.total || 0} ج.م</div>
            </div>
        `).join("");

    document.getElementById("printBody").innerHTML =
        data.map(i => `
            <tr>
                <td>${i.date || ""}</td>
                <td>${i.customerName || ""}</td>
                <td>${i.total || 0}</td>
                <td>${i.paid || 0}</td>
            </tr>
        `).join("");
}

window.print = () => {
    document.getElementById("print-area").style.display = "block";
    setTimeout(() => {
        window.print();
        document.getElementById("print-area").style.display = "none";
    }, 500);
};

loadData();

</script>  

</body>  
</html>
