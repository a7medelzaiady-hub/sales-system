<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>فاتورة شراء - شركة الزيادى</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #0e6b48;
            --primary-dark: #0a5037;
            --primary-gradient: linear-gradient(135deg, #0e6b48, #14a36f);
            --bg-light: #e8edea;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --white: #ffffff;
            --danger: #b91c1c;
            --danger-light: #fef2f2;
            --danger-border: #fca5a5;
            --success: #16a34a;
            --success-light: #f0fdf4;
            --wallet-color: #0284c7;
            --wallet-light: #f0f9ff;
            --card-shadow: 0 4px 12px rgba(11, 94, 61, 0.05);
            --hover-shadow: 0 10px 25px rgba(11, 94, 61, 0.1);
            --radius-lg: 18px;
            --radius-md: 12px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--bg-light);
            font-family: 'Cairo', sans-serif;
            color: var(--text-dark);
            padding-bottom: 40px;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .amount, .item-subtotal, .item-qty, .item-buy, #itemsCount, #cashAmount, #walletAmount {
            font-family: 'Montserrat', 'Cairo', sans-serif !important;
        }

        /* ===== HEADER ===== */
        .header {
            background: var(--primary-gradient);
            padding: 0 16px;
            height: 62px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 12px rgba(5, 46, 22, 0.3);
            color: white;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .header h6 { font-size: 1.1rem; margin: 0; font-weight: 800; }
        .clickable-icon { cursor: pointer; transition: transform .2s; opacity: .9; }
        .clickable-icon:hover { transform: scale(1.1); opacity: 1; }
        .badge-new { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); padding: 5px 12px; border-radius: 8px; font-weight: 700; font-size: 0.72rem; }

        /* ===== DATA CARD ===== */
        .data-card {
            background: var(--white);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 16px;
            margin-top: 12px;
            box-shadow: var(--card-shadow);
        }

        label { font-size: 0.78rem; margin-bottom: 6px; color: var(--primary-dark); font-weight: 800; display: flex; align-items: center; gap: 5px; }

        .form-control, .form-select {
            background: var(--white) !important;
            border: 1.5px solid var(--border-color) !important;
            color: var(--text-dark) !important;
            border-radius: var(--radius-md);
            padding: 10px 12px;
            font-size: 0.88rem;
            font-weight: 700;
            transition: all 0.2s ease;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--primary) !important;
            box-shadow: 0 0 0 3px rgba(14, 107, 72, 0.15) !important;
            outline: none;
        }

        /* ===== ITEM ROW ===== */
        .item-row {
            background: var(--white);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 16px;
            margin-bottom: 12px;
            position: relative;
            box-shadow: var(--card-shadow);
            border-right: 5px solid var(--primary);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .item-row.is-return { border-right: 5px solid var(--danger); background: var(--danger-light); }

        .btn-remove {
            position: absolute;
            top: -8px;
            left: -8px;
            background: var(--danger);
            color: #fff;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            cursor: pointer;
            z-index: 10;
            border: 2px solid var(--white);
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        .add-item-btn {
            background: var(--success-light);
            color: var(--primary-dark);
            border: 2px dashed var(--primary);
            width: 100%;
            margin: 12px 0;
            padding: 12px;
            border-radius: var(--radius-md);
            font-weight: 800;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .add-item-btn:active { transform: scale(0.98); background: var(--primary); color: white; }

        .return-check-container {
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--danger-light);
            padding: 10px;
            border-radius: var(--radius-md);
            border: 1px solid var(--danger-border);
            height: 46px;
        }
        .form-check-input.item-is-return:checked { background-color: var(--danger); border-color: var(--danger); }

        .subtotal-display { background: var(--success-light); border-radius: 10px; padding: 6px 12px; border: 1px solid #bbf7d0; color: var(--primary-dark); font-weight: 800; }

        /* ===== SUMMARY GRID IN THE FOOTER ===== */
        .invoice-footer {
            background: var(--white);
            padding: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 -4px 15px rgba(0,0,0,0.04);
            border-radius: var(--radius-lg);
            margin: 20px 0;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }
        
        .grid-cell {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: var(--radius-md);
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
        }
        .grid-cell.full-width { grid-column: span 2; }
        .grid-cell .cell-title { font-size: 0.72rem; color: var(--text-muted); font-weight: 700; margin-bottom: 2px; }
        .grid-cell .cell-val { font-size: 1.05rem; font-weight: 800; color: var(--text-dark); }
        
        .summary-grid .cell-gross { background: #f0fdf4 !important; border-color: #bbf7d0 !important; }
        .summary-grid .cell-gross .cell-val { color: var(--primary) !important; font-size: 1.15rem; }
        .summary-grid .cell-cash { background: #f0fdf4 !important; border-color: #bbf7d0 !important; }
        .summary-grid .cell-cash .cell-val { color: var(--success) !important; }
        .summary-grid .cell-wallet { background: #f0f9ff !important; border-color: #bae6fd !important; }
        .summary-grid .cell-wallet .cell-val { color: var(--wallet-color) !important; }
        .summary-grid .cell-pending { background: #fef2f2 !important; border-color: #fca5a5 !important; }
        .summary-grid .cell-pending .cell-val { color: var(--danger) !important; font-size: 1.25rem; }
        .summary-grid .cell-final { background: var(--primary-gradient) !important; border: none !important; color: white !important; }
        .summary-grid .cell-final .cell-title { color: rgba(255,255,255,0.7) !important; }
        .summary-grid .cell-final .cell-val { color: white !important; font-size: 1.3rem; }

        .btn-save {
            background: var(--primary-gradient);
            color: #fff;
            border: none;
            padding: 14px 0;
            border-radius: var(--radius-md);
            font-weight: 800;
            font-size: 1rem;
            width: 100%;
            box-shadow: 0 4px 12px rgba(11, 94, 61, 0.2);
            transition: all 0.2s;
        }
        .btn-save:active { transform: scale(0.99); opacity: 0.95; }

        .section-label {
            font-size: .75rem; font-weight: 800; color: var(--text-muted);
            padding: 12px 4px 4px; display: flex; align-items: center; gap: 6px;
        }
        .section-label::after { content:''; flex:1; height:1px; background: var(--border-color); }
    </style>
</head>
<body>

<!-- القائمة المنسدلة الموحدة التي ستحتوي على مقترحات مخزون الأصناف -->
<datalist id="productsData"></datalist>

<div class="header">
    <div class="d-flex align-items-center gap-3">
        <i class="fas fa-arrow-right clickable-icon fs-5" id="btnBack" title="رجوع"></i>
        <i class="fas fa-home clickable-icon fs-5" id="btnHome" title="الرئيسية"></i>
    </div>
    <h6>فاتورة شراء جديدة</h6>
    <div id="statusBadge" class="badge-new">جديدة</div>
</div>

<div class="container-fluid px-2">
    <div class="data-card">
        <div class="row g-2">
            <div class="col-6">
                <label><i class="fas fa-calendar-day"></i> تاريخ الفاتورة</label>
                <input type="date" id="invDate" class="form-control">
            </div>
            <div class="col-6">
                <label><i class="fas fa-truck-field"></i> اسم المورد المستحق</label>
                <select id="supplierSelect" class="form-select">
                    <option value="">جاري تحميل الموردين...</option>
                </select>
            </div>
            <div class="col-6">
                <label class="text-success"><i class="fas fa-money-bill-wave"></i> سداد نقدي (كاش)</label>
                <input type="number" step="0.01" id="cashAmount" class="form-control border-success text-center fw-bold text-success" value="0.00" onfocus="if(this.value=='0.00'||this.value=='0')this.value=''">
            </div>
            <div class="col-6">
                <label style="color: var(--wallet-color);"><i class="fas fa-mobile-screen-button"></i> سداد محفظة</label>
                <input type="number" step="0.01" id="walletAmount" class="form-control text-center fw-bold" style="border-color: var(--wallet-color); color: var(--wallet-color);" value="0.00" onfocus="if(this.value=='0.00'||this.value=='0')this.value=''">
            </div>
        </div>
    </div>

    <div class="section-label"><i class="fas fa-list-ul"></i> أصناف الفاتورة</div>
    <div id="itemsList" class="mt-1"></div>

    <button type="button" class="add-item-btn" id="addItemBtn">
        <i class="fas fa-plus me-1"></i> إضافة صنف جديد للفاتورة
    </button>

    <div class="invoice-footer" id="invoiceSummaryCard">
        <div class="summary-grid">
            <div class="grid-cell">
                <span class="cell-title"><i class="fas fa-boxes"></i> عدد البنود الحالية</span>
                <span class="cell-val" id="itemsCount">0</span>
            </div>
            <div class="grid-cell">
                <span class="cell-title"><i class="fas fa-wallet"></i> الحساب السابق للمورد</span>
                <span class="cell-val" id="displayPreviousBalance">0.00</span>
            </div>
            <div class="grid-cell cell-gross">
                <span class="cell-title"><i class="fas fa-calculator"></i> إجمالي الفاتورة الصافي</span>
                <span class="cell-val amount" id="grossTotal">0.00</span>
            </div>
            <div class="grid-cell cell-cash">
                <span class="cell-title"><i class="fas fa-money-bill-check"></i> مدفوع نقداً (كاش)</span>
                <span class="cell-val amount" id="displayCash">0.00</span>
            </div>
            <div class="grid-cell cell-wallet">
                <span class="cell-title"><i class="fas fa-mobile-button"></i> مدفوع محفظة إلكترونية</span>
                <span class="cell-val amount" id="displayWallet">0.00</span>
            </div>
            <div class="grid-cell cell-pending">
                <span class="cell-title"><i class="fas fa-receipt"></i> الصافي الآجل للمستند</span>
                <span class="cell-val amount" id="netTotal">0.00</span>
            </div>
            <div class="grid-cell full-width cell-final text-center align-items-center">
                <span class="cell-title"><i class="fas fa-file-invoice-dollar"></i> إجمالي الرصيد المتبقي الكلي للمورد</span>
                <span class="cell-val amount" id="totalSupplierBalance">0.00</span>
            </div>
        </div>
        <button class="btn-save" id="btnSaveInvoice">حفظ وترحيل الفاتورة للسيستم</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "./firebase-shim.js";
    import { getFirestore, collection, getDocs, addDoc, doc, getDoc, updateDoc, increment, query, where, serverTimestamp, orderBy } from "./firebase-shim.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
        authDomain: "ahmedelzaiady.firebaseapp.com",
        projectId: "ahmedelzaiady",
        storageBucket: "ahmedelzaiady.firebasestorage.app",
        messagingSenderId: "300306825071",
        appId: "1:300306825071:web:0426ddde56280fa090329a",
        measurementId: "G-WE04GK5XZZ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const editId = urlParams.get('edit');
    const orderId = urlParams.get('orderId');

    let allInventory = [];
    let suppliersBase = {};
    let allInvoicesHistory = [];
    let globalVouchersHistory = [];
    let isDataChanged = false;
    let isSubmitting = false;
    let oldInvoiceData = null;

    window.addEventListener('beforeunload', (e) => {
        if (isDataChanged && !isSubmitting) {
            e.preventDefault();
            e.returnValue = "هل تريد الخروج قبل الحفظ؟";
        }
    });

    function safeNavigate(targetUrl, useHistory = false) {
        if (isDataChanged) {
            if (!confirm("هل تريد الخروج قبل الحفظ؟ ستخسر المدخلات.")) return;
        }
        if (useHistory) window.history.back();
        else window.location.href = targetUrl;
    }

    document.getElementById('btnBack').addEventListener('click', () => safeNavigate('purchase-invoices-list.html'));
    document.getElementById('btnHome').addEventListener('click', () => safeNavigate('index1.html'));

    const cashInput = document.getElementById('cashAmount');
    const walletInput = document.getElementById('walletAmount');

    cashInput.addEventListener('input', () => { window.calculateTotal(); });
    walletInput.addEventListener('input', () => { window.calculateTotal(); });

    async function loadData() {
        const supSelect = document.getElementById('supplierSelect');
        try {
            const supSnap = await getDocs(collection(db, "suppliers"));
            supSelect.innerHTML = '<option value="">-- اختر اسم المورد المستحق --</option>';
            suppliersBase = {};
            supSnap.forEach(d => {
                const data = d.data();
                suppliersBase[d.id] = { name: data.name, openingBalance: Number(data.openingBalance) || 0 };
                supSelect.innerHTML += `<option value="${d.id}">${data.name}</option>`;
            });
        } catch (err) {
            console.error(err);
            supSelect.innerHTML = '<option value="">❌ فشل تحميل قائمة الموردين</option>';
        }

        try {
            const [transSnap, voucherSnap, invSnap] = await Promise.all([
                getDocs(query(collection(db, "supplier_transactions"), orderBy("timestamp", "asc"))),
                getDocs(collection(db, "transactions")),
                getDocs(collection(db, "inventory"))
            ]);

            globalVouchersHistory = [];
            voucherSnap.forEach(v => { globalVouchersHistory.push({ id: v.id, ...v.data() }); });

            allInvoicesHistory = [];
            transSnap.forEach(doc => {
                const data = doc.data();
                const amt = Number(data.grossTotal) || Number(data.total) || 0;
                const cashP = Number(data.cashPaid || 0);
                const walletP = Number(data.walletPaid || 0);
                const directPaid = data.totalPaid ? Number(data.totalPaid) : (cashP + walletP || Number(data.paidAmount) || 0);

                allInvoicesHistory.push({ id: doc.id, ...data, displayGross: amt, displayNetPending: amt - directPaid });
            });

            allInventory = [];
            const prodDataList = document.getElementById('productsData');
            prodDataList.innerHTML = "";
            invSnap.forEach(d => {
                const data = d.data();
                allInventory.push({ id: d.id, ...data });
                // ربط الأصناف بالـ datalist الموحدة لتظهر كقائمة منسدلة خيارات
                prodDataList.innerHTML += `<option value="${data.name}">`;
            });

        } catch (err) { console.error(err); }

        supSelect.addEventListener('change', () => { window.calculateTotal(); });

        if (editId) { await loadInvoiceForEdit(); }
        else if (orderId) { await loadOrderData(orderId); }
        else { addNewItemRow(); }

        window.calculateTotal();

        setTimeout(() => {
            document.querySelectorAll('input, select').forEach(el => {
                el.addEventListener('change', () => { isDataChanged = true; });
                el.addEventListener('input', () => { isDataChanged = true; });
            });
        }, 800);
    }

    function calculateHistoricalPreviousBalance(supId, invoiceTimestamp) {
        if (!supId || !suppliersBase[supId]) return 0;
        const supplier = suppliersBase[supId];
        let debt = 0; let credit = 0;
        const targetSeconds = invoiceTimestamp?.seconds || (Date.now() / 1000);

        globalVouchersHistory.forEach(v => {
            if (v.partyId === supId && v.timestamp && v.timestamp.seconds < targetSeconds) {
                const amt = Number(v.amount) || 0;
                if (v.type === "صرف") credit += amt;
                else if (v.type === "قبض") debt += amt;
            }
        });

        allInvoicesHistory.forEach(inv => {
            if (editId && inv.id === editId) return;
            if (inv.supplierId === supId && inv.timestamp && inv.timestamp.seconds < targetSeconds) {
                const amt = inv.displayGross;
                if (inv.type === "شراء" || inv.type === "فاتورة شراء") debt += amt;
                else if (inv.type === "مرتجع شراء") credit += amt;
            }
        });
        return (supplier.openingBalance + debt) - credit;
    }

    async function loadInvoiceForEdit() {
        document.getElementById('statusBadge').innerText = "تعديل";
        document.getElementById('statusBadge').className = "badge-new bg-warning text-dark";

        const invRef = doc(db, "supplier_transactions", editId);
        const invSnap = await getDoc(invRef);

        if (invSnap.exists()) {
            oldInvoiceData = invSnap.data();
            if (oldInvoiceData.supplierId) { document.getElementById('supplierSelect').value = oldInvoiceData.supplierId; }
            document.getElementById('invDate').value = oldInvoiceData.date;
            document.getElementById('cashAmount').value = oldInvoiceData.cashPaid || '0.00';
            document.getElementById('walletAmount').value = oldInvoiceData.walletPaid || '0.00';

            document.getElementById('itemsList').innerHTML = "";
            if (oldInvoiceData.items && oldInvoiceData.items.length > 0) {
                oldInvoiceData.items.forEach(item => { addNewItemRow(item); });
            }
            window.calculateTotal();
        }
    }

    async function loadOrderData(id) {
        try {
            const orderSnap = await getDoc(doc(db, "purchase_orders", id));
            if (orderSnap.exists()) {
                const data = orderSnap.data();
                if (data.supplierId) { document.getElementById('supplierSelect').value = data.supplierId; }
                document.getElementById('itemsList').innerHTML = "";
                data.items.forEach(item => {
                    addNewItemRow({ name: item.name, qty: item.qty, returnQty: item.returnQty || 0, buy: item.buy || 0, unitName: item.unitName || 'كرتونة' });
                });
                window.calculateTotal();
            }
        } catch (e) { console.error(e); }
    }

    window.addNewItemRow = (itemData = null) => {
        const id = Date.now() + Math.random();
        const currentUnit = itemData ? (itemData.unitName || 'كرتونة') : 'كرتونة';
        const isReturnChecked = itemData && itemData.returnQty > 0;
        isDataChanged = true;

        const html = `
            <div class="item-row ${isReturnChecked ? 'is-return' : ''}" id="row_${id}">
                <div class="btn-remove" onclick="this.parentElement.remove(); window.calculateTotal();"><i class="fas fa-times"></i></div>
                <div class="row g-2">
                    <div class="col-12">
                        <label><i class="fas fa-tag"></i> اسم الصنف (قائمة منسدلة خيارات)</label>
                        <!-- تم إضافة الـ list لترتبط بالقائمة المنسدلة مباشرة بمتصفحات الموبايل والكمبيوتر -->
                        <input type="text" list="productsData" class="form-control item-name" value="${itemData ? itemData.name : ''}" placeholder="اكتب أول حرف لتظهر قائمة الأصناف فوراً...">
                    </div>
                    <div class="col-6">
                        <label><i class="fas fa-boxes-stacked"></i> نوع الوحدة</label>
                        <select class="form-select item-unit">
                            <option value="كرتونة" ${currentUnit === 'كرتونة' ? 'selected' : ''}>كرتونة</option>
                            <option value="قطعة" ${currentUnit === 'قطعة' ? 'selected' : ''}>قطعة</option>
                        </select>
                    </div>
                    <div class="col-6 d-flex flex-column justify-content-end">
                        <div class="return-check-container">
                            <div class="form-check form-switch m-0 d-flex align-items-center gap-2">
                                <input class="form-check-input item-is-return" type="checkbox" id="check_${id}" ${isReturnChecked ? 'checked' : ''}>
                                <label class="form-check-label text-danger fw-bold m-0" for="check_${id}">كمرتجع ↩</label>
                            </div>
                        </div>
                    </div>
                    <div class="col-6">
                        <label class="text-success" id="label_qty_${id}">العدد الحالي (${currentUnit})</label>
                        <input type="number" step="0.01" class="form-control item-qty" value="${itemData ? (isReturnChecked ? itemData.returnQty : itemData.qty) : '1'}">
                    </div>
                    <div class="col-6">
                        <label id="label_price_${id}">سعر الـ (${currentUnit})</label>
                        <input type="number" step="0.01" class="form-control item-buy" value="${itemData ? itemData.buy : ''}" placeholder="0.00">
                    </div>
                    <div class="col-12 mt-2">
                        <div class="subtotal-display text-center">
                            <span style="font-size:0.72rem; color:var(--text-muted); display:block;">الصافي الفرعي للبنود</span>
                            <input type="text" class="item-subtotal border-0 bg-transparent fw-bold text-center w-100 fs-5 p-0" readonly value="0.00">
                        </div>
                    </div>
                </div>
            </div>`;
        document.getElementById('itemsList').insertAdjacentHTML('beforeend', html);
        setupRowEvents(id);
        window.calculateTotal();
    }

    function setupRowEvents(id) {
        const row = document.getElementById(`row_${id}`);
        const nameInput = row.querySelector('.item-name');
        const unitSelect = row.querySelector('.item-unit');
        const returnCheck = row.querySelector('.item-is-return');

        returnCheck.addEventListener('change', (e) => {
            if(e.target.checked) row.classList.add('is-return');
            else row.classList.remove('is-return');
            window.calculateTotal();
        });

        unitSelect.addEventListener('change', (e) => {
            const val = e.target.value;
            document.getElementById(`label_qty_${id}`).innerText = `العدد الحالي (${val})`;
            document.getElementById(`label_price_${id}`).innerText = `سعر الـ (${val})`;
            window.calculateTotal();
        });

        // آلية تعبئة البيانات التلقائية عند اختيار صنف من القائمة المنسدلة المنبثقة
        nameInput.addEventListener('change', (e) => {
            const found = allInventory.find(p => p.name === e.target.value);
            if(found) {
                row.querySelector('.item-buy').value = found.buy || 0;
                unitSelect.value = "كرتونة";
                unitSelect.dispatchEvent(new Event('change'));
            } else if (e.target.value !== "") {
                alert("الصنف غير مسجل بالنظام! يرجى اختيار صنف صحيح من القائمة المنسدلة.");
                e.target.value = "";
            }
            window.calculateTotal();
        });

        row.querySelectorAll('input, select').forEach(input => {
            input.addEventListener('input', window.calculateTotal);
            input.addEventListener('change', window.calculateTotal);
        });
    }

    window.calculateTotal = () => {
        let grossTotal = 0;
        const rows = document.querySelectorAll('.item-row');
        document.getElementById('itemsCount').innerText = rows.length;

        rows.forEach(row => {
            const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
            const buy = parseFloat(row.querySelector('.item-buy').value) || 0;
            const isReturn = row.querySelector('.item-is-return').checked;

            const sub = qty * buy * (isReturn ? -1 : 1);
            const subEl = row.querySelector('.item-subtotal');
            subEl.value = sub.toFixed(2);
            subEl.style.color = isReturn ? 'var(--danger)' : 'var(--primary-dark)';
            grossTotal += sub;
        });

        document.getElementById('grossTotal').innerText = grossTotal.toFixed(2);

        let cashVal = parseFloat(cashInput.value) || 0;
        let walletVal = parseFloat(walletInput.value) || 0;

        let totalPaid = cashVal + walletVal;
        let pendingVal = grossTotal - totalPaid;

        document.getElementById('displayCash').innerText = cashVal.toFixed(2);
        document.getElementById('displayWallet').innerText = walletVal.toFixed(2);
        document.getElementById('netTotal').innerText = pendingVal.toFixed(2);

        const supplierId = document.getElementById('supplierSelect').value;
        let prevBalance = 0;

        if (supplierId && suppliersBase[supplierId]) {
            const targetTimestamp = editId ? oldInvoiceData?.timestamp : null;
            prevBalance = calculateHistoricalPreviousBalance(supplierId, targetTimestamp);
        }
        document.getElementById('displayPreviousBalance').innerText = prevBalance.toFixed(2);

        let totalSupplierFinal = prevBalance + pendingVal;
        document.getElementById('totalSupplierBalance').innerText = totalSupplierFinal.toFixed(2);
    };

    document.getElementById('btnSaveInvoice').addEventListener('click', async () => {
        const btn = document.getElementById('btnSaveInvoice');
        const supplierId = document.getElementById('supplierSelect').value;
        const grossTotal = parseFloat(document.getElementById('grossTotal').innerText) || 0;
        const cashPaid = parseFloat(document.getElementById('cashAmount').value) || 0;
        const walletPaid = parseFloat(document.getElementById('walletAmount').value) || 0;
        const totalPaid = cashPaid + walletPaid;
        const invoiceDate = document.getElementById('invDate').value;
        const pendingAmount = grossTotal - totalPaid;
        const rows = document.querySelectorAll('.item-row');

        if(!supplierId) return alert("برجاء اختيار اسم المورد أولاً");
        if(rows.length === 0) return alert("برجاء إضافة الأصناف أولاً");

        for (const row of rows) {
            const name = row.querySelector('.item-name').value.trim();
            const isExist = allInventory.some(p => p.name === name);
            if (!isExist || name === "") {
                alert(`خطأ: الصنف "${name}" غير مسجل! يرجى اختياره بشكل صحيح.`);
                return;
            }
        }

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> جاري الحفظ وتحديث المخزن...';

        try {
            if (editId && oldInvoiceData) {
                const oldGross = Number(oldInvoiceData.grossTotal || oldInvoiceData.total || 0);
                const oldCash = Number(oldInvoiceData.cashPaid || 0);
                const oldWallet = Number(oldInvoiceData.walletPaid || 0);
                const oldDebt = oldGross - (oldCash + oldWallet);
                if (oldDebt !== 0 && suppliersBase[oldInvoiceData.supplierId]) {
                    await updateDoc(doc(db, "suppliers", oldInvoiceData.supplierId), { currentBalance: increment(-oldDebt) });
                }

                if (Array.isArray(oldInvoiceData.items)) {
                    for (const oldItem of oldInvoiceData.items) {
                        const oldModifier = (typeof oldItem.totalPieces === 'number') ? oldItem.totalPieces : ((Number(oldItem.qty) || 0) - (Number(oldItem.returnQty) || 0));
                        if (!oldModifier) continue;
                        const qOld = query(collection(db, "inventory"), where("name", "==", oldItem.name));
                        const qOldSnap = await getDocs(qOld);
                        if (!qOldSnap.empty) {
                            await updateDoc(doc(db, "inventory", qOldSnap.docs[0].id), { qty: increment(-oldModifier), totalPcs: increment(-oldModifier) });
                        }
                    }
                }
            }

            const items = [];
            for (const row of rows) {
                const name = row.querySelector('.item-name').value;
                const qtyInput = parseFloat(row.querySelector('.item-qty').value) || 0;
                const buy = parseFloat(row.querySelector('.item-buy').value) || 0;
                const unitName = row.querySelector('.item-unit').value;
                const isReturn = row.querySelector('.item-is-return').checked;

                let qty = isReturn ? 0 : qtyInput;
                let returnQty = isReturn ? qtyInput : 0;
                const finalQtyModifier = isReturn ? -qtyInput : qtyInput;

                items.push({ name, qty, returnQty, buy, unitName, unitFactor: 1, totalPieces: finalQtyModifier });

                const q = query(collection(db, "inventory"), where("name", "==", name));
                const qSnap = await getDocs(q);
                if(!qSnap.empty) {
                    await updateDoc(doc(db, "inventory", qSnap.docs[0].id), {
                        qty: increment(finalQtyModifier), totalPcs: increment(finalQtyModifier),
                        buy: buy, unitName: unitName, lastUpdate: serverTimestamp()
                    });
                }
            }

            let finalPaymentType = "آجل";
            if(cashPaid > 0 && walletPaid > 0) finalPaymentType = "مشترك (كاش + محفظة)";
            else if(cashPaid > 0) finalPaymentType = "نقدي (كاش)";
            else if(walletPaid > 0) finalPaymentType = "محفظة إلكترونية";

            const invoiceObj = {
                supplierId: supplierId, total: grossTotal, grossTotal: grossTotal,
                cashPaid: cashPaid, walletPaid: walletPaid, totalPaid: totalPaid, netTotal: pendingAmount,
                items, type: "شراء", paymentType: finalPaymentType, date: invoiceDate, timestamp: editId ? oldInvoiceData.timestamp : serverTimestamp()
            };

            let currentDocId = editId;
            if (editId) { await updateDoc(doc(db, "supplier_transactions", editId), invoiceObj); }
            else {
                const newDocRef = await addDoc(collection(db, "supplier_transactions"), invoiceObj);
                currentDocId = newDocRef.id;
            }

            if (supplierId && pendingAmount !== 0) {
                await updateDoc(doc(db, "suppliers", supplierId), { currentBalance: increment(pendingAmount) });
            }

            if (cashPaid > 0) {
                await addDoc(collection(db, "transactions"), {
                    amount: cashPaid, type: "صرف", actionType: "سداد مورد",
                    details: `سداد نقدي مقابل فاتورة شراء رقم (${currentDocId.substring(0,6)})`,
                    date: invoiceDate, supplierId: supplierId, invoiceId: currentDocId, paymentMethod: "cash", timestamp: serverTimestamp()
                });
            }

            if (walletPaid > 0) {
                await addDoc(collection(db, "transactions"), {
                    amount: walletPaid, type: "صرف", actionType: "سداد مورد",
                    details: `سداد محفظة مقابل فاتورة شراء رقم (${currentDocId.substring(0,6)})`,
                    date: invoiceDate, supplierId: supplierId, invoiceId: currentDocId, paymentMethod: "wallet", timestamp: serverTimestamp()
                });
            }

            isSubmitting = true;
            alert("تم حفظ الفاتورة بنجاح وتحديث الحسابات والمخزن بنجاح 🚀");
            window.location.href = "purchase-invoices-list.html";

        } catch (e) {
            console.error(e);
            alert("حدث خطأ أثناء الحفظ: " + e.message);
            btn.disabled = false;
            btn.innerText = "حفظ وترحيل الفاتورة للسيستم";
        }
    });

    document.getElementById('addItemBtn').addEventListener('click', () => { window.addNewItemRow(); });
    document.getElementById('invDate').valueAsDate = new Date();
    loadData();
</script>
</body>
</html>
