<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فاتورة شراء احترافية - شركة الزيادى</title>
    <!-- Bootstrap 5 RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <!-- Google Fonts - Cairo & Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght=400;500;600;700;800&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --primary: #0b5e3d; 
            --primary-gradient: linear-gradient(135deg, #0b5e3d, #148054);
            --bg-light: #f4f7f5;
            --text-dark: #111d17;
            --text-muted: #6c7a73;
            --border-color: #e2ebd9;
            --white: #ffffff;
            --danger: #d90429;
            --danger-light: #ffe5ea;
            --success: #1b4332;
            --success-light: #d8f3dc;
            --wallet-color: #0077b6;
            --wallet-light: #e0f2fe;
            --card-shadow: 0 12px 30px rgba(0, 0, 0, 0.05);
            --hover-shadow: 0 15px 35px rgba(11, 94, 61, 0.12);
        }

        body { 
            background: var(--bg-light); 
            font-family: 'Cairo', sans-serif; 
            color: var(--text-dark); 
            padding-bottom: 60px;
            overflow-x: hidden;
        }

        .amount, .item-subtotal, .item-qty, .item-buy, #itemsCount, #cashAmount, #walletAmount {
            font-family: 'Montserrat', 'Cairo', sans-serif !important;
        }

        /* هيدر الصفحة المحترف */
        .header { 
            background: var(--primary-gradient); 
            padding: 18px 20px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            box-shadow: 0 4px 25px rgba(11, 94, 61, 0.2); 
            color: white;
            position: sticky; 
            top: 0; 
            z-index: 1040;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .header h6 { font-size: 1.2rem; margin: 0; font-weight: 700; letter-spacing: 0.5px; }
        .clickable-icon { cursor: pointer; transition: transform 0.2s; display: flex; align-items: center; }
        .clickable-icon:hover { transform: scale(1.18); color: #d8f3dc; }
        .badge-new { background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.4); padding: 6px 16px; border-radius: 12px; font-weight: 700; font-size: 0.8rem; }

        /* كروت مدخلات البيانات */
        .data-card { 
            background: var(--white); 
            border: 1px solid rgba(11, 94, 61, 0.08); 
            border-radius: 24px; 
            padding: 24px; 
            margin-top: 20px;
            box-shadow: var(--card-shadow);
        }

        label { font-size: 0.85rem; margin-bottom: 8px; color: var(--primary); font-weight: 700; display: flex; align-items: center; gap: 6px; }

        .form-control, .form-select { 
            background: #fafcfb !important; 
            border: 2px solid var(--border-color) !important; 
            color: var(--text-dark) !important; 
            border-radius: 14px; 
            padding: 12px 16px; 
            font-size: 0.95rem; 
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .form-control:focus, .form-select:focus { 
            border-color: var(--primary) !important; 
            background: var(--white) !important;
            box-shadow: 0 0 0 4px rgba(11, 94, 61, 0.12) !important; 
            outline: none;
        }

        /* حاوية قائمة البحث المنسدلة الذكية للـ Autocomplete */
        .autocomplete-wrapper {
            position: relative;
        }
        .autocomplete-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--white);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            max-height: 250px;
            overflow-y: auto;
            z-index: 1050;
            display: none;
            margin-top: 5px;
            padding: 5px 0;
        }
        .autocomplete-item {
            padding: 12px 16px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background 0.2s;
            text-align: right;
        }
        .autocomplete-item:hover {
            background-color: #f0f7f3;
            color: var(--primary);
        }

        /* أسطر بنود الفواتير المبتكرة */
        .item-row { 
            background: var(--white); 
            border: 1px solid var(--border-color); 
            border-radius: 24px; 
            padding: 24px; 
            margin-bottom: 20px; 
            position: relative; 
            box-shadow: var(--card-shadow);
            border-right: 6px solid var(--primary);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .item-row:hover {
            box-shadow: var(--hover-shadow);
            transform: translateY(-2px);
        }
        .item-row.is-return {
            border-right: 6px solid var(--danger);
            background: #fffbfa;
        }
        
        /* زر حذف بند مستقل */
        .btn-remove { 
            position: absolute; 
            top: -12px; 
            left: -12px; 
            background: var(--danger); 
            color: #fff; 
            width: 36px; 
            height: 36px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 0.9rem; 
            cursor: pointer; 
            z-index: 10; 
            border: 3px solid white; 
            box-shadow: 0 4px 12px rgba(217, 4, 41, 0.3);
            transition: all 0.2s ease;
        }
        .btn-remove:hover { transform: scale(1.15) rotate(90deg); background: #b30322; }
        
        /* زر إضافة بند جديد */
        .add-item-btn { 
            background: #e6f2ec; 
            color: var(--primary); 
            border: 2px dashed var(--primary); 
            width: calc(100% - 30px); 
            margin: 15px 15px;
            padding: 16px; 
            border-radius: 18px; 
            font-weight: 700; 
            font-size: 1rem;
            transition: all 0.25s ease; 
        }
        .add-item-btn:hover { background: var(--primary); color: white; transform: translateY(-3px); box-shadow: 0 6px 15px rgba(11, 94, 61, 0.15); }

        /* حاوية السداد التراكمي السفلي */
        .invoice-footer { 
            background: var(--white); 
            padding: 28px; 
            border: 1px solid var(--border-color); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 14px; 
            box-shadow: 0 -15px 35px rgba(0,0,0,0.04);
            border-radius: 32px; 
            width: calc(100% - 30px); 
            max-width: 650px;
            margin: 40px auto 20px auto;
        }

        .total-container {
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            width: 100%; 
            padding: 12px 16px; 
            border-radius: 16px;
            border: 1px solid transparent;
        }
        .total-container-border {
            border: 2px dashed #e2e8f0;
            background: #f8fafc;
        }

        .amount { font-weight: 700; }
        .amount.total { color: var(--text-dark); font-size: 1.4rem; font-weight: 800; }
        .amount.paid-cash { color: var(--primary); font-size: 1.25rem; }
        .amount.paid-wallet { color: var(--wallet-color); font-size: 1.25rem; }
        .amount.pending { color: var(--danger); font-size: 1.55rem; font-weight: 800; }
        
        /* زر الحفظ النهائي المطور */
        .btn-save { 
            background: var(--primary-gradient); 
            color: #fff; 
            border: none; 
            padding: 16px 0; 
            border-radius: 20px; 
            font-weight: 700; 
            font-size: 1.1rem;
            width: 100%; 
            box-shadow: 0 8px 25px rgba(11, 94, 61, 0.25); 
            transition: all 0.25s ease; 
        }
        .btn-save:hover { opacity: 0.95; transform: translateY(-3px); box-shadow: 0 12px 30px rgba(11, 94, 61, 0.35); }
        
        .subtotal-display { 
            background: #f1f7f4; 
            border-radius: 14px; 
            padding: 10px 14px; 
            border: 2px solid rgba(11, 94, 61, 0.1); 
            color: var(--primary); 
            font-weight: 800;
        }

        .return-check-container {
            display: flex; 
            align-items: center; 
            justify-content: center;
            background: var(--danger-light); 
            padding: 12px 16px; 
            border-radius: 14px; 
            border: 1px solid #f5c2c2;
            height: 52px;
            margin-top: auto;
        }
    </style>
</head>
<body>

<datalist id="productsData"></datalist>

<!-- الهيدر المطور والمبسط للاستخدام بيد واحدة -->
<div class="header">
    <div class="d-flex align-items-center gap-3">
        <i class="fas fa-arrow-right clickable-icon text-white fs-5" id="btnBack" title="رجوع"></i>
        <i class="fas fa-home clickable-icon text-white fs-5" id="btnHome" title="الرئيسية"></i>
    </div>
    <h6 class="fw-bold m-0" id="mainTitle">فاتورة شراء جديدة</h6>
    <div id="statusBadge" class="badge-new">جديدة</div>
</div>

<div class="container-fluid px-3 mt-2">
    <!-- بيانات الفاتورة وعناصر السداد كاش / محفظة -->
    <div class="data-card">
        <div class="row g-3">
            <div class="col-12 col-sm-6 col-md-3">
                <label><i class="fas fa-calendar-day"></i> تاريخ الفاتورة</label>
                <input type="date" id="invDate" class="form-control">
            </div>
            
            <!-- حقل المورد المطور بنظام Autocomplete الاحترافي -->
            <div class="col-12 col-sm-6 col-md-3 autocomplete-wrapper">
                <label><i class="fas fa-truck-field"></i> اسم المورد المستحق</label>
                <input type="text" id="supplierSearch" class="form-control"
                       placeholder="ابدأ بكتابة اسم المورد للبحث..." autocomplete="off">
                <div id="supplierDropdown" class="autocomplete-dropdown"></div>
                <input type="hidden" id="supplierSelect">
            </div>

            <div class="col-6 col-md-3">
                <label class="text-success fw-bold"><i class="fas fa-money-bill-wave"></i> سداد نقدي (كاش)</label>
                <input type="number" step="0.01" id="cashAmount" class="form-control border-success text-center fw-bold text-success" value="0.00" onfocus="if(this.value=='0.00'||this.value=='0')this.value=''">
            </div>
            <div class="col-6 col-md-3">
                <label style="color: var(--wallet-color);"><i class="fas fa-mobile-screen-button"></i> سداد محفظة إلكترونية</label>
                <input type="number" step="0.01" id="walletAmount" class="form-control text-center fw-bold" style="border-color: var(--wallet-color); color: var(--wallet-color);" value="0.00" onfocus="if(this.value=='0.00'||this.value=='0')this.value=''">
            </div>
        </div>
    </div>

    <!-- حاوية عرض بنود وأصناف المشتريات المضافة -->
    <div id="itemsList" class="mt-3"></div>

    <button type="button" class="add-item-btn" id="addItemBtn">
        <i class="fas fa-plus me-1"></i> إضافة صنف جديد للفاتورة
    </button>
</div>

<!-- الحاوية السفلية الذكية لملخص الفاتورة والحساب التراكمي المحدث -->
<div class="invoice-footer" id="invoiceSummaryCard">
    <div class="total-container">
        <span class="small text-muted fw-bold"><i class="fas fa-boxes"></i> عدد البنود الحالية:</span>
        <span class="fw-bold text-dark fs-6" id="itemsCount">0</span>
    </div>
    <div class="total-container total-container-border">
        <span class="small text-muted fw-bold"><i class="fas fa-wallet"></i> الحساب السابق (قبل الفاتورة):</span>
        <span class="amount text-primary fs-6 fw-bold" id="displayPreviousBalance">0.00</span>
    </div>
    <div class="total-container">
        <span class="small text-muted fw-bold"><i class="fas fa-calculator"></i> إجمالي الفاتورة الصافي:</span>
        <span class="amount total" id="grossTotal">0.00</span>
    </div>
    <div class="total-container">
        <span class="small text-success fw-bold"><i class="fas fa-money-bill-check"></i> مدفوع نقداً (كاش):</span>
        <span class="amount paid-cash" id="displayCash">0.00</span>
    </div>
    <div class="total-container">
        <span class="small fw-bold" style="color: var(--wallet-color);"><i class="fas fa-mobile-button"></i> مدفوع محفظة:</span>
        <span class="amount paid-wallet" id="displayWallet">0.00</span>
    </div>
    <div class="total-container" style="background: #fff5f5; border: 1px solid #ffe3e3;">
        <span class="small text-danger fw-bold"><i class="fas fa-receipt"></i> الصافي الآجل للمستند الحالى:</span>
        <span class="amount pending" id="netTotal">0.00</span>
    </div>
    <div class="total-container" style="background: #eefdf4; border: 1px solid #bbf7d0;">
        <span class="small text-success fw-bold"><i class="fas fa-file-invoice-dollar"></i> إجمالي الرصيد المتبقي الكلي للمورد:</span>
        <span class="amount text-success fw-bold fs-5" id="totalSupplierBalance">0.00</span>
    </div>
    <button class="btn-save" id="btnSaveInvoice">حفظ وترحيل الفاتورة للسيستم</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, doc, getDoc, updateDoc, increment, query, where, serverTimestamp, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
        authDomain: "ahmedelzaiady.firebaseapp.com",
        projectId: "ahmedelzaiady",
        storageBucket: "ahmedelzaiady.firebasestorage.app",
        messagingSenderId: "300306825071",
        appId: "1:300306825071:web:0426ddde56280fa090329a",
        measurementId: "G-WE04GK5XZZ"
    };
    
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const editId = urlParams.get('edit');
    const orderId = urlParams.get('orderId'); 

    let allInventory = [];
    let suppliersBase = {};      
    let allInvoicesHistory = []; 
    let globalVouchersHistory = [];   
    let isDataChanged = false; 
    let isSubmitting = false; 
    let oldInvoiceData = null;

    window.addEventListener('beforeunload', (e) => {
        if (isDataChanged && !isSubmitting) {
            e.preventDefault();
            e.returnValue = "هل تريد الخروج قبل الحفظ؟";
        }
    });

    function safeNavigate(targetUrl, useHistory = false) {
        if (isDataChanged) {
            if (!confirm("هل تريد الخروج قبل الحفظ؟ ستخسر المدخلات.")) return;
        }
        if (useHistory) window.history.back();
        else window.location.href = targetUrl;
    }

    document.getElementById('btnBack').addEventListener('click', () => safeNavigate('purchase-invoices-list.html'));
    document.getElementById('btnHome').addEventListener('click', () => safeNavigate('index1.html'));

    const cashInput = document.getElementById('cashAmount');
    const walletInput = document.getElementById('walletAmount');
    const supplierSearchInput = document.getElementById('supplierSearch');
    const supplierHiddenInput = document.getElementById('supplierSelect');
    const supplierDropdown = document.getElementById('supplierDropdown');
    
    cashInput.addEventListener('input', () => { window.calculateTotal(); });
    walletInput.addEventListener('input', () => { window.calculateTotal(); });

    // بناء محرك وقائمة الـ Autocomplete المخصصة للموردين
    supplierSearchInput.addEventListener('input', (e) => {
        const typedName = e.target.value.trim();
        isDataChanged = true;
        
        if (!typedName) {
            supplierDropdown.style.display = 'none';
            supplierHiddenInput.value = "";
            window.calculateTotal();
            return;
        }

        // تصفية الموردين المتطابقين مع النص المكتوب
        const filtered = Object.entries(suppliersBase).filter(([id, s]) => 
            s.name.toLowerCase().includes(typedName.toLowerCase())
        );

        if (filtered.length > 0) {
            supplierDropdown.innerHTML = "";
            filtered.forEach(([id, s]) => {
                const item = document.createElement('div');
                item.className = 'autocomplete-item';
                item.innerText = s.name;
                item.addEventListener('click', () => {
                    supplierSearchInput.value = s.name;
                    supplierHiddenInput.value = id;
                    supplierDropdown.style.display = 'none';
                    window.calculateTotal();
                });
                supplierDropdown.appendChild(item);
            });
            supplierDropdown.style.display = 'block';
        } else {
            supplierDropdown.style.display = 'none';
            supplierHiddenInput.value = "";
            window.calculateTotal();
        }
    });

    // إغلاق قائمة البحث المنسدلة عند الضغط في أي مكان خارجها
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.autocomplete-wrapper')) {
            supplierDropdown.style.display = 'none';
        }
    });

    // تجميع الحسابات من قاعدة البيانات بالكامل لبناء الرصيد التراكمي
    async function loadData() {
        // 1. جلب الموردين وأرصدتهم الافتتاحية الأساسية
        const supSnap = await getDocs(collection(db, "suppliers"));
        suppliersBase = {}; 
        supSnap.forEach(d => { 
            const data = d.data();
            suppliersBase[d.id] = { name: data.name, openingBalance: Number(data.openingBalance) || 0 };
        });

        // 2. جلب جميع الحركات السابقة والحالية لبناء الرصيد التراكمي
        const [transSnap, voucherSnap, invSnap] = await Promise.all([
            getDocs(query(collection(db, "supplier_transactions"), orderBy("timestamp", "asc"))), 
            getDocs(collection(db, "transactions")),
            getDocs(collection(db, "inventory"))
        ]);

        globalVouchersHistory = [];
        voucherSnap.forEach(v => {
            globalVouchersHistory.push({ id: v.id, ...v.data() });
        });

        allInvoicesHistory = [];
        transSnap.forEach(doc => {
            const data = doc.data();
            const amt = Number(data.grossTotal) || Number(data.total) || 0;
            const cashP = Number(data.cashPaid || 0);
            const walletP = Number(data.walletPaid || 0);
            const directPaid = data.totalPaid ? Number(data.totalPaid) : (cashP + walletP || Number(data.paidAmount) || 0);

            allInvoicesHistory.push({
                id: doc.id,
                ...data,
                displayGross: amt,
                displayNetPending: amt - directPaid
            });
        });

        // 3. تعبئة قائمة الأصناف الذكية للبحث الذاتي المنسدل
        allInventory = [];
        const prodDataList = document.getElementById('productsData');
        prodDataList.innerHTML = "";
        invSnap.forEach(d => {
            const data = d.data();
            allInventory.push({ id: d.id, ...data });
            prodDataList.innerHTML += `<option value="${data.name}">`;
        });

        if (editId) { 
            await loadInvoiceForEdit(); 
        } else if (orderId) {
            await loadOrderData(orderId);
        } else { 
            addNewItemRow(); 
        }

        setTimeout(() => {
            document.querySelectorAll('input, select').forEach(el => {
                el.addEventListener('change', () => { isDataChanged = true; });
                el.addEventListener('input', () => { isDataChanged = true; });
            });
        }, 800);
    }

    // دالة محاكاة وحساب الحساب السابق في الذاكرة (In-Memory) مطابقة لصفحة السجل تماماً
    function calculateHistoricalPreviousBalance(supId, invoiceTimestamp) {
        const supplier = suppliersBase[supId];
        if (!supplier) return 0;

        let debt = 0;
        let credit = 0;
        const targetSeconds = invoiceTimestamp?.seconds || (Date.now() / 1000);

        globalVouchersHistory.forEach(v => {
            if (v.partyId === supId && v.timestamp && v.timestamp.seconds < targetSeconds) {
                const amt = Number(v.amount) || 0;
                if (v.type === "صرف") credit += amt;
                else if (v.type === "قبض") debt += amt;
            }
        });

        allInvoicesHistory.forEach(inv => {
            if (editId && inv.id === editId) return;

            if (inv.supplierId === supId && inv.timestamp && inv.timestamp.seconds < targetSeconds) {
                const amt = inv.displayGross;
                if (inv.type === "شراء" || inv.type === "فاتورة شراء") debt += amt;
                else if (inv.type === "مرتجع شراء") credit += amt;
            }
        });

        return (supplier.openingBalance + debt) - credit;
    }

    async function loadInvoiceForEdit() {
        document.getElementById('mainTitle').innerText = "تعديل فاتورة شراء";
        document.getElementById('statusBadge').innerText = "تعديل";
        document.getElementById('statusBadge').className = "badge-new bg-warning text-dark";

        const invRef = doc(db, "supplier_transactions", editId);
        const invSnap = await getDoc(invRef);

        if (invSnap.exists()) {
            oldInvoiceData = invSnap.data();
            supplierHiddenInput.value = oldInvoiceData.supplierId;
            supplierSearchInput.value = suppliersBase[oldInvoiceData.supplierId]?.name || '';
            document.getElementById('invDate').value = oldInvoiceData.date;
            document.getElementById('cashAmount').value = oldInvoiceData.cashPaid || '0.00';
            document.getElementById('walletAmount').value = oldInvoiceData.walletPaid || '0.00';
            
            document.getElementById('itemsList').innerHTML = ""; 
            if (oldInvoiceData.items && oldInvoiceData.items.length > 0) {
                oldInvoiceData.items.forEach(item => { addNewItemRow(item); });
            }
            window.calculateTotal();
        }
    }

    async function loadOrderData(id) {
        try {
            const orderSnap = await getDoc(doc(db, "purchase_orders", id));
            if (orderSnap.exists()) {
                const data = orderSnap.data();
                supplierHiddenInput.value = data.supplierId;
                supplierSearchInput.value = suppliersBase[data.supplierId]?.name || '';
                document.getElementById('itemsList').innerHTML = ""; 
                data.items.forEach(item => {
                    addNewItemRow({ name: item.name, qty: item.qty, returnQty: item.returnQty || 0, buy: item.buy || 0, unitName: item.unitName || 'كرتونة' });
                });
                window.calculateTotal();
            }
        } catch (e) { console.error(e); }
    }

    window.addNewItemRow = (itemData = null) => {
        const id = Date.now() + Math.random();
        const currentUnit = itemData ? (itemData.unitName || 'كرتونة') : 'كرتونة';
        const isReturnChecked = itemData && itemData.returnQty > 0;
        isDataChanged = true;

        const html = `
            <div class="item-row ${isReturnChecked ? 'is-return' : ''}" id="row_${id}">
                <div class="btn-remove" onclick="this.parentElement.remove(); window.calculateTotal();">
                    <i class="fas fa-times"></i>
                </div>
                <div class="row g-3">
                    <div class="col-12 col-md-6">
                        <label><i class="fas fa-tag"></i> اسم الصنف</label>
                        <input type="text" list="productsData" class="form-control item-name" value="${itemData ? itemData.name : ''}" placeholder="ابحث أو اكتب اسم صنف">
                    </div>
                    <div class="col-6 col-md-3">
                        <label><i class="fas fa-boxes-stacked"></i> نوع الوحدة</label>
                        <select class="form-select item-unit">
                            <option value="كرتونة" ${currentUnit === 'كرتونة' ? 'selected' : ''}>كرتونة</option>
                            <option value="قطعة" ${currentUnit === 'قطعة' ? 'selected' : ''}>قطعة</option>
                        </select>
                    </div>
                    <div class="col-6 col-md-3 d-flex flex-column justify-content-end">
                        <div class="return-check-container">
                            <div class="form-check form-switch m-0 d-flex align-items-center gap-2">
                                <input class="form-check-input item-is-return" type="checkbox" id="check_${id}" ${isReturnChecked ? 'checked' : ''}>
                                <label class="form-check-label text-danger fw-bold m-0" for="check_${id}">تحديد كمرتجع ↩</label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row g-3 mt-1">
                    <div class="col-6 col-md-4">
                        <label class="text-success fw-bold" id="label_qty_${id}">العدد الحالي (${currentUnit})</label>
                        <input type="number" step="0.01" class="form-control item-qty" value="${itemData ? (isReturnChecked ? itemData.returnQty : itemData.qty) : '1'}">
                    </div>
                    <div class="col-6 col-md-4">
                        <label id="label_price_${id}">سعر شراء الـ (${currentUnit})</label>
                        <input type="number" step="0.01" class="form-control item-buy" value="${itemData ? itemData.buy : ''}" placeholder="0.00">
                    </div>
                    <div class="col-12 col-md-4 d-flex flex-column justify-content-end align-items-end">
                        <label class="w-100 text-start"><i class="fas fa-coins"></i> الصافي الفرعي للبنود</label>
                        <div class="subtotal-display w-100 text-center">
                            <input type="text" class="item-subtotal border-0 bg-transparent text-success fw-bold text-center w-100" readonly value="0.00">
                        </div>
                    </div>
                </div>
            </div>`;
        document.getElementById('itemsList').insertAdjacentHTML('beforeend', html);
        setupRowEvents(id);
        window.calculateTotal();
    }

    function setupRowEvents(id) {
        const row = document.getElementById(`row_${id}`);
        const nameInput = row.querySelector('.item-name');
        const unitSelect = row.querySelector('.item-unit');
        const returnCheck = row.querySelector('.item-is-return');

        returnCheck.addEventListener('change', (e) => {
            if(e.target.checked) row.classList.add('is-return');
            else row.classList.remove('is-return');
            window.calculateTotal();
        });

        unitSelect.addEventListener('change', (e) => {
            const val = e.target.value;
            document.getElementById(`label_qty_${id}`).innerText = `العدد الحالي (${val})`;
            document.getElementById(`label_price_${id}`).innerText = `سعر شراء الـ (${val})`;
            window.calculateTotal();
        });

        nameInput.addEventListener('change', (e) => {
            const found = allInventory.find(p => p.name === e.target.value);
            if(found) {
                row.querySelector('.item-buy').value = found.buy || 0;
                unitSelect.value = "كرتونة";
                unitSelect.dispatchEvent(new Event('change'));
            } else {
                alert("عذرًا، هذا الصنف غير مسجل بالنظام. يرجى اختيار صنف من القائمة المنسدلة فقط.");
                e.target.value = "";
            }
            window.calculateTotal();
        });

        row.querySelectorAll('input, select').forEach(input => {
            input.addEventListener('input', window.calculateTotal);
            input.addEventListener('change', window.calculateTotal);
        });
    }

    window.calculateTotal = () => {
        let grossTotal = 0;
        const rows = document.querySelectorAll('.item-row');
        document.getElementById('itemsCount').innerText = rows.length;

        rows.forEach(row => {
            const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
            const buy = parseFloat(row.querySelector('.item-buy').value) || 0;
            const isReturn = row.querySelector('.item-is-return').checked;
            
            const sub = qty * buy * (isReturn ? -1 : 1);
            row.querySelector('.item-subtotal').value = sub.toFixed(2);
            grossTotal += sub;
        });
        
        document.getElementById('grossTotal').innerText = grossTotal.toFixed(2);
        
        let cashVal = parseFloat(cashInput.value) || 0;
        let walletVal = parseFloat(walletInput.value) || 0;
        
        let totalPaid = cashVal + walletVal;
        let pendingVal = grossTotal - totalPaid;

        document.getElementById('displayCash').innerText = cashVal.toFixed(2);
        document.getElementById('displayWallet').innerText = walletVal.toFixed(2);
        document.getElementById('netTotal').innerText = pendingVal.toFixed(2);

        const supplierId = supplierHiddenInput.value;
        let prevBalance = 0;
        if (supplierId && suppliersBase[supplierId]) {
            const targetTimestamp = editId ? oldInvoiceData?.timestamp : null;
            prevBalance = calculateHistoricalPreviousBalance(supplierId, targetTimestamp);
        }
        document.getElementById('displayPreviousBalance').innerText = prevBalance.toFixed(2);
        
        let totalSupplierFinal = prevBalance + pendingVal;
        document.getElementById('totalSupplierBalance').innerText = totalSupplierFinal.toFixed(2);
    };

    document.getElementById('btnSaveInvoice').addEventListener('click', async () => {
        const btn = document.getElementById('btnSaveInvoice');
        const supplierId = supplierHiddenInput.value;
        const grossTotal = parseFloat(document.getElementById('grossTotal').innerText) || 0;
        
        const cashPaid = parseFloat(document.getElementById('cashAmount').value) || 0;
        const walletPaid = parseFloat(document.getElementById('walletAmount').value) || 0;
        const totalPaid = cashPaid + walletPaid;
        
        const invoiceDate = document.getElementById('invDate').value;
        const pendingAmount = grossTotal - totalPaid;
        
        const rows = document.querySelectorAll('.item-row');
        if(!supplierId || rows.length === 0) return alert("برجاء إكمال البيانات وإضافة الأصناف أولاً (تأكد من اختيار اسم المورد من قائمة البحث المنسدلة الذكية)");

        for (const row of rows) {
            const name = row.querySelector('.item-name').value.trim();
            const isExist = allInventory.some(p => p.name === name);
            if (!isExist || name === "") {
                alert(`خطأ: الصنف "${name}" غير مسجل بقاعدة البيانات! يرجى إزالته أو اختيار صنف صحيح من القائمة المنسدلة للتمكن من الحفظ.`);
                return;
            }
        }

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> جاري الترحيل والموازنة الحالية...';

        try {
            if (editId && oldInvoiceData) {
                const oldGross = Number(oldInvoiceData.grossTotal || oldInvoiceData.total || 0);
                const oldCash = Number(oldInvoiceData.cashPaid || 0);
                const oldWallet = Number(oldInvoiceData.walletPaid || 0);
                const oldDebt = oldGross - (oldCash + oldWallet);
                if (oldDebt !== 0) {
                    await updateDoc(doc(db, "suppliers", oldInvoiceData.supplierId), { currentBalance: increment(-oldDebt) });
                }
            }

            const items = [];

            for (const row of rows) {
                const name = row.querySelector('.item-name').value;
                const qtyInput = parseFloat(row.querySelector('.item-qty').value) || 0;
                const buy = parseFloat(row.querySelector('.item-buy').value) || 0;
                const unitName = row.querySelector('.item-unit').value;
                const isReturn = row.querySelector('.item-is-return').checked;

                let qty = isReturn ? 0 : qtyInput;
                let returnQty = isReturn ? qtyInput : 0;
                const finalQtyModifier = isReturn ? -qtyInput : qtyInput;
                
                items.push({ name, qty, returnQty, buy, unitName, unitFactor: 1, totalPieces: finalQtyModifier });

                const q = query(collection(db, "inventory"), where("name", "==", name));
                const qSnap = await getDocs(q);

                if(!qSnap.empty) {
                    await updateDoc(doc(db, "inventory", qSnap.docs[0].id), {
                        qty: increment(finalQtyModifier), 
                        totalPcs: increment(finalQtyModifier), 
                        buy: buy, unitName: unitName, lastUpdate: serverTimestamp()
                    });
                }
            }

            let finalPaymentType = "آجل";
            if(cashPaid > 0 && walletPaid > 0) finalPaymentType = "مشترك (كاش + محفظة)";
            else if(cashPaid > 0) finalPaymentType = "نقدي (كاش)";
            else if(walletPaid > 0) finalPaymentType = "محفظة إلكترونية";

            const invoiceObj = {
                supplierId, total: grossTotal, grossTotal: grossTotal, 
                cashPaid: cashPaid, walletPaid: walletPaid, totalPaid: totalPaid, netTotal: pendingAmount, 
                items, type: "شراء", paymentType: finalPaymentType, date: invoiceDate, timestamp: editId ? oldInvoiceData.timestamp : serverTimestamp()
            };

            let currentDocId = editId;
            if (editId) {
                await updateDoc(doc(db, "supplier_transactions", editId), invoiceObj);
            } else {
                const newDocRef = await addDoc(collection(db, "supplier_transactions"), invoiceObj);
                currentDocId = newDocRef.id;
            }

            if (pendingAmount !== 0) {
                await updateDoc(doc(db, "suppliers", supplierId), { currentBalance: increment(pendingAmount) });
            }

            if (cashPaid > 0) {
                await addDoc(collection(db, "transactions"), {
                    amount: cashPaid, type: "صرف", actionType: "سداد مورد",
                    details: `سداد نقدي (كاش) مقابل فاتورة شراء رقم (${currentDocId.substring(0,6)})`,
                    date: invoiceDate, supplierId: supplierId, invoiceId: currentDocId,
                    paymentMethod: "cash", timestamp: serverTimestamp()
                });
            }

            if (walletPaid > 0) {
                await addDoc(collection(db, "transactions"), {
                    amount: walletPaid, type: "صرف", actionType: "سداد مورد",
                    details: `سداد محفظة إلكترونية مقابل فاتورة شراء رقم (${currentDocId.substring(0,6)})`,
                    date: invoiceDate, supplierId: supplierId, invoiceId: currentDocId,
                    paymentMethod: "wallet", timestamp: serverTimestamp()
                });
            }

            isSubmitting = true; 
            alert("تم حفظ الفاتورة بنجاح وتحديث الحسابات والمخزن بشكل دقيق 🚀");
            window.location.href = "purchase-invoices-list.html";

        } catch (e) {
            console.error(e);
            alert("حدث خطأ أثناء الحفظ: " + e.message);
            btn.disabled = false;
            btn.innerText = "حفظ وترحيل الفاتورة للسيستم";
        }
    });

    document.getElementById('addItemBtn').addEventListener('click', () => { window.addNewItemRow(); });
    document.getElementById('invDate').valueAsDate = new Date();
    loadData();
</script>
</body>
</html>
