<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فاتورة شراء - شركة الزيادى</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #0e6b48;
            --primary-dark: #0a5037;
            --primary-gradient: linear-gradient(135deg, #0e6b48, #129463);
            --bg-light: #f4f7f6;
            --text-dark: #1c2924;
            --text-muted: #7c8a83;
            --border-color: #e6ece9;
            --white: #ffffff;
            --danger: #d6304a;
            --danger-light: #fdeef0;
            --danger-border: #f4c6cd;
            --success: #1b4332;
            --success-light: #e9f7ef;
            --wallet-color: #1d7fb8;
            --wallet-light: #e7f4fc;
            --card-shadow: 0 6px 20px rgba(20, 40, 32, 0.05);
            --hover-shadow: 0 10px 26px rgba(14, 107, 72, 0.08);
            --radius-lg: 20px;
            --radius-md: 14px;
        }

        * { box-sizing: border-box; }

        body {
            background: var(--bg-light);
            font-family: 'Cairo', sans-serif;
            color: var(--text-dark);
            padding-bottom: 60px;
            overflow-x: hidden;
            line-height: 1.5;
        }

        .amount, .item-subtotal, .item-qty, .item-buy, #itemsCount, #cashAmount, #walletAmount {
            font-family: 'Montserrat', 'Cairo', sans-serif !important;
        }

        /* ===== HEADER ===== */
        .header {
            background: var(--primary-gradient);
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 3px 14px rgba(11, 94, 61, 0.14);
            color: white;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .header h6 { font-size: 1.05rem; margin: 0; font-weight: 700; letter-spacing: .2px; }
        .clickable-icon { cursor: pointer; transition: transform .2s, opacity .2s; display: flex; align-items: center; opacity: .92; }
        .clickable-icon:hover { transform: scale(1.12); opacity: 1; }
        .badge-new { background: rgba(255,255,255,0.18); color: white; border: 1px solid rgba(255,255,255,0.35); padding: 5px 14px; border-radius: 10px; font-weight: 700; font-size: 0.72rem; }

        /* ===== CARD GENERAL ===== */
        .data-card {
            background: var(--white);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 18px;
            margin-top: 14px;
            box-shadow: var(--card-shadow);
        }

        label { font-size: 0.76rem; margin-bottom: 6px; color: var(--primary-dark); font-weight: 700; display: flex; align-items: center; gap: 5px; }
        label i { font-size: .72rem; opacity: .85; }

        .form-control, .form-select {
            background: var(--white) !important;
            border: 1.5px solid var(--border-color) !important;
            color: var(--text-dark) !important;
            border-radius: var(--radius-md);
            padding: 11px 12px;
            font-size: 0.88rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .form-control::placeholder { color: #adb8b3; font-weight: 500; }
        .form-control:focus, .form-select:focus {
            border-color: var(--primary) !important;
            box-shadow: 0 0 0 3px rgba(14, 107, 72, 0.1) !important;
            outline: none;
        }

        /* ===== ITEM ROW ===== */
        .item-row {
            background: var(--white);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 18px;
            margin-bottom: 14px;
            position: relative;
            box-shadow: var(--card-shadow);
            border-right: 5px solid var(--primary);
            transition: box-shadow .25s ease, border-color .25s ease;
        }
        .item-row:hover { box-shadow: var(--hover-shadow); }
        .item-row.is-return { border-right: 5px solid var(--danger); background: linear-gradient(180deg, #fffaf9, #ffffff); }

        .btn-remove {
            position: absolute;
            top: -9px;
            left: -9px;
            background: var(--danger);
            color: #fff;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.78rem;
            cursor: pointer;
            z-index: 10;
            border: 3px solid var(--bg-light);
            box-shadow: 0 3px 8px rgba(0,0,0,0.12);
            transition: 0.2s;
        }
        .btn-remove:hover { transform: scale(1.1); background: #b3243c; }

        .add-item-btn {
            background: var(--success-light);
            color: var(--primary-dark);
            border: 2px dashed var(--primary);
            width: calc(100% - 30px);
            margin: 10px 15px;
            padding: 14px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 0.92rem;
            transition: all 0.2s ease;
        }
        .add-item-btn:hover { background: var(--primary); color: white; transform: translateY(-1px); }

        /* ===== RETURN SWITCH ===== */
        .return-check-container {
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--danger-light);
            padding: 11px;
            border-radius: var(--radius-md);
            border: 1px solid var(--danger-border);
            height: calc(100% - 28px);
            margin-top: auto;
        }
        .form-check-input.item-is-return:checked { background-color: var(--danger); border-color: var(--danger); }

        /* ===== SUBTOTAL ===== */
        .subtotal-display { background: var(--success-light); border-radius: 12px; padding: 8px 12px; border: 1px solid #cdeadb; color: var(--primary-dark); font-weight: 800; }
        .item-subtotal { color: var(--primary-dark) !important; }

        /* ===== FOOTER / SUMMARY ===== */
        .invoice-footer {
            background: var(--white);
            padding: 22px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            box-shadow: 0 -6px 20px rgba(0,0,0,0.02);
            border-radius: var(--radius-lg);
            width: calc(100% - 30px);
            max-width: 600px;
            margin: 26px auto 20px auto;
        }

        .total-container { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 10px 14px; border-radius: var(--radius-md); border: 1px solid transparent; }
        .total-container-border { border: 1px dashed var(--border-color); background: #fafcfb; }

        .amount { font-weight: 700; }
        .amount.total { color: var(--text-dark); font-size: 1.22rem; font-weight: 800; }
        .amount.paid-cash { color: var(--primary); font-size: 1.05rem; }
        .amount.paid-wallet { color: var(--wallet-color); font-size: 1.05rem; }
        .amount.pending { color: var(--danger); font-size: 1.3rem; font-weight: 800; }

        .btn-save {
            background: var(--primary-gradient);
            color: #fff;
            border: none;
            padding: 14px 0;
            border-radius: 16px;
            font-weight: 700;
            font-size: 1rem;
            width: 100%;
            box-shadow: 0 5px 16px rgba(11, 94, 61, 0.18);
            transition: all 0.2s ease;
            margin-top: 4px;
        }
        .btn-save:hover { opacity: 0.96; transform: translateY(-1px); box-shadow: 0 7px 20px rgba(11, 94, 61, 0.22); }
        .btn-save:disabled { opacity: .75; transform: none; cursor: not-allowed; }

        /* ===== SECTION DIVIDER LABEL ===== */
        .section-label {
            font-size: .72rem;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: .04em;
            padding: 14px 6px 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .section-label::after { content:''; flex:1; height:1px; background: var(--border-color); }

        @media (max-width: 480px) {
            .data-card, .item-row { border-radius: 16px; padding: 14px; }
        }
    </style>
</head>
<body>

<datalist id="productsData"></datalist>

<div class="header">
    <div class="d-flex align-items-center gap-3">
        <i class="fas fa-arrow-right clickable-icon text-white fs-5" id="btnBack" title="رجوع"></i>
        <i class="fas fa-home clickable-icon text-white fs-5" id="btnHome" title="الرئيسية"></i>
    </div>
    <h6 class="fw-bold m-0" id="mainTitle">فاتورة شراء جديدة</h6>
    <div id="statusBadge" class="badge-new">جديدة</div>
</div>

<div class="container-fluid px-3 mt-2">
    <div class="data-card">
        <div class="row g-3">
            <div class="col-6 col-md-3">
                <label><i class="fas fa-calendar-day"></i> تاريخ الفاتورة</label>
                <input type="date" id="invDate" class="form-control">
            </div>
            <div class="col-6 col-md-3">
                <label><i class="fas fa-truck-field"></i> اسم المورد المستحق</label>
                <select id="supplierSelect" class="form-select">
                    <option value="">جاري تحميل الموردين...</option>
                </select>
            </div>
            <div class="col-6 col-md-3">
                <label class="text-success fw-bold"><i class="fas fa-money-bill-wave"></i> سداد نقدي (كاش)</label>
                <input type="number" step="0.01" id="cashAmount" class="form-control border-success text-center fw-bold text-success" value="0.00" onfocus="if(this.value=='0.00'||this.value=='0')this.value=''">
            </div>
            <div class="col-6 col-md-3">
                <label style="color: var(--wallet-color);"><i class="fas fa-mobile-screen-button"></i> سداد محفظة إلكترونية</label>
                <input type="number" step="0.01" id="walletAmount" class="form-control text-center fw-bold" style="border-color: var(--wallet-color); color: var(--wallet-color);" value="0.00" onfocus="if(this.value=='0.00'||this.value=='0')this.value=''">
            </div>
        </div>
    </div>

    <div class="section-label"><i class="fas fa-list-ul"></i> أصناف الفاتورة</div>
    <div id="itemsList" class="mt-1"></div>

    <button type="button" class="add-item-btn" id="addItemBtn">
        <i class="fas fa-plus me-1"></i> إضافة صنف جديد للفاتورة
    </button>
</div>

<div class="invoice-footer" id="invoiceSummaryCard">
    <div class="total-container">
        <span class="small text-muted fw-bold"><i class="fas fa-boxes"></i> عدد البنود الحالية:</span>
        <span class="fw-bold text-dark fs-6" id="itemsCount">0</span>
    </div>
    <div class="total-container total-container-border">
        <span class="small text-muted fw-bold"><i class="fas fa-wallet"></i> الحساب السابق للمورد:</span>
        <span class="amount text-primary fs-6 fw-bold" id="displayPreviousBalance">0.00</span>
    </div>
    <div class="total-container">
        <span class="small text-muted fw-bold"><i class="fas fa-calculator"></i> إجمالي الفاتورة الصافي:</span>
        <span class="amount total" id="grossTotal">0.00</span>
    </div>
    <div class="total-container">
        <span class="small text-success fw-bold"><i class="fas fa-money-bill-check"></i> مدفوع نقداً (كاش):</span>
        <span class="amount paid-cash" id="displayCash">0.00</span>
    </div>
    <div class="total-container">
        <span class="small fw-bold" style="color: var(--wallet-color);"><i class="fas fa-mobile-button"></i> مدفوع محفظة:</span>
        <span class="amount paid-wallet" id="displayWallet">0.00</span>
    </div>
    <div class="total-container" style="background: #fff5f6; border: 1px solid #ffe1e6;">
        <span class="small text-danger fw-bold"><i class="fas fa-receipt"></i> الصافي الآجل للمستند الحالى:</span>
        <span class="amount pending" id="netTotal">0.00</span>
    </div>
    <div class="total-container" style="background: #eefdf4; border: 1px solid #bbf7d0;">
        <span class="small text-success fw-bold"><i class="fas fa-file-invoice-dollar"></i> إجمالي الرصيد المتبقي الكلي للمورد:</span>
        <span class="amount text-success fw-bold fs-5" id="totalSupplierBalance">0.00</span>
    </div>
    <button class="btn-save" id="btnSaveInvoice">حفظ وترحيل الفاتورة للسيستم</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    // إضافة writeBatch ضمن الاستدعاءات
    import { getFirestore, collection, getDocs, addDoc, doc, getDoc, updateDoc, increment, query, where, serverTimestamp, writeBatch } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
        authDomain: "ahmedelzaiady.firebaseapp.com",
        projectId: "ahmedelzaiady",
        storageBucket: "ahmedelzaiady.firebasestorage.app",
        messagingSenderId: "300306825071",
        appId: "1:300306825071:web:0426ddde56280fa090329a",
        measurementId: "G-WE04GK5XZZ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const editId = urlParams.get('edit');
    const orderId = urlParams.get('orderId');

    let allInventory = [];
    let suppliersBase = [];
    let isDataChanged = false;
    let isSubmitting = false;
    let oldInvoiceData = null;
    let currentFetchedOldBalance = 0;

    window.addEventListener('beforeunload', (e) => {
        if (isDataChanged && !isSubmitting) {
            e.preventDefault();
            e.returnValue = "هل تريد الخروج قبل الحفظ؟";
        }
    });

    function safeNavigate(targetUrl, useHistory = false) {
        if (isDataChanged) {
            if (!confirm("هل تريد الخروج قبل الحفظ؟ ستخسر المدخلات.")) return;
        }
        if (useHistory) window.history.back();
        else window.location.href = targetUrl;
    }

    document.getElementById('btnBack').addEventListener('click', () => safeNavigate('purchase-invoices-list.html'));
    document.getElementById('btnHome').addEventListener('click', () => safeNavigate('index1.html'));

    const cashInput = document.getElementById('cashAmount');
    const walletInput = document.getElementById('walletAmount');

    cashInput.addEventListener('input', () => { window.calculateTotal(); });
    walletInput.addEventListener('input', () => { window.calculateTotal(); });

    function getSupplierBaseBalance(sup) {
        if (!sup) return 0;
        if (sup.currentBalance !== undefined && sup.currentBalance !== null) {
            return Number(sup.currentBalance) || 0;
        }
        return Number(sup.openingBalance) || 0;
    }

    async function getRealSupplierBalance(supplierId, baseBalance = 0) {
        try {
            const [snapInvoices, snapTrans] = await Promise.all([
                getDocs(query(collection(db, "supplier_transactions"), where("supplierId", "==", supplierId))),
                getDocs(query(collection(db, "transactions"), where("supplierId", "==", supplierId)))
            ]);

            let invoiceDebt = 0;
            snapInvoices.forEach(doc => {
                if (editId && doc.id === editId) return;
                const data = doc.data();
                const amt = Number(data.grossTotal) || Number(data.total) || 0;
                const paid = Number(data.totalPaid || (Number(data.cashPaid || 0) + Number(data.walletPaid || 0)));
                invoiceDebt += (amt - paid);
            });

            let transEffect = 0;
            snapTrans.forEach(doc => {
                const tr = doc.data();
                const amt = Number(tr.amount) || 0;
                if (tr.type === 'قبض') transEffect -= amt;
                else if (tr.type === 'صرف') transEffect += amt;
            });

            return Number(baseBalance) + invoiceDebt + transEffect;
        } catch (e) { 
            return Number(baseBalance); 
        }
    }

    async function loadData() {
        const supSelect = document.getElementById('supplierSelect');
        try {
            const supSnap = await getDocs(collection(db, "suppliers"));
            supSelect.innerHTML = '<option value="">-- اختر اسم المورد المستحق --</option>';
            suppliersBase = [];
            supSnap.forEach(d => {
                const data = d.data();
                suppliersBase.push({ id: d.id, ...data });
                supSelect.innerHTML += `<option value="${d.id}">${data.name}</option>`;
            });
        } catch (err) {
            console.error(err);
            supSelect.innerHTML = '<option value="">❌ فشل تحميل قائمة الموردين</option>';
        }

        try {
            const invSnap = await getDocs(collection(db, "inventory"));
            allInventory = [];
            const prodDataList = document.getElementById('productsData');
            prodDataList.innerHTML = "";
            invSnap.forEach(d => {
                const data = d.data();
                allInventory.push({ id: d.id, ...data });
                prodDataList.innerHTML += `<option value="${data.name}">`;
            });
        } catch (err) { console.error(err); }

        supSelect.addEventListener('change', async () => {
            const supplierId = supSelect.value;
            if (supplierId) {
                const sup = suppliersBase.find(s => s.id === supplierId);
                const baseB = getSupplierBaseBalance(sup);
                currentFetchedOldBalance = await getRealSupplierBalance(supplierId, baseB);
            } else {
                currentFetchedOldBalance = 0;
            }
            window.calculateTotal();
        });

        if (editId) { await loadInvoiceForEdit(); }
        else if (orderId) { await loadOrderData(orderId); }
        else { addNewItemRow(); }

        window.calculateTotal();
    }

    async function loadInvoiceForEdit() {
        document.getElementById('mainTitle').innerText = "تعديل فاتورة شراء";
        document.getElementById('statusBadge').innerText = "تعديل";
        document.getElementById('statusBadge').className = "badge-new bg-warning text-dark";

        const invRef = doc(db, "supplier_transactions", editId);
        const invSnap = await getDoc(invRef);

        if (invSnap.exists()) {
            oldInvoiceData = invSnap.data();
            if (oldInvoiceData.supplierId) { 
                document.getElementById('supplierSelect').value = oldInvoiceData.supplierId; 
                const sup = suppliersBase.find(s => s.id === oldInvoiceData.supplierId);
                const baseB = getSupplierBaseBalance(sup);
                currentFetchedOldBalance = await getRealSupplierBalance(oldInvoiceData.supplierId, baseB);
            }
            document.getElementById('invDate').value = oldInvoiceData.date;
            document.getElementById('cashAmount').value = oldInvoiceData.cashPaid || '0.00';
            document.getElementById('walletAmount').value = oldInvoiceData.walletPaid || '0.00';

            document.getElementById('itemsList').innerHTML = "";
            if (oldInvoiceData.items && oldInvoiceData.items.length > 0) {
                oldInvoiceData.items.forEach(item => { addNewItemRow(item); });
            }
            window.calculateTotal();
        }
    }

    async function loadOrderData(id) {
        try {
            const orderSnap = await getDoc(doc(db, "purchase_orders", id));
            if (orderSnap.exists()) {
                const data = orderSnap.data();
                if (data.supplierId) { 
                    document.getElementById('supplierSelect').value = data.supplierId; 
                    const sup = suppliersBase.find(s => s.id === data.supplierId);
                    const baseB = getSupplierBaseBalance(sup);
                    currentFetchedOldBalance = await getRealSupplierBalance(data.supplierId, baseB);
                }
                document.getElementById('itemsList').innerHTML = "";
                data.items.forEach(item => {
                    addNewItemRow({ name: item.name, qty: item.qty, returnQty: item.returnQty || 0, buy: item.buy || 0, unitName: item.unitName || 'كرتونة', isReturn: item.isReturn || false });
                });
                window.calculateTotal();
            }
        } catch (e) { console.error(e); }
    }

    window.addNewItemRow = (itemData = null) => {
        const id = Date.now() + Math.random().toString(36).substring(2, 7);
        const currentUnit = itemData ? (itemData.unitName || 'كرتونة') : 'كرتونة';
        const isReturnChecked = itemData ? (itemData.isReturn === true) : false;
        isDataChanged = true;

        let displayQty = 1;
        if (itemData) {
            displayQty = (currentUnit === 'كرتونة') ? (itemData.qty || 1) : (itemData.returnQty || 1);
        }

        const html = `
            <div class="item-row ${isReturnChecked ? 'is-return' : ''}" id="row_${id}">
                <div class="btn-remove" onclick="this.parentElement.remove(); window.calculateTotal();"><i class="fas fa-times"></i></div>
                <div class="row g-3">
                    <div class="col-12 col-md-6">
                        <label><i class="fas fa-tag"></i> اسم الصنف</label>
                        <input type="text" list="productsData" class="form-control item-name" value="${itemData ? itemData.name : ''}" placeholder="اكتب أول حرف وسيتم الإكمال فوراً...">
                    </div>
                    <div class="col-6 col-md-3">
                        <label><i class="fas fa-boxes-stacked"></i> نوع الوحدة</label>
                        <select class="form-select item-unit" id="unit_${id}">
                            <option value="كرتونة" ${currentUnit === 'كرتونة' ? 'selected' : ''}>كرتونة</option>
                            <option value="قطعة" ${currentUnit === 'قطعة' ? 'selected' : ''}>قطعة (جركن)</option>
                        </select>
                    </div>
                    <div class="col-6 col-md-3 d-flex flex-column justify-content-end">
                        <div class="return-check-container">
                            <div class="form-check form-switch m-0 d-flex align-items-center gap-2">
                                <input class="form-check-input item-is-return" type="checkbox" id="check_${id}" ${isReturnChecked ? 'checked' : ''}>
                                <label class="form-check-label text-danger fw-bold m-0" for="check_${id}">تحديد كمرتجع ↩</label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row g-3 mt-1">
                    <div class="col-6 col-md-4">
                        <label class="text-success fw-bold" id="label_qty_${id}">العدد الحالي (${currentUnit === 'كرتونة' ? 'كرتونة' : 'جركن'})</label>
                        <input type="number" step="0.01" class="form-control item-qty" value="${displayQty}">
                    </div>
                    <div class="col-6 col-md-4">
                        <label id="label_price_${id}">سعر شراء الـ (${currentUnit === 'كرتونة' ? 'كرتونة' : 'جركن'})</label>
                        <input type="number" step="0.01" class="form-control item-buy" value="${itemData ? itemData.buy : ''}" placeholder="0.00">
                    </div>
                    <div class="col-12 col-md-4 d-flex flex-column justify-content-end align-items-end">
                        <label class="w-100 text-start"><i class="fas fa-coins"></i> الصافي الفرعي للبنود</label>
                        <div class="subtotal-display w-100 text-center">
                            <input type="text" class="item-subtotal border-0 bg-transparent fw-bold text-center w-100" readonly value="0.00">
                        </div>
                    </div>
                </div>
            </div>`;
        document.getElementById('itemsList').insertAdjacentHTML('beforeend', html);
        setupRowEvents(id);
        window.calculateTotal();
    }

    function setupRowEvents(id) {
        const row = document.getElementById(`row_${id}`);
        const nameInput = row.querySelector('.item-name');
        const unitSelect = row.querySelector('.item-unit');
        const returnCheck = row.querySelector('.item-is-return');

        returnCheck.addEventListener('change', (e) => {
            if(e.target.checked) row.classList.add('is-return');
            else row.classList.remove('is-return');
            window.calculateTotal();
        });

        unitSelect.addEventListener('change', (e) => {
            const val = e.target.value;
            const unitText = val === 'كرتونة' ? 'كرتونة' : 'جركن';
            document.getElementById(`label_qty_${id}`).innerText = `العدد الحالي (${unitText})`;
            document.getElementById(`label_price_${id}`).innerText = `سعر شراء الـ (${unitText})`;
            
            const found = allInventory.find(p => p.name === nameInput.value);
            if(found) {
                if (val === 'كرتونة') {
                    row.querySelector('.item-buy').value = found.buy || 0;
                } else {
                    const factor = Number(found.unitFactor) || 1;
                    row.querySelector('.item-buy').value = ((found.buy || 0) / factor).toFixed(2);
                }
            }
            window.calculateTotal();
        });

        nameInput.addEventListener('keyup', (e) => {
            if (["Backspace", "Delete", "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(e.key)) return;
            const inputVal = e.target.value;
            if (!inputVal || inputVal.trim() === "") return;
            const match = allInventory.find(p => p.name.toLowerCase().startsWith(inputVal.toLowerCase()));
            if (match && match.name !== inputVal) {
                const startSelection = inputVal.length;
                e.target.value = match.name;
                e.target.setSelectionRange(startSelection, match.name.length);
                row.querySelector('.item-buy').value = match.buy || 0;
                unitSelect.value = "كرتونة";
                document.getElementById(`label_qty_${id}`).innerText = `العدد الحالي (كرتونة)`;
                document.getElementById(`label_price_${id}`).innerText = `سعر شراء الـ (كرتونة)`;
                window.calculateTotal();
            }
        });

        nameInput.addEventListener('change', (e) => {
            const found = allInventory.find(p => p.name === e.target.value);
            if(found) {
                row.querySelector('.item-buy').value = found.buy || 0;
                unitSelect.value = "كرتونة";
                unitSelect.dispatchEvent(new Event('change'));
            } else if (e.target.value !== "") {
                alert("عذرًا، هذا الصنف غير مسجل بالنظام. يرجى اختيار صنف صحيح من القائمة المقترحة.");
                e.target.value = "";
            }
            window.calculateTotal();
        });

        row.querySelectorAll('input, select').forEach(input => {
            input.addEventListener('input', window.calculateTotal);
            input.addEventListener('change', window.calculateTotal);
        });
    }

    window.calculateTotal = () => {
        let grossTotal = 0;
        const rows = document.querySelectorAll('.item-row');
        document.getElementById('itemsCount').innerText = rows.length;

        rows.forEach(row => {
            const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
            const buy = parseFloat(row.querySelector('.item-buy').value) || 0;
            const isReturn = row.querySelector('.item-is-return').checked;

            const sub = qty * buy * (isReturn ? -1 : 1);
            const subEl = row.querySelector('.item-subtotal');
            subEl.value = sub.toFixed(2);
            subEl.style.color = isReturn ? 'var(--danger)' : 'var(--primary-dark)';
            grossTotal += sub;
        });

        document.getElementById('grossTotal').innerText = grossTotal.toFixed(2);

        let cashVal = parseFloat(cashInput.value) || 0;
        let walletVal = parseFloat(walletInput.value) || 0;

        let totalPaid = cashVal + walletVal;
        let pendingVal = grossTotal - totalPaid;

        document.getElementById('displayCash').innerText = cashVal.toFixed(2);
        document.getElementById('displayWallet').innerText = walletVal.toFixed(2);
        document.getElementById('netTotal').innerText = pendingVal.toFixed(2);

        let prevBalance = parseFloat(currentFetchedOldBalance) || 0;
        document.getElementById('displayPreviousBalance').innerText = prevBalance.toFixed(2);

        let totalSupplierFinal = prevBalance + pendingVal;
        document.getElementById('totalSupplierBalance').innerText = totalSupplierFinal.toFixed(2);
    };

    // --- التعديل الذهبي في فاتورة المشتريات (تطبيق Batches + تجميد التحويل) ---
    document.getElementById('btnSaveInvoice').addEventListener('click', async () => {
        const btn = document.getElementById('btnSaveInvoice');
        const supplierId = document.getElementById('supplierSelect').value;
        const grossTotal = parseFloat(document.getElementById('grossTotal').innerText) || 0;
        const cashPaid = parseFloat(document.getElementById('cashAmount').value) || 0;
        const walletPaid = parseFloat(document.getElementById('walletAmount').value) || 0;
        const totalPaid = cashPaid + walletPaid;
        const invoiceDate = document.getElementById('invDate').value;
        const pendingAmount = grossTotal - totalPaid;
        const rows = document.querySelectorAll('.item-row');

        if(!supplierId) return alert("برجاء اختيار اسم المورد أولاً");
        if(rows.length === 0) return alert("برجاء إضافة الأصناف أولاً");

        // التأكد من أن كل الأصناف مسجلة
        for (const row of rows) {
            const name = row.querySelector('.item-name').value.trim();
            const isExist = allInventory.some(p => p.name === name);
            if (!isExist || name === "") {
                alert(`خطأ: الصنف "${name}" غير مسجل بقاعدة البيانات!`);
                return;
            }
        }

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> جاري الترحيل والموازنة الحالية...';

        try {
            // 1. تفعيل نظام الـ Batch لحماية البيانات من انقطاع الإنترنت
            const batch = writeBatch(db);

            // 2. تجميع وتجميد البيانات
            const items = [];
            for (const row of rows) {
                const name = row.querySelector('.item-name').value;
                const qtyInput = parseFloat(row.querySelector('.item-qty').value) || 0;
                const buy = parseFloat(row.querySelector('.item-buy').value) || 0;
                const unitName = row.querySelector('.item-unit').value;
                const isReturn = row.querySelector('.item-is-return').checked;

                const matchedProduct = allInventory.find(p => p.name === name);
                const factor = Number(matchedProduct?.unitFactor) || 1;

                const totalPcs = unitName === 'كرتونة' ? (qtyInput * factor) : qtyInput;
                const baseCartonPrice = unitName === 'قطعة' ? (buy * factor) : buy;

                items.push({ 
                    name, 
                    stockId: matchedProduct.id, 
                    qty: unitName === 'كرتونة' ? qtyInput : 0, 
                    returnQty: unitName === 'قطعة' ? qtyInput : 0, 
                    buy, 
                    unitName, 
                    unitFactor: factor, 
                    totalPieces: totalPcs,
                    isReturn: isReturn,
                    baseCartonPrice: baseCartonPrice
                });
            }

            // 3. إرجاع الأرصدة القديمة في حالة التعديل
            if (editId && oldInvoiceData && Array.isArray(oldInvoiceData.items)) {
                for (const oldItem of oldInvoiceData.items) {
                    const oldModifier = Number(oldItem.totalPieces) || 0;
                    if (!oldModifier) continue;
                    
                    let matchedOldProduct = null;
                    if (oldItem.stockId) {
                        matchedOldProduct = allInventory.find(p => p.id === oldItem.stockId);
                    }
                    if (!matchedOldProduct) {
                        matchedOldProduct = allInventory.find(p => p.name === oldItem.name);
                    }

                    if (matchedOldProduct) {
                        const itemRef = doc(db, "inventory", matchedOldProduct.id);
                        const isOldReturn = oldItem.isReturn === true;
                        
                        // الفاتورة القديمة شراء (إضافة للمخزن) نعكسها بخصم، والمرتجع (خصم) نعكسه بإضافة
                        const finalOldMod = isOldReturn ? oldModifier : -oldModifier; 
                        
                        batch.update(itemRef, {
                            totalPcs: increment(finalOldMod)
                        });
                    }
                }
            }

            // 4. تطبيق الأرصدة والأسعار الجديدة للمخزن
            for (const item of items) {
                if (item.stockId) {
                    const storeDocRef = doc(db, "inventory", item.stockId);
                    
                    // الفاتورة الحالية: شراء = زيادة للمخزن (+)، مرتجع = خصم من المخزن (-)
                    const stockIncrement = item.isReturn ? -item.totalPieces : item.totalPieces;
                    
                    batch.update(storeDocRef, {
                        totalPcs: increment(stockIncrement),
                        buy: item.baseCartonPrice, // حفظ السعر دائماً للكرتونة لمنع الانهيار السعري
                        unitName: item.unitName, 
                        lastUpdate: serverTimestamp()
                    });
                }
            }

            // 5. إعداد وحفظ مستند الفاتورة
            let finalPaymentType = "آجل";
            if(cashPaid > 0 && walletPaid > 0) finalPaymentType = "مشترك (كاش + محفظة)";
            else if(cashPaid > 0) finalPaymentType = "نقدي (كاش)";
            else if(walletPaid > 0) finalPaymentType = "محفظة إلكترونية";

            const invoiceObj = {
                supplierId: supplierId,
                total: grossTotal, grossTotal: grossTotal,
                cashPaid: cashPaid, walletPaid: walletPaid, totalPaid: totalPaid, netTotal: pendingAmount,
                items, type: "شراء", paymentType: finalPaymentType, date: invoiceDate, 
                timestamp: editId ? oldInvoiceData.timestamp : serverTimestamp()
            };

            let currentDocId = editId;
            if (editId) {
                const invRef = doc(db, "supplier_transactions", editId);
                batch.update(invRef, invoiceObj);
            } else {
                const newInvRef = doc(collection(db, "supplier_transactions"));
                batch.set(newInvRef, invoiceObj);
                currentDocId = newInvRef.id;
            }

            // 6. تسجيل المعاملات المالية
            if (cashPaid > 0) {
                const newTransRef = doc(collection(db, "transactions"));
                batch.set(newTransRef, {
                    amount: cashPaid, type: "صرف", actionType: "سداد مورد",
                    details: `سداد نقدي (كاش) مقابل فاتورة شراء رقم (${currentDocId.substring(0,6)})`,
                    date: invoiceDate, supplierId: supplierId, invoiceId: currentDocId,
                    paymentMethod: "cash", timestamp: serverTimestamp()
                });
            }

            if (walletPaid > 0) {
                const newTransRef2 = doc(collection(db, "transactions"));
                batch.set(newTransRef2, {
                    amount: walletPaid, type: "صرف", actionType: "سداد مورد",
                    details: `سداد محفظة إلكترونية مقابل فاتورة شراء رقم (${currentDocId.substring(0,6)})`,
                    date: invoiceDate, supplierId: supplierId, invoiceId: currentDocId,
                    paymentMethod: "wallet", timestamp: serverTimestamp()
                });
            }

            // 7. تنفيذ العملية المجمعة بالكامل بضربة واحدة!
            await batch.commit();

            isSubmitting = true;
            alert("تم حفظ الفاتورة بنجاح وتحديث الحسابات والمخزن بشكل دقيق وموازن 🚀");
            window.location.href = "purchase-invoices-list.html";

        } catch (e) {
            console.error(e);
            alert("حدث خطأ أثناء الحفظ: " + e.message);
            btn.disabled = false;
            btn.innerText = "حفظ وترحيل الفاتورة للسيستم";
        }
    });

    document.getElementById('addItemBtn').addEventListener('click', () => { window.addNewItemRow(); });
    document.getElementById('invDate').valueAsDate = new Date();
    loadData();
</script>
