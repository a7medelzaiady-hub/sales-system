<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فاتورة شراء احترافية | شركة الزيادى</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --accent: #0b5e3d; 
            --accent-light: #198754;
            --bg-light: #f4f7f6;
            --text-primary: #1b2e26;
            --border: #e2e9e5;
            --white: #ffffff;
            --text-muted: #61736b;
            --shadow: 0 8px 24px rgba(11, 94, 61, 0.04);
            --radius-lg: 20px;
            --radius-md: 12px;
        }

        body { 
            background: var(--bg-light); 
            font-family: 'Cairo', sans-serif; 
            color: var(--text-primary); 
            padding-bottom: 140px; 
        }
        
        /* الهيدر الإحترافي الموحد */
        .invoice-header { 
            background: var(--accent); 
            padding: 15px 20px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.06); 
            color: white;
            position: sticky; 
            top: 0; 
            z-index: 1000;
        }

        .clickable-icon { cursor: pointer; transition: transform 0.2s; opacity: 0.9; }
        .clickable-icon:hover { transform: scale(1.1); opacity: 1; }
        .badge-status { background: var(--white); color: var(--accent); padding: 5px 14px; border-radius: var(--radius-md); font-weight: 700; font-size: 0.8rem; }

        /* كروت البيانات المطورة */
        .section-card { 
            background: var(--white); 
            border: 1px solid var(--border); 
            border-radius: var(--radius-lg); 
            padding: 22px; 
            margin-top: 18px;
            box-shadow: var(--shadow);
        }

        .section-title {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 2px solid var(--bg-light);
            padding-bottom: 10px;
        }

        /* عناصر الإدخال الاحترافية */
        label { font-size: 0.8rem; margin-bottom: 8px; color: var(--text-secondary); font-weight: 700; display: flex; align-items: center; gap: 6px; }
        .form-control, .form-select { 
            background: var(--white) !important; 
            border: 1px solid var(--border) !important; 
            color: var(--text-primary) !important; 
            border-radius: var(--radius-md); 
            padding: 11px 14px; 
            font-size: 0.9rem; 
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .form-control:focus, .form-select:focus { 
            border-color: var(--accent-light) !important; 
            box-shadow: 0 0 0 4px rgba(25, 135, 84, 0.1) !important; 
        }
        .form-control:disabled { background: #eef2f0 !important; color: var(--text-muted) !important; }

        /* صفوف الأصناف بتصميم المبيعات التفاعلي */
        .item-row { 
            background: var(--white); 
            border: 1px solid var(--border); 
            border-radius: var(--radius-lg); 
            padding: 20px; 
            margin-bottom: 16px; 
            position: relative; 
            box-shadow: var(--shadow);
            border-right: 5px solid var(--accent-light);
            transition: all 0.25s ease;
        }
        .item-row.is-return {
            border-right: 5px solid #dc3545;
            background: #fff8f8;
        }
        
        .btn-remove { 
            position: absolute; top: -10px; left: -10px; background: #dc3545; 
            color: #fff; width: 28px; height: 28px; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 0.8rem; cursor: pointer; z-index: 10; border: 2px solid var(--white); 
            box-shadow: 0 2px 8px rgba(220,53,69,0.2);
            transition: 0.2s;
        }
        .btn-remove:hover { transform: scale(1.1); background: #bd2130; }
        
        /* أزرار زيادة ونقصان الكمية الذكية */
        .qty-control-group { display: flex; align-items: center; }
        .qty-btn {
            background: var(--bg-light); border: 1px solid var(--border);
            width: 38px; height: 42px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-weight: bold; color: var(--text-primary); transition: 0.2s;
        }
        .qty-btn.minus { border-radius: 0 var(--radius-md) var(--radius-md) 0; }
        .qty-btn.plus { border-radius: var(--radius-md) 0 0 var(--radius-md); }
        .qty-btn:hover { background: var(--border); }
        .qty-input { text-align: center !important; border-radius: 0 !important; max-width: 70px; height: 42px; }

        .add-item-btn { 
            background: #e6f2ed; color: var(--accent); border: 2px dashed var(--accent); 
            width: 100%; padding: 14px; border-radius: var(--radius-md); font-weight: 700; transition: 0.2s; 
        }
        .add-item-btn:hover { background: var(--accent); color: white; }

        .subtotal-display { 
            background: #f4f7f6; border-radius: var(--radius-md); padding: 11px; 
            border: 1px solid var(--border); color: var(--accent); font-weight: 800; font-size: 1rem;
        }

        .return-switch-container {
            display: flex; align-items: center; justify-content: center;
            background: #fff5f5; padding: 11px; border-radius: var(--radius-md); border: 1px solid #fcc;
            height: 44px;
        }

        /* الفوتر السفلي العائم */
        .invoice-footer-bar { 
            position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.96); padding: 14px 24px; 
            border: 1px solid var(--border); display: flex; align-items: center;
            justify-content: space-between; gap: 20px; z-index: 1050;
            box-shadow: 0 12px 35px rgba(11, 94, 61, 0.15);
            border-radius: 24px; width: 92%; max-width: 600px;
            backdrop-filter: blur(10px);
        }

        .footer-total-box { display: flex; flex-direction: column; }
        .footer-total-box .label { font-size: 0.75rem; color: var(--text-muted); font-weight: 700; }
        .footer-total-box .val { color: var(--accent); font-size: 1.8rem; font-weight: 900; font-family: 'Consolas', monospace; }

        .btn-submit-invoice { 
            background: var(--accent); color: #fff; border: none; padding: 12px 30px; 
            border-radius: 16px; font-weight: 700; font-size: 1rem; flex-grow: 1;
            box-shadow: 0 4px 14px rgba(11, 94, 61, 0.25); transition: 0.2s; 
        }
        .btn-submit-invoice:hover { background: #073a26; transform: translateY(-2px); }
    </style>
</head>
<body>

<datalist id="productsData"></datalist>

<div class="invoice-header">
    <div class="d-flex align-items-center gap-3">
        <i class="fas fa-arrow-right clickable-icon" id="btnBack" title="رجوع"></i>
        <i class="fas fa-house clickable-icon" id="btnHome" title="الرئيسية"></i>
    </div>
    <h6 class="m-0 fw-bold" id="mainTitle">فاتورة شراء جديدة</h6>
    <div id="statusBadge" class="badge-status">جديدة</div>
</div>

<div class="container mt-2">
    <div class="section-card">
        <div class="section-title">
            <i class="fas fa-paste"></i> بيانات الفاتورة الأساسية
        </div>
        <div class="row g-3">
            <div class="col-12 col-md-6">
                <label><i class="fas fa-truck-field"></i> اسم المورد المعتمد</label>
                <select id="supplierSelect" class="form-select"></select>
            </div>
            <div class="col-12 col-md-6">
                <label><i class="fas fa-calendar-day"></i> تاريخ الإنشاء</label>
                <input type="date" id="invDate" class="form-control">
            </div>
            <div class="col-12 col-md-6">
                <label><i class="fas fa-credit-card"></i> نظام الدفع</label>
                <select id="paymentType" class="form-select">
                    <option value="credit">آجل (على الحساب)</option>
                    <option value="cash">نقدي (كاش)</option>
                </select>
            </div>
            <div class="col-12 col-md-6">
                <label class="text-dark fw-bold"><i class="fas fa-money-bill-wave text-success"></i> المبلغ المدفوع (السداد)</label>
                <input type="number" step="0.01" id="paidAmount" class="form-control" value="0.00" placeholder="0.00">
            </div>
        </div>
    </div>

    <div class="d-flex align-items-center justify-content-between mt-4 mb-2 px-1">
        <h6 class="fw-bold m-0 text-secondary"><i class="fas fa-boxes-stacked me-1"></i> الأصناف المدرجة بالفاتورة</h6>
    </div>
    
    <div id="itemsList"></div>

    <button type="button" class="add-item-btn mt-2" id="addItemBtn">
        <i class="fas fa-plus-circle me-1"></i> إضافة صنف جديد لقائمة المشتريات
    </button>
</div>

<div class="invoice-footer-bar">
    <div class="footer-total-box">
        <span class="label">إجمالي صافي الفاتورة</span>
        <span class="val" id="netTotal">0.00</span>
    </div>
    <button class="btn-submit-invoice" id="btnSaveInvoice">حفظ وترحيل الفاتورة</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, doc, getDoc, updateDoc, increment, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
        authDomain: "ahmedelzaiady.firebaseapp.com",
        projectId: "ahmedelzaiady",
        storageBucket: "ahmedelzaiady.firebasestorage.app",
        messagingSenderId: "300306825071",
        appId: "1:300306825071:web:0426ddde56280fa090329a",
        measurementId: "G-WE04GK5XZZ"
    };
    
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const editId = urlParams.get('edit');
    const orderId = urlParams.get('orderId'); 

    let allInventory = [];
    let isDataChanged = false; 
    let isSubmitting = false; 

    window.addEventListener('beforeunload', (e) => {
        if (isDataChanged && !isSubmitting) {
            e.preventDefault();
            e.returnValue = "هل تريد الخروج؟ ستفقد التعديلات الحالية غير المحفوظة.";
        }
    });

    function safeNavigate(targetUrl, useHistory = false) {
        if (isDataChanged) {
            const confirmLeave = confirm("هل تريد الخروج؟ ستفقد المدخلات الحالية.");
            if (!confirmLeave) return;
        }
        if (useHistory) {
            window.history.back();
        } else {
            window.location.href = targetUrl;
        }
    }

    document.getElementById('btnBack').addEventListener('click', () => safeNavigate(null, true));
    document.getElementById('btnHome').addEventListener('click', () => safeNavigate('index1.html'));

    const paymentSelect = document.getElementById('paymentType');
    const paidInput = document.getElementById('paidAmount');
    
    paymentSelect.addEventListener('change', () => {
        if (paymentSelect.value === 'cash') {
            paidInput.disabled = true;
            paidInput.value = document.getElementById('netTotal').innerText;
        } else {
            paidInput.disabled = false;
            paidInput.value = "0.00";
        }
    });

    async function loadData() {
        const supSelect = document.getElementById('supplierSelect');
        const supSnap = await getDocs(collection(db, "suppliers"));
        supSelect.innerHTML = ""; 
        supSnap.forEach(d => { supSelect.innerHTML += `<option value="${d.id}">${d.data().name}</option>`; });

        const invSnap = await getDocs(collection(db, "inventory"));
        const prodDataList = document.getElementById('productsData');
        allInventory = [];
        prodDataList.innerHTML = "";
        invSnap.forEach(d => {
            const data = d.data();
            allInventory.push({ id: d.id, ...data });
            prodDataList.innerHTML += `<option value="${data.name}">`;
        });
        
        if (editId) { 
            await loadInvoiceForEdit(); 
        } else if (orderId) {
            await loadOrderData(orderId);
        } else { 
            addNewItemRow(); 
        }

        setTimeout(() => {
            document.querySelectorAll('input, select').forEach(el => {
                el.addEventListener('change', () => { isDataChanged = true; });
                el.addEventListener('input', () => { isDataChanged = true; });
            });
        }, 1000);
    }

    async function loadInvoiceForEdit() {
        document.getElementById('mainTitle').innerText = "تعديل فاتورة الشراء";
        document.getElementById('statusBadge').innerText = "تعديل";
        document.getElementById('statusBadge').className = "badge-status bg-warning text-dark";

        const invRef = doc(db, "supplier_transactions", editId);
        const invSnap = await getDoc(invRef);

        if (invSnap.exists()) {
            const data = invSnap.data();
            document.getElementById('supplierSelect').value = data.supplierId;
            document.getElementById('invDate').value = data.date;
            document.getElementById('paymentType').value = data.paymentType || 'credit';
            document.getElementById('paidAmount').value = data.paidAmount || '0.00';
            
            document.getElementById('itemsList').innerHTML = ""; 
            
            if (data.items && data.items.length > 0) {
                data.items.forEach(item => { addNewItemRow(item); });
            }
            window.calculateTotal();
        }
    }

    async function loadOrderData(id) {
        try {
            const orderSnap = await getDoc(doc(db, "purchase_orders", id));
            if (orderSnap.exists()) {
                const data = orderSnap.data();
                document.getElementById('supplierSelect').value = data.supplierId;
                document.getElementById('itemsList').innerHTML = ""; 
                
                data.items.forEach(item => {
                    addNewItemRow({
                        name: item.name,
                        qty: item.qty,
                        returnQty: item.returnQty || 0,
                        buy: item.buy || 0,
                        unitName: item.unitName || 'كرتونة'
                    });
                });
                window.calculateTotal();
            }
        } catch (e) { console.error(e); }
    }

    window.addNewItemRow = (itemData = null) => {
        const id = Date.now() + Math.random();
        const currentUnit = itemData ? (itemData.unitName || 'كرتونة') : 'كرتونة';
        const isReturnChecked = itemData && itemData.returnQty > 0;
        isDataChanged = true;

        const html = `
            <div class="item-row ${isReturnChecked ? 'is-return' : ''}" id="row_${id}">
                <div class="btn-remove" onclick="this.parentElement.remove(); window.calculateTotal();">
                    <i class="fas fa-times"></i>
                </div>
                
                <div class="row g-3">
                    <div class="col-12 col-md-5">
                        <label>اسم صنف الشراء</label>
                        <input type="text" list="productsData" class="form-control item-name" value="${itemData ? itemData.name : ''}" placeholder="ابحث أو اختر الصنف المطلوب">
                    </div>

                    <div class="col-6 col-md-3">
                        <label>نوع وحدة الشراء</label>
                        <select class="form-select item-unit">
                            <option value="كرتونة" ${currentUnit === 'كرتونة' ? 'selected' : ''}>كرتونة</option>
                            <option value="قطعة" ${currentUnit === 'قطعة' ? 'selected' : ''}>قطعة</option>
                        </select>
                    </div>

                    <div class="col-6 col-md-4">
                        <label>حالة الصنف</label>
                        <div class="return-switch-container">
                            <div class="form-check form-switch m-0 d-flex align-items-center gap-2">
                                <input class="form-check-input item-is-return" type="checkbox" id="check_${id}" ${isReturnChecked ? 'checked' : ''}>
                                <label class="form-check-label text-danger fw-bold m-0" for="check_${id}">تحديد كمرتجع ↩️</label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row g-3 mt-1">
                    <div class="col-6 col-md-4">
                        <label class="text-success fw-bold" id="label_qty_${id}">الكمية (${currentUnit})</label>
                        <div class="qty-control-group">
                            <button type="button" class="qty-btn minus" onclick="this.nextElementSibling.stepDown(); window.calculateTotal();">-</button>
                            <input type="number" step="1" class="form-control qty-input item-qty" value="${itemData ? (isReturnChecked ? itemData.returnQty : itemData.qty) : '1'}">
                            <button type="button" class="qty-btn plus" onclick="this.previousElementSibling.stepUp(); window.calculateTotal();">+</button>
                        </div>
                    </div>

                    <div class="col-6 col-md-4">
                        <label id="label_price_${id}">سعر تكلفة الـ (${currentUnit})</label>
                        <input type="number" step="0.01" class="form-control item-buy" value="${itemData ? itemData.buy : ''}" placeholder="0.00">
                    </div>

                    <div class="col-12 col-md-4 d-flex flex-column justify-content-end">
                        <label class="w-100 text-start">الصافي الفرعي</label>
                        <input type="text" class="item-subtotal subtotal-display border-0 text-center w-100" readonly value="0.00">
                    </div>
                </div>
            </div>`;
        document.getElementById('itemsList').insertAdjacentHTML('beforeend', html);
        setupRowEvents(id);
        window.calculateTotal();
    }

    function setupRowEvents(id) {
        const row = document.getElementById(`row_${id}`);
        const nameInput = row.querySelector('.item-name');
        const unitSelect = row.querySelector('.item-unit');
        const returnCheck = row.querySelector('.item-is-return');

        returnCheck.addEventListener('change', (e) => {
            if(e.target.checked) {
                row.classList.add('is-return');
            } else {
                row.classList.remove('is-return');
            }
            window.calculateTotal();
        });

        unitSelect.addEventListener('change', (e) => {
            const val = e.target.value;
            document.getElementById(`label_qty_${id}`).innerText = `الكمية (${val})`;
            document.getElementById(`label_price_${id}`).innerText = `سعر تكلفة الـ (${val})`;
            window.calculateTotal();
        });

        nameInput.addEventListener('change', (e) => {
            const found = allInventory.find(p => p.name === e.target.value);
            if(found) {
                row.querySelector('.item-buy').value = found.buy || 0;
                unitSelect.value = found.unitName || "كرتونة";
                unitSelect.dispatchEvent(new Event('change'));
            }
            window.calculateTotal();
        });

        row.querySelectorAll('input, select').forEach(input => {
            input.addEventListener('input', window.calculateTotal);
            input.addEventListener('change', window.calculateTotal);
        });
    }

    window.calculateTotal = () => {
        let netTotal = 0;
        document.querySelectorAll('.item-row').forEach(row => {
            const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
            const buy = parseFloat(row.querySelector('.item-buy').value) || 0;
            const isReturn = row.querySelector('.item-is-return').checked;
            
            const factorMultiplier = isReturn ? -1 : 1;
            const sub = qty * buy * factorMultiplier;
            
            row.querySelector('.item-subtotal').value = sub.toFixed(2);
            netTotal += sub;
        });
        
        document.getElementById('netTotal').innerText = netTotal.toFixed(2);
        
        if (paymentSelect.value === 'cash') {
            paidInput.value = netTotal.toFixed(2);
        }
    };

    document.getElementById('paidAmount').addEventListener('input', window.calculateTotal);

    document.getElementById('btnSaveInvoice').addEventListener('click', async () => {
        const btn = document.getElementById('btnSaveInvoice');
        const supplierId = document.getElementById('supplierSelect').value;
        const netTotal = parseFloat(document.getElementById('netTotal').innerText);
        const paidAmount = parseFloat(document.getElementById('paidAmount').value) || 0;
        const paymentType = document.getElementById('paymentType').value;
        
        if(!supplierId || document.querySelectorAll('.item-row').length === 0) return alert("برجاء إكمال بيانات الفاتورة وإضافة أصناف أولاً.");

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> جاري حفظ الفاتورة...';

        try {
            const items = [];
            const rows = document.querySelectorAll('.item-row');

            for (const row of rows) {
                const name = row.querySelector('.item-name').value;
                const qtyInput = parseFloat(row.querySelector('.item-qty').value) || 0;
                const buy = parseFloat(row.querySelector('.item-buy').value) || 0;
                const unitName = row.querySelector('.item-unit').value;
                const isReturn = row.querySelector('.item-is-return').checked;

                let qty = isReturn ? 0 : qtyInput;
                let returnQty = isReturn ? qtyInput : 0;

                const finalQtyModifier = isReturn ? -qtyInput : qtyInput;
                
                items.push({ name, qty, returnQty, buy, unitName, unitFactor: 1, totalPieces: finalQtyModifier });

                const q = query(collection(db, "inventory"), where("name", "==", name));
                const qSnap = await getDocs(q);

                if(!qSnap.empty) {
                    const dRef = doc(db, "inventory", qSnap.docs[0].id);
                    await updateDoc(dRef, {
                        qty: increment(finalQtyModifier), 
                        totalPcs: increment(finalQtyModifier), 
                        buy: buy,
                        unitName: unitName,
                        unitFactor: 1,
                        lastUpdate: serverTimestamp()
                    });
                } else {
                    await addDoc(collection(db, "inventory"), {
                        name, qty: finalQtyModifier, totalPcs: finalQtyModifier, buy, 
                        unitName: unitName || "قطعة", unitFactor: 1,
                        sell: buy * 1.2, min: 3, category: "عام", timestamp: serverTimestamp()
                    });
                }
            }

            const invoiceObj = {
                supplierId, total: netTotal, paidAmount, netTotal, items, type: "شراء", paymentType,
                date: document.getElementById('invDate').value,
                timestamp: serverTimestamp()
            };

            if (editId) {
                await updateDoc(doc(db, "supplier_transactions", editId), invoiceObj);
            } else {
                await addDoc(collection(db, "supplier_transactions"), invoiceObj);
                
                if(paymentType === 'credit') {
                    const finalDebt = netTotal - paidAmount; 
                    if (finalDebt !== 0) {
                        await updateDoc(doc(db, "suppliers", supplierId), { currentBalance: increment(finalDebt) });
                    }
                }
            }

            isSubmitting = true; 
            alert("تم ترحيل وحفظ فاتورة المشتريات بنجاح وإعادة ضبط المخزون المعتمد ✅");
            window.location.href = "purchase-invoices-list.html";

        } catch (e) {
            alert("حدث خطأ غير متوقع أثناء الحفظ");
            btn.disabled = false;
            btn.innerText = "حفظ وترحيل الفاتورة";
        }
    });

    document.getElementById('addItemBtn').addEventListener('click', () => {
        window.addNewItemRow();
    });

    document.getElementById('invDate').valueAsDate = new Date();
    loadData();
</script>
</body>
</html>
