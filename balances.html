<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مقارنة الأرصدة — شركة الزيادي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --german-black: #000000;
            --german-red: #DD0000;
            --german-gold: #FFCE00;
            --bg-light: #f4f6f8;
            --text-primary: #1e293b;
            --white: #ffffff;
            --border: #e2e8f0;
        }

        body { 
            background: var(--bg-light); 
            font-family: 'Cairo', sans-serif; 
            color: var(--text-primary); 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Header styled like the German Flag */
        .header-section { 
            padding: 0 16px; 
            height: 65px;
            background: linear-gradient(to bottom, var(--german-black) 33.33%, var(--german-red) 33.33%, var(--german-red) 66.66%, var(--german-gold) 66.66%);
            color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,.15);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        
        .header-overlay {
            background: rgba(0,0,0,0.7);
            height: 100%;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .header-container { 
            height: 100%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: relative;
            z-index: 2;
        }

        .header-title {
            color: var(--german-gold);
            font-weight: 900;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        .content-container {
            flex: 1;
            padding: 24px 12px 40px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        .comparison-card {
            background: var(--white);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            border-top: 5px solid var(--german-black);
            border-bottom: 5px solid var(--german-gold);
            position: relative;
        }
        
        .comparison-card::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 5px;
            background: var(--german-gold);
            border-radius: 0 0 16px 16px;
            z-index: 1;
        }
        .comparison-card::before {
            content: '';
            position: absolute;
            left: 0;
            bottom: 5px;
            width: 100%;
            height: 5px;
            background: var(--german-red);
            z-index: 1;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--german-black);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .table-responsive {
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        table {
            margin-bottom: 0 !important;
            background: white;
        }

        thead {
            background: var(--german-black);
            color: white;
        }
        
        thead th {
            font-weight: 700;
            padding: 12px 15px !important;
            border-bottom: 3px solid var(--german-red) !important;
        }

        tbody td {
            vertical-align: middle;
            padding: 12px 15px !important;
            font-weight: 600;
        }

        .item-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-left: 10px;
            background: #f1f5f9;
        }

        .icon-cash { color: #10b981; }
        .icon-wallet { color: #8b5cf6; }
        .icon-customers { color: #3b82f6; }
        .icon-suppliers { color: #ef4444; }
        .icon-stock { color: #f59e0b; }

        .form-control {
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-weight: 700;
            text-align: center;
            padding: 8px;
            transition: all 0.2s;
        }

        .form-control:focus {
            border-color: var(--german-red);
            box-shadow: 0 0 0 0.25rem rgba(221, 0, 0, 0.25);
        }

        .val-current {
            font-size: 1.1rem;
            color: var(--german-black);
            background: #f8fafc;
            padding: 6px 12px;
            border-radius: 8px;
            display: inline-block;
            min-width: 100px;
            text-align: center;
            border: 1px dashed #cbd5e1;
        }

        .val-diff {
            font-size: 1rem;
            font-weight: 800;
            direction: ltr;
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
        }
        .diff-positive { color: #166534; background: #dcfce7; }
        .diff-negative { color: #991b1b; background: #fee2e2; }
        .diff-zero { color: #475569; background: #f1f5f9; }

        .btn-save {
            background: var(--german-red);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px 24px;
            font-weight: 800;
            font-size: 1.1rem;
            width: 100%;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(221,0,0,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        
        .btn-save:hover {
            background: #b90000;
            transform: translateY(-2px);
            color: white;
        }

        .btn-action { 
            width: 36px; height: 36px; border-radius: 9px;
            background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3);
            color: #fff; transition: background 0.15s; 
            display: flex; align-items: center; justify-content: center;
        }
        .btn-action:hover { background: rgba(255,255,255,0.4); color: #fff; }
        
        .history-card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin-top: 20px;
            border: 1px solid var(--border);
        }
        
        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dashed #e2e8f0;
        }
        .history-item:last-child { border-bottom: none; }
        
        .history-date { font-size: 0.85rem; color: #64748b; font-weight: 600; }
        .history-badge { 
            background: var(--german-black); 
            color: var(--german-gold); 
            padding: 3px 8px; 
            border-radius: 6px; 
            font-size: 0.75rem; 
            font-weight: 700;
        }

        .loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 16px;
            backdrop-filter: blur(2px);
            display: none; /* hidden by default */
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--german-gold);
            border-top: 4px solid var(--german-red);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="header-section">
        <div class="header-overlay"></div>
        <div class="header-container container">
            <div style="width: 36px;"></div>
            <div class="title-area text-center flex-grow-1">
                <h5 class="fw-bold m-0 header-title" style="font-size: 1.2rem;">أرصدة النظام</h5>
            </div>
            <a href="reports.html" class="btn-action text-decoration-none">
                <i class="fas fa-arrow-right"></i>
            </a>
        </div>
    </div>

    <div class="content-container">
        
        <div class="comparison-card" id="mainCard">
            <div class="loading-overlay" id="loadingOverlay">
                <div class="spinner"></div>
            </div>

            <div class="section-title">
                <i class="fas fa-scale-balanced" style="color: var(--german-red)"></i>
                مقارنة أرصدة أول المدة والحالي
            </div>

            <div class="table-responsive">
                <table class="table table-hover text-center">
                    <thead>
                        <tr>
                            <th style="width: 30%; text-align: right;">البيان</th>
                            <th style="width: 25%;">رصيد أول المدة</th>
                            <th style="width: 25%;">الرصيد الحالي</th>
                            <th style="width: 20%;">الفرق</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Cash -->
                        <tr>
                            <td style="text-align: right;">
                                <div class="item-icon icon-cash"><i class="fas fa-money-bill-wave"></i></div>
                                النقدية (الكاش)
                            </td>
                            <td><input type="number" class="form-control starting-input" id="start_cash" placeholder="0" oninput="calculateDifferences()"></td>
                            <td><span class="val-current" id="curr_cash">0</span></td>
                            <td><span class="val-diff diff-zero" id="diff_cash">0</span></td>
                        </tr>
                        <!-- Wallet -->
                        <tr>
                            <td style="text-align: right;">
                                <div class="item-icon icon-wallet"><i class="fas fa-wallet"></i></div>
                                المحفظة الإلكترونية
                            </td>
                            <td><input type="number" class="form-control starting-input" id="start_wallet" placeholder="0" oninput="calculateDifferences()"></td>
                            <td><span class="val-current" id="curr_wallet">0</span></td>
                            <td><span class="val-diff diff-zero" id="diff_wallet">0</span></td>
                        </tr>
                        <!-- Customers -->
                        <tr>
                            <td style="text-align: right;">
                                <div class="item-icon icon-customers"><i class="fas fa-users"></i></div>
                                إجمالي العملاء (لنا)
                            </td>
                            <td><input type="number" class="form-control starting-input" id="start_customers" placeholder="0" oninput="calculateDifferences()"></td>
                            <td><span class="val-current" id="curr_customers">0</span></td>
                            <td><span class="val-diff diff-zero" id="diff_customers">0</span></td>
                        </tr>
                        <!-- Suppliers -->
                        <tr>
                            <td style="text-align: right;">
                                <div class="item-icon icon-suppliers"><i class="fas fa-truck"></i></div>
                                إجمالي الموردين (علينا)
                            </td>
                            <td><input type="number" class="form-control starting-input" id="start_suppliers" placeholder="0" oninput="calculateDifferences()"></td>
                            <td><span class="val-current" id="curr_suppliers">0</span></td>
                            <td><span class="val-diff diff-zero" id="diff_suppliers">0</span></td>
                        </tr>
                        <!-- Inventory -->
                        <tr>
                            <td style="text-align: right;">
                                <div class="item-icon icon-stock"><i class="fas fa-boxes"></i></div>
                                قيمة المخزن (بضاعة)
                            </td>
                            <td><input type="number" class="form-control starting-input" id="start_stock" placeholder="0" oninput="calculateDifferences()"></td>
                            <td><span class="val-current" id="curr_stock">0</span></td>
                            <td><span class="val-diff diff-zero" id="diff_stock">0</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="mt-4">
                <button class="btn-save" onclick="saveStartingBalances()" id="saveBtn">
                    <i class="fas fa-save"></i>
                    حفظ أرصدة أول المدة بالتاريخ والساعة
                </button>
            </div>
        </div>

        <!-- History Log -->
        <div class="history-card" style="display: none;" id="historyCard">
            <h6 class="fw-bold mb-3 text-secondary"><i class="fas fa-history"></i> آخر عملية حفظ</h6>
            <div id="lastSaveInfo" class="history-item">
                <span class="history-badge">تم الحفظ</span>
                <span class="history-date" id="lastSaveDate">-</span>
            </div>
        </div>

    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
        authDomain: "ahmedelzaiady.firebaseapp.com",
        projectId: "ahmedelzaiady",
        storageBucket: "ahmedelzaiady.firebasestorage.app",
        messagingSenderId: "300306825071",
        appId: "1:300306825071:web:0426ddde56280fa090329a",
        measurementId: "G-WE04GK5XZZ"
    };
    
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Variables to hold current fetched data
    let currentData = {
        cash: 0,
        wallet: 0,
        customers: 0,
        suppliers: 0,
        stock: 0
    };

    async function fetchSystemBalances() {
        document.getElementById('loadingOverlay').style.display = 'flex';
        
        try {
            // 1. Fetch Customers Balance (sum of currentBalance)
            const custSnap = await getDocs(collection(db, "customers"));
            let totalCustomers = 0;
            custSnap.forEach(doc => {
                const data = doc.data();
                if(data.currentBalance) totalCustomers += Number(data.currentBalance);
            });
            currentData.customers = totalCustomers;

            // 2. Fetch Suppliers Balance
            const suppSnap = await getDocs(collection(db, "suppliers"));
            let totalSuppliers = 0;
            suppSnap.forEach(doc => {
                const data = doc.data();
                if(data.currentBalance) totalSuppliers += Number(data.currentBalance);
            });
            currentData.suppliers = totalSuppliers;

            // 3. Fetch Inventory Value (qty * buy price)
            const invSnap = await getDocs(collection(db, "inventory"));
            let totalStockValue = 0;
            invSnap.forEach(doc => {
                const data = doc.data();
                if(data.qty && data.buy) totalStockValue += (Number(data.qty) * Number(data.buy));
            });
            currentData.stock = totalStockValue;

            // 4. Fetch Cash & Wallet
            const accountDoc = await getDoc(doc(db, "accounts", "main"));
            if(accountDoc.exists()) {
                const d = accountDoc.data();
                currentData.cash = Number(d.cashBalance || 0);
                currentData.wallet = Number(d.walletBalance || 0);
            }

            // Update UI
            document.getElementById('curr_cash').innerText = currentData.cash.toLocaleString();
            document.getElementById('curr_wallet').innerText = currentData.wallet.toLocaleString();
            document.getElementById('curr_customers').innerText = currentData.customers.toLocaleString();
            document.getElementById('curr_suppliers').innerText = currentData.suppliers.toLocaleString();
            document.getElementById('curr_stock').innerText = currentData.stock.toLocaleString();

            // Fetch last saved beginning balances
            await loadSavedStartingBalances();

        } catch (error) {
            console.error("Error fetching balances:", error);
            alert("حدث خطأ أثناء جلب الأرصدة الحالية من قاعدة البيانات");
        } finally {
            document.getElementById('loadingOverlay').style.display = 'none';
        }
    }

    async function loadSavedStartingBalances() {
        try {
            const startDoc = await getDoc(doc(db, "system_metadata", "beginning_balances"));
            if (startDoc.exists()) {
                const data = startDoc.data();
                document.getElementById('start_cash').value = data.cash || 0;
                document.getElementById('start_wallet').value = data.wallet || 0;
                document.getElementById('start_customers').value = data.customers || 0;
                document.getElementById('start_suppliers').value = data.suppliers || 0;
                document.getElementById('start_stock').value = data.stock || 0;
                
                if (data.updatedAt) {
                    const date = data.updatedAt.toDate();
                    const dateStr = date.toLocaleDateString('ar-EG');
                    const timeStr = date.toLocaleTimeString('ar-EG', {hour: '2-digit', minute:'2-digit'});
                    document.getElementById('historyCard').style.display = 'block';
                    document.getElementById('lastSaveDate').innerText = `${dateStr} - ${timeStr}`;
                }
                
                window.calculateDifferences();
            }
        } catch (e) {
            console.log("No previous beginning balances found or error reading.");
        }
    }

    window.calculateDifferences = function() {
        const fields = ['cash', 'wallet', 'customers', 'suppliers', 'stock'];
        
        fields.forEach(field => {
            const startVal = Number(document.getElementById(`start_${field}`).value) || 0;
            const currVal = currentData[field];
            const diff = currVal - startVal;
            
            const diffEl = document.getElementById(`diff_${field}`);
            
            // Format number with sign
            const sign = diff > 0 ? "+" : "";
            diffEl.innerText = `${sign}${diff.toLocaleString()}`;
            
            // Apply styling
            diffEl.className = "val-diff";
            if (diff > 0) diffEl.classList.add("diff-positive");
            else if (diff < 0) diffEl.classList.add("diff-negative");
            else diffEl.classList.add("diff-zero");
        });
    };

    window.saveStartingBalances = async function() {
        const btn = document.getElementById('saveBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الحفظ...';
        
        try {
            const dataToSave = {
                cash: Number(document.getElementById('start_cash').value) || 0,
                wallet: Number(document.getElementById('start_wallet').value) || 0,
                customers: Number(document.getElementById('start_customers').value) || 0,
                suppliers: Number(document.getElementById('start_suppliers').value) || 0,
                stock: Number(document.getElementById('start_stock').value) || 0,
                updatedAt: serverTimestamp()
            };

            await setDoc(doc(db, "system_metadata", "beginning_balances"), dataToSave, { merge: true });
            
            // Update UI Last save time
            const now = new Date();
            document.getElementById('historyCard').style.display = 'block';
            document.getElementById('lastSaveDate').innerText = `${now.toLocaleDateString('ar-EG')} - ${now.toLocaleTimeString('ar-EG', {hour: '2-digit', minute:'2-digit'})}`;
            
            alert("تم حفظ أرصدة أول المدة بنجاح!");
        } catch (error) {
            console.error("Error saving:", error);
            alert("حدث خطأ أثناء الحفظ. تأكد من اتصال الإنترنت وصلاحيات قاعدة البيانات.");
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-save"></i> حفظ أرصدة أول المدة بالتاريخ والساعة';
        }
    };

    // Initialize
    window.onload = () => {
        fetchSystemBalances();
    };
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
