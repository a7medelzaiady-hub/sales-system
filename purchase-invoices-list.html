<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل المشتريات - شركة الزيادى</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght=400;500;600;700;800&family=Montserrat:wght=500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --primary: #0b5e3d; 
            --primary-gradient: linear-gradient(135deg, #0b5e3d, #148054);
            --bg-light: #f8fafc;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --white: #ffffff;
            --danger: #ef4444;
            --danger-light: #fee2e2;
            --success: #10b981;
            --success-light: #d1fae5;
            --info: #0284c7;
            --info-light: #e0f2fe;
            --warning: #f59e0b;
            --warning-light: #fef3c7;
            --purple: #8b5cf6;
            --purple-light: #ede9fe;
            --card-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            --hover-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.05), 0 4px 6px -4px rgb(0 0 0 / 0.05);
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        * { box-sizing: border-box; letter-spacing: normal !important; }

        body { 
            background: var(--bg-light); 
            font-family: 'Cairo', sans-serif; 
            color: var(--text-dark); 
            padding-bottom: 60px;
            overflow-x: hidden;
        }

        /* حاوية الصفحة الرئيسية لضبط الهوامش على الشاشات الكبيرة */
        .main-wrapper {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 12px;
        }

        .force-ltr {
            direction: ltr !important;
            display: inline-block;
            text-align: left;
        }

        .stat-val, .price-val, .balance-strip b, .details-table td, .term-row span, .inv-date, #thermalInvoiceHidden {
            font-family: 'Montserrat', 'Cairo', sans-serif !important;
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .header { 
            background: var(--primary-gradient); 
            padding: 0 16px;
            height: 65px;
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            box-shadow: 0 4px 12px rgba(11, 94, 61, 0.08); 
            color: white;
            position: sticky; 
            top: 0; 
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .header-start {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }
        .header h6 { 
            font-size: 1.05rem; 
            margin: 0; 
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .back-btn { 
            color: white; 
            transition: all 0.2s; 
            display: flex; 
            align-items: center;
            flex-shrink: 0;
        }
        .back-btn:hover { transform: translateX(3px); color: #d8f3dc; }

        .header-end {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .sync-icon { 
            transition: transform 0.5s ease; 
            cursor: pointer; 
            display: flex; 
            align-items: center;
            color: rgba(255,255,255,0.9);
            padding: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
        }
        .sync-icon:hover { 
            transform: rotate(180deg); 
            color: #fff;
            background: rgba(255,255,255,0.2);
        }

        .hdr-home-link {
            color: white;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.15);
            padding: 6px 14px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .hdr-home-link:hover {
            background: #fff;
            color: var(--primary);
        }

        /* ============================================================
           ACTION TOOLBAR
           ============================================================ */
        .action-toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 16px 0;
            overflow-x: auto;
            white-space: nowrap;
            padding-bottom: 4px;
        }
        .action-toolbar::-webkit-scrollbar { display: none; }
        
        .toolbar-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 16px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            font-weight: 700;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            text-decoration: none;
            box-shadow: var(--card-shadow);
        }
        .toolbar-btn-add { background: var(--primary); color: #fff; }
        .toolbar-btn-add:hover { background: #08472e; color: #fff; transform: translateY(-1px); }
        
        .toolbar-btn-excel { background: #10b981; color: #fff; }
        .toolbar-btn-excel:hover { background: #059669; color: #fff; transform: translateY(-1px); }
        
        .toolbar-btn-del { background: var(--white); color: var(--danger); border-color: var(--border-color); }
        .toolbar-btn-del:hover { background: var(--danger-light); border-color: transparent; }

        /* ============================================================
           STATS GRID (بجانب بعض دائماً بتنسيق احترافي ومحمي)
           ============================================================ */
        .stats-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr) !important; 
            gap: 10px; 
            margin: 16px 0; 
        }
        .stat-card { 
            background: var(--white); 
            border: 1px solid var(--border-color); 
            border-radius: var(--radius-md); 
            padding: 12px 8px; 
            text-align: center;
            box-shadow: var(--card-shadow);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .stat-card::before {
            content: ''; position: absolute; top: 0; right: 0; left: 0; height: 3px;
        }
        .stat-card.purchase::before { background: var(--info); }
        .stat-card.paid::before { background: var(--success); }
        .stat-card.pending::before { background: var(--danger); }
        
        .stat-val { 
            font-size: 0.95rem; 
            font-weight: 800; 
            margin-top: 4px; 
            width: 100%;
            overflow: hidden; 
            text-overflow: ellipsis; 
            white-space: nowrap;
        }
        .stat-label { 
            font-size: 0.75rem; 
            color: var(--text-muted); 
            font-weight: 700; 
        }

        @media (max-width: 576px) {
            .stat-card { padding: 10px 4px; }
            .stat-val { font-size: 0.85rem; }
            .stat-label { font-size: 0.7rem; }
        }

        /* ============================================================
           SEARCH BOX
           ============================================================ */
        .search-box { position: relative; margin: 16px 0; }
        .search-box input { 
            background: var(--white); 
            border: 1px solid var(--border-color); 
            color: var(--text-dark); 
            border-radius: var(--radius-md); 
            padding: 12px 42px 12px 16px; 
            width: 100%; 
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: var(--card-shadow);
            transition: all 0.2s ease;
        }
        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(11, 94, 61, 0.08);
            outline: none;
        }
        .search-box i { position: absolute; right: 16px; top: 16px; color: var(--text-muted); font-size: 0.95rem; }

        /* ============================================================
           INVOICE CARD
           ============================================================ */
        .invoice-card { 
            background: var(--white); 
            border: 1px solid var(--border-color); 
            border-radius: var(--radius-lg); 
            padding: 16px; 
            margin-bottom: 14px; 
            position: relative;
            box-shadow: var(--card-shadow);
            transition: all 0.2s ease;
        }
        .invoice-card:hover { 
            box-shadow: var(--hover-shadow);
            border-color: rgba(11, 94, 61, 0.15);
            transform: translateY(-1px);
        }
        .invoice-card::after {
            content: ''; position: absolute; top: 16px; right: 0; width: 4px; 
            height: calc(100% - 32px); border-radius: 4px 0 0 4px;
        }
        .purchase-style::after { background: var(--primary); }
        .return-style::after { background: var(--danger); }

        .inv-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        .inv-header-info { flex: 1; min-width: 0; cursor: pointer; }
        .sup-name { font-weight: 800; font-size: 1.05rem; color: var(--text-dark); margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .inv-date { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; display: inline-block; }
        
        .inv-badge { font-size: 0.75rem; padding: 5px 10px; border-radius: 8px; font-weight: 700; display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0; }
        .type-cash { background: var(--success-light); color: #065f46; }
        .type-wallet { background: var(--info-light); color: #0369a1; }
        .type-mixed { background: var(--purple-light); color: #6d28d9; }
        .type-credit { background: var(--warning-light); color: #b45309; }
        .type-return { background: var(--danger-light); color: #b91c1c; }

        .price-tag { text-align: left; cursor: pointer; }
        .price-val { font-weight: 800; font-size: 1.2rem; display: block; }
        .price-label { font-size: 0.7rem; color: var(--text-muted); font-weight: 700; display: block; margin-bottom: 2px; }

        .inv-actions-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 14px 0;
            gap: 8px;
        }
        .inv-tools {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .tool-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            font-size: 0.9rem;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s ease;
            background: #f8fafc;
            color: var(--text-dark);
        }
        .tool-btn:hover { transform: translateY(-1px); box-shadow: 0 3px 8px rgba(0,0,0,0.05); }
        .tool-btn-share:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
        .tool-btn-items:hover { background: var(--info); color: #fff; border-color: var(--info); }
        .tool-btn-delete { background: #fff; color: var(--danger); border-color: var(--border-color); }
        .tool-btn-delete:hover { background: var(--danger); color: #fff; border-color: var(--danger); }

        .balance-strip {
            background: #f8fafc;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 0.8rem;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 6px;
        }

        .details-box {
            background: #f8fafc;
            border-radius: 12px;
            padding: 12px;
            margin-top: 12px;
            border: 1px solid var(--border-color);
        }
        .details-table { margin: 0; font-size: 0.8rem; }
        .details-table th { font-weight: 700; color: var(--text-muted); border-bottom: 2px solid var(--border-color); }
        .details-table td { font-weight: 600; padding: 8px 4px; vertical-align: middle; }

        /* ============================================================
           THERMAL PRINT PRECISE DESIGN (تصميم احترافي فائق الدقة)
           ============================================================ */
        #thermalInvoiceHidden {
            position: absolute; left: -9999px; top: -9999px;
            width: 420px; background: #ffffff; color: #000000; padding: 25px;
            box-sizing: border-box; direction: rtl; font-family: 'Cairo', sans-serif;
            line-height: 1.4;
        }
        .term-header { text-align: center; border-bottom: 2px dashed #111; padding-bottom: 14px; margin-bottom: 14px; }
        .term-title { font-size: 24px; font-weight: 800; margin: 0 0 4px 0; color: #000; line-height: 1.3; }
        .term-subtitle { font-size: 13px; color: #333; font-weight: 700; margin: 0; }
        .term-info-grid { font-size: 13px; margin-bottom: 12px; border-bottom: 1px dashed #222; padding-bottom: 12px; line-height: 1.7; }
        .term-info-row { display: flex; justify-content: space-between; }
        .term-info-row span:first-child { font-weight: 700; color: #444; }
        .term-info-row span:last-child { font-weight: 800; color: #000; }
        
        .term-table { width: 100%; font-size: 13px; margin-top: 8px; border-collapse: collapse; }
        .term-table th { border-bottom: 1px solid #111; padding: 6px 0; text-align: right; font-weight: 800; color: #000; }
        .term-table td { padding: 8px 0; border-bottom: 1px dotted #aaa; vertical-align: middle; color: #000; }
        
        .term-footer { margin-top: 14px; border-top: 2px dashed #111; padding-top: 12px; font-size: 13.5px; }
        .term-row { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 7px; color: #222; }
        .term-row-bold { font-size: 18px; font-weight: 800; color: #000; border-top: 1px dashed #111; padding-top: 8px; margin-top: 4px; }

        .loading-wrapper { text-align: center; padding: 70px 0; color: var(--primary); }
        .loading-wrapper p { font-weight: 700; margin-top: 12px; font-size: 0.95rem; }
    </style>
</head>
<body>

<div class="header">
    <div class="header-start">
        <a href="purchase-mgmt.html" class="back-btn"><i class="fas fa-arrow-right fs-5"></i></a>
        <h6>سجل فواتير المشتريات</h6>
    </div>
    <div class="header-end">
        <a href="index1.html" class="hdr-home-link">
            <i class="fas fa-home"></i>
            <span>الرئيسية</span>
        </a>
        <i class="fas fa-sync-alt sync-icon fs-5" onclick="init()" title="تحديث البيانات"></i>
    </div>
</div>

<div class="main-wrapper">
    <div class="action-toolbar">
        <a href="new-purchase-invoice.html" class="toolbar-btn toolbar-btn-add">
            <i class="fas fa-plus"></i> فاتورة جديدة
        </a>
        <button onclick="exportToExcel()" class="toolbar-btn toolbar-btn-excel">
            <i class="fas fa-file-excel"></i> تصدير Excel
        </button>
        <button onclick="deleteAllInvoices()" class="toolbar-btn toolbar-btn-del">
            <i class="fas fa-trash-alt"></i> مسح السجل
        </button>
    </div>

    <div class="stats-grid">
        <div class="stat-card purchase">
            <span class="stat-label">صافي الشراء</span>
            <span class="stat-val text-dark force-ltr" id="totalPurchase">0.00</span>
        </div>
        <div class="stat-card paid">
            <span class="stat-label">إجمالي المدفوع</span>
            <span class="stat-val text-success force-ltr" id="totalPaid">0.00</span>
        </div>
        <div class="stat-card pending">
            <span class="stat-label">إجمالي المتبقي</span>
            <span class="stat-val text-danger force-ltr" id="totalPending">0.00</span>
        </div>
    </div>

    <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="ابحث باسم المورد أو تاريخ الفاتورة..." onkeyup="searchInvoices()">
    </div>

    <div id="invoicesContainer">
        <div class="loading-wrapper">
            <div class="spinner-border" role="status" style="width: 2.2rem; height: 2.2rem;"></div>
            <p>جاري تجميع حركات الموردين الحالية والتاريخية...</p>
        </div>
    </div>
</div>

<div id="thermalInvoiceHidden"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
        authDomain: "ahmedelzaiady.firebaseapp.com",
        projectId: "ahmedelzaiady",
        storageBucket: "ahmedelzaiady.firebasestorage.app",
        messagingSenderId: "300306825071",
        appId: "1:300306825071:web:0426ddde56280fa090329a",
        measurementId: "G-WE04GK5XZZ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allInvoices = [];
    let suppliersBase = {}; 
    let globalVouchers = [];

    function formatEnglishDate(dateStr) {
        if (!dateStr) return 'No Date';
        return dateStr.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
    }

    function generateCurrencyHTML(value, forceColor = '') {
        const isNegative = value < 0;
        const absoluteFormatted = Math.abs(value).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        const styleColor = forceColor ? `color:${forceColor}` : '';
        
        if (isNegative) {
            return `<span class="force-ltr" style="${styleColor}">-${absoluteFormatted}</span>`;
        }
        return `<span class="force-ltr" style="${styleColor}">${absoluteFormatted}</span>`;
    }

    window.init = async function() {
        try {
            const supSnap = await getDocs(collection(db, "suppliers"));
            suppliersBase = {};
            supSnap.forEach(d => {
                const data = d.data();
                suppliersBase[d.id] = { name: data.name, openingBalance: Number(data.openingBalance) || 0 };
            });

            const [transSnap, voucherSnap] = await Promise.all([
                getDocs(query(collection(db, "supplier_transactions"), orderBy("timestamp", "asc"))), 
                getDocs(collection(db, "transactions"))
            ]);
            
            globalVouchers = [];
            voucherSnap.forEach(v => { globalVouchers.push({ id: v.id, ...v.data() }); });

            allInvoices = [];
            let totalPurchaseSum = 0;
            let totalReturnSum = 0;
            let totalDirectPaid = 0; 

            transSnap.forEach(doc => {
                const data = { id: doc.id, ...doc.data() };
                const amt = Number(data.grossTotal) || Number(data.total) || 0;
                const cashP = Number(data.cashPaid || 0);
                const walletP = Number(data.walletPaid || 0);
                const directPaid = data.totalPaid ? Number(data.totalPaid) : (cashP + walletP || Number(data.paidAmount) || 0);

                data.displayGross = amt;
                data.displayNetPending = amt - directPaid;
                data.computedCashPaid = cashP;
                data.computedWalletPaid = walletP;
                data.computedTotalPaid = directPaid;

                if (data.type === "شراء" || data.type === "فاتورة شراء") {
                    data.isReturn = false;
                    totalPurchaseSum += amt;
                    totalDirectPaid += directPaid; 
                } else if (data.type === "مرتجع شراء") {
                    data.isReturn = true;
                    totalReturnSum += amt;
                }
                allInvoices.push(data);
            });

            let totalVoucherPayments = 0;
            globalVouchers.forEach(v => {
                if (v.type === "صرف" || v.actionType === "سداد مورد" || String(v.details || '').includes("سداد")) {
                    if (!v.invoiceId) { 
                        totalVoucherPayments += Number(v.amount || 0);
                    }
                }
            });

            const netPurchase = totalPurchaseSum - totalReturnSum;
            const totalPaid = totalDirectPaid + totalVoucherPayments;
            const finalPending = netPurchase - totalPaid;

            document.getElementById('totalPurchase').innerHTML = generateCurrencyHTML(netPurchase);
            document.getElementById('totalPaid').innerHTML = generateCurrencyHTML(totalPaid);
            document.getElementById('totalPending').innerHTML = generateCurrencyHTML(finalPending > 0 ? finalPending : 0);
            
            allInvoices.sort((a,b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
            renderInvoices(allInvoices);
        } catch (error) {
            console.error(error);
            document.getElementById('invoicesContainer').innerHTML = '<div class="text-danger text-center p-5 fw-bold">حدث خطأ غير متوقع أثناء معالجة البيانات.</div>';
        }
    };

    function calculateHistoricalPreviousBalance(supId, invoiceTimestamp) {
        const supplier = suppliersBase[supId];
        if (!supplier) return 0;

        let debt = 0;
        let credit = 0;
        const targetSeconds = invoiceTimestamp?.seconds || 0;

        globalVouchers.forEach(v => {
            if (v.partyId === supId && v.timestamp && v.timestamp.seconds < targetSeconds) {
                const amt = Number(v.amount) || 0;
                if (v.type === "صرف") credit += amt;
                else if (v.type === "قبض") debt += amt;
            }
        });

        allInvoices.forEach(inv => {
            if (inv.supplierId === supId && inv.timestamp && inv.timestamp.seconds < targetSeconds) {
                const amt = inv.displayGross;
                if (inv.type === "شراء" || inv.type === "فاتورة شراء") debt += amt;
                else if (inv.type === "مرتجع شراء") credit += amt;
            }
        });

        return (supplier.openingBalance + debt) - credit;
    }

    function renderInvoices(dataList) {
        const container = document.getElementById('invoicesContainer');
        if (dataList.length === 0) {
            container.innerHTML = '<div class="text-center text-muted py-5 fw-bold">لا تتوفر فواتير مسجلة في السجل حالياً</div>';
            return;
        }

        container.innerHTML = dataList.map(inv => {
            const supName = suppliersBase[inv.supplierId] ? suppliersBase[inv.supplierId].name : 'مورد غير معروف';
            const historicalPrevBalance = calculateHistoricalPreviousBalance(inv.supplierId, inv.timestamp);
            const formattedDate = formatEnglishDate(inv.date);

            let badgeClass = 'type-credit';
            let badgeText = '<i class="fas fa-user-clock"></i>آجل';

            if (inv.isReturn) {
                badgeClass = 'type-return';
                badgeText = '<i class="fas fa-undo-alt"></i>مرتجع';
            } else if (inv.computedCashPaid > 0 && inv.computedWalletPaid > 0) {
                badgeClass = 'type-mixed';
                badgeText = '<i class="fas fa-wallet"></i>مختلط';
            } else if (inv.computedCashPaid > 0 || inv.paymentType === 'cash') {
                badgeClass = 'type-cash';
                badgeText = '<i class="fas fa-money-bill-wave"></i>نقدي';
            } else if (inv.computedWalletPaid > 0 || inv.paymentType === 'wallet') {
                badgeClass = 'type-wallet';
                badgeText = '<i class="fas fa-mobile-alt"></i>محفظة';
            }

            const totalInvoiceVal = Number(inv.displayGross);
            const netPendingVal = Number(inv.isReturn ? inv.displayGross : inv.displayNetPending);
            const finalSupplierTotal = historicalPrevBalance + (inv.isReturn ? -totalInvoiceVal : inv.displayNetPending);

            const targetPriceColor = inv.isReturn ? 'var(--danger)' : (inv.displayNetPending > 0 ? 'var(--danger)' : 'var(--success)');
            
            const totalStatusLabel = finalSupplierTotal < 0 ? 'دائن' : 'مدين';
            const totalStatusClass = finalSupplierTotal < 0 ? 'text-success' : 'text-danger';

            return `
            <div class="invoice-card ${inv.isReturn ? 'return-style' : 'purchase-style'}" id="card-${inv.id}">
                <div class="inv-header">
                    <div class="inv-header-info" onclick="window.location.href='new-purchase-invoice.html?edit=${inv.id}'">
                        <p class="sup-name">${supName}</p>
                        <span class="inv-date"><i class="far fa-calendar-alt me-1"></i>${formattedDate}</span>
                    </div>
                    <span class="inv-badge ${badgeClass}">${badgeText}</span>
                </div>

                <div class="inv-actions-row">
                    <div class="inv-tools">
                        <button class="tool-btn tool-btn-share" onclick="shareAsThermalImageDirectly('${inv.id}')" title="مشاركة الفاتورة">
                            <i class="fas fa-share-alt"></i>
                        </button>
                        <button class="tool-btn tool-btn-items" onclick="toggleInvoiceDetails('${inv.id}')" title="عرض الأصناف">
                            <i class="fas fa-cubes"></i>
                        </button>
                        <button class="tool-btn tool-btn-delete" onclick="deleteSingleInvoice('${inv.id}')" title="حذف الفاتورة">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>

                    <div class="price-tag" onclick="window.location.href='new-purchase-invoice.html?edit=${inv.id}'">
                        <span class="price-label">${inv.isReturn ? 'قيمة المرتجع' : 'متبقي الفاتورة'}</span>
                        <span class="price-val">
                            ${generateCurrencyHTML(inv.isReturn ? -netPendingVal : netPendingVal, targetPriceColor)}
                            <small style="font-size:0.7rem; font-weight:700; color:${targetPriceColor};">EGP</small>
                        </span>
                    </div>
                </div>

                <div class="balance-strip text-dark">
                    <span>إجمالي: <b>${generateCurrencyHTML(totalInvoiceVal, '#64748b')}</b></span>
                    <span>السابق: <b>${generateCurrencyHTML(historicalPrevBalance, 'var(--info)')}</b></span>
                    <span>الصافي (${totalStatusLabel}): <b class="${totalStatusClass}">${generateCurrencyHTML(finalSupplierTotal)}</b></span>
                </div>

                <div id="details_${inv.id}" class="details-box" style="display:none;">
                    <table class="table table-sm details-table table-borderless">
                        <thead>
                            <tr>
                                <th>الصنف</th>
                                <th class="text-center">الكمية</th>
                                <th class="text-center">السعر</th>
                                <th class="text-start">الإجمالي</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${(inv.items || []).map(item => `
                                <tr>
                                    <td class="text-dark fw-bold">${item.name}</td>
                                    <td class="text-center text-secondary">${item.qty || item.returnQty || 0}</td>
                                    <td class="text-center force-ltr">${Number(item.buy || 0).toFixed(2)}</td>
                                    <td class="text-start text-dark fw-bold force-ltr">${((item.qty || item.returnQty || 0) * Number(item.buy || 0)).toFixed(2)}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            </div>`;
        }).join('');
    }

    window.deleteSingleInvoice = async function(invoiceId) {
        if (!confirm('هل تريد حذف هذه الفاتورة؟ لا يمكن التراجع عن هذا الإجراء.')) return;
        try {
            await deleteDoc(doc(db, "supplier_transactions", invoiceId));
            const card = document.getElementById('card-' + invoiceId);
            if (card) {
                card.style.transition = 'opacity 0.3s, transform 0.3s';
                card.style.opacity = '0';
                card.style.transform = 'scale(0.97)';
                setTimeout(() => card.remove(), 300);
            }
            allInvoices = allInvoices.filter(i => i.id !== invoiceId);
            recalcStats();
        } catch (e) {
            alert('خطأ أثناء الحذف: ' + e.message);
        }
    };

    function recalcStats() {
        let totalPurchaseSum = 0, totalReturnSum = 0, totalDirectPaid = 0;
        allInvoices.forEach(inv => {
            if (inv.type === "شراء" || inv.type === "فاتورة شراء") {
                totalPurchaseSum += inv.displayGross;
                totalDirectPaid += inv.computedTotalPaid;
            } else if (inv.type === "مرتجع شراء") {
                totalReturnSum += inv.displayGross;
            }
        });
        let totalVoucherPayments = 0;
        globalVouchers.forEach(v => {
            if (v.type === "صرف" || v.actionType === "سداد مورد" || String(v.details || '').includes("سداد")) {
                if (!v.invoiceId) {
                    totalVoucherPayments += Number(v.amount || 0);
                }
            }
        });
        const netPurchase   = totalPurchaseSum - totalReturnSum;
        const totalPaid     = totalDirectPaid + totalVoucherPayments;
        const finalPending  = Math.max(0, netPurchase - totalPaid);
        
        document.getElementById('totalPurchase').innerHTML = generateCurrencyHTML(netPurchase);
        document.getElementById('totalPaid').innerHTML     = generateCurrencyHTML(totalPaid);
        document.getElementById('totalPending').innerHTML  = generateCurrencyHTML(finalPending);
    }

    window.shareAsThermalImageDirectly = async (invoiceId) => {
        const inv = allInvoices.find(i => i.id === invoiceId);
        if (!inv) return;

        const supName = suppliersBase[inv.supplierId] ? suppliersBase[inv.supplierId].name : 'مورد غير معروف';
        const historicalPrevBalance = calculateHistoricalPreviousBalance(inv.supplierId, inv.timestamp);
        const items = inv.items || [];
        const hiddenDiv = document.getElementById('thermalInvoiceHidden');
        const formattedDate = formatEnglishDate(inv.date);

        let rowsHtml = "";
        items.forEach(item => {
            const isItemReturn = item.returnQty > 0 || inv.isReturn;
            const qty = item.qty || item.returnQty || 0;
            const unit = item.unitName || 'كرتونة';
            const price = item.buy || 0;
            const subtotal = qty * price;
            rowsHtml += `
                <tr>
                    <td style="padding: 8px 0; font-size:14px; color:#000; font-weight:700;">
                        ${item.name}<br>
                        <span style="color:#444; font-size:12px; font-weight:500;">(${isItemReturn ? '-' : ''}${qty} ${unit} × ${price.toFixed(2)} EGP)</span>
                    </td>
                    <td style="text-align: left; padding: 8px 0; font-family:'Montserrat', sans-serif; font-weight:800; font-size:14px; color:#000;" dir="ltr">
                        ${isItemReturn ? '-' : ''}${subtotal.toFixed(2)}
                    </td>
                </tr>`;
        });

        const grossTotal = Number(inv.displayGross);
        const cashPaid = Number(inv.computedCashPaid || 0);
        const walletPaid = Number(inv.computedWalletPaid || 0);
        const netPending = Number(inv.displayNetPending);
        const finalSupplierTotal = historicalPrevBalance + (inv.isReturn ? -grossTotal : netPending);

        let paymentDesc = "آجل الحساب";
        if (cashPaid > 0 && walletPaid > 0) paymentDesc = "مشترك (كاش + محفظة)";
        else if (cashPaid > 0) paymentDesc = "نقدي كاش";
        else if (walletPaid > 0) paymentDesc = "محفظة إلكترونية";

        hiddenDiv.innerHTML = `
            <div class="term-header">
                <p class="term-title">شركة الزيادى للتجارة</p>
                <p class="term-subtitle">فاتورة مراجعة مشتريات للمورد</p>
            </div>
            <div class="term-info-grid">
                <div class="term-info-row"><span>نوع الحساب:</span><span>${inv.isReturn ? 'مرتجع شراء ↩️' : 'فاتورة شراء 🧾'}</span></div>
                <div class="term-info-row"><span>المورد:</span><span>${supName}</span></div>
                <div class="term-info-row"><span>التاريخ:</span><span>${formattedDate}</span></div>
                <div class="term-info-row"><span>طريقة السداد:</span><span>${paymentDesc}</span></div>
            </div>
            <table class="term-table">
                <thead><tr><th>الصنف</th><th style="text-align:left;">الإجمالي</th></tr></thead>
                <tbody>${rowsHtml}</tbody>
            </table>
            <div class="term-footer">
                <div class="term-row">
                    <span>الحساب السابق:</span>
                    <span dir="ltr">${historicalPrevBalance.toFixed(2)} EGP</span>
                </div>
                <div class="term-row">
                    <span>إجمالي الفاتورة:</span>
                    <span dir="ltr">${inv.isReturn ? '-' : ''}${grossTotal.toFixed(2)} EGP</span>
                </div>
                ${cashPaid > 0 ? `<div class="term-row" style="color:#000;"><span>المدفوع نقداً:</span><span dir="ltr">-${cashPaid.toFixed(2)} EGP</span></div>` : ''}
                ${walletPaid > 0 ? `<div class="term-row" style="color:#000;"><span>المدفوع بالمحفظة:</span><span dir="ltr">-${walletPaid.toFixed(2)} EGP</span></div>` : ''}
                <div class="term-row" style="border-top:1px dashed #222; padding-top:6px;">
                    <span>صافي الآجل:</span>
                    <span dir="ltr">${inv.isReturn ? '-' : ''}${netPending.toFixed(2)} EGP</span>
                </div>
                <div class="term-row term-row-bold">
                    <span>إجمالي المتبقي الكلي:</span>
                    <span dir="ltr">${finalSupplierTotal.toFixed(2)} EGP</span>
                </div>
            </div>
            <div style="text-align:center; margin-top:25px; font-size:12px; color:#111; border-top:1px dashed #111; padding-top:10px; font-weight:700;">
                إدارة وتصميم مالي / أحمد محمود الزيادى
            </div>`;

        try {
            const canvas = await html2canvas(hiddenDiv, { scale: 2, backgroundColor: "#ffffff", useCORS: true });
            canvas.toBlob(async (blob) => {
                if (!blob) return alert("فشل تصدير الصورة");
                const file = new File([blob], `Invoice_${invoiceId}.png`, { type: "image/png" });
                if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({ files: [file], title: `فاتورة شركة الزيادى للمورد ${supName}` });
                } else {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `فاتورة_${supName}.png`;
                    a.click();
                }
            }, "image/png");
        } catch (error) {
            alert("خطأ أثناء توليد الفاتورة: " + error.message);
        }
    };

    window.searchInvoices = () => {
        const term = document.getElementById('searchInput').value.toLowerCase();
        const filtered = allInvoices.filter(inv => {
            const name = suppliersBase[inv.supplierId] ? suppliersBase[inv.supplierId].name.toLowerCase() : '';
            return name.includes(term) || (inv.date && inv.date.includes(term));
        });
        renderInvoices(filtered);
    };

    window.deleteAllInvoices = async () => {
        if (!confirm("⚠️ تحذير: هل أنت متأكد من مسح كافة سجلات الفواتير؟ لن تستطيع استرجاعها.")) return;
        try {
            const snap = await getDocs(collection(db, "supplier_transactions"));
            if (snap.empty) return alert("السجل فارغ بالفعل.");
            for (const d of snap.docs) {
                await deleteDoc(doc(db, "supplier_transactions", d.id));
            }
            alert("تم إفراغ السجل بنجاح ✅");
            init();
        } catch (e) {
            alert("خطأ: " + e.message);
        }
    };

    window.exportToExcel = () => {
        if (allInvoices.length === 0) return alert("لا تتوفر بيانات لاستخراجها");

        let excelData = [["التاريخ","الحركة","اسم المورد","اسم الصنف","عدد قطعة","عدد كرتونة","سعر قطعة","سعر كرتونة"]];
        allInvoices.forEach(inv => {
            const supplierName = suppliersBase[inv.supplierId] ? suppliersBase[inv.supplierId].name : "";
            if (Array.isArray(inv.items) && inv.items.length > 0) {
                inv.items.forEach(item => {
                    const unit = item.unitName || "كرتونة";
                    const isItemReturn = item.returnQty > 0 || inv.isReturn;
                    const motionType = isItemReturn ? "بيع" : "شراء";
                    let qtyPcs = "", qtyCrt = "", pricePcs = "", priceCrt = "";
                    if (unit === "قطعة") { qtyPcs = item.qty || item.returnQty || 0; pricePcs = item.buy || 0; }
                    else { qtyCrt = item.qty || item.returnQty || 0; priceCrt = item.buy || 0; }
                    excelData.push([inv.date || "", motionType, supplierName, item.name || "", qtyPcs, qtyCrt, pricePcs, priceCrt]);
                });
            }
            const currentPaid = Number(inv.computedTotalPaid || 0);
            if (currentPaid > 0) {
                excelData.push([inv.date || "", "سداد نقدى", supplierName, "سداد له نقدى", "", 1, "", currentPaid]);
            }
        });

        const worksheet = XLSX.utils.aoa_to_sheet(excelData);
        worksheet['!cols'] = [15,15,25,30,15,15,15,15].map(w => ({ wch: w }));
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "المشتريات");
        XLSX.writeFile(workbook, "تقرير_المشتريات.xlsx");
    };

    window.toggleInvoiceDetails = function(id) {
        const box = document.getElementById(`details_${id}`);
        if (!box) return;
        box.style.display = (box.style.display === "none" || box.style.display === "") ? "block" : "none";
    };

    init();
</script>
</body>
</html>
