<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل المشتريات الاحترافي - شركة الزيادى</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --primary: #0b5e3d; 
            --primary-gradient: linear-gradient(135deg, #0b5e3d, #148054);
            --bg-light: #f8faf9;
            --text-dark: #111d17;
            --text-muted: #6c7a73;
            --border-color: #e4ebe7;
            --white: #ffffff;
            --danger: #d90429;
            --danger-light: #ffe5ea;
            --success: #1b4332;
            --success-light: #d8f3dc;
            --info: #0077b6;
            --info-light: #e0f2fe;
            --warning: #d68102;
            --warning-light: #fef3c7;
            --purple: #6d28d9;
            --purple-light: #f3e8ff;
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
            --hover-shadow: 0 15px 35px rgba(11, 94, 61, 0.08);
        }

        body { 
            background: var(--bg-light); 
            font-family: 'Cairo', sans-serif; 
            color: var(--text-dark); 
            padding-bottom: 60px;
            overflow-x: hidden;
        }

        .stat-val, .price-val, .balance-strip b, .details-table td, .term-row span, .inv-date, #thermalInvoiceHidden {
            font-family: 'Montserrat', 'Cairo', sans-serif !important;
        }

        /* ============================================================
           HEADER — محسّن ومنظّم
           ============================================================ */
        .header { 
            background: var(--primary-gradient); 
            padding: 0 16px;
            height: 58px;
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            box-shadow: 0 4px 20px rgba(11, 94, 61, 0.15); 
            color: white;
            position: sticky; 
            top: 0; 
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            gap: 10px;
        }

        /* القسم الأيسر: الرجوع + العنوان */
        .header-start {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .header h6 { 
            font-size: 1rem; 
            margin: 0; 
            font-weight: 700;
            white-space: nowrap;
        }
        .back-btn { 
            color: white; 
            transition: transform 0.2s; 
            display: flex; 
            align-items: center;
            flex-shrink: 0;
        }
        .back-btn:hover { transform: scale(1.1); color: #d8f3dc; }

        /* القسم الأيمن: الأزرار + المزامنة */
        .header-end {
            display: flex;
            align-items: center;
            gap: 7px;
            flex-shrink: 0;
        }

        /* أزرار الهيدر الموحّدة */
        .hdr-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            height: 34px;
            padding: 0 11px;
            border-radius: 10px;
            font-size: 0.78rem;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            border: none;
            cursor: pointer;
            transition: all 0.22s ease;
            white-space: nowrap;
            text-decoration: none;
        }
        .hdr-btn i { font-size: 0.82rem; }

        /* زر الرئيسية */
        .hdr-btn-home {
            background: rgba(255,255,255,0.18);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.35);
        }
        .hdr-btn-home:hover {
            background: #fff;
            color: var(--primary);
        }

        /* زر إضافة فاتورة */
        .hdr-btn-add {
            background: rgba(255,255,255,0.18);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.35);
        }
        .hdr-btn-add:hover {
            background: #fff;
            color: var(--primary);
        }

        /* زر Excel */
        .hdr-btn-excel {
            background: rgba(25,135,84,0.85);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .hdr-btn-excel:hover {
            background: #146c43;
            color: #fff;
        }

        /* زر حذف الكل */
        .hdr-btn-del {
            background: rgba(217,4,41,0.85);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .hdr-btn-del:hover {
            background: #b00224;
            color: #fff;
        }

        /* أيقونة المزامنة */
        .sync-icon { 
            transition: transform 0.4s ease; 
            cursor: pointer; 
            display: flex; 
            align-items: center;
            color: rgba(255,255,255,0.85);
            padding: 4px;
        }
        .sync-icon:hover { 
            transform: rotate(180deg); 
            color: #fff;
        }

        /* ============================================================
           STATS GRID
           ============================================================ */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 20px 15px; }
        .stat-card { 
            background: var(--white); 
            border: 1px solid var(--border-color); 
            border-radius: 16px; 
            padding: 15px 10px; 
            text-align: center;
            box-shadow: var(--card-shadow);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s;
        }
        .stat-card:hover { transform: translateY(-3px); }
        .stat-card::before {
            content: ''; position: absolute; top: 0; right: 0; width: 4px; height: 100%;
        }
        .stat-card.purchase::before { background: var(--info); }
        .stat-card.paid::before { background: var(--primary); }
        .stat-card.pending::before { background: var(--danger); }
        
        .stat-val { font-size: 1.1rem; font-weight: 700; display: block; margin-top: 5px; }
        .stat-label { font-size: 0.75rem; color: var(--text-muted); font-weight: 700; display: block; }

        /* ============================================================
           SEARCH BOX
           ============================================================ */
        .search-box { position: relative; margin: 16px 15px; }
        .search-box input { 
            background: var(--white); 
            border: 1px solid var(--border-color); 
            color: var(--text-dark); 
            border-radius: 16px; 
            padding: 14px 45px 14px 20px; 
            width: 100%; 
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: var(--card-shadow);
            transition: all 0.3s ease;
        }
        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(11, 94, 61, 0.1);
            outline: none;
        }
        .search-box i { position: absolute; right: 18px; top: 18px; color: var(--primary); font-size: 1.05rem; }

        /* ============================================================
           INVOICE CARD
           ============================================================ */
        .invoice-card { 
            background: var(--white); 
            border: 1px solid var(--border-color); 
            border-radius: 24px; 
            padding: 18px; 
            margin: 0 15px 16px 15px; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            position: relative;
            box-shadow: var(--card-shadow);
        }
        .invoice-card:hover { 
            box-shadow: var(--hover-shadow);
            border-color: rgba(11, 94, 61, 0.2);
        }
        .invoice-card::after {
            content: ''; position: absolute; top: 20px; right: 0; width: 5px; 
            height: calc(100% - 40px); border-radius: 4px 0 0 4px;
        }
        .purchase-style::after { background: var(--primary); }
        .return-style::after { background: var(--danger); }

        .inv-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        .inv-header-info { flex: 1; min-width: 0; cursor: pointer; }
        .sup-name { font-weight: 800; font-size: 1.05rem; color: var(--text-dark); margin: 0; transition: color 0.2s; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .invoice-card:hover .sup-name { color: var(--primary); }
        .inv-date { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; display: inline-block; }
        
        .inv-badge { font-size: 0.75rem; padding: 6px 12px; border-radius: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .type-cash { background: var(--success-light); color: var(--success); }
        .type-wallet { background: var(--info-light); color: var(--info); }
        .type-mixed { background: var(--purple-light); color: var(--purple); }
        .type-credit { background: var(--warning-light); color: var(--warning); }
        .type-return { background: var(--danger-light); color: var(--danger); }

        .price-tag { text-align: left; cursor: pointer; }
        .price-val { font-weight: 800; font-size: 1.25rem; display: block; }
        .price-label { font-size: 0.7rem; color: var(--text-muted); font-weight: 700; display: block; text-transform: uppercase; margin-bottom: 2px; }

        /* ============================================================
           صف أزرار الفاتورة — شارة + أدوات
           ============================================================ */
        .inv-actions-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 12px 0;
            gap: 8px;
        }
        .inv-tools {
            display: flex;
            gap: 7px;
            align-items: center;
        }

        /* زر الأداة الموحّد */
        .tool-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            height: 36px;
            padding: 0 12px;
            border-radius: 11px;
            font-size: 0.78rem;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            border: 1.5px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            background: #f4f7f6;
            color: var(--text-dark);
            border-color: var(--border-color);
        }
        .tool-btn i { font-size: 0.82rem; }
        .tool-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(0,0,0,0.07); }

        /* أيقونة المشاركة */
        .tool-btn-share:hover { background: var(--primary); color: #fff; border-color: var(--primary); }

        /* أيقونة الأصناف */
        .tool-btn-items:hover { background: var(--info); color: #fff; border-color: var(--info); }

        /* زر حذف الفاتورة — أحمر خفيف */
        .tool-btn-delete {
            background: var(--danger-light);
            color: var(--danger);
            border-color: rgba(217,4,41,0.2);
        }
        .tool-btn-delete:hover {
            background: var(--danger);
            color: #fff;
            border-color: var(--danger);
        }

        /* شريط الحساب */
        .balance-strip {
            background: #fdfdfd;
            border-radius: 14px;
            padding: 10px 14px;
            font-size: 0.78rem;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px dashed var(--border-color);
            flex-wrap: wrap;
            gap: 6px;
        }

        .details-box {
            background: #fafcfb;
            border-radius: 16px;
            padding: 12px;
            margin-top: 14px;
            border: 1px solid var(--border-color);
        }
        .details-table { margin: 0; font-size: 0.8rem; }
        .details-table th { font-weight: 700; color: var(--text-muted); border-bottom: 2px solid var(--border-color); }
        .details-table td { font-weight: 600; padding: 8px 4px; vertical-align: middle; }

        /* ============================================================
           THERMAL PRINT
           ============================================================ */
        #thermalInvoiceHidden {
            position: absolute; left: -9999px; top: -9999px;
            width: 400px; background: #ffffff; color: #000000; padding: 25px;
            box-sizing: border-box; direction: rtl; font-family: 'Cairo', sans-serif;
        }
        .term-header { text-align: center; border-bottom: 2px dashed #000; padding-bottom: 12px; margin-bottom: 12px; }
        .term-title { font-size: 22px; font-weight: 800; margin: 0; letter-spacing: 0.5px; }
        .term-table { width: 100%; font-size: 13px; margin-top: 12px; border-collapse: collapse; }
        .term-table th { border-bottom: 1px dashed #000; padding: 6px 0; text-align: right; font-weight: bold; }
        .term-table td { padding: 8px 0; border-bottom: 1px dotted #ccc; vertical-align: middle; }
        .term-footer { margin-top: 15px; border-top: 2px dashed #000; padding-top: 12px; font-size: 14px; }
        .term-row { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 6px; }

        .loading-wrapper { text-align: center; padding: 80px 0; color: var(--primary); }
        .loading-wrapper p { font-weight: 700; margin-top: 15px; font-size: 0.95rem; }
    </style>
</head>
<body>

<!-- ============================================================
     HEADER المحسّن: رجوع + عنوان على اليسار — أزرار + مزامنة على اليمين
     ============================================================ -->
<div class="header">
    <!-- يسار: رجوع + عنوان -->
    <div class="header-start">
        <a href="purchase-mgmt.html" class="back-btn"><i class="fas fa-arrow-right fs-5"></i></a>
        <h6>سجل فواتير المشتريات</h6>
    </div>

    <!-- يمين: أزرار + مزامنة -->
    <div class="header-end">
        <a href="index1.html" class="hdr-btn hdr-btn-home">
            <i class="fas fa-home"></i>
            <span>الرئيسية</span>
        </a>
        <a href="new-purchase-invoice.html" class="hdr-btn hdr-btn-add" title="إضافة فاتورة جديدة">
            <i class="fas fa-plus"></i>
            <span>جديدة</span>
        </a>
        <button onclick="exportToExcel()" class="hdr-btn hdr-btn-excel">
            <i class="fas fa-file-excel"></i>
            <span>Excel</span>
        </button>
        <button onclick="deleteAllInvoices()" class="hdr-btn hdr-btn-del">
            <i class="fas fa-trash-alt"></i>
        </button>
        <i class="fas fa-sync-alt sync-icon fs-5" onclick="init()" title="تحديث البيانات"></i>
    </div>
</div>

<div class="container-fluid p-0">
    <!-- إحصائيات -->
    <div class="stats-grid">
        <div class="stat-card purchase">
            <span class="stat-label">صافي الشراء</span>
            <span class="stat-val text-dark" id="totalPurchase">0.00</span>
        </div>
        <div class="stat-card paid">
            <span class="stat-label">إجمالي المدفوع</span>
            <span class="stat-val text-success" id="totalPaid">0.00</span>
        </div>
        <div class="stat-card pending">
            <span class="stat-label">إجمالي المتبقي</span>
            <span class="stat-val text-danger" id="totalPending">0.00</span>
        </div>
    </div>

    <!-- شريط البحث -->
    <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="ابحث باسم المورد أو تاريخ الفاتورة..." onkeyup="searchInvoices()">
    </div>

    <!-- حاوية الفواتير -->
    <div id="invoicesContainer">
        <div class="loading-wrapper">
            <div class="spinner-border" role="status" style="width: 2.5rem; height: 2.5rem;"></div>
            <p>جاري تجميع حركات الموردين الحالية والتاريخية...</p>
        </div>
    </div>
</div>

<div id="thermalInvoiceHidden"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
        authDomain: "ahmedelzaiady.firebaseapp.com",
        projectId: "ahmedelzaiady",
        storageBucket: "ahmedelzaiady.firebasestorage.app",
        messagingSenderId: "300306825071",
        appId: "1:300306825071:web:0426ddde56280fa090329a",
        measurementId: "G-WE04GK5XZZ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allInvoices = [];
    let suppliersBase = {}; 
    let globalVouchers = [];

    function formatEnglishDate(dateStr) {
        if (!dateStr) return 'No Date';
        return dateStr.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
    }

    window.init = async function() {
        try {
            const supSnap = await getDocs(collection(db, "suppliers"));
            suppliersBase = {};
            supSnap.forEach(d => {
                const data = d.data();
                suppliersBase[d.id] = { name: data.name, openingBalance: Number(data.openingBalance) || 0 };
            });

            const [transSnap, voucherSnap] = await Promise.all([
                getDocs(query(collection(db, "supplier_transactions"), orderBy("timestamp", "asc"))), 
                getDocs(collection(db, "transactions"))
            ]);
            
            globalVouchers = [];
            voucherSnap.forEach(v => { globalVouchers.push({ id: v.id, ...v.data() }); });

            allInvoices = [];
            let totalPurchaseSum = 0;
            let totalReturnSum = 0;
            let totalDirectPaid = 0; 

            transSnap.forEach(doc => {
                const data = { id: doc.id, ...doc.data() };
                const amt = Number(data.grossTotal) || Number(data.total) || 0;
                const cashP = Number(data.cashPaid || 0);
                const walletP = Number(data.walletPaid || 0);
                const directPaid = data.totalPaid ? Number(data.totalPaid) : (cashP + walletP || Number(data.paidAmount) || 0);

                data.displayGross = amt;
                data.displayNetPending = amt - directPaid;
                data.computedCashPaid = cashP;
                data.computedWalletPaid = walletP;
                data.computedTotalPaid = directPaid;

                if (data.type === "شراء" || data.type === "فاتورة شراء") {
                    data.isReturn = false;
                    totalPurchaseSum += amt;
                    totalDirectPaid += directPaid; 
                } else if (data.type === "مرتجع شراء") {
                    data.isReturn = true;
                    totalReturnSum += amt;
                }
                allInvoices.push(data);
            });

            let totalVoucherPayments = 0;
            globalVouchers.forEach(v => {
                if (v.type === "صرف" || v.actionType === "سداد مورد" || String(v.details || '').includes("سداد")) {
                    totalVoucherPayments += Number(v.amount || 0);
                }
            });

            const netPurchase = totalPurchaseSum - totalReturnSum;
            const totalPaid = totalDirectPaid + totalVoucherPayments;
            const finalPending = netPurchase - totalPaid;

            document.getElementById('totalPurchase').innerText = netPurchase.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            document.getElementById('totalPaid').innerText = totalPaid.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            document.getElementById('totalPending').innerText = (finalPending > 0 ? finalPending : 0).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            
            allInvoices.sort((a,b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
            renderInvoices(allInvoices);
        } catch (error) {
            console.error(error);
            document.getElementById('invoicesContainer').innerHTML = '<div class="text-danger text-center p-5 fw-bold">حدث خطأ غير متوقع أثناء معالجة البيانات.</div>';
        }
    };

    function calculateHistoricalPreviousBalance(supId, invoiceTimestamp) {
        const supplier = suppliersBase[supId];
        if (!supplier) return 0;

        let debt = 0;
        let credit = 0;
        const targetSeconds = invoiceTimestamp?.seconds || 0;

        globalVouchers.forEach(v => {
            if (v.partyId === supId && v.timestamp && v.timestamp.seconds < targetSeconds) {
                const amt = Number(v.amount) || 0;
                if (v.type === "صرف") credit += amt;
                else if (v.type === "قبض") debt += amt;
            }
        });

        allInvoices.forEach(inv => {
            if (inv.supplierId === supId && inv.timestamp && inv.timestamp.seconds < targetSeconds) {
                const amt = inv.displayGross;
                if (inv.type === "شراء" || inv.type === "فاتورة شراء") debt += amt;
                else if (inv.type === "مرتجع شراء") credit += amt;
            }
        });

        return (supplier.openingBalance + debt) - credit;
    }

    function renderInvoices(dataList) {
        const container = document.getElementById('invoicesContainer');
        if (dataList.length === 0) {
            container.innerHTML = '<div class="text-center text-muted py-5 fw-bold">لا تتوفر فواتير مسجلة في السجل حالياً</div>';
            return;
        }

        container.innerHTML = dataList.map(inv => {
            const supName = suppliersBase[inv.supplierId] ? suppliersBase[inv.supplierId].name : 'مورد غير معروف';
            const historicalPrevBalance = calculateHistoricalPreviousBalance(inv.supplierId, inv.timestamp);
            const formattedDate = formatEnglishDate(inv.date);

            let badgeClass = 'type-credit';
            let badgeText = '<i class="fas fa-user-clock"></i>آجل';

            if (inv.isReturn) {
                badgeClass = 'type-return';
                badgeText = '<i class="fas fa-undo-alt"></i>مرتجع';
            } else if (inv.computedCashPaid > 0 && inv.computedWalletPaid > 0) {
                badgeClass = 'type-mixed';
                badgeText = '<i class="fas fa-wallet"></i>مختلط';
            } else if (inv.computedCashPaid > 0 || inv.paymentType === 'cash') {
                badgeClass = 'type-cash';
                badgeText = '<i class="fas fa-money-bill-wave"></i>نقدي';
            } else if (inv.computedWalletPaid > 0 || inv.paymentType === 'wallet') {
                badgeClass = 'type-wallet';
                badgeText = '<i class="fas fa-mobile-alt"></i>محفظة';
            }

            const totalInvoiceVal = Number(inv.displayGross);
            const netPendingVal = Number(inv.isReturn ? inv.displayGross : inv.displayNetPending);
            const finalSupplierTotal = historicalPrevBalance + (inv.isReturn ? -totalInvoiceVal : inv.displayNetPending);

            return `
            <div class="invoice-card ${inv.isReturn ? 'return-style' : 'purchase-style'}" id="card-${inv.id}">
                <!-- رأس الكارت: اسم المورد + التاريخ + الشارة -->
                <div class="inv-header">
                    <div class="inv-header-info" onclick="window.location.href='new-purchase-invoice.html?edit=${inv.id}'">
                        <p class="sup-name">${supName}</p>
                        <span class="inv-date"><i class="far fa-calendar-alt me-1"></i>${formattedDate}</span>
                    </div>
                    <span class="inv-badge ${badgeClass}">${badgeText}</span>
                </div>

                <!-- صف الأدوات + السعر -->
                <div class="inv-actions-row">
                    <!-- أزرار الأدوات -->
                    <div class="inv-tools">
                        <button class="tool-btn tool-btn-share" onclick="shareAsThermalImageDirectly('${inv.id}')" title="مشاركة الفاتورة">
                            <i class="fas fa-share-alt"></i>
                        </button>
                        <button class="tool-btn tool-btn-items" onclick="toggleInvoiceDetails('${inv.id}')" title="عرض الأصناف">
                            <i class="fas fa-cubes"></i>
                        </button>
                        <button class="tool-btn tool-btn-delete" onclick="deleteSingleInvoice('${inv.id}')" title="حذف الفاتورة">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>

                    <!-- السعر -->
                    <div class="price-tag" onclick="window.location.href='new-purchase-invoice.html?edit=${inv.id}'">
                        <span class="price-label">${inv.isReturn ? 'قيمة المرتجع' : 'متبقي الفاتورة'}</span>
                        <span class="price-val" style="color:${inv.isReturn ? 'var(--danger)' : (inv.displayNetPending > 0 ? 'var(--danger)' : 'var(--primary)')}">
                            ${inv.isReturn ? '-' : ''}${netPendingVal.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}
                            <small style="font-size:0.65rem; font-weight:700;">EGP</small>
                        </span>
                    </div>
                </div>

                <!-- شريط الحساب -->
                <div class="balance-strip text-dark">
                    <span>إجمالي: <b class="text-secondary">${totalInvoiceVal.toFixed(2)}</b></span>
                    <span>السابق: <b class="text-primary">${historicalPrevBalance.toFixed(2)}</b></span>
                    <span>الصافي: <b class="${finalSupplierTotal > 0 ? 'text-danger':'text-success'}">${finalSupplierTotal.toFixed(2)}</b></span>
                </div>

                <!-- تفاصيل الأصناف -->
                <div id="details_${inv.id}" class="details-box" style="display:none;">
                    <table class="table table-sm details-table table-borderless">
                        <thead>
                            <tr>
                                <th>الصنف</th>
                                <th class="text-center">الكمية</th>
                                <th class="text-center">السعر</th>
                                <th class="text-start">الإجمالي</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${(inv.items || []).map(item => `
                                <tr>
                                    <td class="text-dark fw-bold">${item.name}</td>
                                    <td class="text-center text-secondary">${item.qty || item.returnQty || 0}</td>
                                    <td class="text-center">${Number(item.buy || 0).toFixed(2)}</td>
                                    <td class="text-start text-dark fw-bold">${((item.qty || item.returnQty || 0) * Number(item.buy || 0)).toFixed(2)}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            </div>`;
        }).join('');
    }

    // ============================================================
    // [جديد] حذف فاتورة واحدة
    // ============================================================
    window.deleteSingleInvoice = async function(invoiceId) {
        if (!confirm('هل تريد حذف هذه الفاتورة؟ لا يمكن التراجع عن هذا الإجراء.')) return;
        try {
            await deleteDoc(doc(db, "supplier_transactions", invoiceId));
            // إزالة الكارت من الواجهة مباشرة بدون إعادة تحميل
            const card = document.getElementById('card-' + invoiceId);
            if (card) {
                card.style.transition = 'opacity 0.3s, transform 0.3s';
                card.style.opacity = '0';
                card.style.transform = 'scale(0.97)';
                setTimeout(() => card.remove(), 300);
            }
            // تحديث الإحصائيات
            allInvoices = allInvoices.filter(i => i.id !== invoiceId);
            recalcStats();
        } catch (e) {
            alert('خطأ أثناء الحذف: ' + e.message);
        }
    };

    function recalcStats() {
        let totalPurchaseSum = 0, totalReturnSum = 0, totalDirectPaid = 0;
        allInvoices.forEach(inv => {
            if (inv.type === "شراء" || inv.type === "فاتورة شراء") {
                totalPurchaseSum += inv.displayGross;
                totalDirectPaid += inv.computedTotalPaid;
            } else if (inv.type === "مرتجع شراء") {
                totalReturnSum += inv.displayGross;
            }
        });
        let totalVoucherPayments = 0;
        globalVouchers.forEach(v => {
            if (v.type === "صرف" || v.actionType === "سداد مورد" || String(v.details || '').includes("سداد")) {
                totalVoucherPayments += Number(v.amount || 0);
            }
        });
        const netPurchase   = totalPurchaseSum - totalReturnSum;
        const totalPaid     = totalDirectPaid + totalVoucherPayments;
        const finalPending  = Math.max(0, netPurchase - totalPaid);
        document.getElementById('totalPurchase').innerText = netPurchase.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        document.getElementById('totalPaid').innerText     = totalPaid.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        document.getElementById('totalPending').innerText  = finalPending.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    }

    window.shareAsThermalImageDirectly = async (invoiceId) => {
        const inv = allInvoices.find(i => i.id === invoiceId);
        if (!inv) return;

        const supName = suppliersBase[inv.supplierId] ? suppliersBase[inv.supplierId].name : 'مورد غير معروف';
        const historicalPrevBalance = calculateHistoricalPreviousBalance(inv.supplierId, inv.timestamp);
        const items = inv.items || [];
        const hiddenDiv = document.getElementById('thermalInvoiceHidden');
        const formattedDate = formatEnglishDate(inv.date);

        let rowsHtml = "";
        items.forEach(item => {
            const isItemReturn = item.returnQty > 0 || inv.isReturn;
            const qty = item.qty || item.returnQty || 0;
            const unit = item.unitName || 'كرتونة';
            const price = item.buy || 0;
            const subtotal = qty * price;
            rowsHtml += `
                <tr>
                    <td style="padding: 8px 0; font-size:14px; color:#000;">
                        <b>${item.name}</b><br>
                        <span style="color:#555; font-size:12px;">(${isItemReturn ? '-' : ''}${qty} ${unit} × ${price.toFixed(2)} EGP)</span>
                    </td>
                    <td style="text-align: left; padding: 8px 0; font-family:'Montserrat', sans-serif; font-weight:800; font-size:14px;">
                        ${isItemReturn ? '-' : ''}${subtotal.toFixed(2)}
                    </td>
                </tr>`;
        });

        const grossTotal = Number(inv.displayGross);
        const cashPaid = Number(inv.computedCashPaid || 0);
        const walletPaid = Number(inv.computedWalletPaid || 0);
        const netPending = Number(inv.displayNetPending);
        const finalSupplierTotal = historicalPrevBalance + (inv.isReturn ? -grossTotal : netPending);

        let paymentDesc = "آجل الحساب";
        if (cashPaid > 0 && walletPaid > 0) paymentDesc = "مشترك (كاش + محفظة)";
        else if (cashPaid > 0) paymentDesc = "نقدي كاش";
        else if (walletPaid > 0) paymentDesc = "محفظة إلكترونية";

        hiddenDiv.innerHTML = `
            <div class="term-header">
                <p class="term-title">شركة الزيادى للتجارة</p>
                <small style="color:#222; font-size:14px; font-weight:700;">فاتورة مراجعة مشتريات للمورد</small>
            </div>
            <div style="font-size: 13px; margin-bottom: 12px; border-bottom:1px dashed #000; padding-bottom:10px; line-height: 1.6;">
                <div><b>نوع الحساب:</b> ${inv.isReturn ? 'مرتجع شراء ↩️' : 'فاتورة شراء 🧾'}</div>
                <div><b>المورد:</b> ${supName}</div>
                <div><b>التاريخ:</b> ${formattedDate}</div>
                <div><b>طريقة السداد:</b> ${paymentDesc}</div>
            </div>
            <table class="term-table">
                <thead><tr><th>الصنف</th><th style="text-align:left;">الإجمالي</th></tr></thead>
                <tbody>${rowsHtml}</tbody>
            </table>
            <div class="term-footer">
                <div class="term-row" style="color:#444;">
                    <span>الحساب السابق:</span>
                    <span style="font-family:'Montserrat',sans-serif;">${historicalPrevBalance.toFixed(2)} EGP</span>
                </div>
                <div class="term-row">
                    <span>إجمالي الفاتورة:</span>
                    <span style="font-family:'Montserrat',sans-serif;">${inv.isReturn ? '-' : ''}${grossTotal.toFixed(2)} EGP</span>
                </div>
                ${cashPaid > 0 ? `<div class="term-row" style="color:#2d6a4f;"><span>المدفوع نقداً:</span><span style="font-family:'Montserrat',sans-serif;">-${cashPaid.toFixed(2)} EGP</span></div>` : ''}
                ${walletPaid > 0 ? `<div class="term-row" style="color:#0077b6;"><span>المدفوع بالمحفظة:</span><span style="font-family:'Montserrat',sans-serif;">-${walletPaid.toFixed(2)} EGP</span></div>` : ''}
                <div class="term-row" style="border-top:1px dashed #000; padding-top:6px; color:#555;">
                    <span>صافي الآجل:</span>
                    <span style="font-family:'Montserrat',sans-serif;">${inv.isReturn ? '-' : ''}${netPending.toFixed(2)} EGP</span>
                </div>
                <div class="term-row" style="border-top:2px dashed #000; padding-top:8px; font-size:17px; color:#0b5e3d;">
                    <span>إجمالي المتبقي الكلي:</span>
                    <span style="font-family:'Montserrat',sans-serif;">${finalSupplierTotal.toFixed(2)} EGP</span>
                </div>
            </div>
            <div style="text-align:center; margin-top:25px; font-size:12px; color:#333; border-top:1px dashed #000; padding-top:10px; font-weight:700;">
                إدارة وتصميم مالي / أحمد محمود الزيادى
            </div>`;

        try {
            const canvas = await html2canvas(hiddenDiv, { scale: 2, backgroundColor: "#ffffff", useCORS: true });
            canvas.toBlob(async (blob) => {
                if (!blob) return alert("فشل تصدير الصورة");
                const file = new File([blob], `Invoice_${invoiceId}.png`, { type: "image/png" });
                if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({ files: [file], title: `فاتورة شركة الزيادى للمورد ${supName}` });
                } else {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `فاتورة_${supName}.png`;
                    a.click();
                }
            }, "image/png");
        } catch (error) {
            alert("خطأ أثناء توليد الفاتورة: " + error.message);
        }
    };

    window.searchInvoices = () => {
        const term = document.getElementById('searchInput').value.toLowerCase();
        const filtered = allInvoices.filter(inv => {
            const name = suppliersBase[inv.supplierId] ? suppliersBase[inv.supplierId].name.toLowerCase() : '';
            return name.includes(term) || (inv.date && inv.date.includes(term));
        });
        renderInvoices(filtered);
    };

    window.deleteAllInvoices = async () => {
        if (!confirm("⚠️ تحذير: هل أنت متأكد من مسح كافة سجلات الفواتير؟ لن تستطيع استرجاعها.")) return;
        try {
            const snap = await getDocs(collection(db, "supplier_transactions"));
            if (snap.empty) return alert("السجل فارغ بالفعل.");
            for (const d of snap.docs) {
                await deleteDoc(doc(db, "supplier_transactions", d.id));
            }
            alert("تم إفراغ السجل بنجاح ✅");
            init();
        } catch (e) {
            alert("خطأ: " + e.message);
        }
    };

    window.exportToExcel = () => {
        if (allInvoices.length === 0) return alert("لا تتوفر بيانات لاستخراجها");

        let excelData = [["التاريخ","الحركة","اسم المورد","اسم الصنف","عدد قطعة","عدد كرتونة","سعر قطعة","سعر كرتونة"]];
        allInvoices.forEach(inv => {
            const supplierName = suppliersBase[inv.supplierId] ? suppliersBase[inv.supplierId].name : "";
            if (Array.isArray(inv.items) && inv.items.length > 0) {
                inv.items.forEach(item => {
                    const unit = item.unitName || "كرتونة";
                    const isItemReturn = item.returnQty > 0 || inv.isReturn;
                    const motionType = isItemReturn ? "بيع" : "شراء";
                    let qtyPcs = "", qtyCrt = "", pricePcs = "", priceCrt = "";
                    if (unit === "قطعة") { qtyPcs = item.qty || item.returnQty || 0; pricePcs = item.buy || 0; }
                    else { qtyCrt = item.qty || item.returnQty || 0; priceCrt = item.buy || 0; }
                    excelData.push([inv.date || "", motionType, supplierName, item.name || "", qtyPcs, qtyCrt, pricePcs, priceCrt]);
                });
            }
            const currentPaid = Number(inv.computedTotalPaid || 0);
            if (currentPaid > 0) {
                excelData.push([inv.date || "", "سداد نقدى", supplierName, "سداد", "", 1, "", currentPaid]);
            }
        });

        const worksheet = XLSX.utils.aoa_to_sheet(excelData);
        worksheet['!cols'] = [15,15,25,30,15,15,15,15].map(w => ({ wch: w }));
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "المشتريات");
        XLSX.writeFile(workbook, "تقرير_المشتريات.xlsx");
    };

    window.toggleInvoiceDetails = function(id) {
        const box = document.getElementById(`details_${id}`);
        if (!box) return;
        box.style.display = (box.style.display === "none" || box.style.display === "") ? "block" : "none";
    };

    init();
</script>
</body>
</html>
