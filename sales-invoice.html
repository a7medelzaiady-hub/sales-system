<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فاتورة مبيعات - سريع</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
body{font-family:'Cairo';background:#f4f7f6}
.header-nav{background:#0b5e3d;color:#fff;padding:12px;position:sticky;top:0}
.invoice-card{background:#fff;margin:15px;padding:15px;border-radius:20px}
.product-row{background:#f8faf9;padding:10px;margin-top:10px;border-radius:12px}
.btn-save{background:#0b5e3d;color:#fff;width:100%;padding:12px;border:none;border-radius:12px;margin-top:15px}
.total-box{background:#0b5e3d;color:#fff;padding:15px;border-radius:15px;margin-top:15px}
</style>
</head>

<body>

<!-- Loading -->
<div id="loading" style="
position:fixed;
inset:0;
background:#fff;
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
font-weight:bold;">
جاري التحميل...
</div>

<div class="header-nav">
فاتورة مبيعات سريعة
</div>

<div class="container">
<div class="invoice-card">

<div class="mb-3">
<input id="customerSearch" class="form-control" placeholder="ابحث عن عميل">
<input type="hidden" id="customerSelect">
</div>

<div id="itemsContainer"></div>

<button class="btn btn-primary w-100 mt-2" onclick="addRow()">+ إضافة صنف</button>

<div class="total-box mt-3">
الإجمالي: <span id="total">0</span>
</div>

<button class="btn-save" onclick="save()">حفظ الفاتورة</button>

</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
getFirestore, collection, getDocs, addDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyAS0NNcZy0t",
authDomain: "ahmedelzaiady.firebaseapp.com",
projectId: "ahmedelzaiady"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let customers = [];
let inventory = [];

/* ========== INIT سريع ========== */
window.addEventListener("DOMContentLoaded", () => {
    addRow();
    calc();
    loadData();
});

/* ========== إخفاء التحميل بعد تحميل الصفحة ========== */
window.addEventListener("load", () => {
    document.getElementById("loading").style.display = "none";
});

/* ========== تحميل البيانات في الخلفية ========== */
async function loadData(){
    try{
        const [c, i] = await Promise.all([
            getDocs(collection(db,"customers")),
            getDocs(collection(db,"inventory"))
        ]);

        customers = c.docs.map(d=>d.data());
        inventory = i.docs.map(d=>d.data());

        console.log("Data loaded");
    }catch(e){
        console.error("Load error:", e);
    }
}

/* ========== إضافة صنف ========== */
window.addRow = function(){
    const id = "r"+Math.random().toString(36).slice(2,7);

    document.getElementById("itemsContainer").insertAdjacentHTML("beforeend",`
        <div class="product-row" id="${id}">
            <input class="form-control mb-2 p-name" placeholder="الصنف" oninput="calc()">
            <input class="form-control p-qty" type="number" placeholder="الكمية" value="1" oninput="calc()">
        </div>
    `);
};

/* ========== الحساب الصحيح ========== */
window.calc = function(){

    if(inventory.length === 0) {
        document.getElementById("total").innerText = 0;
        return;
    }

    let total = 0;

    document.querySelectorAll(".product-row").forEach(r=>{
        const name = r.querySelector(".p-name").value.trim();
        const qty = Number(r.querySelector(".p-qty").value) || 0;

        const item = inventory.find(i => i.name === name);

        const price = item ? Number(item.sell || 0) : 0;

        total += qty * price;
    });

    document.getElementById("total").innerText = total.toFixed(2);
};

/* ========== حفظ الفاتورة ========== */
window.save = async function(){
    try{
        await addDoc(collection(db,"invoices"),{
            time: new Date().toISOString()
        });

        alert("تم الحفظ بنجاح");
    }catch(e){
        alert("خطأ: " + e.message);
    }
};
</script>

</body>
</html>
