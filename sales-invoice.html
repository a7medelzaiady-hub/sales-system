<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فاتورة مبيعات - شركة الزيادي</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root { 
    --accent: #0b5e3d; 
    --bg: #f4f7f6;
    --white: #fff;
}

body{
    font-family:'Cairo';
    background:var(--bg);
    padding:15px;
}
.invoice-card{
    background:#fff;
    padding:20px;
    border-radius:20px;
}
.btn-save{
    background:var(--accent);
    color:#fff;
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    margin-top:20px;
}
</style>
</head>

<body>

<div class="invoice-card">

<h4>فاتورة مبيعات</h4>

<input id="customer" class="form-control mb-2" placeholder="اسم العميل">

<div id="items"></div>

<button onclick="addRow()" class="btn btn-secondary w-100">إضافة صنف</button>

<input id="paid" type="number" class="form-control mt-3" placeholder="المدفوع">

<button class="btn-save" onclick="saveInvoice()">حفظ الفاتورة</button>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, doc, updateDoc, increment } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "AIzaSyAS0NNcZ1",
 authDomain: "ahmedelzaiady.firebaseapp.com",
 projectId: "ahmedelzaiady"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let offlineQueue = JSON.parse(localStorage.getItem("offlineInvoices") || "[]");

/* ================== OFFLINE CHECK ================== */
function isOnline(){
    return navigator.onLine;
}

window.addEventListener("online", syncOffline);

/* ================== ADD ROW ================== */
window.addRow = function(){
    document.getElementById("items").insertAdjacentHTML("beforeend", `
        <div class="row mb-2">
            <input class="form-control col qty" placeholder="كمية">
            <input class="form-control col price" placeholder="سعر">
        </div>
    `);
};

/* ================== SAVE ================== */
window.saveInvoice = async function(){

    let items = [];
    document.querySelectorAll("#items .row").forEach(r=>{
        items.push({
            qty: Number(r.querySelector(".qty").value||0),
            price: Number(r.querySelector(".price").value||0)
        });
    });

    const invoiceData = {
        customer: document.getElementById("customer").value,
        paid: Number(document.getElementById("paid").value||0),
        items,
        createdAt: new Date().toISOString()
    };

    if(isOnline()){
        await processInvoice(invoiceData);
        alert("تم الحفظ أونلاين");
    }else{
        offlineQueue.push(invoiceData);
        localStorage.setItem("offlineInvoices", JSON.stringify(offlineQueue));
        alert("لا يوجد إنترنت — تم الحفظ أوفلاين");
    }
};

/* ================== PROCESS ONLINE ================== */
async function processInvoice(inv){

    // حساب الإجمالي
    let total = 0;

    inv.items.forEach(i=>{
        total += i.qty * i.price;
    });

    inv.total = total;
    inv.remaining = total - inv.paid;

    // حفظ الفاتورة
    await addDoc(collection(db,"invoices"), inv);

    // خصم مخزون (لو عندك inventory id ضيفه هنا لاحقاً)
}

/* ================== SYNC OFFLINE ================== */
async function syncOffline(){

    let data = JSON.parse(localStorage.getItem("offlineInvoices") || "[]");
    if(data.length === 0) return;

    for(let inv of data){
        await processInvoice(inv);
    }

    localStorage.removeItem("offlineInvoices");
    alert("تم رفع الفواتير الأوفلاين بنجاح");
}

window.syncOffline = syncOffline;

</script>

</body>
</html>
