<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الفواتير والمبيعات الذكي - الزيادي للزيوت</title>
    <!-- Firebase App (the core Firebase SDK) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <!-- Firebase Firestore -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 10px;
            direction: rtl;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 15px;
        }

        header {
            text-align: center;
            border-bottom: 2px solid #0056b3;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        header h1 {
            color: #0056b3;
            font-size: 20px;
            margin-bottom: 5px;
        }

        header p {
            color: #666;
            font-size: 13px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 5px;
            color: #444;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            background-color: #fafafa;
        }

        .form-control:focus {
            outline: none;
            border-color: #0056b3;
            background-color: #fff;
        }

        /* جدول الفاتورة - مصمم خصيصاً للموبايل */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            margin-top: 15px;
            margin-bottom: 15px;
            border: 1px solid #eee;
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            min-width: 450px;
        }

        th {
            background-color: #0056b3;
            color: white;
            padding: 10px 8px;
            text-align: center;
        }

        td {
            padding: 8px;
            border-bottom: 1px solid #eee;
            text-align: center;
            vertical-align: middle;
        }

        .qty-input {
            width: 55px;
            padding: 6px;
            text-align: center;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
        }

        .price-input {
            width: 70px;
            padding: 6px;
            text-align: center;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
        }

        .btn-delete {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-add {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            width: 100%;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
        }

        /* قسم تصوير البضاعة */
        .camera-section {
            background-color: #f8f9fa;
            border: 2px dashed #0056b3;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            margin-bottom: 15px;
        }

        .camera-btn {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        #imagePreviewContainer {
            margin-top: 10px;
            display: none;
        }

        #cargoImagePreview {
            max-width: 100%;
            max-height: 200px;
            border-radius: 6px;
            border: 1px solid #ddd;
        }

        /* ملخص الفاتورة */
        .summary-box {
            background-color: #e9ecef;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .summary-row:last-child {
            margin-bottom: 0;
            font-weight: bold;
            color: #0056b3;
            border-top: 1px solid #ccc;
            padding-top: 6px;
        }

        .btn-save {
            background-color: #ffc107;
            color: #212529;
            border: none;
            padding: 12px;
            border-radius: 6px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .btn-save:hover {
            background-color: #e0a800;
        }

        /* إظهار التاريخ والوقت بشكل دائم وثابت */
        .datetime-display {
            font-size: 12px;
            color: #666;
            text-align: left;
            margin-top: -5px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>الزيادي لزيوت السيارات</h1>
        <p>نظام تحرير الفواتير المطور والمبيعات الذكية</p>
    </header>

    <!-- عرض التاريخ والوقت الحالي بشكل تلقائي ودائم لجميع الفواتير -->
    <div class="datetime-display" id="invoiceDateTime">
        التاريخ والوقت: --/--/---- --:--
    </div>

    <!-- بيانات العميل والدخول الأساسي -->
    <div class="form-group">
        <label for="customerSelect">اسم العميل:</label>
        <select id="customerSelect" class="form-control">
            <option value="">-- اختر العميل --</option>
            <option value="cust_01">عميل تجريبي 1</option>
            <option value="cust_02">عميل تجريبي 2</option>
        </select>
    </div>

    <div class="form-group">
        <label for="productSelect">إضافة صنف للفاتورة:</label>
        <select id="productSelect" class="form-control" onchange="addProductRow()">
            <option value="">-- اختر الصنف لإضافته مباشرة --</option>
            <option value="prod_01" data-name="زيت شل 4 لتر" data-price="500">زيت شل 4 لتر (سعر المخزن: 500)</option>
            <option value="prod_02" data-name="زيت موبيل 1 لتر" data-price="150">زيت موبيل 1 لتر (سعر المخزن: 150)</option>
            <option value="prod_03" data-name="زيت توتال 4 لتر" data-price="480">زيت توتال 4 لتر (سعر المخزن: 480)</option>
        </select>
    </div>

    <!-- جدول الفاتورة -->
    <div class="table-responsive">
        <table id="invoiceTable">
            <thead>
                <tr>
                    <th>اسم الصنف</th>
                    <th>كرتونة</th>
                    <th>جركن / قطعة</th>
                    <th>السعر</th>
                    <th>الإجمالي</th>
                    <th>حذف</th>
                </tr>
            </thead>
            <tbody>
                <!-- الصفوف تضاف ديناميكياً هنا -->
            </tbody>
        </table>
    </div>

    <button type="button" class="btn-add" onclick="addNewEmptyRow()">➕ إضافة سطر يدوي</button>

    <!-- قسم تصوير البضاعة والاحتفاظ بها -->
    <div class="camera-section">
        <input type="file" id="cargoImageInput" accept="image/*" capture="environment" style="display: none;" onchange="previewCargoImage(event)">
        <button type="button" class="camera-btn" onclick="document.getElementById('cargoImageInput').click()">
            📸 تصوير البضاعة والاحتفاظ بها للمراجعة
        </button>
        <div id="imagePreviewContainer">
            <img id="cargoImagePreview" src="" alt="معاينة البضاعة">
            <p style="color: #28a745; font-size: 12px; margin-top: 5px; font-weight: bold;">تم التقاط صورة البضاعة بنجاح ✅</p>
        </div>
    </div>

    <!-- ملخص مالي وكمي للفاتورة -->
    <div class="summary-box">
        <div class="summary-row">
            <span>إجمالي الكراتين:</span>
            <span id="totalCartons">0</span>
        </div>
        <div class="summary-row">
            <span>إجمالي الجراكن / القطع:</span>
            <span id="totalJerricans">0</span>
        </div>
        <div class="summary-row">
            <span>إجمالي عدد الأصناف الفعلي:</span>
            <span id="totalItemsCount">0</span>
        </div>
        <div class="summary-row">
            <span>إجمالي قيمة الفاتورة:</span>
            <span id="invoiceGrandTotal">0.00 ج.م</span>
        </div>
    </div>

    <!-- زر الحفظ النهائي -->
    <button type="button" class="btn-save" onclick="saveInvoice()">💾 حفظ الفاتورة والاحتفاظ بالبيانات</button>
</div>

<script>
    // 1. تهيئة Firebase (يرجى استبدال الإعدادات ببيانات مشروعك الخاصة)
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_AUTH_DOMAIN",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_STORAGE_BUCKET",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID"
    };
    
    // تجنب إعادة التهيئة إذا كان Firebase مهيئاً بالفعل
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    let base64CargoImage = ""; // متغير لحفظ الصورة بصيغة نصية

    // تحديث التاريخ والوقت تلقائياً عند تحميل الصفحة لجميع الفواتير
    function updateDateTime() {
        const now = new Date();
        const formattedDate = now.toLocaleDateString('ar-EG', { year: 'numeric', month: '2-digit', day: '2-digit' });
        const formattedTime = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        document.getElementById('invoiceDateTime').innerText = `التاريخ والوقت: ${formattedDate} - ${formattedTime}`;
    }
    
    setInterval(updateDateTime, 1000);
    updateDateTime();

    // 2. منطق جلب وتحديد السعر الذكي
    // يقارن آخر سعر بيع للصنف عموماً بسعر المخزن الحالي ويعتمد الأكبر
    async function getSmartProductPrice(productId, storePrice) {
        try {
            storePrice = parseFloat(storePrice || 0);

            // جلب آخر عملية بيع لهذا الصنف عموماً من قاعدة البيانات
            const salesRef = db.collection("sales");
            const lastSaleQuery = await salesRef
                .where(`products.${productId}`, "!=", null)
                .orderBy("timestamp", "desc")
                .limit(1)
                .get();

            if (!lastSaleQuery.empty) {
                const lastSaleDoc = lastSaleQuery.docs[0].data();
                const lastSoldPrice = parseFloat(lastSaleDoc.products[productId].price || 0);
                
                console.log(`سعر المخزن الحقيقي: ${storePrice} | آخر سعر بيع مسجل: ${lastSoldPrice}`);

                // إذا كان آخر سعر بيع أكبر من سعر المخزن، يتم اعتماده
                if (lastSoldPrice > storePrice) {
                    console.log("تم اعتماد آخر سعر بيع لكونه أكبر من سعر المخزن.");
                    return lastSoldPrice;
                }
            }
            
            // في حال عدم وجود مبيعات سابقة أو أن سعر المخزن أكبر
            console.log("تم اعتماد سعر المخزن الافتراضي.");
            return storePrice;

        } catch (error) {
            console.error("خطأ أثناء جلب السعر الذكي، تم اعتماد سعر المخزن تلقائياً:", error);
            return storePrice;
        }
    }

    // 3. إضافة صنف للفاتورة وتطبيق السعر الذكي تلقائياً
    async function addProductRow() {
        const select = document.getElementById("productSelect");
        const productId = select.value;
        if (!productId) return;

        const option = select.options[select.selectedIndex];
        const productName = option.getAttribute("data-name");
        const storePrice = option.getAttribute("data-price");

        // استدعاء دالة السعر الذكي لمقارنة سعر المخزن مع آخر سعر بيع
        const finalPrice = await getSmartProductPrice(productId, storePrice);

        const tbody = document.querySelector("#invoiceTable tbody");
        
        const row = document.createElement("tr");
        row.setAttribute("data-product-id", productId);
        row.innerHTML = `
            <td style="text-align: right; font-weight: 600;">${productName}</td>
            <td><input type="number" class="qty-input carton-input" value="0" min="0" oninput="calculateRowTotal(this)"></td>
            <td><input type="number" class="qty-input jerrican-input" value="0" min="0" oninput="calculateRowTotal(this)"></td>
            <td><input type="number" class="price-input" value="${finalPrice}" min="0" step="0.1" oninput="calculateRowTotal(this)"></td>
            <td class="row-total" style="font-weight: bold;">0.00</td>
            <td><button type="button" class="btn-delete" onclick="deleteRow(this)">حذف</button></td>
        `;

        tbody.appendChild(row);
        select.value = ""; // إعادة تصفير القائمة المنسدلة
        calculateInvoiceSummary();
    }

    // إضافة سطر فارغ يدوياً (في حال الرغبة بإضافة صنف حر)
    function addNewEmptyRow() {
        const tbody = document.querySelector("#invoiceTable tbody");
        const row = document.createElement("tr");
        row.setAttribute("data-product-id", "custom_item_" + Date.now());
        row.innerHTML = `
            <td><input type="text" class="form-control" style="padding: 5px; font-size:12px;" placeholder="اسم صنف مخصص"></td>
            <td><input type="number" class="qty-input carton-input" value="0" min="0" oninput="calculateRowTotal(this)"></td>
            <td><input type="number" class="qty-input jerrican-input" value="0" min="0" oninput="calculateRowTotal(this)"></td>
            <td><input type="number" class="price-input" value="0" min="0" step="0.1" oninput="calculateRowTotal(this)"></td>
            <td class="row-total" style="font-weight: bold;">0.00</td>
            <td><button type="button" class="btn-delete" onclick="deleteRow(this)">حذف</button></td>
        `;
        tbody.appendChild(row);
    }

    // حساب إجمالي السطر الفردي
    function calculateRowTotal(input) {
        const row = input.closest("tr");
        const cartons = parseFloat(row.querySelector(".carton-input").value || 0);
        const jerricans = parseFloat(row.querySelector(".jerrican-input").value || 0);
        const price = parseFloat(row.querySelector(".price-input").value || 0);
        
        // إجمالي الكمية = عدد الكراتين + عدد الجراكن (القطع)
        const totalQty = cartons + jerricans;
        const total = totalQty * price;
        
        row.querySelector(".row-total").innerText = total.toFixed(2);
        calculateInvoiceSummary();
    }

    // حذف السطر
    function deleteRow(button) {
        const row = button.closest("tr");
        row.remove();
        calculateInvoiceSummary();
    }

    // حساب ملخص الفاتورة بالكامل (كراتين، جراكن، إجمالي كمي، إجمالي مالي)
    function calculateInvoiceSummary() {
        let totalCartons = 0;
        let totalJerricans = 0;
        let grandTotal = 0;

        const rows = document.querySelectorAll("#invoiceTable tbody tr");
        rows.forEach(row => {
            const cartons = parseFloat(row.querySelector(".carton-input")?.value || 0);
            const jerricans = parseFloat(row.querySelector(".jerrican-input")?.value || 0);
            const total = parseFloat(row.querySelector(".row-total").innerText || 0);

            totalCartons += cartons;
            totalJerricans += jerricans;
            grandTotal += total;
        });

        document.getElementById("totalCartons").innerText = totalCartons;
        document.getElementById("totalJerricans").innerText = totalJerricans;
        document.getElementById("totalItemsCount").innerText = totalCartons + totalJerricans;
        document.getElementById("invoiceGrandTotal").innerText = grandTotal.toFixed(2) + " ج.م";
    }

    // 4. تصوير ومعاينة البضاعة
    function previewCargoImage(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                base64CargoImage = e.target.result;
                document.getElementById("cargoImagePreview").src = base64CargoImage;
                document.getElementById("imagePreviewContainer").style.display = "block";
            };
            reader.readAsDataURL(file);
        }
    }

    // 5. حفظ الفاتورة مع التنبيه والتحقق من التقاط الصورة
    async function saveInvoice() {
        const customerId = document.getElementById("customerSelect").value;
        const rows = document.querySelectorAll("#invoiceTable tbody tr");

        if (!customerId) {
            alert("⚠️ يرجى اختيار العميل أولاً قبل الحفظ!");
            return;
        }

        if (rows.length === 0) {
            alert("⚠️ يرجى إضافة صنف واحد على الأقل إلى الفاتورة!");
            return;
        }

        // حساب تفاصيل وعدد الأصناف والكميات
        let totalCartons = 0;
        let totalJerricans = 0;
        const productsData = {};

        rows.forEach(row => {
            const productId = row.getAttribute("data-product-id");
            const cartons = parseFloat(row.querySelector(".carton-input")?.value || 0);
            const jerricans = parseFloat(row.querySelector(".jerrican-input")?.value || 0);
            const price = parseFloat(row.querySelector(".price-input")?.value || 0);
            
            totalCartons += cartons;
            totalJerricans += jerricans;

            productsData[productId] = {
                cartons: cartons,
                jerricans: jerricans,
                price: price,
                total: (cartons + jerricans) * price
            };
        });

        const totalQty = totalCartons + totalJerricans;

        // التحقق الإلزامي من تصوير البضاعة قبل الحفظ
        if (!base64CargoImage) {
            alert("⚠️ تنبيه هام: يرجى تصوير البضاعة أولاً والاحتفاظ بها على البرنامج للرجوع إليها وقت المراجعة!");
            document.getElementById("cargoImageInput").click(); // فتح الكاميرا تلقائياً للمستخدم لتسهيل الحركة
            return;
        }

        // تنبيه المستخدم بالأعداد الإجمالية للتأكيد
        const userConfirmed = confirm(
            `🚨 تنبيه المراجعة والتأكيد:\n\n` +
            `يرجى التأكد من مطابقة الأعداد المسجلة للبضاعة الفعلية:\n` +
            `- إجمالي عدد الكراتين: (${totalCartons})\n` +
            `- إجمالي عدد الجراكن: (${totalJerricans})\n` +
            `- إجمالي عدد الأصناف الفعلي: (${totalQty} قطعة/كرتونة)\n\n` +
            `هل تم التأكد من صحة الأعداد وتريد الاستمرار وحفظ الفاتورة مع الصورة الملتقطة؟`
        );

        if (!userConfirmed) {
            return; // إلغاء الحفظ لإتاحة التعديل
        }

        try {
            // تجهيز بيانات الفاتورة للإرسال إلى Firestore
            const invoicePayload = {
                customerId: customerId,
                products: productsData,
                totalCartons: totalCartons,
                totalJerricans: totalJerricans,
                totalItemsCount: totalQty,
                grandTotal: parseFloat(document.getElementById("invoiceGrandTotal").innerText),
                cargoImage: base64CargoImage, // تخزين الصورة الملتقطة كأساس للمراجعة
                timestamp: firebase.firestore.FieldValue.serverTimestamp() // توثيق التاريخ والوقت دائم لكافة الفواتير
            };

            await db.collection("sales").add(invoicePayload);

            alert("✅ تم حفظ الفاتورة بنجاح والاحتفاظ بصورة البضاعة في النظام لمراجعتها في أي وقت!");
            
            // إعادة تعيين النموذج
            resetInvoiceForm();

        } catch (error) {
            console.error("حدث خطأ أثناء حفظ الفاتورة:", error);
            alert("❌ فشل حفظ الفاتورة، يرجى التحقق من اتصالك بالإنترنت وإعدادات Firebase.");
        }
    }

    // تصفير النموذج
    function resetInvoiceForm() {
        document.getElementById("customerSelect").value = "";
        document.querySelector("#invoiceTable tbody").innerHTML = "";
        document.getElementById("cargoImageInput").value = "";
        base64CargoImage = "";
        document.getElementById("imagePreviewContainer").style.display = "none";
        calculateInvoiceSummary();
    }
</script>

</body>
</html>
