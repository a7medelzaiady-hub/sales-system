<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فاتورة مبيعات - شركة الزيادي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --accent: #0b5e3d; 
            --accent-light: #128256;
            --header-bg: #0b5e3d;
            --bg-light: #f0f4f2;
            --text-primary: #1b2e26;
            --text-secondary: #5a6e65;
            --border: #e0e7e3;
            --white: #ffffff;
            --danger: #e63946;
            --success: #2d6a4f;
            --warning: #dfa100;
            --vodafone: #e60000;
            --radius-md: 16px;
            --radius-lg: 26px;
            --shadow-sm: 0 4px 12px rgba(11, 94, 61, 0.03);
            --shadow-md: 0 10px 30px rgba(11, 94, 61, 0.06);
        }
        
        body { background: var(--bg-light); font-family: 'Cairo', sans-serif; color: var(--text-primary); padding-bottom: 60px; }
        
        /* --- الملاحة العلوية --- */
        .header-nav { 
            background: linear-gradient(135deg, var(--header-bg), var(--accent-light)); 
            padding: 18px 20px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            box-shadow: 0 4px 20px rgba(11, 94, 61, 0.15); 
            color: white; 
            position: sticky; 
            top: 0; 
            z-index: 1000;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }

        /* --- الكارت الرئيسي للفاتورة --- */
        .invoice-card { 
            background: var(--white); 
            border: none; 
            border-radius: var(--radius-lg); 
            padding: 28px 24px; 
            margin-top: 25px; 
            box-shadow: var(--shadow-md); 
        }
        
        .section-title {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-control, .form-select { 
            border: 1px solid var(--border) !important; 
            border-radius: var(--radius-md); 
            font-size: 0.9rem; 
            font-weight: 700; 
            padding: 12px 15px; 
            background-color: #fafbfb !important;
            color: var(--text-primary) !important;
            transition: all 0.25s ease;
        }
        .form-control:focus, .form-select:focus { 
            border-color: var(--accent) !important; 
            background-color: var(--white) !important;
            box-shadow: 0 0 0 4px rgba(11, 94, 61, 0.1) !important; 
        }
        
        /* --- صفوف الأصناف المودرن --- */
        .product-row { 
            background: #fdfdfd; 
            border-radius: var(--radius-md); 
            padding: 20px; 
            margin-bottom: 20px; 
            border: 1px solid var(--border); 
            position: relative; 
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
        }
        .product-row:hover { 
            border-color: var(--accent-light); 
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(11, 94, 61, 0.05);
        }
        .btn-remove { 
            position: absolute; 
            left: -12px; 
            top: -12px; 
            color: var(--danger); 
            background: white; 
            border-radius: 50%; 
            font-size: 1.5rem; 
            cursor: pointer; 
            z-index: 10; 
            box-shadow: 0 3px 8px rgba(0,0,0,0.12); 
            transition: 0.2s;
        }
        .btn-remove:hover { transform: scale(1.1); color: #bd1f2d; }
        
        .search-results {
            position: absolute; width: 100%; background: white; border: 1px solid var(--border);
            border-radius: 12px; z-index: 100; max-height: 220px; overflow-y: auto;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08); display: none; margin-top: 5px;
        }
        .search-item { padding: 12px; cursor: pointer; border-bottom: 1px solid #f5f5f5; font-size: 0.9rem; color: var(--text-primary); transition: 0.2s; }
        .search-item:hover { background: #eef5f2; color: var(--accent); font-weight: 700; }

        #customerBalanceInfo {
            display: none;
            background: rgba(11, 94, 61, 0.06);
            border: 1px solid rgba(11, 94, 61, 0.15);
            color: var(--accent);
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.8rem;
            margin-top: 10px;
            font-weight: 700;
        }

        /* --- تصميم قسم السداد المطور الفخم --- */
        .payment-box-v2 { 
            background: #f7faf8; 
            border-radius: var(--radius-md); 
            padding: 22px; 
            margin: 25px 0; 
            border: 1px solid var(--border);
        }
        .pay-card {
            border-radius: var(--radius-md);
            padding: 16px;
            background: #ffffff;
            border: 1px solid var(--border);
            transition: all 0.25s ease;
            box-shadow: var(--shadow-sm);
        }
        .pay-card.cash-mode { border-top: 4px solid var(--accent); }
        .pay-card.vf-mode { border-top: 4px solid var(--vodafone); }
        .pay-card:focus-within { transform: translateY(-3px); box-shadow: 0 6px 15px rgba(0,0,0,0.04); }

        /* --- صندوق الإجماليات المودرن --- */
        .total-box { 
            background: linear-gradient(135deg, #143d2c, var(--accent)); 
            color: white; 
            border-radius: var(--radius-md); 
            padding: 22px; 
            text-align: center; 
            margin-top: 25px; 
            box-shadow: 0 8px 25px rgba(11, 94, 61, 0.2);
        }
        .total-box small { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .total-box span { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-weight: 800; }
        
        .btn-add-item {
            background: #ffffff;
            color: var(--accent);
            border: 2px dashed var(--accent);
            border-radius: var(--radius-md);
            padding: 12px;
            font-weight: 700;
            transition: 0.2s;
        }
        .btn-add-item:hover { background: var(--glass); color: var(--accent-light); border-color: var(--accent-light); }

        .btn-save { 
            background: linear-gradient(135deg, var(--accent), var(--accent-light)); 
            border: none; 
            border-radius: var(--radius-md); 
            padding: 16px; 
            width: 100%; 
            font-weight: 800; 
            color: white; 
            margin-top: 25px; 
            font-size: 1.05rem;
            box-shadow: 0 6px 18px rgba(11, 94, 61, 0.15);
            transition: 0.25s; 
        }
        .btn-save:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(11, 94, 61, 0.25); }
        
        .sub-lbl { font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 6px; display: block; font-weight: 700; }
        .unit-info-area { font-size: 0.78rem; margin-top: 8px; color: var(--accent-light); font-weight: 700; display: flex; align-items: center; gap: 4px; }
        
        .pay-badge {
            font-size: 0.75rem;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: var(--shadow-sm);
        }
        .badge-cash { background: #eef7f3; color: var(--accent); border: 1px solid rgba(11, 94, 61, 0.2); }
        .badge-vf { background: #ffebeb; color: var(--vodafone); border: 1px solid rgba(230, 0, 0, 0.2); }
    </style>
</head>
<body>
        
<div class="header-nav">
    <div class="d-flex align-items-center gap-3">
        <a href="javascript:void(0)" onclick="confirmBack()" class="text-white text-decoration-none fs-5">
            <i class="fas fa-arrow-right"></i>
        </a>
    </div>
    <h5 class="m-0 fw-bold">
        منظومة الفواتير 
        <span id="modeText" class="badge bg-white text-success ms-2" style="color:var(--accent)!important; font-size: 0.75rem; vertical-align: middle;">جديدة</span>
    </h5>
    <a href="index.html" class="text-white text-decoration-none fs-5">
        <i class="fas fa-home"></i>
    </a>
</div>

<div class="container">
    <div class="invoice-card">
        
        <!-- معلومات العميل والوقت -->
        <div class="row g-3 mb-4">
            <div class="col-md-7 position-relative">
                <label class="sub-lbl text-dark fw-bold"><i class="fas fa-user text-muted me-1"></i> اختيار عميل السند</label>
                <input type="text" id="customerSearch" class="form-control" placeholder="ابحث باسم العميل..." oninput="searchCustomer(this)" autocomplete="off">
                <input type="hidden" id="customerSelect" value="">
                <div id="customerResults" class="search-results"></div>
                <div id="customerBalanceInfo">
                    <i class="fas fa-wallet me-1"></i> الرصيد الفعلي الحالي للعميل: <span id="curBalanceVal">0.00</span> ج.م
                </div>
            </div>
            <div class="col-md-5">
                <label class="sub-lbl text-dark fw-bold"><i class="fas fa-calendar-alt text-muted me-1"></i> تاريخ ووقت تحرير الفاتورة</label>
                <input type="text" id="invTime" class="form-control" readonly>
            </div>
        </div>

        <div class="section-title"><i class="fas fa-cubes"></i> أصناف الفاتورة الحالية</div>
        <div id="itemsContainer"></div>

        <button class="btn btn-add-item w-100 mb-4" onclick="addNewRow()">
            <i class="fas fa-plus-circle me-1"></i> إضافة صنف جديد للفاتورة
        </button>

        <!-- قسم طرق السداد المالي (فودافون كاش + نقدي) -->
        <div class="payment-box-v2">
            <div class="section-title mb-3 text-dark"><i class="fas fa-wallet text-muted"></i> طرق السداد المالي المستلمة</div>
            <div class="row g-3">
                <div class="col-6">
                    <div class="pay-card cash-mode">
                        <label class="sub-lbl fw-bold text-success mb-2" style="font-size: 0.85rem;">
                            <i class="fas fa-money-bill-wave me-1"></i> سداد نقدي (كاش)
                        </label>
                        <input type="number" id="paidCash" class="form-control form-control-lg" value="0" min="0" oninput="handleInput()">
                    </div>
                </div>
                <div class="col-6">
                    <div class="pay-card vf-mode">
                        <label class="sub-lbl fw-bold mb-2" style="color: var(--vodafone); font-size: 0.85rem;">
                            <i class="fas fa-mobile-alt me-1"></i> فودافون كاش (VF)
                        </label>
                        <input type="number" id="paidVodafone" class="form-control form-control-lg" value="0" min="0" oninput="handleInput()">
                    </div>
                </div>
            </div>
            
            <div class="mt-3 d-flex gap-2 align-items-center" id="paymentBadgesArea">
                <small class="text-muted fw-bold" style="font-size: 0.75rem;">طريقة الدفع الحالية:</small>
                <span id="badgeCash" class="pay-badge badge-cash d-none"><i class="fas fa-money-bill"></i> نقدي</span>
                <span id="badgeVf" class="pay-badge badge-vf d-none"><i class="fas fa-phone-alt"></i> فودافون كاش</span>
            </div>
        </div>

        <!-- ملخص الحساب والإجمالي الإحترافي -->
        <div class="total-box">
            <div class="row align-items-center">
                <div class="col-4 border-end border-white border-opacity-25">
                    <small class="d-block opacity-75">إجمالي الفاتورة</small>
                    <span id="displayTotal" class="fw-bold text-white fs-4">0.00</span>
                </div>
                <div class="col-4 border-end border-white border-opacity-25">
                    <small class="d-block" style="color: #ffe699;">مجموع المدفوع</small>
                    <span id="displayPaid" class="fw-bold fs-4" style="color: #ffe699;">0.00</span>
                </div>
                <div class="col-4">
                    <small class="d-block opacity-75">المتبقي (آجل)</small>
                    <span id="displayRemaining" class="fw-bold text-white fs-4">0.00</span>
                </div>
            </div>
        </div>

        <button class="btn-save" onclick="saveInvoice()" id="saveBtn">حفظ وتحديث البيانات بالمنظومة</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, updateDoc, doc, getDoc, serverTimestamp, increment, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
        authDomain: "ahmedelzaiady.firebaseapp.com",
        projectId: "ahmedelzaiady",
        storageBucket: "ahmedelzaiady.firebasestorage.app",
        messagingSenderId: "300306825071",
        appId: "1:300306825071:web:0426ddde56280fa090329a",
        measurementId: "G-WE04GK5XZZ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let inventory = [];
    let customers = [];
    let editId = new URLSearchParams(window.location.search).get('edit');
    let isChanged = false;

    async function getRealBalance(customerId, initialBalance = 0) {
        try {
            const qInvoices = query(collection(db, "invoices"), where("customerId", "==", customerId));
            const snapInvoices = await getDocs(qInvoices);
            let invoiceDebt = 0;
            snapInvoices.forEach(doc => { invoiceDebt += (Number(doc.data().remaining) || 0); });

            const qTrans = query(collection(db, "transactions"), where("partyId", "==", customerId));
            const snapTrans = await getDocs(qTrans);
            let transEffect = 0;
            snapTrans.forEach(doc => {
                const tr = doc.data();
                if(tr.type === 'قبض') transEffect -= (Number(tr.amount) || 0);
                else if(tr.type === 'صرف') transEffect += (Number(tr.amount) || 0);
            });
            return Number(initialBalance) + invoiceDebt + transEffect;
        } catch (e) { return Number(initialBalance); }
    }

    window.addEventListener('beforeunload', (e) => {
        if (isChanged) { e.preventDefault(); e.returnValue = ''; }
    });

    window.confirmBack = () => {
        if (isChanged && !confirm("لديك بيانات غير محفوظة، هل تريد الخروج والرجوع للسجل؟")) return;
        window.location.href = "sales-history.html";
    };

    window.handleInput = () => { isChanged = true; calc(); };
    
    const CACHE_KEYS = {
        customers: "cache_customers",
        inventory: "cache_inventory"
    };

    async function init() {
        try {
            document.getElementById('invTime').value = new Date().toLocaleString('ar-EG');

            const cachedCustomers = localStorage.getItem(CACHE_KEYS.customers);
            const cachedInventory = localStorage.getItem(CACHE_KEYS.inventory);

            if (cachedCustomers) customers = JSON.parse(cachedCustomers);
            if (cachedInventory) inventory = JSON.parse(cachedInventory);

            if (!editId) addNewRow();
            calc();

            const [cSnap, iSnap] = await Promise.all([
                getDocs(collection(db, "customers")),
                getDocs(collection(db, "inventory"))
            ]);

            customers = cSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            inventory = iSnap.docs.map(d => ({ id: d.id, ...d.data() }));

            localStorage.setItem(CACHE_KEYS.customers, JSON.stringify(customers));
            localStorage.setItem(CACHE_KEYS.inventory, JSON.stringify(inventory));

            if (editId) {
                document.getElementById('modeText').innerText = "تعديل";

                const invDoc = await getDoc(doc(db, "invoices", editId));
                if (invDoc.exists()) {
                    const data = invDoc.data();

                    document.getElementById('customerSelect').value = data.customerId;
                    document.getElementById('customerSearch').value = data.customerName;
                    document.getElementById('invTime').value = data.time;
                    
                    document.getElementById('paidCash').value = data.paidCash || 0;
                    document.getElementById('paidVodafone').value = data.paidVodafone || 0;

                    const cust = customers.find(c => c.id === data.customerId);
                    if (cust) {
                        const realB = await getRealBalance(cust.id, cust.initialBalance || 0);
                        showBalance(realB);
                    }

                    document.getElementById("itemsContainer").innerHTML = "";
                    data.items?.forEach(item => addNewRow(item));
                }
                isChanged = false;
                calc();
            }
        } catch (e) {
            console.error(e);
        }
    }

    window.searchCustomer = (input) => {
        const term = input.value.toLowerCase().trim();
        const resultsDiv = document.getElementById('customerResults');
        const balanceDiv = document.getElementById('customerBalanceInfo');
        
        if (term.length < 1) { 
            resultsDiv.style.display = 'none'; 
            balanceDiv.style.display = 'none';
            return; 
        }

        const filtered = customers.filter(c => c.name.toLowerCase().startsWith(term));
        
        resultsDiv.innerHTML = filtered.map(c => `
            <div class="search-item" onclick="selectCustomer('${c.id}', '${c.name}', ${c.initialBalance || 0})">
                <b>${c.name}</b>
                <span style="font-size:0.7rem; color:#666; display:block;">رصيد أول المدة: ${c.initialBalance || 0}</span>
            </div>
        `).join('');
        resultsDiv.style.display = filtered.length > 0 ? 'block' : 'none';
    };

    window.selectCustomer = async (id, name, initialBalance) => {
        document.getElementById('customerSearch').value = name;
        document.getElementById('customerSelect').value = id;
        document.getElementById('customerResults').style.display = 'none';
        
        const balanceDiv = document.getElementById('customerBalanceInfo');
        const balanceSpan = document.getElementById('curBalanceVal');
        balanceDiv.style.display = 'block';
        balanceSpan.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الحساب...';

        const realDebt = await getRealBalance(id, initialBalance);
        showBalance(realDebt);
        isChanged = true;
    };

    function showBalance(balance) {
        const balanceDiv = document.getElementById('customerBalanceInfo');
        document.getElementById('curBalanceVal').innerText = parseFloat(balance).toFixed(2);
        balanceDiv.style.display = 'block';
    }

    window.searchProduct = (input) => {
        const term = input.value.toLowerCase().trim();
        const resultsDiv = input.parentElement.querySelector('.search-results');
        if (term.length < 1) { resultsDiv.style.display = 'none'; return; }
        const filtered = inventory.filter(i => i.name.toLowerCase().startsWith(term)).slice(0, 10);
        resultsDiv.innerHTML = filtered.map(p => `
            <div class="search-item" onclick="selectProduct('${input.closest('.product-row').id}', '${p.id}', '${p.name}')">
                <b>${p.name}</b> <span class="badge bg-secondary ms-2" style="font-size:0.65rem;">المخزن: ${p.totalPcs} ق</span>
            </div>`).join('');
        resultsDiv.style.display = filtered.length > 0 ? 'block' : 'none';
    };

    window.selectProduct = (rowId, pid, pname) => {
        const row = document.getElementById(rowId);
        row.querySelector('.p-search').value = pname;
        row.querySelector('.p-select').value = pid;
        row.querySelector('.search-results').style.display = 'none';
        const p = inventory.find(i => i.id === pid);
        if(p) {
            row.querySelector('.unit-info-area').innerHTML = `<i class="fas fa-warehouse me-1"></i> رصيد المخزن الحالي: ${p.totalPcs} قطعة`;
            updateRowPrice(row.querySelector('.p-unit'));
        }
        isChanged = true;
    };

    window.addNewRow = (oldData = null) => {
        const id = 'row_' + Math.random().toString(36).substr(2, 5);
        const html = `
            <div class="product-row" id="${id}">
                <i class="fas fa-times-circle btn-remove" onclick="document.getElementById('${id}').remove(); handleInput();"></i>
                <div class="row g-2 mb-2">
                    <div class="col-7 position-relative">
                        <span class="sub-lbl">اسم الصنف</span>
                        <input type="text" class="form-control p-search" placeholder="ابحث عن صنف..." oninput="searchProduct(this)" value="${oldData ? oldData.name : ''}" autocomplete="off">
                        <input type="hidden" class="p-select" value="${oldData ? oldData.stockId : ''}">
                        <div class="search-results"></div>
                    </div>
                    <div class="col-5">
                        <span class="sub-lbl">الوحدة بيع</span>
                        <select class="form-select p-unit" onchange="updateRowPrice(this); handleInput();">
                            <option value="box" ${oldData?.unit === 'box' ? 'selected' : ''}>كرتونة</option>
                            <option value="pcs" ${oldData?.unit === 'pcs' ? 'selected' : ''}>قطعة</option>
                        </select>
                    </div>
                </div>
                <div class="row g-2">
                    <div class="col-4"><span class="sub-lbl">الكمية</span><input type="number" class="form-control p-qty" value="${oldData ? oldData.qty : 1}" oninput="handleInput()"></div>
                    <div class="col-4"><span class="sub-lbl">سعر الوحدة</span><input type="number" class="form-control p-price" value="${oldData ? oldData.price : ''}" oninput="handleInput()"></div>
                    <div class="col-4"><span class="sub-lbl">إجمالي الصنف</span><input type="text" class="form-control p-subtotal" readonly value="0.00" style="background:#eef2f0!important; border-color:#c8d4ce!important;"></div>
                </div>
                <div class="unit-info-area"></div>
            </div>`;
        document.getElementById('itemsContainer').insertAdjacentHTML('beforeend', html);
        if(!oldData) isChanged = true;
        return id;
    };

    window.updateRowPrice = (unitSel) => {
        const row = unitSel.closest('.product-row');
        const p = inventory.find(i => i.id === row.querySelector('.p-select').value);
        if(p) {
            const price = (unitSel.value === 'box') ? (p.sell || 0) : ((p.sell || 0) / (p.unitFactor || 1));
            row.querySelector('.p-price').value = Number(price).toFixed(2);
            calc();
        }
    };

    window.calc = () => {
        let total = 0;
        document.querySelectorAll('.product-row').forEach(r => {
            const qty = parseFloat(r.querySelector('.p-qty').value) || 0;
            const price = parseFloat(r.querySelector('.p-price').value) || 0;
            const sub = qty * price;
            r.querySelector('.p-subtotal').value = sub.toFixed(2);
            total += sub;
        });

        const paidCash = parseFloat(document.getElementById('paidCash').value) || 0;
        const paidVodafone = parseFloat(document.getElementById('paidVodafone').value) || 0;
        const totalPaid = paidCash + paidVodafone;

        document.getElementById('badgeCash').classList.toggle('d-none', paidCash <= 0);
        document.getElementById('badgeVf').classList.toggle('d-none', paidVodafone <= 0);

        document.getElementById('displayTotal').innerText = total.toLocaleString('en-US', {minimumFractionDigits: 2});
        document.getElementById('displayPaid').innerText = totalPaid.toLocaleString('en-US', {minimumFractionDigits: 2});
        document.getElementById('displayRemaining').innerText = (total - totalPaid).toLocaleString('en-US', {minimumFractionDigits: 2});
        
        return { total, paid: totalPaid, paidCash, paidVodafone, remaining: total - totalPaid };
    };

    window.saveInvoice = async () => {
        const saveBtn = document.getElementById('saveBtn');

        try {
            const { total, paid, paidCash, paidVodafone, remaining } = calc();
            const customerId = document.getElementById('customerSelect').value;
            const customerName = document.getElementById('customerSearch').value;

            if (!customerId || !customerName) return alert("الرجاء اختيار العميل أولاً");

            const items = [];
            document.querySelectorAll('.product-row').forEach(r => {
                const pid = r.querySelector('.p-select')?.value;
                const name = r.querySelector('.p-search')?.value;
                const unit = r.querySelector('.p-unit')?.value;
                const qty = Number(r.querySelector('.p-qty')?.value || 0);
                const price = Number(r.querySelector('.p-price')?.value || 0);
                if (!pid || qty <= 0) return;
                items.push({ stockId: pid, name, unit, qty, price });
            });

            if (items.length === 0) return alert("الرجاء إضافة أصناف للفاتورة");

            saveBtn.disabled = true;
            saveBtn.innerText = "جاري الحفظ الفعلي المعاملة...";

            let paymentMethodText = "آجل";
            if (paidCash > 0 && paidVodafone > 0) paymentMethodText = "نقدي + فودافون كاش";
            else if (paidCash > 0) paymentMethodText = "نقدي";
            else if (paidVodafone > 0) paymentMethodText = "فودافون كاش";

            const invoiceData = {
                customerId, customerName, total, paid, paidCash, paidVodafone, remaining,
                paymentMethod: paymentMethodText, time: document.getElementById('invTime').value,
                timestamp: serverTimestamp(), items
            };

            if (!editId) {
                for (const item of items) {
                    const p = inventory.find(i => i.id === item.stockId);
                    const qtyPcs = item.unit === 'box' ? item.qty * (p.unitFactor || 1) : item.qty;
                    await updateDoc(doc(db, "inventory", item.stockId), { totalPcs: increment(-qtyPcs) });
                }
                await addDoc(collection(db, "invoices"), invoiceData);
            } else {
                const oldRef = doc(db, "invoices", editId);
                const oldSnap = await getDoc(oldRef);
                if (oldSnap.exists()) {
                    const oldData = oldSnap.data();
                    if (oldData.items) {
                        for (const item of oldData.items) {
                            const p = inventory.find(i => i.id === item.stockId);
                            const qtyBack = item.unit === 'box' ? item.qty * (p.unitFactor || 1) : item.qty;
                            await updateDoc(doc(db, "inventory", item.stockId), { totalPcs: increment(qtyBack) });
                        }
                    }
                    for (const item of items) {
                        const p = inventory.find(i => i.id === item.stockId);
                        const qtyMinus = item.unit === 'box' ? item.qty * (p.unitFactor || 1) : item.qty;
                        await updateDoc(doc(db, "inventory", item.stockId), { totalPcs: increment(-qtyMinus) });
                    }
                }
                await updateDoc(oldRef, invoiceData);
            }

            isChanged = false;
            alert("تم حفظ الفاتورة بنجاح بالتصميم الجديد");
            window.location.href = "sales-history.html";
        } catch (e) {
            alert("خطأ: " + e.message);
            saveBtn.disabled = false;
            saveBtn.innerText = "حفظ وتحديث البيانات بالمنظومة";
        }
    };

    init();
</script>
</body>
</html>
