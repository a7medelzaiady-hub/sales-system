<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل المبيعات - شركة الزيادي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --accent: #0b5e3d;        
            --header-bg: #0b5e3d;     
            --bg-light: #f4f7f6;      
            --text-primary: #1b2e26;   
            --border: #dce3de;        
            --white: #ffffff;
            --danger: #d90429;
            --card-radius: 16px;
        }
        
        body { 
            background: var(--bg-light); 
            font-family: 'Cairo', sans-serif; 
            color: var(--text-primary); 
        }

        .header-nav { 
            background: var(--header-bg); 
            padding: 12px 20px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); 
            color: white;
        }

        .add-btn { background: rgba(255,255,255,0.2); width: 35px; height: 35px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; text-decoration: none; }
        
        .history-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--card-radius);
            padding: 15px;
            margin-top: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.02);
            transition: all 0.2s;
        }

        .badge-method {
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 8px;
            font-weight: 700;
        }

        .search-box {
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 10px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="header-nav">
    <a href="index.html" class="add-btn"><i class="fas fa-arrow-right"></i></a>
    <h6 class="m-0 fw-bold"><i class="fas fa-history me-1"></i> سجل الفواتير والمبيعات</h6>
    <a href="sales-invoice.html" class="add-btn"><i class="fas fa-plus"></i></a>
</div>

<div class="container px-2 mt-3">
    <!-- خانة البحث لتسهيل الوصول -->
    <input type="text" id="searchInput" class="form-control search-box mb-3" placeholder="ابحث باسم العميل..." oninput="filterInvoices()">

    <!-- مكان عرض الفواتير المجلوبة -->
    <div id="invoicesContainer">
        <div class="text-center p-5 text-muted">
            <i class="fas fa-spinner fa-spin fa-2x mb-2"></i>
            <p>جاري تحميل سجل الفواتير...</p>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
        authDomain: "ahmedelzaiady.firebaseapp.com",
        projectId: "ahmedelzaiady",
        storageBucket: "ahmedelzaiady.firebasestorage.app",
        messagingSenderId: "300306825071",
        appId: "1:300306825071:web:0426ddde56280fa090329a",
        measurementId: "G-WE04GK5XZZ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let allInvoices = [];

    async function loadInvoices() {
        try {
            const q = query(collection(db, "invoices"), orderBy("timestamp", "desc"));
            const snapshot = await getDocs(q);
            allInvoices = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
            renderInvoices(allInvoices);
        } catch (e) {
            console.error(e);
            document.getElementById('invoicesContainer').innerHTML = `<div class="alert alert-danger text-center">حدث خطأ أثناء تحميل البيانات</div>`;
        }
    }

    function renderInvoices(invoicesList) {
        const container = document.getElementById('invoicesContainer');
        if (invoicesList.length === 0) {
            container.innerHTML = `<div class="text-center p-5 text-muted">لا توجد فواتير مسجلة حالياً</div>`;
            return;
        }

        container.innerHTML = invoicesList.map(inv => {
            // تحديد لون شارة طريقة السداد
            let badgeClass = "bg-secondary";
            if (inv.paymentMethod?.includes("نقدي") || inv.paymentMethod?.includes("كاش")) badgeClass = "bg-success";
            else if (inv.paymentMethod?.includes("محفظة")) badgeClass = "bg-purple text-white";
            else if (inv.paymentMethod === "آجل") badgeClass = "bg-danger";

            // حساب الخصم النقدي إذا وجد
            const discountVal = Number(inv.discount) || 0;
            const discountBadge = discountVal > 0 
                ? `<span class="badge bg-danger-subtle text-danger fw-bold ms-2" style="font-size:0.75rem;"><i class="fas fa-percentage"></i> تم خصم: ${discountVal.toFixed(2)} ج.م</span>` 
                : `<span class="text-muted opacity-50 ms-2" style="font-size:0.75rem;">لا يوجد خصم</span>`;

            return `
                <div class="history-card">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <div>
                            <h6 class="fw-bold mb-1" style="font-size: 0.95rem; color: var(--accent);">${inv.customerName || 'عميل نقدي'}</h6>
                            <small class="text-muted d-block" style="font-size: 0.72rem; direction: ltr; text-align: right;">${inv.time || ''}</small>
                        </div>
                        <span class="badge-method ${badgeClass} text-white">${inv.paymentMethod || 'غير محدد'}</span>
                    </div>

                    <hr class="my-2 opacity-25">

                    <!-- تفاصيل المبالغ المالية مع إبراز الخصم النقدي طلبك -->
                    <div class="row g-1 text-center" style="font-size: 0.8rem; font-weight: 700;">
                        <div class="col-3 border-end">
                            <span class="text-muted d-block" style="font-size:0.65rem;">الصافي</span>
                            <span class="text-dark">${(Number(inv.total) || 0).toFixed(2)}</span>
                        </div>
                        <div class="col-3 border-end">
                            <span class="text-danger d-block" style="font-size:0.65rem;">الخصم النقدي</span>
                            <span class="text-danger">${discountVal > 0 ? '-' + discountVal.toFixed(2) : '0.00'}</span>
                        </div>
                        <div class="col-3 border-end">
                            <span class="text-success d-block" style="font-size:0.65rem;">المدفوع</span>
                            <span class="text-success">${(Number(inv.paid) || 0).toFixed(2)}</span>
                        </div>
                        <div class="col-3">
                            <span class="text-warning d-block" style="font-size:0.65rem;">المتبقي</span>
                            <span class="text-warning">${(Number(inv.remaining) || 0).toFixed(2)}</span>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top border-light">
                        <div>
                            ${discountBadge}
                        </div>
                        <div class="d-flex gap-2">
                            <a href="sales-invoice.html?edit=${inv.id}" class="btn btn-sm btn-outline-primary px-3" style="border-radius:8px; font-size:0.75rem;">
                                <i class="fas fa-edit me-1"></i> تعديل
                            </a>
                            <button onclick="deleteInvoice('${inv.id}')" class="btn btn-sm btn-outline-danger" style="border-radius:8px; font-size:0.75rem;">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    window.filterInvoices = () => {
        const term = document.getElementById('searchInput').value.toLowerCase().trim();
        if(!term) {
            renderInvoices(allInvoices);
            return;
        }
        const filtered = allInvoices.filter(inv => inv.customerName?.toLowerCase().includes(term));
        renderInvoices(filtered);
    };

    window.deleteInvoice = async (id) => {
        if(!confirm("هل أنت متأكد من حذف هذه الفاتورة نهائياً؟ سيتم إلغاء تأثيرها على المخزن وحساب العميل.")) return;
        try {
            await deleteDoc(doc(db, "invoices", id));
            alert("تم حذف الفاتورة بنجاح");
            loadInvoices();
        } catch (e) {
            alert("فشل الحذف: " + e.message);
        }
    };

    loadInvoices();
</script>
</body>
</html>
