<!DOCTYPE html>  
<html lang="ar" dir="rtl">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>فاتورة مبيعات - شركة الزيادي</title>  
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">  
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">  
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">  
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>  
    <style>  
        :root {   
            --accent: #800020;          
            --header-bg: #4a0012;       
            --bg-light: #fdf8f9;        
            --text-primary: #2b000b;     
            --text-secondary: #75525b;   
            --border: #ebdce0;          
            --white: #ffffff;  
            --danger: #e63946;  
            --success: #2a9d8f;  
            --warning: #ffb703;         
            --card-radius: 20px;  
            --input-radius: 14px;  
        }  
        
        body {   
            background: var(--bg-light);   
            font-family: 'Cairo', sans-serif;   
            color: var(--text-primary);   
            padding-bottom: 80px;   
            -webkit-tap-highlight-color: transparent;  
        }  

        .header-nav {   
            background: var(--header-bg);   
            padding: 18px 20px;   
            display: flex;   
            align-items: center;   
            justify-content: space-between;   
            box-shadow: 0 4px 12px rgba(74,0,18,0.15);   
            color: white;   
            position: sticky;   
            top: 0;   
            z-index: 1000;  
            border-bottom-left-radius: 15px;  
            border-bottom-right-radius: 15px;  
        }  
          
        .invoice-card {   
            background: var(--white);   
            border: none;   
            border-radius: var(--card-radius);   
            padding: 22px 18px;
            box-shadow: 0 8px 24px rgba(74,0,18,0.05);
            margin-top: 20px;
        }

        .payment-box {
            background-color: #fcf6f7;
            border: 1px solid var(--border);
            border-radius: var(--input-radius);
            padding: 15px;
        }
    </style>
</head>
<body>

    <header class="header-nav">
        <h5 class="m-0"><i class="fa-solid fa-file-invoice-dollar me-2"></i> شركة الزيادي للمبيعات</h5>
        <span id="invoice-date"></span>
    </header>

    <div class="container">
        <div class="invoice-card" id="invoice-content">
            <!-- قسم تفاصيل الفاتورة التجريبية -->
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label fw-bold">إجمالي الفاتورة (جنية)</label>
                    <input type="number" id="total-amount" class="form-control" value="1500" readonly style="background-color: #e9ecef;">
                </div>
            </div>

            <!-- قسم طرق السداد المضاف حديثاً -->
            <div class="payment-box my-4">
                <h6 class="fw-bold mb-3 text-dark"><i class="fa-solid fa-wallet me-2 text-danger"></i> تفاصيل السداد وطرق الدفع</h6>
                <div class="row g-3">
                    <div class="col-6 col-md-3">
                        <label for="cash-payment" class="form-label text-secondary small fw-bold">سداد نقدي (كاش)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="fa-solid fa-money-bill-wave text-success"></i></span>
                            <input type="number" id="cash-payment" class="form-control" value="0" min="0" oninput="calculateBalance()">
                        </div>
                    </div>
                    
                    <div class="col-6 col-md-3">
                        <label for="wallet-payment" class="form-label text-secondary small fw-bold">سداد محفظة (إلكتروني)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="fa-solid fa-mobile-screen text-primary"></i></span>
                            <input type="number" id="wallet-payment" class="form-control" value="0" min="0" oninput="calculateBalance()">
                        </div>
                    </div>

                    <div class="col-6 col-md-3">
                        <label class="form-label text-secondary small fw-bold">إجمالي المدفوع</label>
                        <input type="number" id="total-paid" class="form-control fw-bold text-success" value="0" readonly style="background-color: #f1f3f5;">
                    </div>

                    <div class="col-6 col-md-3">
                        <label class="form-label text-secondary small fw-bold">المتبقي / الباقي</label>
                        <input type="number" id="remaining-amount" class="form-control fw-bold text-danger" value="1500" readonly style="background-color: #f1f3f5;">
                    </div>
                </div>
            </div>
            
            <!-- زر حفظ الفاتورة كصورة للتجربة -->
            <div class="text-center mt-3">
                <button class="btn btn-danger px-4 py-2" style="border-radius: var(--input-radius);" onclick="saveInvoice()">
                    <i class="fa-solid fa-download me-2"></i> حفظ الفاتورة كصورة
                </button>
            </div>
        </div>
    </div>

    <script>
        // تعيين تاريخ اليوم تلقائياً
        document.getElementById('invoice-date').innerText = new Date().toLocaleDateString('ar-EG');

        // دالة حساب المدفوع والمتبقي تلقائياً عند إدخال مبالغ السداد
        function calculateBalance() {
            const totalAmount = parseFloat(document.getElementById('total-amount').value) || 0;
            const cashPaid = parseFloat(document.getElementById('cash-payment').value) || 0;
            const walletPaid = parseFloat(document.getElementById('wallet-payment').value) || 0;

            // حساب إجمالي المدفوع من الخانتين
            const totalPaid = cashPaid + walletPaid;
            document.getElementById('total-paid').value = totalPaid;

            // حساب المبلغ المتبقي
            const remaining = totalAmount - totalPaid;
            document.getElementById('remaining-amount').value = remaining;
        }

        // دالة حفظ الفاتورة كصورة باستخدام مكتبة html2canvas
        function saveInvoice() {
            const element = document.getElementById('invoice-content');
            html2canvas(element, { scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'فاتورة_شركة_الزيادي.png';
                link.href = canvas.toDataURL();
                link.click();
            });
        }
    </script>
</body>
</html>
