<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>فاتورة مبيعات - الزيادي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
  --green:    #0b5e3d;
  --green-lt: #128256;
  --gold:     #dfa100;
  --bg:       #f0f4f1;
  --white:    #ffffff;
  --border:   #d1ddd5;
  --text:     #1a2e22;
  --muted:    #6b8574;
  --danger:   #dc2626;
  --radius:   10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:'Cairo',sans-serif;color:var(--text);min-height:100vh}

/* OFFLINE BANNER */
#offlineBanner{
  display:none;position:fixed;top:0;left:0;right:0;z-index:9999;
  background:#92400e;color:#fef3c7;padding:8px 16px;
  text-align:center;font-size:.8rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
#offlineBanner.hidden{display:none!important}

/* PENDING BADGE */
#pendingBadge{
  display:none;position:fixed;bottom:80px;left:16px;z-index:999;
  background:#92400e;color:#fef3c7;padding:8px 14px;border-radius:20px;
  font-size:.78rem;font-weight:700;cursor:pointer;
  box-shadow:0 4px 12px rgba(0,0,0,.3);
  align-items:center;gap:6px;
}

/* HEADER */
.header{
  background:var(--green);color:#fff;
  padding:12px 16px;display:flex;align-items:center;
  justify-content:space-between;position:sticky;top:0;z-index:100;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
}
.header h1{font-size:1rem;font-weight:800}
.header-actions{display:flex;gap:8px;align-items:center}
.sync-status{font-size:.72rem;background:rgba(255,255,255,.15);
  padding:4px 10px;border-radius:20px;display:flex;align-items:center;gap:5px}
.sync-dot{width:6px;height:6px;border-radius:50%;background:#4ade80}
.sync-dot.offline{background:#fbbf24;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* CARD */
.card{background:var(--white);border-radius:var(--radius);
  border:1px solid var(--border);margin:12px;padding:14px;
  box-shadow:0 1px 4px rgba(0,0,0,.06)}
.card-title{font-size:.82rem;font-weight:800;color:var(--green);
  margin-bottom:10px;display:flex;align-items:center;gap:6px;
  padding-bottom:8px;border-bottom:1px solid var(--border)}

/* INPUTS */
.form-group{margin-bottom:10px}
label{font-size:.75rem;font-weight:700;color:var(--muted);display:block;margin-bottom:4px}
.form-control{
  width:100%;padding:10px 12px;border:1px solid var(--border);
  border-radius:var(--radius);font-family:'Cairo',sans-serif;
  font-size:.85rem;background:#fff;color:var(--text);
  transition:border-color .2s;
}
.form-control:focus{outline:none;border-color:var(--green)}

/* SEARCH BOX */
.search-wrapper{position:relative}
.search-results{
  position:absolute;top:100%;right:0;left:0;z-index:200;
  background:#fff;border:1px solid var(--border);border-radius:var(--radius);
  max-height:200px;overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.12);
  display:none;
}
.search-item{padding:10px 12px;cursor:pointer;font-size:.82rem;border-bottom:1px solid #f0f4f1}
.search-item:hover{background:#f0fdf4}
.search-item:last-child{border-bottom:none}

/* BALANCE */
.balance-box{
  background:#f0fdf4;border:1px solid #bbf7d0;border-radius:var(--radius);
  padding:10px 12px;font-size:.82rem;font-weight:700;color:#166534;
  margin-top:6px;display:none;
}
.balance-box.debt{background:#fff7ed;border-color:#fed7aa;color:#9a3412}

/* PRODUCT ROW */
.product-row{
  background:#f8faf9;border:1px solid var(--border);
  border-radius:var(--radius);padding:10px;margin-bottom:8px;
  position:relative;
}
.product-row .del-row{
  position:absolute;left:8px;top:8px;background:#fee2e2;
  border:none;color:var(--danger);width:26px;height:26px;
  border-radius:6px;cursor:pointer;font-size:.8rem;
  display:flex;align-items:center;justify-content:center;
}
.row-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}

/* TOTALS */
.totals-box{background:#f8faf9;border-radius:var(--radius);padding:12px}
.total-row{display:flex;justify-content:space-between;
  padding:5px 0;font-size:.82rem;border-bottom:1px solid #e8f0eb}
.total-row:last-child{border-bottom:none;font-size:1rem;font-weight:800;color:var(--green)}
.total-label{color:var(--muted)}

/* PAYMENT */
.payment-tabs{display:flex;gap:6px;margin-bottom:10px}
.ptab{
  flex:1;padding:8px;border:1.5px solid var(--border);border-radius:var(--radius);
  background:#fff;font-family:'Cairo',sans-serif;font-size:.78rem;font-weight:700;
  cursor:pointer;text-align:center;transition:all .2s;
}
.ptab.active{background:var(--green);color:#fff;border-color:var(--green)}

/* BUTTONS */
.btn{
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:12px;border-radius:var(--radius);font-family:'Cairo',sans-serif;
  font-size:.88rem;font-weight:800;cursor:pointer;border:none;
  transition:all .2s;width:100%;
}
.btn-primary{background:linear-gradient(135deg,var(--green),var(--green-lt));color:#fff}
.btn-primary:hover{opacity:.9}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-outline{background:#fff;border:1.5px solid var(--green);color:var(--green)}
.btn-gold{background:linear-gradient(135deg,var(--gold),#f5b800);color:#1a0f00}
.btn-danger{background:#fee2e2;color:var(--danger);border:1px solid #fca5a5}
.btn-sm{padding:7px 12px;font-size:.78rem;width:auto}

.btns-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 12px 12px}
.btn-save-full{margin:0 12px 8px}

/* OFFLINE QUEUE MODAL */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;
  display:none;align-items:flex-end;
}
.modal-overlay.show{display:flex}
.modal-box{
  background:#fff;border-radius:16px 16px 0 0;width:100%;
  max-height:70vh;overflow-y:auto;padding:16px;
}
.modal-title{font-size:.9rem;font-weight:800;margin-bottom:12px;
  display:flex;justify-content:space-between;align-items:center}
.queue-item{
  background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;
  padding:10px;margin-bottom:8px;font-size:.78rem;
}
.queue-item-header{display:flex;justify-content:space-between;font-weight:700;margin-bottom:4px}

/* RECEIPT */
#receiptArea{display:none}
@media print {
  body > *{display:none}
  #receiptArea{display:block!important}
  .receipt{width:76mm;font-family:'Cairo',monospace;font-size:11px;padding:4mm}
  .receipt-center{text-align:center}
  .receipt-line{border-top:1px dashed #000;margin:4px 0}
  .receipt-row{display:flex;justify-content:space-between;margin:2px 0}
}
</style>
</head>
<body>

<!-- OFFLINE BANNER -->
<div id="offlineBanner" class="hidden">
  <i class="fas fa-wifi-slash"></i>
  أنت غير متصل — الفاتورة ستُحفظ وتُرسل تلقائياً عند عودة النت
  <span id="pendingCount"></span>
</div>

<!-- HEADER -->
<div class="header">
  <div style="display:flex;align-items:center;gap:10px">
    <a href="index.html" style="color:#fff;text-decoration:none"><i class="fas fa-arrow-right"></i></a>
    <h1>فاتورة مبيعات</h1>
  </div>
  <div class="header-actions">
    <div class="sync-status">
      <div class="sync-dot" id="syncDot"></div>
      <span id="syncLabel">متصل</span>
    </div>
  </div>
</div>

<!-- CUSTOMER -->
<div class="card">
  <div class="card-title"><i class="fas fa-user"></i>بيانات العميل</div>
  <div class="form-group">
    <label>اسم العميل</label>
    <div class="search-wrapper">
      <input type="text" id="customerSearch" class="form-control"
        placeholder="ابحث عن عميل أو اكتب 'نقدي'..."
        oninput="searchCustomer(this)" autocomplete="off">
      <div class="search-results" id="customerResults"></div>
    </div>
    <input type="hidden" id="customerId">
    <input type="hidden" id="customerInitialBalance" value="0">
  </div>
  <div class="balance-box" id="balanceBox"></div>
  <div class="form-group" style="margin-top:10px">
    <label>وقت الفاتورة</label>
    <input type="text" id="invTime" class="form-control" readonly>
  </div>
</div>

<!-- PRODUCTS -->
<div class="card">
  <div class="card-title"><i class="fas fa-boxes-stacked"></i>الأصناف</div>
  <div id="itemsContainer"></div>
  <button class="btn btn-outline btn-sm" onclick="addNewRow()" style="margin-top:4px">
    <i class="fas fa-plus"></i>إضافة صنف
  </button>
</div>

<!-- TOTALS -->
<div class="card">
  <div class="card-title"><i class="fas fa-calculator"></i>الإجماليات</div>
  <div class="totals-box">
    <div class="total-row"><span class="total-label">مجموع الأصناف</span><span id="t-items">0.00</span></div>
    <div class="total-row"><span class="total-label">الخصم</span>
      <span><input type="number" id="discountAmount" class="form-control"
        style="width:90px;padding:4px 8px;text-align:center" value="0" min="0" oninput="calc()"></span>
    </div>
    <div class="total-row"><span>الإجمالي النهائي</span><span id="t-total" style="color:var(--green)">0.00 ج.م</span></div>
  </div>
</div>

<!-- PAYMENT -->
<div class="card">
  <div class="card-title"><i class="fas fa-money-bill-wave"></i>طريقة الدفع</div>
  <div class="payment-tabs">
    <button class="ptab active" onclick="setPayMethod('cash',this)">نقدي</button>
    <button class="ptab" onclick="setPayMethod('wallet',this)">محفظة</button>
    <button class="ptab" onclick="setPayMethod('agel',this)">آجل</button>
    <button class="ptab" onclick="setPayMethod('mixed',this)">مختلط</button>
  </div>
  <div id="payFields">
    <div class="form-group">
      <label>المبلغ المدفوع</label>
      <input type="number" id="cashAmount" class="form-control" value="0" min="0" oninput="calc()">
    </div>
  </div>
  <div class="totals-box" style="margin-top:10px">
    <div class="total-row"><span class="total-label">المدفوع</span><span id="t-paid" style="color:#16a34a">0.00</span></div>
    <div class="total-row"><span class="total-label">المتبقي</span><span id="t-rem" style="color:#dc2626">0.00</span></div>
  </div>
  <div class="form-group" style="margin-top:10px">
    <label>ملاحظات</label>
    <input type="text" id="invNotes" class="form-control" placeholder="ملاحظات اختيارية...">
  </div>
</div>

<!-- SAVE BUTTONS -->
<div class="btn-save-full">
  <button class="btn btn-primary" id="saveBtn" onclick="saveInvoice()">
    <i class="fas fa-save"></i>حفظ الفاتورة
  </button>
</div>
<div class="btns-row">
  <button class="btn btn-gold" id="printBtn" onclick="printReceipt()" disabled>
    <i class="fas fa-print"></i>طباعة
  </button>
  <button class="btn btn-danger" onclick="resetForm()">
    <i class="fas fa-rotate-left"></i>إعادة تعيين
  </button>
</div>

<!-- PENDING QUEUE BADGE -->
<div id="pendingBadge" onclick="showQueueModal()">
  <i class="fas fa-clock"></i>
  <span id="pendingBadgeText">0 فاتورة معلقة</span>
</div>

<!-- QUEUE MODAL -->
<div class="modal-overlay" id="queueModal" onclick="hideQueueModal(event)">
  <div class="modal-box">
    <div class="modal-title">
      <span><i class="fas fa-clock" style="color:#d97706"></i> الفواتير المعلقة</span>
      <button onclick="hideQueueModal()" style="background:none;border:none;font-size:1.2rem;cursor:pointer">✕</button>
    </div>
    <p style="font-size:.78rem;color:#6b7280;margin-bottom:10px">
      هذه الفواتير محفوظة على جهازك وستُرسل تلقائياً عند اتصال النت.
    </p>
    <div id="queueList"></div>
    <button class="btn btn-primary btn-sm" onclick="syncNow()" style="margin-top:8px;width:auto;padding:8px 20px">
      <i class="fas fa-sync"></i>مزامنة الآن
    </button>
  </div>
</div>

<!-- RECEIPT (للطباعة) -->
<div id="receiptArea"></div>

<script type="module">
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  initializeFirestore, persistentLocalCache,
  collection, getDocs, addDoc, updateDoc, doc, getDoc,
  serverTimestamp, increment, query, orderBy
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* ── FIREBASE ── */
const firebaseConfig = {
  apiKey:"AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
  authDomain:"ahmedelzaiady.firebaseapp.com",
  projectId:"ahmedelzaiady",
  storageBucket:"ahmedelzaiady.firebasestorage.app",
  messagingSenderId:"300306825071",
  appId:"1:300306825071:web:0426ddde56280fa090329a"
};
// FIX: منع double init
const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
// FIX: persistentLocalCache لحفظ البيانات offline
const db = initializeFirestore(app, { localCache: persistentLocalCache() });

/* ── STATE ── */
let customers = [], inventory = [];
let payMethod  = 'cash';
let lastInvoiceData = null;
let rowCounter = 0;
const CACHE   = { customers:'zaiady_customers', inventory:'zaiady_inventory' };
const QUEUE_KEY = 'zaiady_offline_queue';

/* ── UTILS ── */
const fmt  = v => Number(v||0).toLocaleString('ar-EG',{minimumFractionDigits:2});
const $    = id => document.getElementById(id);
const now  = () => new Date().toLocaleString('ar-EG');

/* ══════════════════════════════════════
   OFFLINE QUEUE (IndexedDB-like via localStorage)
══════════════════════════════════════ */
function getQueue()    { try { return JSON.parse(localStorage.getItem(QUEUE_KEY)||'[]'); } catch{ return []; } }
function saveQueue(q)  { localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); }
function addToQueue(inv) {
  const q = getQueue();
  inv._queueId  = Date.now() + '_' + Math.random().toString(36).slice(2);
  inv._queueTime = new Date().toLocaleString('ar-EG');
  q.push(inv);
  saveQueue(q);
  updatePendingUI();
}
function removeFromQueue(qid) {
  const q = getQueue().filter(i=>i._queueId!==qid);
  saveQueue(q);
  updatePendingUI();
}

function updatePendingUI() {
  const q    = getQueue();
  const badge = $('pendingBadge');
  const banner = $('offlineBanner');
  if(q.length > 0) {
    badge.style.display = 'flex';
    $('pendingBadgeText').textContent = q.length + ' فاتورة معلقة';
    $('pendingCount').textContent     = ' | ' + q.length + ' معلقة';
  } else {
    badge.style.display = 'none';
    $('pendingCount').textContent = '';
  }
  // show offline banner if offline
  if (!navigator.onLine) {
    banner.classList.remove('hidden');
  } else {
    banner.classList.add('hidden');
  }
}

/* ══════════════════════════════════════
   NETWORK STATUS
══════════════════════════════════════ */
function setOnlineStatus(online) {
  const dot   = $('syncDot');
  const label = $('syncLabel');
  const banner = $('offlineBanner');
  if(online) {
    dot.classList.remove('offline');
    label.textContent = 'متصل';
    banner.classList.add('hidden');
    syncNow(); // auto sync when back online
  } else {
    dot.classList.add('offline');
    label.textContent = 'غير متصل';
    banner.classList.remove('hidden');
  }
}

window.addEventListener('online',  () => setOnlineStatus(true));
window.addEventListener('offline', () => setOnlineStatus(false));

/* ══════════════════════════════════════
   SYNC QUEUE → FIREBASE
══════════════════════════════════════ */
window.syncNow = async function() {
  if(!navigator.onLine) { alert('لا يوجد اتصال بالإنترنت'); return; }
  const q = getQueue();
  if(!q.length) { alert('لا توجد فواتير معلقة'); return; }
  let synced = 0;
  for(const inv of q) {
    try {
      const { _queueId, _queueTime, ...invoiceData } = inv;
      // حفظ الفاتورة
      invoiceData.timestamp = serverTimestamp();
      invoiceData.syncedFrom = 'offline';
      await addDoc(collection(db,'invoices'), invoiceData);
      // تحديث المخزون
      for(const item of (invoiceData.items||[])) {
        if(!item.stockId) continue;
        const factor = inventory.find(i=>i.id===item.stockId)?.unitFactor || 1;
        const qtyPcs = item.unit==='box' ? item.qty*factor : item.qty;
        try {
          await updateDoc(doc(db,'inventory',item.stockId), {
            totalPcs: increment(item.isReturn ? qtyPcs : -qtyPcs)
          });
        } catch(_) {}
      }
      removeFromQueue(_queueId);
      synced++;
    } catch(err) {
      console.error('Sync error:', err);
    }
  }
  if(synced>0) alert(`✅ تم رفع ${synced} فاتورة بنجاح`);
  hideQueueModal();
  updatePendingUI();
};

/* ══════════════════════════════════════
   INIT — تحميل البيانات
══════════════════════════════════════ */
async function init() {
  $('invTime').value = now();
  addNewRow();

  // أولاً: حمّل من localStorage (فوري - يعمل offline)
  try {
    const cc = localStorage.getItem(CACHE.customers);
    const ci = localStorage.getItem(CACHE.inventory);
    if(cc) customers = JSON.parse(cc);
    if(ci) inventory  = JSON.parse(ci);
  } catch(_) {}

  // ثانياً: حاول تحديث من Firebase (يعمل online وكمان offline بسبب persistentLocalCache)
  try {
    const [cSnap, iSnap] = await Promise.all([
      getDocs(collection(db,'customers')),
      getDocs(collection(db,'inventory'))
    ]);
    customers = cSnap.docs.map(d=>({id:d.id,...d.data()}));
    inventory  = iSnap.docs.map(d=>({id:d.id,...d.data()}));
    // حفّظ للـ localStorage كـ backup ثانوي
    localStorage.setItem(CACHE.customers, JSON.stringify(customers));
    localStorage.setItem(CACHE.inventory,  JSON.stringify(inventory));
  } catch(err) {
    console.warn('Firebase fetch failed, using cache:', err.message);
  }

  setOnlineStatus(navigator.onLine);
  updatePendingUI();
}

/* ══════════════════════════════════════
   CUSTOMER SEARCH
══════════════════════════════════════ */
window.searchCustomer = function(inp) {
  const term = inp.value.trim().toLowerCase();
  const res  = $('customerResults');
  if(!term) { res.style.display='none'; return; }
  const matches = customers.filter(c=>c.name?.toLowerCase().includes(term)).slice(0,8);
  // إضافة خيار "نقدي"
  const cashOpt = term.includes('نقد') ? [{id:'cash_customer',name:'عميل نقدي',initialBalance:0}] : [];
  const all = [...cashOpt, ...matches];
  if(!all.length) { res.style.display='none'; return; }
  res.innerHTML = all.map(c=>`
    <div class="search-item" onclick="selectCustomer('${c.id}','${c.name}',${c.initialBalance||0})">
      <b>${c.name}</b>
      ${c.initialBalance ? `<span style="font-size:.7rem;color:#6b8574"> — رصيد: ${fmt(c.initialBalance)}</span>` : ''}
    </div>`).join('');
  res.style.display = 'block';
};

window.selectCustomer = function(id, name, balance) {
  $('customerId').value = id;
  $('customerSearch').value = name;
  $('customerInitialBalance').value = balance;
  $('customerResults').style.display = 'none';
  showBalance(balance);
};

function showBalance(bal) {
  const box = $('balanceBox');
  if(!bal && bal!==0) { box.style.display='none'; return; }
  box.style.display = 'block';
  if(bal > 0) {
    box.className = 'balance-box debt';
    box.innerHTML = `<i class="fas fa-exclamation-circle"></i> عليه دين سابق: ${fmt(bal)} ج.م`;
  } else if(bal < 0) {
    box.className = 'balance-box';
    box.innerHTML = `<i class="fas fa-check-circle"></i> له رصيد دائن: ${fmt(Math.abs(bal))} ج.م`;
  } else {
    box.className = 'balance-box';
    box.innerHTML = `<i class="fas fa-circle-check"></i> الحساب صفر`;
  }
}

/* ══════════════════════════════════════
   PRODUCT ROWS
══════════════════════════════════════ */
window.addNewRow = function() {
  rowCounter++;
  const id = 'row_' + rowCounter;
  const html = `
    <div class="product-row" id="${id}">
      <button class="del-row" onclick="removeRow('${id}')"><i class="fas fa-times"></i></button>
      <div class="form-group" style="margin-bottom:6px">
        <label>الصنف</label>
        <div class="search-wrapper">
          <input type="text" class="form-control p-search" placeholder="ابحث عن صنف..."
            oninput="searchProduct('${id}',this)" autocomplete="off">
          <div class="search-results" id="pRes_${id}"></div>
        </div>
        <input type="hidden" id="pId_${id}">
        <input type="hidden" id="pFactor_${id}" value="1">
      </div>
      <div class="row-grid">
        <div class="form-group" style="margin-bottom:0">
          <label>الكمية</label>
          <input type="number" id="pQty_${id}" class="form-control" value="1" min="0.01" step="0.01" oninput="calc()">
        </div>
        <div class="form-group" style="margin-bottom:0">
          <label>الوحدة</label>
          <select id="pUnit_${id}" class="form-control" onchange="calc()">
            <option value="pcs">قطعة</option>
            <option value="box">كرتون</option>
          </select>
        </div>
        <div class="form-group" style="margin-bottom:0">
          <label>السعر</label>
          <input type="number" id="pPrice_${id}" class="form-control" value="0" min="0" step="0.01" oninput="calc()">
        </div>
        <div class="form-group" style="margin-bottom:0">
          <label>الإجمالي</label>
          <input type="text" id="pTotal_${id}" class="form-control" value="0.00" readonly
            style="background:#f0fdf4;font-weight:700;color:var(--green)">
        </div>
      </div>
      <div style="font-size:.7rem;color:var(--muted);margin-top:6px" id="pStock_${id}"></div>
    </div>`;
  $('itemsContainer').insertAdjacentHTML('beforeend', html);
};

window.removeRow = function(id) {
  const el = $(id);
  if(el) el.remove();
  calc();
};

window.searchProduct = function(rowId, inp) {
  const term = inp.value.trim().toLowerCase();
  const res  = $('pRes_'+rowId);
  if(!term) { res.style.display='none'; return; }
  const matches = inventory.filter(p=>p.name?.toLowerCase().includes(term)).slice(0,8);
  if(!matches.length) { res.style.display='none'; return; }
  res.innerHTML = matches.map(p=>`
    <div class="search-item" onclick="selectProduct('${rowId}','${p.id}','${p.name}',${p.salePrice||0},${p.unitFactor||1},${p.totalPcs||0})">
      <b>${p.name}</b>
      <span style="font-size:.7rem;color:#6b8574"> — المخزن: ${p.totalPcs||0} ق | سعر: ${fmt(p.salePrice)}</span>
    </div>`).join('');
  res.style.display = 'block';
};

window.selectProduct = function(rowId, id, name, price, factor, stock) {
  $('pId_'+rowId).value     = id;
  $('pFactor_'+rowId).value = factor;
  const inp = document.querySelector(`#${rowId} .p-search`);
  if(inp) inp.value = name;
  $('pRes_'+rowId).style.display = 'none';
  $('pPrice_'+rowId).value = price;
  $('pStock_'+rowId).innerHTML = `<i class="fas fa-warehouse"></i> المخزون الحالي: <b>${stock}</b> قطعة`;
  calc();
};

/* ══════════════════════════════════════
   CALC
══════════════════════════════════════ */
window.calc = function() {
  let itemsTotal = 0;
  document.querySelectorAll('.product-row').forEach(row => {
    const id    = row.id;
    const qty   = Number($('pQty_'+id)?.value||0);
    const price = Number($('pPrice_'+id)?.value||0);
    const unit  = $('pUnit_'+id)?.value||'pcs';
    const factor= Number($('pFactor_'+id)?.value||1);
    const effQty = unit==='box' ? qty*factor : qty;
    const rowTotal = effQty * price;
    if($('pTotal_'+id)) $('pTotal_'+id).value = fmt(rowTotal);
    itemsTotal += rowTotal;
  });

  const discount = Number($('discountAmount')?.value||0);
  const total    = Math.max(0, itemsTotal - discount);

  $('t-items').textContent = fmt(itemsTotal) + ' ج.م';
  $('t-total').textContent = fmt(total) + ' ج.م';

  // حساب المدفوع
  let paid = 0;
  if(payMethod==='cash')   paid = Number($('cashAmount')?.value||0);
  if(payMethod==='wallet') paid = Number($('walletAmount')?.value||0);
  if(payMethod==='agel')   paid = 0;
  if(payMethod==='mixed')  paid = Number($('cashAmount')?.value||0) + Number($('walletAmount')?.value||0);

  const remaining = Math.max(0, total - paid);
  $('t-paid').textContent = fmt(paid) + ' ج.م';
  $('t-rem').textContent  = fmt(remaining) + ' ج.م';
  $('t-rem').style.color  = remaining > 0 ? '#dc2626' : '#16a34a';
};

/* ══════════════════════════════════════
   PAYMENT METHOD
══════════════════════════════════════ */
window.setPayMethod = function(method, btn) {
  payMethod = method;
  document.querySelectorAll('.ptab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const fields = {
    cash:   `<div class="form-group"><label>المبلغ النقدي</label><input type="number" id="cashAmount" class="form-control" value="0" min="0" oninput="calc()"></div>`,
    wallet: `<div class="form-group"><label>المحفظة الإلكترونية</label><input type="number" id="walletAmount" class="form-control" value="0" min="0" oninput="calc()"></div>`,
    agel:   `<div style="background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:10px;font-size:.82rem;color:#92400e;font-weight:700"><i class="fas fa-clock"></i> الفاتورة آجل — المبلغ كاملاً في ذمة العميل</div>`,
    mixed:  `<div class="form-group"><label>نقدي</label><input type="number" id="cashAmount" class="form-control" value="0" min="0" oninput="calc()"></div>
             <div class="form-group"><label>محفظة</label><input type="number" id="walletAmount" class="form-control" value="0" min="0" oninput="calc()"></div>`
  };
  $('payFields').innerHTML = fields[method] || '';
  calc();
};

/* ══════════════════════════════════════
   BUILD INVOICE OBJECT
══════════════════════════════════════ */
function buildInvoiceData() {
  const customerId   = $('customerId').value || 'cash_customer';
  const customerName = $('customerSearch').value.trim() || 'عميل نقدي';
  const discount     = Number($('discountAmount')?.value||0);

  const items = [];
  let itemsTotal = 0;
  let valid = true;

  document.querySelectorAll('.product-row').forEach(row => {
    const id     = row.id;
    const stockId= $('pId_'+id)?.value;
    const name   = document.querySelector(`#${id} .p-search`)?.value||'';
    const qty    = Number($('pQty_'+id)?.value||0);
    const price  = Number($('pPrice_'+id)?.value||0);
    const unit   = $('pUnit_'+id)?.value||'pcs';
    const factor = Number($('pFactor_'+id)?.value||1);
    if(!name || qty<=0) { valid=false; return; }
    const effQty = unit==='box' ? qty*factor : qty;
    const rowTotal = effQty * price;
    itemsTotal += rowTotal;
    items.push({ stockId, name, qty, price, unit, isReturn:false });
  });

  if(!valid || !items.length) return null;

  const total     = Math.max(0, itemsTotal - discount);
  const cashAmt   = Number($('cashAmount')?.value||0);
  const walletAmt = Number($('walletAmount')?.value||0);
  let paid = 0;
  if(payMethod==='cash')   paid = cashAmt;
  if(payMethod==='wallet') paid = walletAmt;
  if(payMethod==='mixed')  paid = cashAmt + walletAmt;
  if(payMethod==='agel')   paid = 0;

  return {
    customerId, customerName,
    items, itemsTotal, discount, total,
    paid, remaining: Math.max(0, total - paid),
    paymentMethod: payMethod,
    cashAmount: payMethod==='cash'||payMethod==='mixed' ? cashAmt : 0,
    walletAmount: payMethod==='wallet'||payMethod==='mixed' ? walletAmt : 0,
    notes: $('invNotes')?.value||'',
    time: $('invTime')?.value || now(),
  };
}

/* ══════════════════════════════════════
   SAVE INVOICE (Online + Offline)
══════════════════════════════════════ */
window.saveInvoice = async function() {
  const data = buildInvoiceData();
  if(!data) { alert('⚠️ تأكد من إدخال صنف واحد على الأقل بكمية وسعر'); return; }

  const btn = $('saveBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>جاري الحفظ...';

  if(!navigator.onLine) {
    // ── OFFLINE: حفظ في قائمة الانتظار ──
    addToQueue({...data});
    lastInvoiceData = data;
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-save"></i>حفظ الفاتورة';
    $('printBtn').disabled = false;
    alert('✅ تم حفظ الفاتورة محلياً\nستُرسل تلقائياً عند عودة الإنترنت');
    return;
  }

  try {
    // ── ONLINE: حفظ في Firebase ──
    const docRef = await addDoc(collection(db,'invoices'), {
      ...data,
      timestamp: serverTimestamp()
    });

    // تحديث المخزون
    for(const item of data.items) {
      if(!item.stockId) continue;
      const factor = inventory.find(i=>i.id===item.stockId)?.unitFactor||1;
      const qtyPcs = item.unit==='box' ? item.qty*factor : item.qty;
      try {
        await updateDoc(doc(db,'inventory',item.stockId), {
          totalPcs: increment(-qtyPcs)
        });
      } catch(_) {}
    }

    lastInvoiceData = { ...data, id: docRef.id };
    $('printBtn').disabled = false;
    alert('✅ تم حفظ الفاتورة بنجاح');
    buildReceiptHTML(lastInvoiceData);
  } catch(err) {
    // Firebase فشل — احفظ offline
    addToQueue({...data});
    lastInvoiceData = data;
    $('printBtn').disabled = false;
    alert('⚠️ فشل الاتصال — تم الحفظ محلياً وسيُرسل عند عودة النت');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-save"></i>حفظ الفاتورة';
  }
};

/* ══════════════════════════════════════
   RECEIPT
══════════════════════════════════════ */
function buildReceiptHTML(data) {
  const itemsRows = (data.items||[]).map(i=>`
    <div class="receipt-row"><span>${i.name}</span><span>${fmt(i.qty)} × ${fmt(i.price)} = ${fmt(i.qty*i.price)}</span></div>`).join('');
  $('receiptArea').innerHTML = `
    <div class="receipt">
      <div class="receipt-center"><b>شركة الزيادي</b></div>
      <div class="receipt-center" style="font-size:9px">فاتورة مبيعات</div>
      <div class="receipt-line"></div>
      <div class="receipt-row"><span>العميل</span><span>${data.customerName}</span></div>
      <div class="receipt-row"><span>التاريخ</span><span>${data.time}</span></div>
      <div class="receipt-line"></div>
      ${itemsRows}
      <div class="receipt-line"></div>
      <div class="receipt-row"><span>الإجمالي</span><span>${fmt(data.total)} ج.م</span></div>
      <div class="receipt-row"><span>المدفوع</span><span>${fmt(data.paid)} ج.م</span></div>
      <div class="receipt-row"><b>المتبقي</b><b>${fmt(data.remaining)} ج.م</b></div>
      ${data.notes ? `<div class="receipt-line"></div><div style="font-size:9px">ملاحظة: ${data.notes}</div>` : ''}
      <div class="receipt-line"></div>
      <div class="receipt-center" style="font-size:9px">شكراً لتعاملكم معنا</div>
    </div>`;
}

window.printReceipt = function() {
  if(!lastInvoiceData) return;
  buildReceiptHTML(lastInvoiceData);
  window.print();
};

/* ══════════════════════════════════════
   QUEUE MODAL
══════════════════════════════════════ */
window.showQueueModal = function() {
  const q = getQueue();
  const list = $('queueList');
  if(!q.length) { list.innerHTML='<p style="color:#6b7280;font-size:.8rem">لا توجد فواتير معلقة</p>'; }
  else {
    list.innerHTML = q.map(inv=>`
      <div class="queue-item">
        <div class="queue-item-header">
          <span>${inv.customerName||'نقدي'}</span>
          <span style="color:var(--gold)">${fmt(inv.total)} ج.م</span>
        </div>
        <div style="color:#6b7280">${inv._queueTime} | ${inv.items?.length||0} أصناف</div>
      </div>`).join('');
  }
  $('queueModal').classList.add('show');
};
window.hideQueueModal = function(e) {
  if(!e || e.target===$('queueModal')) $('queueModal').classList.remove('show');
};

window.resetForm = function() {
  if(!confirm('هل تريد إعادة تعيين الفاتورة؟')) return;
  $('customerSearch').value = '';
  $('customerId').value = '';
  $('customerInitialBalance').value = '0';
  $('balanceBox').style.display = 'none';
  $('itemsContainer').innerHTML = '';
  $('discountAmount').value = '0';
  $('invNotes').value = '';
  $('printBtn').disabled = true;
  lastInvoiceData = null;
  rowCounter = 0;
  addNewRow();
  calc();
  $('invTime').value = now();
};

/* ── INIT ── */
init();
</script>
