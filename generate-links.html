<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مُولد روابط العملاء - شركة الزيادي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --accent: #0b5e3d; 
            --header-bg: #0b5e3d;
            --bg-light: #f4f7f6;
            --text-primary: #1b2e26;
            --border: #dce3de;
            --white: #ffffff;
        }
        body { background: var(--bg-light); font-family: 'Cairo', sans-serif; color: var(--text-primary); }
        .header-nav { 
            background: var(--header-bg); padding: 15px; color: white; text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 25px;
        }
        .search-card {
            background: var(--white); border: 1px solid var(--border); border-radius: 15px;
            padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }
        .search-input {
            border: 2px solid var(--border); border-radius: 10px; padding: 12px 20px;
            font-size: 1rem; font-weight: 600; transition: all 0.3s ease;
        }
        .search-input:focus {
            border-color: var(--accent); box-shadow: 0 0 0 0.25rem rgba(11, 94, 61, 0.25); outline: none;
        }
        .customer-row {
            background: var(--white); border: 1px solid var(--border); border-radius: 12px;
            padding: 15px; margin-top: 12px; display: flex; justify-content: space-between;
            align-items: center; transition: transform 0.2s;
        }
        .customer-row:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.04); }
        .btn-action {
            background-color: var(--accent); color: white; border: none; border-radius: 8px;
            padding: 10px 20px; font-weight: 700; font-size: 0.85rem; transition: background 0.2s;
        }
        .btn-action:hover { background-color: #08472e; color: white; }
    </style>
</head>
<body>

<div class="header-nav">
    <h5 class="m-0 fw-bold"><i class="fas fa-link me-2"></i> نظام مشاركة روابط الحسابات الرقمية</h5>
</div>

<div class="container m-auto px-3" style="max-width: 600px;">
    <div class="search-card">
        <label class="form-label fw-bold mb-2 text-muted" style="font-size: 0.9rem;">ابحث عن اسم العميل لتوليد رابطه المباشر:</label>
        <div class="input-group">
            <span class="input-group-text bg-white border-start-0" style="border: 2px solid var(--border); border-radius: 0 10px 10px 0;"><i class="fas fa-search text-muted"></i></span>
            <input type="text" id="searchInput" class="form-control search-input border-end-0" placeholder="اكتب اسم العميل هنا (بحث ذكي)...">
        </div>
    </div>

    <div id="resultsContainer" class="mt-3">
        <div class="text-center text-muted p-5 opacity-50 small">جاري تحميل البيانات من السيرفر...</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
        authDomain: "ahmedelzaiady.firebaseapp.com",
        projectId: "ahmedelzaiady",
        storageBucket: "ahmedelzaiady.firebasestorage.app",
        messagingSenderId: "300306825071",
        appId: "1:300306825071:web:0426ddde56280fa090329a",
        measurementId: "G-WE04GK5XZZ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allCustomers = [];

    // جلب البيانات من مجموعة cash_logs المعتمدة لديك
    async function fetchCustomers() {
        try {
            const querySnapshot = await getDocs(collection(db, "cash_logs"));
            allCustomers = querySnapshot.docs.map(doc => ({
                id: doc.id,
                ...doc.data()
            }));
            
            document.getElementById('resultsContainer').innerHTML = '<div class="text-center text-muted p-4 small">جاهز للبحث الفوري.. اكتب أي اسم الآن</div>';
            
            document.getElementById('searchInput').addEventListener('input', (e) => {
                searchCustomers(e.target.value);
            });

        } catch (error) {
            console.error("خطأ في جلب البيانات: ", error);
            document.getElementById('resultsContainer').innerHTML = '<div class="alert alert-danger text-center small">حدث خطأ أثناء تحميل السجلات</div>';
        }
    }

    function searchCustomers(keyword) {
        const container = document.getElementById('resultsContainer');
        if (!keyword.trim()) {
            container.innerHTML = '<div class="text-center text-muted p-5 opacity-50 small">ابدأ بكتابة اسم العميل ليتم تصفيته تلقائياً</div>';
            return;
        }

        // البحث في حقل الاسم (تأكد أن الحقل في الـ Firestore اسمه name أو قم بتغييره هنا لما يقابله)
        const filtered = allCustomers.filter(c => c.name && c.name.toLowerCase().includes(keyword.toLowerCase()));

        if (filtered.length === 0) {
            container.innerHTML = '<div class="text-center text-muted p-4 small">لم يتم العثور على سجلات تطابق هذا الاسم</div>';
            return;
        }

        container.innerHTML = filtered.map(customer => {
            const safeName = customer.name.replace(/['"]/g, ' '); 
            return `
                <div class="customer-row flex-wrap gap-2">
                    <div>
                        <span class="fw-bold d-block" style="color: var(--accent); font-size: 0.95rem;">${customer.name}</span>
                        <small class="text-muted" style="font-size:0.75rem;"><i class="fas fa-hashtag me-1"></i> معرف العملية: ${customer.id}</small>
                    </div>
                    <div class="d-flex justify-content-end align-items-center flex-grow-1 flex-sm-grow-0">
                        <button class="btn btn-action" onclick="window.copyAndShare('${customer.id}', '${safeName}')">
                            <i class="fas fa-copy me-1"></i> نسخ وإرسال واتساب
                        </button>
                    </div>
                </div>
            `;
        }).join('');
    }

    function generateCustomerLink(customerId) {
        const baseProjectUrl = "https://ahmedelzaiady.web.app"; 
        return `${baseProjectUrl}/customer-portal.html?cid=${customerId}`;
    }

    window.copyAndShare = (customerId, customerName) => {
        const finalLink = generateCustomerLink(customerId);
        
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(finalLink)
                .then(() => console.log("تم النسخ"))
                .catch(err => console.error(err));
        }

        const textMessage = `السلام عليكم يا فندم، مرحباً بك في شركة الزيادي.\n\nيمكنك الآن متابعة كشف حسابك التفصيلي مباشرة وعبر الرابط الرقمي التالي:\n${finalLink}`;
        const encodedText = encodeURIComponent(textMessage);
        const whatsAppUrl = `https://api.whatsapp.com/send?text=${encodedText}`;
        
        window.open(whatsAppUrl, '_blank');
    };

    fetchCustomers();
</script>
</body>
</html>
