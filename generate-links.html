<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مُولد روابط العملاء - شركة الزيادي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --accent: #0b5e3d; 
            --header-bg: #0b5e3d;
            --bg-light: #f4f7f6;
            --text-primary: #1b2e26;
            --border: #dce3de;
            --white: #ffffff;
        }
        body { background: var(--bg-light); font-family: 'Cairo', sans-serif; color: var(--text-primary); }
        .header-nav { 
            background: var(--header-bg); padding: 15px; color: white; text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 25px;
        }
        .search-card {
            background: var(--white); border: 1px solid var(--border); border-radius: 15px;
            padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }
        .search-input {
            border: 2px solid var(--border); border-radius: 10px; padding: 12px 20px;
            font-size: 1rem; font-weight: 600; transition: all 0.3s ease;
        }
        .search-input:focus {
            border-color: var(--accent); box-shadow: 0 0 0 0.25rem rgba(11, 94, 61, 0.25); outline: none;
        }
        .customer-row {
            background: var(--white); border: 1px solid var(--border); border-radius: 12px;
            padding: 15px; margin-top: 12px; display: flex; justify-content: space-between;
            align-items: center; transition: transform 0.2s;
        }
        .customer-row:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.04); }
        .btn-copy {
            background-color: var(--accent); color: white; border: none; border-radius: 8px;
            padding: 8px 16px; font-weight: 700; font-size: 0.85rem; transition: background 0.2s;
        }
        .btn-copy:hover { background-color: #08472e; color: white; }
    </style>
</head>
<body>

<div class="header-nav">
    <h5 class="m-0 fw-bold"><i class="fas fa-link me-2"></i> نظام مشاركة روابط الحسابات الرقمية</h5>
</div>

<div class="container m-auto px-3" style="max-width: 600px;">
    <div class="search-card">
        <label class="form-label fw-bold mb-2 text-muted" style="font-size: 0.9rem;">ابحث عن اسم العميل لتوليد رابطه المباشر:</label>
        <div class="input-group">
            <span class="input-group-text bg-white border-start-0" style="border: 2px solid var(--border); border-radius: 0 10px 10px 0;"><i class="fas fa-search text-muted"></i></span>
            <input type="text" id="searchInput" class="form-control search-input border-end-0" placeholder="اكتب اسم العميل هنا (بحث ذكي)...">
        </div>
    </div>

    <!-- مكان ظهور نتائج البحث -->
    <div id="resultsContainer" class="mt-3">
        <div class="text-center text-muted p-5 opacity-50 small">ابدأ بكتابة اسم العميل ليتم تصفيته تلقائياً</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // إعدادات قاعدة البيانات الخاصة بك لربط الصفحة
    const firebaseConfig = {
        apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
        authDomain: "ahmedelzaiady.firebaseapp.com",
        projectId: "ahmedelzaiady",
        storageBucket: "ahmedelzaiady.firebasestorage.app",
        messagingSenderId: "300306825071",
        appId: "1:300306825071:web:0426ddde56280fa090329a",
        measurementId: "G-WE04GK5XZZ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allCustomers = [];

    // 1. جلب قائمة جميع العملاء من Firebase عند فتح الصفحة لمرة واحدة لتسريع البحث الذكي
    async function fetchCustomers() {
        try {
            const querySnapshot = await getDocs(collection(db, "customers"));
            allCustomers = querySnapshot.docs.map(doc => ({
                id: doc.id,
                ...doc.data()
            }));
            
            // تحديث الواجهة بعد الجلب بنجاح
            document.getElementById('resultsContainer').innerHTML = '<div class="text-center text-muted p-4 small">جاهز للبحث الفوري.. اكتب أي اسم الآن</div>';
        } catch (error) {
            console.error("خطأ في جلب بيانات العملاء: ", error);
            document.getElementById('resultsContainer').innerHTML = '<div class="alert alert-danger text-center small">حدث خطأ أثناء تحميل قائمة العملاء</div>';
        }
    }

    // 2. دالة البحث الذكي الفوري (تحديث النتائج مع كل حرف يكتبه المستخدم)
    function searchCustomers(keyword) {
        const container = document.getElementById('resultsContainer');
        
        if (!keyword.trim()) {
            container.innerHTML = '<div class="text-center text-muted p-5 opacity-50 small">ابدأ بكتابة اسم العميل ليتم تصفيته تلقائياً</div>';
            return;
        }

        // تصفية العملاء الذين يحتوي اسمهم على الكلمة المفتاحية المكتوبة
        const filtered = allCustomers.filter(c => c.name && c.name.toLowerCase().includes(keyword.toLowerCase()));

        if (filtered.length === 0) {
            container.innerHTML = '<div class="text-center text-muted p-4 small">لم يتم العثور على عملاء يطابقون هذا الاسم</div>';
            return;
        }

        // عرض النتائج المتطابقة
        container.innerHTML = filtered.map(customer => `
            <div class="customer-row">
                <div>
                    <span class="fw-bold d-block" style="color: var(--accent); font-size: 0.95rem;">${customer.name}</span>
                    <small class="text-muted" style="font-size:0.75rem;"><i class="fas fa-hashtag me-1"></i> معرف الحساب: ${customer.id}</small>
                </div>
                <button class="btn btn-copy" onclick="copyPortalLink('${customer.id}')">
                    <i class="fas fa-copy me-1"></i> نسخ الرابط
                </button>
            </div>
        `).join('');
    }

    // 3. دالة توليد ونسخ الرابط المباشر للعميل
    window.copyPortalLink = (customerId) => {
        // تأخذ رابط الدومين وتستبدل اسم الصفحة الحالية بصفحة بوابة العميل التي أنشأناها في الخطوة السابقة
        const domain = window.location.origin + window.location.pathname.replace('generate-links.html', 'customer-portal.html');
        const finalLink = `${domain}?cid=${customerId}`;

        navigator.clipboard.writeText(finalLink).then(() => {
            // تنبيه بسيط وجميل للـمستخدم بالنجاح
            alert("✅ تم نسخ رابط العميل بنجاح! يمكنك الآن لصقه في محادثة الواتساب الخاصة به.");
        }).catch(err => {
            console.error("فشل النسخ التلقائي: ", err);
            alert("الرابط هو: " + finalLink);
        });
    };

    // الاستماع لحدث الكتابة في خانة البحث لتشغيل البحث الذكي فوراً
    document.getElementById('searchInput').addEventListener('input', (e) => {
        searchCustomers(e.target.value);
    });

    // بدء تشغيل الصفحة وجلب البيانات
    fetchCustomers();
</script>

</body>
</html>
