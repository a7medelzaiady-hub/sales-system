<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طلبات العملاء</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{font-family:'Cairo';background:#f5f7f6;padding-bottom:100px}
.header{background:#0b5e3d;color:#fff;padding:15px;position:sticky;top:0;display:flex;justify-content:space-between}
.card-box{background:#fff;padding:15px;border-radius:15px;margin-top:15px}
.order-card{background:#fff;padding:15px;border-radius:15px;margin-bottom:10px;border-right:5px solid #0b5e3d}
.btn-save{background:#0b5e3d;color:#fff;width:100%;padding:10px;border:none;border-radius:10px}
.small-text{font-size:12px;color:#666}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.stat{background:#fff;padding:10px;border-radius:12px;text-align:center}
</style>
</head>

<body>

<div class="header">
    <a href="#" class="text-white"><i class="fas fa-arrow-right"></i></a>
    <h6>طلبات العملاء</h6>
    <i class="fas fa-bell"></i>
</div>

<div class="container">

<!-- Stats -->
<div class="stats">
    <div class="stat"><div class="small-text">اليوم</div><h6 id="todayCount">0</h6></div>
    <div class="stat"><div class="small-text">غداً</div><h6 id="tomorrowCount">0</h6></div>
    <div class="stat"><div class="small-text">متأخر</div><h6 id="lateCount">0</h6></div>
    <div class="stat"><div class="small-text">تم</div><h6 id="doneCount">0</h6></div>
</div>

<!-- Form -->
<div class="card-box mt-3">

    <label>العميل</label>
    <select id="customerName" class="form-select"></select>

    <label class="mt-2">تاريخ التسليم</label>
    <input type="date" id="deliveryDate" class="form-control">

    <label class="mt-2">الأصناف</label>
    <div id="itemsContainer"></div>

    <button class="btn btn-outline-primary w-100 mt-2" onclick="addItemRow()">+ إضافة صنف</button>

    <label class="mt-2">ملاحظات</label>
    <textarea id="notes" class="form-control"></textarea>

    <button class="btn-save mt-3" onclick="saveOrder()">حفظ الطلب</button>
</div>

<!-- Orders -->
<div id="ordersContainer" class="mt-3"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp, updateDoc, doc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
authDomain: "ahmedelzaiady.firebaseapp.com",
projectId: "ahmedelzaiady",
storageBucket: "ahmedelzaiady.firebasestorage.app",
messagingSenderId: "300306825071",
appId: "1:300306825071:web:0426ddde56280fa090329a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let products = [];
let allOrders = [];

/* ===== العملاء ===== */
async function loadCustomers(){
const snap = await getDocs(collection(db,'customers'));
const select = document.getElementById('customerName');
select.innerHTML = "";

snap.forEach(d=>{
select.innerHTML += `<option value="${d.data().name}">${d.data().name}</option>`;
});
}

/* ===== المخزن ===== */
async function loadProducts(){
const snap = await getDocs(collection(db,'products'));
products = [];
snap.forEach(d=>products.push(d.data()));
}

/* ===== إضافة صنف ===== */
window.addItemRow = () => {
const div = document.createElement('div');
div.className="row g-2 mt-2";

div.innerHTML = `
<div class="col-7">
<select class="form-select item-name">
<option value="">اختر الصنف</option>
${products.map(p=>`<option>${p.name}</option>`).join('')}
</select>
</div>

<div class="col-4">
<input type="number" class="form-control item-qty" placeholder="الكمية">
</div>

<div class="col-1">
<button class="btn btn-danger btn-sm" onclick="this.parentElement.parentElement.remove()">X</button>
</div>
`;

document.getElementById('itemsContainer').appendChild(div);
};

/* ===== حفظ الطلب ===== */
window.saveOrder = async ()=>{

const customerName = document.getElementById('customerName').value;
const deliveryDate = document.getElementById('deliveryDate').value;
const notes = document.getElementById('notes').value;

let items = [];

document.querySelectorAll('.item-name').forEach((el,i)=>{
const qty = document.querySelectorAll('.item-qty')[i].value;
if(el.value) items.push(`${el.value} × ${qty}`);
});

await addDoc(collection(db,'customer_orders'),{
customerName,
deliveryDate,
items: items.join('\n'),
notes,
status:"new",
timestamp:serverTimestamp()
});

alert("تم الحفظ");

loadOrders();
};
