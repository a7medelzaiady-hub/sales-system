<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طلبات العملاء</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{font-family:Cairo;background:#f5f7f6;padding-bottom:100px}
.header{background:#0b5e3d;color:#fff;padding:15px}
.card-box{background:#fff;padding:15px;border-radius:15px;margin-top:10px}
.order-card{background:#fff;padding:15px;border-radius:15px;margin-top:10px;border-right:5px solid #0b5e3d}
.btn-save{background:#0b5e3d;color:#fff;width:100%;padding:10px;border:none;border-radius:10px}
</style>

</head>
<body>

<div class="header">طلبات العملاء</div>

<div class="container">

<input id="searchBox" class="form-control mt-2" placeholder="بحث..." oninput="searchOrders()">

<div class="card-box">

<select id="customerName" class="form-select"></select>

<input id="deliveryDate" type="date" class="form-control mt-2">

<div id="itemsContainer"></div>

<button class="btn btn-primary mt-2" onclick="addItemRow()">+ صنف</button>

<textarea id="notes" class="form-control mt-2" placeholder="ملاحظات"></textarea>

<button class="btn-save mt-2" onclick="saveOrder()">حفظ</button>

</div>

<div id="ordersContainer"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
apiKey:"AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
authDomain:"ahmedelzaiady.firebaseapp.com",
projectId:"ahmedelzaiady"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let products = [];
let orders = [];

/* ===== LOAD ===== */
async function loadCustomers(){
const snap = await getDocs(collection(db,'customers'));
const sel = document.getElementById('customerName');
sel.innerHTML = `<option value="">اختر العميل</option>`;
snap.forEach(d=>{
sel.innerHTML += `<option value="${d.data().name}">${d.data().name}</option>`;
});
}

/* ===== ITEMS ===== */
window.addItemRow = ()=>{
const div = document.createElement('div');

div.innerHTML = `
<div class="row mt-2">
<div class="col-7">
<input class="form-control item-name" placeholder="الصنف">
</div>
<div class="col-4">
<input class="form-control item-qty" placeholder="كمية" type="number">
</div>
<div class="col-1">
<button onclick="this.parentElement.parentElement.remove()">X</button>
</div>
</div>
`;

document.getElementById('itemsContainer').appendChild(div);
};

/* ===== SAVE ===== */
window.saveOrder = async ()=>{

const name = document.getElementById('customerName').value;
const date = document.getElementById('deliveryDate').value;
const notes = document.getElementById('notes').value;

let items = [];

document.querySelectorAll('.item-name').forEach((el,i)=>{
let qty = document.querySelectorAll('.item-qty')[i].value;
if(el.value) items.push(`${el.value} × ${qty}`);
});

await addDoc(collection(db,'customer_orders'),{
customerName:name,
deliveryDate:date,
items:items.join('\n'),
notes,
status:"new",
timestamp:serverTimestamp()
});

loadOrders();
alert("تم الحفظ");
};

/* ===== LOAD ORDERS ===== */
async function loadOrders(){

const snap = await getDocs(query(collection(db,'customer_orders'),orderBy('timestamp','desc')));

orders = [];
snap.forEach(d=>orders.push({id:d.id,...d.data()}));

render(orders);
}

function render(list){

document.getElementById('ordersContainer').innerHTML =
list.map(o=>`

<div class="order-card">

<h5>${o.customerName}</h5>
<div>${o.deliveryDate}</div>

<hr>

<div>${(o.items||"").replace(/\n/g,"<br>")}</div>

<div>${o.notes||""}</div>

</div>

`).join("");
}

/* ===== SEARCH ===== */
window.searchOrders = ()=>{

let val = document.getElementById('searchBox').value.toLowerCase();

let filtered = orders.filter(o=>
(o.customerName||"").toLowerCase().includes(val) ||
(o.items||"").toLowerCase().includes(val)
);

render(filtered);
};

/* INIT */
loadCustomers();
loadOrders();

</script>

</body>
</html>
