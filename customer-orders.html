<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فاتورة طلب</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>

body{
    font-family:'Cairo';
    background:#eef2f6;
}

/* ===== Header ===== */
.header{
    background: linear-gradient(135deg,#0b5e3d,#118a5a);
    color:#fff;
    padding:18px;
    border-bottom-left-radius:20px;
    border-bottom-right-radius:20px;
    box-shadow:0 6px 20px rgba(0,0,0,.1);
}

.header h4{
    margin:0;
    font-weight:700;
}

/* ===== Card ===== */
.invoice{
    background:#fff;
    border-radius:18px;
    padding:18px;
    margin-top:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.06);
}

/* ===== Inputs ===== */
.form-control,.form-select{
    border-radius:12px;
    padding:10px;
    border:1px solid #e5e7eb;
}

.form-control:focus{
    border-color:#0b5e3d;
    box-shadow:none;
}

/* ===== Items ===== */
.item-row{
    display:grid;
    grid-template-columns:2fr 1fr 40px;
    gap:10px;
    margin-top:10px;
    align-items:center;
}

.item-row input{
    border-radius:12px;
}

.btn-remove{
    background:#dc3545;
    color:#fff;
    border:none;
    border-radius:10px;
    height:42px;
}

/* ===== Buttons ===== */
.btn-main{
    background:#0b5e3d;
    color:#fff;
    border:none;
    width:100%;
    padding:12px;
    border-radius:12px;
    font-weight:600;
    margin-top:12px;
    transition:.2s;
}

.btn-main:hover{
    background:#0a4d33;
}

.btn-outline{
    border:1px dashed #0b5e3d;
    color:#0b5e3d;
    background:#fff;
    width:100%;
    padding:10px;
    border-radius:12px;
}

/* ===== Summary ===== */
.summary{
    display:flex;
    justify-content:space-between;
    background:#f8fafc;
    padding:12px;
    border-radius:12px;
    margin-top:15px;
    font-weight:600;
}

/* ===== Section title ===== */
.title{
    font-weight:700;
    margin-top:10px;
    margin-bottom:5px;
    color:#111827;
}

.small-text{
    font-size:12px;
    color:#6b7280;
}

</style>
</head>

<body>

<div class="header">
    <h4>🧾 فاتورة طلب عميل</h4>
    <div class="small-text">نظام الطلبات</div>
</div>

<div class="container">

<!-- ===== Invoice Card ===== -->
<div class="invoice">

    <div class="title">بيانات العميل</div>

    <input class="form-control"
