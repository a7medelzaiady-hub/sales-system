<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طلب عميل جديد - شركة الزيادي</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root{
    --accent:#0b5e3d;
    --bg:#f4f7f6;
    --border:#dce3de;
    --text:#1b2e26;
}

body{
    font-family:'Cairo';
    background:var(--bg);
    padding-bottom:120px;
}

/* ===== Header ===== */
.header{
    background:var(--accent);
    color:#fff;
    padding:15px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:1000;
}

/* ===== Cards ===== */
.glass-card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:20px;
    padding:18px;
    margin-top:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.05);
}

/* ===== Inputs ===== */
input,select{
    border-radius:12px !important;
    border:1px solid var(--border) !important;
    padding:10px !important;
    font-weight:600;
}

input:focus,select:focus{
    border-color:var(--accent) !important;
    box-shadow:0 0 8px rgba(11,94,61,.1) !important;
}

/* ===== Item Row ===== */
.order-item{
    background:#f8faf9;
    border:1px solid var(--border);
    border-radius:15px;
    padding:15px;
    margin-bottom:12px;
    border-right:5px solid var(--accent);
}

.btn-add-item{
    border:2px dashed var(--accent);
    background:#f0f6f3;
    color:var(--accent);
    width:100%;
    padding:12px;
    border-radius:15px;
    font-weight:700;
}

.btn-add-item:hover{
    background:var(--accent);
    color:#fff;
}

/* ===== Footer ===== */
.footer-action{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:#fff;
    padding:15px;
    border-top:1px solid var(--border);
    box-shadow:0 -5px 20px rgba(0,0,0,.05);
}

.btn-save{
    background:var(--accent);
    color:#fff;
    width:100%;
    border:none;
    padding:12px;
    border-radius:15px;
    font-weight:700;
}

.small-text{
    font-size:12px;
    color:#6b7280;
}

</style>
</head>

<body>

<div class="header">
    <a href="#" class="text-white"><i class="fas fa-arrow-right"></i></a>
    <h6 class="m-0">🧾 طلب عميل جديد</h6>
    <span class="small-text text-white">Invoice</span>
</div>

<div class="container">

<!-- ===== Customer ===== -->
<div class="glass-card">

    <label>العميل</label>
    <select id="customerSelect" class="form-select">
        <option value="">اختر العميل</option>
    </select>

    <label class="mt-2">ملاحظات</label>
    <input id="note" class="form-control" placeholder="ملاحظات الطلب...">

</div>

<!-- ===== Items ===== -->
<div class="glass-card">

    <h6 class="fw-bold mb-3"><i class="fas fa-box me-1"></i> الأصناف</h6>

    <div id="itemsContainer"></div>

    <button class="btn-add-item mt-2" onclick="addItem()">
        + إضافة صنف
    </button>

</div>

</div>

<!-- ===== Footer ===== -->
<div class="footer-action">
    <button class="btn-save" onclick="saveOrder()">💾 حفظ الطلب</button>
</div>

async function loadCustomers(){

const sel = document.getElementById("customerSelect");

snap.forEach(d=>{
customers.push(d.data());

});
}

/* ===== LOAD PRODUCTS ===== */
async function loadProducts(){

`;

document.getElementById("itemsContainer").appendChild(div);
};
