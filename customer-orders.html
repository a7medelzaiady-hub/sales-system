<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طلب عميل جديد - شركة الزيادي</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root{
    --accent:#0b5e3d;
    --bg:#f4f7f6;
    --border:#dce3de;
}

body{
    font-family:'Cairo';
    background:var(--bg);
    padding-bottom:120px;
}

.header{
    background:var(--accent);
    color:#fff;
    padding:15px;
    display:flex;
    justify-content:space-between;
}

.glass-card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:18px;
    padding:15px;
    margin-top:15px;
}

input,select{
    border-radius:12px !important;
    padding:10px !important;
    font-weight:600;
}

.order-item{
    background:#f8faf9;
    border:1px solid var(--border);
    border-radius:15px;
    padding:12px;
    margin-top:10px;
    border-right:5px solid var(--accent);
}

.btn-add{
    width:100%;
    padding:10px;
    border:2px dashed var(--accent);
    background:#f0f6f3;
    color:var(--accent);
    border-radius:12px;
    font-weight:700;
}

.btn-save{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:var(--accent);
    color:#fff;
    padding:15px;
    border:none;
    font-size:18px;
    font-weight:700;
}

</style>
</head>

<body>

<div class="header">
    <h6>🧾 طلب عميل جديد</h6>
    <i class="fas fa-user"></i>
</div>

<div class="container">

<div class="glass-card">

<input id="customerSelect"
       class="form-control"
       list="customersList"
       placeholder="اكتب اسم العميل">

<datalist id="customersList"></datalist>

<label class="mt-2">ملاحظات</label>
<input id="note" class="form-control" placeholder="ملاحظات الطلب">

</div>

<div class="glass-card">

<h6 class="fw-bold">الأصناف</h6>

<div id="itemsContainer"></div>

<button class="btn-add mt-2" onclick="addItem()">+ إضافة صنف</button>

</div>

</div>

<button class="btn-save" onclick="saveOrder()">💾 حفظ الطلب</button>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
getFirestore,
collection,
getDocs,
addDoc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
apiKey:"AIzaSyAS0NNcZy0-t-LN2WCB7p0941jR0bo-MNls",
authDomain:"ahmedelzaiady.firebaseapp.com",
projectId:"ahmedelzaiady"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let customers = [];

/* ===== تحميل العملاء ===== */

async function loadCustomers(){
  const snap = await getDocs(collection(db,'customers'));

  const list = document.getElementById("customersList");
  list.innerHTML = "";

  snap.forEach((d) => {
    const name = d.data().name;

    const option = document.createElement("option");
    option.value = name;

    list.appendChild(option);
  });
}
/* ===== إضافة صنف ===== */
window.addItem = ()=>{

const div = document.createElement("div");
div.className = "order-item";

div.innerHTML = `
<div class="row g-2">

<div class="col-7">
<input class="form-control item-name" placeholder="اسم الصنف">
</div>

<div class="col-4">
<input class="form-control item-qty" type="number" placeholder="الكمية">
</div>

<div class="col-1">
<button class="btn btn-danger btn-sm"
onclick="this.parentElement.parentElement.parentElement.remove()">X</button>
</div>

</div>
`;

document.getElementById("itemsContainer").appendChild(div);
};

/* ===== حفظ الطلب ===== */
window.saveOrder = async ()=>{

const customer = document.getElementById("customerSelect").value;
const note = document.getElementById("note").value;

let items = [];

document.querySelectorAll(".order-item").forEach(row=>{
const name = row.querySelector(".item-name").value;
const qty = row.querySelector(".item-qty").value;

if(name && qty){
items.push({
name,
qty:Number(qty)
});
}
});

if(!customer || items.length === 0){
return alert("من فضلك اختر عميل وأضف صنف");
}

await addDoc(collection(db,'customer_orders'),{
customerName:customer,
items,
note,
status:"new",
createdAt:serverTimestamp()
});

alert("تم حفظ الطلب بنجاح");
location.reload();
};

loadCustomers();

</script>

</body>
</html>
