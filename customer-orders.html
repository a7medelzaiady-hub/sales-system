<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طلب عميل جديد</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
    font-family:'Cairo';
    background:#f4f7f6;
    padding-bottom:120px;
}

.header{
    background:#0b5e3d;
    color:#fff;
    padding:15px;
    display:flex;
    justify-content:space-between;
}

.card-box{
    background:#fff;
    border:1px solid #dce3de;
    border-radius:15px;
    padding:15px;
    margin-top:15px;
}

input,select{
    border-radius:10px !important;
    padding:10px !important;
    font-weight:600;
}

.order-item{
    background:#f8faf9;
    border:1px solid #dce3de;
    border-radius:12px;
    padding:10px;
    margin-top:10px;
    border-right:5px solid #0b5e3d;
}

.btn-add{
    width:100%;
    padding:10px;
    border:2px dashed #0b5e3d;
    background:#f0f6f3;
    color:#0b5e3d;
    border-radius:12px;
    font-weight:700;
}

.btn-save{
    position:fixed;
    bottom:0;
    width:100%;
    background:#0b5e3d;
    color:#fff;
    padding:15px;
    border:none;
    font-size:18px;
    font-weight:700;
}
</style>
</head>

<body>

<div class="header">
    <h6>🧾 طلب عميل جديد</h6>
</div>

<div class="container">

<!-- العميل -->
<div class="card-box">
    <input id="customerSelect"
           class="form-control"
           list="customersList"
           placeholder="اكتب اسم العميل">

    <datalist id="customersList"></datalist>

    <label class="mt-2">📅 تاريخ التنفيذ</label>
    <input type="date" id="deliveryDate" class="form-control">

    <label class="mt-2">ملاحظات</label>
    <input id="note" class="form-control" placeholder="ملاحظات">
</div>

<!-- الأصناف -->
<div class="card-box">
    <h6>الأصناف</h6>

    <div id="itemsContainer"></div>

    <button class="btn-add mt-2" onclick="addItem()">+ إضافة صنف</button>
</div>

</div>

<button class="btn-save" onclick="saveOrder()">💾 حفظ الطلب</button>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
getFirestore,
collection,
getDocs,
addDoc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
  authDomain: "ahmedelzaiady.firebaseapp.com",
  projectId: "ahmedelzaiady",
  storageBucket: "ahmedelzaiady.firebasestorage.app",
  messagingSenderId: "300306825071",
  appId: "1:300306825071:web:0426ddde56280fa090329a",
  measurementId: "G-WE04GK5XZZ"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let products = [];

/* ================= العملاء ================= */
async function loadCustomers(){
    const snap = await getDocs(collection(db,'customers'));
    const list = document.getElementById("customersList");
    list.innerHTML = "";

    snap.forEach(d=>{
        const opt = document.createElement("option");
        opt.value = d.data().name;
        list.appendChild(opt);
    });
}

/* ================= الأصناف ================= */

async function loadProducts(){

    const snap = await getDocs(collection(db,'products'));

    products = [];

    snap.forEach(d=>{

        const data = d.data();

        if(data.name){
            products.push(data.name);
        }

    });

    console.log(products);

}

/* ================= إضافة صنف ================= */
/* ================= إضافة صنف ================= */

window.addItem = () => {

    if(products.length === 0){
        alert("لم يتم تحميل الأصناف من المخزن");
        return;
    }

    const div = document.createElement("div");
    div.className = "order-item";

    const listId =
    "productsList_" + Date.now() + Math.floor(Math.random()*1000);

    div.innerHTML = `

    <div class="row g-2 align-items-center">

        <div class="col-7">

            <input
                type="text"
                class="form-control item-name"
                list="${listId}"
                placeholder="اختر أو اكتب الصنف">

            <datalist id="${listId}">

                ${products.map(p => `
                    <option value="${p}">
                `).join('')}

            </datalist>

        </div>

        <div class="col-3">

            <input
                type="number"
                min="1"
                value="1"
                class="form-control item-qty"
                placeholder="الكمية">

        </div>

        <div class="col-2">

            <button
                type="button"
                class="btn btn-danger w-100"
                onclick="this.closest('.order-item').remove()">

                🗑️

            </button>

        </div>

    </div>

    `;

    document
    .getElementById("itemsContainer")
    .appendChild(div);
};

/* ================= حفظ الطلب ================= */
window.saveOrder = async () => {

    const customer = document.getElementById("customerSelect").value;
    const note = document.getElementById("note").value;
    const deliveryDate = document.getElementById("deliveryDate").value;

    let items = [];

    document.querySelectorAll(".order-item").forEach(row=>{
        const name = row.querySelector(".item-name").value;
        const qty = row.querySelector(".item-qty").value;

        if(name && qty){
            items.push({name, qty:Number(qty)});
        }
    });

    if(!customer || !deliveryDate || items.length===0){
        return alert("من فضلك املأ البيانات");
    }

    await addDoc(collection(db,'customer_orders'),{
        customerName:customer,
        note,
        deliveryDate,
        items,
        status:"new",
        createdAt:serverTimestamp()
    });

    alert("تم حفظ الطلب");

window.location.href = "orders.html";
};

/* ================= تنبيهات ================= */
async function checkAlerts(){

    const snap = await getDocs(collection(db,'customer_orders'));
    const today = new Date();
    today.setHours(0,0,0,0);

    snap.forEach(d=>{
        const o = d.data();
        if(!o.deliveryDate) return;

        const dDate = new Date(o.deliveryDate);
        dDate.setHours(0,0,0,0);

        const diff = Math.ceil((dDate - today)/(1000*60*60*24));

        if(diff===0){
            console.log("⚠️ طلب اليوم:", o.customerName);
        }

        if(diff<0){
            console.log("🚨 طلب متأخر:", o.customerName);
        }
    });
}

/* ================= تشغيل ================= */
/* ================= تشغيل ================= */

async function init(){

    try{

        await loadCustomers();

        await loadProducts();

        await checkAlerts();

        addItem();

    }catch(e){

        console.error(e);

        alert("حدث خطأ أثناء تحميل البيانات");

    }

}

init();

init();

</script>

</body>
</html>
