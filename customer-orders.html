<body>

};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let products = [];
let allOrders = [];

/* ===== LOAD ===== */
async function loadCustomers(){
const snap = await getDocs(collection(db,'customers'));
const select = document.getElementById('customerName');
select.innerHTML = `<option value="">اختر العميل</option>`;
snap.forEach(d=>{
select.innerHTML += `<option>${d.data().name}</option>`;
});
}

async function loadProducts(){
const snap = await getDocs(collection(db,'products'));
products = [];
snap.forEach(d=>products.push(d.data()));
}

/* ===== ADD ITEM ===== */
window.addItemRow = ()=>{
const div = document.createElement('div');
div.className="row g-2 mt-2";

div.innerHTML = `
<div class="col-7">
<select class="form-select item-name">
<option value="">صنف</option>
${products.map(p=>`<option>${p.name}</option>`).join('')}
</select>
</div>
<div class="col-4">
<input type="number" class="form-control item-qty" placeholder="كمية">
</div>
<div class="col-1">
<button class="btn btn-danger btn-sm" onclick="this.parentElement.parentElement.remove()">X</button>
</div>
`;

document.getElementById('itemsContainer').appendChild(div);
};

/* ===== SAVE ===== */
window.saveOrder = async ()=>{

const customerName = customerName.value;
const deliveryDate = deliveryDate.value;
const notes = notes.value;

let items = [];

document.querySelectorAll('.item-name').forEach((el,i)=>{
const qty = document.querySelectorAll('.item-qty')[i].value;
if(el.value) items.push(`${el.value} × ${qty}`);
});

await addDoc(collection(db,'customer_orders'),{
customerName,
deliveryDate,
items: items.join('\n'),
notes,
status:"new",
timestamp:serverTimestamp()
});

loadOrders();
alert("تم الحفظ");
};

/* ===== LOAD ORDERS ===== */
async function loadOrders(){

const snap = await getDocs(query(collection(db,'customer_orders'),orderBy('timestamp','desc')));

allOrders = [];
snap.forEach(d=>allOrders.push({id:d.id,...d.data()}));

render(allOrders);
}
