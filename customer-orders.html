<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طلبية عميل جديدة - شركة الزيادي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* (Your previous styles here) */
    </style>
</head>
<body>

<!-- (Your previous HTML structure here) -->

<script type="module">
    // (Your Firebase initialization code here)

    // إضافة كود تحويل الكلام إلى نصوص
    function startSpeechRecognition(inputElement) {
        const recognition = new (window.SpeechRecognition || window.webkit.SpeechRecognition)();
        recognition.lang = 'ar-SA'; // اللغة العربية
        recognition.interimResults = false;

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            inputElement.value = transcript;
            inputElement.dispatchEvent(new Event('input')); // لتنشيط أي أحداث مرتبطة بالإدخال
        };

        recognition.onerror = (event) => {
            console.error('خطأ في التعرف على الصوت: ', event.error);
        };

        recognition.start();
    }

    // إضافة زر لتفعيل التعرف على الصوت
    function addSpeechButton(inputId) {
        const inputElement = document.getElementById(inputId);
        const button = document.createElement('button');
        button.innerHTML = '<i class="fas fa-microphone"></i>';
        button.className = 'btn btn-light ms-2';
        button.onclick = () => startSpeechRecognition(inputElement);
        inputElement.parentNode.insertBefore(button, inputElement.nextSibling);
    }

    window.onload = () => {
        // إضافة زر التعرف على الصوت لكل حقل إدخال
        addSpeechButton('customerInput');
        addSpeechButton('orderNote');
    };

    // (Your existing initPage and other functions)
</script>
</body>
</html>
