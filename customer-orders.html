<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طلبات العملاء</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{font-family:Cairo;background:#f5f7f6;padding-bottom:80px}

.header{
background:#0b5e3d;color:#fff;padding:15px;
font-weight:bold;font-size:18px;
}

.card-box{
background:#fff;padding:15px;border-radius:15px;
margin-top:10px;box-shadow:0 2px 8px rgba(0,0,0,.05)
}

.order-card{
background:#fff;padding:15px;border-radius:15px;
margin-top:10px;border-right:5px solid #0b5e3d
}

.btn-save{
background:#0b5e3d;color:#fff;width:100%;
padding:10px;border:none;border-radius:10px
}

.suggest-box{
position:relative
}

.suggest-list{
position:absolute;background:#fff;width:100%;
border:1px solid #ddd;z-index:999;
max-height:150px;overflow:auto
}

.suggest-item{
padding:8px;cursor:pointer
}

.suggest-item:hover{
background:#f1f1f1
}
</style>

</head>

<body>

<div class="header">طلبات العملاء</div>

<div class="container">

<!-- 🔍 Search -->
<input id="searchBox" class="form-control mt-2" placeholder="بحث باسم العميل أو الصنف..." oninput="searchOrders()">

<!-- FORM -->
<div class="card-box">

<!-- 👇 Auto Complete Client -->
<div class="suggest-box">
<input id="customerInput" class="form-control" placeholder="اكتب اسم العميل...">
<div id="suggestList" class="suggest-list d-none"></div>
</div>

<input id="deliveryDate" type="date" class="form-control mt-2">

<div id="itemsContainer"></div>

<button class="btn btn-outline-primary mt-2 w-100" onclick="addItemRow()">+ صنف</button>

<textarea id="notes" class="form-control mt-2" placeholder="ملاحظات"></textarea>

<button class="btn-save mt-2" onclick="saveOrder()">حفظ الطلب</button>

</div>

<div id="ordersContainer"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
apiKey:"AIzaSyAS0NNcZy0-t-LN2WCB7p0941jR0bo-MNls",
authDomain:"ahmedelzaiady.firebaseapp.com",
projectId:"ahmedelzaiady"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let customers = [];
let orders = [];

/* ===== LOAD CUSTOMERS ===== */
async function loadCustomers(){
const snap = await getDocs(collection(db,'customers'));

customers = [];

snap.forEach(d=>{
customers.push(d.data().name);
});
}

/* ===== AUTOCOMPLETE ===== */
const input = document.getElementById("customerInput");
const list = document.getElementById("suggestList");

input.addEventListener("input", ()=>{

let val = input.value.toLowerCase();
list.innerHTML = "";

if(!val){
list.classList.add("d-none");
return;
}

let filtered = customers.filter(c=>c.toLowerCase().includes(val));

filtered.forEach(c=>{
let div = document.createElement("div");
div.className="suggest-item";
div.innerText = c;

div.onclick = ()=>{
input.value = c;
list.classList.add("d-none");
};

list.appendChild(div);
});

list.classList.remove("d-none");

});

/* ===== ITEMS ===== */
window.addItemRow = ()=>{
const div = document.createElement('div');

div.innerHTML = `
<div class="row mt-2">
<div class="col-7">
<input class="form-control item-name" placeholder="الصنف">
</div>
<div class="col-4">
<input class="form-control item-qty" type="number" placeholder="كمية">
</div>
<div class="col-1">
<button class="btn btn-danger btn-sm" onclick="this.parentElement.parentElement.remove()">X</button>
</div>
</div>
`;

document.getElementById('itemsContainer').appendChild(div);
};

/* ===== SAVE ===== */
window.saveOrder = async ()=>{

const customerName = input.value;
const date = document.getElementById('deliveryDate').value;
const notes = document.getElementById('notes').value;

let items = [];

document.querySelectorAll('.item-name').forEach((el,i)=>{
let qty = document.querySelectorAll('.item-qty')[i].value;
if(el.value) items.push(`${el.value} × ${qty}`);
});

await addDoc(collection(db,'customer_orders'),{
customerName,
deliveryDate:date,
items:items.join('\n'),
notes,
status:"new",
timestamp:serverTimestamp()
});

alert("تم الحفظ");
loadOrders();
};

/* ===== LOAD ORDERS ===== */
async function loadOrders(){

const snap = await getDocs(query(collection(db,'customer_orders'),orderBy('timestamp','desc')));

orders = [];

snap.forEach(d=>orders.push(d.data()));

render(orders);
}

/* ===== RENDER ===== */
function render(list){

document.getElementById('ordersContainer').innerHTML =
list.map(o=>`

<div class="order-card">

<h5>${o.customerName}</h5>
<div class="text-muted">${o.deliveryDate}</div
