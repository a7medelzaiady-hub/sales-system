<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل طلبية جديدة - شركة الزيادي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --accent: #0b5e3d;
            --header-bg: #0b5e3d;
            --bg-light: #f4f7f6;
            --text-primary: #1b2e26;
            --text-secondary: #4a5568;
            --border: #dce3de;
            --white: #ffffff;
            --danger: #d90429;
            --warning: #ffb703;
            --card-radius: 18px;
            --input-radius: 12px;
        }

        * { box-sizing: border-box; }

        body {
            background: var(--bg-light);
            font-family: 'Cairo', sans-serif;
            color: var(--text-primary);
            padding-bottom: 100px;
            -webkit-tap-highlight-color: transparent;
        }

        .header-nav {
            background: var(--header-bg);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            color: white;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-btn {
            background: rgba(255,255,255,0.15);
            width: 38px; height: 38px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            color: white; text-decoration: none; border: none; cursor: pointer;
            transition: background 0.2s;
        }
        .nav-btn:hover { background: rgba(255,255,255,0.25); color: white; }

        .main-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--card-radius);
            padding: 16px;
            margin: 14px 0;
            box-shadow: 0 3px 12px rgba(0,0,0,0.04);
        }

        .section-title {
            font-size: 0.78rem;
            font-weight: 800;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .sub-lbl {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
            display: block;
            font-weight: 700;
        }

        .form-control, .form-select {
            border: 1.5px solid var(--border) !important;
            border-radius: var(--input-radius);
            font-size: 0.88rem;
            font-weight: 600;
            padding: 10px 12px;
            background-color: var(--white) !important;
            color: var(--text-primary) !important;
            transition: all 0.2s ease;
            width: 100%;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--accent) !important;
            box-shadow: 0 0 0 3px rgba(11,94,61,0.12) !important;
            outline: none;
        }
        .form-control::placeholder { color: #b0bec5; font-weight: 600; }

        /* Voice Input Box Style */
        .voice-box-container {
            background: #fdfdfd;
            border: 1.5px dashed #b7dfc7;
            border-radius: var(--input-radius);
            padding: 12px;
            margin-bottom: 15px;
        }
        .btn-voice-trigger {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 3px 8px rgba(11,94,61,0.2);
        }
        .btn-voice-trigger.listening {
            background: var(--danger);
            animation: voice-pulse 1.2s infinite;
            box-shadow: 0 3px 10px rgba(217,4,41,0.3);
        }
        @keyframes voice-pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        /* Autocomplete dropdown */
        .autocomplete-wrap { position: relative; }
        .dropdown-list {
            position: absolute;
            width: 100%;
            background: white;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            z-index: 200;
            max-height: 220px;
            overflow-y: auto;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
            display: none;
            margin-top: 4px;
        }
        .dropdown-item-row {
            padding: 10px 14px;
            cursor: pointer;
            border-bottom: 1px solid #f5f5f5;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.15s;
        }
        .dropdown-item-row:last-child { border-bottom: none; }
        .dropdown-item-row:hover { background: #f0faf4; color: var(--accent); }
        .dropdown-item-row .item-stock {
            margin-right: auto;
            font-size: 0.7rem;
            font-weight: 600;
            color: #94a3b8;
            background: #f1f5f9;
            padding: 2px 7px;
            border-radius: 20px;
        }

        /* Customer badge */
        .customer-badge {
            display: none;
            background: #ebf9eb;
            border: 1px solid #b7dfc7;
            border-radius: 10px;
            padding: 8px 12px;
            margin-top: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--accent);
            align-items: center;
            gap: 8px;
        }

        /* Order items */
        .item-row {
            background: #f8faf9;
            border: 1.5px solid var(--border);
            border-radius: var(--input-radius);
            padding: 14px;
            margin-bottom: 12px;
            position: relative;
            animation: fadeInRow 0.25s ease;
        }
        @keyframes fadeInRow {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .remove-row-btn {
            position: absolute;
            left: -8px; top: -8px;
            width: 26px; height: 26px;
            background: white;
            border: none;
            border-radius: 50%;
            color: var(--danger);
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.12);
            display: flex; align-items: center; justify-content: center;
            z-index: 10;
        }

        .stock-hint {
            font-size: 0.72rem;
            color: var(--accent);
            font-weight: 700;
            margin-top: 5px;
            display: none;
        }

        .btn-add-row {
            border: 1.5px dashed var(--accent);
            color: var(--accent);
            background: transparent;
            font-weight: 700;
            border-radius: var(--input-radius);
            padding: 11px;
            width: 100%;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 6px;
        }
        .btn-add-row:hover { background: rgba(11,94,61,0.05); }

        /* Summary bar */
        .summary-bar {
            background: var(--header-bg);
            border-radius: var(--card-radius);
            padding: 14px 16px;
            color: white;
            margin-top: 4px;
        }
        .summary-bar .s-label {
            font-size: 0.68rem;
            opacity: 0.75;
            display: block;
            margin-bottom: 2px;
        }
        .summary-bar .s-val {
            font-size: 1rem;
            font-weight: 800;
        }

        /* Notes */
        .notes-input {
            resize: none;
            font-size: 0.85rem !important;
        }

        /* Submit button */
        .btn-submit {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: var(--input-radius);
            padding: 14px;
            width: 100%;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            margin-top: 14px;
            transition: 0.2s;
            box-shadow: 0 4px 14px rgba(11,94,61,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-submit:active { transform: scale(0.98); }
        .btn-submit:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        /* Items count badge */
        .floating-badge {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 999;
            background: var(--header-bg);
            color: white;
            padding: 8px 14px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.8rem;
            box-shadow: 0 4px 14px rgba(0,0,0,0.18);
            display: flex;
            align-items: center;
            gap: 6px;
            pointer-events: none;
        }
        .floating-badge .num {
            background: var(--warning);
            color: #000;
            padding: 1px 8px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 0.85rem;
        }

        /* Success modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.65);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }
        .modal-box {
            background: white;
            width: 88%;
            max-width: 380px;
            border-radius: var(--card-radius);
            padding: 24px 20px;
            text-align: center;
            box-shadow: 0 12px 40px rgba(0,0,0,0.2);
            animation: popIn 0.25s ease;
        }
        @keyframes popIn {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-icon {
            width: 60px; height: 60px;
            background: #ebf9eb;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 14px;
        }

        /* Error state */
        .field-error {
            border-color: var(--danger) !important;
            box-shadow: 0 0 0 3px rgba(217,4,41,0.1) !important;
        }
        .error-msg {
            font-size: 0.72rem;
            color: var(--danger);
            font-weight: 700;
            margin-top: 4px;
            display: none;
        }
    </style>
</head>
<body>

<!-- Floating items count -->
<div class="floating-badge" id="floatingBadge">
    <i class="fas fa-boxes"></i>
    <span>الأصناف:</span>
    <span class="num" id="badgeCount">0</span>
</div>

<!-- Header -->
<div class="header-nav">
    <a href="all-orders.html" class="nav-btn">
        <i class="fas fa-arrow-right"></i>
    </a>
    <h6 class="m-0 fw-bold d-flex align-items-center gap-2" style="font-size: 0.92rem;">
        <i class="fas fa-cart-plus"></i>
        <span>تسجيل طلبية جديدة</span>
    </h6>
    <a href="index.html" class="nav-btn">
        <i class="fas fa-home"></i>
    </a>
</div>

<div class="container px-3">

    <!-- Customer & Date -->
    <div class="main-card">
        <div class="section-title">
            <i class="fas fa-user-tag"></i> بيانات الطلبية
        </div>

        <div class="row g-2 mb-3">
            <!-- Customer -->
            <div class="col-7">
                <label class="sub-lbl"><i class="fas fa-user me-1"></i> اسم العميل</label>
                <div class="autocomplete-wrap">
                    <input type="text" id="customerInput" class="form-control"
                        placeholder="ابحث عن عميل..."
                        oninput="filterCustomers(this)"
                        autocomplete="off">
                    <input type="hidden" id="customerId">
                    <div class="dropdown-list" id="customerDropdown"></div>
                </div>
                <div class="error-msg" id="customerError">الرجاء اختيار عميل من القائمة</div>
                <div class="customer-badge" id="customerBadge">
                    <i class="fas fa-check-circle"></i>
                    <span id="customerBadgeName"></span>
                </div>
            </div>

            <!-- Date -->
            <div class="col-5">
                <label class="sub-lbl"><i class="fas fa-calendar-alt me-1"></i> التاريخ</label>
                <input type="date" id="orderDate" class="form-control" style="font-size: 0.78rem;">
            </div>
        </div>

        <!-- Notes -->
        <div>
            <label class="sub-lbl"><i class="fas fa-sticky-note me-1"></i> ملاحظات (اختياري)</label>
            <textarea id="orderNotes" class="form-control notes-input" rows="2" placeholder="أي ملاحظات على الطلبية..."></textarea>
        </div>
    </div>

    <!-- Items -->
    <div class="main-card">
        <div class="section-title">
            <i class="fas fa-boxes"></i> الأصناف المطلوبة
        </div>

        <!-- خانة الإدخال الصوتي والتحليل الذكي -->
        <div class="voice-box-container">
            <label class="sub-lbl text-success mb-2"><i class="fas fa-magic me-1"></i> خانة الإدخال الصوتي والتحليل الذكي</label>
            <div class="d-flex align-items-center gap-2">
                <button type="button" id="voiceTriggerBtn" class="btn-voice-trigger" onclick="handleVoiceInput()">
                    <i class="fas fa-microphone"></i>
                </button>
                <input type="text" id="voiceStatusInput" class="form-control" readonly 
                    placeholder="اضغط على المايك وتحدث (مثال: واحد كرتونة بترومين توك توك ب 560)" 
                    style="font-size: 0.82rem; background-color: #fafdfb !important;">
            </div>
        </div>

        <div id="itemsContainer">
            <!-- rows injected here -->
        </div>

        <button class="btn-add-row" onclick="addItemRow()">
            <i class="fas fa-plus-circle me-1"></i> إضافة صنف يدوي
        </button>

        <div class="error-msg" id="itemsError" style="display: none; margin-top: -4px; margin-bottom: 8px;">
            الرجاء إضافة صنف واحد على الأقل
        </div>

        <!-- Summary -->
        <div class="summary-bar mt-3">
            <div class="row text-center g-0">
                <div class="col-4" style="border-left: 1px solid rgba(255,255,255,0.2);">
                    <span class="s-label">عدد الأصناف</span>
                    <span class="s-val" id="summaryItems">0</span>
                </div>
                <div class="col-4" style="border-left: 1px solid rgba(255,255,255,0.2);">
                    <span class="s-label">إجمالي الكميات</span>
                    <span class="s-val" id="summaryQty">0</span>
                </div>
                <div class="col-4">
                    <span class="s-label">إجمالي القيمة</span>
                    <span class="s-val" id="summaryTotal">0.00 ج.م</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Submit -->
    <button class="btn-submit" id="submitBtn" onclick="submitOrder()">
        <i class="fas fa-paper-plane"></i>
        تسجيل الطلبية
    </button>

</div>

<!-- Success Modal -->
<div class="modal-overlay" id="successModal" style="display: none;">
    <div class="modal-box">
        <div class="modal-icon">
            <i class="fas fa-check-circle" style="color: var(--accent); font-size: 2rem;"></i>
        </div>
        <h5 class="fw-bold mb-1" style="color: var(--text-primary);">تم تسجيل الطلبية!</h5>
        <p style="color: #64748b; font-size: 0.85rem; margin-bottom: 20px;">
            تم حفظ طلبية العميل <b id="successCustomerName"></b> بنجاح
        </p>
        <div class="d-flex gap-2">
            <button class="btn btn-success w-100 fw-bold py-2" style="border-radius: 10px; font-size: 0.9rem;" onclick="goToOrders()">
                <i class="fas fa-list me-1"></i> عرض كل الطلبات
            </button>
            <button class="btn btn-light w-100 fw-bold py-2 text-success" style="border-radius: 10px; border: 1.5px solid #c3e6cb; font-size: 0.9rem;" onclick="resetForm()">
                <i class="fas fa-plus me-1"></i> طلبية جديدة
            </button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import {
        getFirestore,
        collection,
        getDocs,
        addDoc,
        updateDoc,
        getDoc,
        doc,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
        authDomain: "ahmedelzaiady.firebaseapp.com",
        projectId: "ahmedelzaiady",
        storageBucket: "ahmedelzaiady.firebasestorage.app",
        messagingSenderId: "300306825071",
        appId: "1:300306825071:web:0426ddde56280fa090329a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let customers = [];
    let inventory = [];
    let rowCounter = 0;
    let editOrderId = null;

    // ---------- init ----------
    async function init() {
        document.getElementById('orderDate').value = new Date().toISOString().split('T')[0];

        // load cache first
        const cCache = localStorage.getItem('cache_customers');
        const iCache = localStorage.getItem('cache_inventory');
        if (cCache) customers = JSON.parse(cCache);
        if (iCache) inventory = JSON.parse(iCache);

        addItemRow(); // start with one empty row

        // fetch fresh
        const [cSnap, iSnap] = await Promise.all([
            getDocs(collection(db, 'customers')),
            getDocs(collection(db, 'inventory'))
        ]);
        customers = cSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        inventory = iSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        localStorage.setItem('cache_customers', JSON.stringify(customers));
        localStorage.setItem('cache_inventory', JSON.stringify(inventory));
    }

    // ---------- customer search ----------
    window.filterCustomers = (input) => {
        const term = input.value.trim().toLowerCase();
        const dd = document.getElementById('customerDropdown');
        document.getElementById('customerId').value = '';
        hideBadge();

        if (!term) { dd.style.display = 'none'; return; }

        const filtered = customers.filter(c => c.name.toLowerCase().includes(term));

        if (!filtered.length) {
            dd.innerHTML = `<div class="dropdown-item-row" style="color:#94a3b8; cursor:default;"><i class="fas fa-exclamation-circle me-1"></i> لا يوجد عميل بهذا الاسم</div>`;
            dd.style.display = 'block';
            return;
        }

        dd.innerHTML = filtered.map(c => `
            <div class="dropdown-item-row" onclick="selectCustomer('${c.id}', '${c.name}')">
                <i class="fas fa-user-circle" style="color: var(--accent);"></i>
                ${c.name}
            </div>
        `).join('');
        dd.style.display = 'block';
    };

    window.selectCustomer = (id, name) => {
        document.getElementById('customerInput').value = name;
        document.getElementById('customerId').value = id;
        document.getElementById('customerDropdown').style.display = 'none';
        document.getElementById('customerError').style.display = 'none';
        document.getElementById('customerInput').classList.remove('field-error');
        showBadge(name);
    };

    function showBadge(name) {
        const badge = document.getElementById('customerBadge');
        document.getElementById('customerBadgeName').innerText = name;
        badge.style.display = 'flex';
    }
    function hideBadge() {
        document.getElementById('customerBadge').style.display = 'none';
    }

    // close dropdown when clicking outside
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.autocomplete-wrap')) {
            document.querySelectorAll('.dropdown-list').forEach(d => d.style.display = 'none');
        }
    });

    // ---------- item rows ----------
    window.addItemRow = () => {
        rowCounter++;
        const id = 'itemrow_' + rowCounter;
        const html = `
            <div class="item-row" id="${id}">
                <button type="button" class="remove-row-btn" onclick="removeRow('${id}')">
                    <i class="fas fa-times"></i>
                </button>

                <div class="row g-2 mb-2">
                    <!-- Product -->
                    <div class="col-8">
                        <label class="sub-lbl">اسم الصنف</label>
                        <div class="autocomplete-wrap">
                            <input type="text" class="form-control p-name" placeholder="ابحث عن صنف..."
                                oninput="filterProducts(this, '${id}')" autocomplete="off">
                            <input type="hidden" class="p-id">
                            <div class="dropdown-list p-dropdown"></div>
                        </div>
                        <div class="stock-hint p-stock"><i class="fas fa-warehouse me-1"></i><span></span></div>
                    </div>
                    <!-- Unit -->
                    <div class="col-4">
                        <label class="sub-lbl">الوحدة</label>
                        <select class="form-select p-unit" onchange="onUnitChange(this, '${id}')">
                            <option value="box">كرتونة</option>
                            <option value="pcs">قطعة</option>
                        </select>
                    </div>
                </div>

                <div class="row g-2">
                    <div class="col-4">
                        <label class="sub-lbl">الكمية</label>
                        <input type="number" class="form-control p-qty" value="1" min="1" oninput="recalc()">
                    </div>
                    <div class="col-4">
                        <label class="sub-lbl">السعر</label>
                        <input type="number" class="form-control p-price" placeholder="0.00" oninput="recalc()">
                    </div>
                    <div class="col-4">
                        <label class="sub-lbl">الإجمالي</label>
                        <input type="text" class="form-control p-sub" readonly
                            style="background:#f0f4f2!important; font-weight:800; color: var(--accent)!important;">
                    </div>
                </div>
            </div>
        `;
        document.getElementById('itemsContainer').insertAdjacentHTML('beforeend', html);
        recalc();
        return id;
    };

    window.removeRow = (id) => {
        document.getElementById(id)?.remove();
        recalc();
    };

    // ------------------ دالة الفلترة والبحث الذكي المحدثة بالكامل ------------------
    window.filterProducts = (input, rowId, isVoiceMode = false) => {
        const term = input.value.trim().toLowerCase();
        const row = document.getElementById(rowId);
        const dd = row.querySelector('.p-dropdown');
        row.querySelector('.p-id').value = '';
        row.querySelector('.p-stock').style.display = 'none';

        if (!term) { dd.style.display = 'none'; return; }

        // 1. فحص وجود تطابق تام 100% مع أي صنف مسجل لمنع إظهار أي اقتراحات
        const exactMatch = inventory.find(i => i.name.trim().toLowerCase() === term);
        if (exactMatch) {
            dd.style.display = 'none';
            if (isVoiceMode) {
                // إذا كنا في وضع الإدخال الصوتي، نختار الصنف المتطابق مباشرة
                window.selectProduct(rowId, exactMatch.id, exactMatch.name);
            }
            return;
        }

        // 2. فحص ذكي بالكلمات المتفرقة وحساب وزن التشابه لتقريب النتائج
        const searchWords = term.split(/\s+/).filter(w => w.length > 0);
        
        let scoredItems = [];

        inventory.forEach(item => {
            const itemNameLower = item.name.toLowerCase();
            let matchedWordsCount = 0;

            searchWords.forEach(word => {
                if (itemNameLower.includes(word)) {
                    matchedWordsCount++;
                }
            });

            // لحساب الأولوية: الأصناف التي تبدأ بنفس الكلمة الأولى تأخذ ترتيباً أعلى
            let bonus = 0;
            if (searchWords.length > 0 && itemNameLower.startsWith(searchWords[0])) {
                bonus = 0.5;
            }

            if (matchedWordsCount > 0) {
                scoredItems.push({
                    item: item,
                    score: matchedWordsCount + bonus
                });
            }
        });

        // ترتيب الأصناف تنازلياً حسب الأعلى تشابهاً
        scoredItems.sort((a, b) => b.score - a.score);

        // جلب أقرب 3 أصناف متشابهة فقط بناءً على طلبك
        const finalSuggestions = scoredItems.slice(0, 3).map(si => si.item);

        if (!finalSuggestions.length) {
            dd.innerHTML = `<div class="dropdown-item-row" style="color:#94a3b8; cursor:default;">لا يوجد صنف بهذا الاسم</div>`;
            dd.style.display = 'block';
            return;
        }

        // 3. بناء وعرض قائمة الاقتراحات (أقرب 3 أصناف)
        dd.innerHTML = finalSuggestions.map(p => `
            <div class="dropdown-item-row" onclick="selectProduct('${rowId}', '${p.id}', '${p.name}')">
                <i class="fas fa-box" style="color: var(--accent); font-size: 0.75rem;"></i>
                ${p.name}
                <span class="item-stock">${p.totalPcs || 0} ق</span>
            </div>
        `).join('');
        dd.style.display = 'block';
    };

    window.selectProduct = (rowId, pid, pname) => {
        const row = document.getElementById(rowId);
        row.querySelector('.p-name').value = pname;
        row.querySelector('.p-id').value = pid;
        row.querySelector('.p-dropdown').style.display = 'none';

        const p = inventory.find(i => i.id === pid);
        if (p) {
            const stockHint = row.querySelector('.p-stock');
            stockHint.querySelector('span').innerText = `رصيد المخزن: ${p.totalPcs || 0} قطعة`;
            stockHint.style.display = 'block';
            setRowPrice(row, p);
        }
        recalc();
    };

    window.onUnitChange = (sel, rowId) => {
        const row = document.getElementById(rowId);
        const pid = row.querySelector('.p-id').value;
        if (!pid) { recalc(); return; }
        const p = inventory.find(i => i.id === pid);
        if (p) setRowPrice(row, p);
        recalc();
    };

    function setRowPrice(row, p) {
        const unit = row.querySelector('.p-unit').value;
        const factor = Number(p.unitFactor) || 1;
        const price = unit === 'box' ? (p.sell || 0) : ((p.sell || 0) / factor);
        row.querySelector('.p-price').value = price.toFixed(2);
    }

    window.recalc = () => {
        let totalItems = 0, totalQty = 0, totalVal = 0;
        document.querySelectorAll('.item-row').forEach(row => {
            const qty = parseFloat(row.querySelector('.p-qty').value) || 0;
            const price = parseFloat(row.querySelector('.p-price').value) || 0;
            const sub = qty * price;
            row.querySelector('.p-sub').value = sub.toFixed(2);
            totalItems++;
            totalQty += qty;
            totalVal += sub;
        });

        document.getElementById('summaryItems').innerText = totalItems;
        document.getElementById('summaryQty').innerText = totalQty;
        document.getElementById('summaryTotal').innerText = totalVal.toFixed(2) + ' ج.م';
        document.getElementById('badgeCount').innerText = totalItems;
    };


    // ------------------ محرك الإدخال الصوتي والتحليل الذكي المرن ------------------
    window.handleVoiceInput = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("ميزة الإدخال الصوتي غير مدعومة في متصفحك الحالي. يرجى استخدام متصفح Google Chrome.");
            return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'ar-EG'; 
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        const voiceBtn = document.getElementById('voiceTriggerBtn');
        const statusInput = document.getElementById('voiceStatusInput');

        voiceBtn.classList.add('listening');
        statusInput.value = "جاري الاستماع... تحدث الآن";

        recognition.start();

        recognition.onresult = (event) => {
            const speechResult = event.results[0][0].transcript;
            statusInput.value = speechResult; 
            parseFlexibleVoiceInput(speechResult);
        };

        recognition.onerror = (err) => {
            console.error(err);
            statusInput.value = "فشل التعرف على الصوت، حاول مرة أخرى.";
        };

        recognition.onend = () => {
            voiceBtn.classList.remove('listening');
        };
    };

    function parseFlexibleVoiceInput(text) {
        let originalText = text;
        
        const textNumbersMap = {
            'واحد': 1, 'اتنين': 2, 'إثنين': 2, 'تلاتة': 3, 'تلاته': 3, 'ثلاثة': 3, 
            'اربعة': 4, 'اربعه': 4, 'أربعة': 4, 'خمسة': 5, 'خمسه': 5, 'ستة': 6, 
            'سته': 6, 'سبعة': 7, 'سبعه': 7, 'ثمانية': 8, 'تمانية': 8, 'تمانيه': 8, 
            'تسعة': 9, 'تسعه': 9, 'عشرة': 10, 'عشره': 10
        };

        let voiceQty = null;
        Object.keys(textNumbersMap).forEach(word => {
            if (text.startsWith(word) || text.includes(' ' + word + ' ')) {
                voiceQty = textNumbersMap[word];
                text = text.replace(word, '').trim();
            }
        });

        const numbers = text.match(/\d+/g);
        let qty = voiceQty || 1;
        let price = 0;

        if (numbers) {
            if (numbers.length >= 2) {
                const num1 = parseFloat(numbers[0]);
                const num2 = parseFloat(numbers[1]);
                if (num1 > num2) {
                    price = num1;
                    if (!voiceQty) qty = num2;
                } else {
                    price = num2;
                    if (!voiceQty) qty = num1;
                }
            } else if (numbers.length === 1) {
                if (voiceQty) {
                    price = parseFloat(numbers[0]);
                } else {
                    const singleNum = parseFloat(numbers[0]);
                    if (singleNum > 50) {
                        price = singleNum;
                        qty = 1;
                    } else {
                        qty = singleNum;
                    }
                }
            }
        }

        let unitValue = 'box';
        if (originalText.includes('قطعة') || originalText.includes('قطعه') || originalText.includes('حتة') || originalText.includes('حته') || originalText.includes('ق')) {
            unitValue = 'pcs';
        }

        let productName = text;
        if (numbers) {
            numbers.forEach(num => { productName = productName.replace(num, ''); });
        }
        
        const scrapWords = [
            'كرتونة', 'كرتونه', 'علبة', 'علبه', 'قطعة', 'قطعه', 'حتة', 'حته', 
            'بكام', 'بسعر', 'بـ', 'جنيه', 'ج م', ' من ', 'عدد', ' سعر '
        ];
        
        scrapWords.forEach(word => {
            productName = productName.split(word).join(' ');
        });

        productName = productName.replace(/\s+ب\s+/g, ' '); 
        productName = productName.replace(/\s+ب$/g, ' '); 
        productName = productName.replace(/\s+/g, ' ').trim();

        if (!productName || productName.length < 2) {
            productName = originalText;
        }

        const rows = document.querySelectorAll('.item-row');
        let targetRowId;
        
        if (rows.length === 1 && rows[0].querySelector('.p-id').value === '' && rows[0].querySelector('.p-name').value === '') {
            targetRowId = rows[0].id;
        } else {
            targetRowId = window.addItemRow();
        }

        const targetRow = document.getElementById(targetRowId);

        targetRow.querySelector('.p-qty').value = qty;
        if (price > 0) {
            targetRow.querySelector('.p-price').value = price;
        }
        targetRow.querySelector('.p-unit').value = unitValue;
        
        const nameInput = targetRow.querySelector('.p-name');
        nameInput.value = productName;

        // استدعاء دالة الفلترة الذكية الجديدة مع تفعيل وضع الإدخال الصوتي
        window.filterProducts(nameInput, targetRowId, true);

        // محاولة محاكاة النقر على النتيجة المقترحة الأولى إذا لم يتوفر تطابق كامل فوراً
        setTimeout(() => {
            const dd = targetRow.querySelector('.p-dropdown');
            if (dd.style.display !== 'none') {
                const firstOption = dd.querySelector('.dropdown-item-row');
                if (firstOption && !firstOption.innerText.includes('لا يوجد صنف')) {
                    firstOption.click();
                }
            }
        }, 300);

        window.recalc();
    }


    // ---------- submit ----------
    window.submitOrder = async () => {
        let valid = true;

        const customerId = document.getElementById('customerId').value;
        const customerName = document.getElementById('customerInput').value.trim();

        if (!customerId) {
            document.getElementById('customerInput').classList.add('field-error');
            document.getElementById('customerError').style.display = 'block';
            valid = false;
        }

        const rows = document.querySelectorAll('.item-row');
        let items = [];
        rows.forEach(row => {
            const pid = row.querySelector('.p-id').value;
            const name = row.querySelector('.p-name').value;
            const unit = row.querySelector('.p-unit').value;
            const qty = parseFloat(row.querySelector('.p-qty').value) || 0;
            const price = parseFloat(row.querySelector('.p-price').value) || 0;
            if (pid && qty > 0) {
                items.push({ stockId: pid, name, unit, qty, price });
            }
        });

        if (!items.length) {
            document.getElementById('itemsError').style.display = 'block';
            valid = false;
        } else {
            document.getElementById('itemsError').style.display = 'none';
        }

        if (!valid) return;

        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> جاري الحفظ...';

        try {
            const total = items.reduce((s, i) => s + i.qty * i.price, 0);
            const orderData = {
                customerId,
                customerName,
                items,
                total,
                notes: document.getElementById('orderNotes').value.trim(),
                date: document.getElementById('orderDate').value,
                timestamp: serverTimestamp(),
                status: 'pending'
            };

            if (editOrderId) {
                await updateDoc(doc(db, 'orders', editOrderId), orderData);
            } else {
                await addDoc(collection(db, 'orders'), orderData);
            }

            document.getElementById('successCustomerName').innerText = customerName;
            document.querySelector('.modal-box h5').innerText = editOrderId ? 'تم تعديل الطلبية!' : 'تم تسجيل الطلبية!';
            document.getElementById('successModal').style.display = 'flex';

        } catch (e) {
            console.error(e);
            alert('حدث خطأ أثناء الحفظ، حاول مرة أخرى');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-paper-plane"></i> تسجيل الطلبية';
        }
    };

    window.goToOrders = () => {
        window.location.href = 'all-orders.html';
    };

    window.resetForm = () => {
        document.getElementById('successModal').style.display = 'none';
        document.getElementById('customerInput').value = '';
        document.getElementById('customerId').value = '';
        document.getElementById('orderNotes').value = '';
        document.getElementById('voiceStatusInput').value = '';
        document.getElementById('orderDate').value = new Date().toISOString().split('T')[0];
        document.getElementById('itemsContainer').innerHTML = '';
        hideBadge();
        rowCounter = 0;
        editOrderId = null;
        addItemRow();
        recalc();
        document.getElementById('submitBtn').innerHTML = '<i class="fas fa-paper-plane"></i> تسجيل الطلبية';
    };

    // ------------------ تحميل الطلبية للتعديل ------------------
    async function loadOrderForEdit() {
        const params = new URLSearchParams(window.location.search);
        editOrderId = params.get("editOrderId");

        if (!editOrderId) return;

        try {
            const orderRef = doc(db, "orders", editOrderId);
            const orderSnap = await getDoc(orderRef);

            if (!orderSnap.exists()) {
                alert("الطلبية غير موجودة");
                return;
            }

            const order = orderSnap.data();

            document.getElementById("customerInput").value = order.customerName || "";
            document.getElementById("customerId").value = order.customerId || "";
            document.getElementById("orderDate").value = order.date || "";
            document.getElementById("orderNotes").value = order.notes || "";

            showBadge(order.customerName);

            document.getElementById("itemsContainer").innerHTML = "";
            rowCounter = 0;

            order.items.forEach(item => {
                addItemRow();

                const rowsNow = document.querySelectorAll(".item-row");
                const currentRow = rowsNow[rowsNow.length - 1];

                currentRow.querySelector(".p-name").value = item.name;
                currentRow.querySelector(".p-id").value = item.stockId;
                currentRow.querySelector(".p-unit").value = item.unit;
                currentRow.querySelector(".p-qty").value = item.qty;
                currentRow.querySelector(".p-price").value = item.price;
            });

            recalc();
            document.getElementById("submitBtn").innerHTML = '<i class="fas fa-save"></i> حفظ التعديلات';

        } catch (err) {
            console.error(err);
        }
    }

    // ------------------ تشغيل التهيئة ------------------
    await init();
    await loadOrderForEdit();
</script>
