# صفحة طلبات العملاء - شركة الزيادي

```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طلبات العملاء</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
    --main:#0b5e3d;
    --bg:#f5f7f6;
    --border:#dce3de;
}

body{
    background:var(--bg);
    font-family:'Cairo',sans-serif;
    padding-bottom:100px;
}

.header{
    background:var(--main);
    color:#fff;
    padding:15px;
    position:sticky;
    top:0;
    z-index:1000;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.card-box{
    background:#fff;
    border-radius:18px;
    padding:15px;
    margin-top:15px;
    border:1px solid var(--border);
}

.order-card{
    background:#fff;
    border-radius:18px;
    padding:15px;
    margin-bottom:12px;
    border-right:5px solid var(--main);
    box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.order-late{
    border-right-color:#dc3545;
}

.order-tomorrow{
    border-right-color:#ffc107;
}

.order-done{
    border-right-color:#198754;
}

.form-control,.form-select{
    border-radius:12px;
}

.btn-save{
    background:var(--main);
    color:#fff;
    border:none;
    border-radius:12px;
    padding:12px;
    width:100%;
    font-weight:700;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-top:15px;
}

.stat{
    background:#fff;
    padding:10px;
    border-radius:15px;
    text-align:center;
    border:1px solid var(--border);
}

.stat h5{
    margin:0;
    font-weight:700;
}

.small-text{
    font-size:12px;
    color:#666;
}
</style>
</head>
<body>

<div class="header">
    <a href="index1.html" class="text-white">
        <i class="fas fa-arrow-right"></i>
    </a>

    <h5 class="m-0">طلبات العملاء</h5>

    <i class="fas fa-bell"></i>
</div>

<div class="container">

    <div class="stats">
        <div class="stat">
            <div class="small-text">طلبات اليوم</div>
            <h5 id="todayCount">0</h5>
        </div>

        <div class="stat">
            <div class="small-text">طلبات غداً</div>
            <h5 id="tomorrowCount">0</h5>
        </div>

        <div class="stat">
            <div class="small-text">متأخرة</div>
            <h5 id="lateCount">0</h5>
        </div>

        <div class="stat">
            <div class="small-text">تم التسليم</div>
            <h5 id="doneCount">0</h5>
        </div>
    </div>


    <div class="card-box">

        <div class="row g-2">

            <div class="col-12">
                <label>اسم العميل</label>
                <input type="text" id="customerName" class="form-control">
            </div>

            <div class="col-6">
                <label>رقم الهاتف</label>
                <input type="text" id="customerPhone" class="form-control">
            </div>

            <div class="col-6">
                <label>تاريخ التسليم</label>
                <input type="date" id="deliveryDate" class="form-control">
            </div>

            <div class="col-12">
                <label>الأصناف المطلوبة</label>
                <textarea id="items" class="form-control" rows="3" placeholder="مثال:
5 شل أصفر
2 موبيل 1"></textarea>
            </div>

            <div class="col-12">
                <label>ملاحظات</label>
                <textarea id="notes" class="form-control"></textarea>
            </div>

            <div class="col-12 mt-3">
                <button class="btn-save" onclick="saveOrder()">
                    <i class="fas fa-save me-1"></i>
                    حفظ الطلب
                </button>
            </div>

        </div>

    </div>


    <div class="mt-4" id="ordersContainer"></div>

</div>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    query,
    orderBy,
    serverTimestamp,
    updateDoc,
    doc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
  authDomain: "ahmedelzaiady.firebaseapp.com",
  projectId: "ahmedelzaiady",
  storageBucket: "ahmedelzaiady.firebasestorage.app",
  messagingSenderId: "300306825071",
  appId: "1:300306825071:web:0426ddde56280fa090329a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allOrders = [];

window.saveOrder = async () => {

    const customerName =
        document.getElementById('customerName').value;

    const customerPhone =
        document.getElementById('customerPhone').value;

    const deliveryDate =
        document.getElementById('deliveryDate').value;

    const items =
        document.getElementById('items').value;

    const notes =
        document.getElementById('notes').value;

    if(!customerName || !deliveryDate || !items){
        return alert('اكمل البيانات');
    }

    await addDoc(collection(db,'customer_orders'),{

        customerName,
        customerPhone,
        deliveryDate,
        items,
        notes,
        status:'new',
        orderDate:new Date().toISOString().split('T')[0],
        timestamp:serverTimestamp()

    });

    alert('تم حفظ الطلب ✅');

    document.getElementById('customerName').value='';
    document.getElementById('customerPhone').value='';
    document.getElementById('items').value='';
    document.getElementById('notes').value='';

    loadOrders();

};


async function loadOrders(){

    const snap = await getDocs(
        query(
            collection(db,'customer_orders'),
            orderBy('timestamp','desc')
        )
    );

    allOrders = [];

    snap.forEach(docu=>{
        allOrders.push({
            id:docu.id,
            ...docu.data()
        });
    });

    renderOrders();
    checkNotifications();

}


function renderOrders(){

    const container =
        document.getElementById('ordersContainer');

    if(allOrders.length===0){

        container.innerHTML =
        '<div class="text-center text-muted mt-5">لا توجد طلبيات</div>';

        return;
    }

    let todayCount = 0;
    let tomorrowCount = 0;
    let lateCount = 0;
    let doneCount = 0;

    const today = new Date();
    today.setHours(0,0,0,0);

    container.innerHTML = allOrders.map(order=>{

        const d = new Date(order.deliveryDate);
        d.setHours(0,0,0,0);

        const diff = Math.ceil(
            (d - today) / (1000*60*60*24)
        );

        let className = '';

        if(order.status === 'done'){
            className = 'order-done';
            doneCount++;
        }
        else if(diff < 0){
            className = 'order-late';
            lateCount++;
        }
        else if(diff === 1){
            className = 'order-tomorrow';
            tomorrowCount++;
        }
        else if(diff === 0){
            todayCount++;
        }

        return `

        <div class="order-card ${className}">

            <div class="d-flex justify-content-between">

                <div>
                    <h6 class="fw-bold mb-1">
                        ${order.customerName}
                    </h6>

                    <div class="small-text">
                        ${order.customerPhone || ''}
                    </div>
                </div>

                <div class="text-end">
                    <div class="small-text">ميعاد التسليم</div>
                    <div class="fw-bold">${order.deliveryDate}</div>
                </div>

            </div>

            <hr>

            <div class="mb-2">
                <strong>الطلبات:</strong><br>
                ${order.items.replace(/\n/g,'<br>')}
            </div>

            ${order.notes ? `
                <div class="mb-2 text-muted">
                    ${order.notes}
                </div>
            ` : ''}

            <button class="btn btn-success w-100 mt-2"
                onclick="markDone('${order.id}')">
                تم التسليم
            </button>

        </div>

        `;

    }).join('');

    document.getElementById('todayCount').innerText =
        todayCount;

    document.getElementById('tomorrowCount').innerText =
        tomorrowCount;

    document.getElementById('lateCount').innerText =
        lateCount;

    document.getElementById('doneCount').innerText =
        doneCount;

}


window.markDone = async(id)=>{

    await updateDoc(
        doc(db,'customer_orders',id),
        {
            status:'done'
        }
    );

    loadOrders();

}


function checkNotifications(){

    const today = new Date();
    today.setHours(0,0,0,0);

    allOrders.forEach(order=>{

        if(order.status === 'done') return;

        const d = new Date(order.deliveryDate);
        d.setHours(0,0,0,0);

        const diff = Math.ceil(
            (d - today) / (1000*60*60*24)
        );

        if(diff === 1){

            setTimeout(()=>{

                alert(
                    `🔔 تنبيه\nغداً موعد طلبية ${order.customerName}`
                );

            },1000);

        }

    });

}

loadOrders();

</script>
</body>
</html>
```
