<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>جرد السيارة اليومي - الزيادي</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root{
  --main:#0f5132;
  --bg:#f4f7f6;
  --border:#d1d5db;
}

body{
  font-family:Cairo;
  background:var(--bg);
  font-size:0.85rem;
}

.header{
  background:var(--main);
  color:#fff;
  padding:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
}

.panel{
  background:#fff;
  margin:10px;
  padding:10px;
  border-radius:10px;
}

input{
  height:42px;
  font-weight:700;
}

.search-box{
  position:relative;
}

.suggestions{
  position:absolute;
  width:100%;
  background:#fff;
  border:2px solid var(--main);
  border-radius:10px;
  max-height:250px;
  overflow:auto;
  display:none;
  z-index:999;
}

.suggestion{
  padding:10px;
  cursor:pointer;
  border-bottom:1px solid #eee;
}

.suggestion:hover{
  background:var(--main);
  color:#fff;
}

table{
  width:100%;
  background:#fff;
  border-collapse:collapse;
}

th,td{
  border:1px solid #ddd;
  text-align:center;
  padding:6px;
}

th{
  background:#eee;
}

input.small{
  width:70px;
  text-align:center;
  font-weight:700;
}

.btn-save{
  width:100%;
  background:var(--main);
  color:#fff;
  height:45px;
  border:none;
  border-radius:8px;
  font-weight:700;
}
</style>
</head>

<body>

<div class="header">
  <button onclick="history.back()"><i class="fas fa-arrow-right"></i></button>
  <div>جرد السيارة اليومي</div>
  <button onclick="window.print()"><i class="fas fa-print"></i></button>
</div>

<div class="panel">
  <input type="date" id="date">

  <div class="search-box mt-2">
    <input type="text" id="search" placeholder="ابحث عن صنف...">
    <div class="suggestions" id="suggestions"></div>
  </div>

  <button class="btn-save mt-2" onclick="save()">حفظ الجرد</button>
</div>

<div class="panel">
  <table>
    <thead>
      <tr>
        <th>الصنف</th>
        <th>تحميل جركن</th>
        <th>تحميل كرتون</th>
        <th>مرتجع جركن</th>
        <th>مرتجع كرتون</th>
        <th>صافي</th>
      </tr>
    </thead>
    <tbody id="body"></tbody>
  </table>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
getFirestore, collection, getDocs,
doc, setDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
apiKey:"YOUR_KEY",
authDomain:"YOUR_DOMAIN",
projectId:"YOUR_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let products = [];

document.getElementById("date").value = new Date().toISOString().split("T")[0];

await loadProducts();

document.getElementById("search").addEventListener("input", e=>{
search(e.target.value);
});

async function loadProducts(){
const snap = await getDocs(collection(db,"products"));
snap.forEach(d=>{
products.push({id:d.id,...d.data()});
});
}

function search(q){
const box=document.getElementById("suggestions");

if(!q){
box.style.display="none";
return;
}

let res=products.filter(p=>p.name.includes(q)).slice(0,8);

box.innerHTML=res.map(p=>
`<div class="suggestion" onclick="add('${p.id}','${p.name}')">${p.name}</div>`
).join("");

box.style.display="block";
}

window.add=(id,name)=>{
document.getElementById("search").value="";
document.getElementById("suggestions").style.display="none";

document.getElementById("body").innerHTML+=`
<tr data-id="${id}" data-name="${name}">
<td>${name}</td>
<td><input class="small" id="lj_${id}" type="number" value="0"></td>
<td><input class="small" id="lb_${id}" type="number" value="0"></td>
<td><input class="small" id="rj_${id}" type="number" value="0"></td>
<td><input class="small" id="rb_${id}" type="number" value="0"></td>
<td id="s_${id}">0</td>
</tr>`;
}

window.save=async()=>{
const date=document.getElementById("date").value;
const rows=document.querySelectorAll("#body tr");

for(let r of rows){
let id=r.dataset.id;
let name=r.dataset.name;

await setDoc(doc(db,"daily_stock_logs",date,"items",id),{
name,
load_jar:+document.getElementById("lj_"+id).value,
load_box:+document.getElementById("lb_"+id).value,
return_jar:+document.getElementById("rj_"+id).value,
return_box:+document.getElementById("rb_"+id).value
});
}

alert("تم الحفظ بنجاح");
};

</script>

</body>
</html>
