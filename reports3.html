<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>مطابقة جرد التوزيع - الزيادي</title>
    <!-- Bootstrap RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #0b6641;
            --primary-hover: #084d31;
            --bg-color: #f4f6f9;
            --card-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
        }
        
        body {
            background-color: var(--bg-color);
            font-family: 'Cairo', sans-serif;
            color: #333;
        }

        .main-header {
            background: linear-gradient(135deg, var(--primary-color), #148554);
            color: white;
            padding: 25px 0;
            border-bottom-left-radius: 25px;
            border-bottom-right-radius: 25px;
            box-shadow: 0 4px 15px rgba(11, 102, 65, 0.15);
            margin-bottom: 25px;
        }

        .main-header h3 { font-weight: 700; margin: 0; font-size: 1.6rem; }

        .custom-card {
            background: #ffffff;
            border: none;
            border-radius: 18px;
            box-shadow: var(--card-shadow);
            padding: 22px;
            margin-bottom: 22px;
        }

        .form-label { font-weight: 600; color: #444; margin-bottom: 6px; }
        .form-control { border-radius: 10px; padding: 10px 15px; }
        .form-control:focus { border-color: var(--primary-color); box-shadow: 0 0 0 0.25rem rgba(11, 102, 65, 0.15); }

        .table-responsive { border-radius: 12px; overflow: hidden; border: 1px solid #eef0f3; }
        .table th { background-color: var(--primary-color) !important; color: white !important; font-weight: 600; padding: 14px; border: none; }
        .table td { padding: 12px; vertical-align: middle; }

        /* حقول القراءة فقط */
        .readonly-input { background-color: #f8f9fa !important; font-weight: 600; color: #495057; text-align: center; }
        
        /* حالة الفارق */
        .status-badge { font-weight: 700; padding: 6px 12px; border-radius: 8px; display: inline-block; min-width: 90px; }
        .status-match { background-color: #d1e7dd; color: #0f5132; }
        .status-shortage { background-color: #f8d7da; color: #842029; }
        .status-surplus { background-color: #fff3cd; color: #664d03; }

        .btn-custom { border-radius: 10px; padding: 10px 20px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s; }
        .btn-sync { background-color: #2196f3; color: white; }
        .btn-sync:hover { background-color: #1e88e5; color: white; }

        @media print {
            body { background: white; }
            .main-header { background: #0b6641 !important; color: white !important; border-radius: 0; padding: 15px 0; }
            .btn-custom, .btn { display: none !important; }
            .custom-card { box-shadow: none; padding: 0; }
            .form-control { border: 1px solid #000 !important; }
        }
    </style>
</head>
<body>

<div class="main-header text-center">
    <div class="container">
        <h3><i class="fas fa-calculator me-2"></i> مطابقة مبيعات وجرد سيارات التوزيع</h3>
    </div>
</div>

<div class="container">
    <!-- فلتر التاريخ والمزامنة -->
    <div class="custom-card">
        <div class="row align-items-end g-3">
            <div class="col-md-4">
                <label class="form-label"><i class="fas fa-calendar-day text-muted me-1"></i> تاريخ الجرد والمبيعات</label>
                <input id="date" type="date" class="form-control" onchange="syncSystemData()">
            </div>
            <div class="col-md-8 text-md-start">
                <button class="btn btn-custom btn-sync" onclick="syncSystemData()">
                    <i class="fas fa-sync-alt"></i> جلب البيانات من المخزن والفواتير
                </button>
            </div>
        </div>
    </div>

    <!-- جدول مطابقة الجرد -->
    <div class="custom-card">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h5 class="m-0 text-success" style="font-weight: 700;"><i class="fas fa-layer-group me-1"></i> تقرير المطابقة والمراقبة</h5>
            <span class="badge bg-secondary p-2" id="sync-status">جاهز للمزامنة</span>
        </div>
        
        <div class="table-responsive mb-3">
            <table class="table table-hover text-center align-middle" id="tbl">
                <thead>
                    <tr>
                        <th style="width: 30%;">الصنف</th>
                        <th style="width: 15%;">المنصرف من المخزن</th>
                        <th style="width: 15%;">المبيعات (الفواتير)</th>
                        <th style="width: 15%;">المتبقي النظري</th>
                        <th style="width: 15%;">الجرد الفعلي بالسيارة</th>
                        <th style="width: 10%;">حالة الفارق</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="6" class="text-muted py-4">يرجى الضغط على زر جلب البيانات أو اختيار التاريخ أولاً</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="text-start">
            <button class="btn btn-custom btn-dark" onclick="window.print()">
                <i class="fas fa-print"></i> طباعة تقرير المطابقة
            </button>
        </div>
    </div>
</div>

<script>
// تعيين تاريخ اليوم تلقائياً
document.getElementById('date').valueAsDate = new Date();

// 1. محاكاة بيانات المخزن وفواتير المبيعات (Mock Database)
// في النظام الفعلي، سيتم جلب هذه البيانات من السيرفر عبر API
const mockSystemData = {
    "warehouse_loads": [
        { product: "كرتونة مياه معدنية صغير", qty: 200 },
        { product: "كرتونة مياه معدنية كبير", qty: 100 },
        { product: "صندوق عصير تفاح", qty: 80 },
        { product: "صندوق عصير برتقال", qty: 120 },
        { product: "باكيت كولا علب", qty: 150 }
    ],
    "sales_invoices": [
        { product: "كرتونة مياه معدنية صغير", qty: 145 },
        { product: "كرتونة مياه معدنية كبير", qty: 70 },
        { product: "صندوق عصير تفاح", qty: 75 },
        { product: "صندوق عصير برتقال", qty: 110 },
        { product: "باكيت كولا علب", qty: 130 }
    ]
};

// 2. دالة جلب البيانات ومزامنتها تلقائياً
function syncSystemData() {
    let tbody = document.querySelector('#tbl tbody');
    tbody.innerHTML = ""; // تفريغ الجدول

    // دمج البيانات بناءً على اسم الصنف
    mockSystemData.warehouse_loads.forEach(loadItem => {
        // البحث عن مبيعات نفس الصنف في الفواتير
        let salesItem = mockSystemData.sales_invoices.find(s => s.product === loadItem.product);
        let soldQty = salesItem ? salesItem.qty : 0;
        
        // المتبقي النظري = المنصرف من المخزن - المبيعات في الفواتير
        let theoreticalRemain = loadItem.qty - soldQty;

        let tr = document.createElement('tr');
        tr.innerHTML = `
            <td class="text-start fw-bold">${loadItem.product}</td>
            <td><input class="form-control readonly-input load-qty" value="${loadItem.qty}" readonly></td>
            <td><input class="form-control readonly-input sold-qty" value="${soldQty}" readonly></td>
            <td><input class="form-control readonly-input theoretical-qty" value="${theoreticalRemain}" id="theory-${loadItem.product}" readonly style="background-color: #f1f3f5 !important;"></td>
            <td>
                <input type="number" class="form-control text-center actual-qty" value="0" min="0" oninput="calculateDiscrepancy(this, ${theoreticalRemain})">
            </td>
            <td>
                <span class="status-badge status-shortage" id="status-row">عجز (${theoreticalRemain})</span>
            </td>
        `;
        tbody.appendChild(tr);
    });

    // تحديث حالة المزامنة في الواجهة
    let statusBadge = document.getElementById('sync-status');
    statusBadge.textContent = "تم تحديث البيانات من النظام الفعلي";
    statusBadge.className = "badge bg-success p-2";
}

// 3. دالة حساب الفارق الفوري (المطابقة والرقابة)
function calculateDiscrepancy(inputElement, theoretical) {
    let actual = Number(inputElement.value || 0);
    let row = inputElement.closest('tr');
    let badge = row.querySelector('#status-row');
    
    // الفارق = الجرد الفعلي - المتبقي النظري
    let diff = actual - theoretical;

    if (diff === 0) {
        badge.textContent = "مطابق";
        badge.className = "status-badge status-match";
    } else if (diff < 0) {
        badge.textContent = `عجز (${Math.abs(diff)})`;
        badge.className = "status-badge status-shortage";
    } else {
        badge.textContent = `زيادة (${diff})`;
        badge.className = "status-badge status-surplus";
    }
}

// تشغيل المزامنة تلقائياً عند فتح الصفحة لأول مرة
window.onload = syncSystemData;
</script>

</body>
</html>
