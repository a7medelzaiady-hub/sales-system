<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جرد وحركة عهدة السيارة اليومية - الزيادي للزيوت</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght=400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {   
            --accent: #0b5e3d;          
            --header-bg: #0b5e3d;       
            --bg-light: #f4f7f6;        
            --text-primary: #1b2e26;     
            --border: #dce3de;          
            --white: #ffffff;  
            --danger: #d90429;  
            --success: #2d6a4f;  
            --warning: #ffb703;  
            --card-radius: 12px;  
            --input-radius: 8px;  
        }  
        body {   
            background: var(--bg-light);   
            font-family: 'Cairo', sans-serif;   
            color: var(--text-primary);   
            padding-bottom: 60px;   
            font-size: 0.85rem;  
        }  
        .header-nav {   
            background: var(--header-bg);   
            padding: 12px 15px;   
            display: flex;   
            align-items: center;   
            justify-content: space-between;   
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);   
            color: white;   
            position: sticky;   
            top: 0;   
            z-index: 1000;  
        }  
        .back-btn { background: rgba(255,255,255,0.2); width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; text-decoration: none; font-size: 0.9rem; border: none; }  
        .back-btn:hover { background: rgba(255,255,255,0.3); color: white; }  

        .panel-box { background: #ffffff; border: 1px solid var(--border); border-radius: var(--card-radius); padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .section-title { font-size: 0.9rem; font-weight: 800; color: var(--accent); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }

        .form-control { border-radius: var(--input-radius); border: 1px solid var(--border); padding: 6px 10px; font-size: 0.85rem; font-weight: 600; }
        .form-control:focus { border-color: var(--accent); box-shadow: 0 0 0 0.2rem rgba(11, 94, 61, 0.15); }

        .chic-table-container { background: #ffffff; border: 1px solid var(--border); border-radius: var(--card-radius); overflow-x: auto; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .chic-table { width: 100%; margin-bottom: 0; font-size: 0.8rem; min-width: 750px; }
        .chic-table th { background: #ebf9eb; padding: 10px 6px; font-weight: 800; color: var(--accent); text-align: center; border-bottom: 2px solid var(--border); font-size: 0.78rem; }
        .chic-table td { padding: 8px 6px; text-align: center; font-weight: 600; border-bottom: 1px solid #f0f4f1; vertical-align: middle; }
        
        .sub-head { background: #f7faf8 !important; font-size: 0.72rem; color: var(--text-primary); font-weight: 700; }
        
        .input-grid { width: 55px; text-align: center; padding: 3px; font-size: 0.8rem; border-radius: 6px; border: 1px solid var(--border); }
        .input-grid:focus { border-color: var(--accent); outline: none; background: #fffdf5; }
        
        .badge-sold { background: #e8f5e9; color: var(--success); padding: 4px 8px; border-radius: 6px; font-weight: 700; font-size: 0.8rem; display: inline-block; }
        .btn-save { background: var(--accent); color: white; border: none; font-weight: 700; padding: 6px 15px; border-radius: var(--input-radius); transition: 0.2s; }
        .btn-save:hover { background: #08432b; color: white; }
    </style>
</head>
<body>

<div class="header-nav">  
    <a href="reports_hub.html" class="back-btn"><i class="fas fa-arrow-right"></i></a>  
    <h6 class="m-0 fw-bold"><i class="fas fa-boxes me-1"></i> جرد وتحميل عهدة السيارة اليومي</h6>  
    <button class="back-btn" onclick="window.print()"><i class="fas fa-print"></i></button>  
</div>  

<div class="container px-2 mt-3">

    <!-- لوحة اختيار التاريخ والتحكم -->
    <div class="panel-box">
        <div class="row g-2 align-items-center">
            <div class="col-3 col-md-2">
                <label class="fw-bold text-muted" style="font-size: 0.75rem;"><i class="far fa-calendar-alt"></i> تاريخ الحركة:</label>
            </div>
            <div class="col-5 col-md-4">
                <input type="date" id="stockLogDate" class="form-control text-center fw-bold" onchange="loadStockLog()">
            </div>
            <div class="col-4 col-md-6 text-start">
                <button class="btn-save w-100 w-md-auto" onclick="saveStockLog()"><i class="fas fa-cloud-upload-alt me-1"></i> حفظ وإعتماد الجرد</button>
            </div>
        </div>
    </div>

    <!-- جدول حركة البضاعة والأصناف -->
    <div class="section-title"><i class="fas fa-dolly-flatbed"></i> حركة البضاعة: التحميل صباحاً والمرتجع مساءً وصافي المباع</div>
    <div class="chic-table-container">
        <table class="chic-table table-bordered">
            <thead>
                <tr>
                    <th rowspan="2" style="width: 25%; min-width: 160px; vertical-align: middle;">بيان وإسم الصنف</th>
                    <th colspan="3" style="background: #2b6cb0 !important; color: white !important;">الكمية المحملة صباحاً (الخارجة)</th>
                    <th colspan="3" style="background: #dd6b20 !important; color: white !important;">الكمية المتبقية آخر اليوم (المرتجعة)</th>
                    <th colspan="3" style="background: #2f855a !important; color: white !important;">صافي المبيعات الفعلي للسيارة</th>
                </tr>
                <tr>
                    <!-- محمل -->
                    <th class="sub-head">قطعة</th>
                    <th class="sub-head">جركن</th>
                    <th class="sub-head">كرتونة</th>
                    <!-- متبقي -->
                    <th class="sub-head">قطعة</th>
                    <th class="sub-head">جركن</th>
                    <th class="sub-head">كرتونة</th>
                    <!-- مبيعات فعلي -->
                    <th class="sub-head" style="color: var(--success);">قطعة</th>
                    <th class="sub-head" style="color: var(--success);">جركن</th>
                    <th class="sub-head" style="color: var(--success);">كرتونة</th>
                </tr>
            </thead>
            <tbody id="stockLogTableBody">
                <tr>
                    <td colspan="10" class="text-muted py-4"><i class="fas fa-spinner fa-spin"></i> جار جلب قائمة الأصناف وتجهيز جدول الجرد ...</td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {  
        apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",  
        authDomain: "ahmedelzaiady.firebaseapp.com",  
        projectId: "ahmedelzaiady",  
        storageBucket: "ahmedelzaiady.firebasestorage.app",  
        messagingSenderId: "300306825071",  
        appId: "1:300306825071:web:0426ddde56280fa090329a",  
        measurementId: "G-WE04GK5XZZ"  
    };  

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allProducts = [];

    document.addEventListener("DOMContentLoaded", async () => {
        const today = new Date();
        document.getElementById('stockLogDate').value = today.toISOString().split('T')[0];
        
        await fetchProductsList();
        await loadStockLog();
    });

    // جلب قائمة الأصناف
    async function fetchProductsList() {
        try {
            const snap = await getDocs(collection(db, "products"));
            allProducts = [];
            snap.forEach(d => {
                const data = d.data();
                allProducts.push({
                    id: d.id,
                    name: data.name || "صنف غير مسمى"
                });
            });
            allProducts.sort((a,b) => a.name.localeCompare(b.name, 'ar'));
        } catch(e) {
            console.error("Error fetching products:", e);
        }
    }

    // جلب جرد اليوم المحدد
    async function loadStockLog() {
        const selectedDate = document.getElementById('stockLogDate').value;
        const tableBody = document.getElementById('stockLogTableBody');
        
        if(allProducts.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="10" class="text-danger py-4 fw-bold">فشل في جلب قائمة المنتجات، يرجى التحقق من الخادم.</td></tr>`;
            return;
        }

        tableBody.innerHTML = `<tr><td colspan="10" class="text-muted py-4"><i class="fas fa-spinner fa-spin"></i> جار مزامنة البيانات وتحديث المربعات الحسابية...</td></tr>`;

        try {
            const logDocRef = doc(db, "daily_stock_logs", selectedDate);
            const logSnap = await getDoc(logDocRef);
            let savedData = {};

            if(logSnap.exists()) {
                savedData = logSnap.data().items || {};
            }

            let rowsHtml = "";
            allProducts.forEach(prod => {
                const data = savedData[prod.id] || {
                    load_piece: 0, load_jar: 0, load_box: 0,
                    return_piece: 0, return_jar: 0, return_box: 0
                };

                const sold_piece = Math.max(0, (data.load_piece || 0) - (data.return_piece || 0));
                const sold_jar = Math.max(0, (data.load_jar || 0) - (data.return_jar || 0));
                const sold_box = Math.max(0, (data.load_box || 0) - (data.return_box || 0));

                rowsHtml += `
                    <tr data-prod-id="${prod.id}">
                        <td style="text-align: right; font-weight: 700; color: #2d3748;">${prod.name}</td>
                        <!-- المحمل صباحاً -->
                        <td><input type="number" class="input-grid" id="lp_${prod.id}" value="${data.load_piece}" min="0" oninput="calculateRowSold('${prod.id}')"></td>
                        <td><input type="number" class="input-grid" id="lj_${prod.id}" value="${data.load_jar}" min="0" oninput="calculateRowSold('${prod.id}')"></td>
                        <td><input type="number" class="input-grid" id="lb_${prod.id}" value="${data.load_box}" min="0" oninput="calculateRowSold('${prod.id}')"></td>
                        <!-- المتبقي مساءً -->
                        <td><input type="number" class="input-grid" id="rp_${prod.id}" value="${data.return_piece}" min="0" oninput="calculateRowSold('${prod.id}')"></td>
                        <td><input type="number" class="input-grid" id="rj_${prod.id}" value="${data.return_jar}" min="0" oninput="calculateRowSold('${prod.id}')"></td>
                        <td><input type="number" class="input-grid" id="rb_${prod.id}" value="${data.return_box}" min="0" oninput="calculateRowSold('${prod.id}')"></td>
                        <!-- صافي المبيعات التلقائي -->
                        <td><span class="badge-sold" id="sp_${prod.id}">${sold_piece}</span></td>
                        <td><span class="badge-sold" id="sj_${prod.id}">${sold_jar}</span></td>
                        <td><span class="badge-sold" id="sb_${prod.id}">${sold_box}</span></td>
                    </tr>
                `;
            });

            tableBody.innerHTML = rowsHtml;

        } catch(err) {
            console.error("Error loading stock log:", err);
            tableBody.innerHTML = `<tr><td colspan="10" class="alert alert-danger p-2 text-center">حدث خطأ أثناء تحميل سجل الجرد.</td></tr>`;
        }
    }

    // حساب صافي المبيعات لحظياً عند الكتابة
    function calculateRowSold(prodId) {
        const lp = parseInt(document.getElementById(`lp_${prodId}`).value) || 0;
        const lj = parseInt(document.getElementById(`lj_${prodId}`).value) || 0;
        const lb = parseInt(document.getElementById(`lb_${prodId}`).value) || 0;

        const rp = parseInt(document.getElementById(`rp_${prodId}`).value) || 0;
        const rj = parseInt(document.getElementById(`rj_${prodId}`).value) || 0;
        const rb = parseInt(document.getElementById(`rb_${prodId}`).value) || 0;

        document.getElementById(`sp_${prodId}`).innerText = Math.max(0, lp - rp);
        document.getElementById(`sj_${prodId}`).innerText = Math.max(0, lj - rj);
        document.getElementById(`sb_${prodId}`).innerText = Math.max(0, lb - rb);
    }

    // حفظ الجرد في الفايربيس
    async function saveStockLog() {
        const selectedDate = document.getElementById('stockLogDate').value;
        const rows = document.querySelectorAll("#stockLogTableBody tr");
        
        if(rows.length === 0 || document.getElementById("noDataRow")) {
            alert("لا توجد بيانات لحفظها!");
            return;
        }

        let uploadData = {};

        rows.forEach(row => {
            const prodId = row.getAttribute("data-prod-id");
            if(prodId) {
                uploadData[prodId] = {
                    load_piece: parseInt(document.getElementById(`lp_${prodId}`).value) || 0,
                    load_jar: parseInt(document.getElementById(`lj_${prodId}`).value) || 0,
                    load_box: parseInt(document.getElementById(`lb_${prodId}`).value) || 0,
                    return_piece: parseInt(document.getElementById(`rp_${prodId}`).value) || 0,
                    return_jar: parseInt(document.getElementById(`rj_${prodId}`).value) || 0,
                    return_box: parseInt(document.getElementById(`rb_${prodId}`).value) || 0
                };
            }
        });

        try {
            await setDoc(doc(db, "daily_stock_logs", selectedDate), {
                date: selectedDate,
                items: uploadData,
                updatedAt: new Date()
            });
            alert(`تم حفظ واعتماد جرد حمولة يوم (${selectedDate}) بنجاح!`);
        } catch(e) {
            console.error("Error saving log:", e);
            alert("حدث خطأ أثناء حفظ البيانات بقاعدة البيانات.");
        }
    }

    window.loadStockLog = loadStockLog;
    window.calculateRowSold = calculateRowSold;
    window.saveStockLog = saveStockLog;
</script>
</body>
</html>
