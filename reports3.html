<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جرد وحركة عهدة السيارة اليومية - الزيادي للزيوت</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght=400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {   
            --accent: #0f5132;          
            --header-bg: #0f5132;       
            --bg-light: #f4f7f6;        
            --text-primary: #1e293b;     
            --border: #cbd5e1;          
            --card-radius: 12px;  
            --input-radius: 8px;  
            
            /* ألوان احترافية لفصل مجموعات العمليات */
            --bg-load: #f0f7ff;
            --border-load: #93c5fd;
            --bg-return: #fff7ed;
            --border-return: #fdba74;
            --bg-sold: #f0fdf4;
            --border-sold: #86efac;
        }  
        
        body {   
            background: var(--bg-light);   
            font-family: 'Cairo', sans-serif;   
            color: var(--text-primary);   
            padding-bottom: 60px;   
            font-size: 0.9rem;  
        }  
        
        .header-nav {   
            background: var(--header-bg);   
            padding: 15px 20px;   
            display: flex;   
            align-items: center;   
            justify-content: space-between;   
            box-shadow: 0 4px 12px rgba(15, 81, 50, 0.15);   
            color: white;   
            position: sticky;   
            top: 0;   
            z-index: 1000;  
        }  
        
        .back-btn { 
            background: rgba(255,255,255,0.15); width: 38px; height: 38px; border-radius: 8px; 
            display: flex; align-items: center; justify-content: center; color: white; 
            text-decoration: none; font-size: 1rem; border: none; transition: 0.2s;
        }  
        .back-btn:hover { background: rgba(255,255,255,0.25); color: white; }  

        .panel-box { 
            background: #ffffff; border: 1px solid #e2e8f0; border-radius: var(--card-radius); 
            padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03); 
        }
        
        .section-title { 
            font-size: 1rem; font-weight: 800; color: var(--accent); 
            margin-bottom: 15px; display: flex; align-items: center; gap: 8px; 
        }

        .form-control { 
            border-radius: var(--input-radius); border: 1px solid var(--border); 
            padding: 8px 12px; font-size: 0.9rem; font-weight: 700; 
        }
        .form-control:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(15, 81, 50, 0.15); }

        .chic-table-container { 
            background: #ffffff; border: 1px solid #e2e8f0; border-radius: var(--card-radius); 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03); margin-bottom: 30px; overflow: hidden;
        }
        
        .table-responsive { overflow-x: auto; }
        
        .chic-table { width: 100%; margin-bottom: 0; font-size: 0.9rem; min-width: 800px; border-collapse: collapse; }
        .chic-table th { padding: 12px 8px; font-weight: 800; text-align: center; border: 1px solid #e2e8f0; font-size: 0.85rem; }
        
        /* ترويسة الأعمدة الرئيسية كـ الشركات الكبرى */
        .th-main-load { background: #1e40af !important; color: white !important; }
        .th-main-return { background: #c2410c !important; color: white !important; }
        .th-main-sold { background: #166534 !important; color: white !important; }
        .sub-head { background: #f8fafc !important; color: #475569; font-weight: 700; font-size: 0.8rem; }
        
        .chic-table td { padding: 10px 8px; text-align: center; font-weight: 600; border: 1px solid #e2e8f0; vertical-align: middle; }
        
        /* تلوين الخلفيات للفصل اللوني */
        .col-load { background-color: var(--bg-load); }
        .col-return { background-color: var(--bg-return); }
        .col-sold { background-color: var(--bg-sold); }
        
        /* تصميم حقول الإدخال لتكون عريضة ومريحة للكتابة */
        .input-grid { 
            width: 85px; text-align: center; padding: 6px 8px; font-size: 1rem; font-weight: 700;
            border-radius: 6px; border: 1px solid var(--border); background-color: #ffffff; transition: all 0.2s;
        }
        .input-grid:focus { 
            border-color: #2563eb; outline: none; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2); transform: scale(1.05);
        }
        .col-return .input-grid:focus {
            border-color: #ea580c; box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.2);
        }
        
        /* إلغاء مظهر أسهم الأرقام المزعجة */
        .input-grid::-webkit-outer-spin-button, .input-grid::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        .badge-sold { 
            background: #dcfce7; color: #166534; padding: 6px 14px; border-radius: 6px; 
            font-weight: 800; font-size: 0.95rem; display: inline-block; min-width: 55px; border: 1px solid var(--border-sold);
        }
        
        .btn-save { 
            background: var(--accent); color: white; border: none; font-weight: 700; padding: 10px 24px; 
            border-radius: var(--input-radius); transition: 0.2s; box-shadow: 0 4px 6px -1px rgba(15, 81, 50, 0.2);
        }
        .btn-save:hover { background: #0a3622; color: white; }
        
        .btn-add-prod { background: #475569; color: white; border: none; font-weight: 700; padding: 8px 16px; border-radius: var(--input-radius); font-size: 0.85rem; }
        .btn-add-prod:hover { background: #334155; color: white; }
    </style>
</head>
<body>

<div class="header-nav">  
    <a href="reports_hub.html" class="back-btn"><i class="fas fa-arrow-right"></i></a>  
    <h5 class="m-0 fw-bold"><i class="fas fa-shipping-fast me-2"></i> مسير وجرد حركة حمولة السيارة اليومية</h5>  
    <button class="back-btn" onclick="window.print()"><i class="fas fa-print"></i></button>  
</div>  

<div class="container-fluid px-3 mt-4">

    <!-- لوحة التحكم والتاريخ والتفاعل يدوياً -->
    <div class="panel-box">
        <div class="row g-3 align-items-center">
            <div class="col-12 col-sm-auto">
                <label class="fw-bold text-secondary"><i class="far fa-calendar-alt me-1"></i> تاريخ حركة اليوم:</label>
            </div>
            <div class="col-12 col-sm-3">
                <input type="date" id="stockLogDate" class="form-control text-center" onchange="loadStockLog()">
            </div>
            
            <!-- إضافة صنف يدوياً فوراً في حال عدم التحميل التلقائي -->
            <div class="col-12 col-sm-4 d-flex gap-2">
                <input type="text" id="manualProdName" class="form-control" placeholder="اكتب اسم صنف هنا لإضافته فوراً...">
                <button type="button" class="btn-add-prod text-nowrap" onclick="addNewProductRow()"><i class="fas fa-plus me-1"></i> إضافة صنف</button>
            </div>

            <div class="col-12 col-sm text-sm-start mt-2 mt-sm-0">
                <button class="btn-save w-100 w-sm-auto" onclick="saveStockLog()"><i class="fas fa-check-double me-1"></i> اعتماد وحفظ الجرد النهائي</button>
            </div>
        </div>
    </div>

    <!-- جدول حركة البضاعة والأصناف -->
    <div class="section-title"><i class="fas fa-table me-2"></i> بيان حركة وجرد الكميات (بالجركن والكرتونة فقط)</div>
    
    <div class="chic-table-container">
        <div class="table-responsive">
            <table class="chic-table">
                <thead>
                    <tr>
                        <th rowspan="2" style="width: 28%; min-width: 200px; vertical-align: middle; background: #f1f5f9; color: #334155;">بيان وإسم الصنف</th>
                        <th colspan="2" class="th-main-load">الكمية المحملة صباحاً (اكتب هنا ما خرج بالسيارة)</th>
                        <th colspan="2" class="th-main-return">الكمية المتبقية مساءً (اكتب هنا المرتجع للمخزن)</th>
                        <th colspan="2" class="th-main-sold">صافي المبيعات الفعلي للسيارة (محسوب تلقائياً)</th>
                    </tr>
                    <tr>
                        <!-- محمل -->
                        <th class="sub-head">جركن</th>
                        <th class="sub-head">كرتونة</th>
                        <!-- متبقي -->
                        <th class="sub-head">جركن</th>
                        <th class="sub-head">كرتونة</th>
                        <!-- مبيعات فعلي -->
                        <th class="sub-head" style="color: #166534;">جركن</th>
                        <th class="sub-head" style="color: #166534;">كرتونة</th>
                    </tr>
                </thead>
                <tbody id="stockLogTableBody">
                    <!-- سيتم بناء الصفوف هنا برمجياً أو يمكنك إضافتها فوراً بالزر بالأعلى -->
                </tbody>
            </table>
        </div>
    </div>

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {  
        apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",  
        authDomain: "ahmedelzaiady.firebaseapp.com",  
        projectId: "ahmedelzaiady",  
        storageBucket: "ahmedelzaiady.firebasestorage.app",  
        messagingSenderId: "300306825071",  
        appId: "1:300306825071:web:0426ddde56280fa090329a",  
        measurementId: "G-WE04GK5XZZ"  
    };  

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allProducts = [];

    document.addEventListener("DOMContentLoaded", async () => {
        const today = new Date();
        document.getElementById('stockLogDate').value = today.toISOString().split('T')[0];
        
        await fetchProductsList();
        await loadStockLog();
    });

    // جلب قائمة الأصناف الأساسية من السيرفر
    async function fetchProductsList() {
        try {
            const snap = await getDocs(collection(db, "products"));
            allProducts = [];
            snap.forEach(d => {
                const data = d.data();
                allProducts.push({
                    id: d.id,
                    name: data.name || "صنف غير مسمى"
                });
            });
            allProducts.sort((a,b) => a.name.localeCompare(b.name, 'ar'));
        } catch(e) {
            console.error("Error fetching products:", e);
        }
    }

    // جلب الجرد الحالي وعرضه في المربعات المناسبة بالكتابة
    async function loadStockLog() {
        const selectedDate = document.getElementById('stockLogDate').value;
        const tableBody = document.getElementById('stockLogTableBody');
        
        tableBody.innerHTML = `<tr><td colspan="7" class="text-muted py-4 text-center"><i class="fas fa-sync fa-spin me-2"></i> جاري جلب ومزامنة البيانات مع السيرفر... يمكنك أيضاً إضافة الأصناف يدوياً بالأعلى لتسريع العمل.</td></tr>`;

        try {
            const logDocRef = doc(db, "daily_stock_logs", selectedDate);
            const logSnap = await getDoc(logDocRef);
            let savedData = {};

            if(logSnap.exists()) {
                savedData = logSnap.data().items || {};
            }

            // تجميع كافة الأصناف المسجلة والمضافة حديثاً
            let mergedProducts = [...allProducts];
            Object.keys(savedData).forEach(id => {
                if(!mergedProducts.some(p => p.id === id)) {
                    mergedProducts.push({ id: id, name: savedData[id].name || id });
                }
            });

            if(mergedProducts.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="7" class="text-muted py-4 text-center">الجدول فارغ حالياً. اكتب اسم صنف بالأعلى واضغط (إضافة صنف) للبدء في كتابة الكميات فوراً.</td></tr>`;
                return;
            }

            let rowsHtml = "";
            mergedProducts.forEach(prod => {
                const data = savedData[prod.id] || {
                    load_jar: 0, load_box: 0,
                    return_jar: 0, return_box: 0
                };

                const sold_jar = Math.max(0, (data.load_jar || 0) - (data.return_jar || 0));
                const sold_box = Math.max(0, (data.load_box || 0) - (data.return_box || 0));

                rowsHtml += buildRowTemplate(prod.id, prod.name, data.load_jar, data.load_box, data.return_jar, data.return_box, sold_jar, sold_box);
            });

            tableBody.innerHTML = rowsHtml;

        } catch(err) {
            console.error("Error loading stock log:", err);
            tableBody.innerHTML = `<tr><td colspan="7" class="alert alert-danger p-2 text-center">حدث خطأ أثناء الاتصال بالخادم. يمكنك الكتابة اليدوية وإضافة أصناف الآن.</td></tr>`;
        }
    }

    // دالة مسؤولة عن بناء هيكل الصف بدون عمود "القطعة"
    function buildRowTemplate(id, name, lj, lb, rj, rb, sj, sb) {
        return `
            <tr data-prod-id="${id}" data-prod-name="${name}">
                <td style="text-align: right; font-weight: 800; color: #1e293b; background: #f8fafc;">${name}</td>
                
                <!-- المحمل صباحاً (أزرق) -->
                <td class="col-load"><input type="number" class="input-grid" id="lj_${id}" value="${lj}" min="0" oninput="calculateRowSold('${id}')"></td>
                <td class="col-load"><input type="number" class="input-grid" id="lb_${id}" value="${lb}" min="0" oninput="calculateRowSold('${id}')"></td>
                
                <!-- المتبقي مساءً (برتقالي) -->
                <td class="col-return"><input type="number" class="input-grid" id="rj_${id}" value="${rj}" min="0" oninput="calculateRowSold('${id}')"></td>
                <td class="col-return"><input type="number" class="input-grid" id="rb_${id}" value="${rb}" min="0" oninput="calculateRowSold('${id}')"></td>
                
                <!-- صافي المبيعات التلقائي (أخضر) -->
                <td class="col-sold"><span class="badge-sold" id="sj_${id}">${sj}</span></td>
                <td class="col-sold"><span class="badge-sold" id="sb_${id}">${sb}</span></td>
            </tr>
        `;
    }

    // إضافة صنف يدوياً فوراً في الجدول لمنع مشكلة الانتظار اللانهائي
    function addNewProductRow() {
        const inputName = document.getElementById("manualProdName");
        const pName = inputName.value.trim();
        if(!pName) {
            alert("يرجى إدخال اسم الصنف أولاً!");
            return;
        }

        const tableBody = document.getElementById("stockLogTableBody");
        // مسح رسائل التنبيه أو التحميل إذا كان الجدول فارغاً
        if(tableBody.innerHTML.includes("colspan")) {
            tableBody.innerHTML = "";
        }

        const customId = "custom_" + Date.now();
        const newRowHtml = buildRowTemplate(customId, pName, 0, 0, 0, 0, 0, 0);
        
        tableBody.insertAdjacentHTML('beforeend', newRowHtml);
        inputName.value = ""; // مسح الخانة بعد الإضافة بنجاح
    }

    // حساب صافي المبيعات فوراً بمجرد أن تكتب الرقم بيدك
    function calculateRowSold(prodId) {
        const lj = parseInt(document.getElementById(`lj_${prodId}`).value) || 0;
        const lb = parseInt(document.getElementById(`lb_${prodId}`).value) || 0;

        const rj = parseInt(document.getElementById(`rj_${prodId}`).value) || 0;
        const rb = parseInt(document.getElementById(`rb_${prodId}`).value) || 0;

        document.getElementById(`sj_${prodId}`).innerText = Math.max(0, lj - rj);
        document.getElementById(`sb_${prodId}`).innerText = Math.max(0, lb - rb);
    }

    // حفظ واعتماد كامل البيانات إلى Firebase
    async function saveStockLog() {
        const selectedDate = document.getElementById('stockLogDate').value;
        const rows = document.querySelectorAll("#stockLogTableBody tr");
        
        if(rows.length === 0 || rows[0].querySelector("td[colspan]")) {
            alert("لا توجد أصناف أو بيانات مكتوبة لحفظها!");
            return;
        }

        let uploadData = {};

        rows.forEach(row => {
            const prodId = row.getAttribute("data-prod-id");
            const prodName = row.getAttribute("data-prod-name");
            if(prodId) {
                uploadData[prodId] = {
                    name: prodName,
                    load_jar: parseInt(document.getElementById(`lj_${prodId}`).value) || 0,
                    load_box: parseInt(document.getElementById(`lb_${prodId}`).value) || 0,
                    return_jar: parseInt(document.getElementById(`rj_${prodId}`).value) || 0,
                    return_box: parseInt(document.getElementById(`rb_${prodId}`).value) || 0
                };
            }
        });

        try {
            await setDoc(doc(db, "daily_stock_logs", selectedDate), {
                date: selectedDate,
                items: uploadData,
                updatedAt: new Date()
            });
            alert(`تم حفظ واعتماد بيان حركة وجرد يوم (${selectedDate}) بنجاح تام للشركة!`);
        } catch(e) {
            console.error("Error saving log:", e);
            alert("حدث خطأ أثناء حفظ البيانات بقاعدة البيانات، يرجى المحاولة مرة أخرى.");
        }
    }

    window.loadStockLog = loadStockLog;
    window.addNewProductRow = addNewProductRow;
    window.calculateRowSold = calculateRowSold;
    window.saveStockLog = saveStockLog;
</script>
</body>
</html>
