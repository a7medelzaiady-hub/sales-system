from pathlib import Path

html = r'''<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>جرد سيارة التوزيع - الزيادي</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body{background:#f5f7fb;font-family:Cairo,sans-serif}
.card{border:none;border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.header{background:#0b6641;color:#fff;padding:15px;border-radius:0 0 20px 20px}
.table input{min-width:80px}
</style>
</head>
<body>
<div class="header text-center">
<h3><i class="fas fa-truck"></i> جرد سيارة التوزيع</h3>
</div>

<div class="container mt-3">
<div class="card p-3 mb-3">
<div class="row">
<div class="col-md-4"><label>اسم السائق</label><input id="driver" class="form-control"></div>
<div class="col-md-4"><label>رقم السيارة</label><input id="car" class="form-control"></div>
<div class="col-md-4"><label>التاريخ</label><input id="date" type="date" class="form-control"></div>
</div>
</div>

<div class="card p-3">
<h5>أصناف السيارة</h5>
<table class="table table-bordered text-center" id="tbl">
<thead>
<tr>
<th>الصنف</th>
<th>المحمل صباحاً</th>
<th>الباقي آخر اليوم</th>
<th>المباع</th>
</tr>
</thead>
<tbody></tbody>
</table>

<button class="btn btn-success" onclick="addRow()">إضافة صنف</button>
<button class="btn btn-primary" onclick="calc()">حساب الجرد</button>
<button class="btn btn-dark" onclick="window.print()">طباعة</button>
</div>
</div>

<script>
function addRow(){
let tr=document.createElement('tr');
tr.innerHTML=`
<td><input class="form-control product"></td>
<td><input type="number" class="form-control load" value="0"></td>
<td><input type="number" class="form-control remain" value="0"></td>
<td><input class="form-control sold" readonly></td>`;
document.querySelector('#tbl tbody').appendChild(tr);
}

function calc(){
document.querySelectorAll('#tbl tbody tr').forEach(r=>{
let l=Number(r.querySelector('.load').value||0);
let rem=Number(r.querySelector('.remain').value||0);
r.querySelector('.sold').value=l-rem;
});
}

for(let i=0;i<5;i++) addRow();
</script>
</body>
</html>'''

path = "/mnt/data/car_inventory_page.html"
Path(path).write_text(html, encoding="utf-8")
print(path)
