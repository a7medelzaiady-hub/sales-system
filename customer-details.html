<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { 
        getFirestore, 
        doc, 
        getDoc, 
        deleteDoc, 
        updateDoc, 
        collection, 
        getDocs, 
        query, 
        where 
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
        authDomain: "ahmedelzaiady.firebaseapp.com",
        projectId: "ahmedelzaiady",
        storageBucket: "ahmedelzaiady.firebasestorage.app",
        messagingSenderId: "300306825071",
        appId: "1:300306825071:web:0426ddde56280fa090329a",
        measurementId: "G-WE04GK5XZZ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const custId = urlParams.get('id');

    async function getDetails() {
        if(!custId) return;

        document.getElementById('editLink').href = `edit-customer.html?id=${custId}`;
        document.getElementById('payBtn').href = `customer-payment.html?id=${custId}`;
        document.getElementById('statementBtn').href = `customer-statement.html?id=${custId}`;
        document.getElementById('historyBtn').href = `customer-transactions-log.html?id=${custId}`;
        document.getElementById('installmentsBtn').href = `customer-installments.html?id=${custId}`;

        const docRef = doc(db, "customers", custId);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
            const data = docSnap.data();

            document.getElementById('displayName').innerText = data.name;
            document.getElementById('displayBalance').innerText = data.initialBalance || 0;
            document.getElementById('displayOpening').innerText = data.initialBalance || 0;
            document.getElementById('displayPhone').innerText = data.phone || 'غير مسجل';
            document.getElementById('displayAddress').innerText = data.address || 'غير مسجل';

            if(data.phone){
                document.getElementById('callBtn').href = `tel:${data.phone}`;
            }
        }
    }

    window.resetAccount = async () => {
        if(confirm("تصفير الرصيد؟")) {
            await updateDoc(doc(db, "customers", custId), { initialBalance: 0 });
            location.reload();
        }
    };

    window.deleteCustomer = async () => {
        if(confirm("حذف العميل؟")) {
            await deleteDoc(doc(db, "customers", custId));
            window.location.href = "customer-list.html";
        }
    };

    // ✔️ حذف كل العملاء (المعدل والصحيح)
    window.deleteAllCustomers = async function(){

        const ok = confirm("⚠️ هل تريد حذف كل العملاء نهائياً؟");
        if(!ok) return;

        const pass = prompt("اكتب كلمة السر:");

        if(pass !== "1234"){
            alert("❌ كلمة السر غلط");
            return;
        }

        try{

            const snapshot = await getDocs(collection(db,"customers"));

            for(const item of snapshot.docs){
                await deleteDoc(doc(db,"customers",item.id));
            }

            alert("تم حذف كل العملاء بنجاح ✅");

            window.location.href = "customer-list.html";

        }catch(error){
            console.log(error);
            alert("حدث خطأ أثناء الحذف");
        }
    };

    getDetails();

</script>
