<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>العملاء</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

body{
background:#f5f5f5;
font-family:Cairo, sans-serif;
padding:20px;
}

.card{
border:none;
border-radius:15px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.table th{
background:#0d6efd;
color:#fff;
color:white;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="card-body">

<!-- العنوان -->
<h3 class="mb-3">
<i class="fas fa-users"></i>
العملاء
</h3>

<!-- زر الحذف (مضمون الظهور) -->
<div class="mb-3">

<button type="button"
class="btn btn-danger w-100"
onclick="deleteAllCustomers()">

<i class="fas fa-trash-alt"></i>
حذف كل العملاء

</button>

</div>

<!-- الجدول -->
<table class="table table-bordered text-center">

<thead>
<tr>
<th>الاسم</th>
<th>الموبايل</th>
<th>العنوان</th>
</tr>
</thead>

<tbody id="customersBody">

<tr>
<td colspan="3">جاري التحميل...</td>
</tr>

</tbody>

</table>

</div>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
deleteDoc,
doc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
authDomain: "ahmedelzaiady.firebaseapp.com",
projectId: "ahmedelzaiady",
storageBucket: "ahmedelzaiady.firebasestorage.app",
messagingSenderId: "300306825071",
appId: "1:300306825071:web:0426ddde56280fa090329a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// عرض العملاء
async function loadCustomers(){

const body = document.getElementById("customersBody");
body.innerHTML = "";

try{

const snap = await getDocs(collection(db,"customers"));

if(snap.empty){
body.innerHTML = `<tr><td colspan="3">لا يوجد عملاء</td></tr>`;
return;
}

snap.forEach(d => {

const data = d.data();

body.innerHTML += `
<tr>
<td>${data.name || ""}</td>
<td>${data.phone || ""}</td>
<td>${data.address || ""}</td>
</tr>
`;

});

}catch(err){
console.log(err);
body.innerHTML = `<tr><td colspan="3">خطأ في تحميل البيانات</td></tr>`;
}

}

loadCustomers();

// حذف الكل
window.deleteAllCustomers = async function(){

const ok = confirm("هل تريد حذف كل العملاء؟");
if(!ok) return;

const pass = prompt("اكتب كلمة السر");
if(pass !== "1234"){
alert("كلمة السر خطأ");
return;
}

const snap = await getDocs(collection(db,"customers"));

for(const d of snap.docs){
await deleteDoc(doc(db,"customers",d.id));
}

alert("تم الحذف بنجاح ✅");
loadCustomers();

}

</script>

</body>
</html>
