<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>العملاء</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

body{
background:#f5f5f5;
font-family:Cairo,sans-serif;
padding:20px;
}

.card{
border:none;
border-radius:15px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.table th{
background:#0d6efd;
color:#fff;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="card-body">

<div class="d-flex justify-content-between align-items-center mb-3">

<h3 class="mb-0">
<i class="fas fa-users"></i>
العملاء
</h3>

<button class="btn btn-danger btn-sm" onclick="deleteAllCustomers()">
<i class="fas fa-trash-alt"></i>
حذف كل العملاء
</button>

</div>

<div class="table-responsive">

<table class="table table-bordered table-hover text-center align-middle">

<thead>

<tr>
<th>الاسم</th>
<th>الموبايل</th>
<th>العنوان</th>
</tr>

</thead>

<tbody id="customersBody">

<tr>
<td colspan="3">
جارى التحميل...
</td>
</tr>

</tbody>

</table>

</div>

</div>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
deleteDoc,
doc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",

authDomain: "ahmedelzaiady.firebaseapp.com",

projectId: "ahmedelzaiady",

storageBucket: "ahmedelzaiady.firebasestorage.app",

messagingSenderId: "300306825071",

appId: "1:300306825071:web:0426ddde56280fa090329a"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

// تحميل العملاء

async function loadCustomers(){

const tableBody = document.getElementById("customersBody");

tableBody.innerHTML = "";

try{

const querySnapshot = await getDocs(collection(db,"customers"));

if(querySnapshot.empty){

tableBody.innerHTML = `

<tr>
<td colspan="3">لا يوجد عملاء</td>
</tr>

`;

return;

}

querySnapshot.forEach((docSnap)=>{

const data = docSnap.data();

tableBody.innerHTML += `

<tr>
<td>${data.name || ""}</td>
<td>${data.phone || ""}</td>
<td>${data.address || ""}</td>
</tr>

`;

});

}catch(error){

console.log(error);

tableBody.innerHTML = `

<tr>
<td colspan="3">حدث خطأ أثناء تحميل البيانات</td>
</tr>

`;

}

}

loadCustomers();

// حذف كل العملاء

window.deleteAllCustomers = async function(){

const ok = confirm("⚠️ هل تريد حذف جميع العملاء نهائياً؟");

if(!ok) return;

const pass = prompt("اكتب كلمة السر");

if(pass !== "1234"){

alert("❌ كلمة السر غير صحيحة");

return;

}

try{

const snap = await getDocs(collection(db,"customers"));

for(const item of snap.docs){

await deleteDoc(doc(db,"customers",item.id));

}

alert("تم حذف جميع العملاء بنجاح ✅");

loadCustomers();

}catch(error){

console.log(error);

alert("حدث خطأ أثناء الحذف");

}

}

</script>

</body>

</html>
