<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import {
        getFirestore,
        collection,
        addDoc,
        getDocs,
        getDoc,
        doc,
        deleteDoc,
        updateDoc,
        query,
        where,
        orderBy
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
        authDomain: "ahmedelzaiady.firebaseapp.com",
        projectId: "ahmedelzaiady",
        storageBucket: "ahmedelzaiady.firebasestorage.app",
        messagingSenderId: "300306825071",
        appId: "1:300306825071:web:0426ddde56280fa090329a",
        measurementId: "G-WE04GK5XZZ"
    };
    
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allVouchers = [];
    let partiesMap = {}; 
    let receiptModalObj = null;

    document.addEventListener("DOMContentLoaded", async () => {
        receiptModalObj = new bootstrap.Modal(document.getElementById('receiptModal'));
        loadCache();
        await fetchPartiesData();
        await loadVouchers();
    });

    document.getElementById('vDate').value = new Date().toISOString().split('T')[0];

    function loadCache() {
        const cachedParties = localStorage.getItem('cache_partiesMap');
        const cachedVouchers = localStorage.getItem('cache_allVouchers');
        
        if (cachedParties) {
            partiesMap = JSON.parse(cachedParties);
        }
        if (cachedVouchers) {
            allVouchers = JSON.parse(cachedVouchers);
            renderTable(allVouchers);
        }
    }

    async function fetchPartiesData() {
        try {
            const [supSnap, custSnap] = await Promise.all([
                getDocs(collection(db, "suppliers")),
                getDocs(collection(db, "customers"))
            ]);
            
            supSnap.forEach(doc => {
                partiesMap[doc.id] = {
                    name: doc.data().name,
                    type: 'مورد',
                    initialBalance: Number(doc.data().initialBalance || 0)
                };
            });

            custSnap.forEach(doc => {
                partiesMap[doc.id] = {
                    name: doc.data().name,
                    type: 'عميل',
                    initialBalance: Number(doc.data().initialBalance || 0)
                };
            });
            
            localStorage.setItem('cache_partiesMap', JSON.stringify(partiesMap));
        } catch (err) {
            console.error("Error fetching parties:", err);
        }
    }

    window.searchParty = () => {
        const input = document.getElementById('partySearch');
        const resultsDiv = document.getElementById('partyResults');
        const pType = document.getElementById('partyType').value;
        const term = input.value.toLowerCase().trim();

        if (term.length < 1) {
            resultsDiv.style.display = 'none';
            return;
        }

        let filteredHtml = '';
        for (let id in partiesMap) {
            if (partiesMap[id].type === pType && partiesMap[id].name.toLowerCase().includes(term)) {
                filteredHtml += `
                    <div class="search-item" onclick="selectParty('${id}', '${partiesMap[id].name}')">
                        <b>${partiesMap[id].name}</b>
                    </div>`;
            }
        }

        if (filteredHtml !== '') {
            resultsDiv.innerHTML = filteredHtml;
            resultsDiv.style.display = 'block';
        } else {
            resultsDiv.innerHTML = `<div class="search-item text-muted text-center">لا توجد نتائج مطابقة</div>`;
            resultsDiv.style.display = 'block';
        }
    };

    window.selectParty = (id, name) => {
        document.getElementById('partySearch').value = name;
        document.getElementById('partyId').value = id;
        document.getElementById('partyResults').style.display = 'none';
    };

    document.getElementById('partyType').addEventListener('change', () => {
        document.getElementById('partySearch').value = '';
        document.getElementById('partyId').value = '';
        document.getElementById('partyResults').style.display = 'none';
    });

    document.getElementById('partySearch').addEventListener('input', window.searchParty);

    document.addEventListener('click', (e) => {
        if (!e.target.closest('.search-container')) {
            document.getElementById('partyResults').style.display = 'none';
        }
    });

    async function loadVouchers() {
        try {
            const q = query(collection(db, "transactions"), orderBy("date", "desc"));
            const querySnapshot = await getDocs(q);
            allVouchers = [];

            querySnapshot.forEach((doc) => {
                const d = doc.data();
                if (d.type === 'قبض' || d.type === 'صرف') {
                    allVouchers.push({
                        id: doc.id,
                        date: d.date,
                        type: d.type,
                        partyId: d.partyId,
                        partyType: d.partyType || (partiesMap[d.partyId] ? partiesMap[d.partyId].type : 'مورد'),
                        amount: Number(d.amount || 0),
                        note: d.note || d.notes || ''
                    });
                }
            });

            localStorage.setItem('cache_allVouchers', JSON.stringify(allVouchers));
            renderTable(allVouchers);

        } catch (err) {
            console.error(err);
            if(allVouchers.length === 0) {
                document.getElementById('vouchersBody').innerHTML = '<tr><td colspan="8" class="text-danger py-4">حدث خطأ أثناء تحميل البيانات</td></tr>';
            }
        }
    }

    function renderTable(data) {
        const tbody = document.getElementById('vouchersBody');
        tbody.innerHTML = '';
        let total = 0;

        if(data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="text-center py-3 text-muted">لا توجد حركات مطابقة لخيارات الفرز الحالية</td></tr>';
            document.getElementById('vouchersTotal').innerText = "0.00 ج.م";
            return;
        }

        data.forEach(v => {
            total += v.amount;
            const pName = partiesMap[v.partyId] ? partiesMap[v.partyId].name : 'حساب غير معروف';
            const badgeClass = v.type === 'قبض' ? 'badge-receipt' : 'badge-payment';

            tbody.innerHTML += `
                <tr>
                    <td><span class="text-secondary fw-bold">${v.date}</span></td>
                    <td><span class="badge-type ${badgeClass}">${v.type}</span></td>
                    <td class="text-end fw-bold text-dark">${pName}</td>
                    <td class="text-end text-muted small">${v.note}</td>
                    <td class="fw-bold ${v.type === 'قبض' ? 'text-success' : 'text-danger'}">${v.amount.toLocaleString('ar-EG', {minimumFractionDigits: 2})}</td>
                    <td>
                        <button class="btn-edit-row" onclick="startEditVoucher('${v.id}')" title="تعديل الحركة"><i class="fas fa-edit"></i></button>
                    </td>
                    <td>
                        <button class="btn-share-row" onclick="openReceiptModal('${v.type}', '${v.date}', ${v.amount}, '${v.partyId}')" title="مشاركة"><i class="fas fa-share-alt"></i></button>
                    </td>
                    <td>
                        <button class="btn-delete-row" onclick="deleteVoucher('${v.id}')" title="حذف"><i class="fas fa-trash-alt"></i></button>
                    </td>
                </tr>`;
        });

        document.getElementById('vouchersTotal').innerText = `${total.toLocaleString('ar-EG', {minimumFractionDigits: 2})} ج.م`;
    }

    window.startEditVoucher = (id) => {
        const voucher = allVouchers.find(v => v.id === id);
        if (!voucher) return;

        document.getElementById('editVoucherId').value = voucher.id;
        document.getElementById('vType').value = voucher.type;
        document.getElementById('partyType').value = voucher.partyType;
        document.getElementById('partyId').value = voucher.partyId;
        document.getElementById('partySearch').value = partiesMap[voucher.partyId] ? partiesMap[voucher.partyId].name : '';
        document.getElementById('vDate').value = voucher.date;
        document.getElementById('vAmount').value = voucher.amount;
        document.getElementById('vNote').value = voucher.note;

        document.getElementById('formTitle').innerHTML = '<i class="fas fa-edit me-1"></i> تعديل وتحديث الحركة المحددة';
        const submitBtn = document.getElementById('btnSubmitForm');
        submitBtn.innerText = "تحديث البيانات الآن";
        submitBtn.classList.add('edit-mode');
        document.getElementById('btnCancelEdit').classList.remove('d-none');

        document.getElementById('formContainer').scrollIntoView({ behavior: 'smooth' });
    };

    window.resetVoucherForm = () => {
        document.getElementById('editVoucherId').value = '';
        document.getElementById('voucherForm').reset();
        document.getElementById('vDate').value = new Date().toISOString().split('T')[0];
        document.getElementById('partyId').value = '';
        
        document.getElementById('formTitle').innerHTML = '<i class="fas fa-plus-circle me-1"></i> تسجيل عملية جديدة';
        const submitBtn = document.getElementById('btnSubmitForm');
        submitBtn.innerText = "حفظ البيانات";
        submitBtn.classList.remove('edit-mode');
        document.getElementById('btnCancelEdit').classList.add('d-none');
    };

    window.filterData = () => {
        const fType = document.getElementById('filterType').value;
        const fParty = document.getElementById('filterParty').value;

        const filtered = allVouchers.filter(v => {
            const matchType = (fType === 'الكل' || v.type === fType);
            const matchParty = (fParty === 'الكل' || v.partyType === fParty);
            return matchType && matchParty;
        });

        renderTable(filtered);
    };

    // الدالة المحدثة لحساب أرصدة العملاء والموردين بشكل صحيح ومعادلة معكوسة
    async function calculateCustomerBalance(partyId) {
        const pType = partiesMap[partyId] ? partiesMap[partyId].type : 'عميل';
        const collectionName = pType === 'مورد' ? 'suppliers' : 'customers';
        
        const partyDoc = await getDoc(doc(db, collectionName, partyId));
        if (!partyDoc.exists()) return 0;

        let balance = Number(partyDoc.data().initialBalance || 0);

        // جلب الفواتير (العملاء: فواتير المبيعات الصادرة ، الموردين: فواتير المشتريات الواردة إن وجدت في النظام)
        if (collectionName === 'customers') {
            const invoicesSnap = await getDocs(query(collection(db, "invoices"), where("customerId", "==", partyId)));
            invoicesSnap.forEach(inv => {
                balance += Number(inv.data().remaining || 0);
            });
        } else if (collectionName === 'suppliers') {
            // إذا كان لديك مديونيات فواتير للموردين يتم إضافتها هنا من جدول المشتريات التابع لك بنفس الفكرة
            const supplierInvoicesSnap = await getDocs(query(collection(db, "supplierInvoices"), where("supplierId", "==", partyId)));
            supplierInvoicesSnap.forEach(inv => {
                balance += Number(inv.data().remaining || 0);
            });
        }

        // جلب الحركات المالية التابعة لهذا الحساب (قبض وصرف) لتعديل الميزانية الحالية
        const transSnap = await getDocs(query(collection(db, "transactions"), where("partyId", "==", partyId)));
        transSnap.forEach(tr => {
            const t = tr.data();
            if (pType === 'عميل') {
                if (t.type === 'قبض') balance -= Number(t.amount || 0);
                if (t.type === 'صرف') balance += Number(t.amount || 0);
            } else { // حساب المورد (عكس حساب العميل)
                if (t.type === 'صرف') balance -= Number(t.amount || 0); // صرف نقدية للمورد يقلل حسابه المستحق
                if (t.type === 'قبض') balance += Number(t.amount || 0); // قبض نقدية من المورد يزيد حسابه المستحق
            }
        });

        return balance;
    }

    window.openReceiptModal = async (type, date, amount, partyId) => {
        const pType = partiesMap[partyId] ? partiesMap[partyId].type : 'عميل';
        const pName = partiesMap[partyId] ? partiesMap[partyId].name : 'حساب غير معروف';
        
        document.getElementById('recType').innerText = type === 'قبض' ? 'سند قبض' : 'سند صرف';
        document.getElementById('recDate').innerText = date;
        document.getElementById('recPartyName').innerText = pName;
        document.getElementById('recAmount').innerText = `${Number(amount).toLocaleString('ar-EG', {minimumFractionDigits: 2})} ج.م`;
        document.getElementById('recStatusText').innerText = type === 'قبض' ? 'تم الاستلام' : 'تم الصرف';
        
        // حساب الرصيد الحالي بعد إجراء الحركة
        const currentBalance = await calculateCustomerBalance(partyId);
        let prevBalance = currentBalance;
        let newBalance = currentBalance;

        // تحديد الحساب المستحق القبل والبعد بناء على نوع الحساب والحركة المالية
        if (pType === 'عميل') {
            if (type === 'قبض') {
                prevBalance = currentBalance + Number(amount);
            } else {
                prevBalance = currentBalance - Number(amount);
            }
        } else { // مورد
            if (type === 'صرف') {
                prevBalance = currentBalance + Number(amount);
            } else {
                prevBalance = currentBalance - Number(amount);
            }
        }

        document.getElementById('recPrevBalance').innerText = `${prevBalance.toLocaleString('ar-EG', {minimumFractionDigits: 2})} ج.م`;
        document.getElementById('recNewBalance').innerText = `${newBalance.toLocaleString('ar-EG', {minimumFractionDigits: 2})} ج.م`;   
        
        if(receiptModalObj) receiptModalObj.show();
    };

    // معالج مشاركة الفاتورة المعدل لحل مشكلة الصفحة البيضاء والواتساب بشكل نهائي
    document.getElementById('btnDoShare').addEventListener('click', () => {
        const target = document.getElementById('thermalReceipt');
        
        // إجبار النظام على تهيئة صندوق المعاينة للـ Render
        target.style.transform = "scale(1)";
        
        setTimeout(() => {
            html2canvas(target, { 
                scale: 2, // جودة مضاعفة ومتزنة للواتساب
                useCORS: true, 
                allowTaint: true,
                backgroundColor: "#ffffff",
                logging: false,
                width: target.offsetWidth,
                height: target.offsetHeight
            }).then(canvas => {
                // استخراج الصورة كـ Base64 لضمان ثبات البيانات وعدم تأثرها بالـ WebView
                const imgData = canvas.toDataURL('image/png');
                
                // تحويل المخرجات لملف حقيقي ملموس للمتصفح 
                canvas.toBlob(blob => {
                    if (!blob) { alert("فشل إنشاء صورة المعاينة الفورية"); return; }
                    const file = new File([blob], "receipt.png", { type: "image/png" });
                    
                    // محاولة استخدام واجهة المشاركة الأصلية للهواتف (Native Share)
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        navigator.share({
                            files: [file],
                            title: 'إيصال سداد - شركة الزيادي',
                        }).catch(err => {
                            // إذا ألغى العميل أو حدث كراش بالمتصفح، يتم التحويل فوراً للتحميل المباشر الآمن
                            triggerDownload(imgData);
                        });
                    } else {
                        triggerDownload(imgData);
                    }
                }, 'image/png');
            });
        }, 300); // زيادة وقت الانتظار قليلاً للتأكد من رص الحروف العربية بمكانها
    });

    function triggerDownload(imgData) {
        const a = document.createElement('a');
        a.href = imgData;
        a.download = `سند_سداد_${new Date().toISOString().split('T')[0]}.png`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        alert("تنبيه: نظراً لفتح التطبيق من متصفح خارجي/مصغر، تم حفظ الإيصال كصورة بالاستوديو لديك بنجاح. يمكنك الآن إرسالها للعميل عبر الواتساب يدوياً.");
    }

    document.getElementById('voucherForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const partyId = document.getElementById('partyId').value;
        if(!partyId) { alert("الرجاء تحديد الاسم الصحيح من قائمة البحث الذكي المنسدلة"); return; }

        const editId = document.getElementById('editVoucherId').value;
        const submitBtn = document.getElementById('btnSubmitForm');
        submitBtn.disabled = true;
        submitBtn.innerText = editId ? "جاري التحديث..." : "جاري الحفظ...";

        const vDateVal = document.getElementById('vDate').value;
        const vTypeVal = document.getElementById('vType').value;
        const vAmountVal = Number(document.getElementById('vAmount').value);

        const voucherData = {
            date: vDateVal,
            type: vTypeVal,
            partyType: document.getElementById('partyType').value,
            partyId: partyId,
            amount: vAmountVal,
            note: document.getElementById('vNote').value
        };

        try {
            if (editId) {
                await updateDoc(doc(db, "transactions", editId), voucherData);
                alert("تم تحديث بيانات الحركة بنجاح.");
            } else {
                await addDoc(collection(db, "transactions"), voucherData);
            }
            
            resetVoucherForm();
            await loadVouchers();
            openReceiptModal(vTypeVal, vDateVal, vAmountVal, partyId);

        } catch (err) {
            console.error(err);
            alert("حدث خطأ أثناء معالجة العملية.");
        } finally {
            submitBtn.disabled = false;
        }
    });

    window.deleteVoucher = async (id) => {
        if(confirm("هل أنت متأكد من رغبتك في الحذف نهائياً؟")) {
            try {
                await deleteDoc(doc(db, "transactions", id));
                alert("تم الحذف بنجاح.");
                await loadVouchers();
                if (document.getElementById('editVoucherId').value === id) resetVoucherForm();
            } catch (err) {
                alert("فشل إجراء الحذف.");
            }
        }
    };

    window.deleteAllVouchers = async () => {
        if (allVouchers.length === 0) {
            alert("لا توجد بيانات لحذفها.");
            return;
        }

        const confirmFirst = confirm("تنبيه هام جداً: هل أنت متأكد من رغبتك في حذف كافة عمليات القبض والصرف نهائياً؟ لا يمكن التراجع عن هذا الإجراء.");
        if (confirmFirst) {
            const confirmSecond = prompt("لتأكيد الحذف النهائي، يرجى كتابة كلمة (مسح) في الحقل أدناه:");
            
            if (confirmSecond === "مسح") {
                try {
                    const tbody = document.getElementById('vouchersBody');
                    tbody.innerHTML = '<tr><td colspan="8" class="text-center py-4"><div class="spinner-border spinner-border-sm text-danger"></div> جاري حذف البيانات...</td></tr>';
                    
                    for (const voucher of allVouchers) {
                        await deleteDoc(doc(db, "transactions", voucher.id));
                    }
                    
                    alert("تم حذف جميع السندات بنجاح.");
                    resetVoucherForm();
                    await loadVouchers();
                } catch (err) {
                    console.error(err);
                    alert("حدث خطأ أثناء محاولة الحذف الشامل.");
                }
            } else {
                alert("لم يتم تأكيد الكلمة بشكل صحيح، تم إلغاء العملية.");
            }
        }
    };

    window.exportToExcel = () => {
        if (allVouchers.length === 0) {
            alert("لا توجد بيانات لتصديرها.");
            return;
        }

        const dataToExport = allVouchers.map(v => {
            let movement = "";
            if (v.partyType === "عميل" && v.type === "قبض") {
                movement = "سداد منه نقدى";
            } else if (v.partyType === "مورد" && v.type === "صرف") {
                movement = "سداد له نقدى";
            } else {
                movement = v.type;
            }

            return {
                "التاريخ": v.date,
                "الحركة": movement,
                "اسم العميل": partiesMap[v.partyId] ? partiesMap[v.partyId].name : "غير معروف",
                "البيان": "سداد نقدى",
                "عدد جركن": 0,
                "عدد كرتونة": 1,
                "سعر جركن": 0,
                "سعر كرتونة": Number(v.amount || 0)
            };
        });

        const worksheet = XLSX.utils.json_to_sheet(dataToExport);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "الحركات");

        XLSX.writeFile(workbook, `حركات_السداد_${new Date().toISOString().split('T')[0]}.xlsx`);
    };
</script>
