<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استيراد وتصدير العملاء - شركة الزيادي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root { --accent: #0b5e3d; --header-bg: #0b5e3d; --bg-light: #f4f7f6; --white: #ffffff; --border: #dce3de; --text-primary: #1b2e26; }
        body { background: var(--bg-light); font-family: 'Cairo', sans-serif; color: var(--text-primary); padding-bottom: 50px; }
        .header { background: var(--header-bg); padding: 15px; color: white; display: flex; align-items: center; justify-content: space-between; }
        .nav-pills { background: #e8f0ed; border-radius: 15px; padding: 5px; margin: 20px 0; }
        .nav-pills .nav-link { color: var(--accent); font-weight: 700; border-radius: 12px; width: 50%; text-align: center; }
        .nav-pills .nav-link.active { background: var(--accent) !important; color: white !important; }
        .glass-card { background: var(--white); border: 1px solid var(--border); border-radius: 20px; padding: 25px; margin-bottom: 15px; text-align: center; }
        .upload-area { border: 2px dashed var(--accent); border-radius: 15px; padding: 30px; background: #f9fbf9; cursor: pointer; position: relative; }
        #fileInput { position: absolute; width: 100%; height: 100%; top: 0; left: 0; opacity: 0; cursor: pointer; }
        .btn-custom { border-radius: 12px; padding: 12px 25px; font-weight: 700; border: none; width: 100%; margin-top: 15px; }
        .btn-download { background: #e8f0ed; color: var(--accent); border: 1px solid var(--accent); }
        .btn-export { background: var(--accent); color: white; }
        .status-box { margin-top: 20px; padding: 15px; border-radius: 12px; display: none; font-size: 0.9rem; font-weight: 600; }
    </style>
</head>
<body>

<div class="header">
    <a href="customer-list.html" style="color:white;"><i class="fas fa-chevron-right"></i></a>
    <h5 class="m-0 fw-bold">نقل بيانات العملاء</h5>
    <div style="width:20px"></div>
</div>

<div class="container">
    <ul class="nav nav-pills mb-3" id="pills-tab" role="tablist">
        <li class="nav-item" style="width: 50%;"><button class="nav-link active w-100" data-bs-toggle="pill" data-bs-target="#pills-import">استيراد من Excel</button></li>
        <li class="nav-item" style="width: 50%;"><button class="nav-link w-100" data-bs-toggle="pill" data-bs-target="#pills-export">تصدير البيانات</button></li>
    </ul>

    <div class="tab-content">
        <div class="tab-pane fade show active" id="pills-import">
            <div class="glass-card">
                <h6>1. حمل النموذج التجريبي</h6>
                <button class="btn-custom btn-download" onclick="downloadTemplate()"><i class="fas fa-file-download me-2"></i> تحميل النموذج</button>
            </div>
            <div class="glass-card">
                <h6>2. ارفع ملف البيانات</h6>
                <div class="upload-area">
                    <i class="fas fa-cloud-upload-alt fa-3x text-success"></i>
                    <p class="m-0 fw-bold" id="fileName">اضغط هنا لرفع الملف</p>
                    <input type="file" id="fileInput" accept=".xlsx, .xls">
                </div>
                <div id="importStatus" class="status-box"></div>
                <button class="btn-custom btn-export mt-4" id="btnStartImport" disabled onclick="processImport()">بدء الاستيراد</button>
            </div>
        </div>

        <div class="tab-pane fade" id="pills-export">
            <div class="glass-card">
                <i class="fas fa-file-excel fa-4x mb-3 text-success"></i>
                <h5>تصدير قائمة العملاء</h5>
                <button class="btn-custom btn-export" onclick="exportData()">تصدير إلى Excel</button>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, writeBatch, doc, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
        authDomain: "ahmedelzaiady.firebaseapp.com",
        projectId: "ahmedelzaiady",
        storageBucket: "ahmedelzaiady.firebasestorage.app",
        messagingSenderId: "300306825071",
        appId: "1:300306825071:web:0426ddde56280fa090329a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let importedData = [];

    window.downloadTemplate = () => {
        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.json_to_sheet([{ "الاسم بالكامل": "مثال", "رقم الهاتف": "010", "العنوان": "...", "الرصيد الافتتاحي": 0, "النوع (مدين/دائن)": "مدين", "الحد الائتماني": 0 }]);
        XLSX.utils.book_append_sheet(wb, ws, "العملاء");
        XLSX.writeFile(wb, "نموذج_العملاء.xlsx");
    };

    document.getElementById('fileInput').addEventListener('change', (e) => {
        const reader = new FileReader();
        reader.onload = (event) => {
            const data = new Uint8Array(event.target.result);
            importedData = XLSX.utils.sheet_to_json(XLSX.read(data, { type: 'array' }).Sheets[Object.keys(XLSX.read(data, { type: 'array' }).Sheets)[0]]);
            document.getElementById('btnStartImport').disabled = false;
            document.getElementById('importStatus').style.display = 'block';
            document.getElementById('importStatus').innerText = `تم تجهيز ${importedData.length} عميل للرفع.`;
        };
        reader.readAsArrayBuffer(e.target.files[0]);
    });

    window.processImport = async () => {
        const batch = writeBatch(db);
        const colRef = collection(db, "customers");
        
        importedData.forEach(item => {
            const bal = Number(item["الرصيد الافتتاحي"]) || 0;
            const type = (item["النوع (مدين/دائن)"] === "دائن") ? "credit" : "debit";
            batch.set(doc(colRef), {
                name: String(item["الاسم بالكامل"] || ""),
                phone: String(item["رقم الهاتف"] || ""),
                address: item["العنوان"] || "",
                currentBalance: (type === 'debit') ? bal : -bal,
                balanceType: type,
                creditLimit: Number(item["الحد الائتماني"]) || 0,
                createdAt: serverTimestamp()
            });
        });

        await batch.commit();
        alert("تم استيراد العملاء بنجاح!");
        window.location.reload();
    };

    window.exportData = async () => {
    try {
        const querySnapshot = await getDocs(collection(db, "customers"));
        let data = querySnapshot.docs.map(doc => doc.data());

        // إضافة دالة الترتيب هنا (تنازلياً بناءً على الرصيد الحالي)
        data.sort((a, b) => {
            const balanceA = Math.abs(Number(a.currentBalance) || 0);
            const balanceB = Math.abs(Number(b.currentBalance) || 0);
            return balanceB - balanceA; // الترتيب من الأكبر للأصغر
        });

        // تحويل البيانات المرتبة إلى ملف Excel
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "العملاء");
        XLSX.writeFile(wb, "قائمة_العملاء_مرتبة.xlsx");
        
    } catch (e) {
        console.error("خطأ في التصدير:", e);
        alert("حدث خطأ أثناء تصدير البيانات!");
    }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
