<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شركة الزيادي | anas POS Pro</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <link class="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b5e3d">

    <style>
        :root {
            --bg-deep: #f0f5f2;
            --bg-card: #ffffff;
            --glass: rgba(11, 94, 61, 0.07);
            --accent: #0b5e3d;
            --accent-light: #128256;
            --header-bg: #0b5e3d;
            --text-primary: #1b2e26;
            --text-secondary: #61736b;
            --border: #dde8e2;
            --shadow: 0 4px 20px rgba(11, 94, 61, 0.06);
            --shadow-hover: 0 14px 36px rgba(11, 94, 61, 0.12);
            --radius-lg: 22px;
            --radius-md: 14px;
        }

        body.dark-mode {
            --bg-deep: #080c0a;
            --bg-card: #111713;
            --glass: rgba(29, 138, 90, 0.1);
            --accent: #1d8a5a;
            --accent-light: #28b377;
            --header-bg: #090e0b;
            --text-primary: #eef5f1;
            --text-secondary: #7a8e85;
            --border: #1c2720;
            --shadow: 0 8px 28px rgba(0,0,0,0.35);
            --shadow-hover: 0 16px 40px rgba(0,0,0,0.55);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-deep);
            margin: 0;
            color: var(--text-primary);
            line-height: 1.6;
            transition: background 0.3s, color 0.3s;
        }

        /* ════ HEADER ════ */
        header.top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 22px;
            background: var(--header-bg);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 3px 18px rgba(0,0,0,0.12);
        }

        .nav-icons { display: flex; gap: 16px; align-items: center; }
        .nav-icons i { font-size: 20px; color: rgba(255,255,255,0.9); cursor: pointer; }

        .app-title { font-size: 19px; font-weight: 800; color: #fff; letter-spacing: 0.4px; }
        .app-title span { color: #ffce31; }

        .logout-btn {
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.18);
            padding: 7px 15px;
            border-radius: var(--radius-md);
            font-size: 13px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 7px;
            font-weight: 700;
        }

        /* ════ DASHBOARD GRID ════ */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 14px;
            padding: 18px 18px 140px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ════ الكارت الترحيبي المخصص لـ فكري بيه ════ */
        .welcome-widget {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            border-radius: var(--radius-lg);
            padding: 20px 24px;
            color: #fff;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .welcome-text h3 { margin: 0 0 4px; font-size: 19px; font-weight: 800; color: #ffce31; }
        .welcome-text p { margin: 0; font-size: 13px; opacity: 0.9; font-weight: 600; }
        .welcome-time { text-align: left; }
        .welcome-time .time { font-size: 20px; font-weight: 800; display: block; letter-spacing: 1px; }
        .welcome-time .date { font-size: 11px; opacity: 0.8; font-weight: 700; }

        @media (max-width: 480px) {
            .welcome-widget { flex-direction: column; text-align: center; gap: 12px; }
            .welcome-time { text-align: center; }
        }

        /* ════ CARD ════ */
        .card-link { text-decoration: none; color: inherit; display: block; }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 22px 12px 18px;
            text-align: center;
            border: 1.5px solid var(--border);
            transition: transform 0.28s cubic-bezier(0.4,0,0.2,1), box-shadow 0.28s;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .card::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 3px;
            background: var(--accent);
            transform: scaleX(0);
            transition: transform 0.28s ease;
        }

        .card:hover { transform: translateY(-5px); box-shadow: var(--shadow-hover); }
        .card:hover::after { transform: scaleX(1); }

        .icon-box {
            width: 52px; height: 52px;
            background: var(--glass);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px;
            font-size: 22px;
            color: var(--accent);
            transition: 0.25s;
        }
        .card:hover .icon-box { background: var(--accent); color: #fff; }

        .card p { margin: 0; font-size: 13.5px; font-weight: 700; color: var(--text-primary); }

        .archive-card .icon-box { color: var(--gold); background: rgba(223,161,0,0.08); }
        .archive-card:hover .icon-box { background: var(--gold); color: #fff; }

        .report2-card .icon-box { color: #6c3fc8; background: rgba(108,63,200,0.09); }
        .report2-card:hover .icon-box { background: #6c3fc8; color: #fff; }

        /* ════ BOTTOM BAR ════ */
        .bottom-bar-wrapper {
            position: fixed;
            bottom: 18px; left: 50%;
            transform: translateX(-50%);
            width: 94%; max-width: 580px;
            z-index: 1000;
        }
        .bottom-bar {
            background: var(--header-bg);
            display: flex;
            padding: 11px 6px;
            border-radius: 22px;
            box-shadow: 0 8px 28px rgba(11,94,61,0.24);
            border: 1px solid rgba(255,255,255,0.08);
        }
        .nav-action {
            flex: 1; text-align: center;
            color: rgba(255,255,255,0.7);
            text-decoration: none; font-size: 11px; font-weight: 700;
            display: flex; flex-direction: column; align-items: center;
        }
        .nav-action i { font-size: 18px; margin-bottom: 4px; color: #fff; }
    </style>
</head>
<body>

    <header class="top-nav" id="topNavbar">
        <div class="nav-icons"><i class="fas fa-bars"></i></div>
        <div class="app-title">شركة <span>الزيادى</span></div>
        <div class="nav-icons">
            <a href="index.html" class="logout-btn" onclick="sessionStorage.clear();">
                <i class="fas fa-power-off"></i> خروج
            </a>
        </div>
    </header>

    <!-- الشبكة الرئيسية للتحكم (Dashboard Grid) -->
    <div class="dashboard" id="mainDashboard">
        
        <!-- الكارت الترحيبي العريض لـ فكري بيه -->
        <div class="welcome-widget" id="employeeWelcomeWidget" style="display: none;">
            <div class="welcome-text">
                <h3>أهلاً بيك يا فكري بيه</h3>
                <p>قسم المبيعات السريعة والعمليات اليومية لشركة الزيادي</p>
            </div>
            <div class="welcome-time">
                <span class="time" id="liveClock">00:00:00 م</span>
                <span class="date" id="liveDate">الإثنين، 1 يناير 2026</span>
            </div>
        </div>

        <a href="mabiat-menu.html" class="card-link" id="cardSales">
            <div class="card">
                <div class="icon-box"><i class="fas fa-cash-register"></i></div>
                <p>المبيعات</p>
            </div>
        </a>
        <a href="purchase-mgmt.html" class="card-link" id="cardPurchases">
            <div class="card">
                <div class="icon-box"><i class="fas fa-cart-arrow-down"></i></div>
                <p>المشتريات</p>
            </div>
        </a>
        <a href="client_menu.html" class="card-link" id="cardClients">
            <div class="card">
                <div class="icon-box"><i class="fas fa-user-group"></i></div>
                <p>العملاء</p>
            </div>
        </a>
        <a href="supplier-management.html" class="card-link" id="cardSuppliers">
            <div class="card">
                <div class="icon-box"><i class="fas fa-truck-loading"></i></div>
                <p>الموردين</p>
            </div>
        </a>
        <a href="inventory-menu.html" class="card-link" id="cardInventory">
            <div class="card">
                <div class="icon-box"><i class="fas fa-boxes-stacked"></i></div>
                <p>المخزن</p>
            </div>
        </a>
        <a href="vouchers-hub.html" class="card-link" id="cardVouchers">
            <div class="card archive-card">
                <div class="icon-box"><i class="fas fa-file-invoice-dollar"></i></div>
                <p>السندات</p>
            </div>
        </a>
        <a href="banknote.html" class="card-link" id="cardBanknote">
            <div class="card">
                <div class="icon-box"><i class="fas fa-receipt"></i></div>
                <p>النقديه</p>
            </div>
        </a>
        <a href="reports.html" class="card-link" id="cardreports">
            <div class="card report-card">
                <div class="icon-box"><i class="fas fa-chart-bar"></i></div>
                <p>التقارير</p>
            </div>
        </a>
        <a href="reports2.html" class="card-link" id="cardreports2">
            <div class="card report2-card">
                <div class="icon-box"><i class="fas fa-chart-pie"></i></div>
                <p>ملخص المبيعات</p>
            </div>
        </a>
    </div>

    <!-- BOTTOM BAR -->
    <div class="bottom-bar-wrapper">
        <nav class="bottom-bar">
            <a href="sales-invoice.html" class="nav-action"><i class="fas fa-plus-circle"></i><span>بيع سريع</span></a>
            <a href="add-customer.html" class="nav-action"><i class="fas fa-user-plus"></i><span>إضافة عميل</span></a>
            <a href="price-search.html" class="nav-action"><i class="fas fa-magnifying-glass-dollar"></i><span>استعلام سعر</span></a>
            <a href="expenses.html" class="nav-action"><i class="fas fa-money-bill-transfer"></i><span>قيد مصروف</span></a>
        </nav>
    </div>

    <script>
        function startLiveClock() {
            const timeEl = document.getElementById('liveClock');
            const dateEl = document.getElementById('liveDate');
            
            setInterval(() => {
                const now = new Date();
                if(timeEl) {
                    timeEl.innerText = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                }
                if(dateEl) {
                    dateEl.innerText = now.toLocaleDateString('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                }
            }, 1000);
        }

        window.onload = () => {
            const role = sessionStorage.getItem('role') || 'employee';
            const savedPermissions = sessionStorage.getItem('permissions');
            const userPermissions = savedPermissions ? JSON.parse(savedPermissions) : ['sales','clients','vouchers','reports2'];

            const permMap = {
                cardSales: 'sales', cardPurchases: 'purchases', cardClients: 'clients',
                cardSuppliers: 'suppliers', cardInventory: 'inventory_admin',
                cardVouchers: 'vouchers', cardBanknote: 'banknote',
                cardreports: 'reports', cardreports2: 'reports2'
            };

            const welcomeWidget = document.getElementById('employeeWelcomeWidget');

            if (role === 'admin') {
                if (welcomeWidget) welcomeWidget.style.display = 'none';
                
                Object.keys(permMap).forEach(id => {
                    const el = document.getElementById(id);
                    if (!el) return;
                    if (id === 'cardreports2') { el.style.display = 'none'; } 
                    else { el.style.display = ''; }
                });
            } else {
                if (welcomeWidget) {
                    welcomeWidget.style.display = 'flex';
                    startLiveClock();
                }

                Object.keys(permMap).forEach(id => {
                    const el = document.getElementById(id);
                    if (!el) return;
                    if (userPermissions.includes(permMap[id])) { el.style.display = ''; } 
                    else { el.style.display = 'none'; }
                });
            }
        };
    </script>
</body>
</html>
