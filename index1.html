<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شركة الزيادي | anas POS Pro 3D</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- استدعاء مكتبة Three.js لتشغيل محرك الـ 3D الحقيقي في الخلفية -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0b5e3d">

    <style>
        :root {
            --bg-deep: #f0f4f1;
            --bg-card: rgba(255, 255, 255, 0.45);
            --card-border: rgba(255, 255, 255, 0.6);
            --accent: #0b5e3d;
            --accent-light: #16aa6f;
            --header-bg: #0b5e3d;
            --text-primary: #0f241b;
            --shadow: 0 20px 40px rgba(11, 94, 61, 0.08);
            --shadow-hover: 0 30px 60px rgba(11, 94, 61, 0.2);
            --radius-lg: 24px;
            --radius-md: 16px;
        }

        body.dark-mode {
            --bg-deep: #050806;
            --bg-card: rgba(16, 25, 21, 0.5);
            --card-border: rgba(255, 255, 255, 0.07);
            --accent: #16aa6f;
            --accent-light: #22d38f;
            --header-bg: #090e0b;
            --text-primary: #f0f7f4;
            --shadow: 0 25px 50px rgba(0,0,0,0.5);
            --shadow-hover: 0 35px 70px rgba(22, 170, 111, 0.25);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-deep);
            margin: 0;
            color: var(--text-primary);
            overflow-x: hidden;
            perspective: 1000px;
        }

        /* ════ كود الـ 3D Canvas للخلفية المتفاعلة ════ */
        #three-canvas-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        /* ════ HEADER ════ */
        header.top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: var(--header-bg);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .nav-icons { display: flex; gap: 18px; align-items: center; }
        .nav-icons i { font-size: 22px; color: #fff; cursor: pointer; }
        .app-title { font-size: 20px; font-weight: 800; color: #fff; }
        .app-title span { color: #ffce31; }

        .logout-btn {
            background: rgba(255,255,255,0.15);
            color: #fff;
            padding: 8px 16px;
            border-radius: var(--radius-md);
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
        }

        /* ════ DASHBOARD GRID ════ */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 25px;
            padding: 30px 24px 150px;
            max-width: 1250px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        /* ════ كارت الترحيب الفاخر ════ */
        .welcome-widget {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, rgba(7, 58, 37, 0.85) 0%, rgba(11, 94, 61, 0.9) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            padding: 28px 32px;
            color: #fff;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .welcome-text h3 { margin: 0; font-size: 21px; font-weight: 800; color: #ffce31; }
        .welcome-time { text-align: left; background: rgba(0, 0, 0, 0.2); padding: 10px 18px; border-radius: var(--radius-md); }
        .welcome-time .time { font-size: 22px; font-weight: 800; display: block; }
        .welcome-time .date { font-size: 11px; opacity: 0.8; }

        /* ════ تصميم الكروت الـ 3D الفاخرة (Isometric Glass) ════ */
        .card-link { text-decoration: none; color: inherit; display: block; }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(16px) saturate(120%);
            -webkit-backdrop-filter: blur(16px) saturate(120%);
            border-radius: var(--radius-lg);
            padding: 30px 16px;
            text-align: center;
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow);
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            transform-style: preserve-3d;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* تأثير الـ Hover ثلاثي الأبعاد */
        .card:hover {
            transform: translateY(-12px) rotateX(8deg) rotateY(-4deg);
            box-shadow: var(--shadow-hover);
            background: rgba(255, 255, 255, 0.65);
            border-color: var(--accent-light);
        }
        body.dark-mode .card:hover {
            background: rgba(25px, 38px, 32px, 0.7);
        }

        /* حاوية الأيقونة ثلاثية الأبعاد المجسمة */
        .icon-box-3d {
            width: 75px; height: 75px;
            background: linear-gradient(135deg, rgba(255,255,255,0.8) 0%, rgba(240,240,240,0.3) 100%);
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 20px;
            font-size: 32px;
            color: var(--accent);
            box-shadow: inset 2px 2px 5px rgba(255,255,255,0.5), 5px 10px 20px rgba(0,0,0,0.05);
            transform: translateZ(30px); /* يبرز الأيقونة للأمام في البعد الثالث */
            transition: all 0.4s ease;
            position: relative;
        }

        /* تأثير توهج كرت الزيت عند الوقوف عليه */
        .card:hover .icon-box-3d {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            color: #fff;
            transform: translateZ(45px) scale(1.1) rotate(8deg);
            box-shadow: 0 15px 30px rgba(11, 94, 61, 0.25);
        }

        .card p { margin: 0; font-size: 16px; font-weight: 800; color: var(--text-primary); transform: translateZ(20px); }

        /* تلوين جراكن الكروت الخاصة بالفخامة الاستثمارية */
        .archive-card .icon-box-3d { color: #d48c00; }
        .archive-card:hover .icon-box-3d { background: linear-gradient(135deg, #d48c00 0%, #ffb703 100%); box-shadow: 0 15px 30px rgba(212,140,0,0.3); }

        .report2-card .icon-box-3d { color: #5e35b1; }
        .report2-card:hover .icon-box-3d { background: linear-gradient(135deg, #5e35b1 0%, #7e57c2 100%); box-shadow: 0 15px 30px rgba(94,53,177,0.3); }

        /* ════ FLOATING HUB ════ */
        .floating-hub-container {
            position: fixed; bottom: 110px; right: 24px; z-index: 2000;
            display: flex; flex-direction: column; align-items: center; gap: 14px;
        }
        .floating-options {
            display: flex; flex-direction: column; gap: 12px; opacity: 0; pointer-events: none;
            transform: translateY(20px); transition: all 0.3s ease;
        }
        .floating-hub-container.active .floating-options { opacity: 1; pointer-events: auto; transform: translateY(0); }
        .floating-btn-sub {
            text-decoration: none; display: flex; align-items: center; gap: 12px;
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); padding: 11px 20px; border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid rgba(11,94,61,0.1);
        }
        .floating-btn-sub i { width: 34px; height: 34px; background: var(--accent); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .floating-btn-sub span { font-size: 14px; font-weight: 700; color: var(--text-primary); }
        .main-hub-trigger {
            width: 60px; height: 60px; background: var(--accent); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; color: #fff; font-size: 22px; cursor: pointer;
            box-shadow: 0 10px 30px rgba(11,94,61,0.3); transition: 0.3s;
        }
        .floating-hub-container.active .main-hub-trigger { transform: rotate(135deg); background: #111; }

        /* ════ BOTTOM BAR ════ */
        .bottom-bar-wrapper { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); width: 94%; max-width: 580px; z-index: 1000; }
        .bottom-bar { background: #0b5e3d; display: flex; padding: 12px 8px; border-radius: 24px; box-shadow: 0 15px 35px rgba(11,94,61,0.3); }
        .nav-action { flex: 1; text-align: center; color: rgba(255,255,255,0.75); text-decoration: none; font-size: 12px; font-weight: 700; display: flex; flex-direction: column; align-items: center; }
        .nav-action i { font-size: 19px; margin-bottom: 5px; color: #fff; }
        .nav-action:hover { color: #ffce31; }

        @media (max-width: 600px) {
            .welcome-widget { flex-direction: column; text-align: center; gap: 16px; padding: 22px; }
            .welcome-time { text-align: center; width: 100%; }
        }
    </style>
</head>
<body>

    <!-- الـ Canvas المسؤولة عن رندر جراكن الزيت الـ 3D الحقيقية -->
    <canvas id="three-canvas-bg"></canvas>

    <header class="top-nav" id="topNavbar">
        <div class="nav-icons"><i class="fas fa-bars"></i></div>
        <div class="app-title">شركة <span>الزيادى</span></div>
        <div class="nav-icons">
            <a href="index.html" class="logout-btn" onclick="sessionStorage.clear();">
                <i class="fas fa-power-off"></i> خروج
            </a>
        </div>
    </header>

    <!-- الـ كـارت الـعـائـم الـذكـي -->
    <div class="floating-hub-container" id="floatingHub" style="display: none;">
        <div class="floating-options">
            <a href="new-order.html" class="floating-btn-sub">
                <i class="fa-solid fa-plus"></i>
                <span>طلب جديد</span>
            </a>
            <a href="all-orders.html" class="floating-btn-sub">
                <i class="fa-solid fa-boxes-packing"></i>
                <span>كل الطلبات</span>
            </a>
        </div>
        <div class="main-hub-trigger" onclick="toggleFloatingHub(event)">
            <i class="fa-solid fa-layer-group"></i>
        </div>
    </div>

    <!-- الشبكة الرئيسية للتحكم (Dashboard Grid) -->
    <div class="dashboard" id="mainDashboard">
        
        <!-- كارت الترحيب الذكي -->
        <div class="welcome-widget" id="employeeWelcomeWidget" style="display: none;">
            <div class="welcome-text">
                <h3 id="dynamicWelcomeText">جاري التحميل...</h3>
            </div>
            <div class="welcome-time">
                <span class="time" id="liveClock">00:00:00 م</span>
                <span class="date" id="liveDate">...</span>
            </div>
        </div>

        <!-- الكروت المربعة بأيقونات جراكن الزيت ثلاثية الأبعاد المجسمة -->
        <a href="mabiat-menu.html" class="card-link" id="cardSales">
            <div class="card">
                <div class="icon-box-3d"><i class="fa-solid fa-jar-wheat"></i></div>
                <p>المبيعات</p>
            </div>
        </a>
        <a href="purchase-mgmt.html" class="card-link" id="cardPurchases">
            <div class="card">
                <div class="icon-box-3d"><i class="fa-solid fa-jar"></i></div>
                <p>المشتريات</p>
            </div>
        </a>
        <a href="client_menu.html" class="card-link" id="cardClients">
            <div class="card">
                <div class="icon-box-3d"><i class="fa-solid fa-jar-wheat"></i></div>
                <p>العملاء</p>
            </div>
        </a>
        <a href="supplier-management.html" class="card-link" id="cardSuppliers">
            <div class="card">
                <div class="icon-box-3d"><i class="fa-solid fa-jar"></i></div>
                <p>الموردين</p>
            </div>
        </a>
        <a href="inventory-menu.html" class="card-link" id="cardInventory">
            <div class="card">
                <div class="icon-box-3d"><i class="fa-solid fa-bucket"></i></div>
                <p>المخزن</p>
            </div>
        </a>
        <a href="vouchers-hub.html" class="card-link" id="cardVouchers">
            <div class="card archive-card">
                <div class="icon-box-3d"><i class="fa-solid fa-jar-wheat"></i></div>
                <p>السندات</p>
            </div>
        </a>
        <a href="banknote.html" class="card-link" id="cardBanknote">
            <div class="card">
                <div class="icon-box-3d"><i class="fa-solid fa-jar"></i></div>
                <p>النقديه</p>
            </div>
        </a>
        <a href="reports.html" class="card-link" id="cardreports">
            <div class="card report-card">
                <div class="icon-box-3d"><i class="fa-solid fa-bucket"></i></div>
                <p>التقارير</p>
            </div>
        </a>
        <a href="reports2.html" class="card-link" id="cardreports2">
            <div class="card report2-card">
                <div class="icon-box-3d"><i class="fa-solid fa-jar-wheat"></i></div>
                <p>ملخص المبيعات</p>
            </div>
        </a>
    </div>

    <!-- BOTTOM BAR -->
    <div class="bottom-bar-wrapper">
        <nav class="bottom-bar">
            <a href="sales-invoice.html" class="nav-action"><i class="fas fa-plus-circle"></i><span>بيع سريع</span></a>
            <a href="add-customer.html" class="nav-action"><i class="fas fa-user-plus"></i><span>إضافة عميل</span></a>
            <a href="price-search.html" class="nav-action"><i class="fas fa-magnifying-glass-dollar"></i><span>استعلام سعر</span></a>
            <a href="expenses.html" class="nav-action"><i class="fas fa-money-bill-transfer"></i><span>قيد مصروف</span></a>
        </nav>
    </div>

    <script>
        /* ══════ أولاً: كود الـ JavaScript الخاص بالصلاحيات والأمان (تم إصلاحه وإحكامه بالكامل) ══════ */
        function toggleFloatingHub(event) {
            event.stopPropagation();
            const hub = document.getElementById('floatingHub');
            hub.classList.toggle('active');
        }

        document.addEventListener('click', function() {
            const hub = document.getElementById('floatingHub');
            if (hub && hub.classList.contains('active')) {
                hub.classList.remove('active');
            }
        });

        function updateWelcomeMessage() {
            const textEl = document.getElementById('dynamicWelcomeText');
            if (!textEl) return;
            const hour = new Date().getHours();
            let msg = "يا فكري بيه 🌟 منور في أي وقت.";
            if (hour >= 5 && hour < 11) msg = "صباح الفل يا فكري بيه ☀️ يومك زي القشطة.";
            else if (hour >= 11 && hour < 15) msg = "مساء الفل يا فكري بيه 👋 منور يا بطل.";
            else if (hour >= 15 && hour < 18) msg = "مساء العسل يا فكري بيه ✨ نهارك سعيد.";
            else if (hour >= 18 && hour < 23) msg = "مساء الورد يا فكري بيه 🌙 ليلتك جميلة.";
            textEl.innerText = msg;
        }

        function startLiveClock() {
            const timeEl = document.getElementById('liveClock');
            const dateEl = document.getElementById('liveDate');
            updateWelcomeMessage();
            setInterval(() => {
                const now = new Date();
                if(timeEl) timeEl.innerText = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                if(dateEl) dateEl.innerText = now.toLocaleDateString('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            }, 1000);
        }

        // الكود المسؤول عن فحص الصلاحيات وعرض الكروت بناءً على دور المستخدم
        window.addEventListener('DOMContentLoaded', () => {
            const role = sessionStorage.getItem('role') || 'employee';
            const savedPermissions = sessionStorage.getItem('permissions');
            const userPermissions = savedPermissions ? JSON.parse(savedPermissions) : ['sales','clients','vouchers','reports2'];

            const permMap = {
                cardSales: 'sales', cardPurchases: 'purchases', cardClients: 'clients',
                cardSuppliers: 'suppliers', cardInventory: 'inventory_admin',
                cardVouchers: 'vouchers', cardBanknote: 'banknote',
                cardreports: 'reports', cardreports2: 'reports2'
            };

            const welcomeWidget = document.getElementById('employeeWelcomeWidget');
            const floatingHub = document.getElementById('floatingHub');

            if (role === 'admin') {
                if (welcomeWidget) welcomeWidget.style.display = 'none';
                if (floatingHub) floatingHub.style.display = 'none'; 
                Object.keys(permMap).forEach(id => {
                    const el = document.getElementById(id);
                    if (!el) return;
                    if (id === 'cardreports2') el.style.display = 'none'; 
                    else el.style.display = '';
                });
            } else {
                if (welcomeWidget) {
                    welcomeWidget.style.display = 'flex';
                    startLiveClock();
                }
                if (floatingHub) floatingHub.style.display = 'flex'; 
                Object.keys(permMap).forEach(id => {
                    const el = document.getElementById(id);
                    if (!el) return;
                    if (userPermissions.includes(permMap[id])) el.style.display = ''; 
                    else el.style.display = 'none';
                });
            }
        });

        /* ══════ ثانياً: محرك الـ 3D لإنتاج جراكن الزيت العائمة (HubSpot 3D Style) ══════ */
        const canvas = document.getElementById('three-canvas-bg');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // إضاءة سينمائية فخمة تبرز تدرج ولون الزيت النقي وعمقه
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffb703, 1.5); // لون ذهبي زيتي تينت
        directionalLight.position.set(5, 10, 7);
        scene.add(directionalLight);

        // إنشاء مجسمات جراكن زيت 3D هندسية هندسية رشيقة
        const objectsArray = [];
        const geometry = new THREE.CylinderGeometry(0.6, 0.8, 1.8, 6); // شكل هندسي قريب للجركن الـ 3D العصري
        const material = new THREE.MeshPhongMaterial({
            color: 0x0b5e3d,
            shininess: 100,
            transparent: true,
            opacity: 0.09, // شفافية ناعمة جداً لعدم تشتيت القراءة
            wireframe: false
        });

        // توزيع عشوائي للجراكن في الفضاء ثلاثي الأبعاد
        for(let i=0; i<12; i++) {
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.x = (Math.random() - 0.5) * 15;
            mesh.position.y = (Math.random() - 0.5) * 15;
            mesh.position.z = (Math.random() - 0.5) * 10 - 5;
            mesh.rotation.x = Math.random() * Math.PI;
            mesh.rotation.y = Math.random() * Math.PI;
            
            // سرعات دوران مختلفة لكل جركن زيت
            mesh.userData = {
                speedX: (Math.random() - 0.5) * 0.005,
                speedY: (Math.random() - 0.5) * 0.005
            };
            scene.add(mesh);
            objectsArray.push(mesh);
        }

        camera.position.z = 5;

        // تتبع حركة الماوس لإحداث تأثير بارالاكس 3D تفاعلي للموقع
        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX - window.innerWidth / 2) * 0.0005;
            mouseY = (e.clientY - window.innerHeight / 2) * 0.0005;
        });

        // Loop التحريك والـ Rendering المستمر
        function animate() {
            requestAnimationFrame(animate);

            // تحريك كل جركن بشكل مستقل
            objectsArray.forEach(obj => {
                obj.rotation.x += obj.userData.speedX;
                obj.rotation.y += obj.userData.speedY;
                // حركة عائمة خفيفة للأعلى والأسفل
                obj.position.y += Math.sin(Date.now() * 0.001 + obj.position.x) * 0.002;
            });

            // تفاعل الكاميرا بالكامل مع حركة الماوس بنعومة
            camera.position.x += (mouseX - camera.position.x) * 0.05;
            camera.position.y += (-mouseY - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
        }
        animate();

        // إعادة ضبط الأبعاد عند تغيير حجم شاشة الجوال أو الكومبيوتر
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
