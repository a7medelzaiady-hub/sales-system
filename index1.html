<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شركة الزيادي | anas POS Pro</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <link class="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b5e3d">

    <style>
        :root {
            --bg-deep: #f4f8f6;
            --bg-card: #ffffff;
            --glass: rgba(11, 94, 61, 0.06);
            --accent: #0b5e3d;
            --accent-light: #16aa6f;
            --header-bg: #0b5e3d;
            --text-primary: #0f241b;
            --text-secondary: #52665d;
            --border: #e2ede8;
            --shadow: 0 10px 30px rgba(11, 94, 61, 0.05);
            --shadow-hover: 0 20px 45px rgba(11, 94, 61, 0.15);
            --radius-lg: 24px;
            --radius-md: 16px;
        }

        body.dark-mode {
            --bg-deep: #060a08;
            --bg-card: #101613;
            --glass: rgba(22, 170, 111, 0.08);
            --accent: #16aa6f;
            --accent-light: #22d38f;
            --header-bg: #090e0b;
            --text-primary: #f0f7f4;
            --text-secondary: #83998f;
            --border: #1a2420;
            --shadow: 0 12px 35px rgba(0,0,0,0.4);
            --shadow-hover: 0 22px 50px rgba(0,0,0,0.6);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-deep);
            margin: 0;
            color: var(--text-primary);
            line-height: 1.6;
            transition: background 0.3s, color 0.3s;
        }

        /* ════ HEADER ════ */
        header.top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: var(--header-bg);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .nav-icons { display: flex; gap: 18px; align-items: center; }
        .nav-icons i { font-size: 22px; color: rgba(255,255,255,0.9); cursor: pointer; transition: 0.2s; }
        .nav-icons i:hover { transform: scale(1.1); color: #ffce31; }

        .app-title { font-size: 20px; font-weight: 800; color: #fff; letter-spacing: 0.5px; }
        .app-title span { color: #ffce31; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }

        .logout-btn {
            background: rgba(255,255,255,0.12);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: var(--radius-md);
            font-size: 13px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            transition: 0.2s;
        }
        .logout-btn:hover { background: #e41e3f; border-color: #e41e3f; }

        /* ════ DASHBOARD GRID ════ */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
            gap: 20px;
            padding: 24px 24px 140px;
            max-width: 1250px;
            margin: 0 auto;
        }

        /* ════ كارت الترحيب السريع المختصر ════ */
        .welcome-widget {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #073a25 0%, #0b5e3d 50%, #16aa6f 100%);
            background-size: 200% 200%;
            animation: gradientMove 8s ease infinite;
            border-radius: var(--radius-lg);
            padding: 28px 32px;
            color: #fff;
            box-shadow: 0 15px 35px rgba(11, 94, 61, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .welcome-widget::before {
            content: '';
            position: absolute;
            top: -50%; right: -20%;
            width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(255,206,49,0.15) 0%, transparent 70%);
            pointer-events: none;
        }

        .welcome-text h3 { 
            margin: 0; 
            font-size: 21px; 
            font-weight: 800; 
            color: #ffce31; 
            letter-spacing: 0.3px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.3);
            transition: all 0.5s ease;
            line-height: 1.5;
        }
        
        .welcome-time { text-align: left; background: rgba(0, 0, 0, 0.15); padding: 10px 18px; border-radius: var(--radius-md); backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.05); }
        .welcome-time .time { font-size: 22px; font-weight: 800; display: block; color: #fff; letter-spacing: 1px; }
        .welcome-time .date { font-size: 11px; opacity: 0.85; font-weight: 700; color: #e2ede8; }

        @keyframes gradientMove {
            0% { background-position: 0% 51%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 51%; }
        }

        @media (max-width: 600px) {
            .welcome-widget { flex-direction: column; text-align: center; gap: 16px; padding: 22px; }
            .welcome-time { text-align: center; width: 100%; }
        }

        /* ════ CARDS PREMIUM DESIGN ════ */
        .card-link { text-decoration: none; color: inherit; display: block; }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 30px 16px 26px;
            text-align: center;
            border: 1px solid var(--border);
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, transparent, rgba(255,255,255,0.05));
            opacity: 0; transition: 0.3s;
        }

        .card::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent), var(--accent-light));
            transform: scaleX(0);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-hover);
            border-color: rgba(11, 94, 61, 0.2);
        }
        .card:hover::before { opacity: 1; }
        .card:hover::after { transform: scaleX(1); }

        .icon-box {
            width: 64px; height: 64px;
            background: var(--glass);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            font-size: 26px;
            color: var(--accent);
            transition: all 0.3s ease;
        }
        
        .card:hover .icon-box {
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            color: #fff;
            transform: scale(1.1) rotate(-4deg);
            box-shadow: 0 8px 20px rgba(11, 94, 61, 0.2);
        }

        .card p { margin: 0; font-size: 15px; font-weight: 700; color: var(--text-primary); transition: color 0.2s; }
        .card:hover p { color: var(--accent); }

        .archive-card .icon-box { color: #d48c00; background: rgba(212,140,0,0.07); }
        .archive-card:hover .icon-box { background: linear-gradient(135deg, #d48c00, #ffb703); box-shadow: 0 8px 20px rgba(212,140,0,0.2); }
        .archive-card::after { background: linear-gradient(90deg, #d48c00, #ffb703); }

        .report2-card .icon-box { color: #5e35b1; background: rgba(94,53,177,0.07); }
        .report2-card:hover .icon-box { background: linear-gradient(135deg, #5e35b1, #7e57c2); box-shadow: 0 8px 20px rgba(94,53,177,0.2); }
        .report2-card::after { background: linear-gradient(90deg, #5e35b1, #7e57c2); }

        /* ════ الـ كـارت الـعـائـم الـمُـعـدّل عـلـى الـيـمـيـن (FLOATING HUB) ════ */
        .floating-hub-container {
            position: fixed;
            bottom: 100px; 
            right: 24px; 
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .floating-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px) scale(0.95);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .floating-hub-container.active .floating-options {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0) scale(1);
        }

        .floating-btn-sub {
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 11px 20px;
            border-radius: 30px;
            box-shadow: 0 8px 25px rgba(11, 94, 61, 0.08);
            border: 1px solid rgba(11, 94, 61, 0.15);
            transition: all 0.25s ease;
            white-space: nowrap;
        }

        .floating-btn-sub i {
            width: 34px; height: 34px;
            background: var(--accent);
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: 0.25s;
        }

        .floating-btn-sub span {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .floating-btn-sub:hover {
            transform: scale(1.04) translateY(-2px);
            background: #fff;
            border-color: var(--accent-light);
            box-shadow: 0 12px 30px rgba(11, 94, 61, 0.18);
        }
        .floating-btn-sub:hover i {
            background: var(--accent-light);
            transform: scale(1.1);
        }

        .main-hub-trigger {
            width: 60px; height: 60px;
            background: var(--accent); 
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 22px;
            box-shadow: 0 10px 28px rgba(11, 94, 61, 0.3);
            cursor: pointer;
            border: 2px solid rgba(255,255,255,0.15);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .main-hub-trigger i { transition: transform 0.35s ease; }

        .floating-hub-container.active .main-hub-trigger {
            background: #111713; 
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
            transform: scale(0.95);
        }

        .floating-hub-container.active .main-hub-trigger i { transform: rotate(135deg); }

        /* ════ BOTTOM BAR ════ */
        .bottom-bar-wrapper {
            position: fixed;
            bottom: 18px; left: 50%;
            transform: translateX(-50%);
            width: 94%; max-width: 580px;
            z-index: 1000;
        }
        .bottom-bar {
            background: #0b5e3d;
            display: flex;
            padding: 12px 8px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(11,94,61,0.3);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .nav-action {
            flex: 1; text-align: center;
            color: rgba(255,255,255,0.75);
            text-decoration: none; font-size: 12px; font-weight: 700;
            display: flex; flex-direction: column; align-items: center;
            transition: 0.2s;
        }
        .nav-action i { font-size: 19px; margin-bottom: 5px; color: #fff; transition: 0.2s; }
        .nav-action:hover { color: #ffce31; }
        .nav-action:hover i { transform: translateY(-2px); color: #ffce31; }
    </style>
</head>
<body>

    <header class="top-nav" id="topNavbar">
        <div class="nav-icons"><i class="fas fa-bars"></i></div>
        <div class="app-title">شركة <span>الزيادى</span></div>
        <div class="nav-icons">
            <a href="index.html" class="logout-btn" onclick="sessionStorage.clear();">
                <i class="fas fa-power-off"></i> خروج
            </a>
        </div>
    </header>

    <!-- الـ كـارت الـعـائـم الـذكـي -->
    <div class="floating-hub-container" id="floatingHub" style="display: none;">
        <div class="floating-options">
            <a href="new-order.html" class="floating-btn-sub">
                <i class="fa-solid fa-plus"></i>
                <span>طلب جديد</span>
            </a>
            <a href="all-orders.html" class="floating-btn-sub">
                <i class="fa-solid fa-boxes-packing"></i>
                <span>كل الطلبات</span>
            </a>
        </div>
        <div class="main-hub-trigger" onclick="toggleFloatingHub(event)">
            <i class="fa-solid fa-layer-group"></i>
        </div>
    </div>

    <!-- الشبكة الرئيسية للتحكم (Dashboard Grid) -->
    <div class="dashboard" id="mainDashboard">
        
        <!-- كارت الترحيب السريع -->
        <div class="welcome-widget" id="employeeWelcomeWidget" style="display: none;">
            <div class="welcome-text">
                <h3 id="dynamicWelcomeText">صباح الفل يا رياسه ☀️   .</h3>
            </div>
            <div class="welcome-time">
                <span class="time" id="liveClock">00:00:00 م</span>
                <span class="date" id="liveDate">الإثنين، 1 يناير 2026</span>
            </div>
        </div>

        <a href="mabiat-menu.html" class="card-link" id="cardSales">
            <div class="card">
                <div class="icon-box"><i class="fa-solid fa-wallet"></i></div>
                <p>المبيعات</p>
            </div>
        </a>
        <a href="purchase-mgmt.html" class="card-link" id="cardPurchases">
            <div class="card">
                <div class="icon-box"><i class="fa-solid fa-square-minus"></i></div>
                <p>المشتريات</p>
            </div>
        </a>
        <a href="client_menu.html" class="card-link" id="cardClients">
            <div class="card">
                <div class="icon-box"><i class="fa-solid fa-id-card-clip"></i></div>
                <p>العملاء</p>
            </div>
        </a>
        <a href="supplier-management.html" class="card-link" id="cardSuppliers">
            <div class="card">
                <div class="icon-box"><i class="fa-solid fa-truck-ramp-box"></i></div>
                <p>الموردين</p>
            </div>
        </a>
        <a href="inventory-menu.html" class="card-link" id="cardInventory">
            <div class="card">
                <div class="icon-box"><i class="fa-solid fa-warehouse"></i></div>
                <p>المخزن</p>
            </div>
        </a>
        <a href="vouchers-hub.html" class="card-link" id="cardVouchers">
            <div class="card archive-card">
                <div class="icon-box"><i class="fa-solid fa-money-check-dollar"></i></div>
                <p>السندات</p>
            </div>
        </a>
        <a href="banknote.html" class="card-link" id="cardBanknote">
            <div class="card">
                <div class="icon-box"><i class="fa-solid fa-file-invoice-dollar"></i></div>
                <p>النقديه</p>
            </div>
        </a>
        <a href="reports.html" class="card-link" id="cardreports">
            <div class="card report-card">
                <div class="icon-box"><i class="fa-solid fa-chart-line"></i></div>
                <p>التقارير</p>
            </div>
        </a>
        <a href="reports2.html" class="card-link" id="cardreports2">
            <div class="card report2-card">
                <div class="icon-box"><i class="fa-solid fa-chart-pie"></i></div>
                <p>ملخص المبيعات</p>
            </div>
        </a>
    </div>

    <!-- BOTTOM BAR -->
    <div class="bottom-bar-wrapper">
        <nav class="bottom-bar">
            <a href="sales-invoice.html" class="nav-action"><i class="fas fa-plus-circle"></i><span>بيع سريع</span></a>
            <a href="add-customer.html" class="nav-action"><i class="fas fa-user-plus"></i><span>إضافة عميل</span></a>
            <a href="price-search.html" class="nav-action"><i class="fas fa-magnifying-glass-dollar"></i><span>استعلام سعر</span></a>
            <a href="expenses.html" class="nav-action"><i class="fas fa-money-bill-transfer"></i><span>قيد مصروف</span></a>
        </nav>
    </div>

    <script>
        function toggleFloatingHub(event) {
            event.stopPropagation();
            const hub = document.getElementById('floatingHub');
            hub.classList.toggle('active');
        }

        document.addEventListener('click', function() {
            const hub = document.getElementById('floatingHub');
            if (hub && hub.classList.contains('active')) {
                hub.classList.remove('active');
            }
        });

        // تحديث الرسائل السريعة والمختصرة جداً بناء على طلبك
        function updateWelcomeMessage() {
            const textEl = document.getElementById('dynamicWelcomeText');
            if (!textEl) return;

            const hour = new Date().getHours();
            let msg = "";

            if (hour >= 5 && hour < 11) {
                msg = "صباح الفل يا فكري بيه ☀️ يومك زي القشطة.";
            } else if (hour >= 11 && hour < 15) {
                msg = "مساء الفل يا فكري بيه 👋 منور يا بطل.";
            } else if (hour >= 15 && hour < 18) {
                msg = "مساء العسل يا فكري بيه ✨ نهارك سعيد.";
            } else if (hour >= 18 && hour < 23) {
                msg = "مساء الورد يا فكري بيه 🌙 ليلتك جميلة.";
            } else {
                msg = "يا فكري بيه 🌟 منور في أي وقت.";
            }

            textEl.innerText = msg;
        }

        function startLiveClock() {
            const timeEl = document.getElementById('liveClock');
            const dateEl = document.getElementById('liveDate');
            
            updateWelcomeMessage();

            setInterval(() => {
                const now = new Date();
                if(timeEl) {
                    timeEl.innerText = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                }
                if(dateEl) {
                    dateEl.innerText = now.toLocaleDateString('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                }
                
                if (now.getMinutes() === 0 && now.getSeconds() === 0) {
                    updateWelcomeMessage();
                }
            }, 1000);
        }

        window.onload = () => {
            const role = sessionStorage.getItem('role') || 'employee';
            const savedPermissions = sessionStorage.getItem('permissions');
            const userPermissions = savedPermissions ? JSON.parse(savedPermissions) : ['sales','clients','vouchers','reports2'];

            const permMap = {
                cardSales: 'sales', cardPurchases: 'purchases', cardClients: 'clients',
                cardSuppliers: 'suppliers', cardInventory: 'inventory_admin',
                cardVouchers: 'vouchers', cardBanknote: 'banknote',
                cardreports: 'reports', cardreports2: 'reports2'
            };

            const welcomeWidget = document.getElementById('employeeWelcomeWidget');
            const floatingHub = document.getElementById('floatingHub');

            if (role === 'admin') {
                if (welcomeWidget) welcomeWidget.style.display = 'none';
                if (floatingHub) floatingHub.style.display = 'none'; 
                
                Object.keys(permMap).forEach(id => {
                    const el = document.getElementById(id);
                    if (!el) return;
                    if (id === 'cardreports2') { el.style.display = 'none'; } 
                    else { el.style.display = ''; }
                });
            } else {
                if (welcomeWidget) {
                    welcomeWidget.style.display = 'flex';
                    startLiveClock();
                }
                if (floatingHub) floatingHub.style.display = 'flex'; 

                Object.keys(permMap).forEach(id => {
                    const el = document.getElementById(id);
                    if (!el) return;
                    if (userPermissions.includes(permMap[id])) { el.style.display = ''; } 
                    else { el.style.display = 'none'; }
                });
            }
        };
    </script>
</body>
</html>
