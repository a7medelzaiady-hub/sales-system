<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شركة الزيادي | anas POS Pro 3D Cinematic</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- مكتبات الـ 3D العالمية لتصميم حركة تشبه Nike Reactor -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            --bg-deep: #050907; /* خلفية داكنة فخمة جداً لإبراز إضاءة الـ 3D */
            --bg-card: rgba(18, 30, 24, 0.4);
            --card-border: rgba(255, 255, 255, 0.05);
            --accent: #16aa6f;
            --accent-light: #22d38f;
            --header-bg: rgba(5, 9, 7, 0.85);
            --text-primary: #f0f7f4;
            --shadow: 0 30px 60px rgba(0,0,0,0.4);
            --shadow-hover: 0 40px 80px rgba(22, 170, 111, 0.3);
            --radius-lg: 28px;
            --radius-md: 18px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-deep);
            margin: 0;
            color: var(--text-primary);
            overflow-x: hidden;
            backface-visibility: hidden;
        }

        /* ════ محرك الرندرة ثلاثي الأبعاد الفاخر ════ */
        #nike-reactor-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1; 
            pointer-events: none;
        }

        /* ════ HEADER ════ */
        header.top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: var(--header-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            position: sticky; top: 0; z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        .nav-icons i { font-size: 22px; color: #fff; cursor: pointer; transition: 0.3s; }
        .nav-icons i:hover { color: var(--accent-light); }
        .app-title { font-size: 22px; font-weight: 800; color: #fff; letter-spacing: 0.5px; }
        .app-title span { color: #ffce31; text-shadow: 0 0 15px rgba(255,206,49,0.3); }

        .logout-btn {
            background: rgba(228, 30, 63, 0.15);
            color: #ff4d6d; border: 1px solid rgba(228, 30, 63, 0.2);
            padding: 8px 18px; border-radius: var(--radius-md);
            text-decoration: none; font-weight: 700; font-size: 13px; transition: 0.3s;
        }
        .logout-btn:hover { background: #e41e3f; color: #fff; box-shadow: 0 0 15px rgba(228,30,63,0.4); }

        /* ════ DASHBOARD GRID ════ */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
            gap: 28px;
            padding: 40px 30px 160px;
            max-width: 1300px;
            margin: 0 auto;
            position: relative;
            z-index: 10; 
        }

        /* ════ تقسيم وحداث الترحيب المنفصلة الفاخرة ════ */
        .welcome-container-split {
            grid-column: 1 / -1;
            display: flex;
            gap: 20px;
            width: 100%;
        }

        .welcome-msg-box {
            flex: 2;
            background: linear-gradient(135deg, rgba(7, 58, 37, 0.4) 0%, rgba(11, 94, 61, 0.2) 100%);
            backdrop-filter: blur(25px) saturate(150%);
            -webkit-backdrop-filter: blur(25px) saturate(150%);
            border-radius: var(--radius-lg);
            padding: 25px 35px;
            display: flex;
            align-items: center;
            border: 1px solid rgba(34, 211, 143, 0.2);
            box-shadow: var(--shadow);
        }

        .welcome-msg-box h3 { 
            margin: 0; font-size: 22px; font-weight: 800; color: #ffce31; 
            text-shadow: 0 0 15px rgba(255,206,49,0.3); 
        }

        .welcome-time-box {
            flex: 1;
            background: rgba(18, 30, 24, 0.6);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: var(--radius-lg);
            padding: 20px 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: var(--shadow);
            min-width: 180px;
        }

        .welcome-time-box .time { font-size: 24px; font-weight: 800; color: var(--accent-light); display: block; }
        .welcome-time-box .date { font-size: 11px; opacity: 0.6; font-weight: 600; margin-top: 4px; }

        /* ════ كروت الـ Premium Glassmorphism Futuristic ════ */
        .card-link { text-decoration: none; color: inherit; display: block; }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: var(--radius-lg);
            padding: 35px 20px;
            text-align: center;
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow);
            transition: all 0.5s cubic-bezier(0.1, 1, 0.1, 1);
            transform-style: preserve-3d;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .card:hover {
            transform: translateY(-15px) scale(1.03) rotateX(10deg) rotateY(-5deg);
            box-shadow: var(--shadow-hover);
            background: rgba(22, 170, 111, 0.12);
            border-color: rgba(34, 211, 143, 0.4);
        }

        .icon-box-3d {
            width: 75px; height: 75px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 22px;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 22px;
            font-size: 32px;
            color: var(--accent-light);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            transform: translateZ(40px); 
            transition: all 0.5s cubic-bezier(0.1, 1, 0.1, 1);
        }

        .card:hover .icon-box-3d {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            color: #050907;
            transform: translateZ(65px) scale(1.12) rotate(12deg);
            box-shadow: 0 20px 40px rgba(34, 211, 143, 0.3);
        }

        .card p { margin: 0; font-size: 16px; font-weight: 700; color: #fff; transform: translateZ(25px); transition: 0.3s; }
        .card:hover p { color: var(--accent-light); }

        .archive-card .icon-box-3d { color: #ffb703; }
        .archive-card:hover .icon-box-3d { background: linear-gradient(135deg, #d48c00 0%, #ffb703 100%); box-shadow: 0 20px 40px rgba(255,183,3,0.3); }

        .report2-card .icon-box-3d { color: #a855f7; }
        .report2-card:hover .icon-box-3d { background: linear-gradient(135deg, #7e57c2 0%, #a855f7 100%); box-shadow: 0 20px 40px rgba(168,85,247,0.3); }

        /* ════ FLOATING HUB ════ */
        .floating-hub-container { position: fixed; bottom: 120px; right: 30px; z-index: 2000; display: flex; flex-direction: column; gap: 15px; }
        .floating-options { display: flex; flex-direction: column; gap: 12px; opacity: 0; pointer-events: none; transform: translateY(20px); transition: 0.4s cubic-bezier(0.1, 1, 0.1, 1); }
        .floating-hub-container.active .floating-options { opacity: 1; pointer-events: auto; transform: translateY(0); }
        .floating-btn-sub { text-decoration: none; display: flex; align-items: center; gap: 12px; background: rgba(18, 30, 24, 0.9); backdrop-filter: blur(10px); padding: 12px 22px; border-radius: 30px; border: 1px solid rgba(34,211,143,0.2); box-shadow: var(--shadow); }
        .floating-btn-sub i { width: 34px; height: 34px; background: var(--accent); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .floating-btn-sub span { font-size: 14px; font-weight: 700; color: #fff; }
        .main-hub-trigger { width: 65px; height: 65px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 24px; cursor: pointer; box-shadow: 0 15px 35px rgba(22,170,111,0.4); transition: 0.4s; }
        .floating-hub-container.active .main-hub-trigger { transform: rotate(135deg); background: #e41e3f; box-shadow: 0 15px 35px rgba(228,30,63,0.4); }

        /* ════ BOTTOM BAR ════ */
        .bottom-bar-wrapper { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 600px; z-index: 1000; }
        .bottom-bar { background: rgba(18, 30, 24, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); display: flex; padding: 14px 10px; border-radius: 28px; box-shadow: var(--shadow); border: 1px solid rgba(255,255,255,0.04); }
        .nav-action { flex: 1; text-align: center; color: rgba(255,255,255,0.6); text-decoration: none; font-size: 12px; font-weight: 700; display: flex; flex-direction: column; align-items: center; transition: 0.3s; }
        .nav-action i { font-size: 20px; margin-bottom: 6px; color: #fff; transition: 0.3s; }
        .nav-action:hover { color: var(--accent-light); }
        .nav-action:hover i { transform: translateY(-3px); color: var(--accent-light); }

        @media (max-width: 768px) {
            .welcome-container-split { flex-direction: column; gap: 14px; }
            .welcome-time-box { width: 100%; padding: 15px; }
            .welcome-msg-box { text-align: center; justify-content: center; padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- سينما الـ 3D لخلفية السوائل والزيوت المتفاعلة (Nike Reactor Engine) -->
    <canvas id="nike-reactor-canvas"></canvas>

    <header class="top-nav" id="topNavbar">
        <div class="nav-icons"><i class="fas fa-bars"></i></div>
        <div class="app-title">شركة <span>الزيادى</span></div>
        <div class="nav-icons">
            <a href="index.html" class="logout-btn" onclick="sessionStorage.clear();">
                <i class="fas fa-power-off"></i> خروج
            </a>
        </div>
    </header>

    <!-- الـ كـارت الـعـائـم الـذكـي -->
    <div class="floating-hub-container" id="floatingHub" style="display: none;">
        <div class="floating-options">
            <a href="new-order.html" class="floating-btn-sub">
                <i class="fa-solid fa-plus"></i>
                <span>طلب جديد</span>
            </a>
            <a href="all-orders.html" class="floating-btn-sub">
                <i class="fa-solid fa-boxes-packing"></i>
                <span>كل الطلبات</span>
            </a>
        </div>
        <div class="main-hub-trigger" onclick="toggleFloatingHub(event)">
            <i class="fa-solid fa-layer-group"></i>
        </div>
    </div>

    <!-- الشبكة الرئيسية للتحكم (Dashboard Grid) -->
    <div class="dashboard" id="mainDashboard">
        
        <!-- حاوية كروت الترحيب المنفصلة تماماً -->
        <div class="welcome-container-split" id="employeeWelcomeWidget" style="display: none;">
            <!-- كارت الرسالة الترحيبية -->
            <div class="welcome-msg-box">
                <h3 id="dynamicWelcomeText">جاري مزامنة الوردية...</h3>
            </div>
            <!-- كارت الوقت والتاريخ المنفصل -->
            <div class="welcome-time-box">
                <span class="time" id="liveClock">00:00:00 م</span>
                <span class="date" id="liveDate">...</span>
            </div>
        </div>

        <a href="mabiat-menu.html" class="card-link" id="cardSales">
            <div class="card">
                <div class="icon-box-3d"><i class="fa-solid fa-jar-wheat"></i></div>
                <p>المبيعات</p>
            </div>
        </a>
        <a href="purchase-mgmt.html" class="card-link" id="cardPurchases">
            <div class="card">
                <div class="icon-box-3d"><i class="fa-solid fa-jar"></i></div>
                <p>المشتريات</p>
            </div>
        </a>
        <a href="client_menu.html" class="card-link" id="cardClients">
            <div class="card">
                <div class="icon-box-3d"><i class="fa-solid fa-jar-wheat"></i></div>
                <p>العملاء</p>
            </div>
        </a>
        <a href="supplier-management.html" class="card-link" id="cardSuppliers">
            <div class="card">
                <div class="icon-box-3d"><i class="fa-solid fa-jar"></i></div>
                <p>الموردين</p>
            </div>
        </a>
        <a href="inventory-menu.html" class="card-link" id="cardInventory">
            <div class="card">
                <div class="icon-box-3d"><i class="fa-solid fa-bucket"></i></div>
                <p>المخزن</p>
            </div>
        </a>
        <a href="vouchers-hub.html" class="card-link" id="cardVouchers">
            <div class="card archive-card">
                <div class="icon-box-3d"><i class="fa-solid fa-jar-wheat"></i></div>
                <p>السندات</p>
            </div>
        </a>
        <a href="banknote.html" class="card-link" id="cardBanknote">
            <div class="card">
                <div class="icon-box-3d"><i class="fa-solid fa-jar"></i></div>
                <p>النقديه</p>
            </div>
        </a>
        <a href="reports.html" class="card-link" id="cardreports">
            <div class="card report-card">
                <div class="icon-box-3d"><i class="fa-solid fa-bucket"></i></div>
                <p>التقارير</p>
            </div>
        </a>
        <a href="reports2.html" class="card-link" id="cardreports2">
            <div class="card report2-card">
                <div class="icon-box-3d"><i class="fa-solid fa-jar-wheat"></i></div>
                <p>ملخص المبيعات</p>
            </div>
        </a>
    </div>

    <!-- BOTTOM BAR -->
    <div class="bottom-bar-wrapper">
        <nav class="bottom-bar">
            <a href="sales-invoice.html" class="nav-action"><i class="fas fa-plus-circle"></i><span>بيع سريع</span></a>
            <a href="add-customer.html" class="nav-action"><i class="fas fa-user-plus"></i><span>إضافة عميل</span></a>
            <a href="price-search.html" class="nav-action"><i class="fas fa-magnifying-glass-dollar"></i><span>استعلام سعر</span></a>
            <a href="expenses.html" class="nav-action"><i class="fas fa-money-bill-transfer"></i><span>قيد مصروف</span></a>
        </nav>
    </div>

    <script>
        /* ══════════ قفل وحماية كود الصلاحيات بنسبة 100% ══════════ */
        function toggleFloatingHub(event) {
            event.stopPropagation();
            const hub = document.getElementById('floatingHub');
            hub.classList.toggle('active');
        }

        document.addEventListener('click', function() {
            const hub = document.getElementById('floatingHub');
            if (hub && hub.classList.contains('active')) {
                hub.classList.remove('active');
            }
        });

        // مصفوفة الألقاب ومواعيد الرسائل (سريعة، حماسية، وبدون أي أدعية)
        function updateWelcomeMessage() {
            const textEl = document.getElementById('dynamicWelcomeText');
            if (!textEl) return;

            const titles = ["يا حاج", "يا رياسة", "يا هندسة", "يا بطل"];
            // اختيار لقب عشوائي في كل مرة لتجديد المود
            const randomTitle = titles[Math.floor(Math.random() * titles.length)];
            
            const hour = new Date().getHours();
            let timePhrase = "منور الشغل في أي وقت";

            if (hour >= 5 && hour < 12) {
                timePhrase = "صباح الفل والنشاط";
            } else if (hour >= 12 && hour < 17) {
                timePhrase = "مساء الفل ومتابعين معاك";
            } else if (hour >= 17 && hour < 22) {
                timePhrase = "مساء الورد والجدعنة";
            } else {
                timePhrase = "ليلتك جميلة وسهرة موفقة";
            }

            textEl.innerText = `${timePhrase} ${randomTitle} ✨`;
        }

        function startLiveClock() {
            const timeEl = document.getElementById('liveClock');
            const dateEl = document.getElementById('liveDate');
            updateWelcomeMessage();
            
            setInterval(() => {
                const now = new Date();
                if(timeEl) timeEl.innerText = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                if(dateEl) dateEl.innerText = now.toLocaleDateString('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                
                // تحديث اللقب عشوائياً كل ساعة بالظبط
                if (now.getMinutes() === 0 && now.getSeconds() === 0) {
                    updateWelcomeMessage();
                }
            }, 1000);
        }

        // تفعيل وإحكام الصلاحيات تماماً عند تحميل الصفحة لمنع أي تداخل
        window.addEventListener('DOMContentLoaded', () => {
            const role = sessionStorage.getItem('role') || 'employee';
            const savedPermissions = sessionStorage.getItem('permissions');
            const userPermissions = savedPermissions ? JSON.parse(savedPermissions) : ['sales','clients','vouchers','reports2'];

            const permMap = {
                cardSales: 'sales', cardPurchases: 'purchases', cardClients: 'clients',
                cardSuppliers: 'suppliers', cardInventory: 'inventory_admin',
                cardVouchers: 'vouchers', cardBanknote: 'banknote',
                cardreports: 'reports', cardreports2: 'reports2'
            };

            const welcomeWidget = document.getElementById('employeeWelcomeWidget');
            const floatingHub = document.getElementById('floatingHub');

            if (role === 'admin') {
                if (welcomeWidget) welcomeWidget.style.display = 'none';
                if (floatingHub) floatingHub.style.display = 'none'; 
                Object.keys(permMap).forEach(id => {
                    const el = document.getElementById(id);
                    if (!el) return;
                    if (id === 'cardreports2') el.style.display = 'none'; 
                    else el.style.display = '';
                });
            } else {
                if (welcomeWidget) {
                    welcomeWidget.style.display = 'flex';
                    startLiveClock();
                }
                if (floatingHub) floatingHub.style.display = 'flex'; 
                Object.keys(permMap).forEach(id => {
                    const el = document.getElementById(id);
                    if (!el) return;
                    if (userPermissions.includes(permMap[id])) el.style.display = ''; 
                    else el.style.display = 'none';
                });
            }
        });


        /* ══════════ محرك الـ 3D المتقدم والمحاكي لـ Nike Reactor Engine ══════════ */
        const canvas = document.getElementById('nike-reactor-canvas');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const ambientLight = new THREE.AmbientLight(0x0a1510, 1.5);
        scene.add(ambientLight);

        const topLight = new THREE.DirectionalLight(0x22d38f, 2.5); 
        topLight.position.set(5, 15, 5);
        scene.add(topLight);

        const goldLiquidLight = new THREE.PointLight(0xffb703, 3, 20); 
        goldLiquidLight.position.set(-3, -2, 2);
        scene.add(goldLiquidLight);

        const premiumObjects = [];
        
        const oilReactorMaterial = new THREE.MeshPhysicalMaterial({
            color: 0x16aa6f,
            emissive: 0x051a10,
            roughness: 0.1,
            metalness: 0.1,
            clearcoat: 1.0,
            clearcoatRoughness: 0.05,
            transmission: 0.6, 
            thickness: 1.5,
            side: THREE.DoubleSide
        });

        const jugGeo = new THREE.CylinderGeometry(0.7, 0.9, 2.2, 5);
        for(let i=0; i<5; i++) {
            const jugMesh = new THREE.Mesh(jugGeo, oilReactorMaterial);
            jugMesh.position.set((Math.random() - 0.5) * 12, (Math.random() - 0.5) * 10, -Math.random() * 5 - 2);
            jugMesh.rotation.set(Math.random() * 2, Math.random() * 2, 0);
            
            jugMesh.userData = {
                rotSpeedX: (Math.random() - 0.5) * 0.004,
                rotSpeedY: (Math.random() - 0.5) * 0.006,
                floatOffset: Math.random() * 100
            };
            scene.add(jugMesh);
            premiumObjects.push(jugMesh);
        }

        const dropGeo = new THREE.IcosahedronGeometry(0.25, 2);
        const dropMat = new THREE.MeshStandardMaterial({ color: 0xffb703, roughness: 0.1, metalness: 0.8 });
        
        for(let j=0; j<20; j++) {
            const dropMesh = new THREE.Mesh(dropGeo, dropMat);
            dropMesh.position.set((Math.random() - 0.5) * 16, (Math.random() - 0.5) * 14, -Math.random() * 6);
            dropMesh.userData = {
                rotSpeedX: 0.01,
                rotSpeedY: 0.02,
                floatOffset: Math.random() * 500,
                speedY: 0.005 + Math.random() * 0.01
            };
            scene.add(dropMesh);
            premiumObjects.push(dropMesh);
        }

        camera.position.z = 6;

        let targetX = 0, targetY = 0;
        let scrollY = 0;

        document.addEventListener('mousemove', (event) => {
            targetX = (event.clientX - window.innerWidth / 2) * 0.0008;
            targetY = (event.clientY - window.innerHeight / 2) * 0.0008;
        });

        window.addEventListener('scroll', () => {
            scrollY = window.scrollY * 0.0015;
        });

        function renderNikeEngine() {
            requestAnimationFrame(renderNikeEngine);

            const time = Date.now() * 0.001;

            premiumObjects.forEach(obj => {
                obj.rotation.x += obj.userData.rotSpeedX;
                obj.rotation.y += obj.userData.rotSpeedY;
                
                if(obj.geometry.type === 'IcosahedronGeometry') {
                    obj.position.y -= obj.userData.speedY;
                    if(obj.position.y < -7) obj.position.y = 7;
                    obj.position.x += Math.sin(time + obj.userData.floatOffset) * 0.003;
                } else {
                    obj.position.y += Math.sin(time + obj.userData.floatOffset) * 0.002;
                    obj.rotation.z = scrollY * 1.5;
                }
            });

            camera.position.x += (targetX - camera.position.x) * 0.05;
            camera.position.y += (-targetY - camera.position.y) * 0.05;
            camera.position.z = 6 + Math.sin(scrollY * 0.5) * 0.8; 
            
            camera.lookAt(scene.position);
            renderer.render(scene, camera);
        }
        renderNikeEngine();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
