<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شركة الزيادي | anas POS Pro</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <link class="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b5e3d">

    <style>
        :root {
            --bg-deep: #f4f8f6;
            --bg-card: #ffffff;
            --glass: rgba(11, 94, 61, 0.06);
            --accent: #0b5e3d;
            --accent-light: #16aa6f;
            --header-bg: #0b5e3d;
            --text-primary: #0f241b;
            --text-secondary: #52665d;
            --border: #e2ede8;
            --shadow: 0 10px 30px rgba(11, 94, 61, 0.05);
            --shadow-hover: 0 20px 45px rgba(11, 94, 61, 0.15);
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 12px;
        }

        body.dark-mode {
            --bg-deep: #060a08;
            --bg-card: #101613;
            --glass: rgba(22, 170, 111, 0.08);
            --accent: #16aa6f;
            --accent-light: #22d38f;
            --header-bg: #090e0b;
            --text-primary: #f0f7f4;
            --text-secondary: #83998f;
            --border: #1a2420;
            --shadow: 0 12px 35px rgba(0,0,0,0.4);
            --shadow-hover: 0 22px 50px rgba(0,0,0,0.6);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-deep);
            margin: 0;
            color: var(--text-primary);
            line-height: 1.6;
            transition: background 0.3s, color 0.3s;
        }

        /* ════ HEADER ════ */
        header.top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: var(--header-bg);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .nav-icons { display: flex; gap: 18px; align-items: center; }
        .nav-icons i { font-size: 22px; color: rgba(255,255,255,0.9); cursor: pointer; transition: 0.2s; }

        .app-title { font-size: 20px; font-weight: 800; color: #fff; letter-spacing: 0.5px; }
        .app-title span { color: #ffce31; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }

        .logout-btn {
            background: rgba(255,255,255,0.12);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: var(--radius-md);
            font-size: 13px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
        }

        /* ════ DASHBOARD GRID ════ */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
            gap: 20px;
            padding: 24px 24px 170px; 
            max-width: 1250px;
            margin: 0 auto;
        }

        /* ════ كروت الساعة والترحيب الفاتحة ════ */
        .welcome-widget, .time-widget {
            background: linear-gradient(135deg, #0b5e3d 0%, #13915f 50%, #19c381 100%);
            background-size: 200% 200%;
            animation: gradientMove 8s ease infinite;
            border-radius: var(--radius-md);
            color: #fff;
            box-shadow: 0 8px 24px rgba(19, 145, 95, 0.2);
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .welcome-widget { grid-column: span 2; justify-content: flex-start; padding: 14px 20px; }
        .time-widget { grid-column: span 2; justify-content: center; text-align: center; padding: 10px 14px; }

        .welcome-text h3 { margin: 0; font-size: 15px; font-weight: 700; color: #ffce31; text-shadow: 0 1px 3px rgba(0,0,0,0.3); }
        .welcome-time-box { 
            background: rgba(0, 0, 0, 0.15); padding: 6px 16px; border-radius: var(--radius-sm); 
            backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.1); width: 100%;
        }
        .welcome-time-box .time { font-size: 16px; font-weight: 800; display: block; color: #ffffff; }
        .welcome-time-box .date { font-size: 11px; font-weight: 600; color: #e2ede8; display: block; margin-top: 2px; }

        @keyframes gradientMove {
            0% { background-position: 0% 51%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 51%; }
        }

        @media (max-width: 768px) {
            .welcome-widget, .time-widget { grid-column: 1 / -1; }
        }

        /* ════ CARDS DESIGN ════ */
        .card-link { text-decoration: none; color: inherit; display: block; }
        .card {
            background: var(--bg-card); border-radius: var(--radius-lg); padding: 30px 16px 26px;
            text-align: center; border: 1px solid var(--border); transition: all 0.35s ease;
            box-shadow: var(--shadow); position: relative; overflow: hidden; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .card::after {
            content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, var(--accent), var(--accent-light)); transform: scaleX(0); transition: transform 0.3s ease;
        }
        .card:hover { transform: translateY(-6px); box-shadow: var(--shadow-hover); }
        .card:hover::after { transform: scaleX(1); }

        .icon-box {
            width: 64px; height: 64px; background: var(--glass); border-radius: var(--radius-md);
            display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; font-size: 26px; color: var(--accent);
        }
        .card:hover .icon-box { background: linear-gradient(135deg, var(--accent), var(--accent-light)); color: #fff; }
        .card p { margin: 0; font-size: 15px; font-weight: 700; color: var(--text-primary); }

        .archive-card .icon-box { color: #d48c00; background: rgba(212,140,0,0.07); }
        .archive-card:hover .icon-box { background: linear-gradient(135deg, #d48c00, #ffb703); }
        .archive-card::after { background: linear-gradient(90deg, #d48c00, #ffb703); }

        .report2-card .icon-box { color: #5e35b1; background: rgba(94,53,177,0.07); }
        .report2-card:hover .icon-box { background: linear-gradient(135deg, #5e35b1, #7e57c2); }
        .report2-card::after { background: linear-gradient(90deg, #5e35b1, #7e57c2); }

        /* ════ الـ كـروت الـعـائـمـة الـذكـيـة (مـنـع الـتـداخل نـهـائـيـاً) ════ */
        .floating-hub-container {
            position: fixed;
            left: 16px; /* تثبيت دائم في الجانب الأيسر لسهولة الاستخدام باليد اليمنى واليسرى وعزلها عن التداخل */
            z-index: 2500;
            display: flex;
            align-items: center; /* ترتيب أفقي ذكي مع الأزرار الفرعية */
            gap: 16px;
        }

        /* الكارت الأخضر (الطلبات): يرتفع بالأعلى */
        .floating-hub-container.right-hub { 
            bottom: 185px; 
        }

        /* الكارت الأصفر (المخزن): ينزل بالأسفل فوق التولبار مباشرة ولا يلمسه */
        .floating-hub-container.left-hub { 
            bottom: 120px; 
        }

        /* جعل القوائم تفتح أفقياً لليمين بدلاً من التداخل الرأسي */
        .floating-options {
            display: flex;
            flex-direction: row; /* فتح الأزرار بجانب بعضها بشكل شريطي رائع */
            gap: 8px;
            opacity: 0;
            pointer-events: none;
            transform: translateX(-20px);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .floating-hub-container.active .floating-options {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(0);
        }

        .floating-btn-sub {
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            padding: 8px 14px;
            border-radius: 30px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(11, 94, 61, 0.15);
            white-space: nowrap;
        }

        .floating-btn-sub i {
            width: 28px; height: 28px;
            background: var(--accent);
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
        }

        .floating-btn-sub span { font-size: 12.5px; font-weight: 700; color: var(--text-primary); }
        
        .left-hub .floating-btn-sub i { background: #d48c00; }
        .left-hub .floating-btn-sub { border-color: rgba(212,140,0,0.2); }

        .main-hub-trigger {
            width: 52px; height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 19px;
            cursor: pointer;
            border: 2px solid rgba(255,255,255,0.2);
            transition: all 0.3s ease;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
            order: -1; /* جعل الزر الرئيسي هو الأول دائماً من جهة اليسار */
        }

        .right-hub .main-hub-trigger { background: var(--accent); }
        .left-hub .main-hub-trigger { background: #d48c00; }

        .floating-hub-container.active .main-hub-trigger { transform: rotate(135deg); background: #111713; }

        /* ════ BOTTOM BAR ════ */
        .bottom-bar-wrapper {
            position: fixed;
            bottom: 18px; left: 50%;
            transform: translateX(-50%);
            width: 94%; max-width: 580px;
            z-index: 2000;
        }
        .bottom-bar {
            background: #0b5e3d; display: flex; padding: 12px 8px; border-radius: 24px;
            box-shadow: 0 10px 30px rgba(11,94,61,0.3); border: 1px solid rgba(255,255,255,0.1);
        }
        .nav-action {
            flex: 1; text-align: center; color: rgba(255,255,255,0.75); text-decoration: none; font-size: 12px; font-weight: 700;
            display: flex; flex-direction: column; align-items: center;
        }
        .nav-action i { font-size: 19px; margin-bottom: 5px; color: #fff; }
        .nav-action:hover { color: #ffce31; }
    </style>
</head>
<body>

    <header class="top-nav" id="topNavbar">
        <div class="nav-icons"><i class="fas fa-bars"></i></div>
        <div class="app-title">شركة <span>الزيادى</span></div>
        <div class="nav-icons">
            <a href="index.html" class="logout-btn" onclick="sessionStorage.clear();">
                <i class="fas fa-power-off"></i> خروج
            </a>
        </div>
    </header>

    <!-- الكارت الأخضر (الطلبات) - مرتفع بأمان لمنع التداخل تماماً -->
    <div class="floating-hub-container right-hub" id="floatingHubRight">
        <div class="main-hub-trigger" onclick="toggleFloatingHub(event, 'floatingHubRight')">
            <i class="fa-solid fa-layer-group"></i>
        </div>
        <div class="floating-options">
            <a href="customer-orders.html" class="floating-btn-sub">
                <i class="fa-solid fa-plus"></i>
                <span>طلب جديد</span>
            </a>
            <a href="all-orders.html" class="floating-btn-sub">
                <i class="fa-solid fa-boxes-packing"></i>
                <span>كل الطلبات</span>
            </a>
        </div>
    </div>

    <!-- الكارت الأصفر (المخزن) - متموضع بالأسفل فوق التولبار بدون أي تداخل -->
    <div class="floating-hub-container left-hub" id="floatingHubLeft">
        <div class="main-hub-trigger" onclick="toggleFloatingHub(event, 'floatingHubLeft')">
            <i class="fa-solid fa-boxes-stacked"></i>
        </div>
        <div class="floating-options">
            <a href="inventory.html" class="floating-btn-sub">
                <i class="fa-solid fa-warehouse"></i>
                <span>الاصناف </span>
            </a>
        </div>
    </div>

    <!-- الشبكة الرئيسية للتحكم -->
    <div class="dashboard" id="mainDashboard">
        
        <div class="welcome-widget" id="employeeWelcomeWidget" style="display: none;">
            <div class="welcome-text">
                <h3 id="dynamicWelcomeText">مساء الفل يارياسه 👋</h3>
            </div>
        </div>

        <div class="time-widget" id="employeeTimeWidget" style="display: none;">
            <div class="welcome-time-box">
                <span class="time" id="liveClock">00:00:00 م</span>
                <span class="date" id="liveDate">الإثنين، 22 يونيو 2026</span>
            </div>
        </div>

        <a href="mabiat-menu.html" class="card-link" id="cardSales">
            <div class="card">
                <div class="icon-box"><i class="fa-solid fa-wallet"></i></div>
                <p>المبيعات</p>
            </div>
        </a>
        <a href="purchase-mgmt.html" class="card-link" id="cardPurchases">
            <div class="card">
                <div class="icon-box"><i class="fa-solid fa-square-minus"></i></div>
                <p>المشتريات</p>
            </div>
        </a>
        <a href="client_menu.html" class="card-link" id="cardClients">
            <div class="card">
                <div class="icon-box"><i class="fa-solid fa-id-card-clip"></i></div>
                <p>العملاء</p>
            </div>
        </a>
        <a href="supplier-management.html" class="card-link" id="cardSuppliers">
            <div class="card">
                <div class="icon-box"><i class="fa-solid fa-truck-ramp-box"></i></div>
                <p>الموردين</p>
            </div>
        </a>
        <a href="inventory-menu.html" class="card-link" id="cardInventory">
            <div class="card">
                <div class="icon-box"><i class="fa-solid fa-warehouse"></i></div>
                <p>المخزن</p>
            </div>
        </a>
        <a href="vouchers-hub.html" class="card-link" id="cardVouchers">
            <div class="card archive-card">
                <div class="icon-box"><i class="fa-solid fa-money-check-dollar"></i></div>
                <p>السندات</p>
            </div>
        </a>
        <a href="banknote.html" class="card-link" id="cardBanknote">
            <div class="card">
                <div class="icon-box"><i class="fa-solid fa-file-invoice-dollar"></i></div>
                <p>النقديه</p>
            </div>
        </a>
        <a href="reports.html" class="card-link" id="cardreports">
            <div class="card report-card">
                <div class="icon-box"><i class="fa-solid fa-chart-line"></i></div>
                <p>التقارير</p>
            </div>
        </a>
        <a href="reports2.html" class="card-link" id="cardreports2">
            <div class="card report2-card">
                <div class="icon-box"><i class="fa-solid fa-chart-pie"></i></div>
                <p>ملخص المبيعات</p>
            </div>
        </a>
    </div>

    <!-- BOTTOM BAR -->
    <div class="bottom-bar-wrapper">
        <nav class="bottom-bar">
            <a href="sales-invoice.html" class="nav-action"><i class="fas fa-plus-circle"></i><span>بيع سريع</span></a>
            <a href="add-customer.html" class="nav-action"><i class="fas fa-user-plus"></i><span>إضافة عميل</span></a>
            <a href="price-search.html" class="nav-action"><i class="fas fa-magnifying-glass-dollar"></i><span>استعلام سعر</span></a>
            <a href="expenses.html" class="nav-action"><i class="fas fa-money-bill-transfer"></i><span>قيد مصروف</span></a>
        </nav>
    </div>

    <script>
        function toggleFloatingHub(event, hubId) {
            event.stopPropagation();
            const rightHub = document.getElementById('floatingHubRight');
            const leftHub = document.getElementById('floatingHubLeft');
            
            if (hubId === 'floatingHubRight') {
                rightHub.classList.toggle('active');
                leftHub.classList.remove('active');
            } else {
                leftHub.classList.toggle('active');
                rightHub.classList.remove('active');
            }
        }

        document.addEventListener('click', function() {
            const rightHub = document.getElementById('floatingHubRight');
            const leftHub = document.getElementById('floatingHubLeft');
            if (rightHub) rightHub.classList.remove('active');
            if (leftHub) leftHub.classList.remove('active');
        });

        function updateWelcomeMessage() {
            const textEl = document.getElementById('dynamicWelcomeText');
            if (!textEl) return;
            const hour = new Date().getHours();
            let msg = "مساء الفل يارياسه 👋";
            if (hour >= 5 && hour < 12) msg = "صباح الفل يا رياسه ☀️";
            textEl.innerText = msg;
        }

        function startLiveClock() {
            const timeEl = document.getElementById('liveClock');
            const dateEl = document.getElementById('liveDate');
            updateWelcomeMessage();

            setInterval(() => {
                const now = new Date();
                if(timeEl) {
                    timeEl.innerText = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                }
                if(dateEl) {
                    dateEl.innerText = now.toLocaleDateString('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                }
            }, 1000);
        }

        window.onload = () => {
            const role = sessionStorage.getItem('role') || 'employee';
            const savedPermissions = sessionStorage.getItem('permissions');
            const userPermissions = savedPermissions ? JSON.parse(savedPermissions) : ['sales','clients','vouchers','reports2'];

            const permMap = {
                cardSales: 'sales', cardPurchases: 'purchases', cardClients: 'clients',
                cardSuppliers: 'suppliers', cardInventory: 'inventory_admin',
                cardVouchers: 'vouchers', cardBanknote: 'banknote',
                cardreports: 'reports', cardreports2: 'reports2'
            };

            const welcomeWidget = document.getElementById('employeeWelcomeWidget');
            const timeWidget = document.getElementById('employeeTimeWidget');

            if (role === 'admin') {
                if (welcomeWidget) welcomeWidget.style.display = 'none';
                if (timeWidget) timeWidget.style.display = 'none';
                
                Object.keys(permMap).forEach(id => {
                    const el = document.getElementById(id);
                    if (!el) return;
                    if (id === 'cardreports2') { el.style.display = 'none'; } 
                    else { el.style.display = ''; }
                });
            } else {
                if (welcomeWidget) welcomeWidget.style.display = 'flex';
                if (timeWidget) {
                    timeWidget.style.display = 'flex';
                    startLiveClock();
                }

                Object.keys(permMap).forEach(id => {
                    const el = document.getElementById(id);
                    if (!el) return;
                    if (userPermissions.includes(permMap[id])) { el.style.display = ''; } 
                    else { el.style.display = 'none'; }
                });
            }
        };
    </script>
</body>
</html>
