<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة الزيادي | anas POS Pro</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-deep: #f4f7f6;
            --bg-card: #ffffff;
            --glass: rgba(11, 94, 61, 0.06);
            --accent: #0b5e3d;         
            --accent-light: #128256;
            --header-bg: #0b5e3d;      
            --text-primary: #1b2e26;
            --text-secondary: #61736b;
            --danger: #e41e3f;
            --success: #2dbe57;
            --gold: #dfa100;
            --border: #e2e9e5;
            --shadow: 0 8px 24px rgba(11, 94, 61, 0.04);
            --radius-lg: 20px;
            --radius-md: 14px;
        }

        body.dark-mode {
            --bg-deep: #090d0b;
            --bg-card: #121815;
            --glass: rgba(29, 138, 90, 0.1);
            --accent: #1d8a5a;
            --accent-light: #28b377;
            --header-bg: #0b110e;
            --text-primary: #f0f6f3;
            --text-secondary: #87948e;
            --border: #1f2924;
            --shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-deep);
            margin: 0;
            color: var(--text-primary);
            line-height: 1.6;
            transition: background 0.3s ease, color 0.3s ease;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

        header.top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 24px;
            background: var(--header-bg);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            backdrop-filter: blur(10px);
        }

        .nav-icons { display: flex; gap: 18px; align-items: center; }
        .nav-icons i { 
            font-size: 20px; 
            color: #ffffff; 
            cursor: pointer; 
            transition: transform 0.2s, opacity 0.2s; 
            opacity: 0.9;
        }
        .nav-icons i:hover { transform: scale(1.1); opacity: 1; }

        .app-title { font-size: 20px; font-weight: 800; color: #ffffff; letter-spacing: 0.5px; }
        .app-title span { color: #ffce31; text-shadow: 0 2px 4px rgba(0,0,0,0.15); } 

        .logout-btn {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: var(--radius-md);
            font-size: 13px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            transition: 0.2s;
        }
        .logout-btn:hover { background: rgba(228, 30, 63, 0.2); border-color: var(--danger); }

        .welcome-banner {
            padding: 35px 20px 10px;
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
        }
        .welcome-banner h1 { font-size: 26px; font-weight: 800; margin: 0; color: var(--text-primary); }
        .welcome-banner p { font-size: 14px; color: var(--text-secondary); margin: 6px 0 0; font-weight: 600; }

        /* حاوية الأزرار الرئيسية */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            padding: 20px;
            margin-bottom: 120px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
            transition: all 0.3s ease;
        }

        @media (min-width: 768px) {
            .dashboard { grid-template-columns: repeat(4, 1fr); padding: 25px 20px; }
        }

        /* تنسيق خاص وذكي جداً عندما يتبقى 3 كروت أو أقل للموظف */
        .dashboard.restricted-layout {
            display: flex !important;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 20px;
            max-width: 900px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        @media (max-width: 576px) {
            .dashboard.restricted-layout {
                flex-direction: column;
                padding: 15px;
            }
            .dashboard.restricted-layout .card-link {
                width: 100% !important;
            }
        }

        .card-link { text-decoration: none; color: inherit; display: block; transition: width 0.3s ease; }
        .dashboard.restricted-layout .card-link { width: 30%; min-width: 160px; }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 26px 15px;
            text-align: center;
            border: 1px solid var(--border);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        /* زيادة حجم وأناقة الكروت في وضع الكروت المحدودة */
        .dashboard.restricted-layout .card {
            padding: 40px 15px;
            border-width: 1.5px;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: transparent;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: transparent;
            box-shadow: 0 12px 30px rgba(11, 94, 61, 0.08);
        }
        body.dark-mode .card:hover { box-shadow: 0 12px 30px rgba(0,0,0,0.5); border-color: var(--accent); }

        .card:hover::before { background: var(--accent); }
        .card:active { transform: scale(0.96); }

        .icon-box {
            width: 56px;
            height: 56px;
            background: var(--glass);
            border-radius: var(--radius-md); 
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            color: var(--accent);
            font-size: 24px;
            transition: 0.3s;
        }
        
        /* تكبير الأيقونات والنصوص في وضع العميل المحدود لتعبئة الشاشة بذكاء */
        .dashboard.restricted-layout .icon-box {
            width: 70px;
            height: 70px;
            font-size: 30px;
            border-radius: var(--radius-lg);
            margin-bottom: 20px;
        }

        .card:hover .icon-box { background: var(--accent); color: #fff; transform: rotate(-5deg); }

        .archive-card::before { background: var(--gold) !important; }
        .archive-card .icon-box { color: var(--gold); background: rgba(223, 161, 0, 0.08); }
        .archive-card:hover .icon-box { background: var(--gold); color: #fff; }

        .report-card::before { background: #007bff !important; }
        .report-card .icon-box { color: #007bff; background: rgba(0, 123, 255, 0.08); }
        .report-card:hover .icon-box { background: #007bff; color: #fff; }

        .card p { margin: 0; font-size: 15px; font-weight: 700; color: var(--text-primary); transition: 0.2s; }
        .dashboard.restricted-layout .card p { font-size: 17px; font-weight: 800; }

        /* القائمة الجانبية */
        .sidebar {
            position: fixed;
            top: 0; right: -100%;
            width: 85%; max-width: 310px; height: 100%;
            background: var(--bg-card);
            z-index: 2000;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: -10px 0 40px rgba(0,0,0,0.15);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }
        .sidebar.active { right: 0; }

        .sidebar-user {
            padding: 40px 24px;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            color: white;
            text-align: center;
            border-bottom-left-radius: 25px;
        }
        .sidebar-user h5 { margin: 10px 0 2px; font-size: 18px; color: white; font-weight: 800; }
        .sidebar-user span { font-size: 12px; color: rgba(255,255,255,0.85); font-weight: 600; background: rgba(0,0,0,0.15); padding: 3px 10px; border-radius: 20px; display: inline-block; margin-top: 5px; }

        .menu-list { padding: 20px; flex-grow: 1; overflow-y: auto; }
        .menu-label { font-size: 12px; color: var(--accent); font-weight: 800; text-transform: uppercase; margin: 20px 10px 10px; display: block; letter-spacing: 0.5px; }

        .menu-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            color: var(--text-primary);
            text-decoration: none;
            margin-bottom: 6px;
            transition: 0.2s;
            font-size: 14px;
            font-weight: 700;
        }
        .menu-item i { width: 32px; font-size: 18px; color: var(--text-secondary); transition: 0.2s; }
        .menu-item:hover { background: var(--glass); color: var(--accent); }
        .menu-item:hover i { color: var(--accent); }

        /* شريط سفلي متناسق */
        .bottom-bar-wrapper {
            position: fixed;
            bottom: 20px; left: 50%;
            transform: translateX(-50%);
            width: 90%; max-width: 500px;
            z-index: 1000;
        }
        .bottom-bar {
            background: var(--header-bg);
            display: flex;
            padding: 12px 10px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(11, 94, 61, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
        }

        .nav-action {
            flex: 1;
            text-align: center;
            color: rgba(255, 255, 255, 0.75);
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: 0.2s;
        }
        .nav-action i { font-size: 20px; margin-bottom: 5px; color: #ffffff; transition: 0.2s; }
        .nav-action:hover { color: #ffce31; transform: translateY(-2px); }

        .fab-btn {
            position: fixed;
            bottom: 110px; right: 24px;
            width: 56px; height: 56px;
            border: none; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            color: #fff; font-size: 22px;
            box-shadow: 0 8px 25px rgba(11, 94, 61, 0.3);
            cursor: pointer;
            z-index: 999;
            display: flex; align-items: center; justify-content: center;
        }

        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: none; z-index: 1500;
            backdrop-filter: blur(4px);
        }
        .overlay.active { display: block; }
    </style>
</head>
<body>

    <div class="overlay" id="overlay"></div>

    <header class="top-nav">
        <div class="nav-icons">
            <i class="fas fa-bars" onclick="toggleMenu()"></i>
            <i class="fas fa-circle-half-stroke" onclick="toggleTheme()" style="margin-right: 12px;"></i>
        </div>
        <div class="app-title">شركة <span>الزيادى</span></div>
        <div class="nav-icons">
            <a href="index.html" class="logout-btn" onclick="sessionStorage.clear();">
                <i class="fas fa-power-off"></i>
                خروج
            </a>
        </div>
    </header>

    <!-- حاوية عرض الكروت الديناميكية -->
    <div class="dashboard" id="mainDashboard">
        <a href="mabiat-menu.html" class="card-link" id="cardSales">
            <div class="card">
                <div class="icon-box"><i class="fas fa-cash-register"></i></div>
                <p>المبيعات</p>
            </div>
        </a>
        <a href="purchase-mgmt.html" class="card-link" id="cardPurchases">
            <div class="card">
                <div class="icon-box"><i class="fas fa-cart-arrow-down"></i></div>
                <p>المشتريات</p>
            </div>
        </a>
        <a href="client_menu.html" class="card-link" id="cardClients">
            <div class="card">
                <div class="icon-box"><i class="fas fa-user-group"></i></div>
                <p>العملاء</p>
            </div>
        </a>
        <a href="supplier-management.html" class="card-link" id="cardSuppliers">
            <div class="card">
                <div class="icon-box"><i class="fas fa-truck-loading"></i></div>
                <p>الموردين</p>
            </div>
        </a>
        <a href="inventory-menu.html" class="card-link" id="cardInventory">
            <div class="card">
                <div class="icon-box"><i class="fas fa-boxes-stacked"></i></div>
                <p>المخزن</p>
            </div>
        </a>
        <a href="vouchers-hub.html" class="card-link" id="cardVouchers">
            <div class="card archive-card">
                <div class="icon-box"><i class="fas fa-file-invoice-dollar"></i></div>
                <p>السندات</p>
            </div>
        </a>
        <a href="banknote.html" class="card-link" id="cardBanknote">
            <div class="card">
                <div class="icon-box"><i class="fas fa-receipt"></i></div>
                <p>النقديه</p>
            </div>
        </a>
        <a href="reports.html" class="card-link" id="cardReports">
            <div class="card report-card">
                <div class="icon-box"><i class="fas fa-chart-line"></i></div>
                <p>التقارير</p>
            </div>
        </a>
    </div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-user">
            <i class="fas fa-user-circle" style="font-size: 50px; margin-bottom: 5px;"></i>
            <h5> شركة الزيادى </h5>
            <span id="userRoleBadge">مدير النظام</span>
        </div>
        
        <div class="menu-list" id="sidebarMenu">
            <span class="menu-label">العمليات اليومية</span>
            <a href="#" class="menu-item active"><i class="fas fa-house"></i> الرئيسية</a>
            <a href="banknote.html" class="menu-item" id="sideTransactions"><i class="fas fa-exchange-alt"></i> حركة المعاملات</a>
            <a href="purchase-orders-list.html" class="menu-item" id="sidePurchaseOrders"><i class="fas fa-file-invoice"></i> طلبات الشراء</a>

            <span class="menu-label" id="labelBasicData">البيانات الأساسية</span>
            <a href="inventory-list.html" class="menu-item" id="sideInventoryMgmt"><i class="fas fa-box-open"></i> إدارة الأصناف</a>
            <a href="supplier-list.html" class="menu-item" id="sideSupplierList"><i class="fas fa-truck"></i> سجل الموردين</a>
            <a href="customer-list.html" class="menu-item" id="sideCustomerList"><i class="fas fa-users-gear"></i> سجل العملاء</a>

            <span class="menu-label" id="labelSystem">النظام</span>
            <a href="settings.html" class="menu-item" id="sideSettings"><i class="fas fa-gears"></i> إعدادات البرنامج</a>
            <a href="#" class="menu-item" id="sideSecurity"><i class="fas fa-shield-halved"></i> الأمان والنسخ</a>
        </div>
    </aside>

    <div class="bottom-bar-wrapper">
        <nav class="bottom-bar">
            <a href="sales-invoice.html" class="nav-action">
                <i class="fas fa-plus-circle"></i>
                <span>بيع سريع</span>
            </a>
            <a href="add-customer.html" class="nav-action">
                <i class="fas fa-user-plus"></i>
                <span>إضافة عميل</span>
            </a>
            <a href="expenses.html" class="nav-action" id="bottomExpenses">
                <i class="fas fa-money-bill-transfer"></i>
                <span>قيد مصروف</span>
            </a>
        </nav>
    </div>

    <button class="fab-btn" id="fabOrders" onclick="window.location.href='orders-home.html'" title="الطلبيات">
        <i class="fas fa-box"></i>
    </button>

    <script>
        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }
        document.getElementById('overlay').onclick = toggleMenu;

        function toggleTheme() {
            const body = document.body;
            body.classList.toggle('dark-mode');
            localStorage.setItem('sanad-theme', body.classList.contains('dark-mode') ? 'dark' : 'light');
        }

        window.onload = () => {
            if (localStorage.getItem('sanad-theme') === 'dark') {
                document.body.classList.add('dark-mode');
            }

            const role = sessionStorage.getItem('role') || 'employee'; 
            const username = sessionStorage.getItem('username') || '';
            
            // تم تعديل الصلاحيات الافتراضية هنا بإزالة 'vouchers' لحظر كارت السندات تلقائياً عن الموظف العادي
            const savedPermissions = sessionStorage.getItem('permissions');
            const userPermissions = savedPermissions ? JSON.parse(savedPermissions) : ['sales', 'clients']; 

            const welcomeEl = document.getElementById('welcomeUser');
            if (welcomeEl && username) {
                welcomeEl.innerText = `مرحباً بك، ${username}`;
            }

            const roleBadge = document.getElementById('userRoleBadge');
            if (roleBadge) {
                if (role === 'admin') roleBadge.innerText = 'مدير النظام';
                else if (role === 'restricted') roleBadge.innerText = 'موظف مبيعات';
                else roleBadge.innerText = 'موظف';
            }

            // خريطة الصلاحيات
            const UI_Permissions_Map = {
                'cardSales': 'sales',
                'cardPurchases': 'purchases',
                'cardClients': 'clients',
                'cardSuppliers': 'suppliers',
                'cardInventory': 'inventory',
                'cardVouchers': 'vouchers',
                'cardBanknote': 'banknote',
                'cardReports': 'reports',
                
                'sideTransactions': 'banknote',
                'sidePurchaseOrders': 'purchases',
                'sideInventoryMgmt': 'inventory',
                'sideSupplierList': 'suppliers',
                'sideCustomerList': 'clients',
                'sideSettings': 'settings',
                'sideSecurity': 'security',
                'labelSystem': 'settings',
                
                'bottomExpenses': 'banknote',
                'fabOrders': 'sales'
            };

            if (role !== 'admin') { 
                let visibleCardsCount = 0;
                if (role !== 'admin') { 
    let visibleCardsCount = 0;

    const vouchersCard = document.getElementById('cardVouchers');
    if (vouchersCard) vouchersCard.style.display = 'none';

    Object.keys(UI_Permissions_Map).forEach(elementId => {

                Object.keys(UI_Permissions_Map).forEach(elementId => {
                    const element = document.getElementById(elementId);
                    if (element) {
                        const requiredPermission = UI_Permissions_Map[elementId];
                        
                        if (userPermissions.includes(requiredPermission)) {
                            element.style.display = ''; 
                            if (elementId.startsWith('card')) {
                                visibleCardsCount++;
                            }
                        } else {
                            element.style.display = 'none'; 
                        }
                    }
                });

                // تفعيل التنسيق والترتيب الفاخر إذا كان عدد الكروت الظاهرة 3 أو أقل
                const dashboardContainer = document.getElementById('mainDashboard');
                if (dashboardContainer && visibleCardsCount <= 3) {
                    dashboardContainer.classList.add('restricted-layout');
                }
            }
        };
    </script>
</body>
</html>
