<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المصروفات - شركة الزيادي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --accent: #0b5e3d; --bg: #f8fafc; --danger: #ef4444; }
        body { background: var(--bg); font-family: 'Cairo', sans-serif; padding-bottom: 30px; }
        .header-nav { background: var(--accent); color: white; padding: 15px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1000; }
        .nav-tabs { border: none; background: white; margin: 15px; border-radius: 15px; padding: 5px; display: flex; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .nav-link { flex: 1; border: none !important; border-radius: 12px !important; color: #64748b; font-weight: 700; text-align: center; }
        .nav-link.active { background: var(--accent) !important; color: white !important; }
        .card-custom { background: white; border-radius: 25px; margin: 15px; padding: 20px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .input-group-custom { margin-bottom: 20px; }
        .label-custom { display: block; font-size: 0.85rem; color: #64748b; margin-bottom: 8px; font-weight: 700; }
        .input-field { width: 100%; padding: 12px 15px; border-radius: 15px; border: 1px solid #e2e8f0; background: #f8fafc; font-weight: 600; }
        .btn-save { background: var(--accent); color: white; width: 100%; border: none; padding: 15px; border-radius: 18px; font-weight: 800; }
        .expense-item { display: flex; align-items: center; justify-content: space-between; background: white; padding: 15px; border-radius: 20px; margin-bottom: 12px; border: 1px solid #f1f5f9; }
        .expense-amount { font-weight: 800; color: var(--danger); }
    </style>
</head>
<body>

<div class="header-nav">
    <div style="width: 20px;"></div>
    <h6 class="m-0 fw-bold">المصروفات</h6>
    <a href="index1.html" class="text-white"><i class="fas fa-chevron-left"></i></a>
</div>

<ul class="nav nav-tabs" id="expenseTabs" role="tablist">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#addContent" type="button">إضافة مصروف</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#listContent" type="button">المصروفات المسجلة</button></li>
</ul>

<div class="tab-content">
    <div class="tab-pane fade show active" id="addContent">
        <div class="card-custom">
            <div class="input-group-custom">
                <label class="label-custom">نوع المصروف</label>
                <!-- إضافة onchange لتبديل الحالة -->
                <select id="expType" class="input-field" onchange="toggleOtherField(this.value)">
                    <option value="إيجار">إيجار</option>
                    <option value="كهرباء/مياه">كهرباء / مياه</option>
                    <option value="رواتب">رواتب موظفين</option>
                    <option value="نثريات">نثريات / بوفيه</option>
                    <option value="أخرى">أخرى</option>
                </select>
            </div>

            <!-- الحقل الذي سيظهر عند اختيار أخرى -->
            <div id="otherTypeDiv" class="input-group-custom" style="display: none;">
                <label class="label-custom">اكتب نوع المصروف الجديد</label>
                <input type="text" id="otherTypeInput" class="input-field" placeholder="أدخل اسم المصروف هنا...">
            </div>

            <div class="row">
                <div class="col-6"><label class="label-custom">القيمة</label><input type="number" id="expAmount" class="input-field" placeholder="0.00"></div>
                <div class="col-6"><label class="label-custom">التاريخ</label><input type="date" id="expDate" class="input-field"></div>
            </div>

            <div class="input-group-custom mt-3">
                <label class="label-custom">ملاحظات</label>
                <textarea id="expNote" class="input-field" rows="3"></textarea>
            </div>

            <button class="btn-save" id="btnSave" onclick="saveExpense()">تأكيد وحفظ</button>
        </div>
    </div>
    <div class="tab-pane fade" id="listContent"><div id="expensesList" class="px-3"></div></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { /* ... بياناتك هنا ... */ };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // دالة إظهار/إخفاء الحقل
    window.toggleOtherField = (val) => {
        document.getElementById('otherTypeDiv').style.display = (val === 'أخرى') ? 'block' : 'none';
    };

    window.saveExpense = async () => {
        let type = document.getElementById('expType').value;
        const otherVal = document.getElementById('otherTypeInput').value;
        
        // إذا كان "أخرى" نعتمد القيمة من الحقل النصي
        if (type === 'أخرى') {
            if (!otherVal) return alert("يرجى كتابة نوع المصروف");
            type = otherVal;
        }

        const amt = parseFloat(document.getElementById('expAmount').value);
        const note = document.getElementById('expNote').value;
        const date = document.getElementById('expDate').value;

        if(!amt || amt <= 0) return alert("برجاء إدخال مبلغ صحيح");

        try {
            await addDoc(collection(db, "expenses"), { type, amount: amt, note, date, timestamp: serverTimestamp() });
            await addDoc(collection(db, "cash_logs"), { amount: amt, note: `مصروف: ${type}`, type: 'out', timestamp: serverTimestamp(), date: date });
            alert("تم الحفظ");
            location.reload();
        } catch (e) { alert("خطأ في الاتصال"); }
    };
    
    // ... باقي كود العرض والحذف كما هو ...
</script>
</body>
</html>
