<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الزيادي لزيوت السيارات | استعلام الأسعار السريع</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-green: #0b6641; /* نفس درجة الأخضر الخاصة بشركة الزيادي */
            --accent-green: #10b981;
            --body-bg: #f4f7f6;
            --text-dark: #2d3436;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--body-bg);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .search-container {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 35px 20px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
            position: relative;
        }

        .logo-area {
            color: var(--text-dark);
            margin-bottom: 25px;
        }

        .logo-area h1 {
            font-size: 24px;
            font-weight: 900;
            margin: 0 0 5px 0;
        }

        .logo-area h1 span {
            color: var(--primary-green);
        }

        .logo-area p {
            font-size: 13px;
            color: #94a3b8;
            margin: 0;
            font-weight: 600;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box input {
            width: 100%;
            padding: 16px 20px;
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
            font-weight: 700;
            border: 2px solid #e2e9e5;
            border-radius: 30px;
            outline: none;
            box-sizing: border-box;
            transition: 0.3s;
            text-align: center;
        }

        .search-box input:focus {
            border-color: var(--primary-green);
            box-shadow: 0 0 12px rgba(11, 102, 65, 0.15);
        }

        /* قائمة الاقتراحات التلقائية Autocomplete */
        .autocomplete-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #ffffff;
            border: 1px solid #e2e9e5;
            border-top: none;
            border-radius: 0 0 18px 18px;
            max-height: 240px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            display: none;
        }

        .autocomplete-item {
            padding: 14px 20px;
            text-align: right;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            color: var(--text-dark);
            border-bottom: 1px solid #f8f9fa;
            transition: 0.2s;
        }

        .autocomplete-item:hover {
            background-color: #f0fdf4;
            color: var(--primary-green);
        }

        /* صندوق السعر النهائي */
        .price-display {
            margin-top: 30px;
            padding: 25px 20px;
            border-radius: 20px;
            background: #f0fdf4;
            border: 2px dashed var(--accent-green);
            display: none;
            animation: slideUp 0.3s ease-out;
        }

        .price-display.active {
            display: block;
        }

        .price-title {
            font-size: 15px;
            color: var(--text-dark);
            font-weight: 700;
            margin-bottom: 8px;
        }

        .price-amount {
            font-size: 38px;
            font-weight: 900;
            color: var(--primary-green); 
        }

        /* مؤشر التحميل المتناسق */
        .loading-indicator {
            font-size: 12px;
            color: var(--primary-green);
            margin-bottom: 10px;
            font-weight: 700;
        }
        .loading-indicator i {
            animation: spin 1s linear infinite;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            100% { transform: rotate(-360deg); }
        }
    </style>
</head>
<body>

    <div class="search-container">
        <div class="logo-area">
            <h1>الزيادي <span>لزيوت السيارات</span></h1>
            <p>نظام الاستعلام السريع عن الأسعار للمندوبين</p>
        </div>

        <div id="loadingStatus" class="loading-indicator">
            <i class="fas fa-spinner"></i> جاري ربط وتحديث الأسعار من المخزن...
        </div>

        <div class="search-box">
            <input type="text" id="oilSearch" placeholder="ابحث باسم الزيت أو اللزوجة أو الباركود..." autocomplete="off" disabled>
            <div id="autocompleteList" class="autocomplete-list"></div>
        </div>

        <div id="priceDisplay" class="price-display">
            <div class="price-title" id="selectedItemName">--</div>
            <div class="price-amount" id="selectedItemPrice">0.00 ج.م</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // إعدادات الـ Firebase المتطابقة تماماً مع مشروعك
        const firebaseConfig = {
            apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
            authDomain: "ahmedelzaiady.firebaseapp.com",
            projectId: "ahmedelzaiady",
            storageBucket: "ahmedelzaiady.firebasestorage.app",
            messagingSenderId: "300306825071",
            appId: "1:300306825071:web:0426ddde56280fa090329a",
            measurementId: "G-WE04GK5XZZ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let inventoryData = [];

        const searchInput = document.getElementById('oilSearch');
        const autocompleteList = document.getElementById('autocompleteList');
        const priceDisplay = document.getElementById('priceDisplay');
        const selectedItemName = document.getElementById('selectedItemName');
        const selectedItemPrice = document.getElementById('selectedItemPrice');
        const loadingStatus = document.getElementById('loadingStatus');

        // جلب البيانات ومزامنتها حياً في الخلفية من Firebase
        onSnapshot(collection(db, "inventory"), (snap) => {
            inventoryData = [];
            snap.forEach(doc => {
                const data = doc.data();
                // جلب الأصناف غير المحذوفة فقط تماماً مثل صفحة المخزن
                if (!data.isDeleted) {
                    inventoryData.push({ id: doc.id, ...data });
                }
            });
            
            // تفعيل حقل الإدخال وتحديث حالة مؤشر التحميل
            searchInput.disabled = false;
            loadingStatus.innerHTML = '<i class="fas fa-check-circle"></i> المخزن متصل ومحدث الآن';
            loadingStatus.style.color = '#10b981';
        });

        // دالة الـ Autocomplete والبحث والفلترة الحية
        searchInput.addEventListener('input', function() {
            const query = this.value.trim().toLowerCase();
            autocompleteList.innerHTML = '';
            
            if (query === '') {
                autocompleteList.style.display = 'none';
                priceDisplay.classList.remove('active');
                return;
            }

            // فلترة بناء على الاسم أو الباركود
            const matches = inventoryData.filter(item => 
                (item.name && item.name.toLowerCase().includes(query)) || 
                (item.barcode && item.barcode.includes(query))
            );

            if (matches.length > 0) {
                matches.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'autocomplete-item';
                    div.innerText = item.name;
                    
                    // عند النقر فوق المقترح
                    div.addEventListener('click', function() {
                        searchInput.value = item.name;
                        autocompleteList.style.display = 'none';
                        
                        // صياغة وعرض السعر (حقل sell المعتمد في قاعدة بياناتك)
                        const rawPrice = Number(item.sell) || 0;
                        const formattedPrice = rawPrice.toLocaleString('en-US', {minimumFractionDigits: 2}) + ' ج.م';
                        
                        showPrice(item.name, formattedPrice);
                    });
                    
                    autocompleteList.appendChild(div);
                });
                autocompleteList.style.display = 'block';
            } else {
                autocompleteList.style.display = 'none';
                priceDisplay.classList.remove('active');
            }
        });

        function showPrice(name, price) {
            selectedItemName.innerText = name;
            selectedItemPrice.innerText = price;
            priceDisplay.classList.add('active');
        }

        // إغلاق الاقتراحات عند الضغط في أي مكان خارجها
        document.addEventListener('click', function(e) {
            if (e.target !== searchInput) {
                autocompleteList.style.display = 'none';
            }
        });
    </script>
</body>
</html>
