<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الزيادي لزيوت السيارات | استعلام الأسعار من المخزن</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #e67e22; /* البرتقالي المتناسق مع شعار الزيوت */
            --dark-bg: #2c3e50; 
            --body-bg: #f5f7fa;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--body-bg);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .search-container {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
        }

        .logo-area {
            color: var(--dark-bg);
            margin-bottom: 25px;
        }

        .logo-area h1 {
            font-size: 24px;
            font-weight: 900;
            margin: 0 0 5px 0;
        }

        .logo-area h1 span {
            color: var(--primary);
        }

        .logo-area p {
            font-size: 14px;
            color: #7f8c8d;
            margin: 0;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box input {
            width: 100%;
            padding: 15px 20px;
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
            font-weight: 700;
            border: 2px solid #e2e9e5;
            border-radius: 30px;
            outline: none;
            box-sizing: border-box;
            transition: 0.3s;
            text-align: center;
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(230, 126, 34, 0.2);
        }

        /* قائمة الاقتراحات التلقائية Autocomplete */
        .autocomplete-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #ffffff;
            border: 1px solid #e2e9e5;
            border-top: none;
            border-radius: 0 0 15px 15px;
            max-height: 220px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 8px 15px rgba(0,0,0,0.05);
            display: none;
        }

        .autocomplete-item {
            padding: 12px 20px;
            text-align: right;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            color: #34495e;
            border-bottom: 1px solid #f8f9fa;
            transition: 0.2s;
        }

        .autocomplete-item:hover {
            background-color: rgba(230, 126, 34, 0.08);
            color: var(--primary);
        }

        /* صندوق السعر النهائي المطور */
        .price-display {
            margin-top: 25px;
            padding: 25px 20px;
            border-radius: 15px;
            background: #fafbfc;
            border: 2px dashed var(--primary);
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        .price-display.active {
            display: block;
        }

        .price-title {
            font-size: 15px;
            color: #7f8c8d;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .price-amount {
            font-size: 36px;
            font-weight: 900;
            color: #2ecc71; /* الأخضر لتمييز السعر */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="search-container">
        <div class="logo-area">
            <h1>الزيادي <span>لزيوت السيارات</span></h1>
            <p>استعلام فوري مباشر من بيانات المخزن</p>
        </div>

        <div class="search-box">
            <input type="text" id="oilSearch" placeholder="اكتب صنف الزيت أو اللزوجة..." autocomplete="off">
            <div id="autocompleteList" class="autocomplete-list"></div>
        </div>

        <!-- صندوق عرض السعر المستدعى -->
        <div id="priceDisplay" class="price-display">
            <div class="price-title" id="selectedItemName">--</div>
            <div class="price-amount" id="selectedItemPrice">0 ج.م</div>
        </div>
    </div>

    <script>
        const searchInput = document.getElementById('oilSearch');
        const autocompleteList = document.getElementById('autocompleteList');
        const priceDisplay = document.getElementById('priceDisplay');
        const selectedItemName = document.getElementById('selectedItemName');
        const selectedItemPrice = document.getElementById('selectedItemPrice');

        // جلب المنتجات الحقيقية المخزنة في الـ LocalStorage
        function getWarehouseData() {
            // "sanad-products" هو المفتاح المعتاد الذي يحفظ الكود القديم المنتجات عليه
            // إذا لم يجد بيانات، يعود بمصفوفة فارغة لكي لا يتوقف الكود
            const storedProducts = localStorage.getItem('sanad-products') || localStorage.getItem('products');
            return storedProducts ? JSON.parse(storedProducts) : [];
        }

        // دالة تصفية المنتجات وظهور الـ Autocomplete عند الكتابة
        searchInput.addEventListener('input', function() {
            const query = this.value.trim().toLowerCase();
            autocompleteList.innerHTML = '';
            
            if (query === '') {
                autocompleteList.style.display = 'none';
                priceDisplay.classList.remove('active');
                return;
            }

            // سحب البيانات المحدثة من المخزن فوراً
            const currentDatabase = getWarehouseData();

            // تصفية المنتجات بناءً على مطابقة الاسم أو اللزوجة المكتوبة
            const matches = currentDatabase.filter(item => {
                const itemName = (item.name || item.title || '').toLowerCase();
                return itemName.includes(query);
            });

            if (matches.length > 0) {
                matches.forEach(item => {
                    const finalName = item.name || item.title;
                    const finalPrice = item.price ? `${item.price} ج.م` : 'غير محدد';

                    const div = document.createElement('div');
                    div.className = 'autocomplete-item';
                    div.innerText = finalName;
                    
                    // عند اختيار الصنف من قائمة الاقتراحات
                    div.addEventListener('click', function() {
                        searchInput.value = finalName;
                        autocompleteList.style.display = 'none';
                        
                        // عرض السعر النهائي فوراً
                        showPrice(finalName, finalPrice);
                    });
                    
                    autocompleteList.appendChild(div);
                });
                autocompleteList.style.display = 'block';
            } else {
                autocompleteList.style.display = 'none';
                priceDisplay.classList.remove('active');
            }
        });

        // دالة طباعة السعر باللون الأخضر داخل الصندوق
        function showPrice(name, price) {
            selectedItemName.innerText = name;
            selectedItemPrice.innerText = price;
            priceDisplay.classList.add('active');
        }

        // إغلاق قائمة الاقتراحات التلقائية إذا ضغط المستخدم خارج الخانة
        document.addEventListener('click', function(e) {
            if (e.target !== searchInput) {
                autocompleteList.style.display = 'none';
            }
        });
    </script>
</body>
</html>
