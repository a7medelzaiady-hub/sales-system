<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الزيادي لزيوت السيارات | رادار الأسعار الفوري</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-green: #0b6641;
            --neon-green: #10b981;
            --neon-glow: #00ffaa;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.4);
        }

        * {
            box-sizing: border-box;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #063c26 0%, #0b6641 50%, #1e293b 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* دوائر مضيئة متحركة في الخلفية لإعطاء عمق خرافي */
        body::before, body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
            opacity: 0.5;
        }
        body::before {
            width: 300px; height: 300px;
            background: var(--neon-glow);
            top: -50px; right: -50px;
            animation: float 6s ease-in-out infinite alternate;
        }
        body::after {
            width: 250px; height: 250px;
            background: #0ea5e9;
            bottom: -50px; left: -50px;
            animation: float 8s ease-in-out infinite alternate-reverse;
        }

        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(30px) scale(1.1); }
        }

        /* الحاوية الزجاجية الرئيسية */
        .premium-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            width: 100%;
            max-width: 480px;
            padding: 40px 30px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            text-align: center;
            z-index: 10;
            position: relative;
            transform: translateY(0);
        }

        .premium-card:hover {
            box-shadow: 0 30px 60px rgba(0, 255, 170, 0.15);
        }

        /* منطقة الشعار المبتكرة */
        .brand-header {
            margin-bottom: 35px;
        }

        .brand-icon-wrapper {
            width: 75px;
            height: 75px;
            background: linear-gradient(135deg, var(--primary-green), var(--neon-green));
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            box-shadow: 0 10px 20px rgba(11, 102, 65, 0.3);
            position: relative;
        }

        .brand-icon-wrapper i {
            font-size: 32px;
            color: #ffffff;
            animation: pulse 2s infinite;
        }

        .brand-header h1 {
            font-size: 26px;
            font-weight: 900;
            margin: 0;
            color: #0f172a;
            letter-spacing: -0.5px;
        }

        .brand-header h1 span {
            background: linear-gradient(to left, var(--primary-green), var(--neon-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-header p {
            font-size: 13px;
            color: #475569;
            margin: 5px 0 0;
            font-weight: 600;
        }

        /* صندوق البحث الذكي جداً */
        .search-engine {
            position: relative;
            width: 100%;
        }

        .search-engine input {
            width: 100%;
            padding: 18px 25px;
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
            font-weight: 700;
            border: 2px solid transparent;
            background: #ffffff;
            border-radius: 50px;
            outline: none;
            box-sizing: border-box;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02), 0 10px 20px rgba(0,0,0,0.05);
            color: #0f172a;
            text-align: center;
        }

        .search-engine input:focus {
            border-color: var(--neon-green);
            box-shadow: 0 0 0 5px rgba(16, 185, 129, 0.15), 0 15px 25px rgba(0,0,0,0.05);
        }

        /* قائمة الاقتراحات السلسة الفاخرة */
        .futuristic-list {
            position: absolute;
            top: calc(100% + 10px);
            left: 0; right: 0;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            max-height: 250px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            display: none;
            padding: 8px;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .futuristic-item {
            padding: 14px 18px;
            text-align: right;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            color: #334155;
            border-radius: 12px;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .futuristic-item i {
            color: var(--neon-green);
            font-size: 14px;
            opacity: 0.7;
        }

        .futuristic-item:hover {
            background: linear-gradient(135deg, #f0fdf4, #dcfce7);
            color: var(--primary-green);
            transform: translateX(-5px);
        }

        /* لوحة السعر السينمائية النيون */
        .cinema-price-panel {
            margin-top: 35px;
            padding: 30px 20px;
            border-radius: 24px;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            border: 2px solid var(--neon-green);
            box-shadow: 0 15px 30px rgba(11, 102, 65, 0.2);
            display: none;
            position: relative;
            overflow: hidden;
        }

        .cinema-price-panel::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(16, 185, 129, 0.1), transparent);
            transform: rotate(45deg);
            animation: shine 3s infinite linear;
        }

        .cinema-price-panel.active {
            display: block;
            animation: popUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .panel-item-name {
            font-size: 15px;
            color: #94a3b8;
            font-weight: 600;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .panel-price-number {
            font-size: 42px;
            font-weight: 900;
            color: var(--neon-glow);
            text-shadow: 0 0 15px rgba(0, 255, 170, 0.6);
            font-family: 'Cairo', sans-serif;
        }

        /* مؤشر التزامن الذكي */
        .sync-badge {
            font-size: 11px;
            font-weight: 700;
            color: var(--primary-green);
            background: rgba(11, 102, 65, 0.08);
            padding: 6px 16px;
            border-radius: 50px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
        }

        .sync-badge.ready {
            color: var(--neon-green);
            background: rgba(16, 185, 129, 0.1);
        }

        .sync-badge i.fa-spin-custom {
            animation: spin 1s infinite linear;
        }

        @keyframes popUp {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes shine {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes spin { 100% { transform: rotate(-360deg); } }
    </style>
</head>
<body>

    <div class="premium-card">
        <div class="brand-header">
            <div class="brand-icon-wrapper">
                <i class="fas fa-bolt"></i>
            </div>
            <h1>الزيادي <span>لرادار الأسعار</span></h1>
            <p>ابحث عن السعر فوراً بلمسة وحدة</p>
        </div>

        <div id="syncBadge" class="sync-badge">
            <i class="fas fa-circle-notch fa-spin-custom"></i> جاري مزامنة رادار الأسعار حياً...
        </div>

        <div class="search-engine">
            <input type="text" id="oilSearch" placeholder="اكتب صنف الزيت، اللزوجة، أو الباركود..." autocomplete="off" disabled>
            <div id="autocompleteList" class="futuristic-list"></div>
        </div>

        <div id="priceDisplay" class="cinema-price-panel">
            <div class="panel-item-name" id="selectedItemName">--</div>
            <div class="panel-price-number" id="selectedItemPrice">0.00 ج.م</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
            authDomain: "ahmedelzaiady.firebaseapp.com",
            projectId: "ahmedelzaiady",
            storageBucket: "ahmedelzaiady.firebasestorage.app",
            messagingSenderId: "300306825071",
            appId: "1:300306825071:web:0426ddde56280fa090329a",
            measurementId: "G-WE04GK5XZZ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let inventoryData = [];

        const searchInput = document.getElementById('oilSearch');
        const autocompleteList = document.getElementById('autocompleteList');
        const priceDisplay = document.getElementById('priceDisplay');
        const selectedItemName = document.getElementById('selectedItemName');
        const selectedItemPrice = document.getElementById('selectedItemPrice');
        const syncBadge = document.getElementById('syncBadge');

        // سحب وتحديث حقيقي للبيانات فورا من السحابة
        onSnapshot(collection(db, "inventory"), (snap) => {
            inventoryData = [];
            snap.forEach(doc => {
                const data = doc.data();
                if (!data.isDeleted) {
                    inventoryData.push({ id: doc.id, ...data });
                }
            });
            
            // تحديث مؤشر الاتصال ليعطي انطباع القوة والجاهزية
            searchInput.disabled = false;
            syncBadge.className = "sync-badge ready";
            syncBadge.innerHTML = '<i class="fas fa-bolt-lightning"></i> الرادار متصل وجاهز للعمل فوراُ';
        });

        // محرك البحث التلقائي الفاخر
        searchInput.addEventListener('input', function() {
            const query = this.value.trim().toLowerCase();
            autocompleteList.innerHTML = '';
            
            if (query === '') {
                autocompleteList.style.display = 'none';
                priceDisplay.classList.remove('active');
                return;
            }

            const matches = inventoryData.filter(item => 
                (item.name && item.name.toLowerCase().includes(query)) || 
                (item.barcode && item.barcode.includes(query))
            );

            if (matches.length > 0) {
                matches.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'futuristic-item';
                    div.innerHTML = `<i class="fas fa-oil-can"></i> ${item.name}`;
                    
                    div.addEventListener('click', function() {
                        searchInput.value = item.name;
                        autocompleteList.style.display = 'none';
                        
                        // معالجة السعر وعرضه داخل الشاشة النيون السوداء
                        const rawPrice = Number(item.sell) || 0;
                        const formattedPrice = rawPrice.toLocaleString('en-US', {minimumFractionDigits: 2}) + ' ج.م';
                        
                        showPrice(item.name, formattedPrice);
                    });
                    
                    autocompleteList.appendChild(div);
                });
                autocompleteList.style.display = 'block';
            } else {
                autocompleteList.style.display = 'none';
                priceDisplay.classList.remove('active');
            }
        });

        function showPrice(name, price) {
            selectedItemName.innerText = name;
            selectedItemPrice.innerText = price;
            priceDisplay.classList.add('active');
        }

        // إخفاء القائمة عند النقر خارج نطاق محرك البحث
        document.addEventListener('click', function(e) {
            if (e.target !== searchInput) {
                autocompleteList.style.display = 'none';
            }
        });
    </script>
</body>
</html>
