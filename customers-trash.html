
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>سلة العملاء - شركة الزيادي</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root{
    --accent:#0b5e3d;
    --bg:#f4f7f6;
    --white:#fff;
    --border:#dce3de;
    --danger:#dc3545;
    --success:#28a745;
    --text:#1b2e26;
}

body{
    background:var(--bg);
    font-family:'Cairo',sans-serif;
    color:var(--text);
}

.header{
    background:var(--accent);
    color:#fff;
    padding:15px;
    position:sticky;
    top:0;
    z-index:999;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.customer-card{
    background:var(--white);
    border-radius:18px;
    padding:16px;
    margin-bottom:12px;
    border:1px solid var(--border);
    box-shadow:0 3px 8px rgba(0,0,0,.03);
}

.customer-name{
    font-weight:800;
    margin:0;
    font-size:1rem;
}

.customer-phone{
    font-size:.8rem;
    color:#777;
    margin-top:3px;
}

.deleted-date{
    font-size:.75rem;
    color:#999;
    margin-top:8px;
}

.action-buttons{
    display:flex;
    gap:10px;
    margin-top:14px;
}

.btn-action{
    flex:1;
    border:none;
    border-radius:12px;
    padding:10px;
    font-weight:700;
    font-size:.85rem;
    color:#fff;
}

.btn-restore{
    background:var(--success);
}

.btn-delete{
    background:var(--danger);
}

.empty-box{
    text-align:center;
    padding:80px 20px;
    opacity:.5;
    font-weight:700;
}
</style>
</head>
<body>

<div class="header">
    <div class="container d-flex justify-content-between align-items-center">
        <a href="customer-list.html" class="text-white">
            <i class="fas fa-arrow-right"></i>
        </a>

        <h5 class="m-0 fw-bold">
            <i class="fas fa-trash-alt me-2"></i>
            سلة العملاء
        </h5>

        <div class="d-flex gap-2">

    <a href="index.html" class="text-white">
        <i class="fas fa-home"></i>
    </a>

</div>
    </div>
</div>

<div class="container py-3" id="trashContainer">

    <div class="text-center py-5">
        <div class="spinner-border text-success"></div>
        <p class="mt-3 small fw-bold">
            جاري تحميل العملاء المحذوفين...
        </p>
    </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs,
    query,
    orderBy,
    doc,
    setDoc,
    deleteDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";


const firebaseConfig = {

  apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
  authDomain: "ahmedelzaiady.firebaseapp.com",
  projectId: "ahmedelzaiady",
  storageBucket: "ahmedelzaiady.firebasestorage.app",
  messagingSenderId: "300306825071",
  appId: "1:300306825071:web:0426ddde56280fa090329a",
  measurementId: "G-WE04GK5XZZ"

};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let deletedCustomers = [];

async function loadDeletedCustomers(){

    const container = document.getElementById("trashContainer");

    try{

        const q = query(
            query(
  collection(db,"customers"),
  where("isDeleted","==",true)
)
            orderBy("deletedAt","desc")
        );

        const snap = await getDocs(q);

        deletedCustomers = snap.docs.map(docu => ({
            id: docu.id,
            ...docu.data()
        }));


        if(deletedCustomers.length === 0){

            container.innerHTML = `
                <div class="empty-box">
                    <i class="fas fa-trash-alt mb-3" style="font-size:40px"></i>
                    <div>لا يوجد عملاء داخل السلة</div>
                </div>
            `;

            return;
        }

        container.innerHTML = deletedCustomers.map(cust => `

            <div class="customer-card">

                <h6 class="customer-name">
                    ${cust.name || 'بدون اسم'}
                </h6>

                <div class="customer-phone">
                    <i class="fas fa-phone-alt me-1"></i>
                    ${cust.phone || 'بدون هاتف'}
                </div>

                <div class="deleted-date">
                    <i class="fas fa-clock me-1"></i>
                    عميل محذوف
                </div>

                <div class="action-buttons">

                    <button class="btn-action btn-restore"
                        onclick="restoreCustomer('${cust.id}')">

                        <i class="fas fa-rotate-left me-1"></i>
                        استرجاع

                    </button>

                    <button class="btn-action btn-delete"
                        onclick="permanentDelete('${cust.id}')">

                        <i class="fas fa-trash me-1"></i>
                        حذف نهائي

                    </button>

                </div>

            </div>

        `).join("");

    }catch(e){

        console.error(e);

        container.innerHTML = `
            <div class="alert alert-danger text-center">
                حدث خطأ أثناء تحميل السلة
            </div>
        `;
    }
}



window.restoreCustomer = async(id)=>{

    if(!confirm("استرجاع العميل مرة أخرى؟")) return;

    try{

        const customer = deletedCustomers.find(c=>c.id===id);

        if(!customer) return;

        const restoredData = {...customer};

        delete restoredData.deletedAt;
        delete restoredData.originalId;

        await setDoc(
            doc(db,"customers",id),
            restoredData
        );

        await deleteDoc(
            doc(db,"deleted_customers",id)
        );

        alert("تم استرجاع العميل بنجاح");

        loadDeletedCustomers();

    }catch(e){

        console.error(e);

        alert("حدث خطأ أثناء الاسترجاع");

    }

};



window.permanentDelete = async(id)=>{

    const confirmDelete = confirm(
        "⚠️ سيتم حذف العميل نهائياً ولا يمكن استرجاعه بعد ذلك"
    );

    if(!confirmDelete) return;

    try{

        await deleteDoc(
            doc(db,"deleted_customers",id)
        );

        alert("تم حذف العميل نهائياً");

        loadDeletedCustomers();

    }catch(e){

        console.error(e);

        alert("حدث خطأ أثناء الحذف");

    }

};


loadDeletedCustomers();

</script>

</body>
</html>
