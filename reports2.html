<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تقرير حركة البضاعة — الزيادي</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--g8:#0b4e33;--g7:#0f6e48;--g6:#16a34a;--g1:#dcfce7;--g0:#f0fdf4;--a7:#b45309;--a1:#fef3c7;--a0:#fffbeb;--r7:#b91c1c;--r1:#fee2e2;--r0:#fef2f2;--s9:#0f172a;--s7:#334155;--s5:#64748b;--s3:#cbd5e1;--s1:#f1f5f9;--wh:#fff;}
body{background:#e8edea;font-family:'Cairo',sans-serif;color:var(--s9);font-size:.88rem;padding-bottom:60px;}

/* ══ Styles (Keep existing) ══ */
.topbar{background:var(--g8);height:56px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:300;box-shadow:0 2px 12px rgba(5,46,22,.4);}
.tbl-card{margin:0 8px 12px;background:var(--wh);border-radius:12px;border:1px solid #d0ddd6;box-shadow:0 3px 12px rgba(0,0,0,.06);overflow-x:auto;}
table.inv{width:100%;border-collapse:separate;border-spacing:0;font-size:.78rem;}
table.inv tbody tr{cursor:pointer; transition:background .2s;}
table.inv tbody tr:hover{background:#f5faf7 !important;}
.nm-cell{display:flex;align-items:center;}
.rn{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--s1);color:var(--s5);font-size:.58rem;font-weight:700;margin-left:6px;}

/* ══ Modal Styles ══ */
.modal-header{background:var(--g8);color:#fff;border-radius:12px 12px 0 0;}
.modal-content{border-radius:15px;border:none;}
.badge-type{padding:3px 8px;border-radius:6px;font-size:0.7rem;font-weight:bold;}
</style>
</head>
<body>

<div class="tbl-card">
  <table class="inv">
    <thead>
      <tr>
        <th>الصنف (اضغط للتفاصيل)</th>
        <th class="hs">↑ مبيعات</th>
        <th class="hp">↓ مشتريات</th>
        <th class="hr">↺ مرتجع</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<div class="modal fade" id="detailModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="mTitle">تفاصيل الصنف</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-0">
        <table class="table table-hover mb-0">
          <thead class="table-light"><tr><th>التاريخ</th><th>النوع</th><th>الكمية</th></tr></thead>
          <tbody id="mBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// ... (إعداد Firebase كما هو) ...

let inventoryData = {}; // سنخزن البيانات هنا

// تعديل دالة add لتسجيل تفاصيل كل حركة
function addDetail(name, cart, qty, type, date) {
  if (!inventoryData[name]) {
    inventoryData[name] = { sJ:0, sC:0, pJ:0, pC:0, rJ:0, rC:0, details: [] };
  }
  inventoryData[name].details.push({ date, type, qty, unit: cart ? "كرتونة" : "جركن" });
  
  const k = (type === 's' ? 's' : (type === 'p' ? 'p' : 'r')) + (cart ? 'C' : 'J');
  inventoryData[name][k] += qty;
}

// عرض المودال
window.showDetails = function(name) {
  const item = inventoryData[name];
  document.getElementById('mTitle').textContent = "حركات: " + name;
  const tbody = document.getElementById('mBody');
  tbody.innerHTML = item.details.map(d => `
    <tr>
      <td>${d.date}</td>
      <td><span class="badge-type ${d.type === 's' ? 'bg-success text-white' : (d.type === 'p' ? 'bg-warning text-dark' : 'bg-danger text-white')}">
        ${d.type === 's' ? 'مبيعات' : (d.type === 'p' ? 'مشتريات' : 'مرتجع')}
      </span></td>
      <td>${d.qty} ${d.unit}</td>
    </tr>
  `).join('');
  new bootstrap.Modal(document.getElementById('detailModal')).show();
};

async function load() {
  const date = document.getElementById("dateIn").value;
  inventoryData = {};
  
  // (هنا تقوم بجلب البيانات من الفايربيس واستخدام دالة addDetail بدلاً من الدالة السابقة)
  // مثال:
  // sSnap.forEach(doc => { ... addDetail(name, cart, qty, 's', date) ... });
  
  // بعد تجميع البيانات، نعرض الجدول:
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = Object.keys(inventoryData).sort().map((name, i) => {
    const d = inventoryData[name];
    return `
      <tr onclick="showDetails('${name}')">
        <td><div class="nm-cell"><span class="rn">${i+1}</span>${name}</div></td>
        <td class="cs">${d.sJ} ج / ${d.sC} ك</td>
        <td class="cp">${d.pJ} ج / ${d.pC} ك</td>
        <td class="cr">${d.rJ} ج / ${d.rC} ك</td>
      </tr>
    `;
  }).join('');
}
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
